name: Yen carry monitor heartbeat bridge

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/yen-carry-monitor-bridge.yml"
  workflow_run:
    workflows:
      - "Yen carry unwind Telegram alert"
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: yen-carry-monitor-heartbeat-bridge
  cancel-in-progress: true

jobs:
  fanout:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch current-versus-recent FX shock monitor
        run: |
          gh workflow run yen-carry-recent-shock.yml \
            --repo "${{ github.repository }}" \
            --ref main

      - name: Record heartbeat bridge status
        run: |
          echo "엔캐리 5분 핵심 감시 완료 이벤트를 최근 90분 충격 감시로 전달했습니다." >> "$GITHUB_STEP_SUMMARY"
          echo "엔캐리 복합 감시는 확정 본경로 yen-carry-composite-alert.yml의 :06/:21/:36/:51 예약과 수동 실행만 사용합니다." >> "$GITHUB_STEP_SUMMARY"
