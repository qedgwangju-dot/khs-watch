name: Kiwoom Market Flow Source CI

on:
  pull_request:
    paths:
      - "scripts/market_kiwoom_flow.py"
      - "scripts/market_namuh_flow.py"
      - "scripts/probe_market_namuh_flow.py"
      - "scripts/probe_market_kiwoom_flow.py"
      - "scripts/test_market_kiwoom_flow.py"
      - "scripts/test_fixtures/kiwoom_cash_readback_20261020.json"
      - "scripts/kospi_shock_episode_watch.py"
      - "scripts/market_flow_channels.py"
      - "scripts/kospi_rapid_fallback_watch.py"
      - ".github/workflows/market-kiwoom-flow-ci.yml"
      - ".github/workflows/kospi-derivatives-flow-ls-realtime.yml"
  push:
    branches: [main]
    paths:
      - "scripts/market_kiwoom_flow.py"
      - "scripts/market_namuh_flow.py"
      - "scripts/probe_market_namuh_flow.py"
      - "scripts/probe_market_kiwoom_flow.py"
      - "scripts/test_market_kiwoom_flow.py"
      - "scripts/test_fixtures/kiwoom_cash_readback_20261020.json"
      - "scripts/kospi_shock_episode_watch.py"
      - "scripts/market_flow_channels.py"
      - "scripts/kospi_rapid_fallback_watch.py"
      - ".github/workflows/market-kiwoom-flow-ci.yml"
      - ".github/workflows/kospi-derivatives-flow-ls-realtime.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MARKET_SOURCE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet requests exchange_calendars pyyaml
      - name: Source boundaries and existing alert contracts
        run: |
          python -m py_compile scripts/market_kiwoom_flow.py scripts/probe_market_kiwoom_flow.py scripts/kospi_shock_episode_watch.py
          python scripts/test_market_kiwoom_flow.py
          python scripts/test_market_close_pair.py
          python scripts/test_market_program_close.py
          python scripts/test_market_alert_delivery.py
          python scripts/test_kospi_shock_episode.py
          python scripts/test_kospi_shock_enrichment.py
          python scripts/test_kospi_flow_attribution_strict.py
          python scripts/test_kosdaq_surge_industries.py
          python scripts/test_market_flow_channels.py
          python scripts/test_market_investment_trust.py

  read_only_source:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KIWOOM_APPKEY: ${{ secrets.KIWOOM_APPKEY }}
      KIWOOM_SECRETKEY: ${{ secrets.KIWOOM_SECRETKEY }}
      NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
      NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet requests cryptography
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/khs-watch-namuh
          key: nhplug-token-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nhplug-token-v1-${{ runner.os }}-
      - name: Read exact market sources without messages or state
        run: |
          if [ -n "$NHPLUG_APP_KEY" ] && [ -n "$NHPLUG_APP_SECRET" ]; then
            python scripts/probe_market_namuh_flow.py
          else
            python scripts/probe_market_kiwoom_flow.py
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/khs-watch-namuh
          key: nhplug-token-v1-${{ runner.os }}-${{ github.run_id }}
      - name: Preserve original market responses and coverage limits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwoom-market-source-${{ github.run_id }}
          path: |
            out/market_source_evidence/
            out/market_kiwoom_source_probe.json
            out/market_namuh_source_probe.json
          retention-days: 7
