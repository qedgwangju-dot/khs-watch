name: ROBOTIS Physical AI Telegram Watch

on:
  push:
    paths:
      - ".github/robotis-physical-ai-trigger.txt"
  schedule:
    - cron: "11 * * * *"
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      force_summary:
        description: "Send current high-signal summary even if already seen"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: robotis-physical-ai-telegram-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.ROBOTIS_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.DATA_CENTER_TELEGRAM_CHAT_ID }}
      FORCE_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_summary && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply push-trigger options
        if: github.event_name == 'push'
        shell: bash
        run: |
          value="$(awk -F= '$1=="force_summary" {print tolower($2)}' .github/robotis-physical-ai-trigger.txt | tail -n 1 | tr -d '[:space:]')"
          case "$value" in
            1|true|yes|on)
              echo "FORCE_SUMMARY=1" >> "$GITHUB_ENV"
              echo "Push trigger force summary: ON"
              ;;
            *)
              echo "FORCE_SUMMARY=0" >> "$GITHUB_ENV"
              echo "Push trigger force summary: OFF"
              ;;
          esac

      - name: Reactivate KHS policy watch once
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flag="$(awk -F= '$1=="reactivate_khs_policy" {print tolower($2)}' .github/robotis-physical-ai-trigger.txt | tail -n 1 | tr -d '[:space:]')"
          if [ "$flag" = "true" ] || [ "$flag" = "1" ] || [ "$flag" = "yes" ] || [ "$flag" = "on" ]; then
            gh api -X PUT "/repos/${GITHUB_REPOSITORY}/actions/workflows/khs-policy-watch.yml/enable"
            gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/khs-policy-watch.yml/dispatches" -f ref=main
            echo "khs_policy_reactivate_and_dispatch=confirmed"
          else
            echo "khs_policy_reactivate_and_dispatch=skipped"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Telegram route
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token:
              raise SystemExit("ROBOTIS_TELEGRAM_BOT_TOKEN is missing")
          if not chat:
              raise SystemExit("DATA_CENTER_TELEGRAM_CHAT_ID is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=20) as r:
              data = json.loads(r.read().decode())
          if not data.get("ok"):
              raise SystemExit("Telegram getMe failed")
          username = data["result"].get("username", "")
          expected = "khs8879008879000088790000_bot"
          if username.lower() != expected.lower():
              raise SystemExit(f"Wrong Telegram bot: @{username}; expected @{expected}")
          print(f"Telegram route OK: @{username}")
          PY

      - name: Run alert-quality regression guards
        run: |
          python scripts/physical_ai_watch_regression_check.py
          python -m unittest discover -s tests -p 'test_hbm_currency_krw_guard.py'

      - name: Scan physical AI / battery / grid / ROBOTIS-NVIDIA / Figure AI / Tesla Optimus China / AI-RAN sources
        run: python scripts/physical_ai_watch_airan_guard.py

      - name: Enforce immediate KRW conversion for all Telegram foreign amounts
        if: success() && hashFiles('out/robotis_physical_ai_watch_telegram.txt') != ''
        run: |
          python scripts/currency_krw_guard.py out/robotis_physical_ai_watch_telegram.txt

      - name: Send Telegram only on meaningful change
        if: success()
        run: |
          if [ -s out/robotis_physical_ai_watch_telegram.txt ]; then
            python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat = os.environ["TELEGRAM_CHAT_ID"].strip()
          text = pathlib.Path("out/robotis_physical_ai_watch_telegram.txt").read_text(encoding="utf-8").strip()

          chunks, cur = [], ""
          for line in text.splitlines(True):
              if cur and len(cur) + len(line) > 3500:
                  chunks.append(cur.rstrip())
                  cur = ""
              cur += line
          if cur.strip():
              chunks.append(cur.rstrip())

          for chunk in chunks:
              payload = urllib.parse.urlencode({
                  "chat_id": chat,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read().decode())
              if not data.get("ok"):
                  raise SystemExit("Telegram API returned ok=false")
              reply = data.get("result") or {}
              reply_chat = reply.get("chat") or {}
              reply_id = reply_chat.get("id")
              if reply_id is None:
                  raise SystemExit("Telegram success reply missing chat.id")
              # Do not expose private numeric chat IDs in public Actions logs.
              if chat.lstrip("-").isdigit():
                  if str(reply_id) != chat:
                      raise SystemExit("Telegram recipient mismatch (IDs redacted)")
                  print("Telegram recipient: configured numeric chat matches API reply")
              elif chat.startswith("@") and reply_chat.get("username"):
                  if reply_chat["username"].casefold() != chat[1:].casefold():
                      raise SystemExit("Telegram recipient username mismatch")
                  print("Telegram recipient: configured alias matches API reply")
              else:
                  print("Telegram recipient: reply chat.id present; alias comparison unverified")
              message_id = reply.get("message_id")
              if not isinstance(message_id, int) or message_id <= 0:
                  raise SystemExit("Telegram success reply missing valid message_id")
              print(f"Telegram sent: message_id={message_id}")
          PY
          else
            echo "No meaningful new physical-AI/battery/grid/ROBOTIS-NVIDIA/Figure-AI/Tesla-Optimus-China change; Telegram silent."
          fi

      - name: Save dedup state after successful route/send
        if: success()
        run: |
          set -euo pipefail
          mkdir -p data
          # Preserve only the finalized state. Rebase of a state-file commit
          # conflicts when other scheduled watchers have advanced main.
          cp out/robotis_physical_ai_watch_pending_state.json /tmp/robotis_watch_final_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/robotis_watch_final_state.json data/robotis_physical_ai_watch_state.json
            git add data/robotis_physical_ai_watch_state.json
            if git diff --cached --quiet; then
              echo "ROBOTIS state already current."
              pushed=1
              break
            fi
            git commit -m "Update ROBOTIS physical AI watch state [skip ci]"
            if git push origin HEAD:main; then
              echo "ROBOTIS state persisted to main."
              pushed=1
              break
            fi
            echo "ROBOTIS state push race; latest-main replay attempt $attempt/5."
            sleep $((attempt * 2))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "ROBOTIS finalized state not persisted after 5 attempts." >&2
            exit 1
          fi

      - name: Upload watcher status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robotis-physical-ai-${{ github.run_id }}
          path: |
            out/robotis_physical_ai_watch_status.md
            out/robotis_physical_ai_watch_telegram.txt
            out/robotis_physical_ai_watch_pending_state.json
          if-no-files-found: ignore
          retention-days: 7
