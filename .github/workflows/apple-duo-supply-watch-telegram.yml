name: Apple Duo Production Supply Telegram Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apple-duo-supply-watch-telegram.yml"
      - "scripts/apple_duo_supply_watch.py"
      - "scripts/apple_duo_panel_leading_watch.py"
      - "scripts/apple_duo_demand_competition_watch.py"
      - "data/apple_duo_supply_watch_state.json"
      - "data/apple_duo_panel_leading_state.json"
      - "data/apple_duo_demand_competition_state.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send latest Apple Duo supply-chain item as a Telegram smoke test"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: apple-duo-supply-watch-telegram
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs88798879887988798879_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate watcher
        run: |
          python -m py_compile scripts/apple_duo_supply_watch.py
          python -m py_compile scripts/apple_duo_panel_leading_watch.py
          python -m py_compile scripts/apple_duo_demand_competition_watch.py

      - name: Validate Telegram route without sending
        env:
          TELEGRAM_BOT_TOKEN_PRIMARY: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.HBM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = (os.getenv("TELEGRAM_BOT_TOKEN_PRIMARY") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("Telegram bot token is missing: HBM_TELEGRAM_BOT_TOKEN")
          if not chat_id:
              raise RuntimeError("Telegram chat id is missing: HBM_TELEGRAM_CHAT_ID")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          query = urllib.parse.urlencode({"chat_id": chat_id})
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getChat?{query}", timeout=25) as response:
              chat = json.loads(response.read().decode("utf-8"))
          result = chat.get("result") or {}
          if not chat.get("ok") or result.get("id") is None:
              raise RuntimeError("HBM_TELEGRAM_CHAT_ID is unreachable")

          print(
              "telegram_route_valid=true "
              f"bot=@{username} chat_type={result.get('type', 'unknown')}"
          )
          PY

      - name: Scan Apple Duo production and supply-chain signals
        env:
          FORCE_NOTIFY: ${{ inputs.force_notify }}
        run: python scripts/apple_duo_supply_watch.py

      - name: Scan panel leading indicators
        run: python scripts/apple_duo_panel_leading_watch.py

      - name: Scan demand and competitor leading indicators
        run: python scripts/apple_duo_demand_competition_watch.py

      - name: Publish watcher summary
        if: always()
        run: |
          if [ -f out/apple_duo_supply_watch_status.md ]; then
            cat out/apple_duo_supply_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Apple Duo 감시 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/apple_duo_panel_leading_status.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/apple_duo_panel_leading_status.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/apple_duo_demand_competition_status.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/apple_duo_demand_competition_status.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/apple_duo_supply_watch_telegram.txt ]; then
            printf '\n---\n\nTelegram 알림 미리보기:\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/apple_duo_supply_watch_telegram.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send meaningful Apple Duo change to Telegram
        if: hashFiles('out/apple_duo_supply_watch_telegram.txt') != ''
        env:
          TELEGRAM_BOT_TOKEN_PRIMARY: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.HBM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN_PRIMARY") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("Telegram bot token is missing: HBM_TELEGRAM_BOT_TOKEN")
          if not chat_id:
              raise RuntimeError("Telegram chat id is missing: HBM_TELEGRAM_CHAT_ID")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          text = pathlib.Path("out/apple_duo_supply_watch_telegram.txt").read_text(encoding="utf-8").strip()
          if not text:
              raise RuntimeError("Telegram alert is empty")

          def split_message(value, limit=3900):
              chunks, current = [], ""
              for line in value.splitlines():
                  candidate = line if not current else current + "\n" + line
                  if len(candidate) <= limit:
                      current = candidate
                  else:
                      if current:
                          chunks.append(current)
                      current = line
              if current:
                  chunks.append(current)
              return chunks

          ids = []
          for chunk in split_message(text):
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              ids.append((result.get("result") or {}).get("message_id"))

          confirmed = {
              "status": "confirmed",
              "bot_username": username,
              "message_ids": ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/apple_duo_supply_watch_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"telegram_delivery_confirmed=true bot=@{username} message_ids={ids}")
          PY

      - name: Persist no-alert scan state
        if: success() && hashFiles('out/apple_duo_supply_watch_telegram.txt') == '' && hashFiles('out/apple_duo_supply_watch_pending_state.json') != ''
        run: cp out/apple_duo_supply_watch_pending_state.json data/apple_duo_supply_watch_state.json

      - name: Persist no-alert panel-leading state
        if: success() && hashFiles('out/apple_duo_supply_watch_telegram.txt') == '' && hashFiles('out/apple_duo_panel_leading_pending_state.json') != ''
        run: cp out/apple_duo_panel_leading_pending_state.json data/apple_duo_panel_leading_state.json

      - name: Persist no-alert demand-competition state
        if: success() && hashFiles('out/apple_duo_supply_watch_telegram.txt') == '' && hashFiles('out/apple_duo_demand_competition_pending_state.json') != ''
        run: cp out/apple_duo_demand_competition_pending_state.json data/apple_duo_demand_competition_state.json

      - name: Persist state only after confirmed Telegram delivery
        if: success() && hashFiles('out/apple_duo_supply_watch_telegram.txt') != '' && hashFiles('out/apple_duo_supply_watch_telegram_confirmed.json') != '' && hashFiles('out/apple_duo_supply_watch_pending_state.json') != ''
        run: cp out/apple_duo_supply_watch_pending_state.json data/apple_duo_supply_watch_state.json

      - name: Persist panel-leading state only after confirmed Telegram delivery
        if: success() && hashFiles('out/apple_duo_supply_watch_telegram.txt') != '' && hashFiles('out/apple_duo_supply_watch_telegram_confirmed.json') != '' && hashFiles('out/apple_duo_panel_leading_pending_state.json') != ''
        run: cp out/apple_duo_panel_leading_pending_state.json data/apple_duo_panel_leading_state.json

      - name: Persist demand-competition state only after confirmed Telegram delivery
        if: success() && hashFiles('out/apple_duo_supply_watch_telegram.txt') != '' && hashFiles('out/apple_duo_supply_watch_telegram_confirmed.json') != '' && hashFiles('out/apple_duo_demand_competition_pending_state.json') != ''
        run: cp out/apple_duo_demand_competition_pending_state.json data/apple_duo_demand_competition_state.json

      - name: Commit watcher state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apple_duo_supply_watch_state.json data/apple_duo_panel_leading_state.json data/apple_duo_demand_competition_state.json
          if git diff --cached --quiet; then
            echo "Apple Duo watch state unchanged"
          else
            git commit -m "Update Apple Duo supply watch state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-duo-supply-watch-${{ github.run_id }}
          path: |
            out/apple_duo_supply_watch_status.md
            out/apple_duo_panel_leading_status.md
            out/apple_duo_demand_competition_status.md
            out/apple_duo_demand_competition_alert.html
            out/apple_duo_supply_watch_telegram.txt
            out/apple_duo_supply_watch_pending_state.json
            out/apple_duo_panel_leading_pending_state.json
            out/apple_duo_demand_competition_pending_state.json
            out/apple_duo_supply_watch_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
