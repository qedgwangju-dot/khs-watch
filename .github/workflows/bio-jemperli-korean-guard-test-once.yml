name: Bio Jemperli Korean Guard Test Once

on:
  push:
    paths:
      - ".github/workflows/bio-jemperli-korean-guard-test-once.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Korean-first display and dedupe migration
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'scripts')
          import jemperli_altb4_watch_v2 as j
          from bio_korean_guard_strict_v2 import ensure_korean_text

          j.migrate_state_once()
          sample = 'GSK Jemperli sBLA FDA EMA PDUFA Project Orbis'
          rendered = ensure_korean_text(sample)
          required = [
              '추가 생물학적 제제 허가 신청(sBLA)',
              '미국 식품의약국(FDA)',
              '유럽의약품청(EMA)',
              '허가 결정 예정일(PDUFA)',
              '국제 공동심사 프로그램(Project Orbis)',
          ]
          missing = [x for x in required if x not in rendered]
          if missing:
              raise RuntimeError('Korean-first guard missing: ' + ', '.join(missing))

          state = json.loads(pathlib.Path('data/jemperli_altb4_watch_state.json').read_text(encoding='utf-8'))
          if int(state.get('dedupe_version') or 0) < 2:
              raise RuntimeError('Jemperli dedupe migration failed')
          if j.CURRENT_EVENT_KEY not in set(state.get('seen_event_keys') or []):
              raise RuntimeError('Current rectal priority-review event key not seeded')

          pathlib.Path('data/jemperli_korean_guard_test.json').write_text(
              json.dumps({
                  'status': 'confirmed',
                  'rendered': rendered,
                  'dedupe_version': state.get('dedupe_version'),
                  'current_event_key_seeded': True,
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(rendered)
          PY

      - name: Commit verification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jemperli_altb4_watch_state.json data/jemperli_korean_guard_test.json
          git commit -m "Confirm Jemperli Korean-first guard"
          git pull --rebase origin main
          git push
