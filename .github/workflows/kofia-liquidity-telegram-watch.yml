name: KOFIA Liquidity Telegram Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kofia-liquidity-telegram-watch.yml"
      - "scripts/kofia_liquidity_watch.js"
  schedule:
    # KST 직접 지정. 새 공식값/수정치가 없으면 Telegram은 보내지 않는다.
    - cron: "5,20,40 7 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "5 8-13 * * 1-5"
      timezone: "Asia/Seoul"
  # GitHub schedule 지연/누락 대비 백업. 시간당 실행되는 기존 Warsh 워크플로 완료 시에도
  # KOFIA를 재조회하고 fingerprint가 같으면 중복 발송하지 않는다.
  workflow_run:
    workflows: ["Warsh Reaction Function Telegram Watch"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force one Telegram report even when official values are unchanged"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: kofia-liquidity-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_send == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install browser driver
        run: npm install --no-save playwright-core@1.48.2

      - name: Verify exact Telegram route
        run: |
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "Telegram token secret missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "Telegram chat id secret missing"; exit 1; }
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ['TELEGRAM_BOT_TOKEN'].strip()
          expected = os.environ['EXPECTED_TELEGRAM_BOT_USERNAME'].strip().lstrip('@')
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode('utf-8'))
          actual = str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{actual}")
          PY

      - name: Query KOFIA official liquidity data
        run: |
          rm -f out/kofia_liquidity_alert.html out/kofia_liquidity_status.md out/kofia_liquidity_pending_state.json
          node --check scripts/kofia_liquidity_watch.js
          node scripts/kofia_liquidity_watch.js
          cat out/kofia_liquidity_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build detailed current interpretation
        if: hashFiles('out/kofia_liquidity_alert.html') != ''
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          alert_path = Path('out/kofia_liquidity_alert.html')
          state_path = Path('out/kofia_liquidity_pending_state.json')
          text = alert_path.read_text(encoding='utf-8')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          v = state['values']

          def jo(raw_million):
              return raw_million / 1_000_000

          def fmt(raw_million):
              x = jo(raw_million)
              return f"{x:+.2f}조"

          dep1, dep5 = v['deposit']['d1'], v['deposit']['d5']
          mmf1, mmf5 = v['mmf']['d1'], v['mmf']['d5']
          cma1, cma5 = v['cma']['d1'], v['cma']['d5']
          cr1, cr5 = v['credit']['d1'], v['credit']['d5']

          # 방향 판정용 최소 유의 변화. 단순 +/- 부호만으로 +0.01조를 '증가 추세'라고
          # 과대해석하지 않는다: 최소 0.05조 또는 잔액의 0.05% 중 큰 값.
          def mat(key):
              level = abs(v[key]['value'])
              return max(50_000, level * 0.0005)

          def direction(change, key):
              threshold = mat(key)
              if abs(change) < threshold:
                  return '보합'
              return '증가' if change > 0 else '감소'

          def arrow(change, key):
              d = direction(change, key)
              return '↑' if d == '증가' else '↓' if d == '감소' else '≈'

          # 1D 큰 변동 기준은 기존 경보 기준을 그대로 유지.
          thresholds = [
              ('투자자예탁금', dep1, 2_000_000, '±2조'),
              ('MMF', mmf1, 3_000_000, '±3조'),
              ('CMA', cma1, 2_000_000, '±2조'),
              ('신용융자', cr1, 500_000, '±0.5조'),
          ]
          triggered = [f"{name} {fmt(value)}(경보 기준 {label} 초과)" for name, value, threshold, label in thresholds if abs(value) >= threshold]
          trigger_line = '• <b>큰 변동 원인</b>: ' + (' / '.join(triggered) if triggered else '1D 큰 변동 기준을 넘은 항목 없음')

          # 당일 자금 방향은 예탁금·MMF만 보지 않고 CMA와 신용융자까지 같이 읽는다.
          cash_line = (
              f"• <b>자금 방향</b>: 예탁금 {fmt(dep1)}{arrow(dep1,'deposit')} · "
              f"MMF {fmt(mmf1)}{arrow(mmf1,'mmf')} · "
              f"CMA {fmt(cma1)}{arrow(cma1,'cma')} · "
              f"신용융자 {fmt(cr1)}{arrow(cr1,'credit')} → "
          )
          if direction(mmf1,'mmf') == '감소' and direction(dep1,'deposit') == '감소' and direction(cma1,'cma') == '증가':
              cash_line += (
                  "MMF에서 큰 자금이 빠졌지만 투자자예탁금은 오히려 줄고 CMA는 늘었습니다. "
                  "따라서 MMF 유출이 곧바로 주식 매수 대기자금으로 이동했다고 볼 수 없고, 목적지는 아직 불명확합니다."
              )
          elif direction(dep1,'deposit') == '증가' and direction(mmf1,'mmf') == '감소':
              cash_line += (
                  "주식 매수 대기자금은 늘고 MMF는 줄어 위험자산 쪽 이동 가능성이 커진 조합입니다. "
                  "다만 동일 자금의 직접 이전으로 단정하지 않습니다."
              )
          elif direction(dep1,'deposit') == '감소' and direction(mmf1,'mmf') == '증가':
              cash_line += (
                  "주식 매수 대기자금은 줄고 단기금융상품 주차자금은 늘어난 방향입니다. "
                  "같은 돈의 직접 이동으로 단정하지 않습니다."
              )
          else:
              cash_line += "네 항목의 방향이 완전히 정렬되지 않아 단일한 위험선호 신호로 보지 않습니다."

          # 5거래일은 '지속성'과 수급의 질을 함께 본다.
          persistence_line = (
              f"• <b>지속성</b>: 5D 예탁금 {fmt(dep5)}{arrow(dep5,'deposit')} · "
              f"MMF {fmt(mmf5)}{arrow(mmf5,'mmf')} · "
              f"CMA {fmt(cma5)}{arrow(cma5,'cma')} · "
              f"신용융자 {fmt(cr5)}{arrow(cr5,'credit')} → "
          )
          if direction(dep5,'deposit') == '감소' and direction(mmf5,'mmf') == '증가' and direction(cr5,'credit') == '증가':
              persistence_line += (
                  "최근 5거래일에는 현금성 주식 매수 대기자금이 크게 줄었고 MMF·신용융자는 늘었습니다. "
                  "당일 MMF 급감은 5거래일 상승 흐름 안의 단기 되돌림인지 다음 값에서 확인해야 합니다."
              )
          else:
              persistence_line += "1D와 5D 방향을 함께 봐 일시 반전인지 지속 추세인지 구분합니다."

          cma_dir_1 = direction(cma1,'cma')
          cma_dir_5 = direction(cma5,'cma')
          if cma_dir_5 == '보합':
              cma_meaning = "5거래일 기준 사실상 보합이라 추세 신호로 보지 않습니다."
          elif cma_dir_1 == cma_dir_5:
              cma_meaning = f"단기와 5거래일 모두 {cma_dir_5} 방향입니다."
          else:
              cma_meaning = "단기와 5거래일 방향이 엇갈려 추세가 뚜렷하지 않습니다."
          cma_line = f"• <b>CMA</b>: 1D {fmt(cma1)}{arrow(cma1,'cma')} · 5D {fmt(cma5)}{arrow(cma5,'cma')} → {cma_meaning}"

          cr_dir_5 = direction(cr5,'credit')
          if cr_dir_5 == '증가':
              leverage_line = f"• <b>레버리지</b>: 신용융자 1D {fmt(cr1)}{arrow(cr1,'credit')} · 5D {fmt(cr5)}↑ → 최근 5거래일 레버리지가 확대됐습니다."
          elif cr_dir_5 == '감소':
              leverage_line = f"• <b>레버리지</b>: 신용융자 1D {fmt(cr1)}{arrow(cr1,'credit')} · 5D {fmt(cr5)}↓ → 최근 5거래일 디레버리징 방향입니다."
          else:
              leverage_line = f"• <b>레버리지</b>: 신용융자 1D {fmt(cr1)}{arrow(cr1,'credit')} · 5D {fmt(cr5)}≈ → 레버리지 변화는 제한적입니다."

          # 종합은 가장 중요한 5D 예탁금과 신용융자의 조합을 우선한다.
          if direction(dep5,'deposit') == '감소' and direction(cr5,'credit') == '증가':
              summary_line = (
                  f"• <b>종합</b>: 5D 기준 투자자예탁금 {fmt(dep5)}로 크게 줄었는데 신용융자는 {fmt(cr5)} 늘었습니다. "
                  f"MMF는 {fmt(mmf5)}, CMA는 {fmt(cma5)}로 CMA는 사실상 보합입니다. "
                  "즉 현금으로 살 수 있는 주식 매수 여력은 약해진 반면 레버리지 의존도는 높아져 수급의 질이 이전보다 취약해진 조합입니다. "
                  "다만 MMF 증가분이 주식에서 빠져나간 동일 자금이라고 단정하지 않습니다."
              )
          elif direction(dep5,'deposit') == '증가' and direction(cr5,'credit') != '증가':
              summary_line = (
                  "• <b>종합</b>: 현금성 주식 매수 대기자금이 늘고 레버리지는 크게 확대되지 않아 현금 매수 여력 개선 쪽에 가깝습니다."
              )
          else:
              summary_line = (
                  "• <b>종합</b>: 현금 매수여력·단기 주차자금·레버리지 방향이 완전히 정렬되지 않았습니다. "
                  "예탁금과 신용융자의 5거래일 방향을 우선하고 MMF·CMA를 보조축으로 해석합니다."
              )

          new_section = '\n'.join([
              '<b>현재 판정</b>',
              trigger_line,
              cash_line,
              persistence_line,
              cma_line,
              leverage_line,
              summary_line,
          ])

          start_marker = '<b>현재 판정</b>'
          end_marker = '<b>검증</b>'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + new_section + '\n\n' + text[end:]

          # 괄호 설명은 사용자가 요청한 MMF와 CMA에만 붙인다.
          text = text.replace('MMF 설정원본 <b>', 'MMF 설정원본(단기금융상품에 투자하는 펀드의 투자원금 기준 규모) <b>')
          text = text.replace('CMA 잔고 <b>', 'CMA 잔고(증권사 현금관리계좌에 머무는 단기자금) <b>')

          alert_path.write_text(text, encoding='utf-8')
          print('detailed_liquidity_interpretation_applied=true')
          print(trigger_line.replace('<b>', '').replace('</b>', ''))
          print(summary_line.replace('<b>', '').replace('</b>', ''))
          PY

      - name: Send Telegram update
        if: hashFiles('out/kofia_liquidity_alert.html') != ''
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token = os.environ['TELEGRAM_BOT_TOKEN'].strip()
          chat_id = os.environ['TELEGRAM_CHAT_ID'].strip()
          expected = os.environ['EXPECTED_TELEGRAM_BOT_USERNAME'].strip().lstrip('@')
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode('utf-8'))
          actual = str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          text = pathlib.Path('out/kofia_liquidity_alert.html').read_text(encoding='utf-8').strip()
          payload = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'HTML',
              'disable_web_page_preview': 'true',
          }).encode('utf-8')
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method='POST')
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.loads(response.read().decode('utf-8'))
          if not result.get('ok'):
              raise RuntimeError(f"Telegram rejected message: {result}")
          mid = (result.get('result') or {}).get('message_id')
          print(f"telegram_delivery_confirmed=true bot=@{actual} messages=1 id={mid}")
          PY

      - name: Persist state only after successful delivery
        if: success() && hashFiles('out/kofia_liquidity_pending_state.json') != ''
        run: cp out/kofia_liquidity_pending_state.json data/kofia_liquidity_state.json

      - name: Commit watcher state
        if: success() && hashFiles('data/kofia_liquidity_state.json') != '' && hashFiles('out/kofia_liquidity_pending_state.json') != ''
        run: |
          git config user.name "kofia-liquidity-watch[bot]"
          git config user.email "kofia-liquidity-watch[bot]@users.noreply.github.com"
          cp data/kofia_liquidity_state.json /tmp/kofia_liquidity_state.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/kofia_liquidity_state.json data/kofia_liquidity_state.json
            git add data/kofia_liquidity_state.json
            if git diff --cached --quiet; then
              echo "KOFIA liquidity state unchanged"
              exit 0
            fi
            git commit -m "Update KOFIA liquidity watch state"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kofia-liquidity-watch-${{ github.run_id }}
          path: |
            out/kofia_liquidity_status.md
            out/kofia_liquidity_alert.html
            out/kofia_liquidity_pending_state.json
          if-no-files-found: ignore
          retention-days: 14
