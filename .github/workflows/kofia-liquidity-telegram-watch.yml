name: KOFIA Liquidity Telegram Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kofia-liquidity-telegram-watch.yml"
      - "scripts/kofia_liquidity_watch.js"
      - "scripts/test_kofia_liquidity_interpretation.py"
      - "scripts/kofia_liquidity_semantic_guard.py"
      - "scripts/kofia_liquidity_state_integrity.js"
      - "scripts/test_kofia_liquidity_state_integrity.js"
      - "scripts/kofia_liquidity_interpretation.py"
      - "scripts/kofia_liquidity_source_guard.py"
      - "scripts/test_kofia_liquidity_source.py"
      - "scripts/kofia_liquidity_commit_state.py"
      - "scripts/test_kofia_liquidity_commit_state.py"
      - "scripts/kofia_liquidity_delivery_guard.py"
      - "scripts/test_kofia_liquidity_delivery.py"
      - "tests/fixtures/kofia_source_20261012.json"
  pull_request:
    paths:
      - ".github/workflows/kofia-liquidity-telegram-watch.yml"
      - "scripts/*kofia_liquidity*"
      - "tests/fixtures/kofia_source_20261012.json"
  schedule:
    # KST 직접 지정. 새 공식값/수정치가 없으면 Telegram은 보내지 않는다.
    - cron: "5,20,40 7 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "5 8-13 * * 1-5"
      timezone: "Asia/Seoul"
  # GitHub schedule 지연/누락 대비 백업. 시간당 실행되는 기존 Warsh 워크플로 완료 시에도
  # KOFIA를 재조회하고 fingerprint가 같으면 중복 발송하지 않는다.
  workflow_run:
    workflows: ["Warsh Reaction Function Telegram Watch"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force one Telegram report even when official values are unchanged"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: kofia-liquidity-telegram-watch
  cancel-in-progress: false

jobs:
  offline-regressions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate KOFIA state, source and message without sending
        run: |
          node scripts/test_kofia_liquidity_state_integrity.js
          python scripts/test_kofia_liquidity_source.py
          python scripts/test_kofia_liquidity_commit_state.py
          python scripts/test_kofia_liquidity_delivery.py
          python scripts/test_kofia_liquidity_interpretation.py
  watch:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_send == 'true' && 'true' || 'false' }}
      DRY_RUN: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[dry-run]') && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh current code and confirmed state after queue wait
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "KOFIA_CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify exact Telegram route
        run: |
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "Telegram token secret missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "Telegram chat id secret missing"; exit 1; }
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ['TELEGRAM_BOT_TOKEN'].strip()
          expected = os.environ['EXPECTED_TELEGRAM_BOT_USERNAME'].strip().lstrip('@')
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode('utf-8'))
          actual = str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{actual}")
          PY

      - name: Test KOFIA directional interpretation
        run: |
          node --check scripts/kofia_liquidity_state_integrity.js
          node scripts/test_kofia_liquidity_state_integrity.js
          python scripts/test_kofia_liquidity_source.py
          python scripts/test_kofia_liquidity_commit_state.py
          python scripts/test_kofia_liquidity_delivery.py
          python scripts/test_kofia_liquidity_interpretation.py

      - name: Query KOFIA official liquidity data
        run: |
          rm -f out/kofia_liquidity_alert.html out/kofia_liquidity_status.md out/kofia_liquidity_pending_state.json
          node --check scripts/kofia_liquidity_watch.js
          node scripts/kofia_liquidity_watch.js
          cat out/kofia_liquidity_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Independently recalculate preserved official source responses
        run: python scripts/kofia_liquidity_source_guard.py

      - name: Build detailed current interpretation
        if: hashFiles('out/kofia_liquidity_alert.html') != ''
        run: python scripts/kofia_liquidity_interpretation.py

      - name: Validate signed final KOFIA Telegram message
        if: hashFiles('out/kofia_liquidity_alert.html') != ''
        run: python scripts/kofia_liquidity_semantic_guard.py

      - name: Send Telegram update
        if: env.DRY_RUN != 'true' && hashFiles('out/kofia_liquidity_alert.html') != ''
        run: |
          python scripts/kofia_liquidity_source_guard.py
          python scripts/kofia_liquidity_semantic_guard.py
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          from scripts.kofia_liquidity_delivery_guard import validate_acknowledgement
          token = os.environ['TELEGRAM_BOT_TOKEN'].strip()
          chat_id = os.environ['TELEGRAM_CHAT_ID'].strip()
          expected = os.environ['EXPECTED_TELEGRAM_BOT_USERNAME'].strip().lstrip('@')
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode('utf-8'))
          actual = str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          text = pathlib.Path('out/kofia_liquidity_alert.html').read_text(encoding='utf-8').strip()
          state = json.loads(pathlib.Path('out/kofia_liquidity_pending_state.json').read_text(encoding='utf-8'))
          critical_dates = [state['dates'][k] for k in ('deposit','mmf','cma','credit')]
          if state.get('alignment_ready') is not True or len(set(critical_dates)) != 1:
              raise RuntimeError(f"KOFIA critical-date quality gate failed before Telegram send: {critical_dates}")
          if state.get('snapshot_date') != critical_dates[0]:
              raise RuntimeError(
                  f"KOFIA snapshot_date mismatch before Telegram send: snapshot={state.get('snapshot_date')} dates={critical_dates}"
              )
          payload = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'HTML',
              'disable_web_page_preview': 'true',
          }).encode('utf-8')
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method='POST')
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.loads(response.read().decode('utf-8'))
          confirmation = validate_acknowledgement(result, text, expected, chat_id)
          mid = confirmation['message_id']
          from datetime import datetime, timezone
          state['delivery_receipt'] = {
              **confirmation,
              'bot_username': actual,
              'timestamp_utc': datetime.now(timezone.utc).isoformat(),
              'body_sha256': hashlib.sha256(text.encode()).hexdigest(),
              'source_evidence_sha256': hashlib.sha256(pathlib.Path('out/kofia_liquidity_source_evidence.json').read_bytes()).hexdigest(),
              'code_sha': os.environ['KOFIA_CODE_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
          }
          pathlib.Path('out/kofia_liquidity_delivery.json').write_text(
              json.dumps(state['delivery_receipt'], ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          pathlib.Path('out/kofia_liquidity_pending_state.json').write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print(f"telegram_delivery_confirmed=true bot=@{actual} messages=1 id={mid} receipt_persist_ready=true")
          PY

      - name: Persist state only after successful delivery
        if: success() && env.DRY_RUN != 'true' && hashFiles('out/kofia_liquidity_delivery.json') != ''
        run: |
          test -f out/kofia_liquidity_delivery.json

      - name: Commit watcher state
        if: success() && env.DRY_RUN != 'true' && hashFiles('out/kofia_liquidity_delivery.json') != ''
        run: |
          git config user.name "kofia-liquidity-watch[bot]"
          git config user.email "kofia-liquidity-watch[bot]@users.noreply.github.com"
          cp out/kofia_liquidity_pending_state.json /tmp/kofia_liquidity_state.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            python scripts/kofia_liquidity_commit_state.py /tmp/kofia_liquidity_state.json
            git add data/kofia_liquidity_state.json
            if git diff --cached --quiet; then
              echo "KOFIA liquidity state unchanged"
              exit 0
            fi
            git commit -m "Update KOFIA liquidity watch state"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kofia-liquidity-watch-${{ github.run_id }}
          path: |
            out/kofia_liquidity_status.md
            out/kofia_liquidity_alert.html
            out/kofia_liquidity_pending_state.json
            out/kofia_liquidity_source_evidence.json
            out/kofia_liquidity_delivery.json
            data/kofia_liquidity_state.json
          if-no-files-found: ignore
          retention-days: 14
