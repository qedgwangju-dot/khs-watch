name: Space Launch Bottleneck Telegram Watch
# Recheck regression after SEC-backed Neutron correction, preserving production schedule.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/space-launch-bottleneck-telegram-watch.yml"
      - "scripts/space_launch_bottleneck_watch.py"
      - "scripts/space_launch_telegram_send.py"
      - "scripts/merge_space_launch_state.py"
      - "scripts/validate_space_launch_korean.py"
      - "scripts/space_launch_translate_local.py"
      - "scripts/space_launch_event_guard.py"
      - "scripts/space_launch_alert_filter.py"
  schedule:
    - cron: "6,21,36,51 * * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "카테고리별 최신 검증 항목을 Telegram으로 다시 전송"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: space-launch-bottleneck-telegram-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887988798879887988798879_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refresh main and delivered-state before event detection
        # Queued push runs may reference a snapshot older than the previous send.
        run: |
          git fetch origin main
          git reset --hard origin/main
          git rev-parse --short HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          python -m py_compile scripts/space_launch_bottleneck_watch.py
          SPACE_LAUNCH_TRANSITION_SELF_TEST=1 python scripts/space_launch_bottleneck_watch.py
          python -m py_compile scripts/space_launch_telegram_send.py
          python -m py_compile scripts/merge_space_launch_state.py
          python -m py_compile scripts/validate_space_launch_korean.py
          python -m py_compile scripts/space_launch_translate_local.py
          python scripts/space_launch_telegram_send.py --self-test
          python scripts/space_launch_telegram_send.py --inline-self-test
          python scripts/space_launch_telegram_send.py --readable-self-test
          python scripts/merge_space_launch_state.py --self-test
          python scripts/validate_space_launch_korean.py --self-test
          python scripts/space_launch_translate_local.py --self-test
          python -m py_compile scripts/space_launch_event_guard.py scripts/space_launch_alert_filter.py
          python scripts/space_launch_event_guard.py
          python -c "import sys; sys.path.insert(0,'scripts'); import space_launch_alert_filter as f; f.self_test()"

      - name: Run space launch bottleneck watch
        env:
          FORCE_NOTIFY: ${{ inputs.force_notify }}
        run: python scripts/space_launch_bottleneck_watch.py

      - name: Block misclassified and outdated article alerts
        run: python scripts/space_launch_alert_filter.py out/space_launch_bottleneck_watch_telegram.txt

      - name: Translate English alert text to Korean
        if: hashFiles('out/space_launch_bottleneck_watch_telegram.txt') != ''
        run: |
          cp out/space_launch_bottleneck_watch_telegram.txt out/space_launch_bottleneck_watch_original.txt
          python scripts/space_launch_translate_local.py \
            out/space_launch_bottleneck_watch_original.txt \
            out/space_launch_bottleneck_watch_korean.txt
          python scripts/validate_space_launch_korean.py \
            out/space_launch_bottleneck_watch_original.txt \
            out/space_launch_bottleneck_watch_korean.txt \
            out/space_launch_bottleneck_watch_telegram.txt

      - name: Publish watcher summary
        if: always()
        run: |
          if [ -f out/space_launch_bottleneck_watch_status.md ]; then
            cat out/space_launch_bottleneck_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/space_launch_bottleneck_watch_telegram.txt ]; then
            printf '\n---\n\nTelegram 알림 미리보기:\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/space_launch_bottleneck_watch_telegram.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send verified change to dedicated Telegram bot
        if: hashFiles('out/space_launch_bottleneck_watch_telegram.txt') != ''
        env:
          SPACE_LAUNCH_TELEGRAM_BOT_TOKEN: ${{ secrets.SPACE_LAUNCH_TELEGRAM_BOT_TOKEN }}
          SPACE_LAUNCH_TELEGRAM_CHAT_ID: ${{ secrets.SPACE_LAUNCH_TELEGRAM_CHAT_ID }}
          SPACE_LAUNCH_VERIFY_RECEIPT: "1"
        run: python scripts/space_launch_telegram_send.py --readable out/space_launch_bottleneck_watch_telegram.txt

      - name: Persist deduplication state
        # No sent-state update when the final alert was filtered out or absent.
        # A nonempty final alert plus success() implies the Telegram send step succeeded.
        if: success() && hashFiles('out/space_launch_bottleneck_dedicated_pending_state.json') != '' && hashFiles('out/space_launch_bottleneck_watch_telegram.txt') != ''
        run: |
          cp out/space_launch_bottleneck_dedicated_pending_state.json /tmp/space_launch_pending_state.json

          git config user.name "space-launch-bottleneck-watch[bot]"
          git config user.email "space-launch-bottleneck-watch[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/merge_space_launch_state.py \
              data/space_launch_bottleneck_dedicated_state.json \
              /tmp/space_launch_pending_state.json \
              data/space_launch_bottleneck_dedicated_state.json

            git add data/space_launch_bottleneck_dedicated_state.json

            if git diff --cached --quiet; then
              echo "Space launch watch state already merged"
              exit 0
            fi

            git commit -m "chore: update space launch bottleneck watch state"
            if git push origin HEAD:main; then
              exit 0
            fi

            sleep $((attempt * 3))
          done

          exit 1
