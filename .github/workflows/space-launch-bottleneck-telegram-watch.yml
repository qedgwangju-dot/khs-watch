name: Space Launch Bottleneck Telegram Watch
# dedicated bot secret verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/space-launch-bottleneck-telegram-watch.yml"
      - "scripts/space_launch_bottleneck_watch.py"
      - "scripts/space_launch_telegram_send.py"
  schedule:
    - cron: "6,21,36,51 * * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "카테고리별 최신 검증 항목을 Telegram으로 다시 전송"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: space-launch-bottleneck-telegram-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887988798879887988798879_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          python -m py_compile scripts/space_launch_bottleneck_watch.py
          python -m py_compile scripts/space_launch_telegram_send.py

      - name: Run space launch bottleneck watch
        env:
          FORCE_NOTIFY: "true"
        run: python scripts/space_launch_bottleneck_watch.py

      - name: Publish watcher summary
        if: always()
        run: |
          if [ -f out/space_launch_bottleneck_watch_status.md ]; then
            cat out/space_launch_bottleneck_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/space_launch_bottleneck_watch_telegram.txt ]; then
            printf '\n---\n\nTelegram 알림 미리보기:\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/space_launch_bottleneck_watch_telegram.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send verified change to dedicated Telegram bot
        if: hashFiles('out/space_launch_bottleneck_watch_telegram.txt') != ''
        env:
          SPACE_LAUNCH_TELEGRAM_BOT_TOKEN: ${{ secrets.SPACE_LAUNCH_TELEGRAM_BOT_TOKEN }}
          SPACE_LAUNCH_TELEGRAM_CHAT_ID: ${{ secrets.SPACE_LAUNCH_TELEGRAM_CHAT_ID }}
        run: python scripts/space_launch_telegram_send.py out/space_launch_bottleneck_watch_telegram.txt

      - name: Persist deduplication state
        if: success() && hashFiles('out/space_launch_bottleneck_dedicated_pending_state.json') != ''
        run: |
          mkdir -p data
          cp out/space_launch_bottleneck_dedicated_pending_state.json data/space_launch_bottleneck_dedicated_state.json

          git config user.name "space-launch-bottleneck-watch[bot]"
          git config user.email "space-launch-bottleneck-watch[bot]@users.noreply.github.com"
          git add data/space_launch_bottleneck_dedicated_state.json

          if git diff --cached --quiet; then
            echo "Space launch watch state unchanged"
            exit 0
          fi

          git commit -m "chore: update space launch bottleneck watch state"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
