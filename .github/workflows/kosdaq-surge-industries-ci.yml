name: KOSDAQ Surge Industry Context CI

on:
  pull_request:
    paths:
      - "scripts/kosdaq_surge_industries.py"
      - "scripts/test_kosdaq_surge_industries.py"
      - "scripts/test_kospi_shock_backfill.py"
      - "scripts/test_market_flow_diagnostics.py"
      - "scripts/probe_kosdaq_surge_industries.py"
      - "scripts/probe_market_surge_industries.py"
      - "scripts/kospi_shock_episode_watch.py"
      - "scripts/market_alert_delivery.py"
      - "scripts/test_market_alert_delivery.py"
      - "scripts/test_market_delivery_recovery.py"
      - "tests/fixtures/market_delivery_timeout_20261026.json"
      - ".github/workflows/market-alert-telegram-test.yml"
      - "scripts/market_flow_channels.py"
      - "scripts/market_investors.py"
      - "scripts/test_market_investment_trust.py"
      - "scripts/test_market_financial_investment.py"
      - "tests/fixtures/market_financial_source_contract_20261026.json"
      - "scripts/test_market_flow_channels.py"
      - "scripts/probe_market_flow_channels.py"
      - "scripts/kospi_unified_industry_collector.py"
      - "scripts/ls_live_source_gate.py"
      - "scripts/test_ls_live_source_gate.py"
      - ".github/workflows/kosdaq-surge-industries-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/kosdaq_surge_industries.py"
      - "scripts/test_kosdaq_surge_industries.py"
      - "scripts/test_kospi_shock_backfill.py"
      - "scripts/test_market_flow_diagnostics.py"
      - "scripts/probe_kosdaq_surge_industries.py"
      - "scripts/probe_market_surge_industries.py"
      - "scripts/kospi_shock_episode_watch.py"
      - "scripts/market_alert_delivery.py"
      - "scripts/test_market_alert_delivery.py"
      - "scripts/test_market_delivery_recovery.py"
      - "tests/fixtures/market_delivery_timeout_20261026.json"
      - ".github/workflows/market-alert-telegram-test.yml"
      - "scripts/market_flow_channels.py"
      - "scripts/market_investors.py"
      - "scripts/test_market_investment_trust.py"
      - "scripts/test_market_financial_investment.py"
      - "tests/fixtures/market_financial_source_contract_20261026.json"
      - "scripts/test_market_flow_channels.py"
      - "scripts/probe_market_flow_channels.py"
      - "scripts/kospi_unified_industry_collector.py"
      - "scripts/ls_live_source_gate.py"
      - "scripts/test_ls_live_source_gate.py"
      - ".github/workflows/kosdaq-surge-industries-ci.yml"

  workflow_dispatch:
    inputs:
      run_live_source_probes:
        description: "Run sequential read-only LS source probes only when no other LS consumer is active"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests exchange_calendars pyyaml
      - name: Validate industry context and existing flow guards offline
        run: |
          python -m py_compile scripts/kosdaq_surge_industries.py scripts/probe_kosdaq_surge_industries.py scripts/kospi_unified_industry_collector.py scripts/kospi_shock_episode_watch.py
          python -m py_compile scripts/probe_market_surge_industries.py
          python -m py_compile scripts/ls_live_source_gate.py scripts/test_ls_live_source_gate.py
          python scripts/test_ls_live_source_gate.py
          python scripts/test_kosdaq_surge_industries.py
          python scripts/test_kospi_shock_backfill.py
          python scripts/test_market_flow_diagnostics.py
          python scripts/test_market_flow_channels.py
          python scripts/test_market_investment_trust.py
          python scripts/test_market_financial_investment.py
          python scripts/test_market_alert_delivery.py
          python scripts/test_market_delivery_recovery.py
          python scripts/test_kospi_shock_episode.py
          python scripts/test_kospi_shock_enrichment.py
          python scripts/test_kospi_flow_attribution_strict.py

  live_source:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_source_probes == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: ${{ github.repository }}-ls-live-source-ci
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests exchange_calendars
      - name: Gate shared LS source quota
        id: source_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_LIVE_SOURCE_PROBES: ${{ inputs.run_live_source_probes }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: python scripts/ls_live_source_gate.py
      - name: Audit dated native industry source
        if: steps.source_gate.outputs.allow == 'true'
        env:
          LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
          LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}
        run: python scripts/probe_kosdaq_surge_industries.py --native --journal out/kosdaq_native_industry_probe.jsonl --out out/kosdaq_native_industry_probe.json
      - name: Read both market flow channels
        if: steps.source_gate.outputs.allow == 'true'
        env:
          LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
          LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}
        run: python scripts/probe_market_flow_channels.py
      - name: Preserve source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-source-audit-${{ github.run_id }}
          path: |
            out/kosdaq_native_industry_probe.jsonl
            out/kosdaq_native_industry_probe.json
            out/market_flow_channel_probe.json
          if-no-files-found: ignore
          retention-days: 7

