name: Bio Secret Healthcheck

on:
  push:
    paths:
      - ".github/workflows/bio-secret-healthcheck.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs887988798879887988798879_bot"
      BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
      BIO_TELEGRAM_CHAT_ID: ${{ secrets.BIO_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check secret presence without exposing values
        run: |
          python - <<'PY'
          import datetime as dt, json, os, pathlib, urllib.request
          from zoneinfo import ZoneInfo
          token=(os.getenv('BIO_TELEGRAM_BOT_TOKEN') or '').strip()
          chat=(os.getenv('BIO_TELEGRAM_CHAT_ID') or '').strip()
          expected=(os.getenv('EXPECTED_TELEGRAM_BOT_USERNAME') or '').strip().lstrip('@')
          payload={
            'checked_at_kst':dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat(timespec='seconds'),
            'bot_token_present':bool(token),
            'chat_id_present':bool(chat),
            'bot_identity_ok':False,
          }
          if token:
            try:
              with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe',timeout=25) as r:
                data=json.loads(r.read().decode('utf-8'))
              actual=str((data.get('result') or {}).get('username') or '')
              payload['bot_identity_ok']=bool(data.get('ok') and actual.lower()==expected.lower())
            except Exception:
              payload['bot_identity_ok']=False
          pathlib.Path('data/bio_secret_healthcheck.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False))
          PY
      - name: Commit result
        run: |
          git config user.name "bio-healthcheck[bot]"
          git config user.email "bio-healthcheck[bot]@users.noreply.github.com"
          git add data/bio_secret_healthcheck.json
          git commit -m "Record bio secret healthcheck" || exit 0
          git pull --rebase origin main
          git push