name: Crypto Liquidity Telegram Watch

on:
  push:
    paths:
      - ".github/workflows/crypto-liquidity-watch-telegram.yml"
      - "scripts/crypto_liquidity_watch.py"
      - "scripts/crypto_liquidity_watch_runner.py"
      - "scripts/crypto_alert_krw.py"
      - "scripts/crypto_alert_format.py"
      - "scripts/samsung_wallet_stablecoin_watch.py"
      - "scripts/verify_samsung_wallet_stablecoin_state.py"
      - "scripts/coin_alert_korean_terms.py"
      - "scripts/coinbase_stablecoin_catalyst_watch.py"
      - "tests/test_coinbase_stablecoin_catalyst_watch.py"
      - "tests/test_coin_alert_korean_terms.py"
      - "data/coinbase_stablecoin_catalyst_state.json"
      - "data/crypto_liquidity_watch_state.json"
      - "data/samsung_wallet_stablecoin_watch_state.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-liquidity-watch-telegram
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs88790088790000_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Validate watcher
        run: |
          python -m py_compile scripts/crypto_liquidity_watch.py
          python -m py_compile scripts/crypto_liquidity_watch_runner.py
          python -m py_compile scripts/crypto_alert_krw.py
          python -m py_compile scripts/crypto_alert_format.py
          python -m py_compile scripts/samsung_wallet_stablecoin_watch.py
          python -m py_compile scripts/verify_samsung_wallet_stablecoin_state.py
          python scripts/verify_samsung_wallet_stablecoin_state.py
          python -m py_compile scripts/coin_alert_korean_terms.py
          python -m py_compile scripts/coinbase_stablecoin_catalyst_watch.py
          python -m unittest tests/test_coinbase_stablecoin_catalyst_watch.py tests/test_coin_alert_korean_terms.py -v
          python - <<'PY'
          import json
          import pathlib
          from scripts import crypto_alert_format as fmt

          fmt.PENDING_STATE_PATH = pathlib.Path("data/crypto_liquidity_watch_state.json")
          sample = """[크립토 유동성 변화 감지]
          조회시각(KST): 2026-09-29T09:48:56+09:00

          • BTC 현물 ETF 당일 합계 수정(잠정 집계): -12.9백만달러 (약 -174억원) → -23.8백만달러 (약 -322억원)

          <b>BTC 자금 위치</b>
          • River 잠재 순유입 · $1.3T~$5.3T
          • BlackRock 1~2%

          미 국채 — 미 재무부 공식 수익률곡선 기준일 2026-09-28
          원화 환산 기준: 1달러=1,352.00원 | 기준일 2026-09-28 | 한국은행 ECOS 원/미국달러(매매기준율) | 교차검증: 접근 불가 | 조회 2026-09-29T09:49:36+09:00
          공식·데이터 원천:
          • 원/달러 환율: <a href="https://ecos.bok.or.kr/">원문</a>
          • 미 국채 금리: <a href="https://home.treasury.gov/">원문</a>
          • BTC 현물 ETF: <a href="https://farside.co.uk/btc/">원문</a>
          """
          rendered = fmt.format_alert(sample)
          assert "<b>무엇이 바뀌었나</b>" in rendered
          assert "<b>지금 숫자</b>" in rendered
          assert "<blockquote><b>판정 ·" in rendered
          assert "River" not in rendered
          assert "BlackRock" not in rendered
          assert "구조적 수요 맥락" not in rendered
          assert len(rendered) < 1800, len(rendered)
          print("compact_crypto_alert_layout_valid=true")
          print(rendered)

          partial = json.loads(pathlib.Path("data/crypto_liquidity_watch_state.json").read_text(encoding="utf-8"))
          partial["btc_etf"].update({
              "date": "2026-09-29",
              "total_usd_m": 15.1,
              "status": "partial",
              "reported_funds": 11,
              "missing_funds": 1,
              "last5_usd_m": 718.2,
              "last5_dates": ["2026-09-23", "2026-09-24", "2026-09-25", "2026-09-28", "2026-09-29"],
              "prev5_usd_m": 2010.3,
              "prev5_dates": ["2026-09-16", "2026-09-17", "2026-09-18", "2026-09-21", "2026-09-22"],
              "five_day_change_usd_m": -1292.1,
              "five_day_change_pct": -64.3,
              "five_day_direction": "순자금흐름 악화",
          })
          partial_path = pathlib.Path("/tmp/crypto_liquidity_partial_state.json")
          partial_path.write_text(json.dumps(partial, ensure_ascii=False), encoding="utf-8")
          fmt.PENDING_STATE_PATH = partial_path
          sample5 = """[크립토 유동성 변화 감지]
          조회시각(KST): 2026-09-30T11:14:35+09:00

          • BTC 현물 ETF 새 일간 자금흐름(잠정 집계): +15.1백만달러
          • BTC 현물 ETF 5거래일 구간 이동: 최근5 +1,417.8백만달러 → +718.2백만달러 (-699.6백만달러) / 이전5 +845.2백만달러 → +2,010.3백만달러 (+1,165.1백만달러)

          미 국채 — 미 재무부 공식 수익률곡선 기준일 2026-09-29
          원화 환산 기준: 1달러=1,360.00원 | 기준일 2026-09-29 | 한국은행 ECOS 원/미국달러(매매기준율) | 교차검증: 접근 불가 | 조회 2026-09-30T11:14:50+09:00
          공식·데이터 원천:
          • 원/달러 환율: <a href="https://ecos.bok.or.kr/">원문</a>
          • 미 국채 금리: <a href="https://home.treasury.gov/">원문</a>
          • BTC 현물 ETF: <a href="https://farside.co.uk/btc/">원문</a>
          """
          rendered5 = fmt.format_alert(sample5)
          assert "<b>5거래일 비교 갱신 · 잠정</b>" in rendered5
          assert "최근5(잠정) 2026-09-23~2026-09-29" in rendered5
          assert "이전5 2026-09-16~2026-09-22" in rendered5
          assert "• 구간 차이 -1,292.1백만달러" in rendered5
          assert "-64.3%" in rendered5
          assert "순유입 강도 둔화" in rendered5
          assert "+1,417.8백만달러" not in rendered5
          assert "+845.2백만달러" not in rendered5
          assert rendered5.count("최근5(잠정) 2026-09-23~2026-09-29") == 1
          assert rendered5.count("이전5 2026-09-16~2026-09-22") == 1
          print("five_day_reading_order_valid=true")
          print(rendered5)

          live_state = json.loads(pathlib.Path("data/crypto_liquidity_watch_state.json").read_text(encoding="utf-8"))
          if (
              float((live_state.get("btc_etf") or {}).get("total_usd_m", 0.0) or 0.0) < 0
              and float((live_state.get("btc_etf") or {}).get("last5_usd_m", 0.0) or 0.0)
                  < float((live_state.get("btc_etf") or {}).get("prev5_usd_m", 0.0) or 0.0)
              and float((live_state.get("rates") or {}).get("daily_10y_bp", 0.0) or 0.0) > 0
              and float((live_state.get("rates") or {}).get("daily_30y_bp", 0.0) or 0.0) > 0
          ):
              verdict, reason = fmt.compact_judgement(live_state)
              assert "다만" not in reason, reason
              assert "순유입 강도도 둔화" in reason, reason
              print("adverse_crypto_wording_valid=true")
          PY

      - name: Validate exact Telegram bot route without sending
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_LIQUIDITY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("CRYPTO_LIQUIDITY_TELEGRAM_BOT_TOKEN secret is missing")
          if not chat_id:
              raise RuntimeError("Telegram chat id is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{username}")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getChat?chat_id={chat_id}", timeout=25) as response:
              chat_info = json.loads(response.read().decode("utf-8"))
          chat = chat_info.get("result") or {}
          if not chat_info.get("ok"):
              raise RuntimeError(f"Telegram target chat lookup failed: {chat_info}")
          print(f"telegram_target_valid=true type={chat.get('type', 'unknown')} username_present={bool(chat.get('username'))}")
          PY

      - name: Check Treasury buybacks, long yields and BTC ETF flows
        run: PYTHONPATH=. python scripts/crypto_liquidity_watch_runner.py

      - name: Check Samsung Wallet stablecoin adoption
        if: always()
        run: python scripts/samsung_wallet_stablecoin_watch.py

      - name: Check Coinbase stablecoin business and CFTC clearing catalysts
        if: always()
        run: python scripts/coinbase_stablecoin_catalyst_watch.py

      - name: Verify KRW conversion source
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from scripts.crypto_alert_krw import get_usdkrw, format_krw_from_usd_m

          state = json.load(open("out/crypto_liquidity_watch_pending_state.json", encoding="utf-8"))
          target = dt.date.fromisoformat(state["btc_etf"]["date"])
          event_name = (os.getenv("GITHUB_EVENT_NAME") or "").strip()
          try:
              fx = get_usdkrw(target)
              rate = float(fx["rate"])
              if not 800.0 <= rate <= 2500.0:
                  raise RuntimeError(f"USD/KRW sanity check failed: {rate}")
              is_ecos = str(fx.get("source") or "").startswith("한국은행 ECOS")
              print(
                  f"krw_conversion_valid=true requested_date={target} fx_date={fx['date']} "
                  f"rate={rate:.2f} source={fx['source']} crosscheck={fx['crosscheck']} ecos_primary={str(is_ecos).lower()}"
              )
              print(f"sample_242.3m={format_krw_from_usd_m(242.3, rate)}")
              if event_name in {"push", "workflow_dispatch"} and not is_ecos:
                  raise RuntimeError("BOK_ECOS_API_KEY was provided but ECOS primary lookup did not succeed")
          except Exception as exc:
              if event_name in {"push", "workflow_dispatch"}:
                  raise
              print(f"::warning::KRW verification deferred: {exc}")
          PY

      - name: Convert dollar amounts to KRW using date-matched FX
        if: hashFiles('out/crypto_liquidity_watch_telegram.txt') != ''
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
        run: python scripts/crypto_alert_krw.py

      - name: Format Telegram alert for readability
        if: hashFiles('out/crypto_liquidity_watch_telegram.txt') != ''
        run: python scripts/crypto_alert_format.py

      - name: Translate visible English identifiers to Korean
        if: hashFiles('out/crypto_liquidity_watch_telegram.txt') != '' || hashFiles('out/samsung_wallet_stablecoin_telegram.txt') != '' || hashFiles('out/coinbase_stablecoin_catalyst_telegram.txt') != ''
        run: |
          python scripts/coin_alert_korean_terms.py \
            out/crypto_liquidity_watch_telegram.txt \
            out/samsung_wallet_stablecoin_telegram.txt \
            out/coinbase_stablecoin_catalyst_telegram.txt

      - name: Publish watcher summary
        if: always()
        run: |
          if [ -f out/crypto_liquidity_watch_status.md ]; then
            cat out/crypto_liquidity_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "크립토 유동성 감시 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/crypto_liquidity_watch_telegram.txt ]; then
            printf '\n---\n\nTelegram 알림 미리보기:\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/crypto_liquidity_watch_telegram.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/samsung_wallet_stablecoin_status.md ]; then
            printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/samsung_wallet_stablecoin_status.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/samsung_wallet_stablecoin_telegram.txt ]; then
            printf '\n---\n\nSamsung Wallet stablecoin Telegram preview:\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/samsung_wallet_stablecoin_telegram.txt >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f out/coinbase_stablecoin_catalyst_status.md ]; then
            printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/coinbase_stablecoin_catalyst_status.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/coinbase_stablecoin_catalyst_telegram.txt ]; then
            printf '\n---\n\nCoinbase stablecoin catalyst Telegram preview:\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/coinbase_stablecoin_catalyst_telegram.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send meaningful change to exact Telegram bot
        if: hashFiles('out/crypto_liquidity_watch_telegram.txt') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_LIQUIDITY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("Telegram token/chat id is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          text = pathlib.Path("out/crypto_liquidity_watch_telegram.txt").read_text(encoding="utf-8").strip()
          if not text:
              raise RuntimeError("Telegram alert is empty")

          def split_message(value, limit=3900):
              chunks, current = [], ""
              for paragraph in value.split("\n\n"):
                  candidate = paragraph if not current else current + "\n\n" + paragraph
                  if len(candidate) <= limit:
                      current = candidate
                      continue
                  if current:
                      chunks.append(current)
                      current = ""
                  while len(paragraph) > limit:
                      cut = paragraph.rfind("\n", 0, limit)
                      if cut < 1:
                          cut = limit
                      chunks.append(paragraph[:cut])
                      paragraph = paragraph[cut:].lstrip()
                  current = paragraph
              if current:
                  chunks.append(current)
              return chunks

          ids = []
          for chunk in split_message(text):
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              ids.append((result.get("result") or {}).get("message_id"))

          confirmed = {
              "status": "confirmed",
              "bot_username": username,
              "message_ids": ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/crypto_liquidity_watch_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"telegram_delivery_confirmed=true bot=@{username} message_ids={ids}")
          PY

      - name: Send Samsung Wallet stablecoin change as separate Telegram alert
        if: hashFiles('out/samsung_wallet_stablecoin_telegram.txt') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_LIQUIDITY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("Telegram token/chat id is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          text = pathlib.Path("out/samsung_wallet_stablecoin_telegram.txt").read_text(encoding="utf-8").strip()
          if not text:
              raise RuntimeError("Samsung Wallet stablecoin alert is empty")
          if len(text) > 3900:
              raise RuntimeError(f"Samsung Wallet stablecoin alert too long: {len(text)}")

          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected Samsung Wallet alert: {result}")
          message_id = (result.get("result") or {}).get("message_id")
          confirmed = {
              "status": "confirmed",
              "bot_username": username,
              "message_id": message_id,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/samsung_wallet_stablecoin_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"samsung_wallet_stablecoin_delivery_confirmed=true bot=@{username} message_id={message_id}")
          PY

      - name: Send Coinbase stablecoin business catalyst as separate Telegram alert
        if: hashFiles('out/coinbase_stablecoin_catalyst_telegram.txt') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_LIQUIDITY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("Telegram token/chat id is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          text = pathlib.Path("out/coinbase_stablecoin_catalyst_telegram.txt").read_text(encoding="utf-8").strip()
          if not text:
              raise RuntimeError("Coinbase catalyst alert is empty")

          def split_message(value, limit=3900):
              chunks, current = [], ""
              for paragraph in value.split("\n\n"):
                  candidate = paragraph if not current else current + "\n\n" + paragraph
                  if len(candidate) <= limit:
                      current = candidate
                      continue
                  if current:
                      chunks.append(current)
                      current = ""
                  while len(paragraph) > limit:
                      cut = paragraph.rfind("\n", 0, limit)
                      if cut < 1:
                          cut = limit
                      chunks.append(paragraph[:cut])
                      paragraph = paragraph[cut:].lstrip()
                  current = paragraph
              if current:
                  chunks.append(current)
              return chunks

          ids = []
          for chunk in split_message(text):
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected Coinbase catalyst alert: {result}")
              ids.append((result.get("result") or {}).get("message_id"))

          confirmed = {
              "status": "confirmed",
              "bot_username": username,
              "message_ids": ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/coinbase_stablecoin_catalyst_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"coinbase_catalyst_delivery_confirmed=true bot=@{username} message_ids={ids}")
          PY

      - name: Persist baseline or confirmed state
        if: always()
        run: |
          if [ ! -f out/crypto_liquidity_watch_telegram.txt ] || [ -f out/crypto_liquidity_watch_telegram_confirmed.json ]; then
            if [ -f out/crypto_liquidity_watch_pending_state.json ]; then
              cp out/crypto_liquidity_watch_pending_state.json data/crypto_liquidity_watch_state.json
            fi
          else
            echo "Telegram delivery was not confirmed; watcher state intentionally not advanced."
          fi
          if [ ! -f out/samsung_wallet_stablecoin_telegram.txt ] || [ -f out/samsung_wallet_stablecoin_telegram_confirmed.json ]; then
            if [ -f out/samsung_wallet_stablecoin_watch_pending_state.json ]; then
              cp out/samsung_wallet_stablecoin_watch_pending_state.json data/samsung_wallet_stablecoin_watch_state.json
            fi
          else
            echo "Samsung Wallet Telegram delivery was not confirmed; Samsung watcher state intentionally not advanced."
          fi
          if [ ! -f out/coinbase_stablecoin_catalyst_telegram.txt ] || [ -f out/coinbase_stablecoin_catalyst_telegram_confirmed.json ]; then
            if [ -f out/coinbase_stablecoin_catalyst_pending_state.json ]; then
              cp out/coinbase_stablecoin_catalyst_pending_state.json data/coinbase_stablecoin_catalyst_state.json
            fi
          else
            echo "Coinbase catalyst Telegram delivery was not confirmed; catalyst state intentionally not advanced."
          fi

      - name: Commit watcher state
        if: always()
        run: |
          if [ ! -f data/crypto_liquidity_watch_state.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto_liquidity_watch_state.json
          if [ -f data/samsung_wallet_stablecoin_watch_state.json ]; then
            git add data/samsung_wallet_stablecoin_watch_state.json
          fi
          if [ -f data/coinbase_stablecoin_catalyst_state.json ]; then
            git add data/coinbase_stablecoin_catalyst_state.json
          fi
          if git diff --cached --quiet; then
            echo "Crypto liquidity state unchanged"
          else
            git commit -m "Update crypto liquidity watch state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-liquidity-watch-${{ github.run_id }}
          path: |
            out/crypto_liquidity_watch_status.md
            out/crypto_liquidity_watch_telegram.txt
            out/crypto_liquidity_watch_pending_state.json
            out/crypto_liquidity_watch_telegram_confirmed.json
            out/samsung_wallet_stablecoin_status.md
            out/samsung_wallet_stablecoin_telegram.txt
            out/samsung_wallet_stablecoin_watch_pending_state.json
            out/samsung_wallet_stablecoin_telegram_confirmed.json
            out/coinbase_stablecoin_catalyst_status.md
            out/coinbase_stablecoin_catalyst_telegram.txt
            out/coinbase_stablecoin_catalyst_pending_state.json
            out/coinbase_stablecoin_catalyst_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
