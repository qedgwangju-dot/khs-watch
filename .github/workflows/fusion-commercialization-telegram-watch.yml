name: Fusion Commercialization Telegram Watch

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fusion-commercialization-telegram-watch.yml"
      - "scripts/fusion_commercialization_watch.py"

permissions:
  contents: write

concurrency:
  group: fusion-commercialization-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FUSION_WATCH_MAX_AGE_HOURS: "120"
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate watcher
        run: python -m py_compile scripts/fusion_commercialization_watch.py

      - name: Run fusion commercialization watch
        run: python scripts/fusion_commercialization_watch.py

      - name: Send new fusion change to Telegram
        if: hashFiles('out/fusion_commercialization_watch_alert.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: \${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: \${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("KHS policy Telegram token/chat id missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              me = json.loads(r.read().decode("utf-8"))
          actual = str((me.get("result") or {}).get("username") or "")
          if not me.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")

          text = pathlib.Path("out/fusion_commercialization_watch_alert.html").read_text(encoding="utf-8").strip()
          payload = json.dumps({
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
          }).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              result = json.loads(r.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected message: {result}")
          message_id = (result.get("result") or {}).get("message_id")
          if message_id is None:
              raise RuntimeError("Telegram send succeeded without message_id")
          pathlib.Path("out/fusion_commercialization_watch_telegram_confirmed.json").write_text(
              json.dumps({
                  "status": "confirmed",
                  "bot": actual,
                  "message_id": message_id,
                  "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"telegram_send_confirmed=true bot=@{actual} message_id={message_id}")
          PY

      - name: Persist state
        if: success() && hashFiles('out/fusion_commercialization_watch_pending_state.json') != '' && (hashFiles('out/fusion_commercialization_watch_alert.html') == '' || hashFiles('out/fusion_commercialization_watch_telegram_confirmed.json') != '')
        run: |
          cp out/fusion_commercialization_watch_pending_state.json data/fusion_commercialization_watch_state.json
          git config user.name "fusion-commercialization-watch[bot]"
          git config user.email "fusion-commercialization-watch[bot]@users.noreply.github.com"
          git add data/fusion_commercialization_watch_state.json
          if git diff --cached --quiet; then
            echo "Fusion watch state unchanged"
          else
            git commit -m "Update fusion commercialization watch state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Publish summary
        if: always()
        run: |
          if [ -f out/fusion_commercialization_watch_status.md ]; then
            cat out/fusion_commercialization_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-commercialization-watch-${{ github.run_id }}
          path: |
            out/fusion_commercialization_watch_status.md
            out/fusion_commercialization_watch_alert.html
            out/fusion_commercialization_watch_telegram_confirmed.json
            out/fusion_commercialization_watch_pending_state.json
          if-no-files-found: ignore
          retention-days: 14
