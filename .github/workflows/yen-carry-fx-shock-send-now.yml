name: USDJPY rapid-move immediate Telegram send

on:
  pull_request:
    paths:
      - ".github/workflows/yen-carry-fx-shock-send-now.yml"
      - "tests/yen_carry_fx_shock_send_now.txt"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"
      YEN_CARRY_FX_SHOCK_MAX_AGE_MINUTES: "20"
      KHS_SOURCE_PROXY_URL: "https://tips-yield-telegram.gustnd1.workers.dev/policy-source/fetch"
      KHS_SOURCE_PROXY_FIRST: "true"
      KHS_SOURCE_PROXY_TIMEOUT_SECONDS: "20"
      KHS_SOURCE_DIRECT_TIMEOUT_CAP_SECONDS: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check current USDJPY rapid move
        run: python scripts/yen_carry_fx_shock.py

      - name: Send current rapid-move alert through second bot
        if: hashFiles('out/yen_carry_fx_shock_alert.md') != ''
        env:
          BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          YEN_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          EXISTING_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("YEN_CHAT_ID", "").strip() or os.environ.get("EXISTING_CHAT_ID", "").strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("second bot token or chat id missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=20) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"wrong bot: expected @{expected}, got @{actual or 'unknown'}")

          title = pathlib.Path("out/yen_carry_fx_shock_alert_title.txt").read_text(encoding="utf-8").strip()
          body = pathlib.Path("out/yen_carry_fx_shock_alert.md").read_text(encoding="utf-8").strip()
          data = urllib.parse.urlencode(
              {"chat_id": chat_id, "text": f"{title}\n\n{body}"[:4096], "disable_web_page_preview": "true"}
          ).encode("utf-8")
          request = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data, method="POST")
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected message: {result}")
          message_id = result.get("result", {}).get("message_id")
          confirmed_at = dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds")
          print(f"fx_shock_delivery_confirmed=true bot=@{actual} message_id={message_id} confirmed_at_kst={confirmed_at}")
          print(pathlib.Path("out/yen_carry_fx_shock_alert.json").read_text(encoding="utf-8"))
          PY
