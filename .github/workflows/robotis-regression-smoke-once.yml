name: Temporary ROBOTIS regression-only verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/robotis-regression-smoke-once.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run actual production regression without Telegram sending
        run: |
          python -m py_compile scripts/physical_ai_watch_regression_check.py
          python scripts/physical_ai_watch_regression_check.py
          python -m unittest discover -s tests -p 'test_hbm_currency_krw_guard.py'
