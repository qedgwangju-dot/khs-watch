name: Rebellions Partner Watch Telegram

on:
  push:
    paths:
      - ".github/workflows/rebellions-partner-watch-telegram.yml"
      - "scripts/rebellions_partner_watch.py"
      - "tests/test_rebellions_partner_watch.py"
  schedule:
    # Two off-peak UTC slots; GitHub cron is best-effort and can skip runs.
    - cron: "17,47 * * * *"
  workflow_run:
    # Independent fallback when the regular cron has not fired recently.
    workflows:
      - "AI Security Web Watch"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebellions-partner-watch-telegram
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs88798879887988798879_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Decide whether this is a due run
        id: cadence
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          from zoneinfo import ZoneInfo

          event = os.environ.get("GITHUB_EVENT_NAME") or "unknown"
          should_run = True
          lag_minutes = -1
          state_path = pathlib.Path("data/rebellions_partner_watch_state.json")
          if event in {"schedule", "workflow_run"} and state_path.exists():
              try:
                  state = json.loads(state_path.read_text(encoding="utf-8"))
                  checked = dt.datetime.fromisoformat(state["last_checked_kst"])
                  if checked.tzinfo is None:
                      checked = checked.replace(tzinfo=ZoneInfo("Asia/Seoul"))
                  lag_minutes = (dt.datetime.now(ZoneInfo("Asia/Seoul")) - checked).total_seconds() / 60
                  threshold = 19 if event == "schedule" else 42
                  should_run = lag_minutes >= threshold
              except Exception as exc:
                  print(f"warning=invalid_rebellions_watch_state {type(exc).__name__}")
                  should_run = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if should_run else 'false'}\n")
          print(f"rebellions_trigger={event} state_lag_minutes={lag_minutes:.1f} execute={should_run}")
          PY

      - name: Set up Python
        if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser and Google News canonical-url resolver
        if: steps.cadence.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check beautifulsoup4 googlenewsdecoder==1.0.0

      - name: Run regression tests
        if: steps.cadence.outputs.run == 'true'
        run: |
          python -m py_compile scripts/rebellions_partner_watch.py
          python -m unittest discover -s tests -p 'test_rebellions_partner_watch.py' -v

      - name: Verify Telegram bot identity
        if: steps.cadence.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("HBM_TELEGRAM_BOT_TOKEN secret is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              data = json.loads(r.read().decode("utf-8"))
          username = str((data.get("result") or {}).get("username") or "")
          if not data.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")
          print(f"telegram_bot_verified=@{username}")
          PY

      - name: Validate same-event duplicate regression
        if: steps.cadence.outputs.run == 'true'
        run: |
          python - <<'PY'
          import datetime as dt
          from zoneinfo import ZoneInfo
          from scripts.rebellions_partner_watch import (
              classify,
              event_signature,
              find_duplicate_event,
              material_stage,
          )

          first = "한전, 리벨리온·TTA와 국산 NPU 기반 AI 영상분석 협력 - 뉴스락"
          second = "한전 변전소 AI 관제에 국산 NPU 투입...리벨리온 현장 실증 - zdnet.co.kr"

          sig1 = event_signature(first)
          sig2 = event_signature(second)
          assert sig1 == sig2, (sig1, sig2)
          assert sig1 == "kepco|npu|power_video", sig1
          assert "실증" in classify(second), classify(second)

          now = dt.datetime.now(ZoneInfo("Asia/Seoul"))
          seen = {
              "first": {
                  "title": first,
                  "url": "https://example.com/a",
                  "event_signature": sig1,
                  "material_stage": material_stage(first),
                  "first_seen_kst": now.isoformat(timespec="seconds"),
                  "pending_alert": True,
              }
          }
          item = {
              "title": second,
              "summary": "",
              "url": "https://example.com/b",
          }
          reason = find_duplicate_event(item, seen, now)
          assert reason and reason.startswith("same_event:"), reason
          print(f"rebellions_same_event_regression_ok=true signature={sig1} reason={reason}")
          PY

      - name: Check Rebellions partnerships, orders and deployments
        if: steps.cadence.outputs.run == 'true'
        run: python scripts/rebellions_partner_watch.py

      - name: Publish summary
        if: always() && steps.cadence.outputs.run == 'true'
        run: |
          if [ -f out/rebellions_partner_watch_status.md ]; then
            cat out/rebellions_partner_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send new Rebellions change to Telegram
        if: steps.cadence.outputs.run == 'true' && hashFiles('out/rebellions_partner_watch_alert.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HBM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          if not token or not chat_id:
              raise RuntimeError("HBM Telegram token/chat id secret is missing")

          text = pathlib.Path("out/rebellions_partner_watch_alert.md").read_text(encoding="utf-8").strip()

          def split_message(value, limit=3900):
              chunks, current = [], ""
              for paragraph in value.split("\n\n"):
                  candidate = paragraph if not current else current + "\n\n" + paragraph
                  if len(candidate) <= limit:
                      current = candidate
                      continue
                  if current:
                      chunks.append(current)
                  current = paragraph
              if current:
                  chunks.append(current)
              return chunks

          message_ids = []
          for idx, chunk in enumerate(split_message(text), start=1):
              if idx > 1:
                  chunk = f"리벨리온 협력 웹감시 (계속 {idx})\n\n{chunk}"
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=25) as r:
                  result = json.loads(r.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              message_ids.append(result.get("result", {}).get("message_id"))

          pathlib.Path("out/rebellions_partner_watch_telegram_confirmed.json").write_text(
              json.dumps({
                  "status": "confirmed",
                  "message_ids": message_ids,
                  "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"telegram_delivery_confirmed=true message_ids={message_ids}")
          PY

      - name: Persist watch state
        if: success() && steps.cadence.outputs.run == 'true' && hashFiles('out/rebellions_partner_watch_pending_state.json') != '' && (hashFiles('out/rebellions_partner_watch_alert.md') == '' || hashFiles('out/rebellions_partner_watch_telegram_confirmed.json') != '')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other alerts frequently update main; merge the pending event set with the
          # newest remote state and retry non-fast-forward pushes without losing events.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import datetime as dt
          import json
          import pathlib

          target = pathlib.Path("data/rebellions_partner_watch_state.json")
          pending = json.loads(pathlib.Path("out/rebellions_partner_watch_pending_state.json").read_text(encoding="utf-8"))
          remote = json.loads(target.read_text(encoding="utf-8")) if target.exists() else {}
          seen = dict(remote.get("seen") or {})
          for key, item in (pending.get("seen") or {}).items():
              old = seen.get(key)
              if old and old.get("alerted") and not item.get("alerted"):
                  continue
              seen[key] = item
          seen = dict(list(seen.items())[-800:])
          result = {**remote, **pending, "seen": seen, "initialized": True}
          remote_time = str(remote.get("last_checked_kst") or "")
          pending_time = str(pending.get("last_checked_kst") or "")
          result["last_checked_kst"] = max(remote_time, pending_time)
          result["bootstrap_kst"] = remote.get("bootstrap_kst") or pending.get("bootstrap_kst")
          target.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"rebellions_merged_state_keys={len(seen)}")
          PY
            git add data/rebellions_partner_watch_state.json
            if git diff --cached --quiet; then
              echo "Rebellions watch state unchanged"
              exit 0
            fi
            git commit -m "Update Rebellions partner watch state [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "State push conflict; will refresh and retry attempt $attempt" >&2
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebellions-partner-watch-${{ github.run_id }}
          path: |
            out/rebellions_partner_watch_status.md
            out/rebellions_partner_watch_alert.md
            out/rebellions_partner_watch_telegram_confirmed.json
            out/rebellions_partner_watch_pending_state.json
          if-no-files-found: ignore
          retention-days: 14
