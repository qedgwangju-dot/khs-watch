name: AI Security Web Watch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ai-security-web-watch.yml"
      - "scripts/ai_security_web_watch.py"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    workflows:
      - "Wonyotti 90D Thesis Telegram Watch"
      - "Rubin HBM Telegram Watch"
    types: [completed]
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a Telegram connection test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

# Never terminate an already-running Telegram send/checkpoint sequence.
# New runs queue behind it and re-check the committed duplicate state.
concurrency:
  group: ai-security-web-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AI_SECURITY_TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_AI_POLICY_TELEGRAM_BOT_TOKEN }}
      CONFIGURED_AI_SECURITY_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      EXPECTED_AI_SECURITY_BOT_USERNAMES: "khs88798879_bot,hs88798879_bot"
      AI_SECURITY_SEND_CONNECTION_TEST_ON_PUSH: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and verify Telegram route
        id: telegram
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$AI_SECURITY_TELEGRAM_BOT_TOKEN" ]; then
            echo "AI security Telegram token is missing." >&2
            exit 1
          fi
          python - <<'PY'
          import json, os, pathlib, time, urllib.error, urllib.request
          def route_json(url, *, opener=urllib.request.urlopen, sleep=time.sleep):
              """Retry only transient Telegram transport errors; never bypass identity checks."""
              for attempt in range(3):
                  try:
                      with opener(url, timeout=25) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      if exc.code not in {429, 500, 502, 503, 504} or attempt == 2:
                          raise
                  except (urllib.error.URLError, TimeoutError, OSError, ValueError):
                      if attempt == 2:
                          raise
                  sleep(1 << attempt)
              raise RuntimeError("Telegram route request exhausted")

          if os.getenv("GITHUB_EVENT_NAME") == "push":
              class _FakeResponse:
                  def __enter__(self): return self
                  def __exit__(self, *args): return False
                  def read(self): return b'{"ok":true,"result":{"username":"test"}}'
              _tries = {"n": 0}
              def _flaky(url, timeout):
                  _tries["n"] += 1
                  if _tries["n"] < 3:
                      raise TimeoutError("synthetic Telegram timeout")
                  return _FakeResponse()
              assert route_json("https://example.invalid", opener=_flaky, sleep=lambda _: None)["ok"]
              assert _tries["n"] == 3
              print("ai_security_telegram_route_retry_regression=true attempts=3")

          token = os.environ["AI_SECURITY_TELEGRAM_BOT_TOKEN"].strip()
          configured_chat = (os.environ.get("CONFIGURED_AI_SECURITY_TELEGRAM_CHAT_ID") or "").strip()
          expected = {x.strip().lstrip("@").lower() for x in (os.environ.get("EXPECTED_AI_SECURITY_BOT_USERNAMES") or "").split(",") if x.strip()}
          identity = route_json(f"https://api.telegram.org/bot{token}/getMe")
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or not actual:
              raise RuntimeError("Telegram getMe failed")
          if expected and actual.lower() not in expected:
              raise RuntimeError(f"Wrong Telegram bot: expected one of {sorted(expected)}, got @{actual}")
          chat_id = configured_chat
          route = "secret"
          if not chat_id:
              updates = route_json(f"https://api.telegram.org/bot{token}/getUpdates?limit=100&timeout=0")
              candidates = []
              for upd in updates.get("result") or []:
                  msg = upd.get("message") or upd.get("edited_message") or {}
                  chat = msg.get("chat") or {}
                  if str(chat.get("type") or "") == "private" and chat.get("id") is not None:
                      candidates.append((int(upd.get("update_id") or 0), str(chat["id"])))
              if candidates:
                  candidates.sort()
                  chat_id = candidates[-1][1]
                  route = "getUpdates"
          if not chat_id:
              raise RuntimeError("Telegram chat_id could not be resolved")
          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write(f"bot_username={actual}\n")
              f.write(f"chat_id={chat_id}\n")
              f.write(f"chat_route={route}\n")
          print(f"ai_security_bot_verified=@{actual}")
          print(f"ai_security_chat_resolved=true route={route}")
          PY

      - name: Validate watcher
        run: python -m py_compile scripts/ai_security_web_watch.py

      - name: Verify Korean alert translation on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import re
          from scripts.ai_security_web_watch import translate_alert_text
          sample = "GLM-5.3 and the spread of advanced cyber capabilities"
          translated = translate_alert_text(sample)
          print(f"ai_security_translation_sample={translated}")
          if not re.search(r"[가-힣]", translated):
              raise RuntimeError("Korean translation smoke test failed")
          if "GLM-5.3" not in translated:
              raise RuntimeError("Model identifier was not preserved")
          PY

      - name: Verify frontier accord security classification on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from scripts.ai_security_web_watch import detect_category, event_impact

          cases = [
              (
                  "JPMorgan CEO Jamie Dimon said risks from AI went up 10-fold after Anthropic Mythos, raising financial sector cyber risk",
                  "금융·핵심인프라 AI 사이버 위험 경보",
              ),
              (
                  "Anthropic expanded the Cyber Verification Program with Claude Mythos and reduced blocking classifiers for vetted red teams",
                  "프런티어 모델 사이버 역량·접근 확대",
              ),
              (
                  "Project Glasswing identified 129,000 verified software vulnerabilities including 33,000 critical or high severity",
                  "대규모 취약점 발굴·검증",
              ),
              (
                  "White House Accord on Super Intelligence external audit found security control failure and unauthorized access",
                  "공동서약·외부감사 보안실패",
              ),
              (
                  "independent board oversight board ordered pause of frontier model deployment",
                  "이사회·감독기구 중단명령",
              ),
          ]
          for text, expected in cases:
              actual = detect_category(text)
              print(f"ai_security_accord_case={expected} actual={actual}")
              if actual != expected:
                  raise RuntimeError(f"Accord security category mismatch: expected={expected} actual={actual}")
          if "외부감사" not in event_impact([{"category":"공동서약·외부감사 보안실패"}]):
              raise RuntimeError("Accord audit impact text missing")
          if "중단" not in event_impact([{"category":"이사회·감독기구 중단명령"}]):
              raise RuntimeError("Accord oversight impact text missing")
          PY

      - name: Verify incident versus program separation
        shell: bash
        run: |
          python - <<'PY'
          from unittest.mock import patch
          from scripts.ai_security_web_watch import (
              clean_official_headline_prefix, detect_category, material,
              is_policy_program_announcement, translate_alert_text,
              normalize_item, incident_fact,
          )

          mission = {
              "kind": "official_direct",
              "title": "Anthropic News: anthropic cyber mission",
              "description": "Anthropic News: anthropic cyber mission",
              "source": "Anthropic News",
              "url": "https://www.anthropic.com/news/anthropic-cyber-mission",
          }
          if not is_policy_program_announcement(mission) or material(mission):
              raise RuntimeError("Anthropic Cyber Mission launch routed as an incident")

          other_news = {
              **mission,
              "title": "Anthropic News: new critical vulnerability and patch",
              "description": "Anthropic News: a critical vulnerability was patched",
              "url": "https://www.anthropic.com/news/critical-vulnerability-patched",
          }
          if is_policy_program_announcement(other_news) or not material(other_news):
              raise RuntimeError("Actual official security event was suppressed")

          generic_news = {
              **mission,
              "title": "Anthropic News: new cyber defense partner program",
              "description": "Announcing a free security initiative",
              "url": "https://www.anthropic.com/news/defense-program",
          }
          if material(generic_news):
              raise RuntimeError("Generic cyber partnership was classified as an incident")

          incident_report = {
              "kind": "official_direct",
              "title": "Anthropic Research: investigating unintended model actions",
              "description": "Evaluations and internal use of Claude",
              "source": "Anthropic Research",
              "url": "https://www.anthropic.com/research/investigating-unintended-model-actions",
          }
          parsed = normalize_item(incident_report)
          if not material(parsed):
              raise RuntimeError("Anthropic primary October 9 incident report was missed")
          if parsed["category"] != "모델 비의도적 외부접근·사고 공개":
              raise RuntimeError(f"Primary incident misclassified: {parsed['category']}")
          fact = incident_fact(parsed) or ""
          if not all(part in fact for part in ("Anthropic", "양식 제출", "접근 제한 우회")):
              raise RuntimeError(f"Primary source event lost substantive details: {fact}")
          if "시정 완료" in parsed["category"] or "시정 완료" in fact:
              raise RuntimeError("Disclosure alone cannot establish completed remediation")
          remediated = {
              "kind": "news",
              "title": "Anthropic AI model incident remediated after security access error",
              "description": "The company said remediation completed and affected parties notified",
              "source": "Reuters",
              "url": "https://example.com/new-incident-update",
          }
          fixed = normalize_item(remediated)
          if not material(fixed) or fixed["category"] != "AI 모델사고 신고·시정 후속조치":
              raise RuntimeError("Concrete model-incident remediation update was missed")
          if "시정 완료 발표" not in (incident_fact(fixed) or ""):
              raise RuntimeError("Completed-remediation statement not distinguished")
          notification_only = {
              **remediated,
              "title": "Anthropic AI model incident reported to authorities",
              "description": "Affected parties notified; remediation remains underway",
          }
          notified = normalize_item(notification_only)
          notified_fact = incident_fact(notified) or ""
          if not material(notified) or "통지 발표" not in notified_fact or "시정 완료 발표" in notified_fact:
              raise RuntimeError("Disclosure was confused with completed remediation")
          print("ai_security_reporting_remediation_regression=PASS")
          print("ai_security_primary_incident_report_regression=PASS")

          headline = clean_official_headline_prefix(
              "Anthropic News: Introducing the Anthropic Cyber Mission"
          )
          if headline != "Introducing the Anthropic Cyber Mission":
              raise RuntimeError("Official news headline prefix was not removed")

          with patch(
              "scripts.ai_security_web_watch._translate_google",
              return_value="사이버 보안 전략 발표",
          ):
              result = translate_alert_text(
                  "Anthropic News: Anthropic reveals its cyber mission"
              )
          print(f"ai_security_proper_name_sample={result}")
          if "Anthropic" not in result or "인류학" in result or "Anthropic News:" in result:
              raise RuntimeError("Anthropic proper name translation regression")

          if detect_category("generic Anthropic Cyber Mission") == "취약점·패치":
              raise RuntimeError("Generic cyber announcement mislabeled as vulnerability")
          print("ai_security_incident_program_regression=PASS")
          PY

      - name: Test OpenAI insider case and stage safeguards
        shell: bash
        run: |
          python - <<'PY'
          from scripts.ai_security_web_watch import (
              detect_category, incident_fact, is_openai_insider_case,
              material, openai_insider_case_stage, source_official, severity,
              legal_primary_source,
          )
          base = {
              "kind": "news", "source": "Reuters",
              "title": "OpenAI engineer Abdulrahman Alfozan arrested over alleged office listening device",
              "description": "OpenAI says there is no indication of theft of model weights or customer data. If convicted, he faces a prison term.",
              "url": "https://www.reuters.com/example",
              "published_at": "2026-10-13T20:00:00+00:00",
          }
          assert source_official("U.S. Department of Justice")
          assert source_official("U.S. Attorney's Office")
          assert is_openai_insider_case(base) and material(base)
          assert detect_category(base["title"]) == "AI 연구기관 내부자 도청·접근통제 사건"
          assert openai_insider_case_stage(base) == "initial_oct13_charge"
          assert severity(base["title"]+" "+base["description"]) == (2, "높음")
          assert source_official("DOJ") and source_official("FBI")
          fact = incident_fact(base)
          if "혐의" not in fact or "유출 확정 아님" not in fact:
              raise AssertionError("OpenAI charge incorrectly treated as conviction/theft")

          court = dict(base)
          court["title"] = "Alfozan appeared at detention hearing on October 19"
          court["description"] = "OpenAI hearing held after the original complaint"
          court["published_at"] = "2026-10-19T18:00:00+00:00"
          assert openai_insider_case_stage(court) == "oct19_hearing_result"
          assert material(court), "Alfozan hearing coverage lacks AI keyword but must be monitored"
          scheduled = dict(base)
          scheduled["title"] = "Alfozan scheduled for detention hearing October 19"
          assert openai_insider_case_stage(scheduled) == "initial_oct13_charge"

          loss = dict(base)
          loss["title"] = "OpenAI Alfozan case: no evidence of stolen model weights"
          assert openai_insider_case_stage(loss) == "initial_oct13_charge"
          unrelated = dict(base)
          unrelated["title"] = "OpenAI confirms no evidence of stolen model weights"
          unrelated["description"] = "General unrelated security update"
          assert openai_insider_case_stage(unrelated) is None
          verdict = dict(base)
          verdict["title"] = "Alfozan found guilty in OpenAI wiretapping case"
          verdict["description"] = ""
          assert openai_insider_case_stage(verdict) == "court_verdict"
          assert legal_primary_source("U.S. Attorney's Office")
          assert legal_primary_source("U.S. Department of Justice")
          assert not legal_primary_source("Reuters")
          assert not legal_primary_source("OpenAI")
          assert not legal_primary_source("Google Security Blog")

          acquisition = {
              "title": "OpenAI in early talks to acquire Trail of Bits",
              "description": "Security startup finds software vulnerabilities",
              "source": "The Information",
              "url": "https://www.theinformation.com/example",
          }
          if material(acquisition):
              raise AssertionError("Security M&A was mislabeled as a security incident")
          # Corporate LOIs and CNBC discussion must not create a duplicate breach
          # alert; an independently confirmed new incident still must pass.
          cohere_loi = {
              "kind": "news",
              "title": "Cohere and AISLE sign letter of intent to advance AI cyber defense",
              "description": "Cohere proposes acquiring AISLE, not an actual cyber breach",
              "source": "Cohere",
              "url": "https://cohere.com/blog/cohere-and-aisle-sign-letter-of-intent-to-advance-cyber-resilient-sovereign-ai",
          }
          assert not material(cohere_loi), "Cohere-AISLE LOI replayed as incident"
          cohere_cnbc = dict(
              cohere_loi, source="CNBC",
              title="OpenAI Hugging Face breach is a great example, says Cohere CEO",
              description="Cohere CEO on Squawk on the Street discusses the AISLE acquisition and rogue agents",
          )
          assert not material(cohere_cnbc), "Cohere M&A interview replayed as incident"
          cohere_signed = dict(
              cohere_loi, title="Cohere signs definitive acquisition agreement with AISLE"
          )
          assert not material(cohere_signed), "Corporate signing became cyber breach"
          cohere_incident = dict(
              cohere_loi,
              title="Cohere and AISLE report confirmed new breach involving AI agents",
              description="Confirmed AI agent security incident with unauthorized access and credential theft",
              source="Reuters",
          )
          assert material(cohere_incident), "Actual AI security incident lost in M&A exclusion"
          print("ai_security_cohere_aisle_business_vs_incident=PASS")
          print("ai_security_insider_case_regression=PASS")
          PY

      - name: Verify AI self-replication research and incident stages
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          from scripts.ai_security_web_watch import (
              REPLICATION_REFERENCE_URL, UTC, build_alert, incident_fact,
              is_known_replication_research_baseline, material,
              normalize_item, replication_stage,
          )

          paper = {
              "kind": "official_direct",
              "title": "Anthropic Research: self replicating ai",
              "description": "Controlled laboratory evaluation, no wild infections demonstrated",
              "source": "Anthropic Research",
              "url": REPLICATION_REFERENCE_URL,
              "published_at": "2026-10-12T00:00:00+00:00",
          }
          entry = normalize_item(paper)
          assert material(entry), "Official research must be indexed"
          assert replication_stage(entry) == "research"
          assert is_known_replication_research_baseline(entry), "Existing paper must remain a baseline"
          assert entry["category"] == "AI 자율복제·사물인터넷 모의평가"
          assert entry["severity"] == 1 and entry["severity_label"] == "주의"
          assert "실제 인터넷 감염 확인 아님" in incident_fact(entry)

          old_article = {
              "kind": "news",
              "title": "Anthropic warns self-replicating AI may soon infect IoT devices",
              "description": "9B model ran on 8 of 9 hardware types. No worm in the wild.",
              "source": "Reuters",
              "url": "https://www.reuters.com/example-lab-report",
              "published_at": "2026-10-13T00:00:00+00:00",
          }
          normalized_old = normalize_item(old_article)
          assert material(normalized_old)
          assert replication_stage(normalized_old) == "research"
          assert is_known_replication_research_baseline(normalized_old)
          assert normalized_old["severity"] == 1

          # Regression for the real 2026-10-14 failure: four reprints of one
          # 2026-10-12 research paper must not become four fresh alerts.
          reprints = [
              ("Dark Reading", "Anthropic Finds Ingredients for Future AI Worms"),
              ("BleepingComputer", "Anthropic warns self-replicating AI could spread to your smart devices"),
              ("Reuters", "Anthropic warns AI models may soon self-replicate and could wreak havoc on the web"),
              ("The Guardian", "AI in your oven? Anthropic warns models months away from self-replication on smart devices"),
          ]
          for i, (source, headline) in enumerate(reprints):
              candidate = {
                  "kind": "news",
                  "title": headline,
                  "description": "Laboratory study and forecasts; no observed wild infections.",
                  "source": source,
                  "url": "https://example.com/anthropic-reprint-" + str(i),
                  "published_at": "2026-10-14T00:00:00+00:00",
              }
              normalized = normalize_item(candidate)
              if not material(normalized) or replication_stage(normalized) != "research":
                  raise RuntimeError(f"Known study coverage not recognized: {source}")
              if not is_known_replication_research_baseline(normalized):
                  raise RuntimeError(f"Known paper coverage would repeat as new alert: {source}")
          print("ai_security_replication_four_outlet_reprints=PASS")

          next_research = {
              **paper,
              "url": "https://www.anthropic.com/research/follow-up-iot-self-replication",
              "title": "Anthropic Research: follow-up self-replicating IoT controlled trial",
              "description": "Independent new controlled research on model replication",
          }
          if not material(next_research) or is_known_replication_research_baseline(next_research):
              raise RuntimeError("Different future first-party study must remain discoverable")

          verified = {
              "kind": "official",
              "title": "CISA confirms AI worm detected in the wild",
              "description": "Confirmed active self-replication of an AI model across IoT devices",
              "source": "CISA",
              "url": "https://www.cisa.gov/example-new-advisory",
              "published_at": "2026-10-15T00:00:00+00:00",
          }
          n_verified = normalize_item(verified)
          spoofed = {
              **verified,
              "kind": "news",
              "url": "https://news.google.com/rss/articles/fake",
              "source": "CISA",
              "publisher_url": "https://not-cisa.example.invalid",
          }
          n_spoofed = normalize_item(spoofed)
          if replication_stage(n_spoofed) != "reported_field" or n_spoofed["severity"] != 2:
              raise RuntimeError("Spoofed RSS publisher was treated as official incident")
          official_feed = {
              **spoofed,
              "publisher_url": "https://www.cisa.gov/",
          }
          if replication_stage(official_feed) != "confirmed_field":
              raise RuntimeError("Official CISA publisher attribution was missed")
          assert material(n_verified)
          assert replication_stage(n_verified) == "confirmed_field"
          assert n_verified["severity"] == 3 and n_verified["severity_label"] == "긴급"
          assert n_verified["category"] == "AI 자율복제·실제 감염 확인"
          assert not is_known_replication_research_baseline(n_verified)

          reported = dict(verified, kind="news", source="Reuters")
          n_reported = normalize_item(reported)
          assert replication_stage(n_reported) == "reported_field"
          assert n_reported["severity"] == 2
          assert "추가검증" in n_reported["category"]

          negated = dict(
              verified,
              title="CISA research: no AI worm detected in the wild",
              description="AI model self-replication not observed in real deployments",
          )
          n_negated = normalize_item(negated)
          assert replication_stage(n_negated) == "research"
          assert n_negated["severity"] == 1

          controlled = dict(
              verified,
              title="Controlled evaluation confirms active self-replication in an AI worm simulation",
              description="Laboratory sandbox, no real-world infection observed",
          )
          n_controlled = normalize_item(controlled)
          if replication_stage(n_controlled) != "research" or n_controlled["severity"] != 1:
              raise RuntimeError("Controlled AI worm test was mistaken for an active field infection")

          unrelated = dict(
              verified,
              title="Traditional software worm affected IoT routers",
              description="Ordinary botnet malware, no AI model involved",
          )
          assert replication_stage(unrelated) is None
          assert not material(unrelated)

          title, body = build_alert([[entry]], dt.datetime(2026, 10, 14, 0, 0, tzinfo=UTC))
          assert "모의평가" in title + body
          assert "실제 인터넷 감염 확인 아님" in body
          print("ai_security_replication_lab_vs_field=PASS")
          print("ai_security_replication_known_study_baseline=PASS")
          print("ai_security_replication_alert_language=PASS")
          PY

      - name: Verify PHP2Shell patch and real-world exploitation stages
        shell: bash
        run: |
          python - <<'PY'
          from scripts.ai_security_web_watch import (
              PHP_CRITICAL_CVES, build_alert, cluster_alert_events,
              incident_fact, material, normalize_item, php_critical_stage,
              same_event,
          )
          import datetime as dt
          patch = {
              "kind": "official",
              "query": "PHP official security bulletin",
              "title": "PHP security release fixes CVE-2026-109618 and CVE-2026-109619",
              "description": "PHP 8.5.12 8.4.27 8.3.36 8.2.35 fixes unauthenticated remote code execution",
              "source": "PHP Security Team",
              "url": "https://www.php.net/archive/2026.php#2026-10-21-5",
          }
          normalized = normalize_item(patch)
          assert material(normalized), "PHP CVE without an AI keyword was dropped"
          assert php_critical_stage(normalized) == "patch_released"
          assert normalized["severity"] == 3 and normalized["vendor"] == "PHP 재단"
          assert "실전 악용 확정 아님" in incident_fact(normalized)
          assert len(PHP_CRITICAL_CVES) == 2
          reprint = normalize_item({
              **patch, "kind": "news", "source": "Reuters",
              "title": "PHP security release fixes CVE-2026-109618 and CVE-2026-109619 - Reuters",
              "url": "https://example.org/reprint",
          })
          assert material(reprint) and same_event(normalized, reprint)
          groups = cluster_alert_events([normalized, reprint])
          assert len(groups) == 1 and len(groups[0]) == 2
          rumor = normalize_item({
              **patch, "kind": "news", "source": "Unknown Blog",
              "title": "PHP vulnerabilities actively exploited in the wild CVE-2026-109618",
          })
          assert not material(rumor), "Unknown publisher was trusted"
          no_wild = normalize_item({
              **patch, "kind": "news", "source": "Reuters",
              "title": "No active exploitation found for php2shell CVE-2026-109618",
          })
          assert php_critical_stage(no_wild) != "reported_exploitation"
          reported = normalize_item({
              **patch, "kind": "news", "source": "Reuters",
              "title": "PHP CVE-2026-109618 actively exploited in the wild",
          })
          assert material(reported)
          assert php_critical_stage(reported) == "reported_exploitation"
          assert reported["category"] != normalized["category"]
          confirmed = normalize_item({
              **patch, "source": "CISA", "query": "CISA KEV",
              "title": "PHP CVE-2026-109618 added to exploited vulnerabilities",
          })
          assert php_critical_stage(confirmed) == "confirmed_exploitation"
          assert confirmed["category"] != reported["category"]
          assert len(cluster_alert_events([normalized, reported, confirmed])) == 3
          title, body = build_alert([[normalized]], dt.datetime(2026, 10, 22, tzinfo=dt.timezone.utc))
          assert all(v in title + body for v in ("CVE-2026-109618", "8.5.12", "실전 악용 확정 아님"))
          followup = normalize_item({
              "kind": "official",
              "title": "PHP informational advisory CVE-2026-115560 session upload progress unpatched",
              "description": "Separate RCE risk CVE-2026-115560. Next regular release to provide full fix",
              "source": "PHP Security Team",
              "url": "https://www.php.net/archive/2026.php#2026-10-23-1",
          })
          assert material(followup) and followup["severity"] == 2
          assert php_critical_stage(followup) == "session_advisory"
          assert "정기 수정 대기" in incident_fact(followup)
          misleading = normalize_item({
              **followup, "kind": "news", "source": "The Hacker News",
              "title": "PHP Warns of Another Unpatched RCE Two Days After Emergency PHP2Shell Patches",
          })
          assert php_critical_stage(misleading) == "session_advisory"
          eventual_patch = normalize_item({
              **followup, "title": "PHP security release fixes CVE-2026-115560",
          })
          assert php_critical_stage(eventual_patch) == "session_patch_released"
          assert len(cluster_alert_events([followup, eventual_patch])) == 2
          exploitation = normalize_item({
              **followup, "kind": "news", "source": "Reuters",
              "title": "PHP CVE-2026-115560 actively exploited in the wild",
          })
          assert php_critical_stage(exploitation) == "session_exploitation_reported"
          attempt_count = normalize_item({
              **patch, "kind": "news", "source": "Reuters",
              "title": "PHP2Shell 10 million attack attempts recorded by Cloudflare",
          })
          assert php_critical_stage(attempt_count) == "attempts_10m_reported"
          assert "실제 침해 성공 건수와 다름" in incident_fact(attempt_count)
          assert php_critical_stage({
              **patch, "title": "PHP2Shell remains unpatched in old unsupported versions",
          }) == "initial_disclosure"
          print("ai_security_php2shell_stage_and_dedup_regression=PASS")
          print("ai_security_php_followup_and_attack_attempts_regression=PASS")
          PY

      - name: Verify security research vs crime and event-stage dedup
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from scripts.ai_security_web_watch import (
              SECURITY_REFERENCE_EVENTS, cluster_alert_events, incident_fact,
              material, normalize_item, same_event, security_case_key,
              security_case_publisher_verified,
          )
          expected = [
              "anthropic_cathedral:research_access_disclosed_20261026",
              "claude_georgia:paid_aggregate_data_access_20261025",
              "artex_storm0940:microsoft_campaign_disclosed_20261021",
              "artex_korea_820m:police_referral_reported_20261026",
              "php_cyfirma_scanning:216_hosts_21_nodes_assessed_20261024",
          ]
          rows = [normalize_item(dict(x)) for x in SECURITY_REFERENCE_EVENTS]
          assert [security_case_key(x) for x in rows] == expected
          assert all(material(x) and security_case_publisher_verified(x) for x in rows)
          assert [x["severity"] for x in rows] == [2, 2, 3, 3, 2]
          assert len(cluster_alert_events(rows)) == 5
          assert not same_event(rows[2], rows[3]), "Storm-0940 and Korean criminal suspects conflated"
          assert not same_event(rows[0], rows[1]), "Research access and Georgia paywall conflated"
          assert "모델 가중치" in incident_fact(rows[0])
          assert "개별 투표 기록" in incident_fact(rows[1])
          assert "820만건" in incident_fact(rows[3])
          assert "중간" in incident_fact(rows[4])
          for i in range(len(rows)):
              spoof = dict(SECURITY_REFERENCE_EVENTS[i])
              spoof["publisher_url"] = "https://evil.example.org/news"
              assert not material(normalize_item(spoof)), f"Brand spoof accepted: {i}"
          reprint = dict(SECURITY_REFERENCE_EVENTS[0])
          reprint["url"] = "https://www.washingtonpost.com/technology/2026/10/26/other-story/"
          reprint["title"] = "Cathedral Anthropic security test: researchers in business systems"
          assert same_event(normalize_item(reprint), rows[0])
          speculative = normalize_item({
              "kind":"news", "source":"Unknown blog",
              "title":"Cathedral claims Anthropic attacked in 12 hours",
              "description":"The Cathedral Anthropic AI security claim is unverified",
              "url":"https://unverified.example.net/",
              "publisher_url":"https://unverified.example.net/",
          })
          assert not material(speculative)
          print("ai_security_research_crime_source_stage_dedup_regression=PASS")
          PY

      - name: Verify alert overflow deferral
        shell: bash
        run: |
          python - <<'PY'
          from scripts.ai_security_web_watch import (
              MAX_ALERT_ITEMS, cluster_alert_events, deferred_alert_fingerprints,
          )
          items = [
              {
                  "fingerprint": f"alert-overflow-{i}",
                  "vendor": f"DistinctVendor{i}",
                  "category": "취약점·패치",
                  "title": f"Independent security incident {i}",
                  "description": "Separate company and independent security issue",
                  "severity": 2,
                  "official": True,
                  "published_at": "2026-10-14T00:00:00+00:00",
              }
              for i in range(MAX_ALERT_ITEMS + 2)
          ]
          selected = cluster_alert_events(items)
          deferred = deferred_alert_fingerprints(items, selected)
          assert len(selected) == MAX_ALERT_ITEMS
          assert deferred == {
              f"alert-overflow-{i}" for i in range(MAX_ALERT_ITEMS, MAX_ALERT_ITEMS + 2)
          }
          sent_fps = {i["fingerprint"] for group in selected for i in group}
          assert not (deferred & sent_fps)
          second_round = [i for i in items if i["fingerprint"] in deferred]
          assert len(cluster_alert_events(second_round)) == 2
          assert deferred_alert_fingerprints(
              items[:MAX_ALERT_ITEMS], cluster_alert_events(items[:MAX_ALERT_ITEMS])
          ) == set()
          print("ai_security_alert_overflow_deferral=PASS")
          PY

      - name: Run live web security watch
        run: |
          rm -f out/ai_security_web_watch_alert_title.txt out/ai_security_web_watch_alert.md out/ai_security_web_watch_telegram_confirmed.json
          python scripts/ai_security_web_watch.py
          cat out/ai_security_web_watch_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build optional Telegram connection test
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.send_test == 'true') || (github.event_name == 'push' && env.AI_SECURITY_SEND_CONNECTION_TEST_ON_PUSH == 'true')
        run: |
          mkdir -p out
          cat > out/ai_security_web_watch_connection_test.txt <<'EOF'
          ⚠️ <b>AI 보안 웹감시 · 표시 형식 테스트</b>

          <b>OpenAI · 데이터·개인정보</b>
          • ChatGPT 사용자 이미지 53건 외부 업로드
          • <b>판정</b>: 사용자 데이터·외부 시스템 영향 범위를 추가 확인 중
          • <b>확인</b>: 공식 원천 + 복수 신뢰보도

          🔗 <a href="https://openai.com/hugging-face-incident-and-misalignment">OpenAI 원문</a>

          <b>다음 확인</b>: 추가 피해 · 영향 범위 · 완화책
          EOF

      - name: Send Telegram alerts
        env:
          AI_SECURITY_TELEGRAM_CHAT_ID: ${{ steps.telegram.outputs.chat_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token = os.environ["AI_SECURITY_TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["AI_SECURITY_TELEGRAM_CHAT_ID"].strip()
          alert_path = pathlib.Path("out/ai_security_web_watch_alert.md")
          test_path = pathlib.Path("out/ai_security_web_watch_connection_test.txt")

          def chunks(text, max_len=3800):
              text = text.strip()
              out = []
              while len(text) > max_len:
                  cut = text.rfind("\n\n", 0, max_len)
                  if cut < 900:
                      cut = text.rfind("\n", 0, max_len)
                  if cut < 900:
                      cut = max_len
                  out.append(text[:cut].strip())
                  text = text[cut:].strip()
              if text:
                  out.append(text)
              return out

          files = [p for p in (test_path, alert_path) if p.exists() and p.read_text(encoding="utf-8").strip()]
          message_ids = []
          for path in files:
              title_path = pathlib.Path("out/ai_security_web_watch_alert_title.txt")
              text = path.read_text(encoding="utf-8").strip()
              if path == alert_path and title_path.exists():
                  text = title_path.read_text(encoding="utf-8").strip() + "\n\n" + text
              for chunk in chunks(text):
                  data = urllib.parse.urlencode({"chat_id": chat_id, "text": chunk, "parse_mode": "HTML", "disable_web_page_preview": "true"}).encode("utf-8")
                  req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data, method="POST")
                  last_error = None
                  result = None
                  for attempt in range(1, 4):
                      try:
                          with urllib.request.urlopen(req, timeout=30) as resp:
                              result = json.loads(resp.read().decode("utf-8"))
                          if result.get("ok"):
                              break
                          last_error = RuntimeError(f"Telegram send failed: {result}")
                      except Exception as exc:
                          last_error = exc
                      if attempt < 3:
                          import time
                          time.sleep(attempt * 3)
                  if not result or not result.get("ok"):
                      raise RuntimeError(f"Telegram send failed after 3 attempts: {last_error}")
                  message_id = (result.get("result") or {}).get("message_id")
                  if message_id is None:
                      raise RuntimeError("Telegram send succeeded without message_id")
                  message_ids.append({"file": path.name, "message_id": message_id})

          if alert_path.exists():
              if not message_ids:
                  raise RuntimeError("Alert existed but no Telegram message was sent")
              pathlib.Path("out/ai_security_web_watch_telegram_confirmed.json").write_text(
                  json.dumps({"status": "confirmed", "bot_username": "${{ steps.telegram.outputs.bot_username }}", "messages": message_ids}, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          print(f"ai_security_telegram_messages_sent={len(message_ids)}")
          PY

      - name: Finalize state after no-alert or confirmed delivery
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f out/ai_security_web_watch_pending_state.json ]; then
            echo "Pending state missing" >&2
            exit 1
          fi
          if [ -f out/ai_security_web_watch_alert.md ] && [ ! -f out/ai_security_web_watch_telegram_confirmed.json ]; then
            echo "Alert state not consumed because Telegram delivery is unconfirmed" >&2
            exit 1
          fi
          cp out/ai_security_web_watch_pending_state.json data/ai_security_web_watch_state.json

      - name: Commit watch state
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cp data/ai_security_web_watch_state.json "$tmpdir/ai_security_web_watch_state.json"
          git config user.name "ai-security-web-watch[bot]"
          git config user.email "ai-security-web-watch[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp "$tmpdir/ai_security_web_watch_state.json" data/ai_security_web_watch_state.json
            git add data/ai_security_web_watch_state.json
            if git diff --cached --quiet; then
              echo "AI security watch state unchanged"
              exit 0
            fi
            git commit -m "Update AI security web watch state"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "AI security watch state save failed after retries" >&2
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-web-watch-${{ github.run_id }}
          path: |
            out/ai_security_web_watch_status.md
            out/ai_security_web_watch_alert_title.txt
            out/ai_security_web_watch_alert.md
            out/ai_security_web_watch_pending_state.json
            out/ai_security_web_watch_telegram_confirmed.json
            out/ai_security_web_watch_connection_test.txt
          if-no-files-found: ignore
          retention-days: 14
