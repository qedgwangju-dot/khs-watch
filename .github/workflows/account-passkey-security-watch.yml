name: Account Passkey Security Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/account-passkey-security-watch.yml"
      - "scripts/account_passkey_security_watch.py"
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send one Telegram formatting/route test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: account-passkey-security-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_AI_POLICY_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      EXPECTED_TELEGRAM_BOT_USERNAMES: "khs88798879_bot,hs88798879_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and verify Telegram route
        id: telegram
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request
          token=(os.environ.get("TELEGRAM_BOT_TOKEN") or "").strip()
          configured=(os.environ.get("TELEGRAM_CHAT_ID") or "").strip()
          expected={x.strip().lstrip("@").lower() for x in (os.environ.get("EXPECTED_TELEGRAM_BOT_USERNAMES") or "").split(",") if x.strip()}
          if not token:
              raise RuntimeError("Missing Telegram bot token")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe",timeout=25) as r:
              ident=json.loads(r.read().decode("utf-8"))
          actual=str((ident.get("result") or {}).get("username") or "")
          if not ident.get("ok") or not actual:
              raise RuntimeError("Telegram getMe failed")
          if expected and actual.lower() not in expected:
              raise RuntimeError(f"Wrong Telegram bot: @{actual}")
          chat_id=configured
          route="secret"
          if not chat_id:
              with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getUpdates?limit=100&timeout=0",timeout=25) as r:
                  updates=json.loads(r.read().decode("utf-8"))
              candidates=[]
              for upd in updates.get("result") or []:
                  msg=upd.get("message") or upd.get("edited_message") or {}
                  chat=msg.get("chat") or {}
                  if str(chat.get("type") or "")=="private" and chat.get("id") is not None:
                      candidates.append((int(upd.get("update_id") or 0),str(chat["id"])))
              if candidates:
                  candidates.sort()
                  chat_id=candidates[-1][1]
                  route="getUpdates"
          if not chat_id:
              raise RuntimeError("Telegram chat_id unresolved")
          out=pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a",encoding="utf-8") as f:
              f.write(f"bot_username={actual}\n")
              f.write(f"chat_id={chat_id}\n")
              f.write(f"route={route}\n")
          print(f"account_passkey_bot_verified=@{actual}")
          print(f"account_passkey_chat_resolved=true route={route}")
          PY

      - name: Validate and regression-test watcher
        shell: bash
        run: |
          python -m py_compile scripts/account_passkey_security_watch.py
          python - <<'PY'
          import datetime as dt
          from scripts.account_passkey_security_watch import UTC, category, material, stale_backfill

          cases = [
              (
                  {"title":"Google makes passkeys the default for 800 million accounts", "description":"rollout", "source":"Google"},
                  "패스키 대규모 도입·기본전환",
              ),
              (
                  {"title":"Unit 42 finds malware can steal synced passkey private key", "description":"passkey bypass", "source":"Unit 42"},
                  "패스키 우회·개인키·세션 탈취",
              ),
              (
                  {"title":"Retailer fined after credential stuffing breach affected customer accounts", "description":"credential stuffing penalty", "source":"Reuters"},
                  "크리덴셜 스터핑 대형사고·제재",
              ),
              (
                  {"title":"FIDO publishes passkey interoperability transfer standard", "description":"specification", "source":"FIDO Alliance"},
                  "FIDO 표준·상호운용성",
              ),
              (
                  {"title":"Hive Systems 2026 Password Table uses 16 RTX 5090 GPUs and bcrypt", "description":"brute-force GPU rent", "source":"Hive Systems"},
                  "비밀번호 해독 경제성 변화",
              ),
          ]
          for item, expected in cases:
              if not material(item):
                  raise RuntimeError(f"Expected material item rejected: {item}")
              actual=category(item["title"]+" "+item["description"])
              print(f"account_passkey_case={expected} actual={actual}")
              if actual != expected:
                  raise RuntimeError(f"Category mismatch: expected={expected} actual={actual}")

          generic={"title":"How to set up a passkey in 90 seconds", "description":"tips and guide", "source":"Google"}
          if material(generic):
              raise RuntimeError("Generic passkey how-to must stay silent")

          watermark=dt.datetime(2026,10,7,0,0,tzinfo=UTC)
          if not stale_backfill({"published_at":"2026-10-05T00:00:00+00:00"},watermark):
              raise RuntimeError("Stale backfill guard failed")
          if stale_backfill({"published_at":"2026-10-06T18:00:00+00:00"},watermark):
              raise RuntimeError("Fresh item incorrectly treated as stale")
          print("account_passkey_regression=PASS")
          PY

      - name: Run account security and passkey watch
        run: |
          rm -f out/account_passkey_security_watch_alert_title.txt out/account_passkey_security_watch_alert.html out/account_passkey_security_watch_telegram_confirmed.json
          python scripts/account_passkey_security_watch.py
          cat out/account_passkey_security_watch_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build one-shot Telegram test
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.send_test == 'true'
        run: |
          mkdir -p out
          cat > out/account_passkey_security_watch_connection_test.html <<'EOF'
          🔐 <b>계정 보안·패스키 Watch</b>

          <b>표시 형식 테스트</b>
          • 대형 플랫폼·금융권 패스키 기본전환
          • 패스키 개인키·세션·복구 경로 우회
          • 크리덴셜 스터핑 대형사고·과징금
          • FIDO 표준·상호운용성
          • GPU 기반 비밀번호 해독 경제성

          단순 설정법·반복 기사에는 알림하지 않습니다.
          EOF

      - name: Send Telegram
        env:
          RESOLVED_CHAT_ID: ${{ steps.telegram.outputs.chat_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, time, urllib.parse, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id=os.environ["RESOLVED_CHAT_ID"].strip()
          test=pathlib.Path("out/account_passkey_security_watch_connection_test.html")
          alert=pathlib.Path("out/account_passkey_security_watch_alert.html")
          title=pathlib.Path("out/account_passkey_security_watch_alert_title.txt")
          files=[]
          if test.exists() and test.read_text(encoding="utf-8").strip():
              files.append(("test",test.read_text(encoding="utf-8").strip()))
          if alert.exists() and alert.read_text(encoding="utf-8").strip():
              body=alert.read_text(encoding="utf-8").strip()
              if title.exists():
                  body=title.read_text(encoding="utf-8").strip()+"\n\n"+body
              files.append(("alert",body))

          ids=[]
          for kind,text in files:
              payload=urllib.parse.urlencode({
                  "chat_id":chat_id,
                  "text":text[:3900],
                  "parse_mode":"HTML",
                  "disable_web_page_preview":"true",
              }).encode("utf-8")
              result=None
              last=None
              for attempt in range(1,4):
                  try:
                      req=urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage",data=payload,method="POST")
                      with urllib.request.urlopen(req,timeout=30) as r:
                          result=json.loads(r.read().decode("utf-8"))
                      if result.get("ok"):
                          break
                      last=RuntimeError(str(result))
                  except Exception as exc:
                      last=exc
                  if attempt<3:
                      time.sleep(attempt*3)
              if not result or not result.get("ok"):
                  raise RuntimeError(f"Telegram send failed: {last}")
              mid=(result.get("result") or {}).get("message_id")
              if mid is None:
                  raise RuntimeError("Telegram success without message_id")
              ids.append({"kind":kind,"message_id":mid})

          if alert.exists():
              alert_ids=[x for x in ids if x["kind"]=="alert"]
              if not alert_ids:
                  raise RuntimeError("Alert existed but delivery unconfirmed")
              pathlib.Path("out/account_passkey_security_watch_telegram_confirmed.json").write_text(
                  json.dumps({
                      "status":"confirmed",
                      "bot_username":"${{ steps.telegram.outputs.bot_username }}",
                      "messages":alert_ids,
                  },ensure_ascii=False,indent=2)+"\n",
                  encoding="utf-8",
              )
          print(f"account_passkey_telegram_messages_sent={len(ids)}")
          if ids:
              print("account_passkey_message_ids="+",".join(str(x["message_id"]) for x in ids))
          PY

      - name: Finalize state after no-alert or confirmed delivery
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f out/account_passkey_security_watch_pending_state.json ]; then
            echo "Pending state missing" >&2
            exit 1
          fi
          if [ -f out/account_passkey_security_watch_alert.html ] && [ ! -f out/account_passkey_security_watch_telegram_confirmed.json ]; then
            echo "Alert not checkpointed because Telegram delivery is unconfirmed" >&2
            exit 1
          fi
          cp out/account_passkey_security_watch_pending_state.json data/account_passkey_security_watch_state.json

      - name: Commit watch state
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp data/account_passkey_security_watch_state.json "$tmp/state.json"
          git config user.name "account-passkey-security-watch[bot]"
          git config user.email "account-passkey-security-watch[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp "$tmp/state.json" data/account_passkey_security_watch_state.json
            git add data/account_passkey_security_watch_state.json
            if git diff --cached --quiet; then
              echo "Account passkey security watch state unchanged"
              exit 0
            fi
            git commit -m "Update account passkey security watch state"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-passkey-security-watch-${{ github.run_id }}
          path: |
            out/account_passkey_security_watch_status.md
            out/account_passkey_security_watch_alert_title.txt
            out/account_passkey_security_watch_alert.html
            out/account_passkey_security_watch_pending_state.json
            out/account_passkey_security_watch_telegram_confirmed.json
            out/account_passkey_security_watch_connection_test.html
          if-no-files-found: ignore
          retention-days: 14
