name: QLEX Dedupe Migration Test

on:
  push:
    paths:
      - ".github/workflows/qlex-dedupe-migration-test.yml"

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/qlex_sc_conversion_watch.py
      - name: Migrate dedupe state silently
        run: |
          rm -rf out
          python scripts/qlex_sc_conversion_watch.py --mode check
          cat out/qlex_sc_conversion_status.md
          if [ -f out/qlex_sc_conversion_alert.md ]; then
            echo "ERROR: migration emitted an alert"
            cat out/qlex_sc_conversion_alert.md
            exit 1
          fi
          cp out/qlex_sc_conversion_watch_state_pending.json data/qlex_sc_conversion_watch_state.json
      - name: Immediate second poll must not repeat current stories
        run: |
          rm -rf out
          python scripts/qlex_sc_conversion_watch.py --mode check
          cat out/qlex_sc_conversion_status.md
          if [ -f out/qlex_sc_conversion_alert.md ]; then
            echo "ERROR: duplicate alert survived v2 dedupe"
            cat out/qlex_sc_conversion_alert.md
            exit 1
          fi
          cp out/qlex_sc_conversion_watch_state_pending.json data/qlex_sc_conversion_watch_state.json
      - name: Verify v2 state schema
        run: |
          python - <<'PY'
          import json
          p='data/qlex_sc_conversion_watch_state.json'
          s=json.load(open(p, encoding='utf-8'))
          assert s.get('dedupe_version') == 2, s.get('dedupe_version')
          assert s.get('seen_fingerprints'), 'seen_fingerprints empty'
          assert s.get('seen_story_keys'), 'seen_story_keys empty'
          assert s.get('seen_semantic_keys'), 'seen_semantic_keys empty'
          print('dedupe_v2_verified=true')
          PY
      - name: Persist migrated state
        run: |
          git config user.name "qlex-dedupe-migration[bot]"
          git config user.email "qlex-dedupe-migration[bot]@users.noreply.github.com"
          git add data/qlex_sc_conversion_watch_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Migrate QLEX dedupe state to v2"
            rm -rf out scripts/__pycache__
            git pull --rebase origin main
            git push
          fi
