name: Korea CP Credit Spread Stage Telegram Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/korea-credit-spread-telegram-watch.yml"
      - "scripts/korea_credit_spread_watch.py"
      - "tests/test_korea_credit_spread_watch.py"
  pull_request:
    paths:
      - ".github/workflows/korea-credit-spread-telegram-watch.yml"
      - "scripts/korea_credit_spread_watch.py"
      - "tests/test_korea_credit_spread_watch.py"
  schedule:
    # UTC 명시: 한국시간 월~금 18:10 / 19:10 / 20:10 / 21:10
    # GitHub 지연·누락 대비 보완 한국시간 22:37, 다음날(화~토) 07:37
    - cron: "10 9-12 * * 1-5"
    - cron: "37 13 * * 1-5"
    - cron: "37 22 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate source and thresholds without Telegram send"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: korea-credit-spread-telegram-watch
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate thresholds, recovery, date alignment and deduplication
        run: |
          python -m py_compile scripts/korea_credit_spread_watch.py
          python -m unittest discover -s tests -p test_korea_credit_spread_watch.py -v

  monitor:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [offline-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs8879887988798879_bot"
      # 코드 push는 무조건 미전송 검사, 명시적 [format-sample]만 1회 시험 발송.
      DRY_RUN: ${{ ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[format-sample]')) || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')) && 'true' || 'false' }}
      FORMAT_SAMPLE_SEND: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[format-sample]') && 'true' || 'false' }}
    steps:
      - name: Checkout latest production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh code and confirmed state after queue wait
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query Bank of Korea official market yields
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          PREVIEW_FORMAT: ${{ env.DRY_RUN }}
          FORMAT_SAMPLE_SEND: ${{ env.FORMAT_SAMPLE_SEND }}
        run: python scripts/korea_credit_spread_watch.py
      - name: Publish official-source status
        if: always()
        run: |
          if test -f out/korea_credit_spread_watch_status.md; then
            cat out/korea_credit_spread_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "공식 원문 조회·검증 실패: 텔레그램 미발송" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preview alert without delivery on dry run
        if: env.DRY_RUN == 'true' && hashFiles('out/korea_credit_spread_watch_alert.html') != ''
        run: |
          echo "금리 경보 임계값 테스트 성공 / 텔레그램 미전송" >> "$GITHUB_STEP_SUMMARY"
          cat out/korea_credit_spread_watch_alert.html >> "$GITHUB_STEP_SUMMARY"
      - name: Send alert only to exact designated Telegram bot
        if: env.DRY_RUN != 'true' && hashFiles('out/korea_credit_spread_watch_alert.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
          FORMAT_SAMPLE_SEND: ${{ env.FORMAT_SAMPLE_SEND }}
        run: python scripts/korea_credit_spread_watch.py --send
      - name: Persist alert state only after Telegram delivery acknowledgement
        if: success() && env.DRY_RUN != 'true' && env.FORMAT_SAMPLE_SEND != 'true' && hashFiles('out/korea_credit_spread_watch_confirmed.json') != ''
        run: |
          set -e
          test -f out/korea_credit_spread_watch_pending.json
          cp out/korea_credit_spread_watch_pending.json /tmp/korea_credit_spread_watch_pending.json
          git config user.name "korea-credit-spread-watch[bot]"
          git config user.email "korea-credit-spread-watch[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/korea_credit_spread_watch_pending.json data/korea_credit_spread_watch_state.json
            git add data/korea_credit_spread_watch_state.json
            if git diff --cached --quiet; then
              echo "Korea credit spread alert state unchanged"
              exit 0
            fi
            git commit -m "Save confirmed Korea credit spread alert state"
            if git push origin HEAD:main; then
              echo "credit_spread_state_persisted=true"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "텔레그램 전송은 확인됐으나 상태 저장이 실패했습니다. 다음 실행 전에 복구 필요." >&2
          exit 1
      - name: Save verified latest official rates even when no alert was triggered
        if: success() && env.DRY_RUN != 'true' && env.FORMAT_SAMPLE_SEND != 'true' && hashFiles('out/korea_credit_spread_watch_health_pending.json') != ''
        run: |
          set -euo pipefail
          cp out/korea_credit_spread_watch_health_pending.json /tmp/korea_credit_spread_health_verified.json
          git config user.name "korea-credit-spread-watch[bot]"
          git config user.email "korea-credit-spread-watch[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/korea_credit_spread_health_verified.json data/korea_credit_spread_watch_health.json
            git add data/korea_credit_spread_watch_health.json
            if git diff --cached --quiet; then
              echo "credit_spread_health_unchanged=true"
              exit 0
            fi
            git commit -m "Record verified CP-CD daily market source checkpoint"
            if git push origin HEAD:main; then
              echo "credit_spread_health_persisted=true"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "검증된 공식 금리 상태 저장 실패. 이전 시점으로 표시하지 마세요." >&2
          exit 1
      - name: Mark one-off format verification receipt
        if: success() && env.FORMAT_SAMPLE_SEND == 'true' && hashFiles('out/korea_credit_spread_watch_confirmed.json') != ''
        run: |
          echo "실제 텔레그램 본문 일치 확인. 양식 시험만 실행했으며 신용경보 상태는 변경하지 않음." >> "$GITHUB_STEP_SUMMARY"
          cat out/korea_credit_spread_watch_confirmed.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save verification records without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korea-credit-spread-watch-${{ github.run_id }}
          path: |
            out/korea_credit_spread_watch_status.md
            out/korea_credit_spread_watch_health_pending.json
            out/korea_credit_spread_watch_alert.html
            out/korea_credit_spread_watch_pending.json
            out/korea_credit_spread_watch_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
