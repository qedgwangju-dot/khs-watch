name: Deep Fission Telegram Watch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deep-fission-telegram-watch.yml"
      - "scripts/deep_fission_watch.py"
      - "scripts/deep_fission_watch_v3.py"
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a Telegram connection test"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: deep-fission-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"
      DEEP_FISSION_TELEGRAM_BOT_TOKEN: ${{ secrets.DEEP_FISSION_TELEGRAM_BOT_TOKEN || secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
      CONFIGURED_DEEP_FISSION_TELEGRAM_CHAT_ID: ${{ secrets.DEEP_FISSION_TELEGRAM_CHAT_ID || secrets.YEN_CARRY_TELEGRAM_CHAT_ID || secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      DEEP_FISSION_WATCH_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'KHS-Deep-Fission-Watch contact=github-actions' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and verify Telegram route
        id: telegram
        shell: bash
        run: |
          if [ -z "$DEEP_FISSION_TELEGRAM_BOT_TOKEN" ]; then
            echo "Deep Fission Telegram bot token unavailable" >&2
            exit 1
          fi
          if [ -z "$CONFIGURED_DEEP_FISSION_TELEGRAM_CHAT_ID" ]; then
            echo "Deep Fission Telegram chat id unavailable" >&2
            exit 1
          fi
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request

          token = os.environ['DEEP_FISSION_TELEGRAM_BOT_TOKEN'].strip()
          expected = os.environ['EXPECTED_TELEGRAM_BOT_USERNAME'].strip().lstrip('@')
          chat_id = os.environ['CONFIGURED_DEEP_FISSION_TELEGRAM_CHAT_ID'].strip()

          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
              identity = json.loads(r.read().decode('utf-8'))
          actual = str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or actual.lower() != expected.lower():
              raise RuntimeError(f'Wrong Telegram bot: expected @{expected}, got @{actual or "unknown"}')

          query = urllib.parse.urlencode({'chat_id': chat_id})
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getChat?{query}', timeout=25) as r:
              chat = json.loads(r.read().decode('utf-8'))
          if not chat.get('ok'):
              raise RuntimeError('Configured Telegram chat is not reachable by the verified bot')

          chat_result = chat.get('result') or {}
          resolved_id = str(chat_result.get('id') or '')
          if resolved_id != chat_id:
              raise RuntimeError('Telegram getChat returned a different chat id')

          out = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as f:
              f.write(f'bot_username={actual}\n')
              f.write(f'chat_id={chat_id}\n')
              f.write('configured=true\n')
          print(f'deep_fission_bot_verified=@{actual}')
          print(f'deep_fission_chat_verified=true type={chat_result.get("type", "unknown")}')
          PY

      - name: Validate existing watcher
        if: steps.telegram.outputs.configured == 'true'
        run: |
          python -m py_compile scripts/deep_fission_watch.py scripts/deep_fission_watch_v3.py

      - name: Check Deep Fission official sources
        if: steps.telegram.outputs.configured == 'true'
        run: |
          rm -f \
            out/deep_fission_alert.md \
            out/deep_fission_status.md \
            out/deep_fission_errors.log \
            out/deep_fission_watch_state_pending.json \
            out/deep_fission_connection_test.md \
            out/deep_fission_telegram_confirmed.json
          python scripts/deep_fission_watch.py --mode check
          test -f out/deep_fission_status.md && cat out/deep_fission_status.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build manual connection test
        if: steps.telegram.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.send_test == 'true'
        run: |
          mkdir -p out
          cat > out/deep_fission_connection_test.md <<'EOF'
          [Deep Fission 감시] 텔레그램 연결 시험

          @hs8879887988798879_bot 연결 정상입니다.
          - NRC: 실제 인허가 단계·심사 상태 변화만 알림
          - DOE: Deep Fission 실명 임계 도달·연료 장전·전출력 변화만 알림
          - 파슨스: 실제 시추 착수·목표 깊이·시제품 지하 배치·실증 완료만 알림
          - 페이지 메뉴·갱신시각·문구 재배치만으로는 알림하지 않음
          - 과거 18.5GW 고객 후보군 문구 재사용은 신규 계약으로 알리지 않음
          - 동일 사건은 한 번만 알림
          EOF

      - name: Send Telegram messages
        if: steps.telegram.outputs.configured == 'true'
        env:
          DEEP_FISSION_TELEGRAM_CHAT_ID: ${{ steps.telegram.outputs.chat_id }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import html as html_lib
          import json, os, pathlib, re, urllib.parse, urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ['DEEP_FISSION_TELEGRAM_BOT_TOKEN'].strip()
          chat_id = os.environ['DEEP_FISSION_TELEGRAM_CHAT_ID'].strip()
          expected = os.environ['EXPECTED_TELEGRAM_BOT_USERNAME'].strip().lstrip('@')

          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
              identity = json.loads(r.read().decode('utf-8'))
          actual = str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or actual.lower() != expected.lower():
              raise RuntimeError(f'Wrong Telegram bot immediately before send: expected @{expected}, got @{actual or "unknown"}')

          query = urllib.parse.urlencode({'chat_id': chat_id})
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getChat?{query}', timeout=25) as r:
              chat = json.loads(r.read().decode('utf-8'))
          if not chat.get('ok') or str((chat.get('result') or {}).get('id') or '') != chat_id:
              raise RuntimeError('Telegram chat verification failed immediately before send')

          files = [
              pathlib.Path('out/deep_fission_connection_test.md'),
              pathlib.Path('out/deep_fission_alert.md'),
          ]

          def render_html(text: str) -> str:
              rendered = []
              for line in text.splitlines():
                  m = re.fullmatch(r'\s*(?:-\s*)?(?:링크|원문):\s*(https?://\S+)\s*', line)
                  if m:
                      url = html_lib.escape(m.group(1), quote=True)
                      rendered.append(f'원문: <a href="{url}">[원문 뉴스보기]</a>')
                  else:
                      rendered.append(html_lib.escape(line))
              return '\n'.join(rendered)

          sent = 0
          message_ids = []
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8').strip()
              if not text:
                  continue
              chunks = []
              while len(text) > 3600:
                  cut = text.rfind('\n\n', 0, 3600)
                  if cut < 1000:
                      cut = 3600
                  chunks.append(text[:cut].strip())
                  text = text[cut:].strip()
              if text:
                  chunks.append(text)
              for chunk in chunks:
                  payload = urllib.parse.urlencode({
                      'chat_id': chat_id,
                      'text': render_html(chunk),
                      'parse_mode': 'HTML',
                      'disable_web_page_preview': 'true',
                  }).encode('utf-8')
                  req = urllib.request.Request(
                      f'https://api.telegram.org/bot{token}/sendMessage',
                      data=payload,
                      method='POST',
                  )
                  with urllib.request.urlopen(req, timeout=30) as r:
                      result = json.loads(r.read().decode('utf-8'))
                  if not result.get('ok'):
                      raise RuntimeError(result)
                  sent += 1
                  message_ids.append((result.get('result') or {}).get('message_id'))

          if sent:
              pathlib.Path('out/deep_fission_telegram_confirmed.json').write_text(
                  json.dumps({
                      'status': 'confirmed',
                      'bot_username': actual,
                      'message_ids': message_ids,
                      'confirmed_at_kst': dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat(timespec='seconds'),
                  }, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          print(f'deep_fission_telegram_messages_sent={sent} bot=@{actual}')
          PY

      - name: Persist state only after confirmed Telegram delivery
        if: steps.telegram.outputs.configured == 'true' && success() && hashFiles('out/deep_fission_watch_state_pending.json') != '' && hashFiles('out/deep_fission_telegram_confirmed.json') != ''
        run: cp out/deep_fission_watch_state_pending.json data/deep_fission_watch_state.json

      - name: Commit watch state
        if: steps.telegram.outputs.configured == 'true' && success() && hashFiles('out/deep_fission_telegram_confirmed.json') != '' && hashFiles('data/deep_fission_watch_state.json') != ''
        run: |
          git config user.name "deep-fission-watch[bot]"
          git config user.email "deep-fission-watch[bot]@users.noreply.github.com"
          git add data/deep_fission_watch_state.json
          if git diff --cached --quiet; then
            echo "Deep Fission watch state unchanged"
          else
            git commit -m "Update Deep Fission watch state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-fission-watch-${{ github.run_id }}
          path: |
            out/deep_fission_status.md
            out/deep_fission_alert.md
            out/deep_fission_connection_test.md
            out/deep_fission_errors.log
            out/deep_fission_watch_state_pending.json
            out/deep_fission_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
