name: Jobs Wage Full Report V6 Test

on:
  push:
    paths:
      - ".github/workflows/jobs-wage-full-report-v5-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FORCE_BLS_API: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 pypdf
      - name: Generate v6 full report without Telegram
        run: |
          python - <<'PY'
          import pathlib, re, sys
          sys.path.insert(0, str(pathlib.Path('scripts').resolve()))
          import jobs_wage_watch_runner
          import jobs_wage_watch as watch
          import jobs_wage_watch_full_report_v6 as full

          releases=[]
          for parser in (watch.parse_bls, watch.parse_claims, watch.parse_adp):
              r=parser()
              if r: releases.append(r)
          if {r.kind for r in releases} != {'employment_situation','weekly_claims','adp'}:
              raise RuntimeError(f"trigger set incomplete: {[r.kind for r in releases]}")
          report=full.build_report(releases)
          pathlib.Path('out').mkdir(exist_ok=True)
          pathlib.Path('out/jobs_wage_full_report_v6_test.md').write_text(report,encoding='utf-8')

          required=[
            '## 1) 조회 시각·자료 처리 상태','## 2) 오늘 발표 결과 요약','## 3) 1단계 현재 숫자 추적',
            'NFP 3개월 평균','U-6','BLS 1개월 고용 확산지수','임금 성격:','ADP/BLS 방향:',
            '## 4) 2단계 미래 재평가 요인 발굴','## 5) breakeven 고용·경제활동참가율 해석',
            'CPS 노동력+비경제활동으로 재구성한 민간 비제도권 인구','## 6) 달러 안전자산·경기침체 공포 점검',
            'UUP','2Y Treasury futures','5Y yield','10Y yield','UST 2Y','UST 5Y','UST 10Y','10Y real yield','10Y BEI',
            '## 7) 연준 반응함수 보조 프레임','## 8) 숨은 역풍·실패모드','## 다음 공식 발표별 시나리오',
            '## 9) 결론','### 더 강한 종합 해석','투자 관점의 4축으로 보면:','- 돈 버는 능력:','- 할인율:','- 수급:','- 시간표:',
            '자산 차별화:','## 10) 핵심 한 줄 요약'
          ]
          missing=[x for x in required if x not in report]
          if missing: raise RuntimeError(f"missing sections: {missing}")

          m=re.search(r'현재 추정 범위:\s*약\s*([+\-\d,]+)\s*~\s*([+\-\d,]+)명/월',report)
          if not m: raise RuntimeError('breakeven range missing')
          lo=int(m.group(1).replace(',','').replace('+','')); hi=int(m.group(2).replace(',','').replace('+',''))
          if lo<0 or hi<0: raise RuntimeError(f'negative breakeven {lo}~{hi}')
          if re.search(r'KOSPI\s+[+\-]?\d+\.\d+%',report) or re.search(r'KOSDAQ\s+[+\-]?\d+\.\d+%',report):
              raise RuntimeError('closed Korea cash market falsely shown as immediate reaction')
          if 'S&P 500 0.05%' in report and 'NASDAQ 0.47%' in report and '판정: 경기침체·안전자산 달러형' in report:
              raise RuntimeError('mixed reaction overclassified as recession')

          fred_missing=all(x in report for x in ['UST 2Y 확인 불가','UST 5Y 확인 불가','UST 10Y 확인 불가','10Y real yield 확인 불가'])
          if fred_missing:
              raise RuntimeError('FRED official rate path still failed in v6')
          if '상태: 원천 재조회·중복 확인·수치 재검증 완료.' not in report:
              raise RuntimeError('complete FRED path but completion status missing')

          print(f"full_report_v6_test_ok=true chars={len(report)} breakeven={lo}~{hi} fred_missing={fred_missing}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobs-wage-full-report-v6-test-${{ github.run_id }}
          path: out/jobs_wage_full_report_v6_test.md
          if-no-files-found: ignore
          retention-days: 3
