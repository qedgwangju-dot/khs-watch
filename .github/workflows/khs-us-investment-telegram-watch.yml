name: KHS US investment Telegram watch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/khs-us-investment-telegram-watch.yml"
      - "scripts/khs_us_investment_watch.py"
      - "scripts/khs_us_investment_watch_base.py"
      - "scripts/khs_us_investment_watch_core.py"
      - "scripts/khs_us_investment_finalize.py"
      - "scripts/khs_us_investment_altpower_finalize.py"
      - "scripts/khs_us_investment_telegram_send.py"
      - "data/khs_us_investment_watch_config.json"
  schedule:
    # GitHub cron is UTC. 15-minute monitoring, offset from other policy jobs.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: khs-us-investment-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate watcher
        run: |
          python -m py_compile \
            scripts/khs_us_investment_watch.py \
            scripts/khs_us_investment_watch_base.py \
            scripts/khs_us_investment_watch_core.py \
            scripts/khs_us_investment_finalize.py \
            scripts/khs_us_investment_altpower_finalize.py \
            scripts/khs_us_investment_telegram_send.py

      # Every relevant code push validates the real Telegram bot/chat route.
      # Live monitoring and Telegram delivery still run only on schedule/manual dispatch.
      - name: Validate exact Telegram route
        id: telegram_route
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_DIRECT: ${{ secrets.KHS887900_CHAT_ID }}
        run: python scripts/khs_us_investment_telegram_send.py resolve

      - name: Record exact Telegram route health
        if: github.event_name == 'push' && steps.telegram_route.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          payload = {
              "bot": "@khs887900_bot",
              "chat_secret": "KHS887900_CHAT_ID",
              "ready": True,
              "validated_at": dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          path = Path("data/khs_us_investment_route_health.json")
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/khs_us_investment_route_health.json
          if git diff --cached --quiet; then
            echo "route health unchanged"
          else
            git commit -m "Record US investment Telegram route health [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Run US investment watch
        if: github.event_name != 'push'
        run: python scripts/khs_us_investment_watch.py

      - name: Enforce final Telegram readability
        if: github.event_name != 'push' && hashFiles('out/khs_us_investment_alert.html') != ''
        run: python scripts/khs_us_investment_finalize.py

      - name: Add gas-turbine alternative-power baseline
        if: github.event_name != 'push' && hashFiles('out/khs_us_investment_alert.html') != ''
        run: python scripts/khs_us_investment_altpower_finalize.py

      - name: Publish summary
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "대미투자 워처 코드·Telegram 전용 경로 검증만 수행함 · 실시간 감시/Telegram 송출 없음" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f out/khs_us_investment_alert.html ]; then
            echo "대미투자 Telegram 알림 생성됨" >> "$GITHUB_STEP_SUMMARY"
            sed -E 's/<[^>]+>//g' out/khs_us_investment_alert.html >> "$GITHUB_STEP_SUMMARY"
          else
            echo "대미투자: 새 중요 변화 없음" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Telegram alert
        if: github.event_name != 'push' && hashFiles('out/khs_us_investment_alert.html') != '' && steps.telegram_route.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_DIRECT: ${{ secrets.KHS887900_CHAT_ID }}
        run: python scripts/khs_us_investment_telegram_send.py send

      - name: Hold alert until exact Telegram route is ready
        if: github.event_name != 'push' && hashFiles('out/khs_us_investment_alert.html') != '' && steps.telegram_route.outputs.ready != 'true'
        run: |
          echo "중요 변화는 감지됐지만 @khs887900_bot 경로가 확인될 때까지 seen 상태를 저장하지 않습니다." >> "$GITHUB_STEP_SUMMARY"
          echo "경로가 복구되면 같은 중요 변화를 다시 송출 시도합니다." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when exact Telegram route is unavailable
        if: steps.telegram_route.outputs.ready != 'true'
        run: |
          echo "Telegram 경로 검증 실패: @khs887900_bot + KHS887900_CHAT_ID가 정확히 확인되지 않아 상태를 저장하지 않습니다." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Persist seen state after confirmed delivery
        if: github.event_name != 'push' && success() && hashFiles('out/khs_us_investment_pending_seen.json') != '' && hashFiles('out/khs_us_investment_delivery.json') != ''
        run: cp out/khs_us_investment_pending_seen.json data/khs_us_investment_seen.json

      - name: Persist no-alert seen state
        if: github.event_name != 'push' && success() && hashFiles('out/khs_us_investment_alert.html') == '' && hashFiles('out/khs_us_investment_pending_seen.json') != ''
        run: cp out/khs_us_investment_pending_seen.json data/khs_us_investment_seen.json

      - name: Commit state
        if: github.event_name != 'push' && success() && hashFiles('data/khs_us_investment_seen.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/khs_us_investment_seen.json
          if git diff --cached --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git commit -m "Record US investment watch state"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
