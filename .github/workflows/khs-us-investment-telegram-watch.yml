name: KHS US investment Telegram watch

on:
  push:
    paths:
      - ".github/workflows/khs-us-investment-telegram-watch.yml"
      - "scripts/khs_us_investment_watch.py"
      - "data/khs_us_investment_watch_config.json"
  schedule:
    # GitHub cron is UTC. 15-minute monitoring, offset from other policy jobs.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: khs-us-investment-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate watcher
        run: python -m py_compile scripts/khs_us_investment_watch.py

      - name: Validate exact Telegram route
        id: telegram_route
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_DIRECT: ${{ secrets.KHS887900_CHAT_ID }}
          TELEGRAM_CHAT_ID_POLICY: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_GENERIC: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          output = os.environ["GITHUB_OUTPUT"]
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")

          def set_result(ready, reason):
              with open(output, "a", encoding="utf-8") as f:
                  f.write(f"ready={'true' if ready else 'false'}\n")
                  f.write(f"reason={reason}\n")
              with open(summary, "a", encoding="utf-8") as f:
                  if ready:
                      f.write(f"Telegram 경로 확인: @{expected}\n")
                  else:
                      f.write(f"Telegram 경로 대기: {reason}\n")

          if not token:
              set_result(False, "KHS887900_BOT_TOKEN secret missing")
              raise SystemExit(0)

          try:
              with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=20) as response:
                  identity = json.loads(response.read().decode("utf-8"))
          except Exception as exc:
              set_result(False, f"Telegram getMe failed: {type(exc).__name__}")
              raise SystemExit(0)

          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              set_result(False, f"bot mismatch: expected @{expected}, got @{username or 'unknown'}")
              raise SystemExit(0)

          def get_chat(chat_id):
              if not chat_id:
                  return None
              query = urllib.parse.urlencode({"chat_id": chat_id})
              try:
                  with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getChat?{query}", timeout=20) as response:
                      result = json.loads(response.read().decode("utf-8"))
                  return result.get("result") if result.get("ok") else None
              except Exception:
                  return None

          chat = None
          for chat_id in [
              (os.getenv("TELEGRAM_CHAT_ID_DIRECT") or "").strip(),
              (os.getenv("TELEGRAM_CHAT_ID_POLICY") or "").strip(),
              (os.getenv("TELEGRAM_CHAT_ID_GENERIC") or "").strip(),
          ]:
              chat = get_chat(chat_id)
              if chat:
                  break

          if not chat:
              try:
                  with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getUpdates?limit=100", timeout=20) as response:
                      updates = json.loads(response.read().decode("utf-8"))
                  if updates.get("ok"):
                      for update in reversed(updates.get("result") or []):
                          obj = update.get("message") or update.get("channel_post") or update.get("edited_message") or {}
                          candidate = obj.get("chat") or {}
                          if candidate.get("id") is not None:
                              chat = candidate
                              break
              except Exception:
                  pass

          if not chat:
              set_result(False, f"@{expected} valid but no reachable chat resolved")
              raise SystemExit(0)

          set_result(True, "ok")
          print(f"telegram_route_valid=true bot=@{username} chat_type={chat.get('type', 'unknown')}")
          PY

      - name: Run US investment watch
        run: python scripts/khs_us_investment_watch.py

      - name: Enforce final Telegram readability
        if: hashFiles('out/khs_us_investment_alert.html') != ''
        run: |
          python - <<'PY'
          import datetime as dt
          import html
          import importlib.util
          import pathlib
          import re
          from zoneinfo import ZoneInfo

          KST = ZoneInfo("Asia/Seoul")
          path = pathlib.Path("out/khs_us_investment_alert.html")
          text = path.read_text(encoding="utf-8")

          footer = re.search(r"^조회\s+(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}\s+KST)", text, re.M)
          lookup_time = footer.group(1) if footer else ""

          spec = importlib.util.spec_from_file_location(
              "khs_us_investment_watch_core_format",
              pathlib.Path("scripts/khs_us_investment_watch_core.py"),
          )
          core = None
          if spec is not None and spec.loader is not None:
              core = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(core)

          def clean(value):
              return html.unescape(re.sub(r"<[^>]+>", "", value or "")).strip()

          def parse_published(value):
              try:
                  parsed = dt.datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=dt.timezone.utc)
                  return parsed.astimezone(KST).strftime("%Y-%m-%d %H:%M KST")
              except Exception:
                  return ""

          publication_cache = {}

          def source_time(title, source, link):
              title_plain = clean(title)
              source_plain = clean(source)
              raw_link = html.unescape(link)
              cache_key = (title_plain, source_plain, raw_link)
              if cache_key in publication_cache:
                  return publication_cache[cache_key]

              timestamp = ""
              if core is not None and title_plain:
                  try:
                      query_title = title_plain.replace('"', " ")
                      rows = core._rss(f'"{query_title}" when:7d')
                      exact = next(
                          (
                              row
                              for row in rows
                              if str(row.get("link") or "") == raw_link
                          ),
                          None,
                      )
                      if exact is None:
                          exact = next(
                              (
                                  row
                                  for row in rows
                                  if clean(str(row.get("title") or "")) == title_plain
                                  and clean(str(row.get("source") or "")) == source_plain
                              ),
                              None,
                          )
                      if exact is not None:
                          timestamp = parse_published(exact.get("published"))
                  except Exception as exc:
                      print(f"publication_time_lookup_failed={type(exc).__name__}")

              if not timestamp:
                  timestamp = f"{lookup_time} (조회)" if lookup_time else "확인 불가"
              publication_cache[cache_key] = timestamp
              return timestamp

          def confirm_for(tags, source):
              blob = f"{tags} {source}".lower()
              official_tokens = [
                  "공식정정/정부입장",
                  "정책브리핑",
                  "대한민국 정책브리핑",
                  "산업통상",
                  "재정경제부",
                  "기획재정부",
                  "ercot",
                  "puct",
                  "texas governor",
              ]
              if any(token in blob for token in official_tokens):
                  return "공식자료 확인"
              return "신뢰 보도 확인 · 정부 공식 확정 여부는 별도 관리"

          def check_for(tags):
              if "대미투자 첫사업/에너지패키지" in tags:
                  return "정부 공식 첫 사업 선정 · 투자금·지분·수익배분 · 원전 부지·노형·기수 · 첫 자금요청·송금"
              if "ERCOT 신청/실수요 구분" in tags:
                  return "감사 · 계통연계 요건 충족 · 전원 인가 승인 · 실제 가동"
              if "엔시날 단계증설" in tags:
                  return "AI 고객 실명·전력구매계약(PPA) · 1.4GW 발주 · 4.9GW 후속 승인"
              if "수익배분/손실분담" in tags:
                  return "리스크 풀링 유지 여부 · 손실 상계 범위 · 원리금 상환 순서"
              if "45영업일" in tags or "송금절차" in tags:
                  return "사업 선정일 · 한국 통보일 · 별도 조기집행 합의 · 운영위 의결 · 실제 송금일·금액"
              if "원전" in tags:
                  return "부지 · 노형 · 기수 · 발주주체 · 본계약"
              if "알래스카 LNG" in tags:
                  return "장기구매계약(SPA)·오프테이크 · 최종투자결정(FID) · 금융종결 · 한국 투자액·본계약"
              if "텍사스 AI 전력" in tags or "가스발전 설비" in tags:
                  return "전력구매계약(PPA) · 계통연계 · 가스터빈·스팀터빈·배열회수보일러(HRSG) 발주 · 착공 · 전원 인가"
              return "공식자료 · 계약 · 허가 · 착공 · 실제 매출 연결 여부"

          article_re = re.compile(
              r"(?P<title><b>\d+\.\s+.*?</b>)\n"
              r"(?P<class>• 🟧 <b>구분:\s*(?P<tags>.*?)</b>)\n"
              r"• 의미:\s*(?P<meaning>.*?)\n"
              r"• 출처:\s*<a href=\"(?P<link>[^\"]+)\">(?P<source>.*?)</a>",
              re.S,
          )

          def render_article(match):
              tags_plain = clean(match.group("tags"))
              source_plain = clean(match.group("source"))
              timestamp = source_time(
                  match.group("title"),
                  match.group("source"),
                  match.group("link"),
              )
              return "\n".join([
                  match.group("title"),
                  match.group("class"),
                  f'• 출처: {match.group("source")} · 시각: {timestamp} · <a href="{match.group("link")}">원문</a>',
                  f"• 확인: {confirm_for(tags_plain, source_plain)}",
                  f"• 핵심: {match.group('meaning').strip()}",
                  f"• 체크: {html.escape(check_for(tags_plain))}",
              ])

          text, generic_count = article_re.subn(render_article, text)

          energy_header_re = re.compile(
              r"^(?P<header><b>🇺🇸 대미투자 첫사업·에너지 패키지 \| .*?</b>)\n",
              re.M,
          )
          energy_match = energy_header_re.search(text)
          if energy_match:
              after_header = text[energy_match.end():energy_match.end() + 300]
              if "• 🟧 <b>구분:" not in after_header:
                  header_plain = clean(energy_match.group("header"))
                  status = "정부 공식확정 분리"
                  if "정부 미확정" in header_plain:
                      status = "정부 공식상태 미확정"
                  elif "정부 공식단계 상승" in header_plain:
                      status = "정부 공식단계 상승"

                  metadata = "\n".join([
                      "• 🟧 <b>구분: 대미투자 첫사업 / 에너지 패키지</b>",
                      '• 출처: WSJ · 시각: 2026-09-10 15:40 KST · <a href="https://www.wsj.com/world/asia/south-korea-nears-agreement-on-billions-in-u-s-investments-a-win-for-trump-2b58dc4a">원문</a>',
                      f"• 확인: WSJ 합의 근접 보도 확인 · {status}",
                      "• 핵심: 1,000억달러 초과 에너지 패키지 · 텍사스 가스발전 + 미국 대형원전 최대 8기",
                      "• 체크: 정부 공식 첫 사업 선정 · 투자금·지분·수익배분 · 원전 부지·노형·기수 · 실제 선정 통지일 · 첫 자금요청·송금",
                      "",
                  ])
                  text = text[:energy_match.end()] + metadata + "\n" + text[energy_match.end():]

          static_replacements = [
              (
                  r'(?m)^<a href="([^"]+)">WSJ 원문</a>$',
                  r'• 출처: WSJ · 시각: 2026-09-10 15:40 KST · <a href="\1">원문</a>',
              ),
              (
                  r'(?m)^<a href="([^"]+)">Reuters 교차검증</a>$',
                  r'• 출처: Reuters · 시각: 2026-09-10 16:12 KST · <a href="\1">원문</a>',
              ),
              (
                  r'(?m)^<a href="([^"]+)">산업통상부 9월 9일 공식 설명자료</a>$',
                  r'• 출처: 산업통상부 · 시각: 2026-09-09 (공식자료 게시일) · <a href="\1">원문</a>',
              ),
              (
                  r'(?m)^<a href="([^"]+)">산업통상부 9월 10일 수익배분 공식 설명자료</a>$',
                  r'• 출처: 산업통상부 · 시각: 2026-09-10 (공식자료 게시일) · <a href="\1">원문</a>',
              ),
              (
                  r'(?m)^<a href="([^"]+)">2025-11-14 한미 전략적 투자 MOU 공식 설명</a>$',
                  r'• 출처: 대한민국 정책브리핑 · 시각: 2025-11-14 (공식자료 게시일) · <a href="\1">원문</a>',
              ),
          ]
          for pattern, replacement in static_replacements:
              text = re.sub(pattern, replacement, text)

          # Final guard: approved order must be title → 구분 → 출처·시각·원문 → 확인 → 핵심 → 체크.
          for match in re.finditer(r"(?m)^<b>\d+\.\s+.*?</b>$", text):
              block = text[match.start():]
              next_item = re.search(r"(?m)^<b>\d+\.\s+.*?</b>$", block[1:])
              if next_item:
                  block = block[:next_item.start() + 1]
              required = [
                  "• 🟧 <b>구분:",
                  "• 출처:",
                  "· 시각:",
                  ">원문</a>",
                  "• 확인:",
                  "• 핵심:",
                  "• 체크:",
              ]
              positions = [block.find(token) for token in required]
              if any(pos < 0 for pos in positions) or positions != sorted(positions):
                  raise RuntimeError("final alert item format validation failed")

          if energy_match:
              head = text[:1600]
              required = [
                  "• 🟧 <b>구분:",
                  "• 출처:",
                  "· 시각:",
                  ">원문</a>",
                  "• 확인:",
                  "• 핵심:",
                  "• 체크:",
              ]
              positions = [head.find(token) for token in required]
              if any(pos < 0 for pos in positions) or positions != sorted(positions):
                  raise RuntimeError("energy-package header format validation failed")

          if re.search(r'(?m)^• 출처:\s*<a href="[^"]+">[^<]+</a>\s*$', text):
              raise RuntimeError("old separated source line survived final formatting")
          if re.search(r'(?m)^<a href="', text):
              raise RuntimeError("standalone source link survived final formatting")

          path.write_text(text, encoding="utf-8")
          print(f"final_alert_format_enforced=true generic_items={generic_count}")
          PY

      - name: Publish summary
        if: always()
        run: |
          if [ -f out/khs_us_investment_alert.html ]; then
            echo "대미투자 Telegram 알림 생성됨" >> "$GITHUB_STEP_SUMMARY"
            sed -E 's/<[^>]+>//g' out/khs_us_investment_alert.html >> "$GITHUB_STEP_SUMMARY"
          else
            echo "대미투자: 새 중요 변화 없음" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Telegram alert
        if: hashFiles('out/khs_us_investment_alert.html') != '' && steps.telegram_route.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_DIRECT: ${{ secrets.KHS887900_CHAT_ID }}
          TELEGRAM_CHAT_ID_POLICY: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_GENERIC: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("KHS887900_BOT_TOKEN secret is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=20) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          def get_chat(chat_id):
              if not chat_id:
                  return None
              query = urllib.parse.urlencode({"chat_id": chat_id})
              try:
                  with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getChat?{query}", timeout=20) as response:
                      result = json.loads(response.read().decode("utf-8"))
                  return result.get("result") if result.get("ok") else None
              except Exception:
                  return None

          chat = None
          for chat_id in [
              (os.getenv("TELEGRAM_CHAT_ID_DIRECT") or "").strip(),
              (os.getenv("TELEGRAM_CHAT_ID_POLICY") or "").strip(),
              (os.getenv("TELEGRAM_CHAT_ID_GENERIC") or "").strip(),
          ]:
              chat = get_chat(chat_id)
              if chat:
                  break

          if not chat:
              with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getUpdates?limit=100", timeout=20) as response:
                  updates = json.loads(response.read().decode("utf-8"))
              if updates.get("ok"):
                  for update in reversed(updates.get("result") or []):
                      obj = update.get("message") or update.get("channel_post") or update.get("edited_message") or {}
                      candidate = obj.get("chat") or {}
                      if candidate.get("id") is not None:
                          chat = candidate
                          break

          if not chat or chat.get("id") is None:
              raise RuntimeError("@khs887900_bot chat id could not be resolved")

          text = pathlib.Path("out/khs_us_investment_alert.html").read_text(encoding="utf-8").strip()
          payload = urllib.parse.urlencode({
              "chat_id": str(chat["id"]),
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected message: {result}")

          pathlib.Path("out/khs_us_investment_delivery.json").write_text(
              json.dumps({
                  "bot": username,
                  "message_id": result.get("result", {}).get("message_id"),
                  "chat_type": chat.get("type"),
              }, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"telegram_delivery_confirmed=true bot=@{username} message_id={result.get('result', {}).get('message_id')}")
          PY

      - name: Hold alert until exact Telegram route is ready
        if: hashFiles('out/khs_us_investment_alert.html') != '' && steps.telegram_route.outputs.ready != 'true'
        run: |
          echo "중요 변화는 감지됐지만 @khs887900_bot 경로가 확인될 때까지 seen 상태를 저장하지 않습니다." >> "$GITHUB_STEP_SUMMARY"
          echo "따라서 토큰 경로가 복구되면 같은 중요 변화를 다시 송출 시도합니다." >> "$GITHUB_STEP_SUMMARY"

      - name: Persist seen state after confirmed delivery
        if: success() && hashFiles('out/khs_us_investment_pending_seen.json') != '' && hashFiles('out/khs_us_investment_delivery.json') != ''
        run: cp out/khs_us_investment_pending_seen.json data/khs_us_investment_seen.json

      - name: Persist no-alert seen state
        if: success() && hashFiles('out/khs_us_investment_alert.html') == '' && hashFiles('out/khs_us_investment_pending_seen.json') != ''
        run: cp out/khs_us_investment_pending_seen.json data/khs_us_investment_seen.json

      - name: Commit state
        if: success() && hashFiles('data/khs_us_investment_seen.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/khs_us_investment_seen.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "Record US investment watch state"
            git pull --rebase origin main
            git push
          fi
