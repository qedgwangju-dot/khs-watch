name: KHS US investment Telegram watch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/khs-us-investment-telegram-watch.yml"
      - "scripts/khs_us_investment_watch.py"
      - "scripts/khs_us_investment_watch_stateful.py"
      - "scripts/khs_us_investment_watch_base.py"
      - "scripts/khs_us_investment_watch_core.py"
      - "scripts/khs_us_investment_finalize.py"
      - "scripts/khs_us_investment_altpower_finalize.py"
      - "scripts/khs_us_investment_telegram_send.py"
      - "scripts/currency_krw_guard.py"
      - "scripts/fx_api.py"
      - "tests/test_hbm_currency_krw_guard.py"
      - "tests/test_fx_api.py"
      - "data/khs_us_investment_watch_config.json"
  schedule:
    # GitHub cron is UTC. 15-minute monitoring, offset from other policy jobs.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # 코드검증(push)이 스스로 만든 live workflow_dispatch를 취소하거나 그 반대가 되지 않게 분리한다.
  # schedule과 manual dispatch는 같은 runtime 그룹으로 묶어 중복 실시간 실행은 계속 차단한다.
  group: khs-us-investment-telegram-watch-${{ github.event_name == 'push' && 'validation' || 'runtime' }}
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure existing schedule is enabled
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "/repos/${GITHUB_REPOSITORY}/actions/workflows/khs-us-investment-telegram-watch.yml/enable"
          echo "existing_schedule_enable=confirmed"

      - name: Trigger one live verification dispatch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run khs-us-investment-telegram-watch.yml --ref main
          echo "live_verification_dispatch=created"

      - name: Validate watcher
        run: |
          python -m py_compile \
            scripts/khs_us_investment_watch.py \
            scripts/khs_us_investment_watch_stateful.py \
            scripts/khs_us_investment_watch_base.py \
            scripts/khs_us_investment_watch_core.py \
            scripts/khs_us_investment_finalize.py \
            scripts/khs_us_investment_altpower_finalize.py \
            scripts/khs_us_investment_telegram_send.py \
            scripts/currency_krw_guard.py \
            scripts/fx_api.py
          python scripts/khs_us_investment_watch_stateful.py --self-test
          python scripts/khs_us_investment_telegram_send.py self-test
          PYTHONPATH=scripts python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/khs_us_investment_finalize.py")
          spec = importlib.util.spec_from_file_location("khs_us_investment_finalize_selftest", path)
          if spec is None or spec.loader is None:
              raise RuntimeError("finalizer self-test load failed")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          judgment = mod._short_judgment(
              "[상태 변화] 대미투자 자금 집행·45영업일 — 첫 자금 집행 24억달러",
              "송금절차/45영업일",
          )
          if "실제 첫 송금 집행 확인" not in judgment:
              raise RuntimeError(f"funding completion judgment regression: {judgment}")
          if "아직 승격하지 않음" in judgment:
              raise RuntimeError(f"stale funding pending wording survived: {judgment}")

          flags = {
              "pyro": False, "cap": False, "supply": False, "funding": True,
              "energy": False, "ercot": False, "encinal": True,
              "nuclear": False, "alaska": False,
          }
          checks = mod._next_checks(flags)
          if any("실제 송금일/금액" in item for item in checks):
              raise RuntimeError(f"post-transfer next-check regression: {checks}")
          if not any("후속 자금요청" in item for item in checks):
              raise RuntimeError(f"post-transfer capital-call follow-up missing: {checks}")
          print(f"funding_finalize_self_test=passed judgment={judgment}")
          PY
          python -m unittest discover -s tests -p 'test_hbm_currency_krw_guard.py'
          python -m unittest discover -s tests -p 'test_fx_api.py'

      - name: Validate live USD-KRW conversion route
        if: github.event_name == 'workflow_dispatch'
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from currency_krw_guard import enforce_text, validate_text
          from fx_api import daily_krw

          quote = daily_krw("USD")
          sample = (
              "Project Star 223억달러 · "
              "Project Power 최대 1,200억달러 · "
              "전략투자 2,000억달러 · "
              "Alaska LNG 540억달러"
          )
          rendered = enforce_text(sample)
          validate_text(rendered)
          for token in ("223억달러(", "1,200억달러(", "2,000억달러(", "540억달러("):
              if token not in rendered:
                  raise RuntimeError(f"inline KRW conversion missing: {token}")
          print(
              f"krw_fx_route_valid=true rate={quote.rate:.4f} "
              f"date={quote.date} source={quote.source}"
          )
          print(f"krw_inline_sample={rendered}")
          PY

      # Every relevant code push validates the real Telegram bot/chat route.
      # Live monitoring and Telegram delivery still run only on schedule/manual dispatch.
      - name: Validate exact Telegram route
        id: telegram_route
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_DIRECT: ${{ secrets.KHS887900_CHAT_ID }}
        run: python scripts/khs_us_investment_telegram_send.py resolve

      - name: Record exact Telegram route health
        if: github.event_name == 'push' && steps.telegram_route.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          payload = {
              "bot": "@khs887900_bot",
              "chat_secret": "KHS887900_CHAT_ID",
              "ready": True,
              "validated_at": dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          path = Path("data/khs_us_investment_route_health.json")
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/khs_us_investment_route_health.json
          if git diff --cached --quiet; then
            echo "route health unchanged"
          else
            git commit -m "Record US investment Telegram route health [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Run US investment watch
        if: github.event_name != 'push'
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/khs_us_investment_watch_stateful.py")
          spec = importlib.util.spec_from_file_location("khs_us_investment_watch_stateful_runtime", path)
          if spec is None or spec.loader is None:
              raise RuntimeError(f"watcher load failed: {path}")
          watcher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(watcher)

          # 기사 고정감시가 아니라 '미국 원전 구성·대미투자 사건축'을 넓게 탐색한다.
          # 개별 기사 제목/URL은 증거일 뿐 알림 trigger가 아니며,
          # 실제 송출 여부는 stateful watcher의 교차검증된 사건 상태 변화가 결정한다.
          requested_queries = [
              '"미국 원전" 한국 AP1000 APR1400 한수원 웨스팅하우스 when:14d',
              '"대미투자" 원전 기수 노형 AP1000 APR1400 when:14d',
              '"US nuclear" Korea AP1000 APR1400 KHNP Westinghouse when:14d',
          ]
          for query in requested_queries:
              if query not in watcher.core.QUERIES:
                  watcher.core.QUERIES.append(query)
          for source in ["Reuters", "Bloomberg", "Wall Street Journal", "WSJ", "연합뉴스", "뉴스1", "한국경제", "머니투데이"]:
              if source not in watcher.core.TRUSTED:
                  watcher.core.TRUSTED.append(source)
          for term in ["nuclear", "reactor", "AP1000", "APR1400", "원전", "노형", "기수"]:
              if term not in watcher.core.MATERIAL:
                  watcher.core.MATERIAL.append(term)

          original_collapse = watcher._collapse_rows
          # Project Power 및 Westinghouse 한국 지분 참여의 Telegram 단일 소유권은
          # 실제 송출·상태저장·중복억제가 검증된 이 대미투자 watcher가 갖는다.
          # 정책 watcher는 동일 사실을 참고/상태추적할 수 있지만 Telegram은 이 경로로 위임한다.
          delegated_families = set()

          def collapse_with_single_nuclear_owner(rows):
              collapsed = original_collapse(rows)
              kept = []
              sent_families = set()
              for row in collapsed:
                  family = str(row.get("_state_guard_family") or "")
                  if family in delegated_families:
                      print(f"delegated_nuclear_alert_suppressed={family}")
                      continue
                  # 한 실행에서 동일 사건축은 1건만 Telegram으로 보낸다.
                  # 원본 collapse가 먼저 실행됐기 때문에 뒤 기사들의 새 사실은 state에 이미 흡수된다.
                  if family and family in sent_families:
                      print(f"same_family_alert_suppressed={family}")
                      continue
                  if family:
                      sent_families.add(family)
                  kept.append(row)
              return kept

          watcher._collapse_rows = collapse_with_single_nuclear_owner
          raise SystemExit(watcher.main())
          PY

      - name: Enforce final Telegram readability
        if: github.event_name != 'push' && hashFiles('out/khs_us_investment_alert.html') != ''
        run: python scripts/khs_us_investment_finalize.py

      - name: Add gas-turbine alternative-power baseline
        if: github.event_name != 'push' && hashFiles('out/khs_us_investment_alert.html') != ''
        run: python scripts/khs_us_investment_altpower_finalize.py

      - name: Enforce inline KRW after every foreign-currency amount
        if: github.event_name != 'push' && hashFiles('out/khs_us_investment_alert.html') != ''
        run: python scripts/currency_krw_guard.py out/khs_us_investment_alert.html

      - name: Publish summary
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "대미투자 워처 코드·Telegram 전용 경로 검증만 수행함 · 실시간 감시/Telegram 송출 없음" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f out/khs_us_investment_alert.html ]; then
            echo "대미투자 Telegram 알림 생성됨" >> "$GITHUB_STEP_SUMMARY"
            sed -E 's/<[^>]+>//g' out/khs_us_investment_alert.html >> "$GITHUB_STEP_SUMMARY"
          else
            echo "대미투자: 새 중요 변화 없음" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Telegram alert
        if: github.event_name != 'push' && hashFiles('out/khs_us_investment_alert.html') != '' && steps.telegram_route.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_DIRECT: ${{ secrets.KHS887900_CHAT_ID }}
        run: python scripts/khs_us_investment_telegram_send.py send

      - name: Hold alert until exact Telegram route is ready
        if: github.event_name != 'push' && hashFiles('out/khs_us_investment_alert.html') != '' && steps.telegram_route.outputs.ready != 'true'
        run: |
          echo "중요 변화는 감지됐지만 @khs887900_bot 경로가 확인될 때까지 seen 상태를 저장하지 않습니다." >> "$GITHUB_STEP_SUMMARY"
          echo "경로가 복구되면 같은 중요 변화를 다시 송출 시도합니다." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when exact Telegram route is unavailable
        if: steps.telegram_route.outputs.ready != 'true'
        run: |
          echo "Telegram 경로 검증 실패: @khs887900_bot + KHS887900_CHAT_ID가 정확히 확인되지 않아 상태를 저장하지 않습니다." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Persist seen state after confirmed delivery
        if: github.event_name != 'push' && success() && hashFiles('out/khs_us_investment_pending_seen.json') != '' && hashFiles('out/khs_us_investment_delivery.json') != ''
        run: cp out/khs_us_investment_pending_seen.json data/khs_us_investment_seen.json

      - name: Persist no-alert seen state
        if: github.event_name != 'push' && success() && hashFiles('out/khs_us_investment_alert.html') == '' && hashFiles('out/khs_us_investment_pending_seen.json') != ''
        run: cp out/khs_us_investment_pending_seen.json data/khs_us_investment_seen.json

      - name: Commit state
        if: github.event_name != 'push' && success() && hashFiles('data/khs_us_investment_seen.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The watcher can finish while another repository automation advances main.
          # Preserve this run's computed state, then rebase it semantically onto the
          # latest remote state instead of rebasing the JSON file textually.
          cp data/khs_us_investment_seen.json /tmp/khs_us_investment_pending_state.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import json
          from pathlib import Path

          remote_path = Path("data/khs_us_investment_seen.json")
          pending_path = Path("/tmp/khs_us_investment_pending_state.json")

          def load(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return {}

          remote = load(remote_path)
          pending = load(pending_path)
          merged = dict(remote)

          def later(a, b):
              return str(a or "") >= str(b or "")

          for key in ("seen", "semantic_seen"):
              out = dict(remote.get(key) or {})
              for item, value in (pending.get(key) or {}).items():
                  if item not in out or later(value, out.get(item)):
                      out[item] = value
              merged[key] = out

          event_states = dict(remote.get("event_states") or {})
          for family, local_bucket in (pending.get("event_states") or {}).items():
              remote_bucket = event_states.get(family) or {}
              if not remote_bucket or later(local_bucket.get("updated_at"), remote_bucket.get("updated_at")):
                  event_states[family] = local_bucket
          merged["event_states"] = event_states

          remote_official = remote.get("official_status") or {}
          pending_official = pending.get("official_status") or {}
          if pending_official and (
              not remote_official
              or later(pending_official.get("updated_at"), remote_official.get("updated_at"))
          ):
              merged["official_status"] = pending_official

          for key, value in pending.items():
              if key in {"seen", "semantic_seen", "event_states", "official_status"}:
                  continue
              if key.endswith("_version"):
                  try:
                      merged[key] = max(int(remote.get(key) or 0), int(value or 0))
                  except Exception:
                      merged[key] = value
              elif key.endswith("_at"):
                  if later(value, remote.get(key)):
                      merged[key] = value
              elif key not in merged:
                  merged[key] = value
              elif isinstance(value, bool):
                  merged[key] = bool(merged.get(key)) or value

          remote_path.write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

            git add data/khs_us_investment_seen.json
            if git diff --cached --quiet; then
              echo "state unchanged after remote merge"
              exit 0
            fi

            git commit -m "Record US investment watch state"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "state push raced with another main update; retrying merge attempt=$attempt"
            sleep $((attempt * 2))
          done
          exit 1
