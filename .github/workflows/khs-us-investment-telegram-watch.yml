name: KHS US investment Telegram watch

on:
  push:
    paths:
      - ".github/workflows/khs-us-investment-telegram-watch.yml"
      - "scripts/khs_us_investment_watch.py"
      - "data/khs_us_investment_watch_config.json"
  schedule:
    # GitHub cron is UTC. 15-minute monitoring, offset from other policy jobs.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: khs-us-investment-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate watcher
        run: python -m py_compile scripts/khs_us_investment_watch.py

      - name: Validate exact Telegram route
        env:
          TOKEN_GENERIC: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_GENERIC: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN_KHS: ${{ secrets.KHS_TELEGRAM_BOT_TOKEN }}
          CHAT_KHS: ${{ secrets.KHS_TELEGRAM_CHAT_ID }}
          TOKEN_US_INVESTMENT: ${{ secrets.US_INVESTMENT_TELEGRAM_BOT_TOKEN }}
          CHAT_US_INVESTMENT: ${{ secrets.US_INVESTMENT_TELEGRAM_CHAT_ID }}
          TOKEN_POLICY: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
          CHAT_POLICY: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          TOKEN_YEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          CHAT_YEN: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          TOKEN_HONAM: ${{ secrets.HONAM_TELEGRAM_BOT_TOKEN }}
          CHAT_HONAM: ${{ secrets.HONAM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@").lower()
          candidates = [
              ("TELEGRAM", os.getenv("TOKEN_GENERIC"), os.getenv("CHAT_GENERIC")),
              ("KHS", os.getenv("TOKEN_KHS"), os.getenv("CHAT_KHS")),
              ("US_INVESTMENT", os.getenv("TOKEN_US_INVESTMENT"), os.getenv("CHAT_US_INVESTMENT")),
              ("KHS_POLICY", os.getenv("TOKEN_POLICY"), os.getenv("CHAT_POLICY")),
              ("YEN_CARRY", os.getenv("TOKEN_YEN"), os.getenv("CHAT_YEN")),
              ("HONAM", os.getenv("TOKEN_HONAM"), os.getenv("CHAT_HONAM")),
          ]

          checked = []
          for label, token, chat_id in candidates:
              token = (token or "").strip()
              chat_id = (chat_id or "").strip()
              if not token:
                  continue
              try:
                  with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=20) as response:
                      identity = json.loads(response.read().decode("utf-8"))
                  username = str((identity.get("result") or {}).get("username") or "")
              except Exception as exc:
                  checked.append(f"{label}=API_ERROR:{type(exc).__name__}")
                  continue
              checked.append(f"{label}=@{username or 'unknown'}")
              if identity.get("ok") and username.lower() == expected:
                  if not chat_id:
                      raise RuntimeError(f"Matched @{username} through {label}, but its chat id secret is missing")
                  print(f"telegram_route_valid=true source={label} bot=@{username} chat_id_present=true")
                  break
          else:
              raise RuntimeError(
                  "No configured Telegram token matches "
                  f"@{expected}. Checked identities: {', '.join(checked) or 'no token secrets present'}"
              )
          PY

      - name: Run US investment watch
        run: python scripts/khs_us_investment_watch.py

      - name: Publish summary
        if: always()
        run: |
          if [ -f out/khs_us_investment_alert.html ]; then
            echo "대미투자 Telegram 알림 생성됨" >> "$GITHUB_STEP_SUMMARY"
            sed -E 's/<[^>]+>//g' out/khs_us_investment_alert.html >> "$GITHUB_STEP_SUMMARY"
          else
            echo "대미투자: 새 중요 변화 없음" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Telegram alert
        if: hashFiles('out/khs_us_investment_alert.html') != ''
        env:
          TOKEN_GENERIC: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_GENERIC: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN_KHS: ${{ secrets.KHS_TELEGRAM_BOT_TOKEN }}
          CHAT_KHS: ${{ secrets.KHS_TELEGRAM_CHAT_ID }}
          TOKEN_US_INVESTMENT: ${{ secrets.US_INVESTMENT_TELEGRAM_BOT_TOKEN }}
          CHAT_US_INVESTMENT: ${{ secrets.US_INVESTMENT_TELEGRAM_CHAT_ID }}
          TOKEN_POLICY: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
          CHAT_POLICY: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          TOKEN_YEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          CHAT_YEN: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          TOKEN_HONAM: ${{ secrets.HONAM_TELEGRAM_BOT_TOKEN }}
          CHAT_HONAM: ${{ secrets.HONAM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@").lower()
          candidates = [
              ("TELEGRAM", os.getenv("TOKEN_GENERIC"), os.getenv("CHAT_GENERIC")),
              ("KHS", os.getenv("TOKEN_KHS"), os.getenv("CHAT_KHS")),
              ("US_INVESTMENT", os.getenv("TOKEN_US_INVESTMENT"), os.getenv("CHAT_US_INVESTMENT")),
              ("KHS_POLICY", os.getenv("TOKEN_POLICY"), os.getenv("CHAT_POLICY")),
              ("YEN_CARRY", os.getenv("TOKEN_YEN"), os.getenv("CHAT_YEN")),
              ("HONAM", os.getenv("TOKEN_HONAM"), os.getenv("CHAT_HONAM")),
          ]

          selected = None
          checked = []
          for label, token, chat_id in candidates:
              token = (token or "").strip()
              chat_id = (chat_id or "").strip()
              if not token:
                  continue
              try:
                  with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=20) as response:
                      identity = json.loads(response.read().decode("utf-8"))
                  username = str((identity.get("result") or {}).get("username") or "")
              except Exception as exc:
                  checked.append(f"{label}=API_ERROR:{type(exc).__name__}")
                  continue
              checked.append(f"{label}=@{username or 'unknown'}")
              if identity.get("ok") and username.lower() == expected and chat_id:
                  selected = (label, token, chat_id, username)
                  break

          if not selected:
              raise RuntimeError(
                  "Cannot send: no configured Telegram route matches "
                  f"@{expected}. Checked identities: {', '.join(checked) or 'no token secrets present'}"
              )

          label, token, chat_id, username = selected
          text = pathlib.Path("out/khs_us_investment_alert.html").read_text(encoding="utf-8").strip()
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected message: {result}")

          pathlib.Path("out/khs_us_investment_delivery.json").write_text(
              json.dumps({
                  "bot": username,
                  "route_source": label,
                  "message_id": result.get("result", {}).get("message_id"),
              }, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(
              f"telegram_delivery_confirmed=true source={label} "
              f"bot=@{username} message_id={result.get('result', {}).get('message_id')}"
          )
          PY

      - name: Persist seen state after confirmed delivery
        if: success() && hashFiles('out/khs_us_investment_pending_seen.json') != '' && hashFiles('out/khs_us_investment_delivery.json') != ''
        run: cp out/khs_us_investment_pending_seen.json data/khs_us_investment_seen.json

      - name: Persist no-alert seen state
        if: success() && hashFiles('out/khs_us_investment_alert.html') == '' && hashFiles('out/khs_us_investment_pending_seen.json') != ''
        run: cp out/khs_us_investment_pending_seen.json data/khs_us_investment_seen.json

      - name: Commit state
        if: success() && hashFiles('data/khs_us_investment_seen.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/khs_us_investment_seen.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "Record US investment watch state"
            git pull --rebase origin main
            git push
          fi
