name: KHS US investment Telegram watch

on:
  push:
    paths:
      - ".github/workflows/khs-us-investment-telegram-watch.yml"
      - "scripts/khs_us_investment_watch.py"
      - "data/khs_us_investment_watch_config.json"
  schedule:
    # GitHub cron is UTC. 15-minute monitoring, offset from other policy jobs.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: khs-us-investment-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate watcher
        run: python -m py_compile scripts/khs_us_investment_watch.py

      - name: Validate exact Telegram route
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_DIRECT: ${{ secrets.KHS887900_CHAT_ID }}
          TELEGRAM_CHAT_ID_POLICY: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_GENERIC: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("KHS887900_BOT_TOKEN secret is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=20) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          def get_chat(chat_id):
              if not chat_id:
                  return None
              query = urllib.parse.urlencode({"chat_id": chat_id})
              try:
                  with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getChat?{query}", timeout=20) as response:
                      result = json.loads(response.read().decode("utf-8"))
                  return result.get("result") if result.get("ok") else None
              except Exception:
                  return None

          candidates = [
              (os.getenv("TELEGRAM_CHAT_ID_DIRECT") or "").strip(),
              (os.getenv("TELEGRAM_CHAT_ID_POLICY") or "").strip(),
              (os.getenv("TELEGRAM_CHAT_ID_GENERIC") or "").strip(),
          ]
          chat = None
          for chat_id in candidates:
              chat = get_chat(chat_id)
              if chat:
                  break

          if not chat:
              with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getUpdates?limit=100", timeout=20) as response:
                  updates = json.loads(response.read().decode("utf-8"))
              if updates.get("ok"):
                  for update in reversed(updates.get("result") or []):
                      obj = update.get("message") or update.get("channel_post") or update.get("edited_message") or {}
                      candidate = obj.get("chat") or {}
                      if candidate.get("id") is not None:
                          chat = candidate
                          break

          if not chat:
              raise RuntimeError("@khs887900_bot is valid, but no reachable Telegram chat could be resolved")

          print(f"telegram_route_valid=true bot=@{username} chat_type={chat.get('type', 'unknown')}")
          PY

      - name: Run US investment watch
        run: python scripts/khs_us_investment_watch.py

      - name: Publish summary
        if: always()
        run: |
          if [ -f out/khs_us_investment_alert.html ]; then
            echo "대미투자 Telegram 알림 생성됨" >> "$GITHUB_STEP_SUMMARY"
            sed -E 's/<[^>]+>//g' out/khs_us_investment_alert.html >> "$GITHUB_STEP_SUMMARY"
          else
            echo "대미투자: 새 중요 변화 없음" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Telegram alert
        if: hashFiles('out/khs_us_investment_alert.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_DIRECT: ${{ secrets.KHS887900_CHAT_ID }}
          TELEGRAM_CHAT_ID_POLICY: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_GENERIC: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("KHS887900_BOT_TOKEN secret is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=20) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          def get_chat(chat_id):
              if not chat_id:
                  return None
              query = urllib.parse.urlencode({"chat_id": chat_id})
              try:
                  with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getChat?{query}", timeout=20) as response:
                      result = json.loads(response.read().decode("utf-8"))
                  return result.get("result") if result.get("ok") else None
              except Exception:
                  return None

          chat = None
          for chat_id in [
              (os.getenv("TELEGRAM_CHAT_ID_DIRECT") or "").strip(),
              (os.getenv("TELEGRAM_CHAT_ID_POLICY") or "").strip(),
              (os.getenv("TELEGRAM_CHAT_ID_GENERIC") or "").strip(),
          ]:
              chat = get_chat(chat_id)
              if chat:
                  break

          if not chat:
              with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getUpdates?limit=100", timeout=20) as response:
                  updates = json.loads(response.read().decode("utf-8"))
              if updates.get("ok"):
                  for update in reversed(updates.get("result") or []):
                      obj = update.get("message") or update.get("channel_post") or update.get("edited_message") or {}
                      candidate = obj.get("chat") or {}
                      if candidate.get("id") is not None:
                          chat = candidate
                          break

          if not chat or chat.get("id") is None:
              raise RuntimeError("@khs887900_bot chat id could not be resolved")

          text = pathlib.Path("out/khs_us_investment_alert.html").read_text(encoding="utf-8").strip()
          payload = urllib.parse.urlencode({
              "chat_id": str(chat["id"]),
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected message: {result}")

          pathlib.Path("out/khs_us_investment_delivery.json").write_text(
              json.dumps({
                  "bot": username,
                  "message_id": result.get("result", {}).get("message_id"),
                  "chat_type": chat.get("type"),
              }, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"telegram_delivery_confirmed=true bot=@{username} message_id={result.get('result', {}).get('message_id')}")
          PY

      - name: Persist seen state after confirmed delivery
        if: success() && hashFiles('out/khs_us_investment_pending_seen.json') != '' && hashFiles('out/khs_us_investment_delivery.json') != ''
        run: cp out/khs_us_investment_pending_seen.json data/khs_us_investment_seen.json

      - name: Persist no-alert seen state
        if: success() && hashFiles('out/khs_us_investment_alert.html') == '' && hashFiles('out/khs_us_investment_pending_seen.json') != ''
        run: cp out/khs_us_investment_pending_seen.json data/khs_us_investment_seen.json

      - name: Commit state
        if: success() && hashFiles('data/khs_us_investment_seen.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/khs_us_investment_seen.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "Record US investment watch state"
            git pull --rebase origin main
            git push
          fi
