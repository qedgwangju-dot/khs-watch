name: LNG Telegram route smoke test

on:
  push:
    paths:
      - ".github/workflows/lng-telegram-smoke.yml"
  pull_request:
    paths:
      - ".github/workflows/lng-telegram-smoke.yml"
      - "data/lng_telegram_smoke_trigger.txt"

permissions:
  contents: write

jobs:
  verify-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bot and send LNG setup test
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip()
          if not token or not chat_id:
              raise RuntimeError("KHS_POLICY Telegram secret is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          if not identity.get("ok"):
              raise RuntimeError(f"Telegram getMe failed: {identity}")
          actual = identity.get("result", {}).get("username", "")
          if actual != expected:
              raise RuntimeError(
                  f"Wrong Telegram bot: expected=@{expected}, actual=@{actual or 'unknown'}; test blocked"
              )

          now = dt.datetime.now(ZoneInfo("Asia/Seoul"))
          text = (
              "✅ LNG·천연가스 감시 연결 완료\n\n"
              f"발신 봇: @{actual}\n"
              f"확인 시각: {now:%Y-%m-%d %H:%M:%S KST}\n"
              "확인 주기: 매시간 1회\n\n"
              "감시: 카타르 LNG 중단·재개, Force Majeure, 호르무즈·홍해 통항, "
              "유럽 TTF, Brent, 동북아 JKM 조달, 한국 공식 수급 발표\n\n"
              "새 확정 변화가 없으면 보내지 않고, 재진입·추가 악화·정상화 때만 알립니다."
          )
          payload = urllib.parse.urlencode(
              {"chat_id": chat_id, "text": text, "disable_web_page_preview": "true"}
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              sent = json.loads(response.read().decode("utf-8"))
          if not sent.get("ok"):
              raise RuntimeError(f"Telegram sendMessage failed: {sent}")

          result = {
              "status": "confirmed",
              "bot": f"@{actual}",
              "message_id": sent.get("result", {}).get("message_id"),
              "confirmed_at_kst": now.isoformat(timespec="seconds"),
              "purpose": "lng_supply_crisis_monitor_setup",
          }
          path = pathlib.Path("data/lng_telegram_smoke_latest.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Commit verification result
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lng_telegram_smoke_latest.json
          git commit -m "Record LNG Telegram route verification" || exit 0
          git pull --rebase origin main
          git push
