name: Bio Korean Translation Healthcheck

on:
  push:
    paths:
      - ".github/workflows/bio-korean-translation-healthcheck.yml"

permissions:
  contents: write

jobs:
  test-korean-output:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs887988798879887988798879_bot"
      BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
      BIO_TELEGRAM_CHAT_ID: ${{ secrets.BIO_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate sender
        run: python -m py_compile scripts/qlex_telegram_send.py
      - name: Build original-body test
        run: |
          mkdir -p out
          cat > out/bio_korean_translation_test.md <<'EOF'
          [바이오 감시] Intismeran·KEYTRUDA QLEX 새 데이터

          1. Merck and Moderna Announce Phase 3 INTerpath-001 Trial of Intismeran Autogene Plus KEYTRUDA Met Endpoints of Recurrence-Free Survival (RFS) and Distant Metastasis-Free Survival (DMFS) in Patients With Completely Resected Stage IIB-IV Melanoma
          - 출처 구분: 2차 자료
          - 발표/게시: Wed, 19 Aug 2026 10:45:00 GMT
          - 판정: 제목만으로 확정하지 않습니다.
          - 알테오젠 관점: Intismeran 성공은 KEYTRUDA 병용영역 확대 가능성을 높이지만 실제 QLEX 적용·허가 확대를 확인해야 합니다.
          - 원문: https://marketchameleon.com/PressReleases/i/2361029/MRNA/merck-and-moderna-announce-phase-3-interpath001

          판정
          - 테스트: 원문 본문을 직접 열어 RFS·DMFS·규제 일정 등 핵심 내용을 한국어로 넣는지 확인합니다.
          EOF
      - name: Send body-enriched test and save proof
        run: |
          result=$(python scripts/qlex_telegram_send.py out/bio_korean_translation_test.md)
          echo "$result"
          RESULT="$result" python - <<'PY'
          import datetime as dt, json, os, pathlib, re
          from zoneinfo import ZoneInfo
          text=os.environ['RESULT']
          match=re.search(r'message_ids=\[([^\]]*)\]', text)
          ids=[]
          if match:
              ids=[int(x.strip()) for x in match.group(1).split(',') if x.strip().isdigit()]
          payload={
              'status':'confirmed',
              'confirmed_at_kst':dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat(timespec='seconds'),
              'message_ids':ids,
              'test':'Direct publisher article body opened and summarized into Korean before Telegram send',
          }
          pathlib.Path('data/bio_korean_translation_healthcheck.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit verification proof
        run: |
          git config user.name "bio-translation-healthcheck[bot]"
          git config user.email "bio-translation-healthcheck[bot]@users.noreply.github.com"
          git add data/bio_korean_translation_healthcheck.json
          git commit -m "Confirm bio original-body Telegram enrichment" || exit 0
          git pull --rebase origin main
          git push
