name: Data Center Growth Telegram Watch

on:
  push:
    paths:
      - ".github/workflows/data-center-growth-telegram-watch.yml"
      - "scripts/data_center_growth_watch.py"
      - "scripts/pjm_data_center_policy_watch.py"
      - "scripts/clean_pjm_alert_html.py"
      - "scripts/guard_pjm_baseline_source.py"
      - "scripts/us_data_center_time_to_power_watch.py"
      - "scripts/guard_us_time_to_power_metrics_source.py"
      - "scripts/clean_us_time_to_power_alert_html.py"
      - "scripts/us_data_center_generation_buildout_watch.py"
      - "scripts/us_data_center_cancellation_risk_watch.py"
      - "scripts/us_ai_data_center_buildout_watch.py"
      - "scripts/remove_telegram_italics.py"
      - "scripts/korea_aidc_policy_watch.py"
      - "scripts/korea_aidc_policy_watch_v2.py"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-center-growth-telegram-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.DATA_CENTER_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.DATA_CENTER_TELEGRAM_CHAT_ID }}
      AIDC_TELEGRAM_BOT_TOKEN: ${{ secrets.ENERGY_MIX_TELEGRAM_BOT_TOKEN }}
      AIDC_TELEGRAM_CHAT_ID: ${{ secrets.ENERGY_MIX_TELEGRAM_CHAT_ID }}
      AIDC_FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      AIDC_EXPECTED_TELEGRAM_BOT_USERNAME: khs887988798879887988798879_bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main state
        run: |
          git fetch origin main
          git merge --ff-only origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl beautifulsoup4 googlenewsdecoder

      - name: Validate data-center Telegram route
        run: |
          python - <<'PY'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat:
              raise SystemExit("DATA_CENTER_TELEGRAM_BOT_TOKEN or DATA_CENTER_TELEGRAM_CHAT_ID is missing")
          data = requests.get(f"https://api.telegram.org/bot{token}/getMe", timeout=20).json()
          if not data.get("ok"):
              raise SystemExit("Telegram getMe failed")
          username = data["result"].get("username", "")
          if username.lower() != "khs88790088790000887900_bot":
              raise SystemExit(f"Wrong Telegram bot: @{username}")
          print(f"Telegram route OK: @{username}")
          PY

      - name: Check official Census data center series
        run: python scripts/data_center_growth_watch.py

      - name: Check Korea AIDC special-law power and permit policy
        run: python scripts/korea_aidc_policy_watch_v2.py

      - name: Check PJM RBP IRAS and large-load policy
        run: |
          sed -i 's/^FORMAT_VERSION = 2$/FORMAT_VERSION = 5/' scripts/pjm_data_center_policy_watch.py
          python scripts/guard_pjm_baseline_source.py

          mkdir -p out
          pjm_ok=0
          for attempt in 1 2 3; do
            set +e
            python scripts/pjm_data_center_policy_watch.py > out/pjm_data_center_policy_run.log 2>&1
            code=$?
            set -e
            cat out/pjm_data_center_policy_run.log

            if [ "$code" -eq 0 ]; then
              pjm_ok=1
              break
            fi

            if grep -Eq 'insidelines\.pjm\.com|PJM_BASELINE' out/pjm_data_center_policy_run.log \
              && grep -Eq 'ConnectTimeout|ReadTimeout|Timeout|ConnectionError|requests\.exceptions' out/pjm_data_center_policy_run.log; then
              echo "PJM 기준 원문 연결 실패 · ${attempt}/3 재시도"
              sleep $((attempt * 5))
            else
              exit "$code"
            fi
          done

          if [ "$pjm_ok" -ne 1 ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          state_path = Path("data/pjm_data_center_policy_state.json")
          pending_path = Path("out/pjm_data_center_policy_pending_state.json")
          status_path = Path("out/pjm_data_center_policy_status.md")

          try:
              state = json.loads(state_path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"PJM live source unavailable and saved state unreadable: {exc}")

          baseline = state.get("baseline") or {}
          required = ("target_mw", "max_price_usd_mw_day", "max_years", "planned_start")
          if not state.get("initialized") or any(baseline.get(key) is None for key in required):
              raise SystemExit("PJM live source unavailable and no complete verified baseline is stored")

          pending = dict(state)
          pending["source_errors"] = [
              "PJM Inside Lines 기준 원문 연결시간 초과 · 직전 검증 공식 기준 유지"
          ]
          pending_path.write_text(
              json.dumps(pending, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          status_path.write_text(
              "# PJM 데이터센터 전력정책 감시\n\n"
              f"- RBP 기준 부족분: **{baseline.get('target_mw')} MW**\n"
              f"- 최대가격: **${baseline.get('max_price_usd_mw_day')}/MW-day**\n"
              f"- 최대 계약기간: **{baseline.get('max_years')}년**\n"
              f"- 개시 목표: **{baseline.get('planned_start')}**\n"
              "- 알림: **아니오**\n"
              "- 원천 오류: **PJM Inside Lines 기준 원문 연결시간 초과 · 직전 검증 공식 기준 유지**\n",
              encoding="utf-8",
          )
          print(f"pjm_policy_fallback=true baseline={baseline}")
          PY
          fi

      - name: Group and translate PJM source rows
        run: python scripts/clean_pjm_alert_html.py

      - name: Check US data center time-to-power execution
        run: |
          python scripts/guard_us_time_to_power_metrics_source.py
          python scripts/us_data_center_time_to_power_watch.py

      - name: Improve US time-to-power Telegram readability
        run: python scripts/clean_us_time_to_power_alert_html.py

      - name: Check US data center generation buildout execution
        run: python scripts/us_data_center_generation_buildout_watch.py

      - name: Check US data center cancellation and stranded-cost risk
        run: python scripts/us_data_center_cancellation_risk_watch.py

      - name: Check Epoch AI major US data-center buildout
        run: python scripts/us_ai_data_center_buildout_watch.py

      - name: Force regular Telegram font
        run: python scripts/remove_telegram_italics.py

      - name: Send Telegram only on meaningful changes
        run: |
          python - <<'PY'
          import os, pathlib, requests, time

          default_token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          default_chat = os.environ["TELEGRAM_CHAT_ID"].strip()
          aidc_token = os.environ.get("AIDC_TELEGRAM_BOT_TOKEN", "").strip()
          aidc_chat = (
              os.environ.get("AIDC_TELEGRAM_CHAT_ID", "").strip()
              or os.environ.get("AIDC_FALLBACK_TELEGRAM_CHAT_ID", "").strip()
          )
          aidc_expected = os.environ.get("AIDC_EXPECTED_TELEGRAM_BOT_USERNAME", "").strip().lstrip("@")

          files = [
              pathlib.Path("out/data_center_growth_alert.txt"),
              pathlib.Path("out/korea_aidc_policy_alert.txt"),
              pathlib.Path("out/pjm_data_center_policy_alert.txt"),
              pathlib.Path("out/us_data_center_time_to_power_alert.txt"),
              pathlib.Path("out/us_data_center_generation_buildout_alert.txt"),
              pathlib.Path("out/us_data_center_cancellation_risk_alert.txt"),
              pathlib.Path("out/us_ai_data_center_buildout_alert.txt"),
          ]
          sent = 0

          for p in files:
              if not p.exists() or not p.read_text(encoding="utf-8").strip():
                  continue

              text = p.read_text(encoding="utf-8").strip()
              token = default_token
              chat = default_chat
              payload = {"chat_id": chat, "text": text}
              route_label = "data-center"

              if p.name == "korea_aidc_policy_alert.txt":
                  if not aidc_token or not aidc_chat:
                      raise SystemExit("AIDC Telegram token/chat id missing; wrong-bot fallback is blocked")
                  me = requests.get(f"https://api.telegram.org/bot{aidc_token}/getMe", timeout=20).json()
                  actual = str(me.get("result", {}).get("username", ""))
                  if not me.get("ok") or actual.lower() != aidc_expected.lower():
                      raise SystemExit(
                          f"Wrong AIDC Telegram bot blocked: expected=@{aidc_expected}, actual=@{actual or 'unknown'}"
                      )
                  token = aidc_token
                  chat = aidc_chat
                  payload = {
                      "chat_id": chat,
                      "text": text,
                      "parse_mode": "HTML",
                      "link_preview_options": {"is_disabled": True},
                  }
                  route_label = f"aidc:@{actual}"
              elif p.name == "pjm_data_center_policy_alert.txt":
                  payload["parse_mode"] = "HTML"
                  payload["link_preview_options"] = {
                      "is_disabled": False,
                      "url": "https://insidelines.pjm.com/pjm-reliability-backstop-proposal-outlines-steps-to-secure-new-supply-and-maintain-reliability/",
                      "prefer_large_media": True,
                      "show_above_text": False,
                  }
                  payload["reply_markup"] = {
                      "inline_keyboard": [
                          [
                              {"text": "📌 PJM RBP 원문", "url": "https://www.pjm.com/committees-and-groups/cifp-rbp"},
                              {"text": "⚖️ FERC 원문", "url": "https://www.ferc.gov/news-events/news/decisions-notices"},
                          ],
                          [
                              {"text": "🏛 H.R.9340", "url": "https://energycommerce.house.gov/posts/ratepayer-protection-act-passes-house-with-strong-bipartisan-support"},
                              {"text": "🏛 S.5199", "url": "https://www.govinfo.gov/app/details/BILLS-119s5199is"},
                          ],
                          [
                              {"text": "📄 PJM 기준 설명", "url": "https://insidelines.pjm.com/pjm-reliability-backstop-proposal-outlines-steps-to-secure-new-supply-and-maintain-reliability/"},
                              {"text": "⚙️ FERC RM26-4", "url": "https://www.ferc.gov/rm26-4"},
                          ],
                      ]
                  }
              elif p.name == "us_data_center_time_to_power_alert.txt":
                  payload["parse_mode"] = "HTML"
                  payload["link_preview_options"] = {"is_disabled": True}
                  payload["reply_markup"] = {
                      "inline_keyboard": [
                          [
                              {"text": "⚡ FERC 대형부하", "url": "https://www.ferc.gov/news-events/news/ferc-launches-aggressive-targeted-action-speed-large-load-integration"},
                              {"text": "🔌 MISO 대형부하", "url": "https://www.misoenergy.org/planning/large-loads---container-page/large-load-additions/"},
                          ],
                          [
                              {"text": "🔋 MISO ERAS", "url": "https://www.misoenergy.org/meet-miso/media-center/2026---news-releases/miso-accelerates-new-generation-and-storage-projects-with-fifth-eras-cycle/"},
                              {"text": "🏗️ ERCOT Batch Zero", "url": "https://www.ercot.com/services/rq/large-load-integration"},
                          ],
                      ]
                  }
              elif p.name == "us_data_center_generation_buildout_alert.txt":
                  payload["parse_mode"] = "HTML"
                  payload["link_preview_options"] = {"is_disabled": True}
                  payload["reply_markup"] = {
                      "inline_keyboard": [
                          [
                              {"text": "🔥 Moody’s 45GW 기준", "url": "https://news.bloombergtax.com/financial-accounting/us-ai-boom-needs-110-billion-of-new-power-plants-moodys-says"},
                              {"text": "🏭 GE Vernova 공급능력", "url": "https://www.gevernova.com/news/articles/ge-vernova-releases-second-quarter-2026-financial-results"},
                          ],
                          [
                              {"text": "⚡ IEA 전력수요", "url": "https://www.iea.org/reports/energy-and-ai/energy-demand-from-ai"},
                              {"text": "⛽ EIA 가스발전", "url": "https://www.eia.gov/todayinenergy/detail.php?id=67344"},
                          ],
                      ]
                  }
              elif p.name == "us_data_center_cancellation_risk_alert.txt":
                  payload["parse_mode"] = "HTML"
                  payload["link_preview_options"] = {"is_disabled": True}
                  payload["reply_markup"] = {
                      "inline_keyboard": [
                          [
                              {"text": "⚠️ 취소·지연 파급효과", "url": "https://www.datacenterknowledge.com/energy-power-supply/the-ripple-effect-of-data-center-project-cancellations-and-delays"},
                              {"text": "📉 Phantom load", "url": "https://www.capgemini.com/insights/research-library/data-centers-and-electricity-demand/"},
                          ],
                          [
                              {"text": "⚖️ FERC 대형부하 개편", "url": "https://www.ferc.gov/news-events/news/ferc-launches-aggressive-targeted-action-speed-large-load-integration"},
                              {"text": "💰 Cost Recovery", "url": "https://www.ferc.gov/news-events/news/commissioner-rosners-remarks-large-load-show-cause-orders-e-7-e-12-june-18-2026"},
                          ],
                      ]
                  }
              elif p.name == "us_ai_data_center_buildout_alert.txt":
                  payload["parse_mode"] = "HTML"
                  payload["link_preview_options"] = {"is_disabled": True}
                  payload["reply_markup"] = {
                      "inline_keyboard": [
                          [
                              {"text": "📊 Epoch AI 데이터", "url": "https://epoch.ai/data/ai-data-centers"},
                              {"text": "🛰 건설 타임라인", "url": "https://epoch.ai/data/ai-data-centers/directory"},
                          ],
                          [
                              {"text": "📐 Epoch 방법론", "url": "https://epoch.ai/data/data-centers-documentation/methodology"}
                          ],
                      ]
                  }
              else:
                  payload["link_preview_options"] = {"is_disabled": True}

              # Telegram sendMessage has a 4,096-character limit. Keep
              # complete HTML lines together and split long reports into safe
              # chunks. This is especially important for the 15-project Epoch
              # AI buildout report, where every project now includes energy
              # source evidence.
              chunks = []
              current = []
              current_len = 0
              chunk_limit = 3400
              for line in text.splitlines():
                  line_len = len(line) + 1
                  if line_len > chunk_limit:
                      raise SystemExit(
                          f"Telegram line too long for safe HTML split: {p.name} / {len(line)} chars"
                      )
                  if current and current_len + line_len > chunk_limit:
                      chunks.append("\n".join(current).strip())
                      current = [line]
                      current_len = line_len
                  else:
                      current.append(line)
                      current_len += line_len
              if current:
                  chunks.append("\n".join(current).strip())
              if not chunks:
                  continue

              message_ids = []
              for chunk_index, chunk in enumerate(chunks, 1):
                  send_payload = dict(payload)
                  send_payload["text"] = (
                      f"[{chunk_index}/{len(chunks)}]\n" if len(chunks) > 1 else ""
                  ) + chunk
                  if chunk_index > 1:
                      send_payload.pop("reply_markup", None)

                  r = requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      json=send_payload,
                      timeout=30,
                  )
                  data = r.json()
                  if not r.ok or not data.get("ok"):
                      desc = data.get("description", "unknown") if isinstance(data, dict) else "unknown"
                      raise SystemExit(
                          f"Telegram send failed for {p.name}: HTTP {r.status_code} / {desc}"
                      )
                  message_ids.append(data["result"]["message_id"])
                  time.sleep(1)

              print(
                  f"Telegram sent {p.name}: route={route_label} "
                  f"messages={len(message_ids)} message_ids={message_ids}"
              )
              sent += len(message_ids)

          if not sent:
              print("No meaningful change; Telegram silent.")
          PY

      - name: Save latest official baselines
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cp out/data_center_growth_pending_state.json "$tmpdir/data_center_growth_state.json"
          cp out/korea_aidc_policy_pending_state.json "$tmpdir/korea_aidc_policy_state.json"
          cp out/pjm_data_center_policy_pending_state.json "$tmpdir/pjm_data_center_policy_state.json"
          cp out/us_data_center_time_to_power_pending_state.json "$tmpdir/us_data_center_time_to_power_state.json"
          cp out/us_data_center_generation_buildout_pending_state.json "$tmpdir/us_data_center_generation_buildout_state.json"
          cp out/us_data_center_cancellation_risk_pending_state.json "$tmpdir/us_data_center_cancellation_risk_state.json"
          cp out/us_ai_data_center_buildout_pending_state.json "$tmpdir/us_ai_data_center_buildout_state.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          saved=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp "$tmpdir/data_center_growth_state.json" data/data_center_growth_state.json
            cp "$tmpdir/korea_aidc_policy_state.json" data/korea_aidc_policy_state.json
            cp "$tmpdir/pjm_data_center_policy_state.json" data/pjm_data_center_policy_state.json
            cp "$tmpdir/us_data_center_time_to_power_state.json" data/us_data_center_time_to_power_state.json
            cp "$tmpdir/us_data_center_generation_buildout_state.json" data/us_data_center_generation_buildout_state.json
            cp "$tmpdir/us_data_center_cancellation_risk_state.json" data/us_data_center_cancellation_risk_state.json
            cp "$tmpdir/us_ai_data_center_buildout_state.json" data/us_ai_data_center_buildout_state.json

            git add data/data_center_growth_state.json \
                    data/korea_aidc_policy_state.json \
                    data/pjm_data_center_policy_state.json \
                    data/us_data_center_time_to_power_state.json \
                    data/us_data_center_generation_buildout_state.json \
                    data/us_data_center_cancellation_risk_state.json \
                    data/us_ai_data_center_buildout_state.json

            if git diff --cached --quiet; then
              echo "State unchanged against latest main."
              saved=1
              break
            fi

            git commit -m "Update data center watch states [skip ci]"
            if git push origin HEAD:main; then
              saved=1
              break
            fi

            echo "State push raced with another main update · ${attempt}/3 재시도"
            sleep $((attempt * 2))
          done

          if [ "$saved" -ne 1 ]; then
            echo "Failed to save data-center states after 3 latest-main retries" >&2
            exit 1
          fi

      - name: Upload watcher status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-center-growth-${{ github.run_id }}
          path: |
            out/data_center_growth_status.md
            out/data_center_growth_alert.txt
            out/data_center_growth_pending_state.json
            out/korea_aidc_policy_status.md
            out/korea_aidc_policy_alert.txt
            out/korea_aidc_policy_alert_meta.json
            out/korea_aidc_policy_pending_state.json
            out/pjm_data_center_policy_status.md
            out/pjm_data_center_policy_alert.txt
            out/pjm_data_center_policy_pending_state.json
            out/us_data_center_time_to_power_status.md
            out/us_data_center_time_to_power_alert.txt
            out/us_data_center_time_to_power_pending_state.json
            out/us_data_center_generation_buildout_status.md
            out/us_data_center_generation_buildout_alert.txt
            out/us_data_center_generation_buildout_pending_state.json
            out/us_data_center_cancellation_risk_status.md
            out/us_data_center_cancellation_risk_alert.txt
            out/us_data_center_cancellation_risk_pending_state.json
            out/us_ai_data_center_buildout_status.md
            out/us_ai_data_center_buildout_alert.txt
            out/us_ai_data_center_buildout_pending_state.json
          if-no-files-found: ignore
          retention-days: 7