      - name: Validate hyperscaler nuclear PPA semantic state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("out/us_data_center_generation_buildout_pending_state.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          bundle = data.get("hyperscaler_nuclear_ppa") or {}
          if int(bundle.get("version") or 0) < 7:
              raise SystemExit("hyperscaler nuclear PPA state version < 7")

          states = bundle.get("states") or {}
          google = states.get("google_constellation") or {}
          amazon = states.get("amazon_constellation_calvert_cliffs") or {}

          allowed = {
              "reported_near_deal", "official_discussion",
              "signed_reported", "signed_official",
              "cancelled_reported", "cancelled_official",
          }
          if google.get("stage") not in allowed:
              raise SystemExit(f"Google-Constellation invalid stage: {google}")
          if google.get("stage") == "signed_official" and not google.get("official"):
              raise SystemExit("Google-Constellation cannot be official-signed without official source")
          if google.get("stage") == "reported_near_deal" and google.get("official"):
              raise SystemExit("Google-Constellation media near-deal incorrectly marked official")

          # Oct. 6 Google/Constellation first-party release supersedes the
          # earlier Bloomberg/Reuters negotiation-only state.
          if google.get("stage") != "signed_official" or not google.get("official"):
              raise SystemExit(f"Google-Constellation must be official signed: {google}")
          if float(google.get("ppa_mw") or 0) != 890.0:
              raise SystemExit(f"Google nuclear PPA MW regression: {google}")
          if int(google.get("years") or 0) != 20:
              raise SystemExit(f"Google nuclear PPA term regression: {google}")
          if float(google.get("total_supply_mw") or 0) != 3590.0:
              raise SystemExit(f"Google total supply MW regression: {google}")
          if float(google.get("nuclear_supply_mw") or 0) != 890.0:
              raise SystemExit(f"Google nuclear uprate MW regression: {google}")
          if float(google.get("other_pjm_supply_mw") or 0) != 2700.0:
              raise SystemExit(f"Google PJM other-supply MW regression: {google}")
          if int(google.get("other_pjm_years") or 0) != 15:
              raise SystemExit(f"Google PJM other-supply term regression: {google}")
          if int(google.get("nuclear_unit_count") or 0) != 11:
              raise SystemExit(f"Google nuclear unit-count regression: {google}")
          if float(google.get("nuclear_upgrade_investment_floor_usd_b") or 0) != 4.3:
              raise SystemExit(f"Google nuclear-upgrade investment regression: {google}")
          if int(google.get("first_uprate_year") or 0) != 2028:
              raise SystemExit(f"Google first uprate year regression: {google}")
          if google.get("asset_mode") != "existing_uprate":
              raise SystemExit(f"Google asset-mode regression: {google}")

          prov = google.get("provenance") or {}
          if google.get("amount_floor_usd_b") == 1.0 and prov.get("amount_floor_usd_b") not in {"media", "prior_media"}:
              raise SystemExit("Google-Constellation $1B amount lost media provenance")
          if google.get("stage") == "signed_reported" and google.get("amount_floor_usd_b") == 1.0 and prov.get("amount_floor_usd_b") != "prior_media":
              raise SystemExit("Google-Constellation prior $1B estimate mislabeled as final signed value")
          if not bundle.get("google_constellation_official_ack"):
              raise SystemExit("Google-Constellation first-party confirmation acknowledgement missing")

          # Never let an unrelated Google solar/storage page create a Talen nuclear-PPA state.
          false_talen = states.get("google_talen") or {}
          if "steel-river-arkansas" in str(false_talen.get("url") or ""):
              raise SystemExit(f"Unrelated Google Steel River page contaminated nuclear PPA state: {false_talen}")

          if (
              amazon.get("stage") != "signed_official"
              or not amazon.get("official")
              or float(amazon.get("ppa_mw") or 0) != 690.0
              or float(amazon.get("uprate_mw") or 0) != 190.0
              or float(amazon.get("plant_capacity_mw") or 0) != 1790.0
              or int(amazon.get("years") or 0) != 20
              or amazon.get("asset_mode") != "existing_uprate"
              or "Calvert Cliffs" not in str(amazon.get("plant") or "")
          ):
              raise SystemExit(f"Amazon-Constellation official comparison baseline invalid: {amazon}")

          print(
              "hyperscaler_nuclear_ppa_semantics=passed "
              f"version={bundle.get('version')} "
              f"google_stage={google.get('stage')} google_official={google.get('official')} "
              f"google_total_mw={google.get('total_supply_mw')} "
              f"google_nuclear_mw={google.get('nuclear_supply_mw')} "
              f"amazon_stage={amazon.get('stage')}"
          )
          PY

