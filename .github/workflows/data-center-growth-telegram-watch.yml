name: Data Center Growth Telegram Watch

on:
  push:
    paths:
      - ".github/workflows/data-center-growth-telegram-watch.yml"
      - "scripts/data_center_growth_watch.py"
      - "scripts/pjm_data_center_policy_watch.py"
      - "scripts/clean_pjm_alert_html.py"
      - "scripts/guard_pjm_baseline_source.py"
      - "scripts/us_data_center_time_to_power_watch.py"
      - "scripts/guard_us_time_to_power_metrics_source.py"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-center-growth-telegram-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.DATA_CENTER_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.DATA_CENTER_TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl beautifulsoup4

      - name: Validate Telegram route
        run: |
          python - <<'PY'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat:
              raise SystemExit("DATA_CENTER_TELEGRAM_BOT_TOKEN or DATA_CENTER_TELEGRAM_CHAT_ID is missing")
          data = requests.get(f"https://api.telegram.org/bot{token}/getMe", timeout=20).json()
          if not data.get("ok"):
              raise SystemExit("Telegram getMe failed")
          username = data["result"].get("username", "")
          if username.lower() != "khs88790088790000887900_bot":
              raise SystemExit(f"Wrong Telegram bot: @{username}")
          print(f"Telegram route OK: @{username}")
          PY

      - name: Check official Census data center series
        run: python scripts/data_center_growth_watch.py

      - name: Check PJM RBP IRAS and large-load policy
        run: |
          sed -i 's/^FORMAT_VERSION = 2$/FORMAT_VERSION = 5/' scripts/pjm_data_center_policy_watch.py
          python scripts/guard_pjm_baseline_source.py
          python scripts/pjm_data_center_policy_watch.py

      - name: Group and translate PJM source rows
        run: python scripts/clean_pjm_alert_html.py

      - name: Check US data center time-to-power execution
        run: |
          python scripts/guard_us_time_to_power_metrics_source.py
          python scripts/us_data_center_time_to_power_watch.py

      - name: Send Telegram only on meaningful changes
        run: |
          python - <<'PY'
          import os, pathlib, requests, time

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat = os.environ["TELEGRAM_CHAT_ID"].strip()
          files = [
              pathlib.Path("out/data_center_growth_alert.txt"),
              pathlib.Path("out/pjm_data_center_policy_alert.txt"),
              pathlib.Path("out/us_data_center_time_to_power_alert.txt"),
          ]
          sent = 0

          for p in files:
              if not p.exists() or not p.read_text(encoding="utf-8").strip():
                  continue

              text = p.read_text(encoding="utf-8").strip()
              payload = {"chat_id": chat, "text": text}

              if p.name == "pjm_data_center_policy_alert.txt":
                  payload["parse_mode"] = "HTML"
                  payload["link_preview_options"] = {
                      "is_disabled": False,
                      "url": "https://insidelines.pjm.com/pjm-reliability-backstop-proposal-outlines-steps-to-secure-new-supply-and-maintain-reliability/",
                      "prefer_large_media": True,
                      "show_above_text": False,
                  }
                  payload["reply_markup"] = {
                      "inline_keyboard": [
                          [
                              {"text": "📌 PJM RBP 원문", "url": "https://www.pjm.com/committees-and-groups/cifp-rbp"},
                              {"text": "⚖️ FERC 원문", "url": "https://www.ferc.gov/news-events/news/decisions-notices"},
                          ],
                          [
                              {"text": "📄 PJM 기준 설명", "url": "https://insidelines.pjm.com/pjm-reliability-backstop-proposal-outlines-steps-to-secure-new-supply-and-maintain-reliability/"}
                          ],
                      ]
                  }
              elif p.name == "us_data_center_time_to_power_alert.txt":
                  payload["parse_mode"] = "HTML"
                  payload["link_preview_options"] = {
                      "is_disabled": False,
                      "url": "https://www.ferc.gov/news-events/news/ferc-launches-aggressive-targeted-action-speed-large-load-integration",
                      "prefer_large_media": True,
                      "show_above_text": False,
                  }
                  payload["reply_markup"] = {
                      "inline_keyboard": [
                          [
                              {"text": "⚡ FERC 대형부하", "url": "https://www.ferc.gov/news-events/news/ferc-launches-aggressive-targeted-action-speed-large-load-integration"},
                              {"text": "🔌 MISO 대형부하", "url": "https://www.misoenergy.org/planning/large-loads---container-page/large-load-additions/"},
                          ],
                          [
                              {"text": "🔋 MISO ERAS", "url": "https://www.misoenergy.org/meet-miso/media-center/2026---news-releases/miso-accelerates-new-generation-and-storage-projects-with-fifth-eras-cycle/"},
                              {"text": "🏗️ ERCOT Batch Zero", "url": "https://www.ercot.com/services/rq/large-load-integration"},
                          ],
                      ]
                  }
              else:
                  payload["link_preview_options"] = {"is_disabled": True}

              r = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json=payload,
                  timeout=30,
              )
              data = r.json()
              if not r.ok or not data.get("ok"):
                  desc = data.get("description", "unknown") if isinstance(data, dict) else "unknown"
                  raise SystemExit(f"Telegram send failed for {p.name}: HTTP {r.status_code} / {desc}")
              print(f"Telegram sent {p.name}: message_id={data['result']['message_id']}")
              sent += 1
              time.sleep(1)

          if not sent:
              print("No meaningful change; Telegram silent.")
          PY

      - name: Save latest official baselines
        run: |
          mkdir -p data
          cp out/data_center_growth_pending_state.json data/data_center_growth_state.json
          cp out/pjm_data_center_policy_pending_state.json data/pjm_data_center_policy_state.json
          cp out/us_data_center_time_to_power_pending_state.json data/us_data_center_time_to_power_state.json
          git restore scripts/pjm_data_center_policy_watch.py
          git restore scripts/us_data_center_time_to_power_watch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_center_growth_state.json data/pjm_data_center_policy_state.json data/us_data_center_time_to_power_state.json
          if git diff --cached --quiet; then
            echo "State unchanged."
          else
            git commit -m "Update data center watch states [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload watcher status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-center-growth-${{ github.run_id }}
          path: |
            out/data_center_growth_status.md
            out/data_center_growth_alert.txt
            out/data_center_growth_pending_state.json
            out/pjm_data_center_policy_status.md
            out/pjm_data_center_policy_alert.txt
            out/pjm_data_center_policy_pending_state.json
            out/us_data_center_time_to_power_status.md
            out/us_data_center_time_to_power_alert.txt
            out/us_data_center_time_to_power_pending_state.json
          if-no-files-found: ignore
          retention-days: 7
