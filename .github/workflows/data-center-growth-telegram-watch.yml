                          [
                              {"text": "⚖️ NJDEP DataOne", "url": "https://dep.nj.gov/newsrel/26_0044/"},
                              {"text": "🏢 Nebius-Microsoft", "url": "https://nebius.com/newsroom/nebius-announces-multi-billion-dollar-agreement-with-microsoft-for-ai-infrastructure"},
                          ]
                      ]
                  }
              elif p.name in ("epoch_ai_dc_execution_alert.txt", "ai_dc_tam_revision_alert.txt"):
                  payload["parse_mode"] = "HTML"
                  payload["link_preview_options"] = {"is_disabled": True}
              else:
                  payload["link_preview_options"] = {"is_disabled": True}

              # Telegram sendMessage has a 4,096-character limit. Keep
              # complete HTML lines together and split long reports into safe
              # chunks. This is especially important for the 15-project Epoch
              # AI buildout report, where every project now includes energy
              # source evidence.
              # Preserve every nonempty source line. For the existing financial-
              # risk alert, prefer complete named sections over arbitrary splits.
              is_dc_risk = p.name == "us_data_center_cancellation_risk_alert.txt"
              chunk_limit = 2400 if is_dc_risk else 3400
              chunks = []
              current = []
              current_len = 0
              for line in text.splitlines():
                  line_len = len(line) + 1
                  if line_len > chunk_limit:
                      raise SystemExit(
                          f"Telegram line too long for safe HTML split: {p.name} / {len(line)} chars"
                      )
                  is_heading = line.startswith("<b>") and line.endswith("</b>")
                  if is_dc_risk and is_heading and current_len >= 1200:
                      chunks.append("\n".join(current).strip())
                      current = []
                      current_len = 0
                  if current and current_len + line_len > chunk_limit:
                      chunks.append("\n".join(current).strip())
                      current = [line]
                      current_len = line_len
                  else:
                      current.append(line)
                      current_len += line_len
              if current:
                  chunks.append("\n".join(current).strip())
              if not chunks:
                  continue

              # Avoid an isolated, nearly empty final message containing only
              # source links when the last section fits safely with its predecessor.
              if is_dc_risk and len(chunks) >= 2 and len(chunks[-1]) < 500:
                  joined = chunks[-2] + "\n\n" + chunks[-1]
                  if len(joined) <= chunk_limit:
                      chunks[-2:] = [joined]

              if is_dc_risk or p.name in ("ai_dc_tam_revision_alert.txt", "us_data_center_generation_buildout_alert.txt"):
                  expected_lines = [line.strip() for line in text.splitlines() if line.strip()]
                  actual_lines = [
                      line.strip()
                      for chunk in chunks
                      for line in chunk.splitlines()
                      if line.strip()
                  ]
                  if expected_lines != actual_lines:
                      raise SystemExit("Data-center risk Telegram split dropped or reordered report content")
                  for part in chunks:
                      if len(part) > chunk_limit:
                          raise SystemExit("Data-center risk Telegram part exceeded safe length")
                      for tag in ("b", "a"):
                          if len(re.findall(fr"<{tag}(?:\s[^>]*)?>", part)) != part.count(f"</{tag}>"):
                              raise SystemExit(f"Data-center risk HTML tag unbalanced: {tag}")
                  print(
                      f"data_center_risk_report_full_text_verified=true "
                      f"parts={len(chunks)} source_lines={len(expected_lines)}"
                  )

              message_ids = []
              for chunk_index, chunk in enumerate(chunks, 1):
                  send_payload = dict(payload)
                  send_payload["text"] = (
                      f"[{chunk_index}/{len(chunks)}]\n" if len(chunks) > 1 else ""
                  ) + chunk
                  if chunk_index > 1:
                      send_payload.pop("reply_markup", None)

                  r = requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      json=send_payload,
                      timeout=30,
                  )
                  data = r.json()
                  if not r.ok or not data.get("ok"):
                      desc = data.get("description", "unknown") if isinstance(data, dict) else "unknown"
                      raise SystemExit(
                          f"Telegram send failed for {p.name}: HTTP {r.status_code} / {desc}"
                      )
                  receipt = data.get("result") or {}
                  reply_chat_id = (receipt.get("chat") or {}).get("id")
                  reply_message_id = receipt.get("message_id")
                  if reply_chat_id is None or not isinstance(reply_message_id, int) or reply_message_id <= 0:
                      raise RuntimeError("Telegram sent but chat.id/message_id receipt is incomplete")
                  configured_chat_id = str(chat).strip()
                  if configured_chat_id.lstrip("-").isdigit() and str(reply_chat_id) != configured_chat_id:
                      raise RuntimeError("Telegram acknowledged a different chat.id; refusing confirmation")
                  message_ids.append(reply_message_id)
                  print("telegram_api_receipt_verified=true chat_id_present=true chat_id_matches_config=true")
                  time.sleep(1)

              print(
                  f"Telegram sent {p.name}: route={route_label} "
                  f"messages={len(message_ids)} message_ids={message_ids}"
              )
              sent += len(message_ids)

          if not sent:
              print("No meaningful change; Telegram silent.")
          PY

