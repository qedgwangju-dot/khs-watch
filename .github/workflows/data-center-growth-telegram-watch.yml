name: Data Center Growth Telegram Watch

on:
  push:
    paths:
      - ".github/workflows/data-center-growth-telegram-watch.yml"
      - "scripts/data_center_growth_watch.py"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-center-growth-telegram-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Inspect Census data center workbook
        run: python scripts/data_center_growth_watch.py
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-center-growth-${{ github.run_id }}
          path: out/data_center_growth_diagnostic.json
          if-no-files-found: ignore
          retention-days: 7
