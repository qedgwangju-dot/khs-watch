name: Data Center Growth Telegram Watch

on:
  push:
    paths:
      - ".github/workflows/data-center-growth-telegram-watch.yml"
      - "scripts/data_center_growth_watch.py"
      - "scripts/pjm_data_center_policy_watch.py"
      - "scripts/us_grid_emergency_official.py"
      - "scripts/clean_pjm_alert_html.py"
      - "scripts/guard_pjm_baseline_source.py"
      - "scripts/us_data_center_time_to_power_watch.py"
      - "scripts/patch_google_constellation_official_ppa.py"
      - "scripts/clean_us_time_to_power_alert_html.py"
      - "scripts/us_data_center_generation_buildout_watch.py"
      - "scripts/guard_us_time_to_power_metrics_source.py"
      - "scripts/us_data_center_cancellation_risk_watch.py"
      - "scripts/us_ai_data_center_buildout_watch.py"
      - "scripts/spacexai_neocloud_watch.py"
      - "scripts/nebius_dataone_bloom_watch.py"
      - "scripts/ai_dc_800v_power_architecture_watch.py"
      - "scripts/epoch_ai_dc_execution_watch.py"
      - "scripts/ai_dc_tam_revision_watch.py"
      - "scripts/us_hyperscaler_company_risk_watch.py"
      - "scripts/remove_telegram_italics.py"
      - "scripts/korea_aidc_policy_watch.py"
      - "scripts/korea_aidc_policy_watch_v2.py"
      - "tests/test_korea_aidc_policy_watch_v2.py"
  schedule:
    # Keep the established hourly check and add a backup within the hour.
    # GitHub scheduled jobs are best-effort; the existing concurrency group
    # and persisted event fingerprint avoid double Telegram sends.
    - cron: "23 * * * *"
    - cron: "53 * * * *"
  workflow_run:
    # Fallback inside the existing watcher when GitHub skips/delays both crons.
    # Both upstreams are pre-existing same-repository data-center workflows.
    # They only TRIGGER the original workflow; the saved-event gate and
    # concurrency group prevent repeat Telegram deliveries.
    workflows:
      - "US Data Center Cycle Telegram Watch"
      - "Texas Data Center Watch Telegram"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Code-push regression must not queue behind a long-running live monitor.
  # All production triggers still share one group to prevent concurrent sends.
  group: data-center-growth-telegram-watch-${{ github.event_name == 'push' && 'validation' || 'monitor' }}
  cancel-in-progress: false

jobs:
  validate_aidc:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4 "googlenewsdecoder==0.2.1"
      - name: AIDC and data-center market code-push regression (no Telegram)
        run: |
          python -m compileall -q scripts/korea_aidc_policy_watch.py scripts/korea_aidc_policy_watch_v2.py scripts/ai_dc_tam_revision_watch.py
          python -m unittest discover -s tests -p 'test_korea_aidc_policy_watch_v2.py' -v
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("scripts/ai_dc_tam_revision_watch.py")
          spec = importlib.util.spec_from_file_location("ai_dc_tam_revision_watch", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.bofa_global_checks()
          module.semia_regression_checks()
          report = module.bofa_global_alert({
              "usdkrw": 1325.28, "basis": "2026-10-26 ECB test basis"
          })
          assert report.count("원문: ") == 3
          assert all(x in report for x in (
              "2조1,000억달러", "2조9,300억달러", "4,900만달러",
              "5,700만달러", "3,140만달러", "480만달러", "1GW",
              "BofA 원본 유료 보고서를", "2026-10-26 ECB test basis",
          ))
          assert len(report) > 1200
          print("bofa_global_once_only_and_tam_scope_report_regression=passed")
          PY

      - name: Regression-test data-center electricity direction without sending Telegram
        run: |
          python -m compileall -q scripts/us_ai_data_center_buildout_watch.py scripts/epoch_ai_dc_execution_watch.py scripts/clean_pjm_alert_html.py scripts/us_grid_emergency_official.py
          python scripts/us_grid_emergency_official.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          def load(path):
              spec = importlib.util.spec_from_file_location(Path(path).stem, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          top = load("scripts/us_ai_data_center_buildout_watch.py")
          top._self_test_power_direction()
          current = {
              "name": "OpenAI Stargate Abilene",
              "display": "Stargate Abilene (TX)",
              "owner": "Oracle", "users": "OpenAI",
              "investors": "미기재", "current_mw": 824,
              "planned_mw": 824, "progress": 100,
              "completion_date": "2026-12-01", "completion": "2026.4Q",
              "stage": "Epoch 추정 IT전력 계획치 도달",
              "mw_quality": "현재 추정 IT전력=계획치",
              "risk": False, "energy_quality": "공식 별도 검증",
              "energy_site": "계통 전력", "energy_future": "미확인",
              "company_issues": [],
          }
          previous = dict(current, current_mw=618, progress=75)
          history = {"projects": [previous]}
          new_rows = [current]
          changes = top.changes(history, new_rows)
          alert = top.render(new_rows, changes, "Oct 31, 2026", history)
          assert any("↑ 증가 +206MW" in x for x in changes), changes
          assert "↑ 증가 +206MW" in alert, alert
          assert "현재 추정 824MW / 최종 계획 824MW" in alert, alert
          assert "실제 발전·계통 공급·공식 전원 인가 MW 증감:" in alert
          assert "계획 824MW → Epoch 현재" not in alert

          pjm = load("scripts/clean_pjm_alert_html.py")
          pjm._direction_regression()

          aggregate = load("scripts/epoch_ai_dc_execution_watch.py")
          aggregate.regression_checks()
          assert aggregate.power_delta_label(824,618).startswith("↓ 감소 -206MW")
          assert aggregate.power_delta_label(618,824).startswith("↑ 증가 +206MW")
          print("data_center_direction_power_plan_grid_supply_regression=passed")
          PY

      - name: Validate Jefferies / SOFC / SMR / BESS source gate (no Telegram)
        run: |
          python -m py_compile scripts/us_data_center_generation_buildout_watch.py
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("scripts/us_data_center_generation_buildout_watch.py").read_text(encoding="utf-8")
          parsed = ast.parse(source)
          names = {n.name for n in parsed.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          expected = {
              "onsite_bridge_regression_checks",
              "onsite_official_source_status",
              "run_onsite_jefferies_source_graded_extension",
              "vg_run_existing_generation_watch",
          }
          assert expected <= names, expected - names
          assignments = [
              n for n in parsed.body if isinstance(n, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "ONSITE_TECH_REFERENCE" for t in n.targets)
          ]
          assert len(assignments) == 1
          dictionary = assignments[0].value
          reference = {}
          for key, value in zip(dictionary.keys, dictionary.values):
              if isinstance(key, ast.Constant) and key.value != "sources":
                  reference[key.value] = ast.literal_eval(value)
          test_fn = next(n for n in parsed.body if isinstance(n, ast.FunctionDef)
                         and n.name == "onsite_bridge_regression_checks")
          namespaced = {"ONSITE_TECH_REFERENCE": reference}
          exec(compile(ast.Module(body=[test_fn], type_ignores=[]),
                       "<jefferies_readonly_regression>", "exec"), namespaced)
          namespaced["onsite_bridge_regression_checks"]()
          assert source.index("vg_run_existing_generation_watch()") < source.index(
              "run_onsite_jefferies_source_graded_extension()")
          assert "old.get(\"initialized\") or not verified or not fresh_fx" in source
          assert "previous.get(\"delivered_id\") == JEFFERIES_ONSITE_EVENT" in source
          assert all(name in source for name in ("JEFFERIES_MAY_OFFICIAL",
                     "BLOOM_ORACLE_OFFICIAL", "AEP_GOOGLE_OFFICIAL", "XENERGY_SMRS_SEC"))
          assert "JEFFERIES_ONSITE_EVENT" not in source.split("vg_run_existing_generation_watch()", 1)[0]
          print("onsite_jefferies_source_and_dedupe_regression=passed")
          PY



      - name: Validate MHI turbine investment scope and existing-state preservation (no Telegram)
        run: |
          python -m py_compile scripts/us_data_center_generation_buildout_watch.py
          python - <<'PY'
          import ast,re
          from pathlib import Path
          from bs4 import BeautifulSoup
          p=Path("scripts/us_data_center_generation_buildout_watch.py")
          source=p.read_text(encoding="utf-8")
          tree=ast.parse(source)
          functions=[node for node in tree.body if isinstance(node,ast.FunctionDef)
                     and node.name in ("mhi_capex_text_verified","mhi_gtcc_signal_tests")]
          assert len(functions)==2
          scope={"re":re,"BeautifulSoup":BeautifulSoup,
                 "normalize":lambda t:re.sub(r"\s+"," ",t or "").strip(),
                 "MHI_GTCC_CAPEX_JPY_B":500.0,"MHI_ENGINE_CAPEX_JPY_B":100.0,
                 "MHI_100JPY_KRW_NOV9":856.72}
          exec(compile(ast.Module(body=functions,type_ignores=[]),
                       "<mhi_offline_regression>","exec"),scope)
          scope["mhi_gtcc_signal_tests"]()
          assert '    **old,  # Preserve existing event keys' in source
          assert '"format_version": max(FORMAT_VERSION, int(old.get("format_version") or 0))' in source
          print("mhi_gtcc_500bn_100bn_scope_and_dedup_offline=passed no_telegram=true")
          PY


      - name: Test US-to-Korea data center investment diversion source gates (no Telegram)
        run: |
          python -m py_compile scripts/us_data_center_cancellation_risk_watch.py
          python - <<'PY'
          import ast
          import html
          import re
          from pathlib import Path

          path = Path("scripts/us_data_center_cancellation_risk_watch.py")
          tree = ast.parse(path.read_text(encoding="utf-8"))
          constants = [
              node for node in tree.body
              if isinstance(node, ast.Assign)
              and len(node.targets) == 1
              and isinstance(node.targets[0], ast.Name)
              and (node.targets[0].id.startswith("INBOUND_"))
          ]
          function_names = {
              "normalize", "h", "a",
              "inbound_official_stage", "inbound_us_policy_stage", "inbound_is_due",
              "inbound_regression_checks", "inbound_report",
          }
          methods = [
              node for node in tree.body if isinstance(node, ast.FunctionDef)
              and node.name in function_names
          ]
          assert {n.name for n in methods} == function_names
          namespace = {"html": html, "re": re}
          exec(compile(ast.Module(body=constants+methods, type_ignores=[]),
                       "<us-korea-offline-test>", "exec"), namespace)
          namespace["inbound_regression_checks"]()
          proof = {
              "texas_governor": True,
              "texas_independent": False,
              "korea_government": True,
              "korea_signed_earlier": True,
          }
          rendered = namespace["inbound_report"](proof, [])
          assert all(x in rendered for x in (
              "3.0~4.2GW", "5.1~7.0GW", "30조~40조원",
              "41MW", "103MW", "미국", "한국", "확정", "2029년",
          ))
          assert rendered.count("<b>") == rendered.count("</b>")
          assert rendered.count("<a href=") == rendered.count("</a>")
          assert rendered.count("https://") >= 6
          assert namespace["inbound_is_due"]({}, False, proof)
          assert not namespace["inbound_is_due"](
              {"last_context_id": namespace["INBOUND_DIVERSION_ID"]}, False, proof
          )
          print("us_korea_investment_offline_regression=passed no_telegram=true")
          PY


      - name: Test BAAJA federal cost-allocation and legislative-stage rules (no Telegram)
        run: |
          python -m py_compile scripts/us_data_center_cancellation_risk_watch.py
          python - <<'PY'
          import ast
          import html
          import re
          from pathlib import Path

          text = Path("scripts/us_data_center_cancellation_risk_watch.py").read_text(encoding="utf-8")
          parsed = ast.parse(text)
          pure_names = {
              "normalize", "h", "a", "krw_from_usd",
              "baaja_procedural_due", "baaja_later_stage",
              "baaja_policy_regression_checks", "baaja_procedural_alert",
          }
          nodes = []
          for node in parsed.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id.startswith("BAAJA_") for t in node.targets
              ):
                  nodes.append(node)
              elif isinstance(node, ast.FunctionDef) and node.name in pure_names:
                  nodes.append(node)
          assert pure_names <= {node.name for node in nodes if isinstance(node, ast.FunctionDef)}
          scope = {
              "re": re, "html": html, "fx_source": "dry-run FX",
              "fx_checked": "2026-11-10T00:00:00+00:00",
          }
          exec(compile(ast.Module(body=nodes, type_ignores=[]),
                       "<baaja-policy-pure-test>", "exec"), scope)
          scope["baaja_policy_regression_checks"]()
          checks = {"senate_vote": True, "senate_sponsor": False,
                    "cost_threshold": True, "rhodium_model": True}
          rendered = scope["baaja_procedural_alert"](1338.58, checks)
          mandatory = (
              "절차표결", "본안 최종 가결 아님", "20MW", "100MW",
              "73대25", "417대3", "57대43", "+88~102%",
              "+10~11%", "1GW", "맥킨지", "원문",
          )
          missing = [key for key in mandatory if key not in rendered]
          assert not missing, missing
          assert rendered.count("<a href=") == rendered.count("</a>")
          assert rendered.count("<b>") == rendered.count("</b>")
          assert scope["baaja_later_stage"]("Senate advances BAAJA procedural 73-25") is None
          assert scope["baaja_later_stage"]("Senate passes BAAJA final legislation") == "상원 본안 최종 의결 공식 발표"
          assert text.index("run_inbound_diversion_extension()") < text.index("baaja_run_existing_risk_watch()")
          assert "pending[\"baaja_permitting_policy\"] = state" in text
          print("baaja_legislation_stage_cost_test=passed telegram_send=false")
          PY


      - name: Test November used-turbine aircraft-derived generation source and format (no Telegram)
        run: |
          python -m py_compile scripts/us_data_center_generation_buildout_watch.py scripts/guard_us_time_to_power_metrics_source.py
          python - <<'PY'
          import ast
          import datetime as dt
          import html
          import re
          from types import SimpleNamespace
          from pathlib import Path
          from bs4 import BeautifulSoup

          source = Path("scripts/us_data_center_generation_buildout_watch.py").read_text(encoding="utf-8")
          guard = Path("scripts/guard_us_time_to_power_metrics_source.py").read_text(encoding="utf-8")
          # The runtime guard must still find the original query tuple after
          # the older Anthropic–OnePWR source query was added.
          guard_query = re.search(r'query_old = """([\s\S]*?)"""\s*query_new', guard)
          assert guard_query and guard_query.group(1) in source, "guard generation query anchor regression"
          assert 'GEV_Q2_2026 = "https://www.gevernova.com/news/articles/ge-vernova-releases-second-quarter-2026-financial-results"' in source

          tree = ast.parse(source)
          functions = {
              "normalize", "h", "a", "krw_from_usd_b", "parse_gev",
              "jet_turbine_regression_checks", "jet_turbine_event_due",
              "jet_turbine_alert_text",
          }
          assignments = {
              "GEV_Q3_2026", "VERIFIED_GEV", "JET_TURBINE_EVENT",
              "JET_REFERENCE", "JET_REUTERS_NOV9", "JET_DECRYPT_NOV9",
              "JET_PROENERGY_CRUSOE", "JET_FTAI_POWER_ORIGINAL",
              "JET_FTAI_FIRM_ORDER", "JET_EPA_DATA_CENTERS",
          }
          nodes = []
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  if node.targets[0].id in assignments:
                      nodes.append(node)
              elif isinstance(node, ast.FunctionDef) and node.name in functions:
                  nodes.append(node)
          scope = {
              "dt": dt, "html": html, "re": re, "BeautifulSoup": BeautifulSoup,
              "fx": 1346.79, "fx_source": "2026-11-09 ECB test",
              "fx_checked": "2026-11-10T00:00:00+00:00",
          }
          exec(compile(ast.Module(body=nodes, type_ignores=[]),
                       "<jet-turbine-offline-regression>", "exec"), scope)
          scope["jet_turbine_regression_checks"]()
          proof = {"proenergy_crusoe": True, "ftai_jf_order": True,
                   "ftai_engine_conversion": True, "gev_q3": True, "epa_standards": True}
          assert scope["jet_turbine_event_due"]({}, proof, False, True, dt.date(2026, 11, 10))
          assert not scope["jet_turbine_event_due"](
              {"delivered_event_id": scope["JET_TURBINE_EVENT"]}, proof, False, True, dt.date(2026, 11, 10))
          assert not scope["jet_turbine_event_due"]({}, {"proenergy_crusoe": True}, False, True, dt.date(2026, 11, 10))
          assert not scope["jet_turbine_event_due"]({}, proof, False, False, dt.date(2026, 11, 10))
          report = scope["jet_turbine_alert_text"](proof)
          required = ("6년", "650MW", "PE6000", "14억6,500만달러",
                      "FTAI", "1,250만달러", "116GW", "122GW", "EPA",
                      "전원 인가", "Crusoe", "ProEnergy")
          assert all(x in report for x in required), [x for x in required if x not in report]
          assert report.count("<a href=") == report.count("</a>")
          assert report.count("<b>") == report.count("</b>")
          # Simulate Q3 publisher wording, then failure to access publisher.
          q3 = ("Third Quarter 2026 Highlights: Gas Power equipment backlog and "
                "slot reservation agreements grew from 116 to 122 GW; now anticipate "
                "reaching at least 130 GW by year-end 2026")
          scope["fetch"] = lambda url, timeout=22: SimpleNamespace(text=q3)
          latest = scope["parse_gev"]()
          assert latest["source_live_verified"] and latest["gas_contract_slot_gw"] == 122
          assert latest["year_end_target_gw"] == 130
          scope["fetch"] = lambda url, timeout=22: (_ for _ in ()).throw(OSError("offline"))
          fallback = scope["parse_gev"]()
          assert not fallback["source_live_verified"] and fallback["gas_contract_slot_gw"] == 122
          assert fallback["year_end_target_gw"] == 130
          assert source.index("run_mhi_gtcc_existing_generation_watch()") < source.index(
              "run_jet_turbine_existing_generation_watch()")
          print("jet_turbine_ge_q3_guard_regression=passed telegram_send=false")
          PY

  monitor:
    outputs:
      telegram_send_outcome: ${{ steps.data_center_telegram_delivery.outcome }}
    # Code-push validation must never trigger live alert sends.
    # Never process workflow_run events from failed or non-main upstream runs.
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.DATA_CENTER_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.DATA_CENTER_TELEGRAM_CHAT_ID }}
      GLOBAL_RATES_TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
      GLOBAL_RATES_TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
      AIDC_TELEGRAM_BOT_TOKEN: ${{ secrets.ENERGY_MIX_TELEGRAM_BOT_TOKEN }}
      AIDC_TELEGRAM_CHAT_ID: ${{ secrets.ENERGY_MIX_TELEGRAM_CHAT_ID }}
      AIDC_FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      AIDC_EXPECTED_TELEGRAM_BOT_USERNAME: khs887988798879887988798879_bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main state
        run: |
          git fetch origin main
          git merge --ff-only origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl beautifulsoup4 "selectolax<1.0" googlenewsdecoder==0.2.1

      - name: Validate data-center Telegram route
        run: |
          python - <<'PY'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat:
              raise SystemExit("DATA_CENTER_TELEGRAM_BOT_TOKEN or DATA_CENTER_TELEGRAM_CHAT_ID is missing")
          data = requests.get(f"https://api.telegram.org/bot{token}/getMe", timeout=20).json()
          if not data.get("ok"):
              raise SystemExit("Telegram getMe failed")
          username = data["result"].get("username", "")
          if username.lower() != "khs88790088790000887900_bot":
              raise SystemExit(f"Wrong Telegram bot: @{username}")
          first_name = str(data["result"].get("first_name", ""))
          print(f"Telegram route OK: @{username} first_name={first_name}")
          PY

      - name: Check official Census data center series
        run: python scripts/data_center_growth_watch.py

      - name: Validate AIDC policy facts and duplicate suppression
        run: |
          python -m compileall -q scripts/korea_aidc_policy_watch.py scripts/korea_aidc_policy_watch_v2.py
          python -m unittest discover -s tests -p 'test_korea_aidc_policy_watch_v2.py' -v

      - name: Check Korea AIDC special-law power and permit policy
        run: python scripts/korea_aidc_policy_watch_v2.py

      - name: Validate PJM and DOE emergency source mapping
        run: |
          python scripts/us_grid_emergency_official.py

      - name: Check PJM RBP IRAS and large-load policy
        run: |
          sed -i 's/^FORMAT_VERSION = 2$/FORMAT_VERSION = 5/' scripts/pjm_data_center_policy_watch.py
          python scripts/guard_pjm_baseline_source.py

          mkdir -p out
          pjm_ok=0
          for attempt in 1 2 3; do
            set +e
            python scripts/pjm_data_center_policy_watch.py > out/pjm_data_center_policy_run.log 2>&1
            code=$?
            set -e
            cat out/pjm_data_center_policy_run.log

            if [ "$code" -eq 0 ]; then
              pjm_ok=1
              break
            fi

            if grep -Eq 'insidelines\.pjm\.com|PJM_BASELINE' out/pjm_data_center_policy_run.log \
              && grep -Eq 'ConnectTimeout|ReadTimeout|Timeout|ConnectionError|requests\.exceptions' out/pjm_data_center_policy_run.log; then
              echo "PJM 기준 원문 연결 실패 · ${attempt}/3 재시도"
              sleep $((attempt * 5))
            else
              exit "$code"
            fi
          done

          if [ "$pjm_ok" -ne 1 ]; then
            python - <<'PY'
