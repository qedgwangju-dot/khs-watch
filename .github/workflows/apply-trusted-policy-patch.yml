name: Apply verified trusted policy patch

on:
  push:
    paths:
      - ".github/workflows/apply-trusted-policy-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply verified patch
        run: git apply --check .github/repair-trusted-policy-alert.patch && git apply .github/repair-trusted-policy-alert.patch
      - name: Verify
        run: |
          python -m py_compile scripts/khs_trusted_policy_news_watch.py scripts/verify_khs_policy_delivery_contract.py
          python scripts/verify_khs_policy_delivery_contract.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/khs_trusted_policy_news_watch.py scripts/verify_khs_policy_delivery_contract.py
          git commit -m "Fix trusted policy Iran summary and body header"
          git push origin HEAD:main
