name: Treasury buyback policy Telegram alert

on:
  push:
    paths:
      - "scripts/treasury_buyback_policy_watch.py"
      - "scripts/treasury_alert_korean_guard.py"
      - ".github/workflows/treasury-buyback-policy-telegram-alert.yml"
  schedule:
    # U.S. business hours during EDT. Check every 15 minutes.
    - cron: "*/15 12-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treasury-buyback-policy-telegram-alert
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs88798879887988798879_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: python -m pip install --quiet pypdf

      - name: Validate watcher
        run: |
          python -m py_compile scripts/treasury_buyback_policy_watch.py
          python -m py_compile scripts/treasury_alert_korean_guard.py

      - name: Check official Treasury buyback policy
        run: python scripts/treasury_buyback_policy_watch.py

      - name: Upgrade user-facing Treasury interpretation
        if: always()
        run: python scripts/treasury_alert_korean_guard.py

      - name: Publish status
        if: always()
        run: |
          if [ -f out/treasury_buyback_policy_status.md ]; then
            cat out/treasury_buyback_policy_status.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send interpreted material change
        if: hashFiles('out/treasury_buyback_policy_alert.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TREASURY_FOREIGN_DEMAND_TELEGRAM_BOT_TOKEN }}
          PRIMARY_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          FALLBACK_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          TELEGRAM_CHAT_ID="${PRIMARY_CHAT_ID:-$FALLBACK_CHAT_ID}"
          export TELEGRAM_CHAT_ID
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "미 재무부 바이백 알림용 텔레그램 토큰 또는 chat id가 없습니다." >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"잘못된 봇 경로: expected @{expected}, got @{actual or 'unknown'}")

          title = pathlib.Path("out/treasury_buyback_policy_title.txt").read_text(encoding="utf-8").strip()
          body = pathlib.Path("out/treasury_buyback_policy_alert.html").read_text(encoding="utf-8").strip()
          text = f"<b>{title}</b>\n\n{body}"
          if len(text) > 4096:
              raise RuntimeError(f"Telegram text too long: {len(text)}")

          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              raise RuntimeError(f"Telegram HTTP {exc.code}: {detail}") from exc
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected message: {result}")

          pathlib.Path("out/treasury_buyback_policy_telegram_confirmed.json").write_text(
              json.dumps({
                  "bot_username": actual,
                  "message_id": (result.get("result") or {}).get("message_id"),
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Finalize state
        if: success() && hashFiles('data/treasury_buyback_policy_state_next.json') != ''
        run: |
          python - <<'PY'
          import json
          import pathlib

          src = pathlib.Path("data/treasury_buyback_policy_state_next.json")
          state = json.loads(src.read_text(encoding="utf-8"))
          alert_exists = pathlib.Path("out/treasury_buyback_policy_alert.html").exists()
          confirmed = pathlib.Path("out/treasury_buyback_policy_telegram_confirmed.json").exists()
          if alert_exists and not confirmed:
              raise RuntimeError("바이백 정책 변경을 감지했지만 텔레그램 전송 확인이 없습니다.")

          pending_ids = list(state.pop("pending_source_ids", []))
          if pending_ids:
              seen = list(state.get("seen_source_ids", []))
              for source_id in pending_ids:
                  if source_id not in seen:
                      seen.append(source_id)
              state["seen_source_ids"] = seen[-100:]

          pending_special = state.pop("pending_special_sha", None)
          if pending_special:
              seen_old = list(state.get("seen_long_end_special_shas", []))
              if pending_special not in seen_old:
                  seen_old.append(pending_special)
              state["seen_long_end_special_shas"] = seen_old[-50:]

          state.pop("pending_schedule_change", None)
          state.pop("pending_change", None)

          pathlib.Path("data/treasury_buyback_policy_state.json").write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit state
        if: success() && hashFiles('data/treasury_buyback_policy_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasury_buyback_policy_state.json
          if git diff --cached --quiet; then
            echo "바이백 정책 상태 변경 없음"
          else
            git commit -m "Update Treasury buyback policy state"
            git pull --rebase origin main
            git push
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-buyback-policy-${{ github.run_id }}
          path: |
            out/treasury_buyback_policy_status.md
            out/treasury_buyback_policy_alert.html
            out/treasury_buyback_policy_detail.json
            out/treasury_buyback_policy_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14