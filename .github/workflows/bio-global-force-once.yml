name: Bio Global Force Once

on:
  push:
    paths:
      - ".github/workflows/bio-global-force-once.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch global rates workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run global-rates-telegram-watch.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "global_rates_with_bio_dispatched=true"
