name: Bio Global Force Once

on:
  push:
    paths:
      - ".github/workflows/bio-global-force-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs887988798879887988798879_bot"
      BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
      BIO_TELEGRAM_CHAT_ID: ${{ secrets.BIO_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the same bio single runner used by the live scheduler
        run: python scripts/bio_single_runner.py
      - name: Commit verification state
        run: |
          git config user.name "bio-verify[bot]"
          git config user.email "bio-verify[bot]@users.noreply.github.com"
          git add data/qlex_sc_conversion_watch_state.json data/intismeran_qlex_watch_state.json data/bio_watch_heartbeat.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No verification state change"
          else
            git commit -m "Verify bio single runner state"
            git pull --rebase origin main
            git push
          fi
