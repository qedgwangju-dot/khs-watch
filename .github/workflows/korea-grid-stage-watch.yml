name: Korea Grid Stage Transition Watch

on:
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "현재 단계 현황을 시험 전송"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/korea-grid-stage-watch.yml"
      - "scripts/korea_grid_stage_watch.py"
      - "scripts/korea_grid_stage_watch_v2.py"
      - "tests/test_korea_grid_stage_watch.py"
      - "tests/test_korea_grid_stage_watch_v2.py"

concurrency:
  group: korea-grid-stage-transition-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: 저장소 확인
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install requests beautifulsoup4 pytest

      - name: 검사
        run: |
          python -m compileall -q scripts/korea_grid_stage_watch.py scripts/korea_grid_stage_watch_v2.py
          pytest -q tests/test_korea_grid_stage_watch.py tests/test_korea_grid_stage_watch_v2.py

      - name: 한국전력 송변전 사업단계 변화 확인
        id: stage
        shell: bash
        env:
          FORCE_INPUT: ${{ inputs.force_notify || false }}
        run: |
          EXTRA=""
          if [[ "$FORCE_INPUT" == "true" ]]; then
            EXTRA="--force-notify"
          fi
          python scripts/korea_grid_stage_watch_v2.py $EXTRA

      - name: 지정 전기본·전원믹스 알림 봇으로 Telegram 전송
        if: steps.stage.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.ENERGY_MIX_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ENERGY_MIX_TELEGRAM_CHAT_ID }}
          FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: khs887988798879887988798879_bot
          REPORT_PATH: ${{ steps.stage.outputs.report_path }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import requests

          token=(os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id=(os.getenv("TELEGRAM_CHAT_ID") or "").strip() or (os.getenv("FALLBACK_TELEGRAM_CHAT_ID") or "").strip()
          expected=(os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("전력망 단계 알림 Telegram 경로가 없습니다.")
          me=requests.get(f"https://api.telegram.org/bot{token}/getMe",timeout=25)
          me.raise_for_status()
          payload=me.json()
          actual=str((payload.get("result") or {}).get("username") or "")
          if not payload.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"잘못된 Telegram 봇 경로 차단: expected=@{expected}, actual=@{actual or '확인불가'}")
          text=pathlib.Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8").strip()
          if not text:
              raise RuntimeError("전송할 전력망 단계 알림이 비어 있습니다.")
          response=requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id":chat_id,
                  "text":text,
                  "parse_mode":"HTML",
                  "disable_web_page_preview":True,
              },
              timeout=30,
          )
          response.raise_for_status()
          result=response.json()
          if not result.get("ok"):
              raise RuntimeError(f"Telegram 전송 실패: {result}")
          print(f"telegram_delivery_confirmed=true bot=@{actual} message_id={(result.get('result') or {}).get('message_id')}")
          PY

      - name: 상태 저장
        if: success()
        run: |
          git config user.name "korea-grid-stage-watch[bot]"
          git config user.email "korea-grid-stage-watch[bot]@users.noreply.github.com"
          git add data/korea_grid_stage_state.json
          git add out/*korea-grid-stage.html 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update KEPCO grid stage watch state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi
