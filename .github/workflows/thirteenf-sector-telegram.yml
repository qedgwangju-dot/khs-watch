name: 13F sector rotation Telegram watch

on:
  schedule:
    - cron: "11,41 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/thirteenf-sector-telegram.yml"
      - "scripts/thirteenf_sector_watch_entry.py"
      - "scripts/thirteenf_sector_rank.py"
      - "scripts/test_thirteenf_sector_rank.py"
      - "scripts/thirteenf_context_watch.py"
      - "scripts/thirteenf_fund_distress_watch.py"
      - "scripts/test_thirteenf_context_watch.py"
  workflow_dispatch:
    inputs:
      force_test:
        description: "Send a Telegram test message"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: thirteenf-sector-telegram-watch
  # Prevent cancellation after Telegram accepted a message but before its
  # delivery receipt and deduplication state have been committed.
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'KHS 13F watch contact=github-actions' }}
      THIRTEENF_FORCE_TEST: ${{ github.event.inputs.force_test || 'false' }}
      THIRTEENF_TELEGRAM_BOT_TOKEN: ${{ secrets.THIRTEENF_TELEGRAM_BOT_TOKEN }}
      THIRTEENF_TELEGRAM_CHAT_ID: ${{ secrets.THIRTEENF_TELEGRAM_CHAT_ID }}
      KHS_POLICY_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887988798879_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full repository history caused multi-minute checkout delays.
          # The 13F state comparer only needs HEAD; the commit step fetches
          # origin/main explicitly before rebasing.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          python -m py_compile scripts/thirteenf_sector_watch.py
          python -m py_compile scripts/thirteenf_sector_watch_entry.py
          python -m py_compile scripts/thirteenf_sector_rank.py
          python -m py_compile scripts/test_thirteenf_sector_rank.py
          PYTHONPATH=scripts python scripts/test_thirteenf_sector_rank.py
          python -m py_compile scripts/thirteenf_context_watch.py
          python -m py_compile scripts/test_thirteenf_context_watch.py
          PYTHONPATH=scripts python scripts/test_thirteenf_context_watch.py
          python -m py_compile scripts/thirteenf_fund_distress_watch.py
          PYTHONPATH=scripts python scripts/thirteenf_fund_distress_watch.py --self-test

      - name: Validate exact Telegram bot route without sending
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.THIRTEENF_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.THIRTEENF_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("THIRTEENF_TELEGRAM_BOT_TOKEN secret is missing; refusing bot fallback")
          if not chat_id:
              raise RuntimeError("13F Telegram chat id is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{username}")
          PY

      - name: Check SEC 13F filings and send Telegram alert
        run: python scripts/thirteenf_sector_watch_entry.py

      - name: Persist 13F seen state
        if: success()
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          path = pathlib.Path("data/thirteenf_sector_watch_state.json")
          if not path.exists():
              raise SystemExit(0)
          try:
              previous = json.loads(subprocess.check_output(
                  ["git", "show", "HEAD:data/thirteenf_sector_watch_state.json"],
                  text=True,
              ))
              current = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              raise SystemExit(0)

          previous_cmp = dict(previous)
          current_cmp = dict(current)
          previous_cmp.pop("updated_at", None)
          current_cmp.pop("updated_at", None)
          if previous_cmp == current_cmp:
              subprocess.run(
                  ["git", "checkout", "HEAD", "--", "data/thirteenf_sector_watch_state.json"],
                  check=True,
              )
              print("13F substantive state unchanged; discarded timestamp-only change.")
          PY

          if git diff --quiet -- data/thirteenf_sector_watch_state.json; then
            echo "13F state unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/thirteenf_sector_watch_state.json
          git commit -m "Update 13F sector watch state"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

# Separate time-sensitive risk events from delayed 13F quarter-end holdings.
      # Its source/Telegram validation runs even if the 13F-only lane fails.
      - name: Check Situational Awareness distress and verify Telegram response
        if: ${{ always() && !cancelled() }}
        run: python scripts/thirteenf_fund_distress_watch.py


      - name: Persist independent distress delivery keys
        if: ${{ always() && !cancelled() }}
        run: |
          FILE=data/thirteenf_fund_distress_watch_state.json
          if [ ! -f "$FILE" ]; then
            echo "No distress state to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            # Start each attempt at the newest remote commit; local worktree
            # retains the confirmed delivery receipts written by Python.
            git fetch origin main
            git reset --mixed origin/main
            python - <<'PY'
          import json
          import pathlib
          import subprocess

          path=pathlib.Path("data/thirteenf_fund_distress_watch_state.json")
          local=json.loads(path.read_text(encoding="utf-8"))
          raw=subprocess.run(
              ["git","show","HEAD:"+path.as_posix()],
              capture_output=True,text=True
          )
          if raw.returncode:
              result=dict(local)
              changed=True
          else:
              try:
                  remote=json.loads(raw.stdout)
                  if not isinstance(remote,dict):
                      raise ValueError("remote state is not an object")
              except (ValueError,TypeError) as e:
                  raise RuntimeError("Remote 13F distress state corrupt; refuse overwrite") from e
              result=dict(remote)
              for group in ("manual_claim","events","ownership_seen"):
                  merged=dict(remote.get(group) or {})
                  for key,val in dict(local.get(group) or {}).items():
                      prior=merged.get(key)
                      if prior is None:
                          merged[key]=val
                      elif prior==val:
                          continue
                      else:
                          old_id=(prior or {}).get("message_id")
                          new_id=(val or {}).get("message_id")
                          old_level=(prior or {}).get("level")
                          new_level=(val or {}).get("level")
                          if old_id and new_id and old_id!=new_id:
                              if old_level=="single" and new_level=="corroborated":
                                  merged[key]=val
                              elif old_level=="corroborated" and new_level=="single":
                                  continue
                              else:
                                  raise RuntimeError(
                                      f"Conflicting confirmed Telegram receipts: {group}/{key}"
                                  )
                          elif new_id and not old_id:
                              merged[key]=val
                          # Keep older confirmed receipt over stale baseline.
                  result[group]=merged
              result["schema"]=max(int(remote.get("schema") or 1),
                                   int(local.get("schema") or 1))
              result["ownership_delivery_initialized"]=bool(
                  remote.get("ownership_delivery_initialized")
                  or local.get("ownership_delivery_initialized")
              )
              if result["ownership_delivery_initialized"] and not result["ownership_seen"]:
                  raise RuntimeError("Verified SEC ownership baseline unexpectedly empty")
              for field in ("last_checked_utc","last_complete_news_scan_utc",
                            "ownership_last_checked_utc"):
                  result[field]=max(str(remote.get(field) or ""),
                                    str(local.get(field) or "")) or None
              if str(local.get("last_checked_utc") or "") >= str(remote.get("last_checked_utc") or ""):
                  result["last_scan_errors"]=list(local.get("last_scan_errors") or [])
              transient={"last_checked_utc","last_complete_news_scan_utc",
                         "ownership_last_checked_utc"}
              def substantial(value):
                  return {k:v for k,v in value.items() if k not in transient}
              changed=substantial(result)!=substantial(remote)

          if not changed and raw.returncode==0:
              # Drop timestamp-only updates rather than generating another
              # scheduled commit and racing a legitimate delivery.
              path.write_text(json.dumps(remote,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
              print("fund_distress_state_merge=unchanged (no extra commit)")
          else:
              path.write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
              print("fund_distress_state_merge=monotonic new evidence")
          PY
            git add -- "$FILE"
            if git diff --cached --quiet; then
              echo "fund_distress_state_no_new_evidence=true"
              exit 0
            fi
            git commit -m "Persist confirmed 13F manager distress delivery state"
            if git push origin HEAD:main; then
              echo "distress_state_push_confirmed=true"
              exit 0
            fi
            echo "Distress state changed concurrently, recomputing against remote: $attempt/4"
            sleep $((attempt * 3))
          done
          echo "::error::Could not persist merged distress receipt after 4 non-force attempts"
          exit 1

      - name: Upload distress delivery audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: thirteenf-distress-audit-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            out/thirteenf_fund_distress_delivery.json
            data/thirteenf_fund_distress_watch_state.json
