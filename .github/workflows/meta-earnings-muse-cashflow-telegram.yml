name: Meta Earnings and Muse Cash Flow Telegram Watch

on:
  schedule:
    - cron: "31 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/meta-earnings-muse-cashflow-telegram.yml"
      - "scripts/meta_earnings_muse_cashflow_watch.py"
      - "scripts/test_meta_earnings_muse_watch.py"

permissions:
  contents: write

concurrency:
  group: meta-earnings-muse-cashflow-telegram
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.THIRTEENF_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.THIRTEENF_TELEGRAM_CHAT_ID }}
      EXPECTED_BOT: "khs887988798879_bot"
      META_PROBE_ONLY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python runtime
        run: python -V

      - name: Validate Meta official numbers, accounting and output
        run: |
          set -euo pipefail
          python -m py_compile scripts/meta_earnings_muse_cashflow_watch.py scripts/test_meta_earnings_muse_watch.py
          PYTHONPATH=scripts python scripts/test_meta_earnings_muse_watch.py

      - name: Inspect Meta official earnings and material updates
        run: |
          set -euo pipefail
          rm -f out/meta_ai_earnings_alert.html out/meta_ai_earnings_pending.json out/meta_ai_earnings_telegram_confirmed.json
          if [ "$META_PROBE_ONLY" = "true" ]; then
            python scripts/meta_earnings_muse_cashflow_watch.py --probe
          else
            python scripts/meta_earnings_muse_cashflow_watch.py
          fi

      - name: Verify Telegram route and deliver Meta event
        if: env.META_PROBE_ONLY == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time,urllib.parse,urllib.request
          alert=pathlib.Path("out/meta_ai_earnings_alert.html")
          if not alert.exists():
              print("No new Meta financial event; no Telegram message.")
              raise SystemExit(0)

          token=(os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat=(os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          if not token or not chat:
              raise RuntimeError("Missing Meta Telegram secrets")

          def api(method,params=None):
              url=f"https://api.telegram.org/bot{token}/{method}"
              data=urllib.parse.urlencode(params).encode() if params is not None else None
              req=urllib.request.Request(url,data=data)
              with urllib.request.urlopen(req,timeout=30) as response:
                  obj=json.load(response)
              if not obj.get("ok"):
                  raise RuntimeError(f"Telegram {method} returned not-ok")
              return obj["result"]

          me=api("getMe")
          actual=str(me.get("username") or "").lower()
          if actual != os.getenv("EXPECTED_BOT","").lower():
              raise RuntimeError(f"Wrong Meta Telegram bot: @{actual}")
          print(f"meta_telegram_bot_verified=@{actual}")

          body=alert.read_text(encoding="utf-8")
          # Each newline-segmented chunk is below Telegram's 4096-character limit.
          chunks=[]
          while len(body)>3700:
              pos=body.rfind("\n",0,3700)
              if pos<1000: pos=3700
              chunks.append(body[:pos].strip())
              body=body[pos:].strip()
          if body.strip():chunks.append(body.strip())

          ids=[]
          for chunk in chunks:
              last_error=None
              for attempt in range(3):
                  try:
                      receipt=api("sendMessage",{
                          "chat_id":chat,"text":chunk,"parse_mode":"HTML",
                          "disable_web_page_preview":"true",
                      })
                      mid=receipt.get("message_id")
                      if mid is None: raise RuntimeError("No Telegram message_id")
                      ids.append(mid)
                      break
                  except Exception as e:
                      last_error=e
                      if attempt<2:time.sleep(2+attempt*2)
              else:
                  raise RuntimeError(f"Meta Telegram sending failed: {last_error}")

          pathlib.Path("out/meta_ai_earnings_telegram_confirmed.json").write_text(
              json.dumps({"message_ids":ids,"bot":actual},ensure_ascii=False)+"\n",encoding="utf-8")
          print(f"meta_telegram_confirmed={ids}")
          PY

      - name: Checkpoint only after confirmed delivery
        if: env.META_PROBE_ONLY == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f out/meta_ai_earnings_pending.json ]; then
            echo "No new Meta event to checkpoint."
            exit 0
          fi
          test -f out/meta_ai_earnings_telegram_confirmed.json
          cp out/meta_ai_earnings_pending.json data/meta_earnings_muse_cashflow_watch_state.json
          git config user.name "meta-cashflow-watch[bot]"
          git config user.email "meta-cashflow-watch[bot]@users.noreply.github.com"
          tmp="$(mktemp -d)"
          cp data/meta_earnings_muse_cashflow_watch_state.json "$tmp/state.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/state.json" data/meta_earnings_muse_cashflow_watch_state.json
            git add data/meta_earnings_muse_cashflow_watch_state.json
            if git diff --cached --quiet; then
              echo "Meta official state unchanged."
              exit 0
            fi
            git commit -m "Update Meta official earnings and Muse event state"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
