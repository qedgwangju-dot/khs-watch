name: France Moody official source probe once
on:
  push:
    paths:
      - ".github/workflows/france-moodys-source-probe-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public Moody official rating source (read only)
        env:
          KHS_SOURCE_PROXY_URL: "https://tips-yield-telegram.gustnd1.workers.dev/policy-source/fetch"
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, re, html, concurrent.futures, json
          urls=[
            "https://ratings.moodys.com/ratings-new",
            "https://ratings.moodys.com/ratings-news/434553",
            "https://r.jina.ai/https://ratings.moodys.com/ratings-news/434553",
            "https://r.jina.ai/https://ratings.moodys.com/ratings-new",
            "https://r.jina.ai/https://ratings.moodys.com/research",
            "https://www.bing.com/search?q=site%3Aratings.moodys.com%2Fratings-news%2F+%22Government+of+France%22+Moody%27s",
            "https://www.google.com/search?q=site%3Aratings.moodys.com%2Fratings-news%2F+France+sovereign+Moody%27s",
            "https://www.google.com/search?q=site%3Aratings.moodys.com%2Fratings-news%2F434553",
            "https://www.bing.com/search?q=site%3Aratings.moodys.com%2Fratings-news%2F434553",
            "https://news.google.com/rss/search?q=Moody%27s%20France%20rating%20October%202026&hl=en-US&gl=US&ceid=US%3Aen",
            "https://r.jina.ai/https://www.aft.gouv.fr/en/frances-credit-ratings",
            "https://www.aft.gouv.fr/en/frances-credit-ratings",
          ]
          def fetch(url, route):
            full=url if route=="direct" else ("https://tips-yield-telegram.gustnd1.workers.dev/policy-source/fetch?url="+urllib.parse.quote(url,safe=""))
            req=urllib.request.Request(full,headers={"User-Agent":"Mozilla/5.0 (khs-watch/1.0)","Accept":"text/html,*/*"})
            try:
              with urllib.request.urlopen(req, timeout=12) as r:
                body=r.read().decode("utf-8","replace")
                visible=re.sub(r"<[^>]+>"," ",body)
                visible=re.sub(r"\s+"," ",html.unescape(visible))
                titles=re.findall(r"(?:Moody.?s Ratings.{0,110}(?:France|Government of France)|Government of France.{0,100})",visible,re.I)
                links=re.findall(r"href=[\"']([^\"']*ratings-news/\d+[^\"']*)[\"']",body,re.I)
                return {"source":url,"route":route,"status":r.status,"length":len(body),
                  "has_Frances_government":bool(re.search("Government of France",visible,re.I)),
                  "news_link_count":len(set(links)),"moody_article_ids":len(set(re.findall(r'ratings-news/\d+',body))),
                  "decoded_ids":list(dict.fromkeys(re.findall(r'ratings-news/\d+',urllib.parse.unquote(html.unescape(body)))))[:10],
                  "jina_head":body[:220].replace("\\n"," ") if "r.jina.ai/https://ratings.moodys.com/ratings-news/434553" in url else "",
                  "sample_titles":titles[:3],
                  "script_sources":re.findall(r'<script[^>]*src="([^"]+)"',body,re.I)[:12],
                  "next_data_present":"__NEXT_DATA__" in body,
                  "app_state_present":"__INITIAL_STATE__" in body
                  }
            except Exception as e:
              return {"source":url,"route":route,"error":type(e).__name__+":"+str(e)[:100]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
            ans=list(ex.map(lambda p:fetch(*p),[(u,t) for u in urls for t in ("direct","proxy")]))
          for item in ans: print(json.dumps(item,ensure_ascii=False))
          PY
