name: JGB 40Y Dutch Auction Watch

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/jgb40-dutch-auction-watch.yml"
      - "scripts/jgb40_dutch_auction_watch.py"
      - "data/jgb40_dutch_state.json"

permissions:
  contents: write

concurrency:
  group: jgb40-dutch-auction-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs8879887988798879_bot"
      KHS_SOURCE_PROXY_URL: "https://tips-yield-telegram.gustnd1.workers.dev/policy-source/fetch"
      KHS_SOURCE_PROXY_FIRST: "true"
      KHS_SOURCE_PROXY_TIMEOUT_SECONDS: "20"
      KHS_SOURCE_DIRECT_TIMEOUT_CAP_SECONDS: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: pip install --disable-pip-version-check beautifulsoup4
      - name: Validate and check 40Y Dutch auction
        run: |
          python -m py_compile scripts/jgb40_dutch_auction_watch.py
          PYTHONPATH=scripts python scripts/jgb40_dutch_auction_watch.py
      - name: Send through verified KHS Telegram route only
        if: hashFiles('out/jgb40_dutch_alert.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, pathlib, urllib.parse, urllib.request
          from zoneinfo import ZoneInfo
          token=(os.getenv('TELEGRAM_BOT_TOKEN') or '').strip(); chat=(os.getenv('TELEGRAM_CHAT_ID') or '').strip()
          expected=(os.getenv('EXPECTED_TELEGRAM_BOT_USERNAME') or '').strip().lstrip('@')
          if not token or not chat: raise RuntimeError('GLOBAL_RATES Telegram secret missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe',timeout=25) as r: ident=json.loads(r.read().decode())
          actual=str((ident.get('result') or {}).get('username') or '')
          if not ident.get('ok') or actual.lower()!=expected.lower(): raise RuntimeError(f'Wrong bot @{actual}')
          title=pathlib.Path('out/jgb40_dutch_title.txt').read_text(encoding='utf-8').strip()
          body=pathlib.Path('out/jgb40_dutch_alert.html').read_text(encoding='utf-8').strip()
          payload=urllib.parse.urlencode({'chat_id':chat,'text':f'<b>{title}</b>\n\n{body}'[:4096],'parse_mode':'HTML','disable_web_page_preview':'true'}).encode()
          req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage',data=payload,method='POST')
          with urllib.request.urlopen(req,timeout=25) as r: result=json.loads(r.read().decode())
          if not result.get('ok'): raise RuntimeError(result)
          pathlib.Path('out/jgb40_dutch_telegram_confirmed.json').write_text(json.dumps({'bot_username':actual,'message_id':(result.get('result') or {}).get('message_id'),'confirmed_at_kst':dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat(timespec='seconds')},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Persist state after baseline/no-alert or confirmed delivery
        if: always()
        run: |
          if [ -f out/jgb40_dutch_alert.html ] && [ ! -f out/jgb40_dutch_telegram_confirmed.json ]; then exit 0; fi
          if [ -f out/jgb40_dutch_pending.json ]; then cp out/jgb40_dutch_pending.json data/jgb40_dutch_state.json; fi
      - name: Commit state
        if: always() && hashFiles('data/jgb40_dutch_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jgb40_dutch_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update JGB 40Y Dutch auction state"
          git pull --rebase origin main
          git push
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jgb40-dutch-${{ github.run_id }}
          path: |
            out/jgb40_dutch_status.md
            out/jgb40_dutch_alert.html
            out/jgb40_dutch_pending.json
            out/jgb40_dutch_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
