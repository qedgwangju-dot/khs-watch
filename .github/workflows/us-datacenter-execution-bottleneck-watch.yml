name: US Data Center Execution Bottleneck Telegram Watch

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "현재 기준선을 저장하고 Telegram 연결 확인 메시지 전송"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/us-datacenter-execution-bottleneck-watch.yml"
      - "scripts/us_datacenter_execution_bottleneck_watch.py"
      - "scripts/dc_telegram_report_formatter.py"
      - "tests/test_us_datacenter_execution_bottleneck_watch.py"
      - "tests/test_dc_telegram_report_formatter.py"
      - ".github/us-datacenter-execution-bottleneck-trigger"

concurrency:
  group: us-datacenter-execution-bottleneck-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 확인
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install requests pytest trafilatura googlenewsdecoder

      - name: 문법 확인
        run: python -m compileall -q scripts/us_datacenter_execution_bottleneck_watch.py scripts/dc_telegram_report_formatter.py

      - name: 알림 판정·원문요약·한국어·원문링크 시험
        run: pytest -q tests/test_us_datacenter_execution_bottleneck_watch.py tests/test_dc_telegram_report_formatter.py

      - name: 미국 데이터센터 실행 병목 감시
        id: dc
        shell: bash
        env:
          FORCE_INPUT: ${{ inputs.force_notify || false }}
          FORCE_PUSH: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[us-dc-route-test]') }}
        run: |
          EXTRA=""
          if [[ "$FORCE_INPUT" == "true" || "$FORCE_PUSH" == "true" ]]; then
            EXTRA="--force-notify"
          fi
          python scripts/us_datacenter_execution_bottleneck_watch.py $EXTRA

      - name: khs8879887988798879_bot으로 Telegram 전송
        if: steps.dc.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: khs8879887988798879_bot
          REPORT_PATH: ${{ steps.dc.outputs.report_path }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "GLOBAL_RATES_TELEGRAM_BOT_TOKEN이 없습니다." >&2
            exit 1
          fi

          python - <<'PY'
          import json, os, pathlib, requests
          from scripts.dc_telegram_report_formatter import sanitize_report

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          if not chat_id:
              raise RuntimeError("Telegram chat id가 없습니다.")

          me = requests.get(f"https://api.telegram.org/bot{token}/getMe", timeout=25)
          me.raise_for_status()
          payload = me.json()
          actual = str(payload.get("result", {}).get("username", ""))
          if not payload.get("ok") or actual != expected:
              raise RuntimeError(f"잘못된 Telegram 봇 경로 차단: expected=@{expected}, actual=@{actual or '확인불가'}")

          raw_text = pathlib.Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8").strip()
          if not raw_text:
              raise RuntimeError("Telegram으로 보낼 보고서가 비어 있습니다.")

          # 최종 발송 직전에 출처 도메인 자동링크/긴 URL 노출/Google News 중계링크/로그인 문구를 모두 차단한다.
          text = sanitize_report(raw_text)
          pathlib.Path(os.environ["REPORT_PATH"]).write_text(text + "\n", encoding="utf-8")

          chunks = []
          current = []
          current_len = 0
          limit = 3300
          for line in text.splitlines():
              line_len = len(line) + 1
              if current and current_len + line_len > limit:
                  chunks.append("\n".join(current).strip())
                  current = [line]
                  current_len = line_len
              else:
                  current.append(line)
                  current_len += line_len
          if current:
              chunks.append("\n".join(current).strip())

          ids = []
          for i, chunk in enumerate(chunks, 1):
              body = (f"[{i}/{len(chunks)}]\n" if len(chunks) > 1 else "") + chunk
              r = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={
                      "chat_id": chat_id,
                      "text": body,
                      "parse_mode": "HTML",
                      "link_preview_options": {"is_disabled": True},
                  },
                  timeout=30,
              )
              r.raise_for_status()
              p = r.json()
              if not p.get("ok"):
                  raise RuntimeError(f"Telegram 전송 실패: {p}")
              ids.append(p.get("result", {}).get("message_id"))

          pathlib.Path("out").mkdir(parents=True, exist_ok=True)
          pathlib.Path("out/us_datacenter_execution_bottleneck_telegram_confirmed.json").write_text(
              json.dumps(
                  {
                      "status": "confirmed",
                      "bot_username": actual,
                      "message_ids": ids,
                      "parse_mode": "HTML",
                      "clickable_source_label": "원문",
                      "source_name_mode": "일반 텍스트 매체명; 도메인 자동링크 금지",
                      "direct_link_only": True,
                      "raw_url_visible": False,
                      "summary_mode": "원문 본문 직접 추출 후 한국어 사실요약",
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          print(f"telegram_delivery_confirmed=true bot=@{actual} messages={len(ids)} last_message_id={ids[-1]} parse_mode=HTML direct_link_only=true")
          PY

      - name: 기준선·보고서 저장
        if: success()
        run: |
          git config user.name "us-datacenter-execution-watch[bot]"
          git config user.email "us-datacenter-execution-watch[bot]@users.noreply.github.com"
          git add data/us_datacenter_execution_bottleneck_state.json out/us_datacenter_execution_bottleneck_alert.txt out/us_datacenter_execution_bottleneck_telegram_confirmed.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update US data center execution bottleneck state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi
