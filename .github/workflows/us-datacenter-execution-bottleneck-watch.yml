name: US Data Center Execution Bottleneck Telegram Watch

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "현재 기준선을 저장하고 Telegram 연결 확인 메시지 전송"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/us-datacenter-execution-bottleneck-watch.yml"
      - "scripts/us_datacenter_execution_bottleneck_watch.py"
      - "tests/test_us_datacenter_execution_bottleneck_watch.py"
      - ".github/us-datacenter-execution-bottleneck-trigger"

concurrency:
  group: us-datacenter-execution-bottleneck-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 확인
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install requests pytest

      - name: 문법 확인
        run: python -m compileall -q scripts/us_datacenter_execution_bottleneck_watch.py

      - name: 알림 판정 규칙 시험
        run: pytest -q tests/test_us_datacenter_execution_bottleneck_watch.py

      - name: 미국 데이터센터 실행 병목 감시
        id: dc
        shell: bash
        env:
          FORCE_INPUT: ${{ inputs.force_notify || false }}
          FORCE_PUSH: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[us-dc-route-test]') }}
        run: |
          EXTRA=""
          if [[ "$FORCE_INPUT" == "true" || "$FORCE_PUSH" == "true" ]]; then
            EXTRA="--force-notify"
          fi
          python scripts/us_datacenter_execution_bottleneck_watch.py $EXTRA

      - name: hs8879887988798879_bot으로 Telegram 전송
        if: steps.dc.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: hs8879887988798879_bot
          REPORT_PATH: ${{ steps.dc.outputs.report_path }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "YEN_CARRY_TELEGRAM_BOT_TOKEN이 없습니다." >&2
            exit 1
          fi

          python - <<'PY'
          import json, os, pathlib, requests
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip() or os.environ.get("FALLBACK_TELEGRAM_CHAT_ID", "").strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          if not chat_id:
              raise RuntimeError("Telegram chat id가 없습니다.")
          me = requests.get(f"https://api.telegram.org/bot{token}/getMe", timeout=25)
          me.raise_for_status()
          payload = me.json()
          actual = str(payload.get("result", {}).get("username", ""))
          if not payload.get("ok") or actual != expected:
              raise RuntimeError(f"잘못된 Telegram 봇 경로 차단: expected=@{expected}, actual=@{actual or '확인불가'}")
          text = pathlib.Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8").strip()
          if not text:
              raise RuntimeError("Telegram으로 보낼 보고서가 비어 있습니다.")
          chunks = []
          while text:
              if len(text) <= 3500:
                  chunks.append(text); break
              cut = text.rfind("\n", 0, 3500)
              if cut < 1700:
                  cut = 3500
              chunks.append(text[:cut].rstrip()); text = text[cut:].lstrip()
          ids = []
          for i, chunk in enumerate(chunks, 1):
              body = (f"[{i}/{len(chunks)}]\n" if len(chunks) > 1 else "") + chunk
              r = requests.post(f"https://api.telegram.org/bot{token}/sendMessage", json={"chat_id": chat_id, "text": body, "disable_web_page_preview": True}, timeout=30)
              r.raise_for_status()
              p = r.json()
              if not p.get("ok"):
                  raise RuntimeError(f"Telegram 전송 실패: {p}")
              ids.append(p.get("result", {}).get("message_id"))
          pathlib.Path("out").mkdir(parents=True, exist_ok=True)
          pathlib.Path("out/us_datacenter_execution_bottleneck_telegram_confirmed.json").write_text(json.dumps({"status":"confirmed","bot_username":actual,"message_ids":ids}, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print(f"telegram_delivery_confirmed=true bot=@{actual} messages={len(ids)} last_message_id={ids[-1]}")
          PY

      - name: 기준선·보고서 저장
        if: success()
        run: |
          git config user.name "us-datacenter-execution-watch[bot]"
          git config user.email "us-datacenter-execution-watch[bot]@users.noreply.github.com"
          git add data/us_datacenter_execution_bottleneck_state.json out/us_datacenter_execution_bottleneck_alert.txt out/us_datacenter_execution_bottleneck_telegram_confirmed.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update US data center execution bottleneck state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi
