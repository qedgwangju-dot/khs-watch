name: One-off Energy Mix Corrected Alert

on:
  push:
    paths:
      - ".github/workflows/oneoff-energy-mix-corrected-alert.yml"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 정확한 전기본 원문 해석 알림 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.ENERGY_MIX_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ENERGY_MIX_TELEGRAM_CHAT_ID }}
          FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: khs887988798879887988798879_bot
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip() or os.environ.get("FALLBACK_TELEGRAM_CHAT_ID", "").strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("Telegram token/chat id missing")

          me = requests.get(f"https://api.telegram.org/bot{token}/getMe", timeout=20)
          me.raise_for_status()
          actual = str(me.json().get("result", {}).get("username", ""))
          if actual.lower() != expected.lower():
              raise RuntimeError(f"wrong bot: expected=@{expected}, actual=@{actual}")

          text = '''<b>한국 전기본·전원믹스 새 변화</b>

<b>1. 전력수요 폭증에 2040 석탄폐지까지…신규 원전 공론화 개시[12차 전기본③]</b>

<b>핵심 분야</b>  원전·전원믹스
<b>전기본 단계</b>  수립·공론화
<b>확인 상태</b>  신뢰 보도·정부 발언 기반
<b>발표일</b>  2026년 8월 31일
<b>출처</b>  <a href="https://www.newsis.com/view/NISX20260828_0003766340"><b>뉴시스</b></a>

<b>원문 본문 해석</b>
<b>무슨 말인가</b>
• 반도체·AI 데이터센터 등으로 2040년 전력수요 전망이 크게 올라간 상황에서, 정부가 <b>2040년 석탄발전 폐지</b>도 함께 추진하므로 석탄이 빠진 자리를 어떤 발전원으로 메울지가 제12차 전기본의 핵심 쟁점이 됨.
• 정부는 재생에너지를 주력으로 확대하되 <b>원전과 병행</b>하고, 석탄을 줄이면서 필요한 구간에는 LNG를 보완전원으로 활용하는 조합을 공론화하려는 것.

<b>이미 확정된 것과 새로 검토하는 것을 구분</b>
• 제11차 전기본의 <b>대형원전 2기 + 소형모듈원전 1기</b>는 기존 추진계획. 기사 기준 준공 예상은 소형모듈원전 2035년, 대형원전 2037년·2038년.
• 이번 기사에서 말하는 <b>추가 신규 원전은 아직 확정이 아님</b>. 김성환 기후에너지환경부 장관은 호남 반도체 산단이 당초 팹 4기보다 더 커질 경우 원전을 더 지을지 포함해 추가 대책을 검토해야 한다고 밝힌 단계.
• 장관이 <b>한빛 원전에 2기를 더 지을 수 있는 부지</b>를 언급했지만, 이것도 신규 2기 건설 확정 발표가 아니라 검토 가능성을 설명한 발언.
• 호남 산단 <b>최대 9개 팹</b> 가능성은 기사에 소개된 업계 관측으로 정부 확정 물량과는 구분해야 함.

<b>왜 LNG가 다시 나오나</b>
• 원전은 건설기간이 길고 재생에너지는 출력 변동성이 있으므로, 석탄을 줄이는 과정에서 발전 공백이 생기면 <b>건설이 상대적으로 빠르고 출력 조절이 쉬운 LNG 발전</b>이 중간 보완전원으로 거론됨.
• 호남 반도체 산단은 공정용 <b>열·스팀 수요</b> 때문에 LNG 발전소 가능성도 열어둔 상태.
• 다만 LNG도 탄소를 배출하므로 장기적으로 계속 확대하는 전원이라기보다 탄소감축·수소화·비상전원화와 함께 봐야 함.

<b>석탄 폐지에서 같이 봐야 할 것</b>
• 2040년까지 석탄발전을 단계적으로 폐지할 때 <b>폐지 시점과 대체 발전소 준공 시점 사이의 발전 공백</b>을 막는 것이 핵심.
• 동시에 석탄발전 지역의 일자리·지역경제를 다른 산업으로 옮기는 <b>정의로운 전환</b>도 정책 과제.
• 발전공기업 5사 재편과 <b>1사 통합안은 아직 연구용역 권고 단계</b>로 최종 확정이 아님.

<b>앞으로 시간표</b>
• 9월  신규 원전·2040 탈석탄·전력시장·송변전 계획 공론화
• 10월  <b>제12차 전기본 정부안</b>
• 이후 국회 보고 등 법적 절차
• 연내  <b>제12차 전기본 최종 확정 목표</b>

<b>쉽게 풀면</b>
전력수요는 크게 늘고 석탄은 없애야 하므로, <b>재생에너지 + 기존·추가 원전 + 일정 기간 LNG + 송변전망</b>을 어떤 비율과 일정으로 조합할지를 이제 정부가 결정하기 시작했다는 기사. 지금 가장 중요한 것은 “원전 확대 확정”이 아니라 <b>추가 원전 기수·부지, LNG 신규 용량, 석탄 폐지 연도별 물량, 10월 정부안</b>이 실제로 어떻게 정해지는지임.

<b>투자 의미</b>  신규 원전·LNG·송변전 설비의 발주 시점과 규모가 제12차 전기본 정부안에서 구체화될 가능성이 있어 원전 기자재·전력기기·송전망·가스발전 설비투자의 시간표가 바뀔 수 있음.'''

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": text, "parse_mode": "HTML", "disable_web_page_preview": True},
              timeout=30,
          )
          response.raise_for_status()
          data = response.json()
          if not data.get("ok"):
              raise RuntimeError(data)
          mid = data.get("result", {}).get("message_id")
          print(f"telegram_delivery_confirmed=true bot=@{actual} message_id={mid}")
          PY
