name: Trump OGE portfolio Telegram watch

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trump-oge-portfolio-telegram.yml"
      - "scripts/trump_oge_portfolio_watch.py"
      - "scripts/trump_oge_portfolio_watch_entry.py"

permissions:
  contents: write

concurrency:
  group: trump-oge-portfolio-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      THIRTEENF_TELEGRAM_BOT_TOKEN: ${{ secrets.THIRTEENF_TELEGRAM_BOT_TOKEN }}
      THIRTEENF_TELEGRAM_CHAT_ID: ${{ secrets.THIRTEENF_TELEGRAM_CHAT_ID }}
      KHS_POLICY_TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
      KHS_POLICY_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      USD_KRW_FALLBACK: "1393.24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Validate scripts
        run: |
          python -m py_compile scripts/trump_oge_portfolio_watch.py
          python -m py_compile scripts/trump_oge_portfolio_watch_entry.py

      - name: Check Trump OGE 278-T filings and send Telegram alert
        run: python scripts/trump_oge_portfolio_watch_entry.py

      - name: Persist seen OGE filing state
        if: success()
        run: |
          if git diff --quiet -- data/trump_oge_portfolio_watch_state.json; then
            echo "OGE state unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trump_oge_portfolio_watch_state.json
          git commit -m "Update Trump OGE portfolio watch state"
          git push
