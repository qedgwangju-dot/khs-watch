name: KOSPI LS Realtime Derivatives Flow Watch

on:
  schedule:
    - cron: "22 0 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test or production"
        required: false
        default: "test"
        type: choice
        options: ["test", "production"]
  push:
    branches: [main]
    paths:
      - ".github/workflows/kospi-derivatives-flow-ls-realtime.yml"
      - "scripts/kospi_shock_episode_watch.py"
      - "scripts/test_kospi_shock_episode.py"
      - "scripts/kospi_flow_attribution_ls.py"

permissions:
  contents: read

concurrency:
  group: kospi-derivatives-flow-ls-realtime
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
      LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
      LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests ebest

      - name: Verify Telegram route
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=(os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          expected=(os.getenv('EXPECTED_TELEGRAM_BOT_USERNAME') or '').strip().lstrip('@')
          if not token:
              raise RuntimeError('Telegram token missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              d=json.loads(r.read().decode('utf-8'))
          actual=str((d.get('result') or {}).get('username') or '')
          if not d.get('ok') or actual.lower()!=expected.lower():
              raise RuntimeError(f'Wrong Telegram bot: expected @{expected}, got @{actual or "unknown"}')
          print(f'telegram_route_valid=true bot=@{actual}')
          PY

      - name: Validate variable episode detector
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'production')
        run: |
          python -m py_compile scripts/kospi_shock_episode_watch.py scripts/test_kospi_shock_episode.py
          python scripts/test_kospi_shock_episode.py

      - name: Test LS realtime and flow runtime
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'production')
        run: |
          rm -f out/kospi_shock_episode_status.md out/kospi_shock_episode_raw.json
          python scripts/kospi_shock_episode_watch.py --test --test-seconds 15
          cat out/kospi_shock_episode_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run market-hours variable shock episode watcher
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'production')
        run: |
          rm -f out/kospi_shock_episode_status.md out/kospi_shock_episode_raw.json
          python -m py_compile scripts/kospi_shock_episode_watch.py
          python scripts/kospi_shock_episode_watch.py --until 15:20
          cat out/kospi_shock_episode_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kospi-shock-episode-${{ github.run_id }}
          path: |
            out/kospi_shock_episode_status.md
            out/kospi_shock_episode_raw.json
          if-no-files-found: ignore
          retention-days: 14
