name: KOSPI LS Realtime Derivatives Flow Watch

on:
  schedule:
    - cron: "23,33,43,53 8 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "3,13 9 * * 1-5"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      mode:
        description: "production"
        required: false
        default: "production"
        type: choice
        options: ["production"]

permissions:
  contents: read
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 430
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
      LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
      LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}

    steps:
      - name: Elect single production leader
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, urllib.request
          from zoneinfo import ZoneInfo

          repo = os.environ["REPOSITORY"]
          current = int(os.environ["CURRENT_RUN_ID"])
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          url = f"https://api.github.com/repos/{repo}/actions/workflows/kospi-derivatives-flow-ls-realtime.yml/runs?per_page=50"
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=20) as r:
              runs = json.loads(r.read().decode("utf-8")).get("workflow_runs", [])

          now_kst = dt.datetime.now(ZoneInfo("Asia/Seoul"))
          active = []
          for run in runs:
              if run.get("status") not in {"queued", "in_progress"}:
                  continue
              created = dt.datetime.fromisoformat(str(run["created_at"]).replace("Z", "+00:00")).astimezone(ZoneInfo("Asia/Seoul"))
              if created.date() != now_kst.date():
                  continue
              active.append((created, int(run["id"]), run.get("status")))

          active.sort()
          running = [x for x in active if x[2] == "in_progress"]
          queued = [x for x in active if x[2] == "queued"]
          leader_id = (running[0][1] if running else (queued[0][1] if queued else current))
          should_run = leader_id == current
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fp:
              fp.write(f"RUN_PRODUCTION={'1' if should_run else '0'}\n")
          print(f"kospi_production_leader={leader_id} current={current} should_run={str(should_run).lower()} active={[(x[1], x[2]) for x in active]}")
          PY

      - name: Checkout
        if: env.RUN_PRODUCTION == '1'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.RUN_PRODUCTION == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: env.RUN_PRODUCTION == '1'
        run: python -m pip install --disable-pip-version-check --quiet requests

      - name: Verify Telegram route
        if: env.RUN_PRODUCTION == '1'
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=(os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          expected=(os.getenv('EXPECTED_TELEGRAM_BOT_USERNAME') or '').strip().lstrip('@')
          if not token:
              raise RuntimeError('Telegram token missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              d=json.loads(r.read().decode('utf-8'))
          actual=str((d.get('result') or {}).get('username') or '')
          if not d.get('ok') or actual.lower()!=expected.lower():
              raise RuntimeError(f'Wrong Telegram bot: expected @{expected}, got @{actual or "unknown"}')
          print(f'telegram_route_valid=true bot=@{actual}')
          PY

      - name: Run market-hours variable shock episode watcher
        if: env.RUN_PRODUCTION == '1'
        run: |
          rm -f out/kospi_shock_episode_status.md out/kospi_shock_episode_raw.json out/kospi_shock_delivery_log.jsonl out/kospi_shock_enrichment_latest.json
          python -m py_compile scripts/kospi_shock_episode_watch.py
          python scripts/kospi_shock_episode_watch.py --until 15:20
          cat out/kospi_shock_episode_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification artifacts
        if: always() && env.RUN_PRODUCTION == '1'
        uses: actions/upload-artifact@v4
        with:
          name: kospi-shock-episode-${{ github.run_id }}
          path: |
            out/kospi_shock_episode_status.md
            out/kospi_shock_episode_raw.json
            out/kospi_shock_delivery_log.jsonl
            out/kospi_shock_enrichment_latest.json
          if-no-files-found: ignore
          retention-days: 14
