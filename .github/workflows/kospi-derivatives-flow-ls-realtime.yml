name: KOSPI LS Realtime Derivatives Flow Watch

on:
  schedule:
    - cron: "3,13,23,33,43,53 8 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "3,13,23,33,43,53 9-14 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "3,13,23 15 * * 1-5"
      timezone: "Asia/Seoul"
    # 별도 UTC 예약 경로: 10월 8일 본 예약 schedule 실행이 보이지 않아 중복 안전망 추가.
    # UTC 일요일~목요일 23시는 한국 월요일~금요일 08시이다.
    - cron: "6,26,46 23 * * 0-4"
    - cron: "6,26,46 0-5 * * 1-5"
    - cron: "6,26 6 * * 1-5"
  workflow_run:
    workflows:
      - "Wonyotti 90D Thesis Telegram Watch"
      - "Korea Market Stress and Global Wave Telegram Watch"
      - "GAMEJOA preopen news radar"
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "production"
        required: false
        default: "production"
        type: choice
        options: ["production"]

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_production: ${{ steps.elect.outputs.run_production }}
      run_morning: ${{ steps.elect.outputs.run_morning }}
    steps:
      - name: Checkout calendar helper
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install calendar dependency
        run: python -m pip install --disable-pip-version-check --quiet exchange_calendars
      - name: Elect single production workflow
        id: elect
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, sys, urllib.parse, urllib.request
          from zoneinfo import ZoneInfo
          sys.path.insert(0, "scripts")
          from krx_session_calendar import session_state

          repo=os.environ["REPOSITORY"]
          current=int(os.environ["CURRENT_RUN_ID"])
          token=os.environ["GH_TOKEN"]
          headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
          }
          now=dt.datetime.now(ZoneInfo("Asia/Seoul"))
          session=session_state(now)
          eligible=bool(
              session["is_session"]
              and session["open"] is not None
              and session["close"] is not None
              and session["open"]-dt.timedelta(minutes=60) <= now
              and now <= session["close"]+dt.timedelta(minutes=2)
          )
          should_run=False
          active=[]
          healthy=[]
          startup=[]
          unknown=[]
          if eligible:
              url=f"https://api.github.com/repos/{repo}/actions/workflows/kospi-derivatives-flow-ls-realtime.yml/runs?per_page=50"
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:
                  runs=json.loads(r.read().decode("utf-8")).get("workflow_runs",[])
              current_created=now
              startup_candidates=[]
              for run in runs:
                  if run.get("status") not in {"queued","in_progress"}:
                      continue
                  created=dt.datetime.fromisoformat(str(run["created_at"]).replace("Z","+00:00")).astimezone(ZoneInfo("Asia/Seoul"))
                  run_id=int(run["id"])
                  if created.date()!=now.date():
                      continue
                  active.append((created,run_id,run.get("status")))
                  age_minutes=(now-created).total_seconds()/60.0
                  if run_id==current:
                      current_created=created
                      startup_candidates.append((created,run_id,run.get("status")))
                      continue
                  jobs_url=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
                  try:
                      with urllib.request.urlopen(urllib.request.Request(jobs_url,headers=headers),timeout=20) as r:
                          jobs=json.loads(r.read().decode("utf-8")).get("jobs",[])
                  except Exception as exc:
                      if age_minutes<=3:
                          unknown.append((run_id,run.get("status"),type(exc).__name__))
                      continue
                  production_jobs=[
                      j for j in jobs
                      if str(j.get("name") or "") in {"watch","morning","afternoon"}
                      and j.get("status") in {"queued","in_progress"}
                  ]
                  if production_jobs:
                      healthy.append((
                          run_id,
                          [(j.get("name"),j.get("status")) for j in production_jobs],
                      ))
                  elif age_minutes<=3:
                      startup.append((run_id,run.get("status")))
                      startup_candidates.append((created,run_id,run.get("status")))

              if healthy or unknown:
                  should_run=False
              else:
                  if not any(x[1]==current for x in startup_candidates):
                      startup_candidates.append((current_created,current,"current"))
                  startup_candidates.sort(key=lambda x:(x[0],x[1]))
                  startup_leader=startup_candidates[0][1]
                  should_run=(startup_leader==current)
          run_morning=bool(should_run and now.time()<dt.time(12,15))

          # 장 시작 뒤 감시가 비어 있다가 뒤늦게 복구되는 경우 침묵하지 않는다.
          # 과거 구간의 투자자 수급은 소급 생성하지 않고 감시 공백 자체만 알린다.
          if (
              should_run
              and session["open"] is not None
              and now >= session["open"] + dt.timedelta(minutes=5)
          ):
              bot=(os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
              chat=(os.getenv("TELEGRAM_CHAT_ID") or "").strip()
              if bot and chat:
                  text=(
                      "⚠️ 코스피 급락 감시 공백 감지·자동 복구\n"
                      f"현재 시각 {now:%Y-%m-%d %H:%M:%S} KST\n"
                      f"정규장 시작 {session['open']:%H:%M:%S} 이후 활성 production이 없어 새 감시를 기동합니다.\n"
                      "공백 구간은 정확한 시작 수급 스냅샷이 없으므로 매도주체를 소급 추정하지 않습니다."
                  )
                  payload=urllib.parse.urlencode({
                      "chat_id":chat,"text":text,"disable_web_page_preview":"true"
                  }).encode("utf-8")
                  req=urllib.request.Request(
                      f"https://api.telegram.org/bot{bot}/sendMessage",
                      data=payload,method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req,timeout=25) as r:
                          out=json.loads(r.read().decode("utf-8"))
                      if out.get("ok"):
                          print(f"kospi_gap_recovery_alert=true message_id={out['result'].get('message_id')}")
                      else:
                          print(f"kospi_gap_recovery_alert=false rejected={out}")
                  except Exception as exc:
                      # 경고 발송 장애가 실제 시장감시 기동을 막아서는 안 된다.
                      print(f"kospi_gap_recovery_alert=false error={type(exc).__name__}: {exc}")

          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fp:
              fp.write(f"run_production={'1' if should_run else '0'}\n")
              fp.write(f"run_morning={'1' if run_morning else '0'}\n")
          print(
              f"kospi_gate_session={session['is_session']} eligible={eligible} should_run={should_run} "
              f"run_morning={run_morning} healthy={healthy} startup={startup} "
              f"unknown={unknown} active={[(x[1],x[2]) for x in active]}"
          )
          PY

  morning:
    needs: gate
    if: needs.gate.outputs.run_production == '1' && needs.gate.outputs.run_morning == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
      LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
      LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests ebest exchange_calendars
      - name: Verify Telegram route
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=(os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          expected=(os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token: raise RuntimeError("Telegram token missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe",timeout=20) as r:
              d=json.loads(r.read().decode("utf-8"))
          actual=str((d.get("result") or {}).get("username") or "")
          if not d.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{actual}")
          PY
      - name: Run morning KOSPI watcher
        run: |
          rm -f out/kospi_shock_episode_status.md out/kospi_shock_episode_raw.json out/kospi_shock_delivery_log.jsonl out/kospi_shock_enrichment_latest.json out/kospi_shock_handoff.json out/kospi_industry_flow.jsonl out/krx_market_closed.flag
          python -m py_compile scripts/kospi_shock_episode_watch.py scripts/kospi_shock_enrichment.py scripts/kospi_unified_industry_collector.py scripts/krx_session_calendar.py

          collector_supervisor() {
            while [ "$(TZ=Asia/Seoul date +%H%M)" -lt 1215 ]; do
              set +e
              python scripts/kospi_unified_industry_collector.py --until 12:15 --out out/kospi_industry_flow.jsonl
              RC=$?
              set -e
              [ -f out/krx_market_closed.flag ] && break
              [ "$(TZ=Asia/Seoul date +%H%M)" -ge 1215 ] && break
              echo "ubm_collector_restart rc=$RC"
              sleep 10
            done
          }
          collector_supervisor &
          COLLECTOR_PID=$!

          WATCH_FAILS=0
          while [ "$(TZ=Asia/Seoul date +%H%M)" -lt 1215 ]; do
            set +e
            if [ -s out/kospi_shock_handoff.json ]; then
              python scripts/kospi_shock_episode_watch.py --until 12:15 --handoff-in out/kospi_shock_handoff.json --handoff-out out/kospi_shock_handoff.json
            else
              python scripts/kospi_shock_episode_watch.py --until 12:15 --handoff-out out/kospi_shock_handoff.json
            fi
            WATCH_RC=$?
            set -e
            [ "$WATCH_RC" -eq 0 ] && break
            WATCH_FAILS=$((WATCH_FAILS + 1))
            echo "kospi_watcher_restart rc=$WATCH_RC consecutive_failures=$WATCH_FAILS"
            BACKOFF=$((WATCH_FAILS * 10))
            [ "$BACKOFF" -gt 60 ] && BACKOFF=60
            echo "kospi_watcher_retrying backoff_seconds=$BACKOFF"
            sleep "$BACKOFF"
          done

          if kill -0 "$COLLECTOR_PID" 2>/dev/null; then
            kill "$COLLECTOR_PID" 2>/dev/null || true
          fi
          wait "$COLLECTOR_PID" 2>/dev/null || true
          if [ -s out/kospi_shock_episode_status.md ]; then
            cat out/kospi_shock_episode_status.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/krx_market_closed.flag ]; then
            echo "krx_market_closed=true"
          else
            test -s out/kospi_industry_flow.jsonl || { echo "Unified UBM industry flow file missing/empty"; exit 1; }
          fi
      - name: Upload morning handoff and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kospi-shock-morning-${{ github.run_id }}
          path: |
            out/kospi_shock_handoff.json
            out/kospi_shock_episode_status.md
            out/kospi_shock_episode_raw.json
            out/kospi_shock_delivery_log.jsonl
            out/kospi_shock_enrichment_latest.json
            out/kospi_industry_flow.jsonl
            out/krx_market_closed.flag
          if-no-files-found: ignore
          retention-days: 14

  afternoon:
    needs: [gate, morning]
    if: always() && needs.gate.outputs.run_production == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 359
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
      LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
      LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download morning handoff
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kospi-shock-morning-${{ github.run_id }}
          path: out
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests ebest exchange_calendars
      - name: Verify Telegram route
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=(os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          expected=(os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token: raise RuntimeError("Telegram token missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe",timeout=20) as r:
              d=json.loads(r.read().decode("utf-8"))
          actual=str((d.get("result") or {}).get("username") or "")
          if not d.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{actual}")
          PY
      - name: Run afternoon KOSPI watcher with handoff
        run: |
          rm -f out/kospi_shock_episode_status.md out/kospi_shock_episode_raw.json out/kospi_shock_enrichment_latest.json
          python -m py_compile scripts/kospi_shock_episode_watch.py scripts/kospi_shock_enrichment.py scripts/kospi_unified_industry_collector.py scripts/krx_session_calendar.py

          collector_supervisor() {
            while [ "$(TZ=Asia/Seoul date +%H%M)" -lt 1532 ]; do
              set +e
              python scripts/kospi_unified_industry_collector.py --until 15:32 --out out/kospi_industry_flow.jsonl
              RC=$?
              set -e
              [ -f out/krx_market_closed.flag ] && break
              [ "$(TZ=Asia/Seoul date +%H%M)" -ge 1532 ] && break
              echo "ubm_collector_restart rc=$RC"
              sleep 10
            done
          }
          collector_supervisor &
          COLLECTOR_PID=$!

          WATCH_FAILS=0
          while [ "$(TZ=Asia/Seoul date +%H%M)" -lt 1532 ]; do
            set +e
            python scripts/kospi_shock_episode_watch.py --until 15:32 --handoff-in out/kospi_shock_handoff.json --handoff-out out/kospi_shock_handoff.json
            WATCH_RC=$?
            set -e
            [ "$WATCH_RC" -eq 0 ] && break
            WATCH_FAILS=$((WATCH_FAILS + 1))
            echo "kospi_watcher_restart rc=$WATCH_RC consecutive_failures=$WATCH_FAILS"
            BACKOFF=$((WATCH_FAILS * 10))
            [ "$BACKOFF" -gt 60 ] && BACKOFF=60
            echo "kospi_watcher_retrying backoff_seconds=$BACKOFF"
            sleep "$BACKOFF"
          done

          if kill -0 "$COLLECTOR_PID" 2>/dev/null; then
            kill "$COLLECTOR_PID" 2>/dev/null || true
          fi
          wait "$COLLECTOR_PID" 2>/dev/null || true
          if [ -s out/kospi_shock_episode_status.md ]; then
            cat out/kospi_shock_episode_status.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/krx_market_closed.flag ]; then
            echo "krx_market_closed=true"
          else
            test -s out/kospi_industry_flow.jsonl || { echo "Unified UBM industry flow file missing/empty"; exit 1; }
          fi
      - name: Upload afternoon verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kospi-shock-afternoon-${{ github.run_id }}
          path: |
            out/kospi_shock_episode_status.md
            out/kospi_shock_episode_raw.json
            out/kospi_shock_delivery_log.jsonl
            out/kospi_shock_enrichment_latest.json
            out/kospi_shock_handoff.json
            out/kospi_industry_flow.jsonl
            out/krx_market_closed.flag
          if-no-files-found: ignore
          retention-days: 14
