name: Yen JGB Retail Tax Policy Alert

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/yen_jgb_retail_policy_alert.py'
      - 'tests/test_yen_jgb_retail_policy_alert.py'
      - '.github/workflows/yen-jgb-retail-policy-alert.yml'

permissions:
  contents: write

concurrency:
  group: yen-jgb-retail-policy-alert
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regression tests
        run: python -m unittest tests.test_yen_jgb_retail_policy_alert

      - name: Scan retail-JGB tax policy news
        if: github.event_name != 'pull_request'
        run: python scripts/yen_jgb_retail_policy_alert.py

      - name: Publish summary
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -f out/yen_jgb_retail_policy_watch.md ]; then
            cat out/yen_jgb_retail_policy_watch.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Telegram only to KHS policy bot
        if: github.event_name != 'pull_request' && hashFiles('out/yen_jgb_retail_policy_alert.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_BOT_USERNAME: khs8879887988798879_bot
        run: |
          python - <<'PY'
          import html, json, os, pathlib, urllib.parse, urllib.request

          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          expected = os.environ['EXPECTED_BOT_USERNAME']
          if not token or not chat_id:
              raise SystemExit('KHS Telegram secrets are missing')

          def call(method, fields=None):
              data = None if fields is None else urllib.parse.urlencode(fields).encode()
              req = urllib.request.Request(f'https://api.telegram.org/bot{token}/{method}', data=data)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          me = call('getMe')
          username = ((me.get('result') or {}).get('username') or '').strip()
          if username.lower() != expected.lower():
              raise SystemExit(f'Wrong Telegram bot: @{username}; expected @{expected}')

          title = pathlib.Path('out/yen_jgb_retail_policy_title.txt').read_text(encoding='utf-8').strip()
          body = pathlib.Path('out/yen_jgb_retail_policy_alert.html').read_text(encoding='utf-8').strip()
          text = f'<b>{html.escape(title)}</b>\n\n{body}'
          result = call('sendMessage', {
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'HTML',
              'disable_web_page_preview': 'true',
          })
          if not result.get('ok'):
              raise SystemExit(f'Telegram send failed: {result}')
          print(f"sent via @{username}; message_id={(result.get('result') or {}).get('message_id')}")
          PY

      - name: Finalize state after confirmed Telegram send
        if: github.event_name != 'pull_request' && hashFiles('out/yen_jgb_retail_policy_pending.json') != '' && hashFiles('out/yen_jgb_retail_policy_alert.html') != ''
        run: |
          cp out/yen_jgb_retail_policy_pending.json data/yen_jgb_retail_policy_state.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/yen_jgb_retail_policy_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: update JGB retail tax policy alert state'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          exit 1
