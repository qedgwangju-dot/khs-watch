name: KOFIA Liquidity Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kofia-liquidity-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.48.2
      - name: Probe KOFIA FreeSIS official JSON
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const exe = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(p => fs.existsSync(p));
          if (!exe) throw new Error('No system Chromium/Chrome found');
          (async()=>{
            const browser=await chromium.launch({executablePath:exe,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.goto('https://freesis.kofia.or.kr/stat/main.do',{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1200);
            async function postJson(path, body){
              return await page.evaluate(async ({path,body})=>{
                const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json; charset=UTF-8'},body:JSON.stringify(body)});
                const text=await r.text();
                let json=null; try{json=JSON.parse(text)}catch(e){}
                return {status:r.status,json,text};
              },{path,body});
            }
            for (const sid of ['STATFND0400000050','STATFND0400000051','STATSCU0100000090']) {
              const r=await postJson('/meta/getSrvData.do',{dmSearchData:{strSvrId:sid}});
              const j=r.json||{};
              console.log('\nMETA',sid,'status',r.status);
              console.log('latest',JSON.stringify(j.dsLatestDate||[]));
              console.log('search',JSON.stringify((j.dsSearch||[]).map(x=>({name:x.ITEM_DMNNM,meta:x.SRCH_METAVAR,default:x.D_DISPLAY_DSPVLU,func:x.DISPLAY_OUTPUTFUNC}))));
              console.log('grid',JSON.stringify((j.dsGrid||[]).filter(x=>x.HEADER_TYP).map(x=>({id:x.HEADER_ID,name:x.HEADER_NM,type:x.HEADER_TYP,order:x.ORDER_SEQ,parent:x.PARENT_HDRID||''}))));
              console.log('obj',JSON.stringify(j.dsGridServlet||[]));
            }
            const tests=[
              ['MMF50-A',{dmSearch:{tmpV40:'1000000',tmpV34:'20260914',tmpV39:'1',OBJ_NM:'STATFND0400000050BO'}}],
              ['MMF50-B',{dmSearch:{tmpV40:'100000000',tmpV34:'20260914',tmpV39:'1',OBJ_NM:'STATFND0400000050BO'}}],
              ['MMF51-A',{dmSearch:{tmpV40:'1000000',tmpV39:'1',tmpV1:'RD',tmpV45:'20260901',tmpV46:'20260916',OBJ_NM:'STATFND0400000051BO'}}],
              ['CMA-A',{dmSearch:{tmpV40:'1000000',tmpV34:'20260914',OBJ_NM:'STATSCU0100000090BO'}}],
              ['CMA-B',{dmSearch:{tmpV40:'1000000',tmpV1:'RD',tmpV45:'20260901',tmpV46:'20260916',OBJ_NM:'STATSCU0100000090BO'}}]
            ];
            for (const [label,body] of tests) {
              const r=await postJson('/meta/getMetaDataList.do',body);
              console.log('\nDATA',label,'status',r.status,JSON.stringify(r.json||r.text.slice(0,4000)));
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
