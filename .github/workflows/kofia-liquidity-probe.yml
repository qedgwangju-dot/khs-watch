name: KOFIA Liquidity Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kofia-liquidity-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.48.2
      - name: Probe KOFIA FreeSIS official JSON
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const candidates = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const exe = candidates.find(p => fs.existsSync(p));
          if (!exe) throw new Error('No system Chromium/Chrome found');
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36';
          (async()=>{
            const browser=await chromium.launch({executablePath:exe,headless:true,args:['--disable-blink-features=AutomationControlled','--no-sandbox','--disable-dev-shm-usage'],ignoreDefaultArgs:['--enable-automation']});
            const ctx=await browser.newContext({locale:'ko-KR',timezoneId:'Asia/Seoul',userAgent:UA});
            await ctx.addInitScript(()=>{Object.defineProperty(navigator,'webdriver',{get:()=>undefined});window.chrome={runtime:{}};});
            const page=await ctx.newPage();
            await page.goto('https://freesis.kofia.or.kr/stat/main.do',{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1200);
            async function post(path, body){
              return await page.evaluate(async ({path,body})=>{
                const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json; charset=UTF-8'},body:JSON.stringify(body)});
                return {status:r.status,text:await r.text()};
              },{path,body});
            }
            const sid='STATFND0400000050';
            for (const body of [
              {dmSearchData:{strSvrId:sid}},
              {dmSearchData:{strSvrId:sid,strExeType:'S'}},
              {dmSearchData:{strSvrId:sid,strExeType:'R'}}
            ]) {
              const r=await post('/meta/getSrvData.do',body);
              console.log('SRV BODY',JSON.stringify(body),'STATUS',r.status,'TEXT',r.text.slice(0,18000));
            }
            for (const [label,serviceId] of [['MMF',sid],['CMA','STATSCU0100000090'],['DEPOSIT','STATSCU0100000060'],['CREDIT','STATSCU0100000070']]) {
              const body={dmSearch:{tmpV40:'1000000',tmpV41:'1',tmpV6:'2',tmpV7:'1',tmpV4:'',tmpV11:'',tmpV1:'RD',tmpV45:'20260901',tmpV46:'20260916',OBJ_NM:serviceId+'BO'}};
              const r=await post('/meta/getMetaDataList.do',body);
              console.log('DATA',label,'STATUS',r.status,'TEXT',r.text.slice(0,18000));
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
