name: KOFIA Liquidity Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kofia-liquidity-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.48.2
      - name: Probe prior-date KOFIA official values
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const exe = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(p => fs.existsSync(p));
          if (!exe) throw new Error('No system Chromium/Chrome found');
          (async()=>{
            const browser=await chromium.launch({executablePath:exe,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.goto('https://freesis.kofia.or.kr/stat/main.do',{waitUntil:'networkidle',timeout:60000});
            async function post(body){
              return await page.evaluate(async body=>{
                const r=await fetch('/meta/getMetaDataList.do',{method:'POST',headers:{'Content-Type':'application/json; charset=UTF-8'},body:JSON.stringify(body)});
                return JSON.parse(await r.text());
              },body);
            }
            for (const d of ['20260914','20260911','20260910','20260909','20260908','20260907','20260904']) {
              const mmf=await post({dmSearch:{tmpV40:'1000000',tmpV34:d,tmpV39:'1',OBJ_NM:'STATFND0400000050BO'}});
              const m=(mmf.ds1||[]).find(x=>x.TMPV98==='99'||x.TMPV1==='합계');
              console.log('MMF',d,m?JSON.stringify(m):'NO_TOTAL');
              const cma=await post({dmSearch:{tmpV40:'1000000',tmpV1:'RD',tmpV45:d,tmpV46:d,OBJ_NM:'STATSCU0100000090BO'}});
              const c=(cma.ds1||[]).find(x=>x.ORD_SEQ===99||x.TMPV1==='합계');
              console.log('CMA',d,c?JSON.stringify(c):'NO_TOTAL');
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
