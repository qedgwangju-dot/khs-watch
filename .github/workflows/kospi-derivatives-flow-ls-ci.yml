name: KOSPI Derivatives Flow CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kospi-derivatives-flow-ls-ci.yml"
      - ".github/workflows/kospi-derivatives-flow-ls-realtime.yml"
      - "scripts/kospi_shock_episode_watch.py"
      - "scripts/test_kospi_shock_episode.py"
      - "scripts/kospi_flow_attribution_ls.py"
      - "scripts/test_kospi_flow_attribution_strict.py"
      - "scripts/kospi_rapid_fallback_watch.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kospi-derivatives-flow-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
      LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
      LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests

      - name: Compile
        run: |
          python -m py_compile             scripts/kospi_shock_episode_watch.py             scripts/test_kospi_shock_episode.py             scripts/kospi_flow_attribution_ls.py             scripts/test_kospi_flow_attribution_strict.py             scripts/kospi_rapid_fallback_watch.py

      - name: Run regression tests
        run: |
          python scripts/test_kospi_shock_episode.py
          python scripts/test_kospi_flow_attribution_strict.py

      - name: Verify LS REST prices and flow snapshot
        run: |
          rm -f out/kospi_shock_episode_status.md out/kospi_shock_episode_raw.json
          python scripts/kospi_shock_episode_watch.py --test --test-seconds 15
          python - <<'PY'
          import json
          d=json.load(open("out/kospi_shock_episode_raw.json", encoding="utf-8"))
          price=d.get("last_price_snapshot") or {}
          assert (price.get("KOSPI") or {}).get("price") is not None, price
          assert (price.get("선물") or {}).get("price") is not None, price
          assert d.get("backfill_rows") is not None, d
          snap=d.get("last_flow_snapshot") or {}
          assert snap.get("현물") is not None, snap
          assert snap.get("선물") is not None, snap
          assert snap.get("프로그램") is not None, snap
          pgm=snap["프로그램"]
          assert all(k in pgm for k in ("전체","차익","비차익","베이시스","표본시차초","차익비차익합","전체대비차이")), pgm
          assert snap.get("sample_span_sec") is not None and snap["sample_span_sec"] < 30, snap
          assert pgm.get("표본시차초") is not None and pgm["표본시차초"] <= 5.0, pgm
          print("ls_rest_runtime_valid=true", price, "backfill_rows=", d.get("backfill_rows"),
                "flow_sample_span_sec=", round(snap.get("sample_span_sec"), 3),
                "program_sample_span_sec=", round(pgm.get("표본시차초"), 3),
                "program_identity_gap=", pgm.get("전체대비차이"), "program=", pgm)
          PY

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kospi-derivatives-ci-${{ github.run_id }}
          path: |
            out/kospi_shock_episode_status.md
            out/kospi_shock_episode_raw.json
          if-no-files-found: ignore
          retention-days: 7
