name: KOSPI Derivatives Flow CI

on:
  schedule:
    - cron: "5 9 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "10 10 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "25 12 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "25 15 * * 1-5"
      timezone: "Asia/Seoul"
  push:
    branches: [main]
    paths:
      - ".github/workflows/kospi-derivatives-flow-ls-ci.yml"
      - ".github/workflows/kospi-derivatives-flow-ls-realtime.yml"
      - ".github/workflows/korea-market-stress-telegram-watch.yml"
      - "scripts/kospi_shock_episode_watch.py"
      - "scripts/kospi_shock_enrichment.py"
      - "scripts/test_kospi_shock_episode.py"
      - "scripts/test_kospi_shock_enrichment.py"
      - "scripts/kospi_flow_attribution_ls.py"
      - "scripts/test_kospi_flow_attribution_strict.py"
      - "scripts/kospi_rapid_fallback_watch.py"
      - "scripts/ls_unified_flow_probe.py"
      - "scripts/kospi_unified_industry_collector.py"
      - "scripts/krx_session_calendar.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: kospi-derivatives-flow-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
      LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
      LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests ebest exchange_calendars pyyaml

      - name: Compile
        run: |
          python -m py_compile             scripts/kospi_shock_episode_watch.py             scripts/kospi_shock_enrichment.py             scripts/kospi_unified_industry_collector.py             scripts/krx_session_calendar.py             scripts/test_kospi_shock_episode.py             scripts/test_kospi_shock_enrichment.py             scripts/kospi_flow_attribution_ls.py             scripts/test_kospi_flow_attribution_strict.py             scripts/kospi_rapid_fallback_watch.py

      - name: Run regression tests
        run: |
          python scripts/test_kospi_shock_episode.py
          python scripts/test_kospi_shock_enrichment.py
          python scripts/test_kospi_flow_attribution_strict.py

      - name: Verify failure notifier syntax and independent handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          ci=yaml.safe_load(Path(".github/workflows/kospi-derivatives-flow-ls-ci.yml").read_text(encoding="utf-8"))
          jobs=ci["jobs"]
          alert=jobs["daily_failure_alert"]
          producer=jobs["handoff_producer"]
          consumer=jobs["handoff_consumer"]
          assert "needs" not in producer, "handoff producer must execute despite test failure"
          assert consumer.get("needs")=="handoff_producer", "handoff consumer dependency changed"
          assert alert.get("needs")==["test","handoff_producer","handoff_consumer"]
          assert "GH_TOKEN" in alert.get("env",{}), "failure notifier cannot fetch failed step"
          run=alert["steps"][0]["run"]
          prefix="python - <<'PY'\n"
          assert prefix in run and run.rstrip().endswith("\nPY"), "failure notifier python heredoc missing"
          script=run.split(prefix,1)[1].rsplit("\nPY",1)[0]
          compile(script,"ci_failure_notifier_embedded.py","exec")
          assert "CI 실패는 실시간 시장감시 중단" in script
          assert "실패 단계:" in script and "message_id" in script
          print("ci_failure_alert_syntax_valid=true independent_handoff=true")
          PY

      - name: Verify XKRX session calendar
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime as dt
          from krx_session_calendar import session_bounds, is_session_day

          assert not is_session_day(dt.date(2026,10,5)), "Chuseok holiday must be closed"
          assert is_session_day(dt.date(2026,10,6)), "2026-10-06 must be an XKRX session"
          assert not is_session_day(dt.date(2026,10,9)), "2026-10-09 Hangul Day must be closed"
          assert is_session_day(dt.date(2026,10,12)), "2026-10-12 next session must be open"
          assert not is_session_day(dt.date(2026,5,1)), "Labor Day must be closed"
          assert not is_session_day(dt.date(2026,12,31)), "year-end closure must be closed"
          normal_bounds=session_bounds(dt.date(2026,10,7))
          assert normal_bounds is not None, "2026-10-07 session missing"
          normal_open,_=normal_bounds
          probe=dt.datetime(2026,10,7,8,18,tzinfo=normal_open.tzinfo)
          assert normal_open-dt.timedelta(minutes=60) <= probe < normal_open, (normal_open,probe)
          print("xkrx_preopen_watchdog_window_valid=true", "open=",normal_open.isoformat(), "probe=",probe.isoformat())
          bounds=session_bounds(dt.date(2026,1,2))
          assert bounds is not None, "2026 first trading day missing"
          open_dt, close_dt=bounds
          assert (open_dt.hour,open_dt.minute)==(10,0), open_dt
          assert (close_dt.hour,close_dt.minute)==(15,30), close_dt
          print("xkrx_session_calendar_valid=true",
                "2026-01-02-open=",open_dt.isoformat(),
                "close=",close_dt.isoformat())
          PY

      - name: Select market-hours live validation
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo
          from krx_session_calendar import session_state
          now=dt.datetime.now(ZoneInfo("Asia/Seoul"))
          session=session_state(now)
          # 실시간 가격·체결·수급 정합성 시험은 실제 정규장 시간에만 의미가 있다.
          live=bool(
              session["is_session"] and session["open"] is not None
              and session["close"] is not None
              and session["open"] <= now <= session["close"]
          )
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as out:
              out.write(f"KOSPI_SKIP_LIVE_TESTS={'0' if live else '1'}\n")
          print(f"kospi_live_ci_gate=true date={now.date()} live={live} skipped={not live}")
          PY

      - name: Verify production workflow structure
        run: |
          python - <<'PY'
          import datetime as dt
          from pathlib import Path
          p=Path(".github/workflows/kospi-derivatives-flow-ls-realtime.yml")
          s=p.read_text(encoding="utf-8")
          bad = "\\" + "$" + "{{"
          assert bad not in s, "escaped GitHub expression found"
          assert "morning:" in s and "afternoon:" in s, "split jobs missing"
          # workflow_run의 기본 checkout은 시작 당시 SHA를 사용한다.
          # 오전/오후 작업 모두 main을 명시해야 새 판정 로직이 다음 실행에서 누락되지 않는다.
          morning_block=s.split("  morning:\n",1)[1].split("  afternoon:\n",1)[0]
          afternoon_block=s.split("  afternoon:\n",1)[1]
          checkout_latest="      - name: Checkout\n        uses: actions/checkout@v4\n        with:\n          ref: main"
          assert checkout_latest in morning_block, "morning still checks out stale workflow_run SHA"
          assert checkout_latest in afternoon_block, "afternoon still checks out stale workflow_run SHA"
          print("kospi_shift_checkout_latest_main_valid=true")
          assert "--handoff-out out/kospi_shock_handoff.json" in s, "morning handoff missing"
          assert "--handoff-in out/kospi_shock_handoff.json" in s, "afternoon handoff missing"
          assert "timeout-minutes: 430" not in s, "GitHub-hosted 6h limit unsafe timeout remains"
          assert "timeout-minutes: 300" in s, "morning preopen coverage timeout missing"
          # workflow_run 경로는 정규장 60분 전(08:00)부터 production이 될 수 있으므로
          # 08:03 정규 schedule보다 더 이른 실제 최악 조건으로 검산한다.
          earliest=dt.datetime(2026,10,7,8,0)
          handoff_end=dt.datetime(2026,10,7,12,15)
          required_minutes=int((handoff_end-earliest).total_seconds()/60)
          assert 300 >= required_minutes + 30, (required_minutes,300)
          print("morning_preopen_timeout_valid=true", "required_minutes=",required_minutes, "timeout_minutes=300", "safety_margin_minutes=",300-required_minutes)
          assert "actions/download-artifact@v4" in s, "handoff artifact download missing"
          assert "kospi_unified_industry_collector.py" in s, "UBM industry collector missing"
          assert "out/kospi_industry_flow.jsonl" in s, "UBM industry flow handoff missing"
          assert "requests ebest" in s, "production ebest dependency missing"
          assert "collector_supervisor()" in s, "UBM collector supervisor missing"
          assert "kospi_watcher_restart" in s, "KOSPI watcher restart loop missing"
          assert "WATCH_FAILS" in s, "KOSPI watcher failure counter missing"
          assert 'WATCH_FAILS" -ge 5' not in s, "KOSPI shift still exits after five transient failures"
          assert "kospi_watcher_retrying" in s, "KOSPI retry-through-shift loop missing"
          assert "timeout-minutes: 359" in s, "afternoon close coverage timeout missing"
          assert "--until 15:32" in s, "KOSPI closing-auction coverage missing"
          assert "date +%H%M)\" -lt 1532" in s, "shift supervisor does not run through closing auction"
          assert 'cron: "3,13,23,33,43,53 8 * * 1-5"' in s, "preopen KOSPI retry schedule missing"
          assert 'cron: "3,13,23,33,43,53 9-14 * * 1-5"' in s, "intraday KOSPI self-recovery schedule missing"
          assert 'cron: "3,13,23 15 * * 1-5"' in s, "late-session KOSPI recovery schedule missing"
          # 독립 UTC 예약이 KST 일자에 맞춰 열리는지 검증: 한국 월요일 오전 8시는 UTC 일요일 밤 11시.
          assert 'cron: "6,26,46 23 * * 0-4"' in s, "UTC 08 KST fallback missing"
          assert 'cron: "6,26,46 0-5 * * 1-5"' in s, "UTC intraday fallback missing"
          assert 'cron: "6,26 6 * * 1-5"' in s, "UTC closing fallback missing"
          from zoneinfo import ZoneInfo
          mon_local=dt.datetime(2026,10,12,8,6,tzinfo=ZoneInfo("Asia/Seoul"))
          utc=mon_local.astimezone(ZoneInfo("UTC"))
          assert (utc.weekday(),utc.hour,utc.minute)==(6,23,6), utc
          print("utc_kospi_preopen_schedule_valid=true",utc.isoformat(),mon_local.isoformat())
          assert "workflow_run:" in s and "Wonyotti 90D Thesis Telegram Watch" in s, "event-driven KOSPI fallback missing"
          assert "Korea Market Stress and Global Wave Telegram Watch" in s, "independent KOSPI preopen fallback missing"
          assert "GAMEJOA preopen news radar" in s, "GAMEJOA preopen event fallback missing"
          assert 'session["open"]-dt.timedelta(minutes=60) <= now' in s, "KOSPI gate must be eligible one hour before open"
          assert "코스피 급락 감시 공백 감지·자동 복구" in s, "late-start Telegram gap alert missing"
          assert "kospi_gap_recovery_alert=true" in s, "gap-recovery delivery audit missing"
          assert "production_jobs" in s and "age_minutes<=3" in s, "job-level KOSPI leader health gate missing"
          assert "startup_leader" in s and "startup_candidates.sort" in s, "simultaneous KOSPI starter election missing"
          assert "session_state" in s and "session[\"close\"]+dt.timedelta(minutes=2)" in s, "KOSPI gate does not follow XKRX close"
          collector=Path("scripts/kospi_unified_industry_collector.py").read_text(encoding="utf-8")
          assert "UBM feed stale >120s during market hours" in collector, "UBM stale-feed restart guard missing"
          assert 'session["continuous_end"]' in collector, "UBM stale guard does not follow XKRX continuous-session end"
          assert "continuous_market_hours" in collector, "UBM closing-auction test semantics missing"
          assert "session_state" in collector, "UBM collector does not use XKRX session calendar"
          watcher=Path("scripts/kospi_shock_episode_watch.py").read_text(encoding="utf-8")
          assert "session_state" in watcher and "XKRX non-session day" in watcher, "KOSPI watcher does not use XKRX session calendar"
          assert "price_only_start" in watcher and "수급 원인 보류" in watcher, "monitoring-gap price shock fallback missing"
          assert "OPEN_GAP_ALERT_PCT = -1.0" in watcher and "코스피 개장 갭다운" in watcher, "opening gap-down alert missing"
          assert "exchange_calendars" in s, "production XKRX calendar dependency missing"
          assert '"ts": received_ts' in collector, "UBM event alignment must use payload receive time"
          assert '"source_ts": source_ts' in collector, "UBM source time must be preserved separately"
          assert "received_ts - prev_received < 5.0" in collector, "UBM duplicate-burst suppression missing"
          enrichment=Path("scripts/kospi_shock_enrichment.py").read_text(encoding="utf-8")
          assert "requests.RequestException" in enrichment and "transport error" in enrichment, "enrichment LS transport retry missing"
          print("production_workflow_structure_valid=true")
          PY

      - name: Verify redundant fallback and recovery semantics
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import kospi_rapid_fallback_watch as fb

          korea = pathlib.Path(".github/workflows/korea-market-stress-telegram-watch.yml").read_text(encoding="utf-8")
          assert 'cron: "4 9 * * 1-5"' in korea and 'timezone: "Asia/Seoul"' in korea, "09:04 KST fallback schedule missing"
          assert "startup_unverified fallback_kept_active" in korea, "unverified startup must not suppress fallback"
          assert "production_unverified_fallback_enabled" in korea, "dispatch without production verification must leave fallback enabled"
          assert "kospi_realtime_watchdog=verified_production" in korea, "recovery must verify real production job"
          assert "deadline=time.time()+90" in korea, "post-dispatch production verification window missing"
          assert 'KOSPI_REALTIME_WATCH_ACTIVE=0' in korea, "fallback-safe inactive state missing"
          # '평일 09시'가 한국거래소 개장이라는 추정을 금지한다.
          from datetime import datetime
          from zoneinfo import ZoneInfo
          tz=ZoneInfo("Asia/Seoul")
          assert not fb.live_trading_window(datetime(2026,10,9,9,30,tzinfo=tz)), "Hangul Day must not alert"
          assert fb.live_trading_window(datetime(2026,10,12,9,30,tzinfo=tz)), "normal trading day missing"
          assert not fb.live_trading_window(datetime(2026,10,12,15,31,tzinfo=tz)), "post-close stale alert"
          assert not fb.live_trading_window(datetime(2026,1,2,9,30,tzinfo=tz)), "delayed new-year opening"
          assert fb.live_trading_window(datetime(2026,1,2,10,1,tzinfo=tz)), "delayed new-year open"
          print("kospi_fallback_krx_holiday_guard_valid=true")
          print("redundant_recovery_structure_valid=true")

          # 2026-10-07 실데이터 조건: 종가 6,803.90, 일간 -1.98%, 시가 6,864.25.
          # 전일종가를 역산해 -1% 이하 개장 갭다운을 독립 fallback도 검출하는지 확인한다.
          sample = {
              "closePrice": 6803.90,
              "openPrice": 6864.25,
              "highPrice": 6977.77,
              "fluctuationsRatio": -1.98,
          }
          prev = fb.get_prev_close(sample)
          gap = fb.opening_gap_pct(sample)
          assert prev is not None and 6940.0 < prev < 6943.0, (prev, sample)
          assert gap is not None and -1.20 < gap < -1.00, gap
          assert gap <= fb.OPEN_GAP_ALERT_PCT, (gap, fb.OPEN_GAP_ALERT_PCT)
          state = fb.load_state("2099-01-01")
          assert state.get("sent_open_gap") is False, state
          print("rapid_fallback_opening_gap_valid=true", "prev_close=", round(prev,2), "open_gap=", round(gap,2))

          # fallback Telegram도 일시 네트워크 장애 후 재시도해 실제 성공 응답의 message_id만 인정한다.
          orig_urlopen = fb.urllib.request.urlopen
          orig_sleep = fb.time.sleep
          env = os.environ
          old_env = {k: env.get(k) for k in (
              "DERIV_TELEGRAM_BOT_TOKEN", "DERIV_TELEGRAM_CHAT_ID",
              "DERIV_EXPECTED_TELEGRAM_BOT_USERNAME",
          )}
          calls = {"send": 0}
          class Dummy:
              def __init__(self,obj): self.payload=json.dumps(obj).encode("utf-8")
              def __enter__(self): return self
              def __exit__(self,*args): return False
              def read(self): return self.payload
          def flaky(req, timeout=0):
              url = req if isinstance(req,str) else req.full_url
              if "/getMe" in url:
                  return Dummy({"ok":True,"result":{"username":"khs887900887900008879_bot"}})
              if "/sendMessage" in url:
                  calls["send"] += 1
                  if calls["send"] < 3:
                      raise urllib.error.URLError("synthetic disconnect")
                  return Dummy({"ok":True,"result":{"message_id":778}})
              raise AssertionError(url)
          try:
              env["DERIV_TELEGRAM_BOT_TOKEN"]="token"
              env["DERIV_TELEGRAM_CHAT_ID"]="chat"
              env["DERIV_EXPECTED_TELEGRAM_BOT_USERNAME"]="khs887900887900008879_bot"
              fb.urllib.request.urlopen=flaky
              fb.time.sleep=lambda *_args,**_kwargs: None
              assert fb.telegram_send("test") == 778
              assert calls["send"] == 3, calls
          finally:
              fb.urllib.request.urlopen=orig_urlopen
              fb.time.sleep=orig_sleep
              for k,v in old_env.items():
                  if v is None: env.pop(k,None)
                  else: env[k]=v
          print("rapid_fallback_telegram_retry_valid=true")
          PY

      - name: Verify production completion audit and embedded Python
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          try:
              import yaml
          except ImportError as exc:
              raise RuntimeError("PyYAML required to verify GitHub workflow syntax") from exc
          workflow=Path(".github/workflows/kospi-derivatives-flow-ls-realtime.yml")
          doc=yaml.safe_load(workflow.read_text(encoding="utf-8"))
          assert isinstance(doc,dict) and "jobs" in doc and "gate" in doc["jobs"], "invalid workflow YAML"
          for name in ("morning","afternoon"):
              job=doc["jobs"][name]
              run_block=next(step["run"] for step in job["steps"] if
                             step.get("name","").startswith("Run "+name+" KOSPI watcher") or
                             (name=="afternoon" and step.get("name")=="Run afternoon KOSPI watcher with handoff"))
              for marker in (
                  "WATCH_SUCCESS=0",
                  'if [ "$WATCH_SUCCESS" -ne 1 ]; then',
                  "kospi_production_delivery_integrity_valid=true",
                  "KOSPI ticks missing",
                  "KOSPI futures ticks missing",
                  "KOSPI handoff missing",
              ):
                  assert marker in run_block, f"{name}: production completion evidence missing: {marker}"
          count=0
          for name,job in doc["jobs"].items():
              for step in job.get("steps",[]):
                  run=step.get("run") or ""
                  for match in re.finditer(r"(?ms)^python - <<'PY'\n(.*?)^PY\s*$",run):
                      compile(match.group(1), f"{name}:{step.get('name')}", "exec")
                      count+=1
          assert count>=5, f"embedded Python blocks not verified: {count}"
          print("kospi_production_integrity_structure_valid=true embedded_blocks=",count)
          PY

      - name: Verify production leader election API
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, time, urllib.request
          from zoneinfo import ZoneInfo

          repo=os.environ["REPOSITORY"]
          headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                   "Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          url=f"https://api.github.com/repos/{repo}/actions/workflows/kospi-derivatives-flow-ls-realtime.yml/runs?per_page=50"
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as r:
              runs=json.loads(r.read().decode("utf-8")).get("workflow_runs",[])
          today=dt.datetime.now(ZoneInfo("Asia/Seoul")).date()
          active=[]
          for run in runs:
              if run.get("status") not in {"queued","in_progress"}:
                  continue
              created=dt.datetime.fromisoformat(run["created_at"].replace("Z","+00:00")).astimezone(ZoneInfo("Asia/Seoul"))
              if created.date()==today:
                  active.append((created,int(run["id"]),run.get("status")))
          active.sort()
          running=[x for x in active if x[2]=="in_progress"]
          queued=[x for x in active if x[2]=="queued"]
          leader=(running[0] if running else (queued[0] if queued else None))

          production_jobs=[]
          for _, run_id, _ in active:
              jobs_url=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
              try:
                  with urllib.request.urlopen(urllib.request.Request(jobs_url,headers=headers),timeout=20) as r:
                      jobs=json.loads(r.read().decode("utf-8")).get("jobs",[])
              except Exception:
                  jobs=[]
              for job in jobs:
                  if str(job.get("name") or "") in {"watch","morning","afternoon"} and job.get("status") in {"queued","in_progress"}:
                      production_jobs.append((run_id,job.get("name"),job.get("status")))

          now=dt.datetime.now(ZoneInfo("Asia/Seoul"))
          scheduled=os.environ.get("EVENT_NAME")=="schedule"
          import sys
          sys.path.insert(0,"scripts")
          from krx_session_calendar import session_state
          session=session_state(now)
          should_be_live=bool(
              scheduled
              and session["is_session"]
              and session["open"] is not None
              and session["close"] is not None
              and session["open"] <= now <= session["close"]+dt.timedelta(minutes=2)
          )
          if should_be_live and not production_jobs:
              body=json.dumps({"ref":"main","inputs":{"mode":"production"}}).encode("utf-8")
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/workflows/kospi-derivatives-flow-ls-realtime.yml/dispatches",
                  data=body,
                  headers={**headers,"Content-Type":"application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req,timeout=20) as r:
                  print(f"scheduled_live_recovery_dispatch=true status={r.status}")

              # 복구 dispatch 자체가 성공한 것과 실제 production job 기동은 구분한다.
              # 최대 90초 동안 새 run의 morning/afternoon job이 queued/in_progress가 되는지 확인한다.
              recovery_deadline=time.time()+90
              recovered=[]
              while time.time() < recovery_deadline and not recovered:
                  time.sleep(5)
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as r:
                      recovery_runs=json.loads(r.read().decode("utf-8")).get("workflow_runs",[])
                  for run in recovery_runs:
                      if run.get("status") not in {"queued","in_progress"}:
                          continue
                      created=dt.datetime.fromisoformat(run["created_at"].replace("Z","+00:00")).astimezone(ZoneInfo("Asia/Seoul"))
                      if created.date()!=today:
                          continue
                      run_id=int(run["id"])
                      jobs_url=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
                      try:
                          with urllib.request.urlopen(urllib.request.Request(jobs_url,headers=headers),timeout=20) as r:
                              jobs=json.loads(r.read().decode("utf-8")).get("jobs",[])
                      except Exception:
                          continue
                      for job in jobs:
                          if str(job.get("name") or "") in {"morning","afternoon"} and job.get("status") in {"queued","in_progress"}:
                              recovered.append((run_id,job.get("name"),job.get("status")))
                  if recovered:
                      break
              if not recovered:
                  raise AssertionError(
                      f"scheduled live validation found no active production job after recovery dispatch; active={active}"
                  )
              production_jobs.extend(recovered)
              print(f"scheduled_live_recovery_verified=true production_jobs={recovered}")
          print(
              f"leader_election_api_valid=true active={[(x[1],x[2]) for x in active]} "
              f"leader={leader[1] if leader else None} production_jobs={production_jobs} "
              f"scheduled_live_required={should_be_live}"
          )
          PY

      - name: Verify LS REST prices and flow snapshot
        if: env.KOSPI_SKIP_LIVE_TESTS != '1'
        run: |
          rm -f out/kospi_shock_episode_status.md out/kospi_shock_episode_raw.json
          python scripts/kospi_shock_episode_watch.py --test --test-seconds 45
          python - <<'PY'
          import json
          d=json.load(open("out/kospi_shock_episode_raw.json", encoding="utf-8"))
          assert d.get("test_mode_notification_suppressed") is True, "live API --test must never send Telegram"
          print("kospi_live_probe_send_suppressed=true")
          price=d.get("last_price_snapshot") or {}
          assert (price.get("KOSPI") or {}).get("price") is not None, price
          assert (price.get("선물") or {}).get("price") is not None, price
          assert d.get("backfill_rows") is not None, d
          snap=d.get("last_flow_snapshot") or {}
          assert snap.get("현물") is not None, snap
          assert snap.get("선물") is not None, snap
          assert snap.get("프로그램") is not None, snap
          pgm=snap["프로그램"]
          assert all(k in pgm for k in ("전체","차익","비차익","베이시스","표본시차초","차익비차익합","전체대비차이")), pgm
          assert snap.get("sample_span_sec") is not None and snap["sample_span_sec"] < 45, snap
          assert pgm.get("표본시차초") is not None, pgm
          within_quality=float(pgm.get("표본시차초")) <= 8.0
          print("ls_rest_runtime_valid=true", price, "backfill_rows=", d.get("backfill_rows"),
                "flow_sample_span_sec=", round(snap.get("sample_span_sec"), 3),
                "program_sample_span_sec=", round(pgm.get("표본시차초"), 3),
                "program_high_confidence_eligible=", within_quality,
                "program_identity_gap=", pgm.get("전체대비차이"), "program=", pgm)
          PY

      - name: Inspect last completed KRX session chart outside trading hours
        if: env.KOSPI_SKIP_LIVE_TESTS == '1'
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime as dt
          from zoneinfo import ZoneInfo
          from krx_session_calendar import is_session_day
          from kospi_shock_enrichment import (
              get_token, fetch_stock_bars, select_stock_chart_probe_window,
          )
          KST=ZoneInfo("Asia/Seoul")
          now=dt.datetime.now(KST)
          today=now.date()
          # 거래일 장 마감 후라면 오늘 세션, 휴장일·개장 전이라면 직전 세션을 선택.
          from krx_session_calendar import session_state
          session=session_state(now)
          finished=bool(session["is_session"] and session["close"] is not None and now>session["close"])
          previous=today if finished else today-dt.timedelta(days=1)
          for _ in range(14):
              if is_session_day(previous):
                  break
              previous-=dt.timedelta(days=1)
          else:
              print("holiday_history_probe=skipped previous_session_unknown")
              raise SystemExit(0)
          asof=dt.datetime.combine(previous,dt.time(22,47),tzinfo=KST)
          try:
              bars=fetch_stock_bars(get_token(),"005930","U")
              window=select_stock_chart_probe_window(bars,asof)
              valid_dates=sorted({str(x.get("date") or "") for x in bars})
              tail=[(x.get("date"),x.get("time")) for x in bars[-5:]]
              print("holiday_history_probe_result=", {
                  "previous_session":str(previous),
                  "row_count":len(bars),
                  "source_dates":valid_dates[-5:],
                  "latest_rows":tail,
                  "window":window,
              })
              # 장애 발생 직후 첫 휴장일 1회만 실제 역사 구간 정밀분해도 점검한다.
              # 이 시험은 모의 시장 주체를 쓰므로 실전 매도주체 검증으로 취급하지 않는다.
              if today==dt.date(2026,10,9):
                  from kospi_shock_enrichment import run_smoke
                  try:
                      detail=run_smoke(get_token())
                      print("holiday_full_enrichment_replay_valid=true",
                            "stock_program=",detail.get("stock_program_available"),
                            "stock_price=",detail.get("stock_price_available"),
                            "industry_count=",detail.get("industry_count"),
                            "etf_price=",detail.get("etf_price_available"),
                            "errors=",len(detail.get("errors") or []))
                  except Exception as smoke_exc:
                      print(f"holiday_full_enrichment_replay_unavailable={type(smoke_exc).__name__}: {smoke_exc}")
          except Exception as exc:
              # 휴장일의 외부 API 접속 불가를 생산 감시 실패로 승격하지 않는다.
              print(f"holiday_history_probe_unavailable={type(exc).__name__}: {exc}")
          PY

      - name: Verify integrated sector/theme/stock/ETF enrichment APIs
        if: env.KOSPI_SKIP_LIVE_TESTS != '1'
        run: |
          rm -f out/kospi_shock_enrichment_probe.json
          python scripts/kospi_shock_enrichment.py --probe
          python - <<'PY'
          import json
          d=json.load(open("out/kospi_shock_enrichment_probe.json", encoding="utf-8"))
          assert d.get("master_count", 0) > 0, d
          assert d.get("industry_count", 0) > 0, d
          assert d.get("program_rank_count", 0) > 0, d
          assert (d.get("samsung_integrated_price") or {}).get("available") is True, d
          assert (d.get("etf_pdf_probe") or {}).get("available") is True, d
          print("kospi_enrichment_api_valid=true",
                "stocks=", d.get("master_count"),
                "industries=", d.get("industry_count"),
                "program_candidates=", d.get("program_rank_count"),
                "etf_count=", d.get("etf_count"),
                "etf_pdf_probe=", d.get("etf_pdf_probe"))
          PY

      - name: Verify full event enrichment path
        if: env.KOSPI_SKIP_LIVE_TESTS != '1'
        run: |
          rm -f out/kospi_shock_enrichment_latest.json
          python scripts/kospi_shock_enrichment.py --smoke
          python - <<'PY'
          import json
          d=json.load(open("out/kospi_shock_enrichment_latest.json", encoding="utf-8"))
          assert len(d.get("stocks") or []) > 0, d
          assert len(d.get("themes") or []) > 0, d
          assert len(d.get("industries") or []) > 0, d
          assert any((x.get("price") or {}).get("available") for x in (d.get("etfs") or [])), d
          print("kospi_full_enrichment_valid=true",
                "stocks=", len(d.get("stocks") or []),
                "themes=", len(d.get("themes") or []),
                "industries=", len(d.get("industries") or []),
                "etfs=", len(d.get("etfs") or []),
                "errors=", len(d.get("errors") or []))
          PY

      - name: Probe unified KRX+NXT realtime flow
        if: env.KOSPI_SKIP_LIVE_TESTS != '1'
        run: |
          rm -f out/ls_unified_flow_probe.json
          python -m py_compile scripts/ls_unified_flow_probe.py
          python scripts/ls_unified_flow_probe.py

      - name: Verify live unified industry collector
        if: env.KOSPI_SKIP_LIVE_TESTS != '1'
        run: |
          rm -f out/kospi_industry_flow_ci.jsonl
          DAY=$(TZ=Asia/Seoul date +%u)
          HM=$(TZ=Asia/Seoul date +%H%M)
          if [ "$DAY" -le 5 ] && [ "$HM" -ge 0900 ] && [ "$HM" -le 1520 ]; then
            TEST_SECONDS=90
          else
            TEST_SECONDS=10
          fi
          python scripts/kospi_unified_industry_collector.py --test-seconds "$TEST_SECONDS" --out out/kospi_industry_flow_ci.jsonl
          python - <<'PY'
          import datetime as dt, json, pathlib
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(ZoneInfo("Asia/Seoul"))
          import sys
          sys.path.insert(0,"scripts")
          from krx_session_calendar import session_state
          session=session_state(now)
          market_hours=bool(
              session["is_session"]
              and session["open"] is not None
              and session["continuous_end"] is not None
              and session["open"] <= now < session["continuous_end"]
          )
          p=pathlib.Path("out/kospi_industry_flow_ci.jsonl")
          rows=[]
          if p.exists():
              for line in p.read_text(encoding="utf-8").splitlines():
                  line=line.strip()
                  if line:
                      rows.append(json.loads(line))
          if market_hours:
              assert rows, "No UBM collector records during market hours"
              investors={str(x.get("investor") or "") for x in rows}
              industries={str(x.get("upcode") or "") for x in rows}
              assert investors & {"개인","외국인","기관"}, investors
              assert industries, industries

              # 실시간 UBM 원자료가 실제 정밀분해 함수까지 연결되는지 같은 파일로 검증한다.
              import sys
              sys.path.insert(0, "scripts")
              from kospi_shock_enrichment import direct_industry_interval
              by_actor={}
              for actor in sorted(investors & {"개인","외국인","기관"}):
                  actor_rows=[x for x in rows if str(x.get("investor") or "")==actor]
                  if len(actor_rows)<2:
                      continue
                  ts_vals=sorted(float(x["ts"]) for x in actor_rows if x.get("ts") is not None)
                  if len(ts_vals)<2:
                      continue
                  start_ts=ts_vals[max(0, len(ts_vals)//4)]
                  end_ts=ts_vals[-1]
                  block=direct_industry_interval(
                      start_ts, end_ts, actor,
                      pathlib.Path("out/kospi_industry_flow_ci.jsonl"),
                      max_gap_sec=180.0,
                  )
                  by_actor[actor]=block
              assert any((x or {}).get("available") for x in by_actor.values()), by_actor
              print("unified_industry_collector_valid=true",
                    "records=",len(rows),
                    "investors=",sorted(investors),
                    "industries=",len(industries),
                    "direct_parser_actors=",
                    {k: len((v or {}).get("rows") or []) for k,v in by_actor.items()},
                    "market_hours=true")
          else:
              print("unified_industry_collector_registration_valid=true",
                    "records=",len(rows),
                    "market_hours=false")
          PY

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kospi-derivatives-ci-${{ github.run_id }}
          path: |
            out/kospi_shock_episode_status.md
            out/kospi_shock_episode_raw.json
            out/ls_unified_flow_probe.json
            out/kospi_shock_enrichment_probe.json
            out/kospi_shock_enrichment_latest.json
            out/kospi_industry_flow_ci.jsonl
          if-no-files-found: ignore
          retention-days: 7


  handoff_producer:
    # 외부 API 검증 실패와 독립적으로 상태 인계 시험을 끝까지 실행한다.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests exchange_calendars
      - name: Create production-format handoff
        run: |
          mkdir -p out
          PYTHONPATH=scripts python - <<'PY'
          import time
          from collections import deque
          from kospi_shock_episode_watch import Watch
          w=Watch("dummy", [], "dummy", True)
          now=time.time()
          w.flows.append({
              "ts": now-5,
              "현물": {"외국인": -10.0, "기관": -20.0, "개인": 30.0},
              "선물": {"외국인": -40.0, "기관": 10.0, "개인": 30.0},
              "프로그램": {
                  "전체": -50.0, "차익": -10.0, "비차익": -40.0,
                  "베이시스": 0.0, "sample_ts": now-5,
              },
          })
          w.episode={
              "start_ts": now-120,
              "start_price": 7000.0,
              "low_ts": now-10,
              "low_price": 6960.0,
              "sent_drop": 0.57,
              "alerted": True,
          }
          w.msg_ids=[901]
          w.save_handoff("out/kospi_shock_handoff_ci.json")
          print("handoff_producer_valid=true")
          PY
      - name: Upload handoff
        uses: actions/upload-artifact@v4
        with:
          name: kospi-handoff-ci-${{ github.run_id }}
          path: out/kospi_shock_handoff_ci.json
          retention-days: 1

  handoff_consumer:
    needs: handoff_producer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download handoff
        uses: actions/download-artifact@v4
        with:
          name: kospi-handoff-ci-${{ github.run_id }}
          path: out
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests exchange_calendars
      - name: Verify production-format handoff after artifact transfer
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from kospi_shock_episode_watch import Watch
          w=Watch("dummy", [], "dummy", True)
          w.load_handoff("out/kospi_shock_handoff_ci.json")
          assert len(w.flows)==1, len(w.flows)
          assert w.episode and w.episode["start_price"]==7000.0, w.episode
          assert 901 in w.msg_ids, w.msg_ids
          print("handoff_artifact_transfer_valid=true")
          PY


  daily_failure_alert:
    needs: [test, handoff_producer, handoff_consumer]
    if: always() && github.event_name == 'schedule' && (needs.test.result != 'success' || needs.handoff_producer.result != 'success' || needs.handoff_consumer.result != 'success')
    runs-on: ubuntu-latest
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      CI_TEST_RESULT: ${{ needs.test.result }}
      CI_HANDOFF_PRODUCER_RESULT: ${{ needs.handoff_producer.result }}
      CI_HANDOFF_CONSUMER_RESULT: ${{ needs.handoff_consumer.result }}
    steps:
      - name: Send precise KOSPI validation failure alert
        run: |
          python - <<'PY'
          import datetime as dt
          import json, os, time, urllib.error, urllib.parse, urllib.request
          from zoneinfo import ZoneInfo

          token=(os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id=(os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected=(os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          repo=os.environ["GITHUB_REPOSITORY"]
          run_id=os.environ["GITHUB_RUN_ID"]
          url=f"https://github.com/{repo}/actions/runs/{run_id}"
          if not token or not chat_id:
              raise RuntimeError("Telegram secrets missing")

          # 테스트 job의 세부 단계가 실패했는지 직접 확인한다.
          failures=[]
          api_problem=""
          headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                   "Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          try:
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100",
                  headers=headers,
              )
              with urllib.request.urlopen(req,timeout=20) as r:
                  jobs=json.loads(r.read().decode("utf-8")).get("jobs",[])
              for job in jobs:
                  if job.get("conclusion")!="failure":
                      continue
                  steps=[str(x.get("name") or "") for x in (job.get("steps") or [])
                         if x.get("conclusion")=="failure"]
                  failures.extend([f"{job.get('name')}: {x}" for x in steps] or
                                  [str(job.get("name") or "실패 단계 확인 필요")])
          except Exception as exc:
              api_problem=f"{type(exc).__name__}: {exc}"
          if not failures:
              failures=["상세 단계 조회 불가 — GitHub 실행 로그 확인"]

          parts=("|".join(failures)).lower()
          if "integrated sector/theme/stock/etf" in parts:
              scope="종목·업종·ETF 정밀분해 자료 검증 실패"
          elif "ls rest prices" in parts or "unified" in parts:
              scope="시장 가격·수급 API 검증 실패"
          elif "handoff" in parts:
              scope="오전·오후 상태 인계 회귀시험 실패"
          else:
              scope="검증 CI 일부 단계 실패"
          when=dt.datetime.now(ZoneInfo("Asia/Seoul"))
          states=(f"시험 {os.getenv('CI_TEST_RESULT')} / "
                  f"인계 생성 {os.getenv('CI_HANDOFF_PRODUCER_RESULT')} / "
                  f"인계 복원 {os.getenv('CI_HANDOFF_CONSUMER_RESULT')}")
          text=(
              "🚨 코스피 급락 감시 검증 CI 실패\n"
              f"조회: {when:%Y-%m-%d %H:%M:%S} KST\n"
              f"범위: {scope}\n"
              f"실패 단계: {'; '.join(failures[:4])}\n"
              f"독립 결과: {states}\n"
              "주의: CI 실패는 실시간 시장감시 중단이나 Telegram 송출 실패와 동의어가 아닙니다.\n"
              f"실제 검증 기록: {url}"
          )
          if api_problem:
              print(f"validation_alert_job_lookup_warning={api_problem}")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe",timeout=20) as r:
              ident=json.loads(r.read().decode("utf-8"))
          actual=str((ident.get("result") or {}).get("username") or "")
          if not ident.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          payload=urllib.parse.urlencode({
              "chat_id":chat_id,"text":text,"disable_web_page_preview":"true",
          }).encode("utf-8")
          last_error=""
          for attempt in range(4):
              try:
                  req=urllib.request.Request(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data=payload,method="POST",
                  )
                  with urllib.request.urlopen(req,timeout=30) as r:
                      out=json.loads(r.read().decode("utf-8"))
                  message_id=(out.get("result") or {}).get("message_id")
                  if not out.get("ok") or not isinstance(message_id,int) or message_id<=0:
                      raise RuntimeError(f"Telegram rejected validation failure alert: {out}")
                  print(f"validation_failure_alert_sent=true message_id={message_id} scope={scope}")
                  break
              except urllib.error.HTTPError as exc:
                  last_error=f"Telegram HTTP {exc.code}"
                  if attempt>=3 or not (exc.code==429 or 500<=exc.code<=599):
                      raise
              except (urllib.error.URLError, TimeoutError, ConnectionError) as exc:
                  last_error=f"{type(exc).__name__}: {exc}"
                  if attempt>=3:
                      raise RuntimeError(last_error) from exc
              if attempt<3:
                  time.sleep(min(8,2**attempt))
          else:
              raise RuntimeError(last_error or "Validation Telegram send failed")
          PY
