name: KOSPI Derivatives Flow CI

on:
  schedule:
    - cron: "5 9 * * 1-5"
      timezone: "Asia/Seoul"
    # UTC 독립 예약: 09:05·10:10 KST 원예약 유실 시 11:17 KST 백업 검사.
    - cron: "17 2 * * 1-5"
    - cron: "10 10 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "25 12 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "25 15 * * 1-5"
      timezone: "Asia/Seoul"
  push:
    branches: [main]
    paths:
      - ".github/workflows/kospi-derivatives-flow-ls-ci.yml"
      - ".github/workflows/kospi-derivatives-flow-ls-realtime.yml"
      - ".github/workflows/korea-market-stress-telegram-watch.yml"
      - "scripts/kospi_shock_episode_watch.py"
      - "scripts/market_alert_delivery.py"
      - "scripts/test_market_alert_delivery.py"
      - "scripts/test_market_delivery_recovery.py"
      - "tests/fixtures/market_delivery_timeout_20261026.json"
      - ".github/workflows/market-alert-telegram-test.yml"
      - "scripts/kospi_shock_enrichment.py"
      - "scripts/test_kospi_shock_episode.py"
      - "scripts/test_kospi_shock_enrichment.py"
      - "scripts/kospi_flow_attribution_ls.py"
      - "scripts/test_kospi_flow_attribution_strict.py"
      - "scripts/kospi_rapid_fallback_watch.py"
      - "scripts/ls_unified_flow_probe.py"
      - "scripts/kospi_unified_industry_collector.py"
      - "scripts/kosdaq_surge_industries.py"
      - "scripts/test_kosdaq_surge_industries.py"
      - "scripts/probe_kosdaq_surge_industries.py"
      - "scripts/market_flow_channels.py"
      - "scripts/market_investors.py"
      - "scripts/test_market_investment_trust.py"
      - "scripts/test_market_financial_investment.py"
      - "tests/fixtures/market_financial_source_contract_20261026.json"
      - "scripts/market_program_close.py"
      - "scripts/test_market_program_close.py"
      - "scripts/test_market_close_pair.py"
      - "scripts/test_fixtures/market_close_pair_20261020.json"
      - "scripts/test_fixtures/program_close_readback_20261016.json"
      - "scripts/test_market_flow_channels.py"
      - "scripts/probe_market_flow_channels.py"
      - "scripts/krx_session_calendar.py"
  workflow_dispatch:
    inputs:
      run_live_source_probes:
        description: "Run one read-only LS source check only when the market is open and no other LS consumer is active"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  # 정기 실전검증은 코드수정(push)에 의해 취소되면 안 된다.
  # 같은 종류의 잦은 push 검증만 최신 실행으로 교체한다.
  group: kospi-derivatives-flow-ci-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.repository }}-ls-live-source-ci
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests ebest exchange_calendars pyyaml

      - name: Audit market alert destination without sending
        env:
          EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
          TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
          MARKET_ALERT_DELIVERY_DIR: out/market_alert_route_audit
        run: python scripts/market_alert_delivery.py --audit-route

      - name: Compile
        run: |
          python -m py_compile             scripts/kospi_shock_episode_watch.py             scripts/kospi_shock_enrichment.py             scripts/kospi_unified_industry_collector.py             scripts/krx_session_calendar.py             scripts/test_kospi_shock_episode.py             scripts/test_kospi_shock_enrichment.py             scripts/kospi_flow_attribution_ls.py             scripts/test_kospi_flow_attribution_strict.py             scripts/kospi_rapid_fallback_watch.py

      - name: Run regression tests
        run: |
          python -m py_compile scripts/market_program_close.py scripts/test_market_program_close.py scripts/ls_live_source_gate.py scripts/test_ls_live_source_gate.py
          python scripts/test_ls_live_source_gate.py
          python scripts/test_market_program_close.py
          python scripts/test_market_close_pair.py
          python scripts/test_market_alert_delivery.py
          python scripts/test_market_delivery_recovery.py
          python scripts/test_kospi_shock_episode.py
          python scripts/test_kospi_shock_enrichment.py
          python scripts/test_kospi_flow_attribution_strict.py
          python scripts/test_kosdaq_surge_industries.py
          python scripts/test_market_flow_channels.py
          python scripts/test_market_investment_trust.py
          python scripts/test_market_financial_investment.py

      - name: Verify KOSPI scheduled CI isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          ci=yaml.safe_load(Path(".github/workflows/kospi-derivatives-flow-ls-ci.yml").read_text(encoding="utf-8"))
          qd=yaml.safe_load(Path(".github/workflows/kosdaq-surge-industries-ci.yml").read_text(encoding="utf-8"))
          cc=ci.get("concurrency") or {}
          assert "github.event_name" in str(cc.get("group","")), "CI push/schedule share cancellation group"
          assert "github.event_name == 'push'" in str(cc.get("cancel-in-progress","")), "CI scheduled run may be cancelled by a new push"
          ci_on=ci.get("on") or ci.get(True) or {}
          ci_input=((ci_on.get("workflow_dispatch") or {}).get("inputs") or {}).get("run_live_source_probes") or {}
          assert ci_input.get("type")=="boolean" and ci_input.get("default") is False, ci_input
          ci_job=ci["jobs"]["test"]
          ci_group=(ci_job.get("concurrency") or {}).get("group")
          assert str(ci_group).endswith("-ls-live-source-ci"), ci_group
          assert not ({"LS_OPENAPI_APP_KEY","LS_OPENAPI_APP_SECRET","TELEGRAM_BOT_TOKEN"} & set(ci_job.get("env") or {})), "live credentials leak into every CI step"
          ci_steps=ci_job["steps"]
          ci_by_name={step.get("name"):step for step in ci_steps}
          live_steps=("Probe live KOSDAQ investor feed",
                      "Probe KOSDAQ five-minute inflows and deployed worker age",
                      "Probe live KOSDAQ composite index and minute-bar source",
                      "Probe KOSDAQ enrichment market-isolated source APIs",
                      "Verify LS REST prices and flow snapshot",
                      "Verify integrated sector/theme/stock/ETF enrichment APIs",
                      "Verify full event enrichment path",
                      "Probe unified KRX+NXT realtime flow",
                      "Verify live unified industry collector")
          for name in live_steps:
              condition=str(ci_by_name[name].get("if",""))
              assert "env.KOSPI_SKIP_LIVE_TESTS != '1'" in condition, (name,condition)
          gate=ci_by_name["Select market-hours live validation"]
          assert "scripts/ls_live_source_gate.py" in gate.get("run",""), "shared-source gate missing"
          assert "GH_TOKEN" in (gate.get("env") or {}) and "CURRENT_RUN_ID" in (gate.get("env") or {}), gate.get("env")
          history=ci_by_name["Inspect last completed KRX session chart outside trading hours"]
          assert "env.KOSPI_HISTORY_PROBE_ALLOWED == '1'" in str(history.get("if","")), history.get("if")

          qd_on=qd.get("on") or qd.get(True) or {}
          qd_input=((qd_on.get("workflow_dispatch") or {}).get("inputs") or {}).get("run_live_source_probes") or {}
          assert qd_input.get("type")=="boolean" and qd_input.get("default") is False, qd_input
          qd_regression=qd["jobs"]["regression"]
          assert "push" in qd_on and "pull_request" in qd_on, qd_on
          live=qd["jobs"]["live_source"]
          assert "workflow_dispatch" in str(live.get("if","")) and "inputs.run_live_source_probes == true" in str(live.get("if","")), live.get("if")
          qd_group=(live.get("concurrency") or {}).get("group")
          assert qd_group==ci_group, qd_group
          live_steps={step.get("name"):step for step in live["steps"]}
          assert "scripts/ls_live_source_gate.py" in live_steps["Gate shared LS source quota"]["run"]
          for name in ("Audit dated native industry source", "Read both market flow channels"):
              assert "steps.source_gate.outputs.allow == 'true'" in str(live_steps[name].get("if","")), (name,live_steps[name].get("if"))
          assert not ({"LS_OPENAPI_APP_KEY","LS_OPENAPI_APP_SECRET"} & set(live.get("env") or {})), "LS credentials must be scoped to source steps"
          print("ci_live_source_schedule_gated=true")
          print("ci_ci_source_jobs_serialized=true")
          print("ci_credentials_step_scoped=true")
          PY

      - name: Verify failure notifier syntax and independent handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          ci=yaml.safe_load(Path(".github/workflows/kospi-derivatives-flow-ls-ci.yml").read_text(encoding="utf-8"))
          jobs=ci["jobs"]
          alert=jobs["daily_failure_alert"]
          producer=jobs["handoff_producer"]
          consumer=jobs["handoff_consumer"]
          assert "needs" not in producer, "handoff producer must execute despite test failure"
          assert consumer.get("needs")=="handoff_producer", "handoff consumer dependency changed"
          assert alert.get("needs")==["test","handoff_producer","handoff_consumer"]
          assert "GH_TOKEN" in alert.get("env",{}), "failure notifier cannot fetch failed step"
          run=alert["steps"][0]["run"]
          prefix="python - <<'PY'\n"
          assert prefix in run and run.rstrip().endswith("\nPY"), "failure notifier python heredoc missing"
          script=run.split(prefix,1)[1].rsplit("\nPY",1)[0]
          compile(script,"ci_failure_notifier_embedded.py","exec")
          assert "CI 실패는 실시간 시장감시 중단" in script
          assert "실패 단계:" in script and "message_id" in script
          print("ci_failure_alert_syntax_valid=true independent_handoff=true")
          PY

      - name: Verify independent UTC CI recovery schedule
        run: |
          python - <<'PY'
          import datetime as dt
          from pathlib import Path
          from zoneinfo import ZoneInfo
          source=Path(".github/workflows/kospi-derivatives-flow-ls-ci.yml").read_text(encoding="utf-8")
          assert 'cron: "5 9 * * 1-5"' in source
          assert 'cron: "10 10 * * 1-5"' in source
          assert 'cron: "17 2 * * 1-5"' in source
          utc=dt.datetime(2026,10,14,2,17,tzinfo=dt.timezone.utc)
          kst=utc.astimezone(ZoneInfo("Asia/Seoul"))
          assert kst.strftime("%H:%M") == "11:17",kst
          print("kospi_ci_utc_fallback_schedule_valid=true backup_kst=",kst.isoformat())
          PY

      - name: Verify XKRX session calendar
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime as dt
          from krx_session_calendar import session_bounds, is_session_day

          assert not is_session_day(dt.date(2026,10,5)), "Chuseok holiday must be closed"
          assert is_session_day(dt.date(2026,10,6)), "2026-10-06 must be an XKRX session"
          assert not is_session_day(dt.date(2026,10,9)), "2026-10-09 Hangul Day must be closed"
          assert is_session_day(dt.date(2026,10,12)), "2026-10-12 next session must be open"
          assert not is_session_day(dt.date(2026,5,1)), "Labor Day must be closed"
          assert not is_session_day(dt.date(2026,12,31)), "year-end closure must be closed"
          normal_bounds=session_bounds(dt.date(2026,10,7))
          assert normal_bounds is not None, "2026-10-07 session missing"
          normal_open,_=normal_bounds
          probe=dt.datetime(2026,10,7,8,18,tzinfo=normal_open.tzinfo)
          assert normal_open-dt.timedelta(minutes=60) <= probe < normal_open, (normal_open,probe)
          print("xkrx_preopen_watchdog_window_valid=true", "open=",normal_open.isoformat(), "probe=",probe.isoformat())
          bounds=session_bounds(dt.date(2026,1,2))
          assert bounds is not None, "2026 first trading day missing"
          open_dt, close_dt=bounds
          assert (open_dt.hour,open_dt.minute)==(10,0), open_dt
          assert (close_dt.hour,close_dt.minute)==(15,30), close_dt
          print("xkrx_session_calendar_valid=true",
                "2026-01-02-open=",open_dt.isoformat(),
                "close=",close_dt.isoformat())
          PY

      - name: Select market-hours live validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_LIVE_SOURCE_PROBES: ${{ inputs.run_live_source_probes }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: python scripts/ls_live_source_gate.py

      - name: Probe live KOSDAQ investor feed
        if: env.KOSPI_SKIP_LIVE_TESTS != '1'
        env:
          LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
          LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime as dt, time
          from zoneinfo import ZoneInfo
          from krx_session_calendar import session_state
          from kospi_shock_episode_watch import get_token, investor_current
          now=dt.datetime.now(ZoneInfo("Asia/Seoul"))
          session=session_state(now)
          if not session["is_session"] or not session.get("open") or not session.get("continuous_end") or not (
              session["open"] + dt.timedelta(minutes=5) <= now < session["continuous_end"]
          ):
              print("kosdaq_t1602_live_probe=outside_continuous_market")
          else:
              row=investor_current(get_token(),"2","301","U")
              assert isinstance(row,dict), "KOSDAQ t1602 missing result"
              ts=row.get("sample_ts")
              age=time.time()-float(ts or 0)
              actors={k:row.get(k) for k in ("외국인","기관","개인")}
              print(f"kosdaq_t1602_live_probe=received age_sec={age:.1f} actors={actors} source_time={row.get('time')}")
              assert 0 <= age <= 90, f"KOSDAQ t1602 time stale {age:.1f}s"
              assert all(isinstance(v,(float,int)) for v in actors.values()), actors
              assert any(abs(float(v))>0 for v in actors.values()), "KOSDAQ t1602 all actors 0"
              print("kosdaq_t1602_live_probe=valid")
          PY

      - name: Probe KOSDAQ five-minute inflows and deployed worker age
        if: env.KOSPI_SKIP_LIVE_TESTS != '1'
        env:
          LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
          LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime as dt,json,os,pathlib,time,urllib.request
          from zoneinfo import ZoneInfo
          from krx_session_calendar import session_state
          from kospi_shock_episode_watch import (
              get_token,ls_post,market_clock_epoch,fnum,
              SURGE_WINDOW_SEC,SURGE_MAX_SAMPLE_SKEW_SEC,KOSDAQ_SURGE_SINGLE_SPOT_EOK
          )
          now=dt.datetime.now(ZoneInfo("Asia/Seoul"))
          sess=session_state(now)
          status={"retrieved_at_kst":now.isoformat(),
                  "source":"LS t1602 market=3 upcode=301 exchgubun=U",
                  "threshold_5m_eok":KOSDAQ_SURGE_SINGLE_SPOT_EOK,
                  "status":"outside_market"}
          live=bool(sess["is_session"] and sess.get("open") and sess.get("continuous_end")
                    and sess["open"]+dt.timedelta(minutes=6)<=now<sess["continuous_end"])
          if live:
              data=ls_post(get_token(),"/stock/investor","t1602",{
                  "t1602InBlock":{"market":"3","upcode":"301","gubun1":"2",
                  "gubun2":"0","cts_time":"","cts_idx":0,
                  "cnt":100,"gubun3":"","exchgubun":"U"}},
                  max_attempts=2,request_timeout=8.0)
              raw=data.get("t1602OutBlock1") or []
              if isinstance(raw,dict):raw=[raw]
              observations={}
              for row in raw:
                  if not isinstance(row,dict):continue
                  ts=market_clock_epoch(row.get("time"),time.time())
                  if ts is None or not (sess["open"].timestamp()<=ts<=time.time()+5):continue
                  v={who:fnum(row.get(field)) for who,field in
                     (("외국인","sv_17"),("기관","sv_18"),("개인","sv_08"))}
                  if all(x is not None for x in v.values()):observations[ts]={"ts":ts,**v}
              samples=sorted(observations.values(),key=lambda x:x["ts"])
              actors=("외국인","기관","개인")
              peak={x:None for x in actors}
              hits={x:[] for x in actors}
              for i,end in enumerate(samples):
                  if end["ts"]<sess["open"].timestamp()+SURGE_WINDOW_SEC:continue
                  target=end["ts"]-SURGE_WINDOW_SEC
                  before=[p for p in samples[:i] if p["ts"]<=target]
                  if not before:continue
                  start=max(before,key=lambda x:x["ts"])
                  if target-start["ts"]>SURGE_MAX_SAMPLE_SKEW_SEC:continue
                  for actor in actors:
                      delta=round(end[actor]-start[actor],2)
                      point={"delta_5m_eok":delta,"start_ts":start["ts"],"end_ts":end["ts"]}
                      if peak[actor] is None or delta>peak[actor]["delta_5m_eok"]:peak[actor]=point
                      if delta>=KOSDAQ_SURGE_SINGLE_SPOT_EOK:hits[actor].append(point)
              confirmed={}
              for actor in actors:
                  pair=hits[actor]
                  if any(10<=b["end_ts"]-a["end_ts"]<=120 for a,b in zip(pair,pair[1:])):
                      confirmed[actor]=max(x["delta_5m_eok"] for x in pair)
              status.update({"status":"market_history_checked","source_rows":len(raw),
                             "time_samples":len(samples),
                             "first_ts":samples[0]["ts"] if samples else None,
                             "last_ts":samples[-1]["ts"] if samples else None,
                             "max_5m_in_retained_history":peak,
                             "two_source_sample_confirmed_peak":confirmed})
          repo=os.environ["REPOSITORY"]
          headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                   "Accept":"application/vnd.github+json"}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:
                  return json.loads(r.read().decode("utf-8"))
          latest=get(f"https://api.github.com/repos/{repo}/commits?path=scripts%2Fkospi_shock_episode_watch.py&per_page=1")[0]
          latest_time=dt.datetime.fromisoformat(latest["commit"]["committer"]["date"].replace("Z","+00:00"))
          active=get(f"https://api.github.com/repos/{repo}/actions/workflows/kospi-derivatives-flow-ls-realtime.yml/runs?per_page=100").get("workflow_runs",[])
          shifts=[]
          for run in active:
              if run["status"] not in ("queued","in_progress"):continue
              created=dt.datetime.fromisoformat(run["created_at"].replace("Z","+00:00")).astimezone(ZoneInfo("Asia/Seoul"))
              if created.date()!=now.date():continue
              jobs=get(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100").get("jobs",[])
              for job in jobs:
                  if job.get("name") not in ("morning","afternoon") or job.get("status") not in ("queued","in_progress"):continue
                  started=job.get("started_at")
                  start_time=dt.datetime.fromisoformat(started.replace("Z","+00:00")) if started else None
                  shifts.append({"run_id":run["id"],"job":job.get("name"),
                                 "started_at":started,
                                 "latest_code_commit":latest["sha"],
                                 "latest_code_at":latest_time.isoformat(),
                                 "latest_code_loaded":"NO" if start_time and start_time<latest_time
                                 else "POSSIBLE" if start_time else "UNKNOWN"})
          status["live_shifts"]=shifts
          print("kosdaq_surge_source_audit=",json.dumps(status,ensure_ascii=False))
          p=pathlib.Path("out/kosdaq_surge_history_probe.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(status,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as summary:
              summary.write("\n### 코스닥 5분 수급·실전 배포 점검\n")
              summary.write(f"- 수집: {status['status']} / 실행 중인 감시: {shifts}\n")
              summary.write("- 과거 100행에서 확인한 범위만 재검증했습니다. 코드 테스트 성공은 실전 배포 성공이 아닙니다.\n")
          PY

      - name: Probe live KOSDAQ composite index and minute-bar source
        if: env.KOSPI_SKIP_LIVE_TESTS != '1'
        env:
          LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
          LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime as dt
          from zoneinfo import ZoneInfo
          from krx_session_calendar import session_state
          from kospi_shock_episode_watch import (
              get_token, fetch_kosdaq_index_quote, backfill_index_bars,
          )
          now=dt.datetime.now(ZoneInfo("Asia/Seoul"))
          session=session_state(now)
          live=bool(
              session["is_session"] and session.get("open") and session.get("continuous_end")
              and session["open"]+dt.timedelta(minutes=10) <= now < session["continuous_end"]
          )
          if not live:
              print("kosdaq_t1511_t8409_live_probe=outside_continuous_market")
          else:
              token=get_token()
              quote=fetch_kosdaq_index_quote(token)
              assert quote.get("price",0)>0, quote
              assert (quote.get("open") or 0)>0, quote
              assert (quote.get("prev_close") or 0)>0, quote
              bars=backfill_index_bars(token,120,"301")
              assert bars, "KOSDAQ t8409 minute bars empty on live session"
              assert all(v>0 for ts,v in bars), bars[:3]
              assert all(bars[i][0]<=bars[i+1][0] for i in range(len(bars)-1))
              print("kosdaq_t1511_t8409_live_probe=valid", "index=",quote["price"],
                    "bars=",len(bars),"source=","LS t1511 301 + t8409 301")
          PY

      - name: Probe KOSDAQ enrichment market-isolated source APIs
        if: env.KOSPI_SKIP_LIVE_TESTS != '1'
        env:
          LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
          LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime as dt
          from zoneinfo import ZoneInfo
          from krx_session_calendar import session_state
          from kospi_shock_enrichment import (
              get_token,kosdaq_stock_master,kosdaq_program_candidates,industry_master,
          )
