name: US Data Center Cycle Telegram Watch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/us-data-center-cycle-watch.yml"
      - "scripts/us_data_center_cycle_watch.py"
  schedule:
    # GitHub cron is UTC. Hourly at an offset minute to avoid the top-of-hour queue.
    - cron: "29 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a Telegram connection test"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: us-data-center-cycle-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs8879887988798879_bot"
      DATA_CENTER_TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
      CONFIGURED_DATA_CENTER_TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install watcher dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 pypdf

      - name: Resolve and verify Telegram route
        id: telegram
        shell: bash
        run: |
          if [ -z "$DATA_CENTER_TELEGRAM_BOT_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Telegram token missing. Existing watch state will not be consumed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY'
          import json, os, pathlib, urllib.request

          token = os.environ['DATA_CENTER_TELEGRAM_BOT_TOKEN'].strip()
          expected = os.environ['EXPECTED_TELEGRAM_BOT_USERNAME'].strip().lstrip('@')
          configured_chat = (os.environ.get('CONFIGURED_DATA_CENTER_TELEGRAM_CHAT_ID') or '').strip()

          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
              identity = json.loads(r.read().decode('utf-8'))
          actual = str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or actual.lower() != expected.lower():
              raise RuntimeError(f'Wrong Telegram bot: expected @{expected}, got @{actual or "unknown"}')

          chat_id = configured_chat
          route = 'secret'
          if not chat_id:
              with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getUpdates?limit=100&timeout=0', timeout=25) as r:
                  updates = json.loads(r.read().decode('utf-8'))
              candidates = []
              for upd in updates.get('result') or []:
                  msg = upd.get('message') or upd.get('edited_message') or {}
                  chat = msg.get('chat') or {}
                  if str(chat.get('type') or '') == 'private' and chat.get('id') is not None:
                      candidates.append((int(upd.get('update_id') or 0), str(chat['id'])))
              if candidates:
                  candidates.sort()
                  chat_id = candidates[-1][1]
                  route = 'getUpdates'

          out = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as f:
              f.write(f'bot_username={actual}\n')
              f.write(f'chat_id={chat_id}\n')
              f.write(f'chat_route={route}\n')
              f.write(f'configured={"true" if chat_id else "false"}\n')
          print(f'data_center_bot_verified=@{actual}')
          print(f'data_center_chat_resolved={bool(chat_id)} route={route}')
          PY

      - name: Validate watcher
        if: steps.telegram.outputs.configured == 'true'
        run: |
          python -m py_compile scripts/us_data_center_cycle_watch.py

      - name: Check Census and Dodge
        if: steps.telegram.outputs.configured == 'true'
        run: |
          rm -f out/us_data_center_cycle_alert.txt out/us_data_center_cycle_errors.log
          python scripts/us_data_center_cycle_watch.py
          test -f out/us_data_center_cycle_status.md && cat out/us_data_center_cycle_status.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build manual connection test
        if: steps.telegram.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.send_test == 'true'
        run: |
          mkdir -p out
          cat > out/us_data_center_cycle_connection_test.txt <<'EOF'
          [미국 데이터센터 건설 사이클 감시] 텔레그램 연결 시험

          텔레그램 연결 정상입니다.
          - 미국 인구조사국 데이터센터 건설 지출 감시
          - 도지 컨스트럭션 네트워크 데이터센터 착공 자료 감시
          - 매시간 웹 확인, 새 월간 데이터·수정치·새 착공 발표가 있을 때만 알림
          - 알림에 표시되는 설명·기관명·프로젝트명·환율 출처는 모두 한국어로 표기
          - 원문 주소는 긴 주소 대신 파란색 '원문' 링크로 표시
          - 기존 깃허브 액션 감시는 수정하지 않고 별도 워크플로로 동작
          EOF

      - name: Send Telegram messages
        if: steps.telegram.outputs.configured == 'true'
        env:
          DATA_CENTER_TELEGRAM_CHAT_ID: ${{ steps.telegram.outputs.chat_id }}
        shell: bash
        run: |
          python - <<'PY'
          import html as html_lib
          import json, os, pathlib, re, urllib.parse, urllib.request

          token = os.environ['DATA_CENTER_TELEGRAM_BOT_TOKEN'].strip()
          chat_id = os.environ['DATA_CENTER_TELEGRAM_CHAT_ID'].strip()
          files = [
              pathlib.Path('out/us_data_center_cycle_connection_test.txt'),
              pathlib.Path('out/us_data_center_cycle_alert.txt'),
          ]

          REPLACEMENTS = [
              ('Project Jupiter Data Center and Microgrid Phase 1 데이터센터 부문', '프로젝트 주피터 데이터센터 및 마이크로그리드 1단계 데이터센터 부문'),
              ('Project Jupiter Data Center and Microgrid Phase 1 마이크로그리드 부문', '프로젝트 주피터 데이터센터 및 마이크로그리드 1단계 마이크로그리드 부문'),
              ('Amazon STACK Highway 3 Data Center 데이터센터 부문', '아마존 스택 하이웨이 3 데이터센터 부문'),
              ('Amazon STACK Highway 3 Data Center', '아마존 스택 하이웨이 3 데이터센터'),
              ('Micron Semiconductor Mega-Factory Fab 1 – Phase 1', '마이크론 반도체 메가팩토리 팹 1 1단계'),
              ('Dodge Construction Network', '도지 컨스트럭션 네트워크'),
              ('Yahoo Finance USD/KRW', '야후 파이낸스 달러/원 환율'),
              ('Yahoo Finance', '야후 파이낸스'),
              ('Federal Reserve H.10 via Frankfurter', '미국 연방준비제도 H.10·프랑크푸르터'),
              ('USD/KRW', '달러/원'),
              ('GitHub Actions', '깃허브 액션'),
              ('GitHub', '깃허브'),
              ('KST', '한국시간'),
          ]

          def koreanize_visible_line(line: str) -> str:
              translated = line
              for src, dst in REPLACEMENTS:
                  translated = translated.replace(src, dst)

              # 향후 새 프로젝트명이 영문으로 들어오더라도 텔레그램에는 영문을 노출하지 않는다.
              # 원문 프로젝트명은 상태 파일에 그대로 보존하고, 알림에서는 한국어 일반명으로 대체한다.
              stripped = translated.lstrip()
              if stripped.startswith('·') and re.search(r'[A-Za-z]', translated):
                  if ': ' in translated:
                      amount = translated.rsplit(': ', 1)[1]
                      kind = '마이크로그리드 관련 프로젝트' if '마이크로그리드' in translated else '데이터센터 관련 프로젝트'
                      translated = f'  · {kind}: {amount}'
                  else:
                      translated = '  · 데이터센터 관련 프로젝트'

              # 환율 출처가 향후 다른 영문 공급자로 바뀌어도 영문 노출을 막는다.
              if translated.startswith('- 출처:') and re.search(r'[A-Za-z]', translated):
                  source_type = translated.split('·', 1)[1].strip() if '·' in translated else '환율 자료'
                  translated = f'- 출처: 공식·신뢰 환율 자료 · {source_type}'

              # URL은 별도 링크 처리하므로 이 검사는 일반 본문에만 적용된다.
              if re.search(r'[A-Za-z]', translated):
                  translated = re.sub(r'\b[A-Za-z][A-Za-z0-9._/&+\-]*\b', '', translated)
                  translated = re.sub(r'\s{2,}', ' ', translated).rstrip()
              return translated

          def render_html(text: str) -> str:
              rendered = []
              for line in text.splitlines():
                  match = re.fullmatch(r'\s*-?\s*원문:\s*(https?://\S+)\s*', line)
                  if match:
                      url = html_lib.escape(match.group(1), quote=True)
                      rendered.append(f'<a href="{url}">원문</a>')
                  else:
                      rendered.append(html_lib.escape(koreanize_visible_line(line)))
              return '\n'.join(rendered)

          sent = 0
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8').strip()
              if not text:
                  continue
              chunks = []
              while len(text) > 3800:
                  cut = text.rfind('\n\n', 0, 3800)
                  if cut < 1000:
                      cut = 3800
                  chunks.append(text[:cut].strip())
                  text = text[cut:].strip()
              if text:
                  chunks.append(text)

              for chunk in chunks:
                  payload = urllib.parse.urlencode({
                      'chat_id': chat_id,
                      'text': render_html(chunk),
                      'parse_mode': 'HTML',
                      'disable_web_page_preview': 'true',
                  }).encode('utf-8')
                  request = urllib.request.Request(
                      f'https://api.telegram.org/bot{token}/sendMessage',
                      data=payload,
                      method='POST',
                  )
                  with urllib.request.urlopen(request, timeout=30) as r:
                      result = json.loads(r.read().decode('utf-8'))
                  if not result.get('ok'):
                      raise RuntimeError(f'Telegram send failed for {path}: {result}')
                  sent += 1
          print(f'us_data_center_cycle_telegram_messages_sent={sent}')
          PY

      - name: Persist state after successful delivery/check
        if: steps.telegram.outputs.configured == 'true' && success()
        run: |
          if [ -f out/us_data_center_cycle_state_pending.json ]; then
            cp out/us_data_center_cycle_state_pending.json data/us_data_center_cycle_watch_state.json
          fi

      - name: Commit watch state
        if: steps.telegram.outputs.configured == 'true' && success()
        run: |
          git config user.name "us-data-center-cycle-watch[bot]"
          git config user.email "us-data-center-cycle-watch[bot]@users.noreply.github.com"
          [ -f data/us_data_center_cycle_watch_state.json ] && git add data/us_data_center_cycle_watch_state.json || true
          if git diff --cached --quiet; then
            echo "US data center cycle watch state unchanged"
          else
            git commit -m "Update US data center cycle watch state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-data-center-cycle-watch-${{ github.run_id }}
          path: |
            out/us_data_center_cycle_status.md
            out/us_data_center_cycle_alert.txt
            out/us_data_center_cycle_connection_test.txt
            out/us_data_center_cycle_errors.log
            out/us_data_center_cycle_state_pending.json
          if-no-files-found: ignore
          retention-days: 14
