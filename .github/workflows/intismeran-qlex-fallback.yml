name: Intismeran QLEX Watchdog Fallback

on:
  workflow_run:
    workflows:
      - "Global Rates & Yen Carry Telegram Watch"
    types:
      - completed
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/intismeran-qlex-fallback.yml"

permissions:
  contents: write

concurrency:
  group: intismeran-qlex-fallback
  cancel-in-progress: true

jobs:
  recover-if-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs887988798879887988798879_bot"
      BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
      BIO_TELEGRAM_CHAT_ID: ${{ secrets.BIO_TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide whether Intismeran watcher is stale
        id: stale
        run: |
          python - <<'PY'
          import datetime as dt, json, os, pathlib
          from zoneinfo import ZoneInfo
          path=pathlib.Path('data/intismeran_qlex_watch_state.json')
          now=dt.datetime.now(ZoneInfo('Asia/Seoul'))
          stale=True
          age=None
          last='missing'
          if path.exists():
              try:
                  s=json.loads(path.read_text(encoding='utf-8'))
                  last=str(s.get('last_check_kst') or '')
                  if last:
                      t=dt.datetime.fromisoformat(last)
                      if t.tzinfo is None:
                          t=t.replace(tzinfo=ZoneInfo('Asia/Seoul'))
                      age=(now-t.astimezone(ZoneInfo('Asia/Seoul'))).total_seconds()/60
                      stale=age >= 80
              except Exception as exc:
                  print(f'state_parse_error={exc}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'run={"true" if stale else "false"}\n')
              f.write(f'last={last}\n')
              f.write(f'age={"unknown" if age is None else round(age,1)}\n')
          print(f'intismeran_fallback_stale={stale} last={last} age_minutes={age}')
          PY

      - name: Verify Telegram route
        if: steps.stale.outputs.run == 'true'
        run: |
          if [ -z "$BIO_TELEGRAM_BOT_TOKEN" ] || [ -z "$BIO_TELEGRAM_CHAT_ID" ]; then
            exit 1
          fi
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['BIO_TELEGRAM_BOT_TOKEN'].strip()
          expected=os.environ['EXPECTED_TELEGRAM_BOT_USERNAME'].strip().lstrip('@')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
              j=json.loads(r.read().decode())
          actual=str((j.get('result') or {}).get('username') or '')
          if not j.get('ok') or actual.lower()!=expected.lower():
              raise RuntimeError(f'wrong bot @{actual}')
          print(f'intismeran_fallback_bot_verified=@{actual}')
          PY

      - name: Run Intismeran watcher recovery
        if: steps.stale.outputs.run == 'true'
        run: |
          rm -f out/intismeran_qlex_alert.md
          python scripts/intismeran_qlex_watch.py
          test -f out/intismeran_qlex_status.md && cat out/intismeran_qlex_status.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Send recovered Intismeran alert
        if: steps.stale.outputs.run == 'true' && hashFiles('out/intismeran_qlex_alert.md') != ''
        run: python scripts/qlex_telegram_send.py out/intismeran_qlex_alert.md

      - name: Persist recovered state
        if: steps.stale.outputs.run == 'true' && success() && hashFiles('out/intismeran_qlex_watch_state_pending.json') != ''
        run: cp out/intismeran_qlex_watch_state_pending.json data/intismeran_qlex_watch_state.json

      - name: Commit recovered state
        if: steps.stale.outputs.run == 'true' && success() && hashFiles('data/intismeran_qlex_watch_state.json') != ''
        run: |
          git config user.name "intismeran-bio-watch[bot]"
          git config user.email "intismeran-bio-watch[bot]@users.noreply.github.com"
          git add data/intismeran_qlex_watch_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Intismeran QLEX watch state"
            git pull --rebase origin main
            git push
          fi

      - name: Notify successful automatic recovery
        if: steps.stale.outputs.run == 'true' && success()
        run: |
          mkdir -p out
          cat > out/intismeran_watchdog_recovery.md <<EOF
          [바이오 감시] Intismeran 자동 복구

          Intismeran·QLEX 연계 감시 heartbeat가 기준 시간을 넘겨 watchdog이 자동 복구했습니다.
          - 직전 확인: ${{ steps.stale.outputs.last }}
          - 정체 시간: 약 ${{ steps.stale.outputs.age }}분
          - 복구 후 감시 계속 진행
          EOF
          python scripts/qlex_telegram_send.py out/intismeran_watchdog_recovery.md

      - name: Notify recovery failure
        if: steps.stale.outputs.run == 'true' && failure()
        run: |
          mkdir -p out
          cat > out/intismeran_watchdog_failure.md <<EOF
          [바이오 감시] Intismeran 자동 복구 실패

          Intismeran·QLEX 연계 감시가 기준 시간을 넘겨 watchdog이 복구를 시도했지만 실패했습니다.
          - 직전 확인: ${{ steps.stale.outputs.last }}
          - 정체 시간: 약 ${{ steps.stale.outputs.age }}분
          - GitHub Actions 점검 필요
          EOF
          python scripts/qlex_telegram_send.py out/intismeran_watchdog_failure.md || true
