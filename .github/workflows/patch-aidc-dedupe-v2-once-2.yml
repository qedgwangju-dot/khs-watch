name: Patch AIDC Dedupe V2 Once Retry

on:
  push:
    paths:
      - ".github/workflows/patch-aidc-dedupe-v2-once-2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install patch test dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 googlenewsdecoder
      - name: Patch active data-center workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/data-center-growth-telegram-watch.yml')
          text = p.read_text(encoding='utf-8')

          if '      - "scripts/korea_aidc_policy_watch_v2.py"' not in text:
              text = text.replace(
                  '      - "scripts/korea_aidc_policy_watch.py"\n',
                  '      - "scripts/korea_aidc_policy_watch.py"\n      - "scripts/korea_aidc_policy_watch_v2.py"\n',
                  1,
              )

          text = text.replace('  cancel-in-progress: true\n', '  cancel-in-progress: false\n', 1)
          text = text.replace(
              'run: python -m pip install --disable-pip-version-check requests openpyxl beautifulsoup4\n',
              'run: python -m pip install --disable-pip-version-check requests openpyxl beautifulsoup4 googlenewsdecoder\n',
              1,
          )
          text = text.replace(
              '      - name: Check Korea AIDC special-law power and permit policy\n        run: python scripts/korea_aidc_policy_watch.py\n',
              '      - name: Check Korea AIDC special-law power and permit policy\n        run: python scripts/korea_aidc_policy_watch_v2.py\n',
              1,
          )
          text = text.replace(
              '          import os, pathlib, requests, time\n',
              '          import json, os, pathlib, requests, subprocess, time\n',
              1,
          )

          guard_marker = '              if p.name == "korea_aidc_policy_alert.txt":\n'
          guard = '''              if p.name == "korea_aidc_policy_alert.txt":\n                  meta_path = pathlib.Path("out/korea_aidc_policy_alert_meta.json")\n                  if meta_path.exists():\n                      try:\n                          meta = json.loads(meta_path.read_text(encoding="utf-8"))\n                          subprocess.run(["git", "fetch", "origin", "main", "--quiet"], check=False)\n                          remote = subprocess.run(\n                              ["git", "show", "origin/main:data/korea_aidc_policy_state.json"],\n                              check=False, capture_output=True, text=True,\n                          )\n                          if remote.returncode == 0 and remote.stdout.strip():\n                              remote_state = json.loads(remote.stdout)\n                              remote_level = int((remote_state.get("seen_events") or {}).get(str(meta.get("event_key", "")), 0))\n                              current_level = int(meta.get("event_level", 0))\n                              if remote_level >= current_level and current_level > 0:\n                                  print(\n                                      "AIDC exact/policy duplicate suppressed by remote state: "\n                                      f"key={meta.get('event_key')} remote={remote_level} current={current_level}"\n                                  )\n                                  continue\n                      except Exception as exc:\n                          print(f"AIDC remote dedupe guard warning: {type(exc).__name__}: {exc}")\n'''
          if 'AIDC exact/policy duplicate suppressed by remote state' not in text:
              if guard_marker not in text:
                  raise SystemExit('AIDC send marker not found')
              text = text.replace(guard_marker, guard, 1)

          save_marker = '      - name: Save latest official baselines\n'
          immediate = '''      - name: Persist Korea AIDC state immediately after send\n        if: success()\n        run: |\n          if [ -f out/korea_aidc_policy_pending_state.json ]; then\n            git fetch origin main --quiet || true\n            python - <<'PY'\n          import json\n          import subprocess\n          from pathlib import Path\n\n          pending_path = Path("out/korea_aidc_policy_pending_state.json")\n          data_path = Path("data/korea_aidc_policy_state.json")\n          pending = json.loads(pending_path.read_text(encoding="utf-8"))\n          remote = subprocess.run(\n              ["git", "show", "origin/main:data/korea_aidc_policy_state.json"],\n              check=False, capture_output=True, text=True,\n          )\n          remote_state = {}\n          if remote.returncode == 0 and remote.stdout.strip():\n              try:\n                  remote_state = json.loads(remote.stdout)\n              except json.JSONDecodeError:\n                  remote_state = {}\n          merged = dict(remote_state)\n          merged.update({k: v for k, v in pending.items() if k != "seen_events"})\n          seen = {str(k): int(v) for k, v in (remote_state.get("seen_events") or {}).items()}\n          for key, value in (pending.get("seen_events") or {}).items():\n              seen[str(key)] = max(int(seen.get(str(key), 0)), int(value))\n          merged["seen_events"] = seen\n          data_path.parent.mkdir(parents=True, exist_ok=True)\n          data_path.write_text(json.dumps(merged, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")\n          PY\n            git config user.name "github-actions[bot]"\n            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n            git add data/korea_aidc_policy_state.json\n            if ! git diff --cached --quiet; then\n              git commit -m "Update Korea AIDC watch state [skip ci]"\n              for attempt in 1 2 3; do\n                if git pull --rebase origin main && git push origin HEAD:main; then\n                  break\n                fi\n                git rebase --abort 2>/dev/null || true\n                if [ "$attempt" -eq 3 ]; then exit 1; fi\n                sleep $((attempt * 2))\n              done\n            fi\n          fi\n\n'''
          if 'Persist Korea AIDC state immediately after send' not in text:
              if save_marker not in text:
                  raise SystemExit('save marker not found')
              text = text.replace(save_marker, immediate + save_marker, 1)

          text = text.replace(
              '          cp out/korea_aidc_policy_pending_state.json data/korea_aidc_policy_state.json\n',
              '          # Korea AIDC state is merged and persisted immediately after the send step.\n',
              1,
          )

          if 'out/korea_aidc_policy_alert_meta.json' not in text:
              text = text.replace(
                  '            out/korea_aidc_policy_alert.txt\n',
                  '            out/korea_aidc_policy_alert.txt\n            out/korea_aidc_policy_alert_meta.json\n',
                  1,
              )

          p.write_text(text, encoding='utf-8')
          PY

          python -m py_compile scripts/korea_aidc_policy_watch_v2.py
          python - <<'PY'
          from scripts.korea_aidc_policy_watch_v2 import semantic_key, render

          legal = {
              "title": "AIDC 특례, 전력 알박기 부작용 대안은? 매매 제한하려면 법 개정 필요",
              "publisher": "디지털데일리", "source": "국내 주요 언론", "official": False,
              "url": "https://example.com/legal", "published": "Thu, 10 Sep 2026 00:00:00 GMT",
              "category": "AIDC 특별법", "stage": 2,
              "article_body": "전력계통영향평가 면제 사업권 매각 금지는 법률상 근거가 필요하다. 300kW 기준은 확정된 것이 아니다.",
          }
          queue = {
              "title": "AIDC 알박기 막아야 전력계통평가 신청 물량 93%가 데이터센터",
              "publisher": "전자신문", "source": "국내 주요 언론", "official": False,
              "url": "https://example.com/queue", "published": "Mon, 14 Sep 2026 00:00:00 GMT",
              "category": "AIDC 특별법", "stage": 2,
              "article_body": "전체 신청 물량은 67.4GW다. 데이터센터가 62.8GW로 93%를 차지했다. 1차 심사 공급가능 39.9GW지만 본심사 7GW에 불과하다. 약 33GW가 중간 단계다. 실제 사업 추진 기한 근거가 없다.",
          }
          assert semantic_key(legal) == "aidc|anti-hoarding|legal-limit"
          assert semantic_key(queue) == "aidc|anti-hoarding|queue-evidence"
          assert semantic_key(queue) == semantic_key(dict(queue))
          body = render(queue)
          for term in ("이번에 새로 추가된 사실", "67.4GW", "62.8GW·93%", "약 <b>33GW</b>", "기존 알림과 달라진 점"):
              assert term in body, term
          print("AIDC v2 semantic dedupe/readability tests passed")
          PY

          grep -q 'cancel-in-progress: false' .github/workflows/data-center-growth-telegram-watch.yml
          grep -q 'korea_aidc_policy_watch_v2.py' .github/workflows/data-center-growth-telegram-watch.yml
          grep -q 'AIDC exact/policy duplicate suppressed by remote state' .github/workflows/data-center-growth-telegram-watch.yml
          grep -q 'Persist Korea AIDC state immediately after send' .github/workflows/data-center-growth-telegram-watch.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/data-center-growth-telegram-watch.yml scripts/korea_aidc_policy_watch_v2.py
          if ! git diff --cached --quiet; then
            git commit -m "fix AIDC duplicate suppression and incremental fact alerts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
