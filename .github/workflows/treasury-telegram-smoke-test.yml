name: Treasury Telegram smoke test

on:
  push:
    paths:
      - ".github/workflows/treasury-telegram-smoke-test.yml"
      - "scripts/send_treasury_telegram_smoketest.py"
      - "data/treasury_telegram_smoke_trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send detailed Treasury Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TREASURY_FOREIGN_DEMAND_TELEGRAM_BOT_TOKEN }}
          PRIMARY_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          FALLBACK_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          TELEGRAM_CHAT_ID="${PRIMARY_CHAT_ID:-$FALLBACK_CHAT_ID}"
          export TELEGRAM_CHAT_ID
          python scripts/send_treasury_telegram_smoketest.py

      - name: Commit delivery diagnostic
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/treasury_telegram_smoke_diag.json ]; then
            echo '{"ok":false,"stage":"workflow","error":"diagnostic file missing"}' > data/treasury_telegram_smoke_diag.json
          fi
          git add data/treasury_telegram_smoke_diag.json
          git commit -m "Record Treasury Telegram smoke diagnostic" || exit 0
          git pull --rebase origin main
          git push
