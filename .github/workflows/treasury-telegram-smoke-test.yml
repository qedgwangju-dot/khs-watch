name: Treasury Telegram smoke test

on:
  push:
    paths:
      - ".github/workflows/treasury-telegram-smoke-test.yml"

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs88798879887988798879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TREASURY_FOREIGN_DEMAND_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
      FALLBACK_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bot identity and send interpreted buyback alert
        run: |
          TELEGRAM_CHAT_ID="${TELEGRAM_CHAT_ID:-$FALLBACK_CHAT_ID}"
          export TELEGRAM_CHAT_ID
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TREASURY_FOREIGN_DEMAND_TELEGRAM_BOT_TOKEN is missing" >&2
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram chat id is missing" >&2
            exit 1
          fi
          mkdir -p data
          python - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"wrong bot: expected @{expected}, got @{actual or 'unknown'}")

          text = '''<b>🇺🇸 [테스트] 미 재무부, 장기 명목국채 바이백 최소 2배 확대</b>

<b>쉽게 말하면</b>
🟢 신규 10·20·30년 국채를 더 찍는 게 아닙니다. 이미 시장에 유통 중인 10~20년·20~30년 비지표물 국채를 재무부가 더 많이 되사는 조치라 <b>장기물 수급·유동성에는 우호적</b>입니다.

<b>확정 숫자</b>
• 회당 최대 20억달러 → <b>최소 40억달러</b>
• 적용: <b>9월 9일~11월 4일</b>
• 기존 일정상 대상 7회(10~20년 4회 + 20~30년 3회)
• 남은 최대 바이백 상한: <b>140억달러 → 최소 280억달러</b>
• 추가 최대 흡수여력: 최소 140억달러

<b>금리 해석</b>
• 비지표물 장기채 공급 부담 ↓ → 딜러 재고 부담 ↓ → 유동성 프리미엄·기간 프리미엄 완화 → 10년·30년 금리 상승 압력 일부 완화
• 장기 실질금리까지 내려오면 AI·성장주 할인율에도 우호적

<b>하지만</b>
• QE 아님
• 바이백 재원은 다른 국채 발행 등으로 조달되므로 국가부채·순국채 공급 문제 자체를 해결하지 않음
• 즉 <b>총량 문제는 그대로지만 장기물 시장의 마찰을 줄이는 한시적 완충장치</b>

<b>시간표</b>
• 11월 3일 미국 중간선거
• 11월 4일 다음 QRA + 바이백 규모 재결정
• 선거 목적은 공식 확인된 이유가 아니므로 시장 해석으로만 구분

<b>다음 확인</b>
실제 매입액/상한 · 총 제시액 · 20년/30년 입찰 수요 · 10년/30년 명목·실질금리 · 11월 4일 바이백 연장/축소 및 이표채 가이던스

<a href="https://home.treasury.gov/news/press-releases/sb0607">미 재무부 공식 발표</a> · <a href="https://www.treasurydirect.gov/auctions/announcements-data-results/buy-backs/">바이백 공지·결과</a> · <a href="https://home.treasury.gov/system/files/221/Tentative-Buyback-Schedule.pdf">기존 일정</a>'''
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text[:4096],
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=25) as r:
              result = json.loads(r.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected message: {result}")

          record = {
              "ok": True,
              "bot_username": actual,
              "message_id": (result.get("result") or {}).get("message_id"),
              "sent_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "topic": "Treasury long-end buyback interpreted alert test 2026-08-19 23:03 KST",
          }
          pathlib.Path("data/treasury_telegram_smoke_test_result.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(record, ensure_ascii=False))
          PY

      - name: Commit smoke test result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasury_telegram_smoke_test_result.json
          git commit -m "Record Treasury Telegram smoke test" || exit 0
          git push

