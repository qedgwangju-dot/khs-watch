name: Treasury foreign demand Telegram alert

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/treasury-foreign-demand-telegram-alert.yml"
      - "scripts/treasury_foreign_demand_watch.py"
      - "scripts/treasury_foreign_demand_easy_alert.py"
      - "tests/test_treasury_foreign_demand_watch.py"
      - "tests/test_treasury_state_commit.py"
  pull_request:
    paths:
      - ".github/workflows/treasury-foreign-demand-telegram-alert.yml"
      - "tests/test_treasury_state_commit.py"
  schedule:
    # 05:10 and 06:10 KST daily. TIC monthly release is normally 16:00 ET;
    # H.4.1 is normally published Thursday afternoon ET.
    - cron: "10 20,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('treasury-foreign-demand-pr-{0}', github.event.pull_request.number) || 'treasury-foreign-demand-telegram-alert' }}
  cancel-in-progress: true

jobs:
  offline-state-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_treasury_state_commit.py' -v

  monitor:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs88798879887988798879_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate monitor
        run: |
          python -m py_compile scripts/treasury_foreign_demand_watch.py
          python -m py_compile scripts/treasury_foreign_demand_easy_alert.py
          python -m unittest discover -s tests -p 'test_treasury_state_commit.py' -v
          if [ -f tests/test_treasury_foreign_demand_watch.py ]; then
            python -m unittest tests/test_treasury_foreign_demand_watch.py -v
          fi

      - name: Check official TIC and Fed custody data
        run: python scripts/treasury_foreign_demand_watch.py

      - name: Add easy market interpretation
        if: hashFiles('out/treasury_foreign_demand_alert.md') != ''
        run: python scripts/treasury_foreign_demand_easy_alert.py

      - name: Send interpreted alert through selected bot only
        if: hashFiles('out/treasury_foreign_demand_alert.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TREASURY_FOREIGN_DEMAND_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          FALLBACK_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          TELEGRAM_CHAT_ID="${TELEGRAM_CHAT_ID:-$FALLBACK_CHAT_ID}"
          export TELEGRAM_CHAT_ID
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "미 국채 해외수요 텔레그램 봇 토큰 또는 chat id가 없습니다." >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"잘못된 봇 경로: expected @{expected}, got @{actual or 'unknown'}")

          title = pathlib.Path("out/treasury_foreign_demand_title.txt").read_text(encoding="utf-8").strip()
          body = pathlib.Path("out/treasury_foreign_demand_alert.md").read_text(encoding="utf-8").strip()

          body = body.replace(
              "원문: https://ticdata.treasury.gov/resource-center/data-chart-center/tic/Documents/slt_table5.txt",
              '<a href="https://ticdata.treasury.gov/resource-center/data-chart-center/tic/Documents/slt_table5.txt">원문</a>',
          )
          body = body.replace(
              "거래·평가 분해: https://ticdata.treasury.gov/resource-center/data-chart-center/tic/Documents/slt_table3.txt",
              '<a href="https://ticdata.treasury.gov/resource-center/data-chart-center/tic/Documents/slt_table3.txt">거래·평가 분해</a>',
          )
          body = body.replace(
              "원문: https://www.federalreserve.gov/releases/h41/current/",
              '<a href="https://www.federalreserve.gov/releases/h41/current/">원문</a>',
          )

          text = f"{title}\n\n{body}"[:4096]
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=25) as r:
              result = json.loads(r.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected message: {result}")
          pathlib.Path("out/treasury_foreign_demand_telegram_confirmed.json").write_text(
              json.dumps({
                  "bot_username": actual,
                  "message_id": (result.get("result") or {}).get("message_id"),
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Finalize state
        if: success() && hashFiles('data/treasury_foreign_demand_state_next.json') != ''
        run: |
          python - <<'PY'
          import json
          import pathlib

          src = pathlib.Path("data/treasury_foreign_demand_state_next.json")
          state = json.loads(src.read_text(encoding="utf-8"))
          alert_exists = pathlib.Path("out/treasury_foreign_demand_alert.md").exists()
          confirmed = pathlib.Path("out/treasury_foreign_demand_telegram_confirmed.json").exists()
          if alert_exists and not confirmed:
              raise RuntimeError("알림이 생성됐지만 텔레그램 전송 확인이 없습니다.")
          if confirmed and state.get("pending_tic_month"):
              state["last_tic_month"] = state.pop("pending_tic_month")
          pathlib.Path("data/treasury_foreign_demand_state.json").write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit state
        if: success() && hashFiles('data/treasury_foreign_demand_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          state_file="data/treasury_foreign_demand_state.json"
          git add -- "$state_file"
          if git diff --cached --quiet; then
            echo "상태 변경 없음"
            exit 0
          fi
          if git diff --cached --name-only | grep -Fvx "$state_file"; then
            echo "treasury_state_commit_contains_unexpected_files=true" >&2
            exit 1
          fi
          git commit -m "Update Treasury foreign demand state"
          # Retry this state commit only. Never rerun collection, finalize or send.
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort >/dev/null 2>&1 || true
              echo "treasury_state_rebase_failed=true" >&2
              exit 1
            fi
            if push_output=$(git push origin HEAD:refs/heads/main 2>&1); then
              printf '%s\n' "$push_output"
              echo "treasury_state_push_confirmed=true attempt=$attempt"
              exit 0
            fi
            printf '%s\n' "$push_output" >&2
            # Retry observed concurrent-ref races, not authentication/policy failures.
            if ! printf '%s\n' "$push_output" | grep -Eq '\[rejected\].*(non-fast-forward|fetch first)|\[remote rejected\].*(cannot lock ref|incorrect old value provided)'; then
              echo "treasury_state_push_nonretryable=true" >&2
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
          done
          echo "treasury_state_push_failed_after_retries=true" >&2
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-foreign-demand-${{ github.run_id }}
          path: |
            out/treasury_foreign_demand_status.md
            out/treasury_foreign_demand_alert.md
            out/treasury_foreign_demand_detail.json
            out/treasury_foreign_demand_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14

