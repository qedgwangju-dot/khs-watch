name: Korea AI Semiconductor Policy Demand Watch

on:
  schedule:
    # GitHub cron is UTC. Hourly, separated from the Rebellions company watcher.
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/korea-ai-semiconductor-policy-watch.yml"
      - "scripts/korea_ai_semiconductor_policy_watch.py"

permissions:
  contents: write

concurrency:
  group: korea-ai-semiconductor-policy-demand-watch-${{ github.event_name == 'push' && 'validation' || 'runtime' }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs88798879887988798879_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate watcher
        run: python -m py_compile scripts/korea_ai_semiconductor_policy_watch.py

      - name: Regression test AIDC budget-vs-contract and technology stages
        run: |
          python - <<'PY'
          from scripts import korea_ai_semiconductor_policy_watch as m
          title = '"엔비디아에만 의존 못 해"…정부, AIDC 네트워크 국산화 추진'
          summary = '과기정통부 IITP가 2027년 CPO NPO OCS 광통신 국산화 기술개발에 180억원을 계획'
          initial = m.aidc_milestone(title, summary)
          assert initial and initial[2] == m.AIDC_PRIOR_PLAN and initial[1] == 2
          assert m.is_relevant(title, summary)
          assert m.source_quality('뉴스1', '공식-과기정통부') == '신뢰보도'
          assert m.source_quality('과학기술정보통신부', 'AIDC-국산광통신') == '공식'
          assert m.aidc_milestone('정부 AIDC 전력망 송전설비 착공', 'AIDC 변압기 정책') is None
          assert m.aidc_milestone('글로벌테크, CPO 핵심 광원 국산화 성공', '국산 광통신 부품 고객 공급') is None
          assert m.aidc_milestone('글로벌테크, CPO 광원 국산화', '정부 지원 기술을 포함한 기업 신제품') is None
          for s,axis,phase in [
              ('과기정통부 2027 AIDC CPO NPO 광트랜시버 연구개발 사업 공고','cpo-npo','call'),
              ('과기정통부 2027 AIDC OCS MEMS L-COS 주관기관 선정','ocs','award'),
              ('과기정통부 2027 AIDC InP 공공 파운드리 생산 라인 가동','inp-foundry','production'),
              ('과기정통부 2027 AIDC 광통신 네트워크 예산안 국회 본회의 최종 의결','integrated','budget-approved'),
              ('정부 2027 AIDC AI 기지국 분산 추론 연구개발 계획','ai-base-station','plan'),
              ('정부 2027 AIDC 플라스틱 도파관 연구개발 신규 과제 공고','waveguide','call'),
          ]:
              result=m.aidc_milestone(s)
              assert result and ('|' + axis + '|') in result[2] and result[2].endswith('|'+phase), (s,result)
          assert m.aidc_milestone('정부 2027 AIDC OCS 사업 공고 예정')[1]==2
          print('aidc_policy_stage_regression=passed')
          PY

      - name: Verify Telegram route
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HBM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("HBM_TELEGRAM_BOT_TOKEN secret is missing")
          if not chat_id:
              raise RuntimeError("HBM_TELEGRAM_CHAT_ID secret is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{username}")
          PY

      - name: Check policy demand and overseas orders
        run: python scripts/korea_ai_semiconductor_policy_watch.py

      - name: Publish status
        if: always()
        run: |
          if [ -f out/korea_ai_semiconductor_policy_watch_status.md ]; then
            cat out/korea_ai_semiconductor_policy_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send new material change to Telegram
        if: github.event_name != 'push' && hashFiles('out/korea_ai_semiconductor_policy_watch_alert.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HBM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("Telegram route secret is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          text = pathlib.Path("out/korea_ai_semiconductor_policy_watch_alert.html").read_text(encoding="utf-8").strip()

          def chunks(value, limit=3900):
              out, current = [], ""
              for paragraph in value.split("\n\n"):
                  candidate = paragraph if not current else current + "\n\n" + paragraph
                  if len(candidate) <= limit:
                      current = candidate
                      continue
                  if current:
                      out.append(current)
                  current = paragraph
              if current:
                  out.append(current)
              return out

          message_ids = []
          for idx, chunk in enumerate(chunks(text), start=1):
              if idx > 1:
                  chunk = f"<b>국산 AI반도체 정책·초기수요·해외수주 (계속 {idx})</b>\n\n{chunk}"
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError("Telegram rejected message (no delivery confirmation)")
              delivered = result.get("result") or {}
              delivered_chat = delivered.get("chat") or {}
              message_id = delivered.get("message_id")
              if not isinstance(message_id, int):
                  raise RuntimeError("Telegram response lacks valid message_id")
              if chat_id.lstrip("-").isdigit():
                  route_ok = str(delivered_chat.get("id")) == chat_id
              elif chat_id.startswith("@"):
                  route_ok = str(delivered_chat.get("username") or "").lower() == chat_id[1:].lower()
              else:
                  route_ok = False
              if not route_ok:
                  raise RuntimeError("Telegram response chat identity differs from configured destination")
              message_ids.append(message_id)

          pathlib.Path("out/korea_ai_semiconductor_policy_watch_telegram_confirmed.json").write_text(
              json.dumps({
                  "status": "confirmed",
                  "bot_username": username,
                  "chat_identity_verified": True,
                  "message_ids": message_ids,
                  "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"telegram_delivery_confirmed=true bot=@{username} message_ids={message_ids}")
          PY

      - name: Persist confirmed state
        if: github.event_name != 'push' && success() && hashFiles('out/korea_ai_semiconductor_policy_watch_pending_state.json') != '' && (hashFiles('out/korea_ai_semiconductor_policy_watch_alert.html') == '' || hashFiles('out/korea_ai_semiconductor_policy_watch_telegram_confirmed.json') != '')
        run: |
          cp out/korea_ai_semiconductor_policy_watch_pending_state.json data/korea_ai_semiconductor_policy_watch_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/korea_ai_semiconductor_policy_watch_state.json
          if git diff --cached --quiet; then
            echo "AI semiconductor policy watch state unchanged"
          else
            git commit -m "Update Korea AI semiconductor policy watch state [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korea-ai-semiconductor-policy-watch-${{ github.run_id }}
          path: |
            out/korea_ai_semiconductor_policy_watch_status.md
            out/korea_ai_semiconductor_policy_watch_alert.html
            out/korea_ai_semiconductor_policy_watch_telegram_confirmed.json
            out/korea_ai_semiconductor_policy_watch_pending_state.json
          if-no-files-found: ignore
          retention-days: 14
