name: Patch Energy Mix Investment Readthrough Once

on:
  push:
    paths:
      - ".github/workflows/patch-energy-investment-readthrough-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch energy-mix investment interpretation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/korea_energy_mix_watch_runner.py')
          text = p.read_text(encoding='utf-8')

          needle = '''    return lines\n\n\ndef _interpret_nuclear_coal_lng(body: str) -> list[str]:'''
          replacement = '''    return lines\n\n\ndef _investment_readthrough(row: dict[str, Any], body: str) -> list[str]:\n    lower = body.lower()\n    category = str(row.get("category", ""))\n    if not any(term in lower for term in ("재생에너지", "원전", "원자력", "lng", "가스발전", "ess", "전력망", "계통")):\n        return []\n\n    lines = ["<b>투자 판단</b>"]\n\n    if "재생" in lower and ("220gw" in lower or "155gw" in lower):\n        lines.extend([\n            "• 재생에너지 비중이 커질수록 <b>ESS·PCS·송변전망·계통안정화 설비</b>의 정책 중요도와 설비투자 필요성이 같이 커짐",\n            "• 다만 ‘재생에너지 확대 = 추가 원전·LNG 자동 축소’로 단정하면 안 됨. <b>재생에너지·저장장치·전력망이 계획대로 실제 구축될 경우</b> 12차 전기본의 추가 원전·LNG 필요량이 낮아질 여지는 있지만, 이는 정부 확정안이 아니라 투자 해석",\n            "• 반대로 2040년 최대전력수요 전망이 크게 상향된 만큼, 재생에너지 확대와 별개로 <b>안정적인 전원·계통보강 수요가 동시에 커질 수 있음</b>",\n        ])\n\n    if category in {"재생에너지·전원믹스", "원전·전원믹스", "전력수요 전망", "전력수급기본계획"} or _has_any(lower, "원전", "원자력", "재생에너지"):\n        lines.extend([\n            "• <b>11차 전기본 확정분과 12차 전기본의 추가 선택지는 분리해서 봐야 함</b>",\n            "• 현재 확인 기준 제11차 전기본의 대형원전 2기(총 2.8GW)와 소형모듈원전 1기(0.7GW)는 기존 추진계획이며, 재생에너지 보급 전망 계산만으로 자동 취소되는 구조가 아님",\n            "• 대형원전 후보지는 <b>경북 영덕</b>, 소형모듈원전 후보지는 <b>부산 기장</b>으로 선정된 상태이므로, 투자 판단에서는 ‘기존 확정 원전 설비투자’와 ‘12차에서 새로 결정될 추가 원전·LNG’의 옵션가치를 따로 봐야 함",\n        ])\n\n    return lines\n\n\ndef _interpret_nuclear_coal_lng(body: str) -> list[str]:'''
          if needle not in text:
              raise SystemExit('investment helper insertion point not found')
          text = text.replace(needle, replacement, 1)

          needle2 = '''    if specialized:\n        lines.extend(specialized)\n        return "\\n".join(lines)'''
          replacement2 = '''    if specialized:\n        lines.extend(specialized)\n        investment = _investment_readthrough(row, body)\n        if investment:\n            lines.extend(["", *investment])\n        return "\\n".join(lines)'''
          if needle2 not in text:
              raise SystemExit('interpretation insertion point not found')
          text = text.replace(needle2, replacement2, 1)

          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/korea_energy_mix_watch_runner.py
          python - <<'PY'
          from scripts.korea_energy_mix_watch_runner import interpret_article_body

          body = '''정부는 2040년 재생에너지 설비를 220GW로 늘리는 방안을 논의한다. 태양광은 155GW 수준이며 ESS와 전력망 확충이 필요하다. 전력수요도 크게 늘어날 전망이다.'''
          out = interpret_article_body({"category": "재생에너지·전원믹스", "title": "12차 전기본 재생에너지 220GW"}, body, "")
          required = ["투자 판단", "ESS·PCS·송변전망", "자동 취소", "경북 영덕", "부산 기장", "추가 원전·LNG"]
          missing = [x for x in required if x not in out]
          if missing:
              raise SystemExit(f'missing investment-readthrough text: {missing}')
          print('investment_readthrough_test=ok')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/korea_energy_mix_watch_runner.py
          git commit -m "add cross-asset investment read-through to energy-mix alerts"
          git pull --rebase origin main
          git push origin HEAD:main
