name: AIDC Correct Bot Resend Once

on:
  push:
    paths:
      - ".github/workflows/aidc-correct-bot-resend-once.yml"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send AIDC alert to requested Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.ENERGY_MIX_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ENERGY_MIX_TELEGRAM_CHAT_ID }}
          FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: khs887988798879887988798879_bot
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip() or os.environ.get("FALLBACK_TELEGRAM_CHAT_ID", "").strip()
          expected = os.environ.get("EXPECTED_TELEGRAM_BOT_USERNAME", "").strip().lstrip("@")
          if not token or not chat_id:
              raise SystemExit("AIDC Telegram token/chat id missing")

          me = requests.get(f"https://api.telegram.org/bot{token}/getMe", timeout=20).json()
          actual = str(me.get("result", {}).get("username", ""))
          if not me.get("ok") or actual.lower() != expected.lower():
              raise SystemExit(f"Wrong bot blocked: expected=@{expected}, actual=@{actual or 'unknown'}")

          text = '''<b>한국 AIDC 정책·전력 특례 새 변화</b>

<b>AIDC 특별법 밑그림 짠다…전력·인허가 특례 기준 본격 논의</b>

<b>단계</b>  하위법령 설계
<b>발표일</b>  2026년 9월 9일
<b>출처</b>  <a href="https://www.mt.co.kr/tech/2026/09/09/2026090910103788638"><b>머니투데이</b></a>

<b>무엇이 달라졌나</b>
• 2027년 3월 10일 AIDC 특별법 시행을 앞두고 시행령·하위법령의 실제 적용 기준을 정하는 단계로 들어감
• 핵심 논의는 AIDC 인정 범위, 구축·운영 신고, 인허가 일괄처리·시설 특례, 전력 특례, 비수도권 특구 지정·지원
• 이번 토론회는 구체 시행령 조문 확정이 아니라 의견수렴 단계

<b>쉽게 풀면</b>
AI 데이터센터를 얼마나 빨리 짓고 전력을 받을 수 있는지를 좌우할 세부 규칙을 만드는 중. 특히 전력 특례와 인허가 일괄처리 기준이 실제 착공·전원 인가 시간표를 바꿀 수 있음.

<b>다음 확인</b>
• 입법예고 시점
• AIDC 인정 기준과 용량 요건
• 전력계통영향평가 특례·면제 범위
• 비수도권 특구 지정 기준
• 시행령 확정과 2027년 3월 10일 시행

<b>주의</b>
법률 시행일은 확정됐지만, 구체적인 시행령 조문과 전력 특례 숫자는 아직 확정 전.''' 

          r = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True,
              },
              timeout=30,
          )
          data = r.json()
          if not r.ok or not data.get("ok"):
              raise SystemExit(f"Telegram send failed: HTTP {r.status_code} / {data}")
          print(f"telegram_delivery_confirmed=true bot=@{actual} message_id={data['result']['message_id']}")
          PY
