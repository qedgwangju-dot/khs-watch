name: Yen carry unwind Telegram alert

on:
  schedule:
    # 최초 연결 확인을 빠르게 끝내기 위해 5분 간격으로 확인한다. GitHub cron은 UTC 기준이다.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "실제 조건과 무관하게 텔레그램 연결 시험 메시지 전송"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    paths:
      - ".github/workflows/yen-carry-alert.yml"
      - "scripts/yen_carry_alert.py"
      - "tests/test_yen_carry_alert.py"

permissions:
  contents: write

concurrency:
  group: yen-carry-alert
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      YEN_CARRY_MAX_DATA_AGE_MINUTES: "240"
      YEN_CARRY_CASH_FRESH_MINUTES: "150"
      YEN_CARRY_YAHOO_INTERVAL: "5m"
      YEN_CARRY_YAHOO_RANGE: "5d"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select one-time bootstrap test
        shell: bash
        run: |
          requested="${{ github.event.inputs.telegram_test || 'false' }}"
          if [ "$requested" = "true" ]; then
            echo "TELEGRAM_TEST=true" >> "$GITHUB_ENV"
            echo "Telegram mode: manual connection test" >> "$GITHUB_STEP_SUMMARY"
          elif [ ! -f data/yen_carry_telegram_bootstrap_done.json ]; then
            echo "TELEGRAM_TEST=true" >> "$GITHUB_ENV"
            echo "Telegram mode: one-time automatic bootstrap test" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "TELEGRAM_TEST=false" >> "$GITHUB_ENV"
            echo "Telegram mode: conditional alert monitoring" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate monitor
        run: |
          python -m py_compile scripts/yen_carry_alert.py
          python -m unittest tests/test_yen_carry_alert.py -v

      - name: Check yen carry conditions
        run: python scripts/yen_carry_alert.py

      - name: Publish status summary
        if: always()
        run: |
          if [ -f out/yen_carry_watch.md ]; then
            cat out/yen_carry_watch.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "엔캐리 경보 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Telegram alert
        if: hashFiles('out/yen_carry_alert.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "KHS_POLICY_TELEGRAM_BOT_TOKEN 또는 KHS_POLICY_TELEGRAM_CHAT_ID가 없습니다." >&2
            exit 1
          fi

          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          title = pathlib.Path("out/yen_carry_alert_title.txt").read_text(encoding="utf-8").strip()
          body = pathlib.Path("out/yen_carry_alert.md").read_text(encoding="utf-8").strip()
          text = f"{title}\n\n{body}"[:4096]
          payload = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
                  "disable_web_page_preview": "true",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram API rejected message: {result}")

          confirmed = {
              "status": "confirmed",
              "message_id": result.get("result", {}).get("message_id"),
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
              "mode": "test" if os.environ.get("TELEGRAM_TEST", "false").lower() == "true" else "alert",
          }
          destinations = [
              pathlib.Path("out/yen_carry_telegram_confirmed.json"),
              pathlib.Path("data/yen_carry_telegram_last_confirmed.json"),
          ]
          if confirmed["mode"] == "test":
              destinations.append(pathlib.Path("data/yen_carry_telegram_bootstrap_done.json"))
          for destination in destinations:
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(
                  json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          print("Telegram yen carry message sent and confirmed.")
          PY

      - name: Finalize alert state
        if: always()
        run: python scripts/yen_carry_alert.py --finalize

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yen-carry-alert-${{ github.run_id }}
          path: |
            out/yen_carry_watch.md
            out/yen_carry_alert.md
            out/yen_carry_alert.json
            out/yen_carry_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit alert state and delivery confirmation
        if: always() && (hashFiles('data/yen_carry_alert_state.json') != '' || hashFiles('data/yen_carry_telegram_last_confirmed.json') != '' || hashFiles('data/yen_carry_telegram_bootstrap_done.json') != '')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yen_carry_alert_state.json data/yen_carry_telegram_last_confirmed.json data/yen_carry_telegram_bootstrap_done.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "엔캐리 경보 상태 변경 없음"
          else
            git commit -m "Update yen carry alert state"
            git pull --rebase origin main
            git push
          fi
