name: Energy Mix Telegram Route Probe

on:
  push:
    paths:
      - ".github/workflows/energy-mix-telegram-route-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KHS_POLICY: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
      GLOBAL_RATES: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
      BIO: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
      YEN_CARRY: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
      HBM: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
      JOBS_WAGE: ${{ secrets.JOBS_WAGE_TELEGRAM_BOT_TOKEN }}
      TREASURY_FOREIGN_DEMAND: ${{ secrets.TREASURY_FOREIGN_DEMAND_TELEGRAM_BOT_TOKEN }}
      LEGACY: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Resolve configured bot usernames without sending
        run: |
          python - <<'PY'
          import json, os, urllib.request
          names = [
              'KHS_POLICY','GLOBAL_RATES','BIO','YEN_CARRY','HBM',
              'JOBS_WAGE','TREASURY_FOREIGN_DEMAND','LEGACY'
          ]
          for name in names:
              token=(os.getenv(name) or '').strip()
              if not token:
                  print(f'{name}=MISSING')
                  continue
              try:
                  with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
                      payload=json.loads(r.read().decode('utf-8'))
                  username=str((payload.get('result') or {}).get('username') or '')
                  print(f'{name}=@{username or "UNKNOWN"}')
              except Exception as exc:
                  print(f'{name}=ERROR:{type(exc).__name__}')
          PY
