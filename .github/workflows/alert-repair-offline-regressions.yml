name: Alert repair offline regressions
on:
  schedule:
    # Read-only daily audit: 09:23 KST, no Telegram sends or state mutations.
    - cron: '23 0 * * *'
  pull_request:
    paths:
      - 'scripts/bio_korean_guard.py'
      - 'scripts/texas_data_center*.py'
      - 'scripts/lng_supply_crisis_alert_v34.py'
      - 'scripts/lng_supply_crisis_alert_v22.py'
      - 'scripts/lng_collection_budget.py'
      - 'scripts/run_alert_regressions_offline.py'
      - 'scripts/alert_operations_audit.py'
      - 'tests/test_alert_operations_audit.py'
      - 'tests/test_bio_alert_regressions.py'
      - 'tests/test_texas_translation_regressions.py'
      - 'tests/test_clarity*.py'
      - 'tests/test_crcl_validation_regression.py'
      - 'tests/test_lng_parser_clock_regression.py'
      - 'tests/test_lng_collection_budget.py'
      - 'tests/test_lng_bundesbank_csv.py'
      - 'tests/fixtures/bundesbank_run38156218314_preview.csv'
      - 'tests/fixtures/crcl_date_alignment.json'
      - '.github/workflows/alert-repair-offline-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/bio_korean_guard.py'
      - 'scripts/texas_data_center*.py'
      - 'scripts/lng_supply_crisis_alert_v34.py'
      - 'scripts/lng_supply_crisis_alert_v22.py'
      - 'scripts/lng_collection_budget.py'
      - 'scripts/run_alert_regressions_offline.py'
      - 'scripts/alert_operations_audit.py'
      - 'tests/test_alert_operations_audit.py'
      - 'tests/test_bio_alert_regressions.py'
      - 'tests/test_texas_translation_regressions.py'
      - 'tests/test_clarity*.py'
      - 'tests/test_crcl_validation_regression.py'
      - 'tests/test_lng_parser_clock_regression.py'
      - 'tests/test_lng_collection_budget.py'
      - 'tests/test_lng_bundesbank_csv.py'
      - 'tests/fixtures/bundesbank_run38156218314_preview.csv'
      - 'tests/fixtures/crcl_date_alignment.json'
      - '.github/workflows/alert-repair-offline-regressions.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 requests certifi deep-translator
      - run: python scripts/run_alert_regressions_offline.py

  operations-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify audit safety and scan all workflow files
        run: |
          PYTHONPATH=. python -m unittest tests.test_alert_operations_audit -v
          python scripts/alert_operations_audit.py

      - name: Inspect recent Actions runs and workflow activation states (read only)
        # Run during PR verification as well so the scheduled API path is tested before merge.
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          since=$(date -u -d '36 hours ago' '+%Y-%m-%d')
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?created=%3E%3D${since}&per_page=100" \
            --jq '.workflow_runs[] | {id,path,event,status,conclusion,created_at,html_url} | @json' \
            > out/alert_operations_runs.jsonl
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | {id,path,name,state} | @json' \
            > out/alert_operations_workflows.jsonl
          if [ ! -s out/alert_operations_runs.jsonl ] || [ ! -s out/alert_operations_workflows.jsonl ]; then
            echo "::error::Operational audit source unavailable; cannot report zero failures."
            exit 1
          fi
          python scripts/alert_operations_audit.py \
            --runs out/alert_operations_runs.jsonl \
            --workflows out/alert_operations_workflows.jsonl

      - name: Publish read-only audit summary
        if: always()
        run: |
          if [ -f out/alert_operations_audit.md ]; then
            cat out/alert_operations_audit.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "경보: 알림 운영 공통 진단 결과가 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Store audit evidence without modifying any watch state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-operations-audit-${{ github.run_id }}
          path: |
            out/alert_operations_audit.json
            out/alert_operations_audit.md
          if-no-files-found: ignore
          retention-days: 14
