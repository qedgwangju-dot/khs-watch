name: Deep Fission Korean Alert Guard

on:
  push:
    branches:
      - main
    paths:
      - "scripts/deep_fission_watch.py"
      - ".github/workflows/deep-fission-korean-alert-ci.yml"
  pull_request:
    paths:
      - "scripts/deep_fission_watch.py"
      - ".github/workflows/deep-fission-korean-alert-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  verify-korean-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: One-time verify current nuclear policy runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT repos/${{ github.repository }}/actions/workflows/khs-policy-watch.yml/enable
          gh workflow run khs-policy-watch.yml --ref main -f telegram_test=false -f telegram_dry_run=false
          echo "khs_policy_live_verification_dispatch=created"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile watcher
        run: python -m py_compile scripts/deep_fission_watch.py

      - name: Verify Korean-only alert rendering
        run: python scripts/deep_fission_watch.py --mode self-test
