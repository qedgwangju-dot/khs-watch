# diagnose exact Federal Register relevance match
name: CLARITY Federal source live test

on:
  push:
    paths:
      - ".github/workflows/clarity-federal-source-live-test.yml"

permissions:
  contents: write

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify routes and diagnose relevance match
        run: |
          mkdir -p out data
          python - <<'PY'
          import importlib.util, json, pathlib, urllib.request

          spec = importlib.util.spec_from_file_location("guard", "scripts/clarity_alert_guard.py")
          guard = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(guard)

          urls = {
              "json": "https://www.federalregister.gov/api/v1/documents/2026-18424?publication_date=2026-09-10",
              "xml": "https://www.federalregister.gov/documents/full_text/xml/2026/09/10/2026-18424.xml",
              "mods": "https://www.govinfo.gov/metadata/granule/FR-2026-09-10/2026-18424/mods.xml",
          }
          bodies = {}
          for name, url in urls.items():
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read().decode("utf-8", "ignore")
                  bodies[name] = body
                  print(name, "status=", r.status, "bytes=", len(body), "content_type=", r.headers.get("content-type"))
                  if r.status != 200:
                      raise RuntimeError(f"{name} returned {r.status}")

          meta = json.loads(bodies["json"])
          title = guard.clean(meta.get("title"))
          abstract = guard.clean(meta.get("abstract"))
          action = guard.clean(meta.get("action"))
          primary = " ".join([title, abstract, action])
          m = guard.STRICT_CRYPTO_RE.search(primary)
          print("TITLE=", title)
          print("TYPE=", meta.get("type"))
          print("ABSTRACT=", abstract)
          print("ACTION=", action)
          print("REGEX_MATCH=", m.group(0) if m else None)
          print("MATCH_SPAN=", m.span() if m else None)
          if m:
              s,e=m.span(); print("MATCH_CONTEXT=", primary[max(0,s-120):min(len(primary),e+120)])

          event = {
              "source":"SEC Federal Register 제안규칙",
              "event_type":"SEC·CFTC 공식 규칙·해석·집행지침",
              "title":title,
              "url":"https://www.federalregister.gov/documents/2026/09/10/2026-18424/political-contributions-by-certain-investment-advisers",
              "date":"2026-09-10",
              "detail":"",
          }
          checked, reason = guard.validate_federal_register_event(event)
          print("GUARD_REASON=", reason)
          print("GUARD_KEPT=", checked is not None)
          if checked is not None:
              raise RuntimeError("unrelated 2026-18424 still passes guard")
          PY
