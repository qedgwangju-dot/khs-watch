name: GAMEJOA preopen news radar test send

on:
  push:
    paths:
      - ".github/gamejoa-preopen-news-radar-test-trigger.txt"
  workflow_dispatch:
    inputs:
      radar_run_mode:
        description: "preopen keeps the 06:30 window; live sends new unseen high-impact updates"
        required: false
        default: "live"
        type: choice
        options:
          - "preopen"
          - "live"
      allow_off_window_telegram:
        description: "Manual verification only: allow a preopen send outside 05:30-07:30 KST"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      link_entity_probe:
        description: "Send one labeled source-link test message for Telegram rendering verification"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: gamejoa-preopen-news-radar-test
  cancel-in-progress: false

jobs:
  test-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RADAR_MAX_AGE_HOURS: "72"
      RADAR_DISPLAY_LIMIT: "7"
      RADAR_TRENDFORCE_RESEARCH_MAX_AGE_DAYS: "3"
      GAMEJOA_RADAR_SEEN_TTL_DAYS: "14"
      PREOPEN_SEND_WINDOW_START_KST: "05:30"
      PREOPEN_SEND_WINDOW_END_KST: "07:30"
      ALLOW_OFF_WINDOW_TELEGRAM: ${{ github.event.inputs.allow_off_window_telegram || 'false' }}
      RADAR_RUN_MODE: ${{ github.event.inputs.radar_run_mode || 'live' }}
      RADAR_FETCH_TIMEOUT_SECONDS: "10"
      RADAR_QUERY_FETCH_WORKERS: "4"
      GAMEJOA_KOREAN_BUSINESS_DETAIL_LIMIT: "96"
      GAMEJOA_KOREAN_BUSINESS_DETAIL_WORKERS: "8"
      KHS_SOURCE_PROXY_URL: https://tips-yield-telegram.gustnd1.workers.dev/policy-source/fetch
      KHS_SOURCE_PROXY_FIRST: "true"
      KHS_SOURCE_PROXY_TIMEOUT_SECONDS: "20"
      KHS_SOURCE_DIRECT_TIMEOUT_CAP_SECONDS: "10"
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT || 'GAMEJOA-preopen-radar contact=please-set-secret' }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      SEND_TELEGRAM: "true"
      SEND_EMPTY_RADAR: "false"
      TELEGRAM_DRY_RUN: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify GAMEJOA delivery contract
        run: |
          python scripts/verify_gamejoa_delivery_contract.py
          python scripts/verify_gamejoa_semisupply_contract.py
          python scripts/verify_high_impact_news_self_audit.py

      - name: Preflight strict GAMEJOA radar quality
        env:
          SEND_TELEGRAM: "false"
          TELEGRAM_DRY_RUN: "true"
        run: |
          python scripts/gamejoa_preopen_news_radar_fda_quality_runner.py
          python scripts/verify_gamejoa_generated_report.py

      - name: Build and send strict GAMEJOA radar test
        env:
          SEND_TELEGRAM: "true"
          TELEGRAM_DRY_RUN: "false"
        run: |
          if [ "${{ github.event.inputs.link_entity_probe || 'false' }}" = "true" ]; then
            python - <<'PY'
            import sys
            from pathlib import Path

            sys.path.insert(0, str(Path.cwd() / "scripts"))
            import gamejoa_preopen_news_radar_full_compact_runner as compact

            compact.send_telegram(
                "📰 실시간 핵심 뉴스 레이더 · 링크 검증\n"
                "선별: 핵심 1건\n\n"
                "1) 원문 링크 표시 검증\n"
                "- 핵심: 원문 뉴스보기 라벨을 누르면 해당 기사가 열리는지 확인합니다.\n"
                '- 출처: <a href="https://www.mk.co.kr/news/business/12126513">원문 뉴스보기</a>\n'
            )
          PY
          else
            python scripts/gamejoa_preopen_news_radar_fda_quality_runner.py
          fi

      - name: Verify GAMEJOA runtime delivery result
        run: |
          if [ "${{ github.event.inputs.link_entity_probe || 'false' }}" = "true" ]; then
            python - <<'PY'
            import json
            from pathlib import Path

            payload = json.loads(Path("out/gamejoa_preopen_news_radar_delivery.json").read_text(encoding="utf-8"))
            if payload.get("status") != "sent":
                raise SystemExit(f"Telegram link-entity probe was not sent: {payload}")
            print(f"GAMEJOA link-entity probe verified: status={payload['status']}")
            PY
          else
            python scripts/verify_gamejoa_delivery_result.py
          fi

      - name: Publish report summary
        if: always()
        run: |
          if [ -f out/gamejoa_preopen_news_radar.md ]; then
            cat out/gamejoa_preopen_news_radar.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GAMEJOA strict test did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
