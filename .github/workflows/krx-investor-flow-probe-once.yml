name: KRX investor flow probe once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/krx-investor-flow-probe-once.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe KRX investor flow
        run: |
          python - <<'PY'
          import json, requests
          url='https://data.krx.co.kr/comm/bldAttendant/getJsonData.cmd'
          headers={
            'User-Agent':'Mozilla/5.0',
            'Accept':'application/json, text/javascript, */*; q=0.01',
            'Accept-Language':'ko-KR,ko;q=0.9',
            'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8',
            'Origin':'https://data.krx.co.kr',
            'Referer':'https://data.krx.co.kr/contents/MDC/MDI/outerLoader/index.cmd?screenId=MDCSTAT022',
            'X-Requested-With':'XMLHttpRequest',
          }
          for market in ['STK','KSQ','ALL']:
            payload={
              'bld':'dbms/MDC/STAT/standard/MDCSTAT02202',
              'locale':'ko_KR',
              'inqTpCd':'2',
              'trdVolVal':'2',
              'askBid':'3',
              'mktId':market,
              'strtDd':'20260915',
              'endDd':'20260916',
              'money':'3',
              'csvxls_isNo':'false',
            }
            r=requests.post(url,headers=headers,data=payload,timeout=30)
            print('MARKET',market,'HTTP',r.status_code,'CTYPE',r.headers.get('content-type'))
            print(r.text[:12000])
          PY
