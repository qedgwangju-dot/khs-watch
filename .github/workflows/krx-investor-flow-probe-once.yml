name: KRX investor flow probe once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/krx-investor-flow-probe-once.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install pykrx
        run: python -m pip install --disable-pip-version-check --quiet pykrx
      - name: Probe KRX investor flow via pykrx
        run: |
          python - <<'PY'
          from pykrx import stock
          for market in ['KOSPI','KOSDAQ']:
              print('MARKET', market)
              df = stock.get_market_trading_value_by_date('20260915','20260916',market)
              print(df.to_string())
          PY
