name: Bio QLEX Intismeran Watch

on:
  schedule:
    # 15분 간격, 정각 혼잡 회피
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Telegram 연결 시험 전송"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    paths:
      - ".github/workflows/bio-qlex-intismeran-watch.yml"
      - "scripts/qlex_sc_conversion_watch.py"
      - "scripts/qlex_telegram_send.py"
      - "scripts/intismeran_qlex_watch.py"
      - "scripts/intismeran_structured_telegram_send.py"

permissions:
  contents: write

concurrency:
  group: bio-qlex-intismeran-state-writer
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs887988798879887988798879_bot"
      BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
      CONFIGURED_BIO_TELEGRAM_CHAT_ID: ${{ secrets.BIO_TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and verify Telegram route
        id: route
        shell: bash
        run: |
          set -euo pipefail
          token="${BIO_TELEGRAM_BOT_TOKEN:-}"
          chat_id="${CONFIGURED_BIO_TELEGRAM_CHAT_ID:-}"
          route_source="secret"
          if [ -z "$token" ]; then
            echo "BIO_TELEGRAM_BOT_TOKEN 누락" >&2
            exit 1
          fi

          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['BIO_TELEGRAM_BOT_TOKEN'].strip()
          expected=os.environ['EXPECTED_TELEGRAM_BOT_USERNAME'].strip().lstrip('@')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe',timeout=25) as r:
              payload=json.loads(r.read().decode('utf-8'))
          actual=str((payload.get('result') or {}).get('username') or '')
          if not payload.get('ok') or actual.lower()!=expected.lower():
              raise RuntimeError(f'잘못된 Telegram 봇: expected @{expected}, got @{actual or "unknown"}')
          print(f'bio_telegram_bot_ok=@{actual}')
          PY

          if [ -z "$chat_id" ] && [ -f data/bio_telegram_chat_id.enc ]; then
            route_source="encrypted-route"
            chat_id=$(openssl enc -d -aes-256-cbc -a -A -pbkdf2 \
              -pass env:BIO_TELEGRAM_BOT_TOKEN \
              -in data/bio_telegram_chat_id.enc 2>/dev/null || true)
          fi

          if [ -z "$chat_id" ]; then
            route_source="getUpdates-once"
            chat_id=$(python - <<'PY'
          import json, os, urllib.request
          token=os.environ['BIO_TELEGRAM_BOT_TOKEN'].strip()
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getUpdates?limit=100&timeout=0',timeout=25) as r:
              data=json.loads(r.read().decode('utf-8'))
          candidates=[]
          for upd in data.get('result') or []:
              msg=upd.get('message') or upd.get('edited_message') or {}
              chat=msg.get('chat') or {}
              if str(chat.get('type') or '')=='private' and chat.get('id') is not None:
                  candidates.append((int(upd.get('update_id') or 0),str(chat['id'])))
          if candidates:
              candidates.sort()
              print(candidates[-1][1])
          PY
            )
          fi

          if [ -z "$chat_id" ]; then
            echo "BIO_TELEGRAM_CHAT_ID가 워크플로에 전달되지 않았고 저장된 암호화 경로도 없습니다. 봇에 /start를 한 번 보내면 다음 실행에서 자동 저장됩니다." >&2
            exit 1
          fi

          echo "::add-mask::$chat_id"
          echo "chat_id=$chat_id" >> "$GITHUB_OUTPUT"
          echo "route_source=$route_source" >> "$GITHUB_OUTPUT"

          # Secret이 비어 있어도 이후 /start 기록 만료와 무관하게 재사용하도록 암호화 저장.
          printf '%s' "$chat_id" | openssl enc -aes-256-cbc -a -A -pbkdf2 -salt \
            -pass env:BIO_TELEGRAM_BOT_TOKEN \
            -out data/bio_telegram_chat_id.enc
          echo "bio_telegram_route_ok=true source=$route_source"

      - name: Validate scripts
        run: python -m py_compile scripts/qlex_sc_conversion_watch.py scripts/qlex_telegram_send.py scripts/intismeran_qlex_watch.py scripts/intismeran_structured_telegram_send.py

      - name: Check QLEX data
        run: |
          mkdir -p out
          rm -f out/qlex_sc_conversion_alert.md out/qlex_sc_connection_test.md
          python scripts/qlex_sc_conversion_watch.py --mode check

      - name: Check Intismeran data
        run: |
          rm -f out/intismeran_qlex_alert.md out/intismeran_structured_send_confirmed.json
          python scripts/intismeran_qlex_watch.py

      - name: Build route repair test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Make bio Telegram route self-healing')
        run: |
          cat > out/qlex_sc_connection_test.md <<'EOF'
          [바이오 감시] QLEX·Intismeran 감시 구조 정상화

          - 바이오 상태파일 쓰기는 단일 워크플로만 담당
          - 15분 간격 감시
          - Telegram 채팅 경로를 암호화 저장해 /start 기록 만료에 의존하지 않음
          - 원문 본문 확인 실패 시 해당 Intismeran 기사는 소비하지 않고 재시도
          EOF

      - name: Build manual test
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.send_test == 'true'
        run: |
          cat > out/qlex_sc_connection_test.md <<'EOF'
          [바이오 감시] QLEX·Intismeran 감시 연결 시험
          현재 Telegram 연결과 감시 실행 경로가 정상입니다.
          EOF

      - name: Send connection test
        if: hashFiles('out/qlex_sc_connection_test.md') != ''
        id: test_send
        continue-on-error: true
        env:
          BIO_TELEGRAM_CHAT_ID: ${{ steps.route.outputs.chat_id }}
        run: python scripts/qlex_telegram_send.py out/qlex_sc_connection_test.md

      - name: Send new QLEX alert
        if: hashFiles('out/qlex_sc_conversion_alert.md') != ''
        id: qlex_send
        continue-on-error: true
        env:
          BIO_TELEGRAM_CHAT_ID: ${{ steps.route.outputs.chat_id }}
        run: python scripts/qlex_telegram_send.py out/qlex_sc_conversion_alert.md

      - name: Send new Intismeran alert
        if: hashFiles('out/intismeran_qlex_alert.md') != ''
        id: intis_send
        continue-on-error: true
        env:
          BIO_TELEGRAM_CHAT_ID: ${{ steps.route.outputs.chat_id }}
        run: python scripts/intismeran_structured_telegram_send.py out/intismeran_qlex_alert.md

      - name: Persist only safely handled states
        id: persist
        shell: bash
        env:
          QLEX_SEND_OUTCOME: ${{ steps.qlex_send.outcome }}
          INTIS_SEND_OUTCOME: ${{ steps.intis_send.outcome }}
        run: |
          set -euo pipefail
          qlex_ok=false
          intis_ok=false

          if [ -f out/qlex_sc_conversion_watch_state_pending.json ]; then
            if [ ! -f out/qlex_sc_conversion_alert.md ] || [ "$QLEX_SEND_OUTCOME" = "success" ]; then
              cp out/qlex_sc_conversion_watch_state_pending.json data/qlex_sc_conversion_watch_state.json
              qlex_ok=true
            fi
          fi

          if [ -f out/intismeran_qlex_watch_state_pending.json ]; then
            if [ ! -f out/intismeran_qlex_alert.md ] || [ -f out/intismeran_structured_send_confirmed.json ]; then
              cp out/intismeran_qlex_watch_state_pending.json data/intismeran_qlex_watch_state.json
              intis_ok=true
            fi
          fi

          echo "qlex_ok=$qlex_ok" >> "$GITHUB_OUTPUT"
          echo "intis_ok=$intis_ok" >> "$GITHUB_OUTPUT"

      - name: Write heartbeat
        if: always()
        env:
          QLEX_OK: ${{ steps.persist.outputs.qlex_ok }}
          INTIS_OK: ${{ steps.persist.outputs.intis_ok }}
          TEST_SEND_OUTCOME: ${{ steps.test_send.outcome }}
          QLEX_SEND_OUTCOME: ${{ steps.qlex_send.outcome }}
          INTIS_SEND_OUTCOME: ${{ steps.intis_send.outcome }}
          ROUTE_SOURCE: ${{ steps.route.outputs.route_source }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, pathlib
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat(timespec='seconds')
          qlex_ok=os.environ.get('QLEX_OK')=='true'
          intis_ok=os.environ.get('INTIS_OK')=='true'
          status='ok' if qlex_ok and intis_ok else 'degraded'
          payload={
              'status':status,
              'checked_at_kst':now,
              'route_source':os.environ.get('ROUTE_SOURCE',''),
              'qlex_state_persisted':qlex_ok,
              'intismeran_state_persisted':intis_ok,
              'qlex_send_outcome':os.environ.get('QLEX_SEND_OUTCOME',''),
              'intismeran_send_outcome':os.environ.get('INTIS_SEND_OUTCOME',''),
              'test_send_outcome':os.environ.get('TEST_SEND_OUTCOME',''),
          }
          pathlib.Path('data/bio_watch_heartbeat.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False))
          PY

      - name: Commit state, route and heartbeat
        if: always()
        run: |
          git config user.name "bio-watch[bot]"
          git config user.email "bio-watch[bot]@users.noreply.github.com"
          git add data/qlex_sc_conversion_watch_state.json data/intismeran_qlex_watch_state.json data/bio_watch_heartbeat.json data/bio_telegram_chat_id.enc 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Bio state unchanged"
            exit 0
          fi
          git commit -m "Update bio QLEX Intismeran state"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Fail if state handling degraded
        if: always() && (steps.persist.outputs.qlex_ok != 'true' || steps.persist.outputs.intis_ok != 'true')
        run: |
          echo "바이오 감시 상태 저장 또는 알림 처리 실패" >&2
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio-qlex-intismeran-${{ github.run_id }}
          path: |
            out/qlex_sc_conversion_status.md
            out/qlex_sc_conversion_alert.md
            out/qlex_sc_conversion_errors.log
            out/qlex_sc_conversion_watch_state_pending.json
            out/intismeran_qlex_status.md
            out/intismeran_qlex_alert.md
            out/intismeran_qlex_errors.log
            out/intismeran_qlex_watch_state_pending.json
            out/intismeran_structured_send_confirmed.json
            out/qlex_sc_connection_test.md
            data/bio_watch_heartbeat.json
          if-no-files-found: ignore
          retention-days: 14