name: US positioning presentation CI

on:
  pull_request:
    paths:
      - "scripts/us_positioning_watch.py"
      - "scripts/us_positioning_presentation.py"
      - "scripts/us_positioning_horizons.py"
      - "tests/test_us_positioning_presentation.py"
      - "tests/test_us_positioning_horizons.py"
      - "tests/test_us_positioning_collectors.py"
      - "tests/fixtures/us_positioning_20261014_saved.json"
      - "tests/fixtures/us_positioning_month_horizons_20261015.json"
      - ".github/workflows/us-positioning-telegram-watch.yml"
      - ".github/workflows/us-positioning-presentation-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/us_positioning_watch.py"
      - "scripts/us_positioning_presentation.py"
      - "scripts/us_positioning_horizons.py"
      - "tests/test_us_positioning_presentation.py"
      - "tests/test_us_positioning_horizons.py"
      - "tests/test_us_positioning_collectors.py"
      - "tests/fixtures/us_positioning_20261014_saved.json"
      - "tests/fixtures/us_positioning_month_horizons_20261015.json"
      - ".github/workflows/us-positioning-telegram-watch.yml"
      - ".github/workflows/us-positioning-presentation-ci.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline parser test dependencies
        run: python -m pip install --disable-pip-version-check --quiet pandas beautifulsoup4
      - name: Check presentation and real collector gates without network or Telegram
        run: |
          python -m py_compile scripts/us_positioning_watch.py scripts/us_positioning_presentation.py scripts/us_positioning_horizons.py
          python -m unittest discover -s tests -p 'test_us_positioning*.py' -v
