name: GDPNow Long Rates Telegram Watch

on:
  push:
    paths:
      - ".github/workflows/gdpnow-long-rates-telegram-watch.yml"
      - "scripts/gdpnow_long_rates_watch.py"
      - "data/gdpnow_long_rates_state.json"
  schedule:
    # Atlanta Fed updates are event driven; 15-minute polling catches a new official update quickly.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gdpnow-long-rates-telegram-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs8879887988798879_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Validate watcher
        run: python -m py_compile scripts/gdpnow_long_rates_watch.py

      - name: Check official GDPNow and rate sources
        run: python scripts/gdpnow_long_rates_watch.py

      - name: Publish status
        if: always()
        run: |
          if [ -f out/gdpnow_long_rates_status.md ]; then
            cat out/gdpnow_long_rates_status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GDPNow·장기금리 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/gdpnow_long_rates_alert.html ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "# Telegram 전송 예정" >> "$GITHUB_STEP_SUMMARY"
            sed -e 's/<[^>]*>//g' out/gdpnow_long_rates_alert.html >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate Telegram route guard
        if: hashFiles('out/gdpnow_long_rates_alert.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("GLOBAL_RATES_TELEGRAM_BOT_TOKEN secret is missing; refusing fallback")
          if not chat_id:
              raise RuntimeError("GLOBAL_RATES_TELEGRAM_CHAT_ID secret is missing; refusing fallback")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot configured: expected @{expected}, got @{actual or 'unknown'}")
          print(f"telegram_route_guard=ok bot=@{actual}")
          PY

      - name: Send new GDPNow alert through dedicated bot
        if: hashFiles('out/gdpnow_long_rates_alert.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token or not chat_id or not expected:
              raise RuntimeError("Dedicated GDPNow Telegram route is incomplete")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot configured: expected @{expected}, got @{actual or 'unknown'}")

          text = pathlib.Path("out/gdpnow_long_rates_alert.html").read_text(encoding="utf-8").strip()
          if len(text) > 3900:
              text = text[:3850] + "\n\n…메시지 길이 제한으로 일부 생략"
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=25) as r:
              result = json.loads(r.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected message: {result}")
          message_id = (result.get("result") or {}).get("message_id")
          marker = {
              "telegram_delivery_confirmed": True,
              "lane": "gdpnow_long_rates",
              "bot_username": actual,
              "message_id": message_id,
              "route_secret": "GLOBAL_RATES_TELEGRAM_*",
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/gdpnow_long_rates_telegram_confirmed.json").write_text(
              json.dumps(marker, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"telegram_delivery_confirmed=true bot=@{actual} message_id={message_id}")
          PY

      - name: Persist state only after safe baseline or confirmed delivery
        if: always()
        run: |
          if [ ! -f out/gdpnow_long_rates_alert.html ] || [ -f out/gdpnow_long_rates_telegram_confirmed.json ]; then
            if [ -f out/gdpnow_long_rates_pending_state.json ]; then
              cp out/gdpnow_long_rates_pending_state.json data/gdpnow_long_rates_state.json
            fi
          else
            echo "Telegram delivery was not confirmed; state intentionally not advanced."
          fi

      - name: Commit watcher state
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gdpnow_long_rates_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "GDPNow watcher state unchanged"
          else
            git commit -m "Update GDPNow long-rates watch state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdpnow-long-rates-${{ github.run_id }}
          path: |
            out/gdpnow_long_rates_status.md
            out/gdpnow_long_rates_alert.html
            out/gdpnow_long_rates_pending_state.json
            out/gdpnow_long_rates_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
