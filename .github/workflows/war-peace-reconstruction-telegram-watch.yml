name: War peace reconstruction Telegram watch

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/war-peace-telegram-test-trigger.txt"
      - ".github/workflows/war-peace-reconstruction-telegram-watch.yml"
      - "scripts/war_peace_reconstruction_watch*.py"
      - "scripts/test_war_peace*.py"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send one Telegram connection test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: war-peace-reconstruction-telegram-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_TEST: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'Test') && 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.telegram_test || 'false') }}
      DRY_RUN: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[dry-run]') && 'true' || 'false' }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Refresh latest confirmed state
        run: |
          git fetch origin main --depth=1
          git reset --hard origin/main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate monitor
        run: |
          python -m py_compile scripts/war_peace_reconstruction_watch.py
          python -m py_compile scripts/war_peace_reconstruction_watch_runner.py
          python -m py_compile scripts/war_peace_reconstruction_watch_clean.py
          python -m py_compile scripts/war_peace_reconstruction_watch_live.py
          python -m py_compile scripts/war_peace_reconstruction_watch_precise.py
          python -m py_compile scripts/war_peace_reconstruction_watch_breaking.py
          python -m py_compile scripts/war_peace_reconstruction_watch_flashwire.py
          python -m py_compile scripts/war_peace_reconstruction_watch_interfax.py
          python -m py_compile scripts/war_peace_reconstruction_watch_apflash.py
          python -m py_compile scripts/war_peace_reconstruction_watch_maxcapture.py
          python -m py_compile scripts/war_peace_reconstruction_watch_compact.py
          python -m py_compile scripts/war_peace_reconstruction_watch_redage.py
          python -m py_compile scripts/war_peace_reconstruction_watch_reciprocal.py
          python -m py_compile scripts/war_peace_reconstruction_watch_allies.py
          python -m py_compile scripts/war_peace_reconstruction_watch_newideas.py
          python -m py_compile scripts/war_peace_reconstruction_watch_winter.py
          python -m py_compile scripts/war_peace_reconstruction_watch_axiosfeed.py
          python -m py_compile scripts/war_peace_reconstruction_watch_finalcompact.py
          python -m py_compile scripts/war_peace_reconstruction_watch_counterstrike.py
          python -m py_compile scripts/war_peace_reconstruction_watch_barrage_energy.py
          python -m py_compile scripts/war_peace_reconstruction_watch_bodycolor.py
          python -m py_compile scripts/war_peace_reconstruction_watch_bodycolor_parallel.py
          python -m py_compile scripts/war_peace_reconstruction_watch_bodycolor_strict.py
          python -m py_compile scripts/war_peace_reconstruction_watch_relevance_guard.py
          python -m py_compile scripts/war_peace_reconstruction_watch_final_color_guard.py
          python -m py_compile scripts/war_peace_reconstruction_watch_disaster_recovery.py
          python -m py_compile scripts/war_peace_reconstruction_watch_disaster_verify.py
          python -m py_compile scripts/war_peace_reconstruction_watch_houthi_maritime.py
          python -m py_compile scripts/war_peace_reconstruction_watch_aluminium_supply.py
          python -m py_compile scripts/war_peace_reconstruction_watch_gulf_diplomacy.py
          python -m py_compile scripts/war_peace_reconstruction_watch_hormuz_oman.py
          python -m py_compile scripts/war_peace_reconstruction_watch_energy_ceasefire.py
          python -m py_compile scripts/war_peace_reconstruction_watch_diplomacy_flash.py
          python -m py_compile scripts/war_peace_reconstruction_watch_oct04_guard.py
          python -m py_compile scripts/test_war_peace_regression.py
          python -m py_compile scripts/test_war_peace_oct04_regression.py
          python scripts/test_war_peace_regression.py
          python scripts/test_war_peace_oct04_regression.py
      - name: Check war peace reconstruction conditions
        run: |
          if [ "$TELEGRAM_TEST" = "true" ]; then
            python scripts/war_peace_reconstruction_watch_oct04_guard.py --telegram-test
          else
            python scripts/war_peace_reconstruction_watch_oct04_guard.py
          fi
      - name: Publish status summary
        if: always()
        run: |
          if [ -f out/war_peace_reconstruction_watch.md ]; then cat out/war_peace_reconstruction_watch.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f out/war_peace_reconstruction_alert.txt ]; then printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"; cat out/war_peace_reconstruction_alert.txt >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Send Telegram alert
        if: env.DRY_RUN != 'true' && hashFiles('out/war_peace_reconstruction_alert.txt') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.WAR_PEACE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.WAR_PEACE_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900_bot"
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.error, urllib.parse, urllib.request

          def request_json(req, retries=3):
              last = None
              for attempt in range(1, retries + 1):
                  try:
                      with urllib.request.urlopen(req, timeout=25) as r:
                          return json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      last = e
                      if e.code not in (429, 500, 502, 503, 504) or attempt == retries:
                          raise
                      retry_after = e.headers.get("Retry-After")
                      time.sleep(float(retry_after) if retry_after else 2 * attempt)
                  except urllib.error.URLError as e:
                      last = e
                      if attempt == retries:
                          raise
                      time.sleep(2 * attempt)
              raise RuntimeError(f"Telegram request failed: {last}")

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          if not token or not chat_id: raise RuntimeError("WAR_PEACE Telegram secret missing")

          identity = request_json(f"https://api.telegram.org/bot{token}/getMe")
          actual = identity.get("result", {}).get("username", "")
          if not identity.get("ok") or actual != expected:
              raise RuntimeError(f"Telegram bot mismatch: expected @{expected}, got @{actual or 'unknown'}")

          text = pathlib.Path("out/war_peace_reconstruction_alert.txt").read_text(encoding="utf-8").strip()

          def split_messages(src, limit=3900):
              if len(src) <= limit:
                  return [src]
              chunks, current = [], ""
              for line in src.splitlines():
                  candidate = line if not current else current + "\n" + line
                  if len(candidate) <= limit:
                      current = candidate
                      continue
                  if current:
                      chunks.append(current)
                      current = ""
                  if len(line) > limit:
                      raise RuntimeError(f"Telegram single line too long: {len(line)}")
                  current = line
              if current:
                  chunks.append(current)
              return chunks

          message_ids = []
          chunks = split_messages(text)
          for idx, chunk in enumerate(chunks, 1):
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              result = request_json(req)
              if not result.get("ok"): raise RuntimeError(f"Telegram rejected: {result}")
              message_id = result.get("result", {}).get("message_id")
              if not message_id: raise RuntimeError(f"Telegram response missing message_id: {result}")
              message_ids.append(message_id)
              print(f"telegram_chunk_confirmed={idx}/{len(chunks)} message_id={message_id}")

          print(
              f"telegram_delivery_confirmed=true bot=@{actual} "
              f"message_ids={','.join(map(str, message_ids))}"
          )
          PY
      - name: Finalize state after confirmed delivery
        if: success() && env.DRY_RUN != 'true' && hashFiles('out/war_peace_reconstruction_alert.txt') != ''
        run: python scripts/war_peace_reconstruction_watch_oct04_guard.py --finalize
      - name: Commit confirmed alert state
        if: success() && env.DRY_RUN != 'true' && hashFiles('data/war_peace_reconstruction_watch_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/war_peace_reconstruction_watch_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update war peace reconstruction watch state"
            ok=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then ok=true; break; fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep $((attempt * 2))
            done
            if [ "$ok" != "true" ]; then
              echo "state_push_failed_after_retries=true"
              exit 1
            fi
          fi
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: war-peace-reconstruction-${{ github.run_id }}
          path: |
            out/war_peace_reconstruction_watch.md
            out/war_peace_reconstruction_alert.txt
            out/war_peace_reconstruction_pending.json
          if-no-files-found: ignore
          retention-days: 7
