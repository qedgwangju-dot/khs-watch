name: BOJ policy path change Telegram alert

on:
  schedule:
    # Dedicated BOJ policy-path lane. GitHub cron is UTC; offset from yen-carry jobs.
    # Avoid the start-of-hour high-load window documented by GitHub Actions.
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
  workflow_run:
    # Redundant trigger: the dedicated 5-minute schedule can be delayed or dropped by GitHub.
    # Re-check BOJ policy whenever an existing macro/yen lane completes on main.
    workflows:
      - "Yen carry unwind Telegram alert"
      - "Global Rates & Yen Carry Telegram Watch"
      - "Yen carry monitor watchdog"
      - "Japan BOJ JGB Integrated Watch"
    types:
      - completed
  push:
    paths:
      - ".github/workflows/boj-policy-lead-alert.yml"
      - "scripts/boj_policy_lead_alert.py"
      - "scripts/yen_carry_fx_shock.py"
      - "scripts/khs_source_fetch.py"
      - "tests/test_boj_policy_lead_alert.py"
  pull_request:
    paths:
      - ".github/workflows/boj-policy-lead-alert.yml"
      - "scripts/boj_policy_lead_alert.py"
      - "scripts/yen_carry_fx_shock.py"
      - "scripts/khs_source_fetch.py"
      - "tests/test_boj_policy_lead_alert.py"

permissions:
  contents: write

concurrency:
  group: boj-policy-lead-alert
  # Do not cancel a run after Telegram send but before state finalization.
  # Queued runs will read the finalized state and suppress duplicates.
  cancel-in-progress: false

jobs:
  monitor:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs8879887988798879_bot"
      KHS_SOURCE_PROXY_URL: "https://tips-yield-telegram.gustnd1.workers.dev/policy-source/fetch"
      KHS_SOURCE_PROXY_FIRST: "true"
      KHS_SOURCE_PROXY_TIMEOUT_SECONDS: "20"
      KHS_SOURCE_DIRECT_TIMEOUT_CAP_SECONDS: "10"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # workflow_run can point at the triggering workflow's older SHA.
          # Always use latest main for live monitors so the newest alert state is read.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BOJ document parser
        run: pip install --disable-pip-version-check pypdf googlenewsdecoder==0.1.7

      - name: Validate BOJ policy path monitor
        run: |
          python -m py_compile scripts/boj_policy_lead_alert.py
          python -m unittest tests/test_boj_policy_lead_alert.py -v

      - name: Check BOJ policy path changes
        run: python scripts/boj_policy_lead_alert.py

      - name: Recheck latest BOJ state before Telegram send
        if: env.TELEGRAM_DRY_RUN != 'true' && hashFiles('out/boj_policy_lead_alert.json') != ''
        run: |
          git fetch origin main
          if git show origin/main:data/boj_policy_lead_alert_state.json > /tmp/boj_remote_state.json 2>/dev/null; then
            python scripts/boj_policy_lead_alert.py --guard-state /tmp/boj_remote_state.json
          else
            cp data/boj_policy_lead_alert_state.json /tmp/boj_remote_state.json
            python scripts/boj_policy_lead_alert.py --guard-state /tmp/boj_remote_state.json
          fi

      - name: Publish status summary
        if: always()
        run: |
          if [ -f out/boj_policy_lead_watch.md ]; then
            cat out/boj_policy_lead_watch.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BOJ 정책경로 감시 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/boj_policy_lead_alert.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/boj_policy_lead_alert.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preview pull request alert without sending
        if: env.TELEGRAM_DRY_RUN == 'true' && hashFiles('out/boj_policy_lead_alert.md') != ''
        run: |
          echo "텔레그램 미전송 검증 — 대상 봇 @khs8879887988798879_bot" >> "$GITHUB_STEP_SUMMARY"

      - name: Send BOJ policy path alert through khs dedicated bot only
        if: env.TELEGRAM_DRY_RUN != 'true' && hashFiles('out/boj_policy_lead_alert.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "GLOBAL_RATES_TELEGRAM_BOT_TOKEN이 없습니다. 다른 봇으로 대체 송출하지 않습니다." >&2
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "GLOBAL_RATES_TELEGRAM_CHAT_ID가 없습니다. 다른 채팅으로 대체 송출하지 않습니다." >&2
            exit 1
          fi

          python - <<'PY'
          import datetime as dt
          import html
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")

          with urllib.request.urlopen(
              urllib.request.Request(f"https://api.telegram.org/bot{token}/getMe"), timeout=25
          ) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot configured: expected @{expected}, got @{actual or 'unknown'}")

          title = pathlib.Path("out/boj_policy_lead_alert_title.txt").read_text(encoding="utf-8").strip()
          body = pathlib.Path("out/boj_policy_lead_alert.md").read_text(encoding="utf-8").strip()
          raw = f"{title}\n\n{body}"
          rendered = []
          for line in raw.splitlines():
              if line.startswith("원문: "):
                  source_url = line[len("원문: "):].strip()
                  rendered.append(f'<a href="{html.escape(source_url, quote=True)}">원문</a>')
              else:
                  rendered.append(html.escape(line))
          text = "\n".join(rendered)
          if len(text) > 4096:
              raise RuntimeError(f"BOJ Telegram message too long after HTML rendering: {len(text)}")
          payload = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method="POST"
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected BOJ policy message: {result}")

          confirmed = {
              "status": "confirmed",
              "lane": "boj_policy",
              "bot_username": actual,
              "route_secret": "GLOBAL_RATES_TELEGRAM_*",
              "message_id": result.get("result", {}).get("message_id"),
              "render_mode": "HTML",
              "source_link_label": "원문",
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/boj_policy_lead_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(
              "telegram_delivery_confirmed=true lane=boj_policy "
              f"bot_username=@{actual} message_id={confirmed['message_id']} render_mode=HTML source_link=원문"
          )
          PY

      - name: Finalize BOJ policy alert state
        if: always() && env.TELEGRAM_DRY_RUN != 'true'
        run: python scripts/boj_policy_lead_alert.py --finalize

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boj-policy-lead-${{ github.run_id }}
          path: |
            out/boj_policy_lead_watch.md
            out/boj_policy_lead_alert.md
            out/boj_policy_lead_alert.json
            out/boj_policy_market_context.json
            out/boj_policy_lead_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit confirmed BOJ policy state
        if: always() && github.event_name != 'pull_request' && hashFiles('data/boj_policy_lead_alert_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          snapshot="$(mktemp)"
          cp data/boj_policy_lead_alert_state.json "$snapshot"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot" data/boj_policy_lead_alert_state.json
            git add data/boj_policy_lead_alert_state.json

            if git diff --cached --quiet; then
              echo "BOJ 정책경로 상태 변경 없음 또는 동일한 최신 상태가 이미 반영됨"
              exit 0
            fi

            git commit -m "Update BOJ policy path alert state"
            if git push origin HEAD:main; then
              echo "BOJ 정책경로 상태 저장 완료"
              exit 0
            fi

            sleep $((attempt * 3))
          done

          echo "BOJ 정책경로 상태 저장 실패 — 텔레그램 송출 확인과 상태 저장을 구분해 재시도 필요" >&2
          exit 1

# push self-test is intentionally enabled so changes to this monitor validate immediately.