name: Treasury CTA squeeze Telegram alert

on:
  push:
    paths:
      - "scripts/treasury_cta_squeeze_watch.py"
      - "scripts/treasury_cta_squeeze_execution_watch.py"
      - "scripts/treasury_cta_squeeze_market_watch.py"
      - "scripts/treasury_cta_squeeze_audited_watch.py"
      - "scripts/treasury_cta_squeeze_equity_watch.py"
      - ".github/workflows/treasury-cta-squeeze-telegram-alert.yml"
      - "tests/test_treasury_alert_root_guards.py"
  schedule:
    # Regular market-hours monitoring: 21:00~08:45 KST, every 15 minutes.
    - cron: "*/15 12-23 * * 1-5"
    # Important-event precheck: 20:40 KST, with a 20:47 backup. State dedupe allows one send.
    - cron: "40 11 * * 1-5"
    - cron: "47 11 * * 1-5"
    # Monday 07:00 KST primary report. Backups are spread out because GitHub
    # scheduled events can be delayed/dropped around busy clock boundaries.
    # State dedupe ensures that only the first successful slot sends.
    - cron: "0 22 * * 0"
    - cron: "3 22 * * 0"
    - cron: "13 22 * * 0"
    - cron: "30 22 * * 0"
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treasury-cta-squeeze-telegram-alert
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs88798879887988798879_bot"
      CTA_TRIGGER_EVENT: ${{ github.event_name }}
      CTA_TRIGGER_SCHEDULE: ${{ github.event.schedule || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -q pypdf pytest

      - name: Verify exact Telegram route
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TREASURY_FOREIGN_DEMAND_TELEGRAM_BOT_TOKEN }}
          PRIMARY_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          FALLBACK_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          TELEGRAM_CHAT_ID="${PRIMARY_CHAT_ID:-$FALLBACK_CHAT_ID}"
          export TELEGRAM_CHAT_ID
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "CTA Telegram token missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "CTA Telegram chat id missing"; exit 1; }
          python - <<'PY'
          import json, os, time, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          expected=os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          last=None
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe",timeout=25) as r:
                      j=json.loads(r.read().decode())
                  actual=str((j.get("result") or {}).get("username") or "")
                  if not j.get("ok") or actual.lower()!=expected.lower():
                      raise RuntimeError(f"Wrong CTA Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
                  print(f"telegram_route_valid=true bot=@{actual} chat_id_present=true")
                  break
              except Exception as exc:
                  last=exc
                  if attempt == 2:
                      raise
                  time.sleep(2*(attempt+1))
          PY

      - name: Validate CTA squeeze watcher
        run: |
          python -m py_compile scripts/treasury_cta_squeeze_watch.py
          python -m py_compile scripts/treasury_cta_squeeze_execution_watch.py
          python -m py_compile scripts/treasury_cta_squeeze_market_watch.py
          python -m py_compile scripts/treasury_cta_squeeze_audited_watch.py
          python -m py_compile scripts/treasury_cta_squeeze_equity_watch.py
          pytest -q tests/test_treasury_cta_nasdaq_squeeze.py
          pytest -q tests/test_treasury_alert_root_guards.py

      - name: Check CTA squeeze chain
        run: |
          rm -f out/treasury_cta_squeeze_alert.html out/treasury_cta_squeeze_title.txt out/treasury_cta_squeeze_detail.json out/treasury_cta_squeeze_telegram_confirmed.json
          for attempt in 1 2 3; do
            if python scripts/treasury_cta_squeeze_equity_watch.py; then
              exit 0
            fi
            echo "CTA chain transient failure; retry $attempt/3" >&2
            rm -f out/treasury_cta_squeeze_alert.html out/treasury_cta_squeeze_title.txt out/treasury_cta_squeeze_detail.json out/treasury_cta_squeeze_telegram_confirmed.json
            sleep $((attempt * 4))
          done
          exit 1

      - name: Send interpreted Telegram alert
        if: hashFiles('out/treasury_cta_squeeze_alert.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TREASURY_FOREIGN_DEMAND_TELEGRAM_BOT_TOKEN }}
          PRIMARY_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          FALLBACK_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          TELEGRAM_CHAT_ID="${PRIMARY_CHAT_ID:-$FALLBACK_CHAT_ID}"
          export TELEGRAM_CHAT_ID
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat=os.environ["TELEGRAM_CHAT_ID"].strip()
          expected=os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe",timeout=25) as r:
              ident=json.loads(r.read().decode())
          actual=str((ident.get("result") or {}).get("username") or "")
          if not ident.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"잘못된 봇 경로: expected @{expected}, got @{actual or 'unknown'}")
          title=pathlib.Path("out/treasury_cta_squeeze_title.txt").read_text(encoding="utf-8").strip()
          body=pathlib.Path("out/treasury_cta_squeeze_alert.html").read_text(encoding="utf-8").strip()
          text=f"<b>{title}</b>\n\n{body}"
          if len(text)>4096:
              raise RuntimeError(f"Telegram text too long: {len(text)}")
          data=urllib.parse.urlencode({"chat_id":chat,"text":text,"parse_mode":"HTML","disable_web_page_preview":"true"}).encode()
          req=urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage",data=data,method="POST")
          with urllib.request.urlopen(req,timeout=25) as r:
              result=json.loads(r.read().decode())
          if not result.get("ok"):
              raise RuntimeError(result)
          pathlib.Path("out/treasury_cta_squeeze_telegram_confirmed.json").write_text(
              json.dumps({"bot_username":actual,"message_id":(result.get("result") or {}).get("message_id")},ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          PY

      - name: Record Telegram delivery truth
        if: always()
        run: |
          if [ -f out/treasury_cta_squeeze_telegram_confirmed.json ]; then
            python - <<'PY'
          import json, pathlib
          p=pathlib.Path("out/treasury_cta_squeeze_telegram_confirmed.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          status=pathlib.Path("out/treasury_cta_squeeze_status.md")
          with status.open("a", encoding="utf-8") as f:
              f.write(f"- 텔레그램 최종 전달: 확인 · bot=@{j.get('bot_username','unknown')} · message_id={j.get('message_id')}\n")
          PY
          elif [ -f out/treasury_cta_squeeze_alert.html ]; then
            echo "- 텔레그램 최종 전달: 미확인 — 알림 파일은 있으나 Telegram 확인 파일 없음" >> out/treasury_cta_squeeze_status.md
          else
            echo "- 텔레그램 최종 전달: 발송 조건 미충족" >> out/treasury_cta_squeeze_status.md
          fi

      - name: Finalize CTA state
        if: success() && hashFiles('data/treasury_cta_squeeze_state_next.json') != ''
        run: |
          python - <<'PY'
          import pathlib
          src=pathlib.Path("data/treasury_cta_squeeze_state_next.json")
          dst=pathlib.Path("data/treasury_cta_squeeze_state.json")
          alert=pathlib.Path("out/treasury_cta_squeeze_alert.html").exists()
          confirmed=pathlib.Path("out/treasury_cta_squeeze_telegram_confirmed.json").exists()
          if alert and not confirmed:
              raise RuntimeError("CTA 중요신호 감지 후 텔레그램 확인 없음")
          dst.write_text(src.read_text(encoding="utf-8"),encoding="utf-8")
          PY

      - name: Commit CTA state
        if: success() && hashFiles('data/treasury_cta_squeeze_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/treasury_cta_squeeze_state.json /tmp/treasury_cta_squeeze_state.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/treasury_cta_squeeze_state.json data/treasury_cta_squeeze_state.json
            git add data/treasury_cta_squeeze_state.json
            if git diff --cached --quiet; then
              echo "상태 변경 없음"
              exit 0
            fi
            git commit -m "Update Treasury CTA squeeze state"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "CTA state push race detected; retry $attempt/4"
            sleep $((attempt * 3))
          done
          echo "CTA 상태 저장을 4회 재시도했지만 실패했습니다." >&2
          exit 1

      - name: Upload CTA verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-cta-squeeze-${{ github.run_id }}
          path: |
            out/treasury_cta_squeeze_status.md
            out/treasury_cta_squeeze_alert.html
            out/treasury_cta_squeeze_detail.json
            out/treasury_cta_squeeze_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14