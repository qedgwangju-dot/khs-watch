name: BOK Asset Tokenization Telegram Smoke Test

on:
  push:
    paths:
      - ".github/workflows/bok-asset-tokenization-smoketest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs88790088790000_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Telegram smoke test and record receipt
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOK_ASSET_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json, os, pathlib, urllib.parse, urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          chat_id = (os.getenv('TELEGRAM_CHAT_ID_PRIMARY') or os.getenv('TELEGRAM_CHAT_ID_FALLBACK') or '').strip()
          expected = (os.getenv('EXPECTED_TELEGRAM_BOT_USERNAME') or '').strip().lstrip('@')
          if not token:
              raise RuntimeError('BOK_ASSET_TELEGRAM_BOT_TOKEN secret is missing')
          if not chat_id:
              raise RuntimeError('Telegram chat id secret is missing')

          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
              identity = json.loads(r.read().decode('utf-8'))
          username = str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or username.lower() != expected.lower():
              raise RuntimeError(f'Wrong Telegram bot: expected @{expected}, got @{username or "unknown"}')

          now_dt = dt.datetime.now(ZoneInfo('Asia/Seoul'))
          now_iso = now_dt.isoformat(timespec='seconds')
          now_display = now_dt.strftime('%Y-%m-%d %H:%M KST')
          text = (
              '🔔 <b>한국은행 자산토큰화·국채토큰화</b>\n'
              '<b>가독성 업그레이드 테스트</b>\n\n'
              f'<b>신규 5건 · 1개 이슈</b>  ·  {now_display}\n\n'
              '<blockquote>📄 <b>1. 자산 토큰화</b>\n'
              '<b>토큰증권 정책방향 발표- 민·관 합동 토큰증권 협의체 3차회의 개최</b>\n'
              '<b>핵심 해석</b>  토큰증권을 조각투자 중심 논의에서 주식·채권·펀드와 스테이블코인 결제까지 확장하는 단계별 국가 인프라 로드맵입니다.\n\n'
              '<b>핵심 내용</b>  금융위가 조각투자뿐 아니라 주식·채권·펀드까지 토큰화 범위를 넓히고, 발행·유통·결제를 단계별로 제도권 인프라에 올리는 정책방향을 확정했습니다.\n'
              '<b>1단계 · 2027.2.4</b>  기관투자자 전용 사모MMF·사모사채, 신탁방식 비상장주식, 공모 조각투자증권 토큰화를 시작합니다.\n'
              '<b>한국거래소</b>  NYSE·Nasdaq 파일럿을 참고해 상장주식 토큰화 모델검증·시범사업을 병행합니다.\n'
              '<b>2단계</b>  1단계 안정성·효율성과 시장수요를 점검하며 공모증권 등으로 확대합니다.\n'
              '<b>3단계</b>  스테이블코인 등을 결제수단으로 연결해 온체인 결제를 구현합니다.\n'
              '<b>전환 조건</b>  1단계 안정성·효율성, 기술혁신 속도, 스테이블코인 법제화에 따라 2·3단계 시점이 달라집니다.\n'
              '<b>유통</b>  기존 인가 범위 내 별도 추가인가 없이 취급 가능하며, 장외거래소 일반투자자는 거래소별 연간 순매수 1억원 한도입니다.\n'
              '<b>등록요건</b>  발행인 계좌관리기관은 자기자본 40억원과 전문인력·전산·보안 요건을 갖추는 방향입니다.\n'
              '<b>다음 일정</b>  2026년 9월말 하위법규 입법예고 → 예탁원·증권사 인프라 구축 → 2027년 2월 4일 1단계 시행.\n\n'
              '출처  금융위원회 금융정책\n'
              '원문  <a href="https://www.fsc.go.kr/po010101/87650"><b>정책본문</b></a> · '
              '<a href="https://www.fsc.go.kr/comm/getFile?srvcId=BBSTY1&amp;upperNo=87650&amp;fileTy=ATTACH&amp;fileNo=2"><b>보도자료 PDF</b></a> · '
              '<a href="https://www.fsc.go.kr/comm/getFile?srvcId=BBSTY1&amp;upperNo=87650&amp;fileTy=ATTACH&amp;fileNo=3"><b>정책방향</b></a> · '
              '<a href="https://www.fsc.go.kr/comm/getFile?srvcId=BBSTY1&amp;upperNo=87650&amp;fileTy=ATTACH&amp;fileNo=5"><b>표준요건</b></a></blockquote>'
          )
          payload = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'HTML',
              'disable_web_page_preview': 'true',
          }).encode('utf-8')
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=payload, method='POST')
          with urllib.request.urlopen(req, timeout=25) as r:
              result = json.loads(r.read().decode('utf-8'))
          if not result.get('ok'):
              raise RuntimeError(f'Telegram rejected message: {result}')

          receipt = {
              'status': 'confirmed',
              'bot_username': username,
              'message_id': (result.get('result') or {}).get('message_id'),
              'confirmed_at_kst': now_iso,
              'route': 'GitHub Actions -> Python -> Telegram Bot API',
              'link_format': 'HTML text_link',
              'layout': 'grouped_roadmap_full_information',
          }
          pathlib.Path('data').mkdir(exist_ok=True)
          pathlib.Path('data/bok_asset_tokenization_smoketest_newbot.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, ensure_ascii=False))
          PY

      - name: Commit smoke test receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bok_asset_tokenization_smoketest_newbot.json
          git commit -m "Record BOK grouped roadmap Telegram smoke test receipt"
          git pull --rebase origin main
          git push
