name: BOK Asset Tokenization Telegram Smoke Test

on:
  push:
    paths:
      - ".github/workflows/bok-asset-tokenization-smoketest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs88790088790000_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Telegram smoke test and record receipt
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOK_ASSET_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json, os, pathlib, urllib.parse, urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          chat_id = (os.getenv('TELEGRAM_CHAT_ID_PRIMARY') or os.getenv('TELEGRAM_CHAT_ID_FALLBACK') or '').strip()
          expected = (os.getenv('EXPECTED_TELEGRAM_BOT_USERNAME') or '').strip().lstrip('@')
          if not token:
              raise RuntimeError('BOK_ASSET_TELEGRAM_BOT_TOKEN secret is missing')
          if not chat_id:
              raise RuntimeError('Telegram chat id secret is missing')

          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
              identity = json.loads(r.read().decode('utf-8'))
          username = str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or username.lower() != expected.lower():
              raise RuntimeError(f'Wrong Telegram bot: expected @{expected}, got @{username or "unknown"}')

          now_dt = dt.datetime.now(ZoneInfo('Asia/Seoul'))
          now_iso = now_dt.isoformat(timespec='seconds')
          now_display = now_dt.strftime('%Y-%m-%d %H:%M KST')
          text = (
              '🔔 <b>한국은행 자산토큰화·국채토큰화</b>\n'
              '<b>제목 + 핵심 해석 가독성 테스트</b>\n\n'
              f'<b>신규 3건</b>  ·  {now_display}\n\n'
              '<blockquote>📄 <b>1. 자산 토큰화</b>\n'
              '<b>토큰증권 정책방향 발표 · 보도자료 · PDF</b>\n'
              '<b>핵심</b>  토큰증권 발행·유통과 제도권 인프라의 세부 기준을 구체화하는 정책 업데이트입니다.\n'
              '출처  금융위원회 금융정책  ·  <a href="https://www.fsc.go.kr/po010101/87650"><b>원문</b></a></blockquote>\n\n'
              '<blockquote>🏛 <b>2. 국채 토큰화</b>\n'
              '<b>국채 토큰화 실증 관련 공식 발표</b>\n'
              '<b>핵심</b>  CBDC·예금토큰과 국채토큰을 연결하는 실증의 일정·참여기관·결제 구조를 확인할 핵심 업데이트입니다.\n'
              '출처  한국은행 보도자료  ·  <a href="https://www.bok.or.kr/"><b>원문</b></a></blockquote>\n\n'
              '<blockquote>🛠 <b>3. 시스템 구축·조달</b>\n'
              '<b>토큰증권 분산원장 표준요건 가이드라인 · 별첨3 · PDF</b>\n'
              '<b>핵심</b>  토큰증권을 실제 금융시스템에 올릴 때 필요한 분산원장 기술·운영 기준을 구체화한 실무 가이드입니다.\n'
              '출처  금융위원회 금융정책  ·  <a href="https://www.fsc.go.kr/comm/getFile?srvcId=BBSTY1&amp;upperNo=87650&amp;fileTy=ATTACH&amp;fileNo=5"><b>원문</b></a></blockquote>'
          )
          payload = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'HTML',
              'disable_web_page_preview': 'true',
          }).encode('utf-8')
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=payload, method='POST')
          with urllib.request.urlopen(req, timeout=25) as r:
              result = json.loads(r.read().decode('utf-8'))
          if not result.get('ok'):
              raise RuntimeError(f'Telegram rejected message: {result}')

          receipt = {
              'status': 'confirmed',
              'bot_username': username,
              'message_id': (result.get('result') or {}).get('message_id'),
              'confirmed_at_kst': now_iso,
              'route': 'GitHub Actions -> Python -> Telegram Bot API',
              'link_format': 'HTML text_link',
              'layout': 'headline_core_plain_font_cards',
          }
          pathlib.Path('data').mkdir(exist_ok=True)
          pathlib.Path('data/bok_asset_tokenization_smoketest_newbot.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, ensure_ascii=False))
          PY

      - name: Commit smoke test receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bok_asset_tokenization_smoketest_newbot.json
          git commit -m "Record BOK headline-core Telegram smoke test receipt"
          git pull --rebase origin main
          git push
