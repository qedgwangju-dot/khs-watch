name: Patch frontier watch to HBM Telegram secrets

on:
  push:
    paths:
      - ".github/workflows/patch-frontier-hbm-secrets-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch frontier workflows to HBM Telegram secrets
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/workflows/frontier-model-spend-watch-telegram.yml'),
              Path('.github/workflows/frontier-model-spend-telegram-smoketest-v2.yml'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = text.replace('secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN', 'secrets.HBM_TELEGRAM_BOT_TOKEN')
              text = text.replace('secrets.KHS_POLICY_TELEGRAM_CHAT_ID', 'secrets.HBM_TELEGRAM_CHAT_ID')
              text = text.replace('KHS_POLICY_TELEGRAM_BOT_TOKEN secret is missing', 'HBM_TELEGRAM_BOT_TOKEN secret is missing')
              text = text.replace('KHS_POLICY_TELEGRAM_CHAT_ID secret is missing', 'HBM_TELEGRAM_CHAT_ID secret is missing')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/frontier-model-spend-watch-telegram.yml .github/workflows/frontier-model-spend-telegram-smoketest-v2.yml
          if git diff --cached --quiet; then
            echo "No patch required"
          else
            git commit -m "Use HBM Telegram secrets for frontier model watch"
            git pull --rebase origin main
            git push
          fi
