name: Jobs Wage Watch Telegram

on:
  push:
    paths:
      - ".github/workflows/jobs-wage-watch-telegram.yml"
      - "scripts/jobs_wage_watch.py"
      - "scripts/jobs_wage_watch_runner.py"
      - "scripts/jobs_wage_watch_entry.py"
      - "scripts/jobs_wage_watch_full_report.py"
      - "scripts/jobs_wage_watch_full_report_v2.py"
      - "scripts/jobs_wage_watch_full_report_v3.py"
      - "scripts/jobs_wage_watch_full_report_v4.py"
      - "scripts/jobs_wage_watch_full_report_v5.py"
      - "scripts/jobs_wage_watch_full_report_v6.py"
      - "scripts/jobs_wage_watch_full_report_v7.py"
      - "scripts/jobs_wage_watch_full_report_v8.py"
      - "scripts/jobs_wage_watch_full_report_v9.py"
      - "data/jobs_wage_watch_state.json"
      - "data/jobs_wage_full_state.json"
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobs-wage-watch-telegram
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs88798879887988798879_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 pypdf

      - name: Check official BLS DOL ADP releases
        run: python scripts/jobs_wage_watch_entry.py

      - name: Publish watcher summary
        if: always()
        run: |
          if [ -f out/jobs_wage_watch_status.md ]; then
            cat out/jobs_wage_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Jobs Wage 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send new official release to Telegram
        if: hashFiles('out/jobs_wage_watch_alert.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.JOBS_WAGE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.JOBS_WAGE_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("JOBS_WAGE_TELEGRAM_BOT_TOKEN secret is missing")
          if not chat_id:
              raise RuntimeError("Jobs Wage Telegram chat id is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          text = pathlib.Path("out/jobs_wage_watch_alert.md").read_text(encoding="utf-8").strip()

          def split_message(value, limit=3900):
              chunks = []
              current = ""
              for paragraph in value.split("\n\n"):
                  candidate = paragraph if not current else current + "\n\n" + paragraph
                  if len(candidate) <= limit:
                      current = candidate
                      continue
                  if current:
                      chunks.append(current)
                      current = ""
                  while len(paragraph) > limit:
                      cut = paragraph.rfind("\n", 0, limit)
                      if cut < 1:
                          cut = limit
                      chunks.append(paragraph[:cut])
                      paragraph = paragraph[cut:].lstrip()
                  current = paragraph
              if current:
                  chunks.append(current)
              return chunks

          message_ids = []
          for idx, chunk in enumerate(split_message(text), start=1):
              if idx > 1:
                  chunk = f"Jobs Wage Watch (계속 {idx})\n\n{chunk}"
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=25) as r:
                  result = json.loads(r.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              message_ids.append(result.get("result", {}).get("message_id"))

          confirmed = {
              "status": "confirmed",
              "bot_username": username,
              "message_ids": message_ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/jobs_wage_watch_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"telegram_delivery_confirmed=true bot=@{username} message_ids={message_ids}")
          PY

      - name: Persist dedupe and full-analysis state only after confirmed delivery
        if: success() && hashFiles('out/jobs_wage_watch_alert.md') != '' && hashFiles('out/jobs_wage_watch_telegram_confirmed.json') != ''
        run: |
          cp out/jobs_wage_watch_pending_state.json data/jobs_wage_watch_state.json
          if [ -f out/jobs_wage_full_state_pending.json ]; then
            cp out/jobs_wage_full_state_pending.json data/jobs_wage_full_state.json
          fi
          python - <<'PY'
          import json
          import pathlib
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = pathlib.Path("data/jobs_wage_watch_state.json")
          state = json.loads(path.read_text(encoding="utf-8"))
          confirmed = json.loads(pathlib.Path("out/jobs_wage_watch_telegram_confirmed.json").read_text(encoding="utf-8"))
          state["last_successful_delivery_kst"] = confirmed.get("confirmed_at_kst")
          state["telegram_message_ids"] = confirmed.get("message_ids")
          state["bot_username"] = confirmed.get("bot_username")
          state["state_updated_at_kst"] = datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds")
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit confirmed states
        if: success() && hashFiles('out/jobs_wage_watch_telegram_confirmed.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs_wage_watch_state.json
          if [ -f data/jobs_wage_full_state.json ]; then
            git add data/jobs_wage_full_state.json
          fi
          if git diff --cached --quiet; then
            echo "Jobs Wage state unchanged"
          else
            git commit -m "Record Jobs Wage Telegram delivery and analysis vintage"
            git pull --rebase origin main
            git push
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-wage-watch-${{ github.run_id }}
          path: |
            out/jobs_wage_watch_status.md
            out/jobs_wage_watch_alert.md
            out/jobs_wage_watch_alert.json
            out/jobs_wage_watch_telegram_confirmed.json
            out/jobs_wage_full_state_pending.json
          if-no-files-found: ignore
          retention-days: 14