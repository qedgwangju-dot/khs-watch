name: Treasury 30Y Telegram send smoke once
on:
  push:
    paths:
      - ".github/workflows/treasury-30y-telegram-send-smoke-once.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4
      - name: Send one clearly labeled non-market smoke test
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from treasury_30y_jpm_threshold_watch import send_telegram
          message=(
              "[시험 송출 · 실제 금리 돌파 아님]\n"
              "전체 판정: 미 국채 30년물 조건부 경보의 전송경로 확인\n"
              "이 메시지는 가상 시험이며 5.59%·5.78%·6.00%·5.25%·5.15% 돌파를 뜻하지 않습니다.\n"
              "중복 알림을 발생시키지 않으며 기존 포지셔닝 보고 설정을 바꾸지 않습니다."
          )
          mid=send_telegram(message)
          print(f"telegram_delivery_confirmed=true mode=explicit_smoke_test message_id={mid}")
          PY
