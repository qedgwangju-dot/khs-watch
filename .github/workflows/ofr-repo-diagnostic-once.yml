name: Treasury Repo Positioning Validate Once

on:
  push:
    paths:
      - ".github/workflows/ofr-repo-diagnostic-once.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate live repo and positioning data
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")

          import treasury_credit_flow_watch_refinancing as daily
          import treasury_positioning_watch as weekly

          print("DAILY_REPO", daily.get_repo_stress())
          latest, prev, rows = weekly.common_weekly_positions()
          repo = weekly.repo_stress()
          srepo = weekly.sponsored_repo()
          print("CFTC_DATES", latest, prev)
          for k, v in rows.items():
              print("POSITION", k, v)
          print("REPO", repo)
          print("SPONSORED", srepo)
          print("CLASS", weekly.classify(rows, repo, srepo))
          PY
