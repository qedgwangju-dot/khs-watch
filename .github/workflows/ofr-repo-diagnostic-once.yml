name: Treasury Positioning Final Validate Once

on:
  push:
    paths:
      - ".github/workflows/ofr-repo-diagnostic-once.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate daily Repo and weekly CFTC watcher
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import treasury_credit_flow_watch_refinancing as daily
          import treasury_positioning_watch as weekly

          print("DAILY_REPO", daily.get_repo_stress())

          latest, prev, rows = weekly.get_cftc_positions()
          repo = weekly.repo_snapshot()
          print("CFTC", latest, prev)
          for label in ("2년","5년","10년","30년"):
              print(label, rows[label], weekly.position_note(rows[label]))
          print("REPO", repo)
          print("CLASS", weekly.classify(rows, repo))
          PY
