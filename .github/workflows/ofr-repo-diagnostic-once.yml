name: Treasury CFTC Name Diagnostic Once

on:
  push:
    paths:
      - ".github/workflows/ofr-repo-diagnostic-once.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest CFTC contract names
        run: |
          python - <<'PY'
          import requests, json
          base="https://publicreporting.cftc.gov/resource/gpe5-46if.json"
          rows=requests.get(base,params={"$order":"report_date_as_yyyy_mm_dd DESC","$limit":1000},timeout=45).json()
          latest=max(str(x.get("report_date_as_yyyy_mm_dd",""))[:10] for x in rows if x.get("report_date_as_yyyy_mm_dd"))
          print("LATEST",latest)
          names=[]
          for x in rows:
              if str(x.get("report_date_as_yyyy_mm_dd",""))[:10]!=latest: continue
              name=str(x.get("market_and_exchange_names",""))
              if any(w in name.upper() for w in ("NOTE","BOND","UST","TREAS","2-YEAR","5-YEAR","10-YEAR","30-YEAR")):
                  names.append({
                      "name":name,
                      "code":x.get("cftc_contract_market_code"),
                      "long":x.get("lev_money_positions_long"),
                      "short":x.get("lev_money_positions_short"),
                      "oi":x.get("open_interest_all"),
                  })
          for x in names:
              print("MATCH",json.dumps(x,ensure_ascii=False))
          print("COUNT",len(names))
          # also print first 80 names in latest date to identify naming
          allnames=[]
          for x in rows:
              if str(x.get("report_date_as_yyyy_mm_dd",""))[:10]==latest:
                  allnames.append((x.get("market_and_exchange_names"),x.get("cftc_contract_market_code")))
          for item in allnames[:100]:
              print("NAME",item)
          PY
