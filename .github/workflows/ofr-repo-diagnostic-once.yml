name: OFR Repo Diagnostic Once

on:
  push:
    paths:
      - ".github/workflows/ofr-repo-diagnostic-once.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect OFR STFM APIs
        run: |
          python - <<'PY'
          import json, requests

          for dataset in ("fnyr","repo"):
              url=f"https://data.financialresearch.gov/v1/series/dataset?dataset={dataset}"
              p=requests.get(url,timeout=45).json()
              ts=p.get("timeseries") or {}
              print("\nDATASET",dataset,"COUNT",len(ts))
              for k,v in list(ts.items())[:100]:
                  md=(v or {}).get("metadata") or {}
                  data=(v or {}).get("timeseries") or {}
                  name=md.get("description") or md.get("title") or md.get("long_name") or md.get("name") or ""
                  unit=md.get("unit") or md.get("units") or ""
                  if dataset=="fnyr" or any(x in (k+" "+str(name)).upper() for x in ("DVP","TRI","TREAS","REPO")):
                      print("SERIES",k,"NAME",name,"UNIT",unit)
                      print(" META",json.dumps(md,ensure_ascii=False)[:500])
                      if isinstance(data,dict):
                          for sk,sv in data.items():
                              if isinstance(sv,list):
                                  print(" DATA",sk,json.dumps(sv[-4:],ensure_ascii=False)[:600])
                              else:
                                  print(" DATA",sk,json.dumps(sv,ensure_ascii=False)[:600])
          PY
