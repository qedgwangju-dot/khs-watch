name: Verify Bio Telegram Secret

on:
  push:
    paths:
      - ".github/workflows/verify-bio-telegram-secret.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BIO1: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
      BIO2: ${{ secrets.BIOTECH_TELEGRAM_BOT_TOKEN }}
      BIO3: ${{ secrets.ALTEOGEN_TELEGRAM_BOT_TOKEN }}
      BIO4: ${{ secrets.BIO_ALERT_TELEGRAM_BOT_TOKEN }}
      BIO5: ${{ secrets.BIOTECH_ALERT_TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Check candidate bot secrets without exposing tokens
        run: |
          python - <<'PY'
          import json, os, urllib.request
          for name in ('BIO1','BIO2','BIO3','BIO4','BIO5'):
              token=(os.getenv(name) or '').strip()
              if not token:
                  print(f'{name}=missing')
                  continue
              try:
                  with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
                      payload=json.loads(r.read().decode())
                  username=str((payload.get('result') or {}).get('username') or '')
                  print(f'{name}=present BOT_USERNAME=@{username}')
              except Exception as exc:
                  print(f'{name}=present getMe_failed={type(exc).__name__}')
          PY
