name: CLARITY Route Fix Once

on:
  push:
    paths:
      - ".github/workflows/clarity-route-fix-once.yml"

permissions:
  contents: write

concurrency:
  group: clarity-route-fix-once
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move CLARITY to exact target bot route
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/clarity-watch-telegram.yml')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"',
              'EXPECTED_TELEGRAM_BOT_USERNAME: "khs88790088790000_bot"',
          )

          dollar = '$'
          open_expr = '{{'
          close_expr = '}}'
          crypto_token = dollar + open_expr + ' secrets.CRYPTO_LIQUIDITY_TELEGRAM_BOT_TOKEN ' + close_expr
          primary_chat = dollar + open_expr + ' secrets.TELEGRAM_CHAT_ID ' + close_expr
          fallback_chat = dollar + open_expr + ' secrets.YEN_CARRY_TELEGRAM_CHAT_ID ' + close_expr

          text, n_token = re.subn(
              r'(?m)^(\s*TELEGRAM_BOT_TOKEN:)\s*.*YEN_CARRY_TELEGRAM_BOT_TOKEN.*$',
              lambda m: m.group(1) + ' ' + crypto_token,
              text,
          )
          text, n_primary = re.subn(
              r'(?m)^(\s*TELEGRAM_CHAT_ID_PRIMARY:)\s*.*YEN_CARRY_TELEGRAM_CHAT_ID.*$',
              lambda m: m.group(1) + ' ' + primary_chat,
              text,
          )
          text, n_fallback = re.subn(
              r'(?m)^(\s*TELEGRAM_CHAT_ID_FALLBACK:)\s*.*KHS_POLICY_TELEGRAM_CHAT_ID.*$',
              lambda m: m.group(1) + ' ' + fallback_chat,
              text,
          )
          text = text.replace(
              'YEN_CARRY_TELEGRAM_BOT_TOKEN secret is missing',
              'CRYPTO_LIQUIDITY_TELEGRAM_BOT_TOKEN secret is missing',
          )

          if n_token != 2 or n_primary != 2 or n_fallback != 2:
              raise SystemExit(
                  f'unexpected route replacement counts token={n_token} primary={n_primary} fallback={n_fallback}'
              )
          if 'hs8879887988798879_bot' in text:
              raise SystemExit('old CLARITY bot route still present')
          if text.count('khs88790088790000_bot') != 1:
              raise SystemExit('target bot username must appear exactly once')
          if text.count('secrets.CRYPTO_LIQUIDITY_TELEGRAM_BOT_TOKEN') != 2:
              raise SystemExit('target bot token secret must be used in validate + send steps')
          if text.count('secrets.TELEGRAM_CHAT_ID') != 2:
              raise SystemExit('target primary chat secret must be used in validate + send steps')

          path.write_text(text, encoding='utf-8')
          print('clarity_route_rewritten=true target=@khs88790088790000_bot')
          PY

      - name: Commit route correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/clarity-watch-telegram.yml
          git commit -m "Fix CLARITY Telegram bot route"
          git pull --rebase origin main
          git push origin main
