name: QLEX SC Bio Watchdog Fallback

on:
  workflow_run:
    workflows:
      - "Bio QLEX & Intismeran Telegram Watch"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qlex-sc-bio-fallback
  cancel-in-progress: true

jobs:
  recover-if-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide whether dedicated bio watcher is stale
        id: stale
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, json, os, pathlib
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(ZoneInfo('Asia/Seoul'))
          checks=[]
          for path_str in ('data/qlex_sc_conversion_watch_state.json','data/intismeran_qlex_watch_state.json'):
              path=pathlib.Path(path_str)
              last='missing'; age=None
              if path.exists():
                  try:
                      state=json.loads(path.read_text(encoding='utf-8'))
                      last=str(state.get('last_check_kst') or '')
                      if last:
                          stamp=dt.datetime.fromisoformat(last)
                          if stamp.tzinfo is None:
                              stamp=stamp.replace(tzinfo=ZoneInfo('Asia/Seoul'))
                          age=(now-stamp.astimezone(ZoneInfo('Asia/Seoul'))).total_seconds()/60
                  except Exception as exc:
                      print(f'state_parse_error {path_str}: {exc}')
              checks.append((path_str,last,age))
          stale=any(age is None or age >= 70 for _,_,age in checks)
          oldest=max([age for _,_,age in checks if age is not None], default=None)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'run_bio={"true" if stale else "false"}\n')
              f.write(f'age_minutes={"unknown" if oldest is None else round(oldest,1)}\n')
              f.write('last_checks=' + ' | '.join(f'{p}:{last}' for p,last,_ in checks).replace('\n',' ') + '\n')
          print(f'dedicated_bio_fallback_stale={stale} checks={checks}')
          PY

      - name: Verify Telegram route for recovery
        if: steps.stale.outputs.run_bio == 'true'
        id: telegram
        env:
          EXPECTED_TELEGRAM_BOT_USERNAME: "hs887988798879887988798879_bot"
          BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
          CONFIGURED_BIO_TELEGRAM_CHAT_ID: ${{ secrets.BIO_TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          token=(os.environ.get('BIO_TELEGRAM_BOT_TOKEN') or '').strip()
          expected=(os.environ.get('EXPECTED_TELEGRAM_BOT_USERNAME') or '').strip().lstrip('@')
          chat_id=(os.environ.get('CONFIGURED_BIO_TELEGRAM_CHAT_ID') or '').strip()
          if not token or not chat_id:
              raise RuntimeError('BIO Telegram secret missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
              identity=json.loads(r.read().decode('utf-8'))
          actual=str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or actual.lower()!=expected.lower():
              raise RuntimeError(f'Wrong Telegram bot: expected @{expected}, got @{actual or "unknown"}')
          out=pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as f:
              f.write(f'chat_id={chat_id}\n')
          print(f'dedicated_bio_fallback_telegram_verified=@{actual}')
          PY

      - name: Run QLEX and Intismeran recovery check
        if: steps.stale.outputs.run_bio == 'true'
        run: |
          rm -f out/qlex_sc_conversion_alert.md out/intismeran_qlex_alert.md
          python -m py_compile scripts/qlex_sc_conversion_watch.py scripts/intismeran_qlex_watch.py scripts/qlex_telegram_send.py
          python scripts/qlex_sc_conversion_watch.py --mode check
          python scripts/intismeran_qlex_watch.py

      - name: Send recovered QLEX alert if new data exists
        if: steps.stale.outputs.run_bio == 'true' && hashFiles('out/qlex_sc_conversion_alert.md') != ''
        env:
          BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
          BIO_TELEGRAM_CHAT_ID: ${{ steps.telegram.outputs.chat_id }}
        run: python scripts/qlex_telegram_send.py out/qlex_sc_conversion_alert.md

      - name: Send recovered Intismeran alert if new data exists
        if: steps.stale.outputs.run_bio == 'true' && hashFiles('out/intismeran_qlex_alert.md') != ''
        env:
          BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
          BIO_TELEGRAM_CHAT_ID: ${{ steps.telegram.outputs.chat_id }}
        run: python scripts/qlex_telegram_send.py out/intismeran_qlex_alert.md

      - name: Persist recovered bio states
        if: steps.stale.outputs.run_bio == 'true' && success()
        run: |
          test ! -f out/qlex_sc_conversion_watch_state_pending.json || cp out/qlex_sc_conversion_watch_state_pending.json data/qlex_sc_conversion_watch_state.json
          test ! -f out/intismeran_qlex_watch_state_pending.json || cp out/intismeran_qlex_watch_state_pending.json data/intismeran_qlex_watch_state.json

      - name: Commit recovered bio state
        if: steps.stale.outputs.run_bio == 'true' && success()
        run: |
          git config user.name "bio-watchdog[bot]"
          git config user.email "bio-watchdog[bot]@users.noreply.github.com"
          git add data/qlex_sc_conversion_watch_state.json data/intismeran_qlex_watch_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Bio fallback found no state change"
          else
            git commit -m "Recover QLEX and Intismeran heartbeat"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Notify successful automatic recovery
        if: steps.stale.outputs.run_bio == 'true' && success()
        env:
          BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
          BIO_TELEGRAM_CHAT_ID: ${{ steps.telegram.outputs.chat_id }}
        run: |
          mkdir -p out
          cat > out/bio_watchdog_recovery.md <<EOF
          [바이오 감시] 자동 복구

          QLEX·Intismeran 전용 감시 heartbeat가 기준 시간을 넘겨 watchdog이 자동 복구했습니다.
          - 정체 시간: 약 ${{ steps.stale.outputs.age_minutes }}분
          - 복구 후 두 감시 모두 계속 진행
          EOF
          python scripts/qlex_telegram_send.py out/bio_watchdog_recovery.md

      - name: Notify recovery failure
        if: steps.stale.outputs.run_bio == 'true' && failure()
        env:
          BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
          BIO_TELEGRAM_CHAT_ID: ${{ secrets.BIO_TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p out
          cat > out/bio_watchdog_failure.md <<EOF
          [바이오 감시] 자동 복구 실패

          QLEX·Intismeran 전용 감시가 기준 시간을 넘겨 watchdog이 복구를 시도했지만 실패했습니다.
          - GitHub Actions 점검 필요
          EOF
          python scripts/qlex_telegram_send.py out/bio_watchdog_failure.md || true

      - name: Publish fallback status
        if: always()
        run: |
          echo "Dedicated bio fallback run=${{ steps.stale.outputs.run_bio }}" >> "$GITHUB_STEP_SUMMARY"
          echo "age_minutes=${{ steps.stale.outputs.age_minutes }}" >> "$GITHUB_STEP_SUMMARY"
