name: CRCL USDC Rate Telegram Watch

on:
  push:
    paths:
      - ".github/workflows/crcl-usdc-rate-watch-telegram.yml"
      - "scripts/crcl_usdc_rate_watch.py"
      - "scripts/crcl_usdc_rate_watch_runner.py"
      - "scripts/crcl_tbx_alert_format.py"
      - "scripts/crypto_alert_krw.py"
      - "data/crcl_usdc_rate_watch_state.json"
  schedule:
    # Hourly source check; sends only on a new CRCL close or meaningful source change.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crcl-usdc-rate-watch-telegram
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Validate watcher
        run: |
          python -m py_compile scripts/crcl_usdc_rate_watch.py
          python -m py_compile scripts/crcl_usdc_rate_watch_runner.py
          python -m py_compile scripts/crcl_tbx_alert_format.py
          python -m py_compile scripts/crypto_alert_krw.py

      - name: Validate exact Telegram bot route without sending
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("Telegram token/chat id is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{username}")
          PY

      - name: Check CRCL, USDC and rate fundamentals
        run: PYTHONPATH=. python scripts/crcl_usdc_rate_watch_runner.py

      - name: Add readable TBX to CRCL interpretation
        if: hashFiles('out/crcl_usdc_rate_watch_telegram.txt') != ''
        run: python scripts/crcl_tbx_alert_format.py

      - name: Publish watcher summary
        if: always()
        run: |
          if [ -f out/crcl_usdc_rate_watch_status.md ]; then
            cat out/crcl_usdc_rate_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CRCL 감시 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/crcl_usdc_rate_watch_telegram.txt ]; then
            printf '\n---\n\nTelegram 알림 미리보기:\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/crcl_usdc_rate_watch_telegram.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send meaningful change to Telegram
        if: hashFiles('out/crcl_usdc_rate_watch_telegram.txt') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("Telegram token/chat id is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          text = pathlib.Path("out/crcl_usdc_rate_watch_telegram.txt").read_text(encoding="utf-8").strip()
          if not text:
              raise RuntimeError("Telegram alert is empty")

          def split_message(value, limit=3900):
              chunks, current = [], ""
              for paragraph in value.split("\n\n"):
                  candidate = paragraph if not current else current + "\n\n" + paragraph
                  if len(candidate) <= limit:
                      current = candidate
                      continue
                  if current:
                      chunks.append(current)
                      current = ""
                  while len(paragraph) > limit:
                      cut = paragraph.rfind("\n", 0, limit)
                      if cut < 1:
                          cut = limit
                      chunks.append(paragraph[:cut])
                      paragraph = paragraph[cut:].lstrip()
                  current = paragraph
              if current:
                  chunks.append(current)
              return chunks

          ids = []
          for chunk in split_message(text):
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              ids.append((result.get("result") or {}).get("message_id"))

          confirmed = {
              "status": "confirmed",
              "bot_username": username,
              "message_ids": ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/crcl_usdc_rate_watch_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"telegram_delivery_confirmed=true bot=@{username} message_ids={ids}")
          PY

      - name: Persist baseline or confirmed state
        if: always()
        run: |
          if [ ! -f out/crcl_usdc_rate_watch_telegram.txt ] || [ -f out/crcl_usdc_rate_watch_telegram_confirmed.json ]; then
            if [ -f out/crcl_usdc_rate_watch_pending_state.json ]; then
              mkdir -p data
              cp out/crcl_usdc_rate_watch_pending_state.json data/crcl_usdc_rate_watch_state.json
            fi
          else
            echo "Telegram delivery was not confirmed; watcher state intentionally not advanced."
          fi

      - name: Commit watcher state
        if: always()
        run: |
          if [ ! -f data/crcl_usdc_rate_watch_state.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crcl_usdc_rate_watch_state.json
          if git diff --cached --quiet; then
            echo "CRCL watcher state unchanged"
          else
            git commit -m "Update CRCL USDC rate watch state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crcl-usdc-rate-watch-${{ github.run_id }}
          path: |
            out/crcl_usdc_rate_watch_status.md
            out/crcl_usdc_rate_watch_telegram.txt
            out/crcl_usdc_rate_watch_pending_state.json
            out/crcl_usdc_rate_watch_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
