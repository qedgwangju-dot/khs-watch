name: LNG supply crisis Telegram alert

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send one accuracy-rule setup test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    paths:
      - ".github/workflows/lng-supply-crisis-alert.yml"
      - "scripts/lng_supply_crisis_alert_v12.py"
      - "scripts/lng_supply_crisis_alert_v13.py"
      - "scripts/lng_supply_crisis_alert_v14.py"
      - "scripts/lng_supply_crisis_alert_v15.py"
      - "scripts/lng_supply_crisis_alert_v16.py"
      - "scripts/lng_supply_crisis_alert_v17.py"
      - "scripts/lng_supply_crisis_alert_v18.py"
      - "scripts/lng_supply_crisis_alert_v19.py"

permissions:
  contents: write

concurrency:
  group: lng-supply-crisis-alert
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LNG_SETUP_TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.telegram_test == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate v19 monitor
        run: |
          python -m py_compile scripts/lng_supply_crisis_alert_v12.py scripts/lng_supply_crisis_alert_v13.py scripts/lng_supply_crisis_alert_v14.py scripts/lng_supply_crisis_alert_v15.py scripts/lng_supply_crisis_alert_v16.py scripts/lng_supply_crisis_alert_v17.py scripts/lng_supply_crisis_alert_v18.py scripts/lng_supply_crisis_alert_v19.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import lng_supply_crisis_alert_v2 as core
          import lng_supply_crisis_alert_v19 as v19

          trend_fixture = """
          Germany 10-Year Government Bond Yield
          Germany 10-Year Government Bond Yield current yield is 3.3554%
          Last Updated:2026-09-07 13:00:00 CEST
          Previous Value 3.3376%
          Historical Data
          Aug 4, 2026 | 3.1163%
          """
          parsed = v19._parse_trendonify_bond(trend_fixture)
          assert parsed["current_pct"] == 3.3554
          assert parsed["previous_pct"] == 3.3376
          assert parsed["aug4_pct"] == 3.1163
          te_fixture = "Actual Previous Highest Lowest Dates Unit Frequency 3.35 3.34 9.13 -0.91 1983 - 2026 percent Daily"
          assert v19._parse_te_bond_actual(te_fixture) == (3.35, 3.34)

          bund = core.Quote(
              key="bund10", symbol="DE10Y", label="독일 10년 Bund", unit="bp",
              price=335.54, previous_close=333.76, change_pct=0.53,
              timestamp_epoch=1788825600.0, timestamp_utc="2026-09-08T00:00:00+00:00",
              age_minutes=0,
              source_note="basis_date=2026-09-07; aug4=3.1163; since_aug4_bp=+23.9; TE_actual=3.3500",
          )
          us = core.Quote(
              key="us10", symbol="US10Y", label="미국 10년 국채", unit="bp",
              price=478.90, previous_close=477.30, change_pct=0.34,
              timestamp_epoch=1788825600.0, timestamp_utc="2026-09-08T00:00:00+00:00",
              age_minutes=0,
              source_note="basis_date=2026-09-04; aug4=4.6190; since_aug4_bp=+17.0; TE_actual=4.7890",
          )
          quotes = {"bund10": bund, "us10": us}
          signals = v19.apply_hysteresis_v19(quotes, set())
          assert "bund10_above_330" in signals
          assert "bund10_since_aug4_20bp" in signals
          assert "bund10_rise_leads_us10_5bp" in signals

          item = core.NewsItem(
              category="europe_rates", polarity="worsening", subtype="europe_rates_energy_ecb",
              title="Rise in German Bund Yields Almost Entirely Due to ECB Rate-Hike Prospects",
              source="Wall Street Journal", link="https://example.com/rates",
              published_utc="2026-09-07T00:00:00+00:00", published_epoch=1788739200.0,
              official=False, event_id="europe-rates-v19-test",
          )
          group = {
              "category":"europe_rates", "polarity":"worsening", "subtype":"europe_rates_energy_ecb",
              "event_id":"europe-rates-v19-test", "latest_epoch":item.published_epoch,
              "evidence":[item], "verification":"유럽 금리 조기신호 · 주요 금융매체/공식기관 확인",
          }
          _, body, meta = v19.build_regular_alert_v19([group], quotes, signals, set())
          for required in [
              "가스 → 인플레이션 → ECB → 유럽 장기금리",
              "8/4 이후 상대 매도강도", "독일이 <b>+6.9bp</b> 더 상승",
              "3.30% → 3.40% → 3.50% → 3.75%", "정책 경로", "분리 판정",
          ]:
              assert required in body, required
          assert meta["version"] == 19
          print("v19_validation=true")
          PY

      - name: Check LNG supply crisis conditions
        run: |
          if [ "$LNG_SETUP_TEST" = "true" ]; then
            python scripts/lng_supply_crisis_alert_v19.py --setup-test
          else
            python scripts/lng_supply_crisis_alert_v19.py
          fi

      - name: Publish status summary
        if: always()
        run: |
          if [ -f out/lng_supply_crisis_watch.md ]; then
            cat out/lng_supply_crisis_watch.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "LNG 공급 위기 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Telegram alert
        if: hashFiles('out/lng_supply_crisis_alert.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip() or os.environ.get("FALLBACK_TELEGRAM_CHAT_ID", "").strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip()
          if not token or not chat_id:
              raise RuntimeError("Telegram bot token or chat id is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual != expected:
              raise RuntimeError(f"Telegram bot mismatch: expected=@{expected}, actual=@{actual or 'unknown'}")

          title = pathlib.Path("out/lng_supply_crisis_title.txt").read_text(encoding="utf-8").strip()
          body = pathlib.Path("out/lng_supply_crisis_alert.md").read_text(encoding="utf-8").strip()
          text = f"{title}\n\n{body}".strip()

          chunks = []
          while text:
              if len(text) <= 3900:
                  chunks.append(text)
                  break
              cut = text.rfind("\n\n", 0, 3900)
              if cut < 1800:
                  cut = text.rfind("\n", 0, 3900)
              if cut < 1800:
                  cut = 3900
              chunks.append(text[:cut].strip())
              text = text[cut:].strip()

          message_ids = []
          for i, chunk in enumerate(chunks, 1):
              send_text = chunk if len(chunks) == 1 else f"[{i}/{len(chunks)}]\n{chunk}"
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": send_text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method="POST"
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              message_ids.append(int(result["result"]["message_id"]))

          confirmed = {
              "status": "confirmed", "bot": f"@{actual}", "message_ids": message_ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/lng_supply_crisis_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"telegram_delivery_confirmed=true bot=@{actual} message_ids={message_ids}")
          PY

      - name: Finalize alert state
        if: always()
        run: python scripts/lng_supply_crisis_alert_v19.py --finalize

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lng-supply-crisis-${{ github.run_id }}
          path: |
            out/lng_supply_crisis_watch.md
            out/lng_supply_crisis_alert.md
            out/lng_supply_crisis_alert.json
            out/lng_supply_crisis_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit confirmed alert state
        if: always() && hashFiles('data/lng_supply_crisis_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lng_supply_crisis_state.json
          if git diff --cached --quiet; then
            echo "LNG 공급 위기 상태 변경 없음"
          else
            git commit -m "Update LNG supply crisis alert state"
            git pull --rebase origin main
            git push
          fi
