name: LNG supply crisis Telegram alert

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send one accuracy-rule setup test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    paths:
      - ".github/workflows/lng-supply-crisis-alert.yml"
      - "scripts/lng_supply_crisis_alert_v12.py"
      - "scripts/lng_supply_crisis_alert_v13.py"
      - "scripts/lng_supply_crisis_alert_v14.py"

permissions:
  contents: write

concurrency:
  group: lng-supply-crisis-alert
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LNG_SETUP_TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.telegram_test == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate v14 monitor
        run: |
          python -m py_compile scripts/lng_supply_crisis_alert_v12.py scripts/lng_supply_crisis_alert_v13.py scripts/lng_supply_crisis_alert_v14.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import lng_supply_crisis_alert_v2 as core
          import lng_supply_crisis_alert_v14 as v14

          ko_item = core.NewsItem(
              category="alaska_lng",
              polarity="easing",
              subtype="alaska_policy_signal",
              title="트럼프 韓日, 알래스카로 간다…LNG 프로젝트서 또 거론",
              source="연합뉴스",
              link="https://example.com/alaska-ko",
              published_utc="2026-09-03T00:00:00+00:00",
              published_epoch=1788393600.0,
              official=False,
              event_id="alaska-ko-test",
          )
          ko_group = {
              "category": "alaska_lng",
              "polarity": "easing",
              "subtype": "alaska_policy_signal",
              "event_id": "alaska-ko-test",
              "latest_epoch": ko_item.published_epoch,
              "evidence": [ko_item],
              "verification": "정책 발언 조기신호·주요 통신사 1곳",
          }
          _, ko_body, _ = v14.build_regular_alert_v14([ko_group], {}, set(), set())
          assert "<b>한눈에</b>" in ko_body
          assert "<b>현재 단계</b>  정책 발언 ① / ⑤" in ko_body
          assert '<a href="https://example.com/alaska-ko">원문</a>' in ko_body

          en_title = "US forces strike two Iranian launchers on Iran's Larak island, US official says - Reuters"
          en_item = core.NewsItem(
              category="hormuz_shipping",
              polarity="worsening",
              subtype="facility_damage",
              title=en_title,
              source="Reuters",
              link="https://example.com/reuters",
              published_utc="2026-09-03T00:00:00+00:00",
              published_epoch=1788393600.0,
              official=False,
              event_id="reuters-en-test",
          )
          en_group = {
              "category": "hormuz_shipping",
              "polarity": "worsening",
              "subtype": "facility_damage",
              "event_id": "reuters-en-test",
              "latest_epoch": en_item.published_epoch,
              "evidence": [en_item],
              "verification": "신뢰 매체 2곳 교차",
          }
          _, en_body, _ = v14.build_regular_alert_v14([en_group], {}, set(), set())
          assert en_title not in en_body
          assert "로이터" in en_body
          assert "미군" in en_body
          assert "이란" in en_body

          manitoba_item = core.NewsItem(
              category="power_equipment_supply",
              polarity="worsening",
              subtype="power_trade_barrier",
              title="Canada-U.S. trade war complicates Hydro plan to purchase gas turbines from U.S. manufacturer - CBC",
              source="CBC News",
              link="https://example.com/manitoba",
              published_utc="2026-09-03T00:00:00+00:00",
              published_epoch=1788393600.0,
              official=False,
              event_id="manitoba-test",
          )
          manitoba_group = {
              "category": "power_equipment_supply",
              "polarity": "worsening",
              "subtype": "power_trade_barrier",
              "event_id": "manitoba-test",
              "latest_epoch": manitoba_item.published_epoch,
              "evidence": [manitoba_item],
              "verification": "조달·공급망 조기신호·주요 매체/공식 1곳",
          }
          v14.fetch_verified_fx = lambda currency: {
              "currency": currency,
              "symbol": "CADKRW=X",
              "rate": 984.23,
              "timestamp_utc": "2026-09-03T05:07:00+00:00",
              "timestamp_kst": "2026-09-03 14:07 KST",
              "source": "validation fixture",
          }
          _, mb_body, mb_meta = v14.build_regular_alert_v14([manitoba_group], {}, set(), set())
          for required in [
              "30억 캐나다달러", "약 2조9,527억원", "750MW", "가스터빈 <b>3기</b>",
              "GE 버노바", "예약계약", "무역전쟁", "지멘스 에너지", "최대 7년",
              "예약계약 ≠ 최종 발주", "1캐나다달러", "984.23원", "2026-09-03 14:07 KST"
          ]:
              assert required in mb_body, required
          assert mb_meta["version"] == 14
          assert mb_meta["krw_conversion_policy"]["on_failure"].startswith("원통화는 유지")
          print("v14_validation=true")
          PY

      - name: Check LNG supply crisis conditions
        run: |
          if [ "$LNG_SETUP_TEST" = "true" ]; then
            python scripts/lng_supply_crisis_alert_v14.py --setup-test
          else
            python scripts/lng_supply_crisis_alert_v14.py
          fi

      - name: Publish status summary
        if: always()
        run: |
          if [ -f out/lng_supply_crisis_watch.md ]; then
            cat out/lng_supply_crisis_watch.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "LNG 공급 위기 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Telegram alert
        if: hashFiles('out/lng_supply_crisis_alert.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip() or os.environ.get("FALLBACK_TELEGRAM_CHAT_ID", "").strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip()
          if not token or not chat_id:
              raise RuntimeError("Telegram bot token or chat id is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual != expected:
              raise RuntimeError(f"Telegram bot mismatch: expected=@{expected}, actual=@{actual or 'unknown'}")

          title = pathlib.Path("out/lng_supply_crisis_title.txt").read_text(encoding="utf-8").strip()
          body = pathlib.Path("out/lng_supply_crisis_alert.md").read_text(encoding="utf-8").strip()
          text = f"{title}\n\n{body}".strip()

          chunks = []
          while text:
              if len(text) <= 3900:
                  chunks.append(text)
                  break
              cut = text.rfind("\n\n", 0, 3900)
              if cut < 1800:
                  cut = text.rfind("\n", 0, 3900)
              if cut < 1800:
                  cut = 3900
              chunks.append(text[:cut].strip())
              text = text[cut:].strip()

          message_ids = []
          for i, chunk in enumerate(chunks, 1):
              send_text = chunk if len(chunks) == 1 else f"[{i}/{len(chunks)}]\n{chunk}"
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": send_text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              message_ids.append(int(result["result"]["message_id"]))

          confirmed = {
              "status": "confirmed",
              "bot": f"@{actual}",
              "message_ids": message_ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/lng_supply_crisis_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"telegram_delivery_confirmed=true bot=@{actual} message_ids={message_ids}")
          PY

      - name: Finalize alert state
        if: always()
        run: python scripts/lng_supply_crisis_alert_v14.py --finalize

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lng-supply-crisis-${{ github.run_id }}
          path: |
            out/lng_supply_crisis_watch.md
            out/lng_supply_crisis_alert.md
            out/lng_supply_crisis_alert.json
            out/lng_supply_crisis_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit confirmed alert state
        if: always() && hashFiles('data/lng_supply_crisis_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lng_supply_crisis_state.json
          if git diff --cached --quiet; then
            echo "LNG 공급 위기 상태 변경 없음"
          else
            git commit -m "Update LNG supply crisis alert state"
            git pull --rebase origin main
            git push
          fi
