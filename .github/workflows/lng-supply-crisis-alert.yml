name: LNG supply crisis Telegram alert

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send one accuracy-rule setup test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    paths:
      - ".github/workflows/lng-supply-crisis-alert.yml"

permissions:
  contents: write

concurrency:
  group: lng-supply-crisis-alert
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LNG_SETUP_TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.telegram_test == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate monitor
        run: |
          python -m py_compile scripts/lng_supply_crisis_alert_v2.py
          python -m py_compile scripts/lng_supply_crisis_alert_v3.py
          python -m py_compile scripts/lng_supply_crisis_alert_v4.py
          python -m py_compile scripts/lng_supply_crisis_alert_v5.py
          python -m py_compile scripts/lng_supply_crisis_alert_v6.py
          python -m py_compile scripts/lng_supply_crisis_alert_v7.py
          python -m py_compile scripts/lng_supply_crisis_alert_v8.py
          python -m py_compile scripts/lng_supply_crisis_alert_v9.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import lng_supply_crisis_alert_v2 as core
          import lng_supply_crisis_alert_v8 as v8
          import lng_supply_crisis_alert_v9 as v9

          item = core.NewsItem(
              category="hormuz_shipping",
              polarity="worsening",
              subtype="facility_damage",
              title="US forces strike two Iranian launchers on Iran's Larak island, US official says - Reuters",
              source="Reuters",
              link="https://example.com/source",
              published_utc="2026-08-31T00:00:00+00:00",
              published_epoch=0.0,
              official=False,
              event_id="format-test",
          )
          translated = v8.translate_title_ko(item)
          assert translated == "미군, 이란 라라크섬의 발사대 2곳 타격…미 당국자 확인"
          group = {
              "category": "hormuz_shipping",
              "polarity": "worsening",
              "subtype": "facility_damage",
              "event_id": "format-test",
              "latest_epoch": 0.0,
              "evidence": [item],
              "verification": "신뢰 매체 2곳 교차",
          }
          _, body, _ = v8.build_regular_alert_v8([group], {}, set(), set())
          assert "US forces strike" not in body
          assert "로이터: 미군, 이란 라라크섬의 발사대 2곳 타격…미 당국자 확인" in body
          assert '<a href="https://example.com/source">원문</a>' in body

          alaska_item = core.NewsItem(
              category="alaska_lng",
              polarity="easing",
              subtype="alaska_policy_signal",
              title="Trump says S. Korea, Japan, others going to Alaska to 'load up' with oil, build pipelines",
              source="Yonhap News Agency",
              link="https://example.com/alaska",
              published_utc="2026-09-03T00:00:00+00:00",
              published_epoch=0.0,
              official=False,
              event_id="alaska-format-test",
          )
          alaska_group = {
              "category": "alaska_lng",
              "polarity": "easing",
              "subtype": "alaska_policy_signal",
              "event_id": "alaska-format-test",
              "latest_epoch": 0.0,
              "evidence": [alaska_item],
              "verification": "신뢰 매체 2곳 교차",
          }
          _, alaska_body, _ = v9.build_regular_alert_v9([alaska_group], {}, set(), set())
          assert "알래스카 LNG·미국 공급 다변화: 정책·사업 진전" in alaska_body
          assert "트럼프, 한국·일본의 알래스카행 재차 언급" in alaska_body
          assert '<a href="https://example.com/alaska">원문</a>' in alaska_body
          assert "오프테이크·SPA" in alaska_body
          print("v9_format_and_alaska_validation=true")
          PY

      - name: Check LNG supply crisis conditions
        run: |
          if [ "$LNG_SETUP_TEST" = "true" ]; then
            python scripts/lng_supply_crisis_alert_v9.py --setup-test
          else
            python scripts/lng_supply_crisis_alert_v9.py
          fi

      - name: Publish status summary
        if: always()
        run: |
          if [ -f out/lng_supply_crisis_watch.md ]; then
            cat out/lng_supply_crisis_watch.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "LNG 공급 위기 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Telegram alert
        if: hashFiles('out/lng_supply_crisis_alert.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = (
              os.environ.get("TELEGRAM_CHAT_ID", "").strip()
              or os.environ.get("FALLBACK_TELEGRAM_CHAT_ID", "").strip()
          )
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip()
          if not token or not chat_id:
              raise RuntimeError("Telegram bot token or chat id is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual != expected:
              raise RuntimeError(
                  f"Telegram bot mismatch: expected=@{expected}, actual=@{actual or 'unknown'}; message blocked"
              )

          title = pathlib.Path("out/lng_supply_crisis_title.txt").read_text(encoding="utf-8").strip()
          body = pathlib.Path("out/lng_supply_crisis_alert.md").read_text(encoding="utf-8").strip()
          full_text = f"{title}\n\n{body}".strip()

          def split_text(text: str, limit: int = 3900) -> list[str]:
              chunks = []
              remaining = text
              while remaining:
                  if len(remaining) <= limit:
                      chunks.append(remaining)
                      break
                  cut = remaining.rfind("\n\n", 0, limit)
                  if cut < limit // 2:
                      cut = remaining.rfind("\n", 0, limit)
                  if cut < limit // 2:
                      cut = limit
                  chunks.append(remaining[:cut].strip())
                  remaining = remaining[cut:].strip()
              return [chunk for chunk in chunks if chunk]

          message_ids = []
          pieces = split_text(full_text)
          for index, piece in enumerate(pieces, start=1):
              text = piece if len(pieces) == 1 else f"[{index}/{len(pieces)}]\n{piece}"
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": text,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              message_ids.append(int(result.get("result", {}).get("message_id")))

          confirmed = {
              "status": "confirmed",
              "bot": f"@{actual}",
              "message_ids": message_ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/lng_supply_crisis_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"telegram_delivery_confirmed=true bot=@{actual} message_ids={message_ids}")
          PY

      - name: Finalize alert state
        if: always()
        run: python scripts/lng_supply_crisis_alert_v9.py --finalize

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lng-supply-crisis-${{ github.run_id }}
          path: |
            out/lng_supply_crisis_watch.md
            out/lng_supply_crisis_alert.md
            out/lng_supply_crisis_alert.json
            out/lng_supply_crisis_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit confirmed alert state
        if: always() && hashFiles('data/lng_supply_crisis_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lng_supply_crisis_state.json
          if git diff --cached --quiet; then
            echo "LNG 공급 위기 상태 변경 없음"
          else
            git commit -m "Update LNG supply crisis alert state"
            git pull --rebase origin main
            git push
          fi