name: LNG supply crisis Telegram alert

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send one accuracy-rule setup test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    paths:
      - ".github/workflows/lng-supply-crisis-alert.yml"
      - "scripts/lng_supply_crisis_alert_v12.py"
      - "scripts/lng_supply_crisis_alert_v13.py"
      - "scripts/lng_supply_crisis_alert_v14.py"
      - "scripts/lng_supply_crisis_alert_v15.py"
      - "scripts/lng_supply_crisis_alert_v16.py"
      - "scripts/lng_supply_crisis_alert_v17.py"
      - "scripts/lng_supply_crisis_alert_v18.py"
      - "scripts/lng_supply_crisis_alert_v19.py"
      - "scripts/lng_supply_crisis_alert_v20.py"
      - "scripts/lng_supply_crisis_alert_v21.py"
      - "scripts/lng_supply_crisis_alert_v22.py"
      - "scripts/lng_supply_crisis_alert_v23.py"
      - "scripts/lng_supply_crisis_alert_v24.py"
      - "scripts/lng_supply_crisis_alert_v25.py"
      - "scripts/lng_supply_crisis_alert_v26.py"
      - "scripts/lng_supply_crisis_alert_v27.py"
      - "scripts/lng_supply_crisis_alert_v28.py"
      - "scripts/lng_supply_crisis_alert_v29.py"
      - "scripts/lng_supply_crisis_qatar_us_overlay.py"

permissions:
  contents: write

concurrency:
  group: lng-supply-crisis-alert
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LNG_SETUP_TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.telegram_test == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate v29 monitor
        run: |
          python -m py_compile scripts/lng_supply_crisis_alert_v12.py scripts/lng_supply_crisis_alert_v13.py scripts/lng_supply_crisis_alert_v14.py scripts/lng_supply_crisis_alert_v15.py scripts/lng_supply_crisis_alert_v16.py scripts/lng_supply_crisis_alert_v17.py scripts/lng_supply_crisis_alert_v18.py scripts/lng_supply_crisis_alert_v19.py scripts/lng_supply_crisis_alert_v20.py scripts/lng_supply_crisis_alert_v21.py scripts/lng_supply_crisis_alert_v22.py scripts/lng_supply_crisis_alert_v23.py scripts/lng_supply_crisis_alert_v24.py scripts/lng_supply_crisis_alert_v25.py scripts/lng_supply_crisis_alert_v26.py scripts/lng_supply_crisis_alert_v27.py scripts/lng_supply_crisis_alert_v28.py scripts/lng_supply_crisis_alert_v29.py scripts/lng_supply_crisis_qatar_us_overlay.py
          python - <<'PY'
          import sys, time
          sys.path.insert(0, "scripts")
          import lng_supply_crisis_alert_v2 as core
          import lng_supply_crisis_alert_v27 as v27
          import lng_supply_crisis_alert_v28 as v28
          import lng_supply_crisis_alert_v29 as v29

          titles = [
              "Saudi pipeline outage threatens loss of 4% of global oil supply",
              "Saudi Arabia shuts down a pipeline as Houthis seize an island",
              "Saudis shut down oil pipeline as Houthis tighten grip on Red Sea shipping",
              "Saudi Energy Ministry: East-West pipeline shut down as a precaution following several attacks",
          ]
          for title in titles:
              assert core.classify_subtype(title) == "hormuz_bypass_shutdown", (title, core.classify_subtype(title))
              assert core.classify_polarity("hormuz_shipping", title) == "worsening", title

          item = core.NewsItem(
              category="hormuz_shipping", polarity="worsening", subtype="hormuz_bypass_shutdown",
              title=titles[0], source="Reuters", link="https://example.com/reuters",
              published_utc="2026-09-14T00:00:00+00:00", published_epoch=time.time(),
              official=False, event_id="fixture-bypass-reuters",
          )
          groups = v27.confirmed_news_groups_v27([item])
          assert any(g.get("subtype") == "hormuz_bypass_shutdown" for g in groups)
          assert any('"Saudi pipeline outage"' in q for _, q in v28.BYPASS_RECALL_QUERIES)

          yahoo = core.NewsItem(
              category="hormuz_shipping", polarity="worsening", subtype="hormuz_bypass_shutdown",
              title="Oil and gas prices climb after Saudi Arabia closes east-west pipeline - Yahoo Finance UK",
              source="Yahoo Finance UK", link="https://example.com/yahoo",
              published_utc="2026-09-14T00:00:00+00:00", published_epoch=time.time(),
              official=False, event_id="fixture-yahoo",
          )
          guardian = core.NewsItem(
              category="hormuz_shipping", polarity="worsening", subtype="hormuz_bypass_shutdown",
              title="Oil prices rise after drone attacks shut down Saudi Arabia’s East-West pipeline - The Guardian",
              source="The Guardian", link="https://example.com/guardian",
              published_utc="2026-09-14T00:00:00+00:00", published_epoch=time.time()-1,
              official=False, event_id="fixture-guardian",
          )
          fixture_groups = [{
              "category":"hormuz_shipping", "polarity":"worsening", "subtype":"hormuz_bypass_shutdown",
              "event_id":"fixture", "latest_epoch":time.time(), "evidence":[yahoo, guardian],
              "verification":"주요 매체 확인",
          }]
          evidence = "\n".join(v29._evidence_lines(fixture_groups))
          assert "야후 파이낸스 영국" in evidence
          assert "가디언" in evidence
          assert "사우디 동서 송유관 폐쇄로 국제유가·가스가격 상승" in evidence
          assert "드론 공격으로 사우디 동서 송유관 가동 중단…국제유가 상승" in evidence
          assert "Oil and gas prices climb" not in evidence
          assert "Oil prices rise after" not in evidence

          body = v29._build_bypass_body(fixture_groups, {})
          for header in ("한눈에", "공급 충격", "확인 근거", "병목 구조", "한국 영향", "투자 4축", "다음 확인", "핵심 한 줄"):
              assert body.count(f"<b>{header}</b>") == 1, header
          assert "Bab el-Mandeb" not in body
          assert "Brent" not in body
          print("v29_validation=true")
          PY

      - name: Check LNG supply crisis conditions
        run: |
          if [ "$LNG_SETUP_TEST" = "true" ]; then
            python scripts/lng_supply_crisis_alert_v29.py --setup-test
          else
            python scripts/lng_supply_crisis_alert_v29.py
          fi

      - name: Publish status summary
        if: always()
        run: |
          if [ -f out/lng_supply_crisis_watch.md ]; then
            cat out/lng_supply_crisis_watch.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "LNG 공급 위기 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Telegram alert
        if: hashFiles('out/lng_supply_crisis_alert.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip() or os.environ.get("FALLBACK_TELEGRAM_CHAT_ID", "").strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip()
          if not token or not chat_id:
              raise RuntimeError("Telegram bot token or chat id is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual != expected:
              raise RuntimeError(f"Telegram bot mismatch: expected=@{expected}, actual=@{actual or 'unknown'}")

          title = pathlib.Path("out/lng_supply_crisis_title.txt").read_text(encoding="utf-8").strip()
          body = pathlib.Path("out/lng_supply_crisis_alert.md").read_text(encoding="utf-8").strip()
          text = f"{title}\n\n{body}".strip()

          chunks = []
          while text:
              if len(text) <= 3900:
                  chunks.append(text)
                  break
              cut = text.rfind("\n\n", 0, 3900)
              if cut < 1800:
                  cut = text.rfind("\n", 0, 3900)
              if cut < 1800:
                  cut = 3900
              chunks.append(text[:cut].strip())
              text = text[cut:].strip()

          message_ids = []
          for i, chunk in enumerate(chunks, 1):
              send_text = chunk if len(chunks) == 1 else f"[{i}/{len(chunks)}]\n{chunk}"
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": send_text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              request = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method="POST")
              with urllib.request.urlopen(request, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              message_ids.append(int(result["result"]["message_id"]))

          confirmed = {
              "status": "confirmed",
              "bot": f"@{actual}",
              "message_ids": message_ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/lng_supply_crisis_telegram_confirmed.json").write_text(json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"telegram_delivery_confirmed=true bot=@{actual} message_ids={message_ids}")
          PY

      - name: Finalize alert state
        if: always()
        run: python scripts/lng_supply_crisis_alert_v29.py --finalize

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lng-supply-crisis-${{ github.run_id }}
          path: |
            out/lng_supply_crisis_watch.md
            out/lng_supply_crisis_alert.md
            out/lng_supply_crisis_alert.json
            out/lng_supply_crisis_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit confirmed alert state
        if: always() && hashFiles('data/lng_supply_crisis_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lng_supply_crisis_state.json
          if git diff --cached --quiet; then
            echo "LNG 공급 위기 상태 변경 없음"
          else
            git commit -m "Update LNG supply crisis alert state"
            pushed=false
            for attempt in 1 2 3 4; do
              echo "state push attempt ${attempt}/4"
              if ! git pull --rebase origin main; then
                git rebase --abort >/dev/null 2>&1 || true
                sleep $((attempt * 3))
                continue
              fi
              if git push; then
                pushed=true
                break
              fi
              sleep $((attempt * 3))
            done
            if [ "$pushed" != "true" ]; then
              echo "LNG 상태 파일 push 4회 실패" >&2
              exit 1
            fi
          fi
