name: LNG supply crisis Telegram alert

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send one accuracy-rule setup test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    paths:
      - ".github/workflows/lng-supply-crisis-alert.yml"
      - "scripts/lng_supply_crisis_alert_v12.py"
      - "scripts/lng_supply_crisis_alert_v13.py"
      - "scripts/lng_supply_crisis_alert_v14.py"
      - "scripts/lng_supply_crisis_alert_v15.py"
      - "scripts/lng_supply_crisis_alert_v16.py"
      - "scripts/lng_supply_crisis_alert_v17.py"
      - "scripts/lng_supply_crisis_alert_v18.py"

permissions:
  contents: write

concurrency:
  group: lng-supply-crisis-alert
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LNG_SETUP_TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.telegram_test == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate v18 monitor
        run: |
          python -m py_compile scripts/lng_supply_crisis_alert_v12.py scripts/lng_supply_crisis_alert_v13.py scripts/lng_supply_crisis_alert_v14.py scripts/lng_supply_crisis_alert_v15.py scripts/lng_supply_crisis_alert_v16.py scripts/lng_supply_crisis_alert_v17.py scripts/lng_supply_crisis_alert_v18.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import lng_supply_crisis_alert_v2 as core
          import lng_supply_crisis_alert_v18 as v18

          storage_item = core.NewsItem(
              category="europe_storage",
              polarity="worsening",
              subtype="storage_lng_competition",
              title="Europe gas storage shortfall raises global LNG competition and winter price risk",
              source="Bloomberg",
              link="https://example.com/storage",
              published_utc="2026-09-05T00:00:00+00:00",
              published_epoch=1788566400.0,
              official=False,
              event_id="storage-v18-test",
          )
          storage_group = {
              "category":"europe_storage",
              "polarity":"worsening",
              "subtype":"storage_lng_competition",
              "event_id":"storage-v18-test",
              "latest_epoch":storage_item.published_epoch,
              "evidence":[storage_item],
              "verification":"유럽 저장부족 조기신호 + GIE 공식 재고 검산",
          }

          fixture_gie = {
              "date":"2026-09-05",
              "trend_pp":0.25,
              "stored_twh":753.00,
              "fill_pct":66.60,
              "capacity_twh":1130.63,
              "net_change_twh_est":2.83,
              "gaps":{
                  "75":{"target_pct":75.0,"gap_pp":8.4,"required_twh":95.0},
                  "80":{"target_pct":80.0,"gap_pp":13.4,"required_twh":151.5},
                  "90":{"target_pct":90.0,"gap_pp":23.4,"required_twh":264.6},
              },
              "pace":{
                  "75":{"days_to_oct1":26,"twh_per_day_to_oct1":3.65,"days_to_dec1":87,"twh_per_day_to_dec1":1.09},
                  "80":{"days_to_oct1":26,"twh_per_day_to_oct1":5.83,"days_to_dec1":87,"twh_per_day_to_dec1":1.74},
                  "90":{"days_to_oct1":26,"twh_per_day_to_oct1":10.18,"days_to_dec1":87,"twh_per_day_to_dec1":3.04},
              },
              "countries":{
                  "DE":{"label":"독일","trend_pp":0.24,"stored_twh":133.82,"fill_pct":54.28},
                  "NL":{"label":"네덜란드","trend_pp":0.50,"stored_twh":71.51,"fill_pct":49.64},
                  "IT":{"label":"이탈리아","trend_pp":0.03,"stored_twh":169.82,"fill_pct":83.48},
                  "FR":{"label":"프랑스","trend_pp":0.49,"stored_twh":91.07,"fill_pct":73.51},
              },
              "source":"fixture",
          }
          v18.fetch_gie_storage_v18 = lambda: fixture_gie
          v18.v15.fetch_gie_storage = lambda: fixture_gie
          v18.v14.fetch_verified_fx = lambda currency: {
              "currency": currency,
              "symbol": f"{currency}KRW=X",
              "rate": 1570.0 if currency == "EUR" else 1350.0,
              "timestamp_utc":"2026-09-06T00:00:00+00:00",
              "timestamp_kst":"2026-09-06 09:00 KST",
              "source":"fixture",
          }

          quotes = {
              "ttf": core.Quote(
                  key="ttf", symbol="TE-KO:EU-GAS", label="TTF", unit="유로/MWh",
                  price=75.0, previous_close=73.0, change_pct=2.74,
                  timestamp_epoch=1788652800.0, timestamp_utc="2026-09-06T00:00:00+00:00",
                  age_minutes=0, source_note="fixture",
              ),
              "jkm": core.Quote(
                  key="jkm", symbol="TE-KO:LNG-JKM", label="JKM", unit="달러/MMBtu",
                  price=25.0, previous_close=24.0, change_pct=4.17,
                  timestamp_epoch=1788652800.0, timestamp_utc="2026-09-06T00:00:00+00:00",
                  age_minutes=0, source_note="fixture",
              ),
          }
          _, body, meta = v18.build_regular_alert_v18([storage_group], quotes, set(), set())
          for required in [
              "저장 충전속도·겨울 스트레스 업그레이드", "95.0TWh", "3.65TWh/일",
              "독일 54.28%", "네덜란드 49.64%", "유럽 TTF 단위정규화",
              "유럽-아시아 가격차", "100유로 스트레스선", "현재가격 환산비용"
          ]:
              assert required in body, required
          assert 100.0 in core.PRICE_SPECS["ttf"]["levels"]
          assert meta["version"] == 18
          print("v18_validation=true")
          PY

      - name: Check LNG supply crisis conditions
        run: |
          if [ "$LNG_SETUP_TEST" = "true" ]; then
            python scripts/lng_supply_crisis_alert_v18.py --setup-test
          else
            python scripts/lng_supply_crisis_alert_v18.py
          fi

      - name: Publish status summary
        if: always()
        run: |
          if [ -f out/lng_supply_crisis_watch.md ]; then
            cat out/lng_supply_crisis_watch.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "LNG 공급 위기 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Telegram alert
        if: hashFiles('out/lng_supply_crisis_alert.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip() or os.environ.get("FALLBACK_TELEGRAM_CHAT_ID", "").strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip()
          if not token or not chat_id:
              raise RuntimeError("Telegram bot token or chat id is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual != expected:
              raise RuntimeError(f"Telegram bot mismatch: expected=@{expected}, actual=@{actual or 'unknown'}")

          title = pathlib.Path("out/lng_supply_crisis_title.txt").read_text(encoding="utf-8").strip()
          body = pathlib.Path("out/lng_supply_crisis_alert.md").read_text(encoding="utf-8").strip()
          text = f"{title}\n\n{body}".strip()

          chunks = []
          while text:
              if len(text) <= 3900:
                  chunks.append(text)
                  break
              cut = text.rfind("\n\n", 0, 3900)
              if cut < 1800:
                  cut = text.rfind("\n", 0, 3900)
              if cut < 1800:
                  cut = 3900
              chunks.append(text[:cut].strip())
              text = text[cut:].strip()

          message_ids = []
          for i, chunk in enumerate(chunks, 1):
              send_text = chunk if len(chunks) == 1 else f"[{i}/{len(chunks)}]\n{chunk}"
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": send_text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method="POST"
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              message_ids.append(int(result["result"]["message_id"]))

          confirmed = {
              "status": "confirmed", "bot": f"@{actual}", "message_ids": message_ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/lng_supply_crisis_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"telegram_delivery_confirmed=true bot=@{actual} message_ids={message_ids}")
          PY

      - name: Finalize alert state
        if: always()
        run: python scripts/lng_supply_crisis_alert_v18.py --finalize

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lng-supply-crisis-${{ github.run_id }}
          path: |
            out/lng_supply_crisis_watch.md
            out/lng_supply_crisis_alert.md
            out/lng_supply_crisis_alert.json
            out/lng_supply_crisis_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit confirmed alert state
        if: always() && hashFiles('data/lng_supply_crisis_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lng_supply_crisis_state.json
          if git diff --cached --quiet; then
            echo "LNG 공급 위기 상태 변경 없음"
          else
            git commit -m "Update LNG supply crisis alert state"
            git pull --rebase origin main
            git push
          fi
