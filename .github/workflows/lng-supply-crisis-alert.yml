name: LNG supply crisis Telegram alert

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send one accuracy-rule setup test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    paths:
      - ".github/workflows/lng-supply-crisis-alert.yml"
      - "scripts/lng_supply_crisis_alert_v12.py"
      - "scripts/lng_supply_crisis_alert_v13.py"
      - "scripts/lng_supply_crisis_alert_v14.py"
      - "scripts/lng_supply_crisis_alert_v15.py"
      - "scripts/lng_supply_crisis_alert_v16.py"

permissions:
  contents: write

concurrency:
  group: lng-supply-crisis-alert
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LNG_SETUP_TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.telegram_test == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate v16 monitor
        run: |
          python -m py_compile scripts/lng_supply_crisis_alert_v12.py scripts/lng_supply_crisis_alert_v13.py scripts/lng_supply_crisis_alert_v14.py scripts/lng_supply_crisis_alert_v15.py scripts/lng_supply_crisis_alert_v16.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import lng_supply_crisis_alert_v2 as core
          import lng_supply_crisis_alert_v16 as v16

          fixture = """
          실제 이전 최고 최저 날짜 단위 업데이트 주기 23.76 23.61 69.96 2.00 2012 - 2026 USD / MMBTU 매일
          LNG JKM 23.76 0.15 0.61%
          2026년 9월 2일 lng jkm은 23.76 usd/mmbtu로 상승했으며, 전날 대비 0.61% 증가했습니다.
          """
          parsed = v16.parse_te_jkm(fixture)
          assert parsed["actual"] == 23.76
          assert parsed["previous"] == 23.61
          assert parsed["source_date"] == "2026-09-02"

          qatar_item = core.NewsItem(
              category="qatar_supply", polarity="worsening", subtype="qatar_force_majeure_november",
              title="QatarEnergy cancels gas deliveries to Italy's Edison until early November over Iran war",
              source="Reuters", link="https://example.com/qatar", published_utc="2026-09-03T00:00:00+00:00",
              published_epoch=1788393600.0, official=False, event_id="qatar-nov-test",
          )
          jkm_item = core.NewsItem(
              category="asia_procurement", polarity="worsening", subtype="asia_jkm_2022_high",
              title="JKM soars to highest since December 2022 as Middle East war shuts arbitrage window",
              source="S&P Global", link="https://example.com/jkm", published_utc="2026-09-03T01:00:00+00:00",
              published_epoch=1788397200.0, official=False, event_id="jkm-high-test",
          )
          groups = [
              {"category":"qatar_supply","polarity":"worsening","subtype":"qatar_force_majeure_november","event_id":"qatar-nov-test","latest_epoch":qatar_item.published_epoch,"evidence":[qatar_item],"verification":"카타르 공급 장기화 조기신호·로이터 확인"},
              {"category":"asia_procurement","polarity":"worsening","subtype":"asia_jkm_2022_high","event_id":"jkm-high-test","latest_epoch":jkm_item.published_epoch,"evidence":[jkm_item],"verification":"Platts JKM 가격평가 원천·S&P 글로벌 확인"},
          ]
          v16.v14.fetch_verified_fx = lambda currency: {
              "currency": currency, "symbol": "KRW=X", "rate": 1420.00,
              "timestamp_utc": "2026-09-04T03:00:00+00:00", "timestamp_kst": "2026-09-04 12:00 KST", "source": "fixture"
          }
          _, body, meta = v16.build_regular_alert_v16(groups, {}, set(), set())
          for required in ["11월 초", "5개 추가 LNG 카고 취소", "25.908달러/MMBtu", "2022년 12월 이후 최고", "36,790원/MMBtu", "아시아 전체 구매자에게 동일하게 11월까지 연장됐다고 자동 확대해석하지 않음"]:
              assert required in body, required
          assert qatar_item.title not in body
          assert jkm_item.title not in body
          assert meta["version"] == 16
          print("v16_validation=true")
          PY

      - name: Check LNG supply crisis conditions
        run: |
          if [ "$LNG_SETUP_TEST" = "true" ]; then
            python scripts/lng_supply_crisis_alert_v16.py --setup-test
          else
            python scripts/lng_supply_crisis_alert_v16.py
          fi

      - name: Publish status summary
        if: always()
        run: |
          if [ -f out/lng_supply_crisis_watch.md ]; then
            cat out/lng_supply_crisis_watch.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "LNG 공급 위기 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Telegram alert
        if: hashFiles('out/lng_supply_crisis_alert.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip() or os.environ.get("FALLBACK_TELEGRAM_CHAT_ID", "").strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip()
          if not token or not chat_id:
              raise RuntimeError("Telegram bot token or chat id is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual != expected:
              raise RuntimeError(f"Telegram bot mismatch: expected=@{expected}, actual=@{actual or 'unknown'}")

          title = pathlib.Path("out/lng_supply_crisis_title.txt").read_text(encoding="utf-8").strip()
          body = pathlib.Path("out/lng_supply_crisis_alert.md").read_text(encoding="utf-8").strip()
          text = f"{title}\n\n{body}".strip()

          chunks = []
          while text:
              if len(text) <= 3900:
                  chunks.append(text)
                  break
              cut = text.rfind("\n\n", 0, 3900)
              if cut < 1800:
                  cut = text.rfind("\n", 0, 3900)
              if cut < 1800:
                  cut = 3900
              chunks.append(text[:cut].strip())
              text = text[cut:].strip()

          message_ids = []
          for i, chunk in enumerate(chunks, 1):
              send_text = chunk if len(chunks) == 1 else f"[{i}/{len(chunks)}]\n{chunk}"
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": send_text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method="POST"
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              message_ids.append(int(result["result"]["message_id"]))

          confirmed = {
              "status": "confirmed", "bot": f"@{actual}", "message_ids": message_ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/lng_supply_crisis_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"telegram_delivery_confirmed=true bot=@{actual} message_ids={message_ids}")
          PY

      - name: Finalize alert state
        if: always()
        run: python scripts/lng_supply_crisis_alert_v16.py --finalize

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lng-supply-crisis-${{ github.run_id }}
          path: |
            out/lng_supply_crisis_watch.md
            out/lng_supply_crisis_alert.md
            out/lng_supply_crisis_alert.json
            out/lng_supply_crisis_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit confirmed alert state
        if: always() && hashFiles('data/lng_supply_crisis_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lng_supply_crisis_state.json
          if git diff --cached --quiet; then
            echo "LNG 공급 위기 상태 변경 없음"
          else
            git commit -m "Update LNG supply crisis alert state"
            git pull --rebase origin main
            git push
          fi
