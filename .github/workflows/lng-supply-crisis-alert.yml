name: LNG supply crisis Telegram alert

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send one accuracy-rule setup test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    branches: [main]
    paths:
      - ".github/workflows/lng-supply-crisis-alert.yml"
      - "scripts/lng_supply_crisis_alert_v12.py"
      - "scripts/lng_supply_crisis_alert_v13.py"
      - "scripts/lng_supply_crisis_alert_v14.py"
      - "scripts/lng_supply_crisis_alert_v15.py"
      - "scripts/lng_supply_crisis_alert_v16.py"
      - "scripts/lng_supply_crisis_alert_v17.py"
      - "scripts/lng_supply_crisis_alert_v18.py"
      - "scripts/lng_supply_crisis_alert_v19.py"
      - "scripts/lng_supply_crisis_alert_v20.py"
      - "scripts/lng_supply_crisis_alert_v21.py"
      - "scripts/lng_supply_crisis_alert_v22.py"
      - "scripts/lng_supply_crisis_alert_v23.py"
      - "scripts/lng_supply_crisis_alert_v24.py"
      - "scripts/lng_supply_crisis_alert_v25.py"
      - "scripts/lng_supply_crisis_alert_v26.py"
      - "scripts/lng_supply_crisis_alert_v27.py"
      - "scripts/lng_supply_crisis_alert_v28.py"
      - "scripts/lng_supply_crisis_alert_v29.py"
      - "scripts/lng_supply_crisis_alert_v30.py"
      - "scripts/lng_supply_crisis_alert_v31.py"
      - "scripts/lng_supply_crisis_alert_v32.py"
      - "scripts/lng_supply_crisis_alert_v33.py"
      - "scripts/lng_supply_crisis_alert_v34.py"
      - "scripts/lng_collection_budget.py"
      - "tests/test_lng_collection_budget.py"
      - "tests/test_lng_bundesbank_csv.py"
      - "tests/fixtures/bundesbank_run38156218314_preview.csv"
      - "tests/test_lng_parser_clock_regression.py"
      - "scripts/lng_supply_crisis_qatar_us_overlay.py"

permissions:
  contents: write

concurrency:
  group: lng-supply-crisis-alert
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LNG_SETUP_TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.telegram_test == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate v34 monitor
        run: |
          python -m unittest discover -s tests -p "test_lng_bundesbank_csv.py" -v
          python -m unittest discover -s tests -p "test_lng_collection_budget.py" -v
          python -m unittest discover -s tests -p "test_lng_parser_clock_regression.py" -v
          python -m py_compile scripts/lng_supply_crisis_alert_v12.py scripts/lng_supply_crisis_alert_v13.py scripts/lng_supply_crisis_alert_v14.py scripts/lng_supply_crisis_alert_v15.py scripts/lng_supply_crisis_alert_v16.py scripts/lng_supply_crisis_alert_v17.py scripts/lng_supply_crisis_alert_v18.py scripts/lng_supply_crisis_alert_v19.py scripts/lng_supply_crisis_alert_v20.py scripts/lng_supply_crisis_alert_v21.py scripts/lng_supply_crisis_alert_v22.py scripts/lng_supply_crisis_alert_v23.py scripts/lng_supply_crisis_alert_v24.py scripts/lng_supply_crisis_alert_v25.py scripts/lng_supply_crisis_alert_v26.py scripts/lng_supply_crisis_alert_v27.py scripts/lng_supply_crisis_alert_v28.py scripts/lng_supply_crisis_alert_v29.py scripts/lng_supply_crisis_alert_v30.py scripts/lng_supply_crisis_alert_v31.py scripts/lng_supply_crisis_alert_v32.py scripts/lng_supply_crisis_alert_v33.py scripts/lng_supply_crisis_alert_v34.py scripts/lng_supply_crisis_qatar_us_overlay.py
          python - <<'PY'
          import sys, time
          sys.path.insert(0, "scripts")
          import lng_supply_crisis_alert_v2 as core
          import lng_supply_crisis_alert_v33 as v33
          import lng_supply_crisis_alert_v34 as v34

          item = core.NewsItem(
              category=v33.CATEGORY,
              polarity="worsening",
              subtype="fuel_crisis_systemic",
              title="Oil Executives Say the Great Fuel Crisis Is Here - The Wall Street Journal",
              source="The Wall Street Journal",
              link="https://example.com/fuel-crisis",
              published_utc="2026-09-15T00:00:00+00:00",
              published_epoch=time.time(),
              official=False,
              event_id="fixture-fuel-crisis",
          )
          groups = v33.confirmed_news_groups_v33([item])
          assert groups
          evidence = "\n".join(v34._evidence_lines_v34(groups))
          assert "월스트리트저널" in evidence
          assert "미국 석유업계 경영진, 글로벌 연료 위기가 이미 시작됐다고 경고" in evidence
          assert "Oil Executives Say" not in evidence
          body = v34._build_fuel_body_v34(groups, {})
          assert "LNG 수급 악화 관련 확정 변화" not in body
          assert "Vitol" not in body
          assert "Yahoo Brent" not in body
          assert "비톨" in body
          print("v34_validation=true")
          PY

      - name: Check LNG supply crisis conditions
        run: |
          if [ "$LNG_SETUP_TEST" = "true" ]; then
            python scripts/lng_supply_crisis_alert_v34.py --setup-test
          else
            python scripts/lng_supply_crisis_alert_v34.py
          fi

      - name: Publish status summary
        if: always()
        run: |
          if [ -f out/lng_supply_crisis_watch.md ]; then
            cat out/lng_supply_crisis_watch.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "LNG 공급 위기 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Telegram alert
        if: hashFiles('out/lng_supply_crisis_alert.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip() or os.environ.get("FALLBACK_TELEGRAM_CHAT_ID", "").strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip()
          if not token or not chat_id:
              raise RuntimeError("Telegram bot token or chat id is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual != expected:
              raise RuntimeError(f"Telegram bot mismatch: expected=@{expected}, actual=@{actual or 'unknown'}")

          title = pathlib.Path("out/lng_supply_crisis_title.txt").read_text(encoding="utf-8").strip()
          body = pathlib.Path("out/lng_supply_crisis_alert.md").read_text(encoding="utf-8").strip()
          text = f"{title}\n\n{body}".strip()

          chunks = []
          while text:
              if len(text) <= 3900:
                  chunks.append(text)
                  break
              cut = text.rfind("\n\n", 0, 3900)
              if cut < 1800:
                  cut = text.rfind("\n", 0, 3900)
              if cut < 1800:
                  cut = 3900
              chunks.append(text[:cut].strip())
              text = text[cut:].strip()

          message_ids = []
          for i, chunk in enumerate(chunks, 1):
              send_text = chunk if len(chunks) == 1 else f"[{i}/{len(chunks)}]\n{chunk}"
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": send_text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              request = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method="POST")
              with urllib.request.urlopen(request, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              message_ids.append(int(result["result"]["message_id"]))

          confirmed = {
              "status": "confirmed",
              "bot": f"@{actual}",
              "message_ids": message_ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/lng_supply_crisis_telegram_confirmed.json").write_text(json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"telegram_delivery_confirmed=true bot=@{actual} message_ids={message_ids}")
          PY

      - name: Correct prior unverified LNG alert 312
        if: github.event_name == 'push' && github.event.head_commit.message == 'audit: correct prior misleading LNG alert 312'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip() or os.environ.get("FALLBACK_TELEGRAM_CHAT_ID", "").strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip()
          if not token or not chat_id:
              raise RuntimeError("LNG alert correction: missing Telegram route credentials")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.load(response)
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual != expected:
              raise RuntimeError("LNG alert correction: verified bot identity mismatch")

          text = (
              "<b>[정정] 10월 21일 21:28 LNG 해상 운송 알림</b>\n\n"
              "기존 ‘호르무즈·홍해 운송 악화 확정’ 판정을 철회합니다.\n\n"
              "지캡틴과 가디언의 기사를 같은 LNG 실물 공급 차질로 묶었지만, "
              "기사별 LNG 선적·운항 사실과 동일 사건 여부를 검증하지 못했습니다. "
              "두 매체라는 이유만으로 같은 공급 악화를 확정한 것은 판정 오류입니다.\n\n"
              "• 카타르 LNG 생산·선적량 감소: 해당 알림만으로 확인 불가\n"
              "• 호르무즈·홍해의 일반 선박사고: LNG 공급 중단과 구분\n"
              "• LNG 운반선의 실제 운항·선적·도착 변화: 별도 실물자료 확인 필요\n\n"
              "앞으로는 동일 LNG 선박·항로·사건 종류·방향이 일치해야 "
              "독립 출처 교차확인으로 인정하며, 구글 뉴스 링크는 원문 직접 열람과 구분합니다."
          )
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "message_id": 312,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/editMessageText",
              data=payload, method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  outcome = json.load(response)
          except urllib.error.HTTPError as error:
              # Explicitly fail; never send another alert as an untracked fallback.
              info = error.read().decode("utf-8", errors="replace")
              if "message is not modified" in info.lower():
                  outcome = {"ok": True, "result": {"message_id": 312}}
              else:
                  raise RuntimeError(
                      f"LNG alert 312 edit failed (HTTP {error.code}); no duplicate sent"
                  ) from error
          if not outcome.get("ok"):
              raise RuntimeError("LNG alert 312 edit not confirmed; no duplicate sent")
          result = outcome.get("result")
          if isinstance(result, dict) and int(result.get("message_id", -1)) != 312:
              raise RuntimeError("LNG alert 312 response message id mismatch")
          confirmation = {
              "status": "confirmed", "action": "editMessageText",
              "message_id": 312, "bot": f"@{actual}",
              "corrected_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
              "replacement_notice": "Previously unverified LNG supply deterioration claim retracted",
          }
          pathlib.Path("out/lng_prior_alert_correction.json").write_text(
              json.dumps(confirmation, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print("lng_prior_alert_corrected=true action=editMessageText message_id=312 no_new_message=true")
          PY

      - name: Finalize alert state
        if: always()
        run: python scripts/lng_supply_crisis_alert_v34.py --finalize

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lng-supply-crisis-${{ github.run_id }}
          path: |
            out/lng_collection_coverage.json
            out/lng_supply_crisis_watch.md
            out/lng_supply_crisis_alert.md
            out/lng_supply_crisis_alert.json
            out/lng_supply_crisis_telegram_confirmed.json
            out/lng_prior_alert_correction.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit confirmed alert state
        if: always() && hashFiles('data/lng_supply_crisis_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lng_supply_crisis_state.json
          if git diff --cached --quiet; then
            echo "LNG 공급 위기 상태 변경 없음"
          else
            git commit -m "Update LNG supply crisis alert state"
            pushed=false
            for attempt in 1 2 3 4; do
              echo "state push attempt ${attempt}/4"
              if ! git pull --rebase origin main; then
                git rebase --abort >/dev/null 2>&1 || true
                sleep $((attempt * 3))
                continue
              fi
              if git push; then
                pushed=true
                break
              fi
              sleep $((attempt * 3))
            done
            if [ "$pushed" != "true" ]; then
              echo "LNG 상태 파일 push 4회 실패" >&2
              exit 1
            fi
          fi

