name: Yen carry second Telegram bot smoke test

on:
  pull_request:
    paths:
      - "tests/yen_carry_second_bot_smoke.txt"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and send through second bot
        env:
          YEN_CARRY_TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          YEN_CARRY_TELEGRAM_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          EXISTING_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_BOT_USERNAME: "hs8879887988798879_bot"
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ.get("YEN_CARRY_TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = (
              os.environ.get("YEN_CARRY_TELEGRAM_CHAT_ID", "").strip()
              or os.environ.get("EXISTING_TELEGRAM_CHAT_ID", "").strip()
          )
          expected = os.environ["EXPECTED_BOT_USERNAME"].strip().lstrip("@")
          if not token:
              raise RuntimeError("YEN_CARRY_TELEGRAM_BOT_TOKEN missing")
          if not chat_id:
              raise RuntimeError("Telegram chat id missing")

          with urllib.request.urlopen(
              urllib.request.Request(f"https://api.telegram.org/bot{token}/getMe"),
              timeout=20,
          ) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong bot: expected @{expected}, got @{actual or 'unknown'}")

          now = dt.datetime.now(ZoneInfo("Asia/Seoul")).strftime("%Y-%m-%d %H:%M:%S KST")
          text = (
              "✅ 엔캐리 경보 송출 봇 전환 시험\n\n"
              f"송출 봇: @{actual}\n"
              f"확인 시각: {now}\n\n"
              "앞으로 엔캐리 청산 경보는 이 봇으로만 전송됩니다."
          )
          payload = urllib.parse.urlencode(
              {
                  "chat_id": chat_id,
                  "text": text,
                  "disable_web_page_preview": "true",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected message: {result}")
          message_id = result.get("result", {}).get("message_id")
          print(
              f"second_bot_delivery_confirmed=true bot_username=@{actual} "
              f"message_id={message_id} confirmed_at_kst={now}"
          )
          PY
