name: Gwangju Military Airport Telegram Watch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gwangju-airport-telegram-watch.yml"
      - "scripts/gwangju_airport_watch.py"
  schedule:
    - cron: "37 * * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a Telegram connection test"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: gwangju-airport-telegram-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887988798879887988798879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.GWANGJU_AIRPORT_TELEGRAM_BOT_TOKEN }}
      CONFIGURED_TELEGRAM_CHAT_ID: ${{ secrets.GWANGJU_AIRPORT_TELEGRAM_CHAT_ID }}
      GWANGJU_AIRPORT_WATCH_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'KHS-Gwangju-Airport-Watch contact=github-actions' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Resolve and verify Telegram route
        id: telegram
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          out = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          token = (os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          expected = (os.getenv('EXPECTED_TELEGRAM_BOT_USERNAME') or '').strip().lstrip('@')
          chat_id = (os.getenv('CONFIGURED_TELEGRAM_CHAT_ID') or '').strip()

          def emit(**kwargs):
              with out.open('a', encoding='utf-8') as f:
                  for key, value in kwargs.items():
                      f.write(f'{key}={value}\n')

          if not token:
              emit(configured='false', reason='missing_token', bot_username='', chat_id='')
              raise SystemExit(1)
          if not chat_id:
              emit(configured='false', reason='missing_chat_id', bot_username='', chat_id='')
              raise SystemExit(1)

          try:
              with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
                  identity = json.loads(r.read().decode('utf-8'))
          except Exception as exc:
              emit(configured='false', reason='getMe_failed', bot_username='', chat_id='')
              print(f'telegram_getMe_failed={type(exc).__name__}')
              raise SystemExit(1)

          actual = str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or actual.lower() != expected.lower():
              emit(configured='false', reason='wrong_bot', bot_username=actual, chat_id='')
              print(f'wrong_bot expected=@{expected} actual=@{actual or "unknown"}')
              raise SystemExit(1)

          emit(configured='true', reason='ok', bot_username=actual, chat_id=chat_id)
          print(f'telegram_route_valid=true bot=@{actual}')
          PY

      - name: Publish Telegram route status
        if: always()
        run: |
          echo "Telegram route configured: ${{ steps.telegram.outputs.configured || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Telegram route reason: ${{ steps.telegram.outputs.reason || 'unknown' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.telegram.outputs.bot_username }}" ]; then
            echo "Bot: @${{ steps.telegram.outputs.bot_username }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate watcher
        if: steps.telegram.outputs.configured == 'true'
        run: |
          python -m py_compile scripts/gwangju_airport_watch.py
          python scripts/gwangju_airport_watch.py --mode self-test

      - name: Check web sources
        if: steps.telegram.outputs.configured == 'true'
        run: |
          rm -f out/gwangju_airport_alert.md out/gwangju_airport_connection_test.md out/gwangju_airport_telegram_confirmed.json
          python scripts/gwangju_airport_watch.py --mode check
          test -f out/gwangju_airport_status.md && cat out/gwangju_airport_status.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build manual connection test
        if: steps.telegram.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.send_test == 'true'
        run: |
          mkdir -p out
          cat > out/gwangju_airport_connection_test.md <<'EOF'
          [광주 군공항 이전 감시] 텔레그램 연결 시험

          @khs887988798879887988798879_bot 연결 정상입니다.
          - 기준선: 2026-08-28 무안군 망운면 일대 이전후보지 선정, 최종 이전부지는 미확정
          - 지원계획·주민투표·유치신청·최종 선정·지연/철회·제1전투비행단 임시배치·반도체 클러스터 일정을 감시
          - 공식자료 우선, 비공식 보도는 서로 다른 독립 발행사 2곳 이상에서 같은 사건이 확인될 때만 알림
          - 동일 제목·동일 사건·동일 발행사 별칭은 1건으로 통합
          EOF

      - name: Send Telegram messages
        if: steps.telegram.outputs.configured == 'true'
        env:
          TELEGRAM_CHAT_ID: ${{ steps.telegram.outputs.chat_id }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo
          from scripts.gwangju_airport_watch import telegram_html_chunks

          token = os.environ['TELEGRAM_BOT_TOKEN'].strip()
          chat_id = os.environ['TELEGRAM_CHAT_ID'].strip()
          expected = os.environ['EXPECTED_TELEGRAM_BOT_USERNAME'].strip().lstrip('@')

          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
              identity = json.loads(r.read().decode('utf-8'))
          actual = str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or actual.lower() != expected.lower():
              raise RuntimeError(f'Wrong Telegram bot immediately before send: expected @{expected}, got @{actual or "unknown"}')

          files = [
              pathlib.Path('out/gwangju_airport_connection_test.md'),
              pathlib.Path('out/gwangju_airport_alert.md'),
          ]

          sent = 0
          message_ids = []
          confirmed_chats = set()
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8').strip()
              if not text:
                  continue

              chunks = telegram_html_chunks(text)

              for chunk in chunks:
                  payload = urllib.parse.urlencode({
                      'chat_id': chat_id,
                      'text': chunk,
                      'parse_mode': 'HTML',
                      'disable_web_page_preview': 'true',
                  }).encode('utf-8')
                  req = urllib.request.Request(
                      f'https://api.telegram.org/bot{token}/sendMessage',
                      data=payload,
                      method='POST',
                  )
                  with urllib.request.urlopen(req, timeout=30) as r:
                      result = json.loads(r.read().decode('utf-8'))
                  if not result.get('ok'):
                      raise RuntimeError("Telegram sendMessage rejected")
                  delivered = result.get('result') or {}
                  actual_chat = delivered.get('chat') or {}
                  actual_chat_id = actual_chat.get('id')
                  message_id = delivered.get('message_id')
                  if not isinstance(message_id, int) or actual_chat_id is None:
                      raise RuntimeError("Telegram receipt missing chat.id or message_id")
                  if chat_id.lstrip('-').isdigit():
                      if str(actual_chat_id) != chat_id:
                          raise RuntimeError("Telegram receipt chat.id mismatch")
                  elif chat_id.startswith('@'):
                      if str(actual_chat.get('username') or '').casefold() != chat_id[1:].casefold():
                          raise RuntimeError("Telegram receipt username mismatch")
                  else:
                      raise RuntimeError("Telegram chat destination is neither numeric ID nor @username")
                  sent += 1
                  message_ids.append(message_id)
                  confirmed_chats.add(str(actual_chat_id))

          if sent:
              pathlib.Path('out/gwangju_airport_telegram_confirmed.json').write_text(
                  json.dumps({
                      'status': 'confirmed',
                      'bot_username': actual,
                      'chat_ids': sorted(confirmed_chats),
                      'message_ids': message_ids,
                      'confirmed_at_kst': dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat(timespec='seconds'),
                  }, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          print(f'gwangju_airport_telegram_messages_sent={sent} bot=@{actual}')
          PY

      - name: Persist state after a no-alert check or confirmed Telegram delivery
        id: persist_gwangju
        if: steps.telegram.outputs.configured == 'true' && success() && hashFiles('out/gwangju_airport_watch_state_pending.json') != '' && ((hashFiles('out/gwangju_airport_alert.md') == '' && hashFiles('out/gwangju_airport_connection_test.md') == '') || hashFiles('out/gwangju_airport_telegram_confirmed.json') != '')
        run: cp out/gwangju_airport_watch_state_pending.json data/gwangju_airport_watch_state.json

      - name: Commit check state only when persistence was permitted
        if: steps.telegram.outputs.configured == 'true' && success() && steps.persist_gwangju.conclusion == 'success' && hashFiles('data/gwangju_airport_watch_state.json') != ''
        run: |
          git config user.name "gwangju-airport-watch[bot]"
          git config user.email "gwangju-airport-watch[bot]@users.noreply.github.com"
          git add data/gwangju_airport_watch_state.json
          if git diff --cached --quiet; then
            echo "Gwangju airport watch state unchanged"
          else
            git commit -m "Update Gwangju airport watch state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi


      - name: Correct source-date label on previously sent Telegram message
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gwangju-msg-correction]')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GWANGJU_AIRPORT_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GWANGJU_AIRPORT_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import html, json, os, re, urllib.error, urllib.parse, urllib.request
          from scripts.gwangju_airport_watch import verified_briefing_item, build_alert
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError("Telegram bot mismatch on correction")
          item = verified_briefing_item({"sent_event_keys": []})
          content = build_alert([item])
          content = re.sub(r"^조회: .*?$", "조회: 2026-11-02 18:42 KST", content, count=1, flags=re.M)
          rendered = []
          for line in content.splitlines():
              match = re.fullmatch(r"\s*-\s*출처원문:\s*(.*?)\s*\|\s*(.*?)\s*\|\s*(https?://\S+)\s*", line)
              if match:
                  source, date, url = (html.escape(v.strip(), quote=True) for v in match.groups())
                  rendered.append(f'- 출처·원문: {source} · {date} · <a href="{url}">원문 보기</a>')
              else:
                  rendered.append(html.escape(line))
          payload = urllib.parse.urlencode({
              "chat_id": chat_id, "message_id": 180, "text": "\n".join(rendered),
              "parse_mode": "HTML", "disable_web_page_preview": "true"
          }).encode("utf-8")
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/editMessageText", data=payload, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  response = json.loads(r.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              error = exc.read().decode("utf-8", errors="replace")
              if "message is not modified" in error:
                  response = {"ok": True, "already_corrected": True}
              else:
                  raise
          if not response.get("ok"):
              raise RuntimeError("Telegram correction rejected")
          mid = (response.get("result") or {}).get("message_id")
          if mid is not None and int(mid) != 180:
              raise RuntimeError("Unexpected corrected message ID")
          print("gwangju_alert_message_corrected=true message_ids=[180] source_time=unpublished")
          PY

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwangju-airport-watch-${{ github.run_id }}
          path: |
            out/gwangju_airport_status.md
            out/gwangju_airport_alert.md
            out/gwangju_airport_connection_test.md
            out/gwangju_airport_errors.log
            out/gwangju_airport_watch_state_pending.json
            out/gwangju_airport_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
