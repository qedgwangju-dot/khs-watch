name: Gwangju Military Airport Telegram Watch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gwangju-airport-telegram-watch.yml"
      - "scripts/gwangju_airport_watch.py"
      - "data/gwangju_airport_watch_state.json"
  schedule:
    - cron: "37 * * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a Telegram connection test"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: gwangju-airport-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887988798879887988798879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.GWANGJU_AIRPORT_TELEGRAM_BOT_TOKEN || secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN || secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
      CONFIGURED_TELEGRAM_CHAT_ID: ${{ secrets.GWANGJU_AIRPORT_TELEGRAM_CHAT_ID || secrets.KHS_POLICY_TELEGRAM_CHAT_ID || secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
      GWANGJU_AIRPORT_WATCH_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'KHS-Gwangju-Airport-Watch contact=github-actions' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Resolve and verify Telegram route
        id: telegram
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          out = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          token = (os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          expected = (os.getenv('EXPECTED_TELEGRAM_BOT_USERNAME') or '').strip().lstrip('@')
          configured_chat = (os.getenv('CONFIGURED_TELEGRAM_CHAT_ID') or '').strip()

          def emit(**kwargs):
              with out.open('a', encoding='utf-8') as f:
                  for key, value in kwargs.items():
                      f.write(f'{key}={value}\n')

          if not token:
              emit(configured='false', reason='missing_token', bot_username='', chat_id='')
              raise SystemExit(0)

          try:
              with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
                  identity = json.loads(r.read().decode('utf-8'))
          except Exception as exc:
              emit(configured='false', reason='getMe_failed', bot_username='', chat_id='')
              print(f'telegram_getMe_failed={type(exc).__name__}')
              raise SystemExit(0)

          actual = str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or actual.lower() != expected.lower():
              emit(configured='false', reason='wrong_bot', bot_username=actual, chat_id='')
              print(f'wrong_bot expected=@{expected} actual=@{actual or "unknown"}')
              raise SystemExit(0)

          chat_id = configured_chat
          if not chat_id:
              try:
                  with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getUpdates?limit=100&timeout=0', timeout=25) as r:
                      updates = json.loads(r.read().decode('utf-8'))
                  candidates = []
                  for upd in updates.get('result') or []:
                      msg = upd.get('message') or upd.get('edited_message') or {}
                      chat = msg.get('chat') or {}
                      if str(chat.get('type') or '') == 'private' and chat.get('id') is not None:
                          candidates.append((int(upd.get('update_id') or 0), str(chat['id'])))
                  if candidates:
                      candidates.sort()
                      chat_id = candidates[-1][1]
              except Exception as exc:
                  print(f'telegram_getUpdates_failed={type(exc).__name__}')

          if not chat_id:
              emit(configured='false', reason='missing_chat_id', bot_username=actual, chat_id='')
              raise SystemExit(0)

          emit(configured='true', reason='ok', bot_username=actual, chat_id=chat_id)
          print(f'telegram_route_valid=true bot=@{actual}')
          PY

      - name: Publish Telegram route status
        if: always()
        run: |
          echo "Telegram route configured: ${{ steps.telegram.outputs.configured || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Telegram route reason: ${{ steps.telegram.outputs.reason || 'unknown' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.telegram.outputs.bot_username }}" ]; then
            echo "Bot: @${{ steps.telegram.outputs.bot_username }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate watcher
        if: steps.telegram.outputs.configured == 'true'
        run: |
          python -m py_compile scripts/gwangju_airport_watch.py
          python scripts/gwangju_airport_watch.py --mode self-test

      - name: Check web sources
        if: steps.telegram.outputs.configured == 'true'
        run: |
          rm -f out/gwangju_airport_alert.md out/gwangju_airport_connection_test.md
          python scripts/gwangju_airport_watch.py --mode check
          test -f out/gwangju_airport_status.md && cat out/gwangju_airport_status.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build manual connection test
        if: steps.telegram.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.send_test == 'true'
        run: |
          mkdir -p out
          cat > out/gwangju_airport_connection_test.md <<'EOF'
          [광주 군공항 이전 감시] 텔레그램 연결 시험

          @khs887988798879887988798879_bot 연결 정상입니다.
          - 기준선: 2026-08-28 무안군 망운면 일대 이전후보지 선정, 최종 이전부지는 미확정
          - 지원계획·주민투표·유치신청·최종 선정·지연/철회·제1전투비행단 임시배치·반도체 클러스터 일정을 감시
          - 공식자료 우선, 비공식 보도는 신뢰언론 2곳 이상 교차 시만 알림
          - 중복 기사와 단순 재전송은 알림하지 않음
          EOF

      - name: Send Telegram messages
        if: steps.telegram.outputs.configured == 'true'
        env:
          TELEGRAM_CHAT_ID: ${{ steps.telegram.outputs.chat_id }}
        shell: bash
        run: |
          python - <<'PY'
          import html as html_lib
          import json
          import os
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          token = os.environ['TELEGRAM_BOT_TOKEN'].strip()
          chat_id = os.environ['TELEGRAM_CHAT_ID'].strip()
          files = [
              pathlib.Path('out/gwangju_airport_connection_test.md'),
              pathlib.Path('out/gwangju_airport_alert.md'),
          ]

          def render_html(text):
              rendered = []
              for line in text.splitlines():
                  m = re.fullmatch(r'\s*- 링크:\s*(https?://\S+)\s*', line)
                  if m:
                      url = html_lib.escape(m.group(1), quote=True)
                      rendered.append(f'- 원문: <a href="{url}">[원문 보기]</a>')
                  else:
                      rendered.append(html_lib.escape(line))
              return '\n'.join(rendered)

          sent = 0
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8').strip()
              if not text:
                  continue
              chunks = []
              while len(text) > 3600:
                  cut = text.rfind('\n\n', 0, 3600)
                  if cut < 1000:
                      cut = 3600
                  chunks.append(text[:cut].strip())
                  text = text[cut:].strip()
              if text:
                  chunks.append(text)
              for chunk in chunks:
                  payload = urllib.parse.urlencode({
                      'chat_id': chat_id,
                      'text': render_html(chunk),
                      'parse_mode': 'HTML',
                      'disable_web_page_preview': 'true',
                  }).encode('utf-8')
                  req = urllib.request.Request(
                      f'https://api.telegram.org/bot{token}/sendMessage',
                      data=payload,
                      method='POST',
                  )
                  with urllib.request.urlopen(req, timeout=30) as r:
                      result = json.loads(r.read().decode('utf-8'))
                  if not result.get('ok'):
                      raise RuntimeError(result)
                  sent += 1
          print(f'gwangju_airport_telegram_messages_sent={sent}')
          PY

      - name: Persist state after successful send/check
        if: steps.telegram.outputs.configured == 'true' && success() && hashFiles('out/gwangju_airport_watch_state_pending.json') != ''
        run: cp out/gwangju_airport_watch_state_pending.json data/gwangju_airport_watch_state.json

      - name: Commit watch state
        if: steps.telegram.outputs.configured == 'true' && success() && hashFiles('data/gwangju_airport_watch_state.json') != ''
        run: |
          git config user.name "gwangju-airport-watch[bot]"
          git config user.email "gwangju-airport-watch[bot]@users.noreply.github.com"
          git add data/gwangju_airport_watch_state.json
          if git diff --cached --quiet; then
            echo "Gwangju airport watch state unchanged"
          else
            git commit -m "Update Gwangju airport watch state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwangju-airport-watch-${{ github.run_id }}
          path: |
            out/gwangju_airport_status.md
            out/gwangju_airport_alert.md
            out/gwangju_airport_connection_test.md
            out/gwangju_airport_errors.log
            out/gwangju_airport_watch_state_pending.json
          if-no-files-found: ignore
          retention-days: 14
