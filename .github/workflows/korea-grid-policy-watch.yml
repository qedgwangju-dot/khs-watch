name: Korea Grid Policy Alert Bot Watch

on:
  schedule:
    # GitHub Actions는 UTC 기준. 매시간 37분에 확인.
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "현재 기준선을 저장하고 알림 봇 경로 확인 메시지 전송"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/korea-grid-policy-watch.yml"
      - "scripts/korea_grid_policy_watch.py"
      - "scripts/korea_grid_policy_watch_v2.py"
      - "tests/test_korea_grid_policy_watch.py"
      - "tests/test_korea_grid_policy_watch_v2.py"
      - ".github/korea-grid-policy-trigger"

concurrency:
  group: korea-grid-policy-alert-bot-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 확인
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install requests beautifulsoup4 pytest googlenewsdecoder

      - name: 문법·단위 테스트
        run: |
          python -m compileall -q scripts/korea_grid_policy_watch.py scripts/korea_grid_policy_watch_v2.py
          pytest -q tests/test_korea_grid_policy_watch.py tests/test_korea_grid_policy_watch_v2.py

      - name: 전력망 정책·발주 공식 원문 확인
        id: grid
        shell: bash
        env:
          FORCE_INPUT: ${{ inputs.force_notify || false }}
          FORCE_PUSH: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[grid-route-test]') }}
        run: |
          EXTRA=""
          if [[ "$FORCE_INPUT" == "true" || "$FORCE_PUSH" == "true" ]]; then
            EXTRA="--force-notify"
          fi
          python scripts/korea_grid_policy_watch_v2.py $EXTRA

      - name: 알림 가독성 정리
        if: steps.grid.outputs.changed == 'true'
        env:
          REPORT_PATH: ${{ steps.grid.outputs.report_path }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path(os.environ["REPORT_PATH"])
          text = path.read_text(encoding="utf-8").strip()
          normal_header = "<b>전력망 정책·발주 새 공식 변화</b>"
          if not text.startswith(normal_header):
              print("grid_readability_format=skip_nonstandard_report")
              raise SystemExit(0)

          lines = text.splitlines()
          item_starts = [
              idx for idx, line in enumerate(lines)
              if re.match(r"^<b>\d+\. ", line.strip())
          ]
          if not item_starts:
              print("grid_readability_format=skip_no_items")
              raise SystemExit(0)

          def parse_sections(body):
              sections = []
              current_title = None
              current_lines = []
              for line in body:
                  stripped = line.strip()
                  if re.match(r"^<b>[^<]+</b>$", stripped):
                      if current_title is not None:
                          sections.append((current_title, current_lines))
                      current_title = re.sub(r"^<b>|</b>$", "", stripped)
                      current_lines = []
                  else:
                      if current_title is not None:
                          current_lines.append(line)
              if current_title is not None:
                  sections.append((current_title, current_lines))
              return sections

          out = [
              normal_header,
              "<i>특정 기사 추적이 아니라 공식 정책·법령·사업 단계·발주 변화 감지</i>",
          ]

          for pos, start in enumerate(item_starts):
              end = item_starts[pos + 1] if pos + 1 < len(item_starts) else len(lines)
              block = lines[start:end]
              title_line = block[0].strip()

              stage = ""
              published = ""
              source = ""
              content_start = 1
              for i, line in enumerate(block[1:], start=1):
                  s = line.strip()
                  if s.startswith("<b>단계</b>"):
                      stage = s.replace("<b>단계</b>", "", 1).strip()
                  elif s.startswith("<b>발표일</b>"):
                      published = s.replace("<b>발표일</b>", "", 1).strip()
                  elif s.startswith("<b>출처</b>"):
                      source = s.replace("<b>출처</b>", "", 1).strip()
                      content_start = i + 1

              body = block[content_start:]
              sections = parse_sections(body)
              section_map = {name: rows for name, rows in sections}

              change_rows = section_map.get("핵심 변화") or section_map.get("쉽게 풀면") or []
              investment_rows = section_map.get("투자 의미") or []
              next_rows = section_map.get("다음 확인") or []

              out.append("")
              out.append(title_line)
              out.append("")
              out.append("<b>무엇이 달라졌나</b>")
              if change_rows:
                  out.extend(change_rows)
              else:
                  plain_title = re.sub(r"^<b>\d+\. |</b>$", "", title_line)
                  out.append(f"• {plain_title}")

              out.append("")
              out.append("<b>현재 판정</b>")
              verdict_parts = []
              if stage:
                  verdict_parts.append(stage)
              if published:
                  verdict_parts.append(published)
              out.append("• " + " · ".join(verdict_parts) if verdict_parts else "• 공식 변화 확인")

              if investment_rows:
                  out.append("")
                  out.append("<b>투자 의미</b>")
                  out.extend(investment_rows)

              used = {"핵심 변화", "투자 의미", "다음 확인"}
              # 일반 항목은 '쉽게 풀면'을 상단 '무엇이 달라졌나'로 이동하고,
              # 상세 항목은 핵심 변화와 별도로 쉬운 설명을 유지한다.
              if "핵심 변화" not in section_map:
                  used.add("쉽게 풀면")
              for name, rows in sections:
                  if name in used:
                      continue
                  out.append("")
                  out.append(f"<b>{name}</b>")
                  out.extend(rows)

              if next_rows:
                  out.append("")
                  out.append("<b>다음 확인</b>")
                  out.extend(next_rows)

              out.append("")
              out.append("<b>확정 정보</b>")
              if published:
                  out.append(f"• 발표일  {published}")
              if source:
                  out.append(f"• 출처  {source}")

          path.write_text("\n".join(out).rstrip() + "\n", encoding="utf-8")
          print("grid_readability_format=applied")
          PY

      - name: 지정 전기본·전원믹스 알림 봇으로 Telegram 전송
        if: steps.grid.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.ENERGY_MIX_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ENERGY_MIX_TELEGRAM_CHAT_ID }}
          FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          EXPECTED_TELEGRAM_BOT_USERNAME: khs887988798879887988798879_bot
          REPORT_PATH: ${{ steps.grid.outputs.report_path }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ENERGY_MIX_TELEGRAM_BOT_TOKEN이 없습니다." >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import pathlib
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = (
              os.environ.get("TELEGRAM_CHAT_ID", "").strip()
              or os.environ.get("FALLBACK_TELEGRAM_CHAT_ID", "").strip()
          )
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          report_path = pathlib.Path(os.environ["REPORT_PATH"])
          if not chat_id:
              raise RuntimeError("Telegram chat id가 없습니다.")

          me_response = requests.get(
              f"https://api.telegram.org/bot{token}/getMe",
              timeout=25,
          )
          me_response.raise_for_status()
          me = me_response.json()
          if not me.get("ok"):
              raise RuntimeError(f"Telegram getMe 실패: {me}")
          actual = str(me.get("result", {}).get("username", ""))
          if actual.lower() != expected.lower():
              raise RuntimeError(
                  f"잘못된 Telegram 봇 경로 차단: expected=@{expected}, actual=@{actual or '확인불가'}"
              )

          text = report_path.read_text(encoding="utf-8").strip()
          if not text:
              raise RuntimeError("Telegram으로 보낼 보고서가 비어 있습니다.")

          chunks = []
          while text:
              if len(text) <= 3500:
                  chunks.append(text)
                  break
              cut = text.rfind("\n", 0, 3500)
              if cut < 1700:
                  cut = 3500
              chunks.append(text[:cut].rstrip())
              text = text[cut:].lstrip()

          message_ids = []
          for index, chunk in enumerate(chunks, start=1):
              body = (f"<i>[{index}/{len(chunks)}]</i>\n" if len(chunks) > 1 else "") + chunk
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={
                      "chat_id": chat_id,
                      "text": body,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": True,
                  },
                  timeout=30,
              )
              response.raise_for_status()
              payload = response.json()
              if not payload.get("ok"):
                  raise RuntimeError(f"Telegram 전송 실패: {payload}")
              message_ids.append(payload.get("result", {}).get("message_id"))

          confirmation = {
              "status": "confirmed",
              "bot_username": actual,
              "message_ids": message_ids,
          }
          pathlib.Path("out").mkdir(parents=True, exist_ok=True)
          pathlib.Path("out/korea_grid_policy_telegram_confirmed.json").write_text(
              json.dumps(confirmation, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              f"telegram_delivery_confirmed=true bot=@{actual} "
              f"messages={len(message_ids)} last_message_id={message_ids[-1]}"
          )
          PY

      - name: 기준선·보고서 저장
        if: success()
        run: |
          git config user.name "korea-grid-policy-watch[bot]"
          git config user.email "korea-grid-policy-watch[bot]@users.noreply.github.com"
          git add data/korea_grid_policy_state.json data/korea_grid_policy_event_state.json out 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Korea grid policy alert state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi
