name: Iran Hormuz Telegram connection smoke

on:
  push:
    paths:
      - ".github/workflows/iran-hormuz-market-turn-telegram-smoke.yml"

permissions:
  contents: write

concurrency:
  group: iran-hormuz-telegram-smoke
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send Telegram connection test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "KHS_POLICY_TELEGRAM_BOT_TOKEN 또는 KHS_POLICY_TELEGRAM_CHAT_ID가 없습니다." >&2
            exit 1
          fi
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          now = dt.datetime.now(ZoneInfo("Asia/Seoul"))
          text = (
              "이란·호르무즈 시장 전환 Telegram 연결 시험\n\n"
              f"{now:%Y년 %m월 %d일 %H:%M KST}\n"
              "@hs8879887988798879_bot 연결 확인용입니다. 실제 조건 알림이 아닙니다."
          )
          payload = urllib.parse.urlencode(
              {
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"].strip(),
                  "text": text,
                  "disable_web_page_preview": "true",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN'].strip()}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected message: {result}")
          record = {
              "status": "confirmed",
              "bot": "@hs8879887988798879_bot",
              "message_id": result.get("result", {}).get("message_id"),
              "confirmed_at_kst": now.isoformat(timespec="seconds"),
              "purpose": "iran_hormuz_market_turn_alert",
          }
          path = pathlib.Path("data/iran_hormuz_market_turn_telegram_verified.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"telegram_delivery_confirmed=true message_id={record['message_id']}")
          PY

      - name: Commit verification record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/iran_hormuz_market_turn_telegram_verified.json
          git commit -m "Record Iran Hormuz Telegram connection"
          git pull --rebase origin main
          git push
