name: Samsung SVIC tracker

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST
    - cron: "0 3 * * *"  # 12:00 KST
    - cron: "0 9 * * *"  # 18:00 KST
    - cron: "0 14 * * *" # 23:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samsung-svic-tracker-state-v2
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Restore durable SQLite state
        shell: bash
        run: |
          git clone --single-branch --branch svic-tracker-state-v2 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state-repo \
            || {
              git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state-repo
              git -C state-repo checkout --orphan svic-tracker-state-v2
              git -C state-repo rm -rf --ignore-unmatch .
            }
          mkdir -p app/samsung_svic_tracker/samsung_svic_tracker/state app/samsung_svic_tracker/samsung_svic_tracker/outputs
          if [ -d state-repo/samsung_svic_tracker/state ]; then
            cp -a state-repo/samsung_svic_tracker/state/. app/samsung_svic_tracker/samsung_svic_tracker/state/
          fi
          if [ -d state-repo/samsung_svic_tracker/outputs ]; then
            cp -a state-repo/samsung_svic_tracker/outputs/. app/samsung_svic_tracker/samsung_svic_tracker/outputs/
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/samsung_svic_tracker/samsung_svic_tracker/requirements.txt

      - name: Install and test
        working-directory: app/samsung_svic_tracker/samsung_svic_tracker
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Run incremental monitor
        id: monitor
        working-directory: app/samsung_svic_tracker/samsung_svic_tracker
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SVIC_TELEGRAM_CHAT_ID: ${{ secrets.SVIC_TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Persist SQLite, raw documents, and outputs
        if: always()
        shell: bash
        run: |
          mkdir -p state-repo/samsung_svic_tracker/state state-repo/samsung_svic_tracker/outputs
          cp -a app/samsung_svic_tracker/samsung_svic_tracker/state/. state-repo/samsung_svic_tracker/state/ || true
          cp -a app/samsung_svic_tracker/samsung_svic_tracker/outputs/. state-repo/samsung_svic_tracker/outputs/ || true
          git -C state-repo config user.name github-actions[bot]
          git -C state-repo config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C state-repo add samsung_svic_tracker/state samsung_svic_tracker/outputs
          git -C state-repo commit -m "state: SVIC tracker ${{ github.run_id }}" || exit 0
          git -C state-repo push origin HEAD:svic-tracker-state-v2
