name: Treasury Positioning Watch

on:
  schedule:
    - cron: "40 8 * * 6"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treasury-positioning-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs8879887988798879_bot"
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate watcher
        run: python -m py_compile scripts/treasury_positioning_watch.py

      - name: Validate exact Telegram bot route
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=(os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          expected=(os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("GLOBAL_RATES_TELEGRAM_BOT_TOKEN missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              p=json.loads(r.read().decode())
          actual=str((p.get("result") or {}).get("username") or "")
          if not p.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{actual}")
          PY

      - name: Run Treasury positioning watch
        run: python scripts/treasury_positioning_watch.py

      - name: Commit positioning state
        if: success()
        run: |
          if [ ! -f data/treasury_positioning_state.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasury_positioning_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Treasury positioning state"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-positioning-${{ github.run_id }}
          path: |
            out/treasury_positioning_watch.txt
            data/treasury_positioning_state.json
          if-no-files-found: ignore
          retention-days: 14
