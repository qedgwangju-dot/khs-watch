name: KOSPI Derivatives Flow Telegram Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kospi-derivatives-flow-telegram-watch.yml"
      - "scripts/kospi_derivatives_flow_watch.py"
      - "scripts/ls_openapi_probe.py"
      - "scripts/ls_ebest_realtime_probe.py"
  schedule:
    - cron: "*/5 4-6 * * 1-5"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a one-time Telegram route test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: kospi-derivatives-flow-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
      LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
      LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests websocket-client ebest

      - name: Verify exact Telegram route
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = ((os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or "").strip()
                     or (os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip())
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("Missing GitHub Actions secret: KOSPI_DERIV_TELEGRAM_BOT_TOKEN")
          if not chat_id:
              raise RuntimeError("Missing Telegram chat id: set KOSPI_DERIV_TELEGRAM_CHAT_ID or GLOBAL_RATES_TELEGRAM_CHAT_ID")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{actual}")
          PY

      - name: Verify LS OpenAPI official realtime client
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ls-test]'))
        run: |
          rm -f out/ls_ebest_realtime_probe.json
          python -m py_compile scripts/ls_ebest_realtime_probe.py
          python scripts/ls_ebest_realtime_probe.py
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('out/ls_ebest_realtime_probe.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          print('## LS증권 공식 실시간 클라이언트 검증')
          print(f"- 최근월물 선물: {d.get('front_future')}")
          print(f"- 위클리옵션 표본: {d.get('weekly_option_sample')}")
          for r in d.get('registrations') or []:
              print(f"- {r.get('tr_cd')} 등록: {'성공' if r.get('ok') else '실패'}")
          PY

      - name: Run KOSPI derivatives flow watcher
        run: |
          rm -f out/kospi_derivatives_flow_alert.html out/kospi_derivatives_flow_status.md out/kospi_derivatives_flow_errors.log out/kospi_derivatives_flow_connection_test.html
          python -m py_compile scripts/kospi_derivatives_flow_watch.py
          python scripts/kospi_derivatives_flow_watch.py
          cat out/kospi_derivatives_flow_status.md >> "$GITHUB_STEP_SUMMARY"
          if [ -s out/kospi_derivatives_flow_errors.log ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## 조회 오류" >> "$GITHUB_STEP_SUMMARY"
            cat out/kospi_derivatives_flow_errors.log >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build manual connection test
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.send_test == 'true') || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[telegram-test]') || contains(github.event.head_commit.message, '[ls-test]')))
        run: |
          cat > out/kospi_derivatives_flow_connection_test.html <<'EOF'
          ✅ <b>코스피 파생·수급 경보 연결 정상</b>

          <b>LS증권 실시간 데이터 연결</b>
          • 송출 봇: <b>@khs887900887900008879_bot</b>
          • LS증권 APP Key·Secret 인증: <b>정상</b>
          • LS 공식 Python 클라이언트로 <b>지수 IJ_ · 프로그램매매 PM_ · KOSPI200 선물 FC0 · 옵션 OC0</b> 등록 검증
          • 최근월물 선물·위클리옵션 종목은 마스터에서 자동 탐색

          <b>경보 기준</b>
          • KOSPI 10분 <b>-1.50% 이하</b> 또는 최근 15분 고점 대비 <b>-2.00% 이하</b>
          • 저점 대비 <b>+1.20% 이상</b> 회복 시 되돌림 경보
          • 실시간 파생·프로그램 수급으로 급락 원인 판별을 보강
          EOF

      - name: Send Telegram messages
        if: hashFiles('out/kospi_derivatives_flow_connection_test.html') != '' || hashFiles('out/kospi_derivatives_flow_alert.html') != ''
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = ((os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or "").strip()
                     or (os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip())
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          files = [pathlib.Path("out/kospi_derivatives_flow_connection_test.html"), pathlib.Path("out/kospi_derivatives_flow_alert.html")]
          sent_ids = []
          for path in files:
              if not path.exists(): continue
              text = path.read_text(encoding="utf-8").strip()
              if not text: continue
              chunks=[]
              while len(text)>3800:
                  cut=text.rfind("\n\n",0,3800)
                  if cut<1000: cut=3800
                  chunks.append(text[:cut].strip()); text=text[cut:].strip()
              if text: chunks.append(text)
              for chunk in chunks:
                  payload=urllib.parse.urlencode({"chat_id":chat_id,"text":chunk,"parse_mode":"HTML","disable_web_page_preview":"true"}).encode("utf-8")
                  req=urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage",data=payload,method="POST")
                  with urllib.request.urlopen(req,timeout=30) as response:
                      result=json.loads(response.read().decode("utf-8"))
                  if not result.get("ok"): raise RuntimeError(f"Telegram rejected message: {result}")
                  sent_ids.append(result["result"].get("message_id"))
          print(f"telegram_delivery_confirmed=true bot=@{actual} messages={len(sent_ids)} ids={sent_ids}")
          PY

      - name: Commit intraday state
        if: success() && hashFiles('data/kospi_derivatives_flow_state.json') != ''
        run: |
          git config user.name "kospi-derivatives-flow-watch[bot]"
          git config user.email "kospi-derivatives-flow-watch[bot]@users.noreply.github.com"
          cp data/kospi_derivatives_flow_state.json /tmp/kospi_derivatives_flow_state.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/kospi_derivatives_flow_state.json data/kospi_derivatives_flow_state.json
            git add data/kospi_derivatives_flow_state.json
            if git diff --cached --quiet; then echo "KOSPI derivatives flow state unchanged"; exit 0; fi
            git commit -m "Update KOSPI derivatives flow state"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kospi-derivatives-flow-watch-${{ github.run_id }}
          path: |
            out/kospi_derivatives_flow_status.md
            out/kospi_derivatives_flow_errors.log
            out/kospi_derivatives_flow_alert.html
            out/kospi_derivatives_flow_connection_test.html
            out/ls_ebest_realtime_probe.json
            data/kospi_derivatives_flow_state.json
          if-no-files-found: ignore
          retention-days: 14
