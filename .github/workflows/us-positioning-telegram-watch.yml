name: US Positioning Telegram Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/us-positioning-telegram-watch.yml"
      - "scripts/us_positioning_watch.py"
      - "scripts/us_positioning_presentation.py"
      - "scripts/us_positioning_horizons.py"
      - "scripts/us_positioning_context.py"
      - "scripts/us_positioning_amounts.py"
      - "scripts/us_positioning_fx.py"
      - "scripts/us_positioning_telegram.py"
      - "tests/test_us_positioning_telegram.py"
      - "scripts/us_positioning_etf_short_interest.py"
      - "tests/test_us_positioning_etf_short_interest.py"
      - "scripts/us_equity_cta_scenario_watch.py"
      - "tests/test_us_equity_cta_scenario_watch.py"
  schedule:
    # Completed-session checks only. KST 08:12 / 10:12 are after the U.S. close;
    # the former 22:12 KST pre-open slot was removed because it could mix live
    # SOX/Cboe values with completed-session CFTC data.
    - cron: "12 23 * * 0-4"  # KST Mon-Fri 08:12 (UTC Sun-Thu)
    - cron: "12 1 * * 1-5"   # KST Mon-Fri 10:12 (UTC Mon-Fri)
    # Separate public Goldman US equity CTA checks: 14:17 and 20:17 KST.
    - cron: "17 5,11 * * 1-5"
    # Backups for GitHub scheduled-event delay/drop. State fingerprints dedupe sends.
    - cron: "27 23 * * 0-4"  # KST Mon-Fri 08:27 (UTC Sun-Thu)
    - cron: "27 1 * * 1-5"   # KST Mon-Fri 10:27 (UTC Mon-Fri)
    # Daily KST morning snapshot, including unchanged days, with a 15-minute retry.
    - cron: "30 7 * * *"
      timezone: "Asia/Seoul"
    - cron: "45 7 * * *"
      timezone: "Asia/Seoul"
  # Recover a dropped US positioning morning cron from the existing CTA schedule.
  workflow_run:
    # Two existing independent schedules; only the missing-digest gate may run.
    workflows: ["Treasury CTA squeeze Telegram alert", "Warsh Reaction Function Telegram Watch"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force one report even when values are unchanged"
        required: false
        default: "false"
        type: choice
        options: ["false","true"]

permissions:
  contents: write
  actions: write

concurrency:
  # Code-only pushes must never queue ahead of production schedule alerts.
  # Both lanes retain non-cancelling run policy; push never sends or writes state.
  group: us-positioning-telegram-watch-${{ github.event_name == 'push' && 'code-audit' || 'production' }}
  cancel-in-progress: false

jobs:
  missed_digest_gate:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      due: ${{ steps.check.outputs.due }}
      digest: ${{ steps.check.outputs.digest }}
    steps:
      - name: Check current US positioning daily digest on main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Recover only genuinely missing KST morning digests
        id: check
        run: |
          python - <<'PY'
          import datetime as dt
          import json, os, pathlib
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(ZoneInfo("Asia/Seoul"))
          file=pathlib.Path("data/us_positioning_state.json")
          if not file.is_file():
              raise RuntimeError("US positioning state missing, refusing a forced baseline")
          try:
              state=json.loads(file.read_text(encoding="utf-8"))
          except Exception as exc:
              raise RuntimeError("US positioning state unreadable, preserve prior sends") from exc
          last=str(state.get("daily_digest_sent_date_kst") or "")
          due=(dt.time(7,45)<=now.time()<=dt.time(11,45)
               and last!=now.date().isoformat())
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as handle:
              handle.write("due="+str(due).lower()+"\n")
              handle.write("digest="+str(due).lower()+"\n")
          print("us_positioning_missed_daily_digest="+str(due).lower()
                +" last="+(last or "unknown")
                +" checked="+now.isoformat())
          PY

  watch:
    needs: missed_digest_gate
    if: ${{ always() && (github.event_name != 'workflow_run' || needs.missed_digest_gate.outputs.due == 'true') && !(github.event_name == 'schedule' && github.event.schedule == '17 5,11 * * 1-5') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      DAILY_DIGEST: ${{ ((github.event_name == 'schedule' && (github.event.schedule == '30 7 * * *' || github.event.schedule == '45 7 * * *')) || (github.event_name == 'workflow_run' && needs.missed_digest_gate.outputs.digest == 'true')) && 'true' || 'false' }}
      FORCE_SEND: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.force_send == 'true') || (github.event_name == 'schedule' && (github.event.schedule == '30 7 * * *' || github.event.schedule == '45 7 * * *')) || (github.event_name == 'workflow_run' && needs.missed_digest_gate.outputs.digest == 'true')) && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Scheduled events can queue behind another run. Read the state that
          # was confirmed by that run, not the SHA captured when this was queued.
          ref: main
          fetch-depth: 0

      - name: Record the checked-out revision
        run: echo "US_POSITIONING_CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check unresolved Telegram image delivery
        id: delivery_guard
        run: python scripts/us_positioning_telegram.py check-guard --guard data/us_positioning_delivery_guard.json --status out/us_positioning_delivery_status.md

      - name: Install dependencies
        if: steps.delivery_guard.outputs.blocked != 'true'
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 pandas lxml playwright "exchange_calendars>=4.5,<5"

      - name: Verify exact Telegram route
        if: steps.delivery_guard.outputs.blocked != 'true'
        run: |
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "Telegram token missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "Telegram chat id missing"; exit 1; }
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          expected=os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              j=json.loads(r.read().decode())
          actual=str((j.get("result") or {}).get("username") or "")
          if not j.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{actual}")
          PY

      - name: Query positioning sources
        if: steps.delivery_guard.outputs.blocked != 'true'
        run: |
          python -m py_compile scripts/us_positioning_watch.py scripts/us_positioning_presentation.py scripts/us_positioning_delivery.py scripts/us_positioning_horizons.py scripts/us_positioning_context.py scripts/us_positioning_amounts.py scripts/us_positioning_fx.py scripts/us_positioning_telegram.py
          for attempt in 1 2 3; do
            rm -f out/us_positioning_alert.html out/us_positioning_alert.png out/us_positioning_status.md out/us_positioning_pending_state.json out/us_positioning_telegram_confirmed.json out/us_positioning_telegram_attempt.json out/us_positioning_telegram_rejected.json out/us_positioning_telegram_unconfirmed.json
            if python scripts/us_positioning_watch.py; then
              cat out/us_positioning_status.md >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "US positioning transient failure; retry $attempt/3" >&2
            sleep $((attempt * 4))
          done
          exit 1

      - name: Ensure Korean fonts for the Telegram report image
        if: github.event_name != 'push' && steps.delivery_guard.outputs.blocked != 'true' && hashFiles('out/us_positioning_alert.html') != ''
        run: |
          if ! fc-match -f '%{family}' 'Noto Sans CJK KR' | grep -Eiq 'Noto (Sans|Serif) CJK' || ! fc-match -f '%{family}' 'Noto Color Emoji' | grep -Eiq 'Noto Color Emoji'; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
          fi
          fc-match -f '%{family}\n' 'Noto Sans CJK KR' | tee /tmp/us_positioning_korean_font.txt
          grep -Eiq 'Noto (Sans|Serif) CJK' /tmp/us_positioning_korean_font.txt || { echo 'Korean Noto font unavailable; refusing an unreadable image'; exit 1; }

      - name: Render Telegram report image
        if: github.event_name != 'push' && steps.delivery_guard.outputs.blocked != 'true' && hashFiles('out/us_positioning_alert.html') != ''
        run: python scripts/us_positioning_telegram.py render --alert out/us_positioning_alert.html --image out/us_positioning_alert.png | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Persist Telegram photo attempt guard before sending
        if: github.event_name != 'push' && steps.delivery_guard.outputs.blocked != 'true' && hashFiles('out/us_positioning_alert.html') != '' && hashFiles('out/us_positioning_alert.png') != ''
        run: |
          python scripts/us_positioning_telegram.py prepare-attempt \
            --alert out/us_positioning_alert.html \
            --image out/us_positioning_alert.png \
            --guard data/us_positioning_delivery_guard.json \
            --output out/us_positioning_telegram_attempt.json \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$US_POSITIONING_CHECKOUT_SHA"
          cp out/us_positioning_telegram_attempt.json /tmp/us_positioning_telegram_attempt.json
          git config user.name "us-positioning-watch[bot]"
          git config user.email "us-positioning-watch[bot]@users.noreply.github.com"
          persisted=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json, pathlib
          target=pathlib.Path("data/us_positioning_delivery_guard.json")
          candidate=json.loads(pathlib.Path("/tmp/us_positioning_telegram_attempt.json").read_text(encoding="utf-8"))
          prior=json.loads(target.read_text(encoding="utf-8")) if target.exists() else {}
          if prior.get("attempt_id")==candidate.get("attempt_id") and prior.get("status")=="unconfirmed":
              print("photo_attempt_guard=already_persisted")
          elif prior and prior.get("status") not in {"confirmed","retry_safe"}:
              raise RuntimeError("Prior Telegram photo outcome is unresolved; refusing a new send")
          else:
              pathlib.Path("data").mkdir(exist_ok=True)
              target.write_text(json.dumps(candidate,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              print("photo_attempt_guard=prepared")
          PY
            if [ -z "$(git status --porcelain -- data/us_positioning_delivery_guard.json)" ]; then
              current_attempt=$(python -c 'import json;print(json.load(open("data/us_positioning_delivery_guard.json",encoding="utf-8")).get("attempt_id",""))')
              if [ "$current_attempt" = "$(python -c 'import json;print(json.load(open("/tmp/us_positioning_telegram_attempt.json",encoding="utf-8")).get("attempt_id",""))')" ]; then persisted=true; break; fi
              echo "Refusing to send because the attempt guard was not persisted" >&2
              exit 1
            fi
            git add data/us_positioning_delivery_guard.json
            git commit -m "Record US positioning Telegram photo attempt"
            if git push origin HEAD:main; then persisted=true; break; fi
            sleep $((attempt * 3))
          done
          test "$persisted" = true

      - name: Watchdog existing Treasury CTA route
        if: github.event_name == 'schedule' && github.event.schedule != '30 7 * * *' && github.event.schedule != '45 7 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.request
          from zoneinfo import ZoneInfo

          KST=ZoneInfo("Asia/Seoul")
          now=dt.datetime.now(KST)
          # CTA regular market window: 21:00~08:45 KST.
          in_window=(now.time() >= dt.time(21,0) or now.time() <= dt.time(8,45))
          if not in_window:
              print("cta_watchdog=outside_regular_window")
              raise SystemExit(0)

          state_path=pathlib.Path("data/treasury_cta_squeeze_state.json")
          age_min=None
          if state_path.exists():
              try:
                  state=json.loads(state_path.read_text(encoding="utf-8"))
                  raw=str(state.get("last_checked_kst") or "")
                  checked=dt.datetime.fromisoformat(raw)
                  if checked.tzinfo is None:
                      checked=checked.replace(tzinfo=KST)
                  age_min=(now-checked.astimezone(KST)).total_seconds()/60.0
              except Exception as exc:
                  print(f"cta_watchdog=state_parse_error {type(exc).__name__}:{exc}")

          if age_min is not None and -5 <= age_min <= 45:
              print(f"cta_watchdog=fresh age_minutes={age_min:.1f}")
              raise SystemExit(0)

          repo=os.environ["REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          workflow="treasury-cta-squeeze-telegram-alert.yml"
          base=f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}"
          headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
          }

          req=urllib.request.Request(f"{base}/runs?per_page=10",headers=headers)
          with urllib.request.urlopen(req,timeout=20) as r:
              runs=json.loads(r.read().decode("utf-8")).get("workflow_runs",[])
          active=[x for x in runs if x.get("status") in {"queued","in_progress"}]
          if active:
              print(f"cta_watchdog=active run_id={active[0].get('id')} status={active[0].get('status')}")
              raise SystemExit(0)

          body=json.dumps({"ref":"main"}).encode("utf-8")
          req=urllib.request.Request(
              f"{base}/dispatches",
              data=body,
              headers={**headers,"Content-Type":"application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req,timeout=20) as r:
              if r.status not in (204,201):
                  raise RuntimeError(f"CTA workflow dispatch unexpected status={r.status}")
          print(f"cta_watchdog=dispatched stale_age_minutes={age_min}")
          PY

      - name: Send Telegram report image
        if: github.event_name != 'push' && steps.delivery_guard.outputs.blocked != 'true' && hashFiles('out/us_positioning_alert.html') != '' && hashFiles('out/us_positioning_alert.png') != ''
        run: python scripts/us_positioning_telegram.py send-photo --alert out/us_positioning_alert.html --image out/us_positioning_alert.png --guard data/us_positioning_delivery_guard.json --receipt out/us_positioning_telegram_confirmed.json --rejection out/us_positioning_telegram_rejected.json --unconfirmed out/us_positioning_telegram_unconfirmed.json

      - name: Record Telegram photo rejection as safe to retry
        if: always() && github.event_name != 'push' && steps.delivery_guard.outputs.blocked != 'true' && hashFiles('out/us_positioning_telegram_rejected.json') != ''
        run: |
          python scripts/us_positioning_telegram.py mark-retry-safe --guard data/us_positioning_delivery_guard.json --rejection out/us_positioning_telegram_rejected.json
          cp data/us_positioning_delivery_guard.json /tmp/us_positioning_delivery_guard.json
          git config user.name "us-positioning-watch[bot]"
          git config user.email "us-positioning-watch[bot]@users.noreply.github.com"
          persisted=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json, pathlib
          target=pathlib.Path("data/us_positioning_delivery_guard.json")
          desired=json.loads(pathlib.Path("/tmp/us_positioning_delivery_guard.json").read_text(encoding="utf-8"))
          if not target.exists():
              raise RuntimeError("Delivery guard disappeared before rejection could be recorded")
          current=json.loads(target.read_text(encoding="utf-8"))
          if current.get("attempt_id")!=desired.get("attempt_id") or current.get("status") not in {"unconfirmed","retry_safe"}:
              raise RuntimeError("Delivery guard changed; refusing to overwrite another attempt")
          target.write_text(json.dumps(desired,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
            git add data/us_positioning_delivery_guard.json
            if git diff --cached --quiet; then persisted=true; break; fi
            git commit -m "Record rejected US positioning Telegram photo"
            if git push origin HEAD:main; then persisted=true; break; fi
            sleep $((attempt * 3))
          done
          test "$persisted" = true

      - name: Persist state after successful delivery
        if: github.event_name != 'push' && success() && hashFiles('out/us_positioning_pending_state.json') != ''
        run: |
          python - <<'PY'
          import pathlib
          alert=pathlib.Path("out/us_positioning_alert.html")
          confirmed=pathlib.Path("out/us_positioning_telegram_confirmed.json")
          pending=pathlib.Path("out/us_positioning_pending_state.json")
          image=pathlib.Path("out/us_positioning_alert.png")
          receipt=pathlib.Path("out/us_positioning_telegram_confirmed.json")
          guard=pathlib.Path("data/us_positioning_delivery_guard.json")
          target=pathlib.Path("data/us_positioning_state.json")
          if alert.exists():
              if not image.exists() or not receipt.exists() or not guard.exists():
                  raise RuntimeError("US positioning image or Telegram photo receipt is missing; state will not advance")
              import json, subprocess
              receipt_data=json.loads(receipt.read_text(encoding="utf-8"))
              if receipt_data.get("delivery_method")!="sendPhoto":
                  raise RuntimeError("Telegram receipt is not for sendPhoto; state will not advance")
              subprocess.run([
                  "python","scripts/us_positioning_telegram.py","confirm-guard",
                  "--guard",str(guard),"--receipt",str(receipt),
              ],check=True)
              confirmed.write_text(json.dumps(receipt_data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if alert.exists() and not confirmed.exists():
              raise RuntimeError("US positioning alert generated but Telegram photo delivery is unconfirmed")
          if pending.exists():
              target.write_text(pending.read_text(encoding="utf-8"),encoding="utf-8")
          PY

      - name: Commit watcher state
        if: github.event_name != 'push' && success() && hashFiles('out/us_positioning_pending_state.json') != ''
        run: |
          git config user.name "us-positioning-watch[bot]"
          git config user.email "us-positioning-watch[bot]@users.noreply.github.com"
          cp data/us_positioning_state.json /tmp/us_positioning_state.json
          if [ -f data/us_positioning_delivery_guard.json ]; then cp data/us_positioning_delivery_guard.json /tmp/us_positioning_delivery_guard.json; else rm -f /tmp/us_positioning_delivery_guard.json; fi
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/us_positioning_state.json data/us_positioning_state.json
            if [ -f /tmp/us_positioning_delivery_guard.json ]; then
              python - <<'PY'
          import json, pathlib
          target=pathlib.Path("data/us_positioning_delivery_guard.json")
          desired=json.loads(pathlib.Path("/tmp/us_positioning_delivery_guard.json").read_text(encoding="utf-8"))
          if not target.exists():
              raise RuntimeError("Delivery guard disappeared before state commit")
          current=json.loads(target.read_text(encoding="utf-8"))
          if current.get("attempt_id")!=desired.get("attempt_id") or current.get("status") not in {"unconfirmed","confirmed"}:
              raise RuntimeError("Delivery guard changed; refusing to overwrite another attempt")
          target.write_text(json.dumps(desired,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
            fi
            git add data/us_positioning_state.json
            if [ -f data/us_positioning_delivery_guard.json ]; then git add data/us_positioning_delivery_guard.json; fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update US positioning watch state"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-positioning-watch-${{ github.run_id }}
          path: |
            out/us_positioning_status.md
            out/us_positioning_alert.html
            out/us_positioning_alert.png
            out/us_positioning_detail.html
            out/us_positioning_pending_state.json
            out/us_positioning_telegram_confirmed.json
            out/us_positioning_telegram_attempt.json
            out/us_positioning_telegram_rejected.json
            out/us_positioning_telegram_unconfirmed.json
            out/us_positioning_delivery_status.md
            out/us_positioning_source_evidence.json
            out/us_positioning_sources/
            data/us_positioning_delivery_guard.json
          if-no-files-found: ignore
          retention-days: 14


  etf_short_interest:
    needs: missed_digest_gate
    # The trusted missing-digest recovery also checks the existing ETF SI lane.
    if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule != '17 5,11 * * 1-5') || github.event_name == 'push' || (github.event_name == 'workflow_run' && needs.missed_digest_gate.outputs.due == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}

    steps:
      - name: Checkout latest US positioning delivery state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ETF short-interest validation dependencies
        run: python -m pip install --disable-pip-version-check -q beautifulsoup4 pytest

      - name: Test publication-date, source-consensus and dedupe guards
        run: |
          python -m py_compile scripts/us_positioning_etf_short_interest.py
          python -m pytest -q tests/test_us_positioning_etf_short_interest.py

      - name: Check QQQ-SPY published short interest, send only if confirmed
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/us_positioning_etf_short_interest.py --validate-only
          else
            python scripts/us_positioning_etf_short_interest.py
          fi

      - name: Commit ETF SI state only after Telegram receipt
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_run' && needs.missed_digest_gate.outputs.due == 'true')) && hashFiles('out/us_positioning_etf_short_interest_confirmed.json') != ''
        run: |
          test -s out/us_positioning_etf_short_interest_confirmed.json
          test -s data/us_positioning_etf_short_interest_state.json
          git config user.name "us-positioning-short-interest[bot]"
          git config user.email "us-positioning-short-interest[bot]@users.noreply.github.com"
          cp data/us_positioning_etf_short_interest_state.json /tmp/etf_si_state.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/etf_si_state.json data/us_positioning_etf_short_interest_state.json
            git add data/us_positioning_etf_short_interest_state.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record confirmed QQQ SPY short-interest Telegram delivery"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload ETF SI source and delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-etf-short-interest-${{ github.run_id }}
          path: |
            out/us_positioning_etf_short_interest_status.json
            out/us_positioning_etf_short_interest_confirmed.json
            data/us_positioning_etf_short_interest_state.json
          if-no-files-found: ignore
          retention-days: 14

  equity_cta_scenario:
    needs: missed_digest_gate
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && needs.missed_digest_gate.outputs.due == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public CTA two-source and scenario guards
        run: |
          python -m pip install --disable-pip-version-check --quiet beautifulsoup4 pytest
          python -m py_compile scripts/us_equity_cta_scenario_watch.py
          python -m pytest -q tests/test_us_equity_cta_scenario_watch.py
      - name: Check public CTA scenarios independently
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/us_equity_cta_scenario_watch.py --validate-only
          else
            python scripts/us_equity_cta_scenario_watch.py
          fi
      - name: Commit CTA delivery receipt only after Telegram confirms
        if: ${{ github.event_name != 'push' && hashFiles('out/us_equity_cta_scenario_receipt.json') != '' }}
        run: |
          test -s out/us_equity_cta_scenario_pending.json
          test -s out/us_equity_cta_scenario_receipt.json
          cp out/us_equity_cta_scenario_pending.json /tmp/cta_state.json
          git config user.name "us-equity-cta[bot]"
          git config user.email "us-equity-cta[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch --quiet origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/cta_state.json data/us_equity_cta_scenario_state.json
            git add data/us_equity_cta_scenario_state.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record US equity CTA verified Telegram receipt"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Upload CTA scenario audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-equity-cta-${{ github.run_id }}
          path: |
            out/us_equity_cta_scenario_status.json
            out/us_equity_cta_scenario_receipt.json
            out/us_equity_cta_scenario_pending.json
          if-no-files-found: ignore
          retention-days: 14

