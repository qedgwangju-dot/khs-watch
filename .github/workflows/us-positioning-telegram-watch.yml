name: US Positioning Telegram Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/us-positioning-telegram-watch.yml"
      - "scripts/us_positioning_watch.py"
  schedule:
    # Weekdays: KST 08:12 / 10:12 / 22:12; catches US close, CFTC Friday refresh, and daytime confirmation.
    - cron: "12 23,1,13 * * 1-5"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force one report even when values are unchanged"
        required: false
        default: "false"
        type: choice
        options: ["false","true"]

permissions:
  contents: write
  actions: write

concurrency:
  group: us-positioning-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_send == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 pandas lxml playwright

      - name: Verify exact Telegram route
        run: |
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "Telegram token missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "Telegram chat id missing"; exit 1; }
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          expected=os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              j=json.loads(r.read().decode())
          actual=str((j.get("result") or {}).get("username") or "")
          if not j.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{actual}")
          PY

      - name: Query positioning sources
        run: |
          python -m py_compile scripts/us_positioning_watch.py
          for attempt in 1 2 3; do
            rm -f out/us_positioning_alert.html out/us_positioning_status.md out/us_positioning_pending_state.json out/us_positioning_telegram_confirmed.json
            if python scripts/us_positioning_watch.py; then
              cat out/us_positioning_status.md >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "US positioning transient failure; retry $attempt/3" >&2
            sleep $((attempt * 4))
          done
          exit 1

      - name: Watchdog existing Treasury CTA route
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.request
          from zoneinfo import ZoneInfo

          KST=ZoneInfo("Asia/Seoul")
          now=dt.datetime.now(KST)
          # CTA regular market window: 21:00~08:45 KST.
          in_window=(now.time() >= dt.time(21,0) or now.time() <= dt.time(8,45))
          if not in_window:
              print("cta_watchdog=outside_regular_window")
              raise SystemExit(0)

          state_path=pathlib.Path("data/treasury_cta_squeeze_state.json")
          age_min=None
          if state_path.exists():
              try:
                  state=json.loads(state_path.read_text(encoding="utf-8"))
                  raw=str(state.get("last_checked_kst") or "")
                  checked=dt.datetime.fromisoformat(raw)
                  if checked.tzinfo is None:
                      checked=checked.replace(tzinfo=KST)
                  age_min=(now-checked.astimezone(KST)).total_seconds()/60.0
              except Exception as exc:
                  print(f"cta_watchdog=state_parse_error {type(exc).__name__}:{exc}")

          if age_min is not None and -5 <= age_min <= 45:
              print(f"cta_watchdog=fresh age_minutes={age_min:.1f}")
              raise SystemExit(0)

          repo=os.environ["REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          workflow="treasury-cta-squeeze-telegram-alert.yml"
          base=f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}"
          headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
          }

          req=urllib.request.Request(f"{base}/runs?per_page=10",headers=headers)
          with urllib.request.urlopen(req,timeout=20) as r:
              runs=json.loads(r.read().decode("utf-8")).get("workflow_runs",[])
          active=[x for x in runs if x.get("status") in {"queued","in_progress"}]
          if active:
              print(f"cta_watchdog=active run_id={active[0].get('id')} status={active[0].get('status')}")
              raise SystemExit(0)

          body=json.dumps({"ref":"main"}).encode("utf-8")
          req=urllib.request.Request(
              f"{base}/dispatches",
              data=body,
              headers={**headers,"Content-Type":"application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req,timeout=20) as r:
              if r.status not in (204,201):
                  raise RuntimeError(f"CTA workflow dispatch unexpected status={r.status}")
          print(f"cta_watchdog=dispatched stale_age_minutes={age_min}")
          PY

      - name: Send Telegram update
        if: hashFiles('out/us_positioning_alert.html') != ''
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.parse, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id=os.environ["TELEGRAM_CHAT_ID"].strip()
          expected=os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          confirm=pathlib.Path("out/us_positioning_telegram_confirmed.json")
          confirm.unlink(missing_ok=True)

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              ident=json.loads(r.read().decode())
          actual=str((ident.get("result") or {}).get("username") or "")
          if not ident.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")

          text=pathlib.Path("out/us_positioning_alert.html").read_text(encoding="utf-8").strip()
          # Split only on line boundaries so HTML tags are never cut in half.
          chunks=[]
          current=[]
          current_len=0
          for line in text.splitlines():
              add=len(line)+(1 if current else 0)
              if len(line)>3800:
                  raise RuntimeError(f"US positioning single line too long: {len(line)}")
              if current and current_len+add>3800:
                  chunks.append("\n".join(current))
                  current=[line]
                  current_len=len(line)
              else:
                  current.append(line)
                  current_len+=add
          if current:
              chunks.append("\n".join(current))
          if not chunks:
              raise RuntimeError("US positioning Telegram message is empty")

          ids=[]
          for idx,chunk in enumerate(chunks, start=1):
              last=None
              for attempt in range(3):
                  try:
                      data=urllib.parse.urlencode({
                          "chat_id":chat_id,
                          "text":chunk,
                          "parse_mode":"HTML",
                          "disable_web_page_preview":"true",
                      }).encode()
                      req=urllib.request.Request(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data=data,
                          method="POST",
                      )
                      with urllib.request.urlopen(req,timeout=30) as r:
                          j=json.loads(r.read().decode())
                      if not j.get("ok"):
                          raise RuntimeError(f"Telegram rejected: {j}")
                      ids.append((j.get("result") or {}).get("message_id"))
                      break
                  except Exception as exc:
                      last=exc
                      if attempt==2:
                          raise
                      time.sleep(2*(attempt+1))

          confirm.write_text(
              json.dumps({
                  "bot_username":actual,
                  "message_ids":ids,
                  "message_count":len(ids),
              },ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          print(f"telegram_delivery_confirmed=true bot=@{actual} messages={len(ids)} ids={ids}")
          PY

      - name: Persist state after successful delivery
        if: success() && hashFiles('out/us_positioning_pending_state.json') != ''
        run: |
          python - <<'PY'
          import pathlib
          alert=pathlib.Path("out/us_positioning_alert.html")
          confirmed=pathlib.Path("out/us_positioning_telegram_confirmed.json")
          pending=pathlib.Path("out/us_positioning_pending_state.json")
          target=pathlib.Path("data/us_positioning_state.json")
          if alert.exists() and not confirmed.exists():
              raise RuntimeError("US positioning alert generated but Telegram delivery is unconfirmed")
          if pending.exists():
              target.write_text(pending.read_text(encoding="utf-8"),encoding="utf-8")
          PY

      - name: Commit watcher state
        if: success() && hashFiles('out/us_positioning_pending_state.json') != ''
        run: |
          git config user.name "us-positioning-watch[bot]"
          git config user.email "us-positioning-watch[bot]@users.noreply.github.com"
          cp data/us_positioning_state.json /tmp/us_positioning_state.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/us_positioning_state.json data/us_positioning_state.json
            git add data/us_positioning_state.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update US positioning watch state"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-positioning-watch-${{ github.run_id }}
          path: |
            out/us_positioning_status.md
            out/us_positioning_alert.html
            out/us_positioning_pending_state.json
            out/us_positioning_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
