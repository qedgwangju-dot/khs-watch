name: Honam Water Risk Alert Once

on:
  push:
    paths:
      - ".github/workflows/honam-water-risk-alert-once.yml"
      - "scripts/patch_honam_water_watch_once.py"

permissions:
  contents: write

jobs:
  patch-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.HONAM_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.HONAM_TELEGRAM_CHAT_ID }}
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887988798879887988798879_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch watcher scope
        run: |
          python scripts/patch_honam_water_watch_once.py
          python -m py_compile scripts/honam_semiconductor_watch.py
          grep -q 'site:nars.go.kr 호남 반도체 클러스터 용수' scripts/honam_semiconductor_watch.py
          grep -q '하수재이용수' scripts/honam_semiconductor_watch.py

      - name: Commit watcher patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/honam_semiconductor_watch.py
          git commit -m "Expand Honam watch to water supply risks" || true
          git pull --rebase origin main
          git push

      - name: Send current water-risk alert
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = (os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          chat_id = (os.getenv('TELEGRAM_CHAT_ID') or '').strip()
          expected = (os.getenv('EXPECTED_TELEGRAM_BOT_USERNAME') or '').strip().lstrip('@')
          if not token or not chat_id:
              raise RuntimeError('Telegram secrets missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
              ident = json.loads(r.read().decode('utf-8'))
          username = str((ident.get('result') or {}).get('username') or '')
          if not ident.get('ok') or username.lower() != expected.lower():
              raise RuntimeError(f'wrong bot @{username}')

          text = (
              '🚨 <b>호남 반도체 클러스터 · 용수 공급 리스크</b>\n\n'
              '<b>무엇이 달라졌나</b>\n'
              '• 국회입법조사처가 9월 16일 공식 보고서에서 정부의 호남 반도체 용수 공급안에 안정성 우려를 제기\n'
              '• 정부안: 댐용수 65만 톤/일 + 광주제1하수처리장 하수재이용수 30만 톤/일\n\n'
              '<b>핵심 숫자</b>\n'
              '• 동복댐 30만 톤/일, 장흥·보성강·나주댐 각 10만 톤/일, 주암댐 5만 톤/일\n'
              '• 최근 5년 기준 보성강댐은 2024년 유입량이 평균보다 +84%, 장흥댐은 2022년 -72.2%로 변동폭이 큼\n'
              '• 영산강 생활·공업용수 이수 안전도는 3.4등급으로 주요 수계 중 가장 불안정한 수준으로 제시\n\n'
              '<b>현재 판정</b>\n'
              '• 중요도 높음 · 공식자료\n'
              '• 단순 물량 확보가 아니라 가뭄에도 끊기지 않는 안정적 공급이 핵심 병목으로 부상\n'
              '• 보성강댐 발전용수의 공업용수 전환에는 목적 외 사용·사용료 법적 근거 문제도 남아 있음\n\n'
              '<b>다음 확인</b>\n'
              '• 기후부의 댐별 확정 공급량·가뭄 시 보장량 공개\n'
              '• 동복댐 증고 일정과 하수재이용수 30만 톤/일 시설 계획\n'
              '• 영산강·섬진강 수계 간 용수 배분 협의 및 지역 갈등 조정\n'
              '• 해수담수화·추가 재이용수 등 대체 수자원 검토 여부\n\n'
              '<a href="https://www.nars.go.kr/report/view.do?brdSeq=49627&cmsCode=CM0018">국회입법조사처 원문</a>\n\n'
              '※ 특정 기사를 감시하는 것이 아니라, 호남 반도체 전체의 전력·용수·부지·환경·정주·기업투자 병목 변화를 웹과 공식자료에서 계속 추적합니다.'
          )
          payload = urllib.parse.urlencode({'chat_id': chat_id, 'text': text, 'parse_mode': 'HTML', 'disable_web_page_preview': 'true'}).encode('utf-8')
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=payload, method='POST')
          with urllib.request.urlopen(req, timeout=25) as r:
              result = json.loads(r.read().decode('utf-8'))
          if not result.get('ok'):
              raise RuntimeError(result)
          print(f"telegram_delivery_confirmed=true message_id={result.get('result', {}).get('message_id')}")
          PY
