name: Korea Market Stress and Global Wave Telegram Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/korea-market-stress-telegram-watch.yml"
      - "scripts/korea_market_stress_watch_v10.py"
      - "scripts/korea_market_stress_watch_v11.py"
      - "scripts/korea_market_stress_watch_v12.py"
      - "scripts/korea_market_stress_watch_v13.py"
      - "scripts/korea_market_stress_watch_v14.py"
      - "scripts/korea_market_stress_watch_v15.py"
      - "scripts/korea_market_stress_watch_v16.py"
      - "scripts/fx_sector_rotation_watch.py"
      - "scripts/kospi_rapid_fallback_watch.py"
      - "scripts/kospi_flow_attribution_ls.py"
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "14,29,44,59 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a one-time Telegram connection test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write
  actions: write

concurrency:
  group: korea-market-stress-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      DERIV_EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      DERIV_TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      DERIV_TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
      LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 pandas lxml

      - name: Verify required secrets
        run: |
          test -n "${ECOS_API_KEY:-}" || { echo "ECOS_API_KEY secret is missing"; exit 1; }
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "TELEGRAM_BOT_TOKEN secret is missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "TELEGRAM_CHAT_ID secret is missing"; exit 1; }
          test -n "${LS_OPENAPI_APP_KEY:-}" || { echo "LS_OPENAPI_APP_KEY secret is missing"; exit 1; }
          test -n "${LS_OPENAPI_APP_SECRET:-}" || { echo "LS_OPENAPI_APP_SECRET secret is missing"; exit 1; }
          echo "required_secrets_configured=true"

      - name: Verify exact Telegram route
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("Telegram secrets are missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{actual}")
          PY


      - name: Ensure KOSPI realtime watcher is alive
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, urllib.request
          from zoneinfo import ZoneInfo

          now = dt.datetime.now(ZoneInfo("Asia/Seoul"))
          if now.weekday() >= 5 or not (dt.time(8, 50) <= now.time() <= dt.time(15, 10)):
              print("kospi_realtime_watchdog=outside_market_window")
              raise SystemExit(0)

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}/actions/workflows/kospi-derivatives-flow-ls-realtime.yml"
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}

          def get(status):
              req = urllib.request.Request(f"{base}/runs?status={status}&per_page=20", headers=headers)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode("utf-8")).get("workflow_runs", [])

          active = get("in_progress") + get("queued")
          healthy = []
          for run in active:
              created = dt.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00")).astimezone(ZoneInfo("Asia/Seoul"))
              if created.date() == now.date():
                  healthy.append((run.get("id"), created.strftime("%H:%M:%S"), run.get("status")))

          if healthy:
              print(f"kospi_realtime_watchdog=alive runs={healthy}")
              raise SystemExit(0)

          body = json.dumps({"ref": "main", "inputs": {"mode": "production"}}).encode("utf-8")
          req = urllib.request.Request(f"{base}/dispatches", data=body, headers={**headers, "Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=20) as r:
              print(f"kospi_realtime_watchdog=dispatched status={r.status}")
          PY

      - name: Run market stress and FX sector rotation watchers
        run: |
          rm -f out/korea_market_stress_alert.html out/korea_market_stress_errors.log out/korea_market_stress_connection_test.html
          rm -f out/fx_sector_rotation_alert.html out/fx_sector_rotation_status.md out/fx_sector_rotation_pending_state.json
          python -m py_compile scripts/global_rates_watch.py scripts/korea_market_stress_watch_v4.py scripts/korea_market_stress_watch_v5.py scripts/korea_market_stress_watch_v6.py scripts/korea_market_stress_watch_v9.py scripts/korea_market_stress_watch_v10.py scripts/korea_market_stress_watch_v11.py scripts/korea_market_stress_watch_v12.py scripts/korea_market_stress_watch_v13.py scripts/korea_market_stress_watch_v14.py scripts/korea_market_stress_watch_v15.py scripts/korea_market_stress_watch_v16.py scripts/fx_sector_rotation_watch.py scripts/kospi_flow_attribution_ls.py
          python scripts/korea_market_stress_watch_v16.py
          python scripts/fx_sector_rotation_watch.py
          cat out/korea_market_stress_status.md >> "$GITHUB_STEP_SUMMARY"
          if [ -s out/fx_sector_rotation_status.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat out/fx_sector_rotation_status.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s out/korea_market_stress_errors.log ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## 부분 조회 오류" >> "$GITHUB_STEP_SUMMARY"
            cat out/korea_market_stress_errors.log >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build manual connection test
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.send_test == 'true'
        run: |
          cat > out/korea_market_stress_connection_test.html <<'EOF'
          ✅ <b>한국 시장 스트레스·환율 민감 업종 로테이션 감시 연결 정상</b>

          • 수신 봇: @khs887900887900008879_bot
          • 확인 주기: 약 15분 · 기본 07/22/37/52분 + 백업 14/29/44/59분 이중 예약
          • 원/달러 장중 감지: 실시간 환율 피드 사용, 전일 비교는 서울외환시장 15:30 현물환 종가
          • 한국은행 ECOS: 731Y001 / 0000001 원/미국달러(매매기준율) 공식 일일값 검증
          • KOSPI·KOSDAQ 외국인 수급: KRX 시장 기준, 20:10 이후 네이버 장마감값 + LS증권 OpenAPI t1601 엄격 교차검증
          • 네이버+LS가 1억원 이내 일치하면 확정, 네이버 실패 시 20:10 이후 LS 단독값이 최소 10분 간격 2회 연속 동일해야 확정
          • 3거래일 누적은 확정 일별값만 합산하며 장중·잠정·0값은 누적 이력에 저장하지 않음
          • KRX 시장 수급과 KRX+NXT 합산 수치를 혼용하지 않음
          • 영문 뉴스 제목·설명은 송출 전에 한국어로 변환하고 회사명·티커 등 식별자만 원문 유지
          • 별도 환율 민감 업종 로테이션: 장중 표본 저점 대비 +10원 또는 +0.5% 이상 반등 + 조선/방산/자동차 중 1개 이상 상대강도 확인 시 발송
          • 강한 로테이션: 일간 +20원 또는 +1% 이상 + 조선·방산·자동차 중 2개 이상 KOSPI 대비 +1%p 이상 상대강도
          • 조선: HD현대중공업·삼성중공업·HD한국조선해양·한화오션
          • 방산: 한화에어로스페이스·현대로템·LIG넥스원·한국항공우주
          • 자동차: 현대차·기아·현대모비스·HL만도
          • 반대편 확인: 대한항공·제주항공·한국전력·한국가스공사
          • 환율 반등분 50% 이상 반납 또는 조선·방산·자동차 상대강도 소멸 시 신호 약화 알림
          • 환율을 주가 움직임의 단독 원인으로 단정하지 않고 수주·실적·낙폭 과대·환헤지를 분리 설명
          • 같은 기준일·같은 확정 신호는 중복 발송하지 않음
          EOF

      - name: Send Telegram messages
        if: hashFiles('out/korea_market_stress_connection_test.html') != '' || hashFiles('out/korea_market_stress_alert.html') != '' || hashFiles('out/fx_sector_rotation_alert.html') != ''
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          files = [
              pathlib.Path("out/korea_market_stress_connection_test.html"),
              pathlib.Path("out/korea_market_stress_alert.html"),
              pathlib.Path("out/fx_sector_rotation_alert.html"),
          ]
          sent_ids = []
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8").strip()
              if not text:
                  continue
              chunks = []
              while len(text) > 3800:
                  cut = text.rfind("\n\n", 0, 3800)
                  if cut < 1000:
                      cut = 3800
                  chunks.append(text[:cut].strip())
                  text = text[cut:].strip()
              if text:
                  chunks.append(text)
              for chunk in chunks:
                  payload = urllib.parse.urlencode({"chat_id": chat_id, "text": chunk, "parse_mode": "HTML", "disable_web_page_preview": "true"}).encode("utf-8")
                  req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method="POST")
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.loads(response.read().decode("utf-8"))
                  if not result.get("ok"):
                      raise RuntimeError(f"Telegram rejected message: {result}")
                  sent_ids.append(result["result"].get("message_id"))
          print(f"telegram_delivery_confirmed=true bot=@{actual} messages={len(sent_ids)} ids={sent_ids}")
          PY

      - name: Persist watcher states after successful check and delivery
        if: success()
        run: |
          if [ -s out/korea_market_stress_pending_state.json ]; then
            cp out/korea_market_stress_pending_state.json data/korea_market_stress_watch_state.json
          fi
          if [ -s out/fx_sector_rotation_pending_state.json ]; then
            cp out/fx_sector_rotation_pending_state.json data/fx_sector_rotation_state.json
          fi

      - name: Commit watcher states
        if: success()
        run: |
          git config user.name "korea-market-watch[bot]"
          git config user.email "korea-market-watch[bot]@users.noreply.github.com"
          [ -f data/korea_market_stress_watch_state.json ] && cp data/korea_market_stress_watch_state.json /tmp/korea_market_stress_watch_state.json || true
          [ -f data/fx_sector_rotation_state.json ] && cp data/fx_sector_rotation_state.json /tmp/fx_sector_rotation_state.json || true
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            [ -f /tmp/korea_market_stress_watch_state.json ] && cp /tmp/korea_market_stress_watch_state.json data/korea_market_stress_watch_state.json || true
            [ -f /tmp/fx_sector_rotation_state.json ] && cp /tmp/fx_sector_rotation_state.json data/fx_sector_rotation_state.json || true
            git add data/korea_market_stress_watch_state.json data/fx_sector_rotation_state.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Watcher states unchanged"
              exit 0
            fi
            git commit -m "Update Korea market watcher states"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Run redundant KOSPI rapid-drop fallback
        run: |
          rm -f out/kospi_rapid_fallback_status.md out/kospi_rapid_fallback_pending_state.json
          python -m py_compile scripts/kospi_flow_attribution_ls.py scripts/kospi_rapid_fallback_watch.py
          python scripts/kospi_rapid_fallback_watch.py
          cat out/kospi_rapid_fallback_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Persist KOSPI rapid-drop fallback state
        if: success() && hashFiles('out/kospi_rapid_fallback_pending_state.json') != ''
        run: cp out/kospi_rapid_fallback_pending_state.json data/kospi_rapid_fallback_state.json

      - name: Commit KOSPI rapid-drop fallback state
        if: success() && hashFiles('data/kospi_rapid_fallback_state.json') != ''
        run: |
          git config user.name "kospi-rapid-fallback-watch[bot]"
          git config user.email "kospi-rapid-fallback-watch[bot]@users.noreply.github.com"
          cp data/kospi_rapid_fallback_state.json /tmp/kospi_rapid_fallback_state.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/kospi_rapid_fallback_state.json data/kospi_rapid_fallback_state.json
            git add data/kospi_rapid_fallback_state.json
            if git diff --cached --quiet; then
              echo "KOSPI rapid fallback state unchanged"
              exit 0
            fi
            git commit -m "Update KOSPI rapid fallback state"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korea-market-stress-watch-${{ github.run_id }}
          path: |
            out/korea_market_stress_status.md
            out/korea_market_stress_errors.log
            out/korea_market_stress_alert.html
            out/korea_market_stress_connection_test.html
            out/korea_market_stress_pending_state.json
            out/fx_sector_rotation_status.md
            out/fx_sector_rotation_alert.html
            out/fx_sector_rotation_pending_state.json
            out/kospi_rapid_fallback_status.md
            out/kospi_rapid_fallback_pending_state.json
          if-no-files-found: ignore
          retention-days: 14
