name: Silver Bulletin Telegram Watch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/silver-bulletin-telegram-watch.yml"
      - "scripts/silver_bulletin_issue_watch.py"
      - "data/silver_bulletin_issue_state.json"
  schedule:
    # GitHub cron is UTC. Silver Bulletin changes far less often than this;
    # hourly checks minimize delay while avoiding unnecessary traffic.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: silver-bulletin-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs88798879_bot"
      SILVER_BULLETIN_USER_AGENT: "KHS-Silver-Bulletin-Watch/1.0 contact=github-actions"

      # Reuse already-configured repository Telegram routes. The resolver below
      # selects a token only when Telegram getMe confirms the requested bot handle.
      TOKEN_KHS_POLICY: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
      CHAT_KHS_POLICY: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      TOKEN_DEEP_FISSION: ${{ secrets.DEEP_FISSION_TELEGRAM_BOT_TOKEN }}
      CHAT_DEEP_FISSION: ${{ secrets.DEEP_FISSION_TELEGRAM_CHAT_ID }}
      TOKEN_YEN_CARRY: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
      CHAT_YEN_CARRY: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
      TOKEN_JOBS_WAGE: ${{ secrets.JOBS_WAGE_TELEGRAM_BOT_TOKEN }}
      CHAT_JOBS_WAGE: ${{ secrets.JOBS_WAGE_TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve requested Telegram bot and chat
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          expected = (os.environ.get("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          candidates = [
              ("KHS_POLICY", os.environ.get("TOKEN_KHS_POLICY", ""), os.environ.get("CHAT_KHS_POLICY", "")),
              ("DEEP_FISSION", os.environ.get("TOKEN_DEEP_FISSION", ""), os.environ.get("CHAT_DEEP_FISSION", "")),
              ("YEN_CARRY", os.environ.get("TOKEN_YEN_CARRY", ""), os.environ.get("CHAT_YEN_CARRY", "")),
              ("JOBS_WAGE", os.environ.get("TOKEN_JOBS_WAGE", ""), os.environ.get("CHAT_JOBS_WAGE", "")),
          ]
          fallback_chats = [chat.strip() for _, _, chat in candidates if chat and chat.strip()]
          checked = []
          selected = None

          for label, token, paired_chat in candidates:
              token = (token or "").strip()
              if not token:
                  continue
              try:
                  with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=20) as resp:
                      identity = json.loads(resp.read().decode("utf-8"))
                  username = str((identity.get("result") or {}).get("username") or "")
                  checked.append(f"{label}=@{username or 'unknown'}")
                  if identity.get("ok") and username.lower() == expected.lower():
                      selected = [label, token, (paired_chat or "").strip()]
                      break
              except Exception as exc:
                  checked.append(f"{label}=getMe_error:{type(exc).__name__}")

          if selected is None:
              raise RuntimeError(
                  f"No configured repository secret belongs to @{expected}. Checked: " + ", ".join(checked)
              )

          label, token, chat_id = selected
          if not chat_id and fallback_chats:
              # Private-chat user IDs are stable across bots. Reuse an existing
              # known destination only after the bot identity itself is verified.
              chat_id = fallback_chats[0]

          if not chat_id:
              # Last resort: resolve the latest private chat that has started this bot.
              with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getUpdates?limit=100&timeout=0", timeout=20) as resp:
                  updates = json.loads(resp.read().decode("utf-8"))
              private = []
              for update in updates.get("result") or []:
                  message = update.get("message") or update.get("edited_message") or {}
                  chat = message.get("chat") or {}
                  if str(chat.get("type") or "") == "private" and chat.get("id") is not None:
                      private.append((int(update.get("update_id") or 0), str(chat["id"])))
              if private:
                  private.sort()
                  chat_id = private[-1][1]

          if not chat_id:
              raise RuntimeError(
                  f"@{expected} token is configured, but no destination chat could be resolved. Start the bot once and retry."
              )

          route = pathlib.Path("out/.silver_bulletin_telegram_route.json")
          route.write_text(
              json.dumps({"label": label, "token": token, "chat_id": chat_id, "username": expected}),
              encoding="utf-8",
          )
          os.chmod(route, 0o600)
          print(f"telegram_bot_verified=@{expected} secret_route={label} chat_resolved=true")
          PY

      - name: Validate watcher
        run: python -m py_compile scripts/silver_bulletin_issue_watch.py

      - name: Check Silver Bulletin issue averages
        run: |
          python scripts/silver_bulletin_issue_watch.py
          cat out/silver_bulletin_issue_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Send Telegram alert when baseline or values change
        if: hashFiles('out/silver_bulletin_issue_alert.md') != ''
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          route = json.loads(pathlib.Path("out/.silver_bulletin_telegram_route.json").read_text(encoding="utf-8"))
          text = pathlib.Path("out/silver_bulletin_issue_alert.md").read_text(encoding="utf-8").strip()
          payload = urllib.parse.urlencode({
              "chat_id": route["chat_id"],
              "text": text[:4096],
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{route['token']}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=25) as resp:
              result = json.loads(resp.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram send failed: {result}")
          message_id = (result.get("result") or {}).get("message_id")
          print(f"silver_bulletin_telegram_sent=true message_id={message_id}")
          PY

      - name: Persist state after successful check and delivery
        if: success() && hashFiles('out/silver_bulletin_issue_state_pending.json') != ''
        run: |
          cp out/silver_bulletin_issue_state_pending.json data/silver_bulletin_issue_state.json

      - name: Commit confirmed Silver Bulletin state
        if: success() && hashFiles('data/silver_bulletin_issue_state.json') != ''
        shell: bash
        run: |
          git config user.name "silver-bulletin-watch[bot]"
          git config user.email "silver-bulletin-watch[bot]@users.noreply.github.com"
          git add data/silver_bulletin_issue_state.json
          if git diff --cached --quiet; then
            echo "Silver Bulletin state unchanged"
          else
            git commit -m "Update Silver Bulletin issue watch state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silver-bulletin-watch-${{ github.run_id }}
          path: |
            out/silver_bulletin_issue_status.md
            out/silver_bulletin_issue_alert.md
            out/silver_bulletin_issue_errors.log
            out/silver_bulletin_issue_state_pending.json
          if-no-files-found: ignore
          retention-days: 14
