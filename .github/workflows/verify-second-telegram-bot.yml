name: Verify Second Telegram Bot

on:
  push:
    paths:
      - ".github/workflows/verify-second-telegram-bot.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify second bot identity
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=(os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          if not token:
              raise RuntimeError('YEN_CARRY_TELEGRAM_BOT_TOKEN missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
              payload=json.loads(r.read().decode())
          username=str((payload.get('result') or {}).get('username') or '')
          print(f'BOT_USERNAME=@{username}')
          PY
