name: ECB policy Telegram watch

on:
  schedule:
    # GitHub cron is UTC. Poll every 10 minutes; ECB decisions are normally published at 14:15 CET/CEST.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ecb-policy-telegram-watch.yml"
      - "scripts/ecb_policy_watch.py"
      - "tests/test_ecb_policy_watch.py"

permissions:
  contents: write

concurrency:
  group: ecb-policy-telegram-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs88798879887988798879_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate ECB watcher
        run: |
          python -m py_compile scripts/ecb_policy_watch.py
          python -m unittest tests/test_ecb_policy_watch.py -v

      - name: Check ECB official releases
        run: python scripts/ecb_policy_watch.py

      - name: Publish status summary
        if: always()
        run: |
          if [ -f out/ecb_policy_watch_status.md ]; then
            cat out/ecb_policy_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ECB 정책 감시 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/ecb_policy_watch_alert.md ]; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/ecb_policy_watch_alert.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send readable ECB alert to requested Telegram bot
        if: hashFiles('out/ecb_policy_watch_alert.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TREASURY_FOREIGN_DEMAND_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TREASURY_FOREIGN_DEMAND_TELEGRAM_BOT_TOKEN이 없습니다." >&2
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "KHS_POLICY_TELEGRAM_CHAT_ID가 없습니다." >&2
            exit 1
          fi

          python - <<'PY'
          import datetime as dt
          import html
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          expected = os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot configured: expected @{expected}, got @{actual or 'unknown'}")

          title = pathlib.Path("out/ecb_policy_watch_alert_title.txt").read_text(encoding="utf-8").strip()
          body = pathlib.Path("out/ecb_policy_watch_alert.md").read_text(encoding="utf-8").strip()

          def htmlify(text: str) -> str:
              rendered = []
              for line in text.splitlines():
                  if line.startswith("원문(ECB 결정): "):
                      u = line.split(": ", 1)[1].strip()
                      rendered.append(f'<a href="{html.escape(u, quote=True)}">ECB 결정 원문</a>')
                  elif line.startswith("원문(ECB 기자회견): "):
                      u = line.split(": ", 1)[1].strip()
                      rendered.append(f'<a href="{html.escape(u, quote=True)}">ECB 기자회견 원문</a>')
                  elif line.startswith("ECB 회의 일정: "):
                      u = line.split(": ", 1)[1].strip()
                      rendered.append(f'<a href="{html.escape(u, quote=True)}">ECB 회의 일정</a>')
                  else:
                      rendered.append(html.escape(line))
              return "\n".join(rendered)

          raw = f"{title}\n\n{body}".strip()
          text = htmlify(raw)

          def split_message(value: str, limit: int = 3900):
              chunks, current = [], ""
              for paragraph in value.split("\n\n"):
                  candidate = paragraph if not current else current + "\n\n" + paragraph
                  if len(candidate) <= limit:
                      current = candidate
                      continue
                  if current:
                      chunks.append(current)
                      current = ""
                  while len(paragraph) > limit:
                      cut = paragraph.rfind("\n", 0, limit)
                      if cut < 1:
                          cut = limit
                      chunks.append(paragraph[:cut])
                      paragraph = paragraph[cut:].lstrip()
                  current = paragraph
              if current:
                  chunks.append(current)
              return chunks

          ids = []
          for idx, chunk in enumerate(split_message(text), start=1):
              if idx > 1:
                  chunk = f"ECB 정책 알림 (계속 {idx})\n\n{chunk}"
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=25) as r:
                  result = json.loads(r.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected ECB message: {result}")
              ids.append((result.get("result") or {}).get("message_id"))

          confirmed = {
              "status": "confirmed",
              "lane": "ecb_policy",
              "bot_username": actual,
              "message_ids": ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/ecb_policy_watch_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"telegram_delivery_confirmed=true lane=ecb_policy bot=@{actual} message_ids={ids}")
          PY

      - name: Finalize ECB state only after safe no-alert run or confirmed delivery
        if: always()
        run: python scripts/ecb_policy_watch.py --finalize

      - name: Commit ECB watcher state
        if: always() && hashFiles('data/ecb_policy_watch_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ecb_policy_watch_state.json
          if git diff --cached --quiet; then
            echo "ECB 상태 변경 없음"
          else
            git commit -m "Update ECB policy watch state"
            git pull --rebase origin main
            git push
          fi

      - name: Upload ECB verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecb-policy-watch-${{ github.run_id }}
          path: |
            out/ecb_policy_watch_status.md
            out/ecb_policy_watch_alert.md
            out/ecb_policy_watch_alert.json
            out/ecb_policy_watch_pending_state.json
            out/ecb_policy_watch_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
