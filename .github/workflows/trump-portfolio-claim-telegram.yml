name: Trump portfolio claim Telegram watch

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trump-portfolio-claim-telegram.yml"
      - "scripts/trump_portfolio_claim_watch.py"
      - "scripts/trump_portfolio_claim_watch_entry.py"
      - "scripts/test_trump_claim_filter.py"
      - "data/trump_portfolio_claim_watch_state.json"

permissions:
  contents: write

concurrency:
  group: trump-portfolio-claim-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      THIRTEENF_TELEGRAM_BOT_TOKEN: ${{ secrets.THIRTEENF_TELEGRAM_BOT_TOKEN }}
      THIRTEENF_TELEGRAM_CHAT_ID: ${{ secrets.THIRTEENF_TELEGRAM_CHAT_ID }}
      KHS_POLICY_TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
      KHS_POLICY_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          python -m py_compile scripts/trump_portfolio_claim_watch.py
          python -m py_compile scripts/trump_portfolio_claim_watch_entry.py
          python -m py_compile scripts/test_trump_claim_filter.py
          python scripts/test_trump_claim_filter.py

      - name: Check web-indexed Trump portfolio claims and send Korean Telegram alert
        run: python scripts/trump_portfolio_claim_watch_entry.py

      - name: Persist claim seen state
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          path = pathlib.Path("data/trump_portfolio_claim_watch_state.json")
          if not path.exists():
              raise SystemExit(0)

          try:
              previous = json.loads(subprocess.check_output(
                  ["git", "show", "HEAD:data/trump_portfolio_claim_watch_state.json"],
                  text=True,
              ))
              current = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              raise SystemExit(0)

          if (
              previous.get("seen", []) == current.get("seen", [])
              and previous.get("seen_events", []) == current.get("seen_events", [])
          ):
              subprocess.run(
                  ["git", "checkout", "HEAD", "--", "data/trump_portfolio_claim_watch_state.json"],
                  check=True,
              )
              print("Claim seen set unchanged; discarded timestamp-only state change.")
          PY

          if git diff --quiet -- data/trump_portfolio_claim_watch_state.json; then
            echo "Claim state unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trump_portfolio_claim_watch_state.json
          git commit -m "Update Trump portfolio claim watch state"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
