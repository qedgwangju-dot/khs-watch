name: GAMEJOA preopen news radar

on:
  schedule:
    # 21:30 UTC = 06:30 KST.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      telegram_dry_run:
        description: "Build the report without sending Telegram"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      radar_run_mode:
        description: "preopen keeps the 06:30 window; live sends new unseen high-impact updates"
        required: false
        default: "preopen"
        type: choice
        options:
          - "preopen"
          - "live"

permissions:
  contents: write

concurrency:
  group: gamejoa-preopen-news-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RADAR_MAX_AGE_HOURS: "72"
      RADAR_TRENDFORCE_RESEARCH_MAX_AGE_DAYS: "3"
      GAMEJOA_RADAR_SEEN_TTL_DAYS: "14"
      PREOPEN_SEND_WINDOW_START_KST: "05:30"
      PREOPEN_SEND_WINDOW_END_KST: "07:30"
      RADAR_RUN_MODE: ${{ github.event.inputs.radar_run_mode || 'preopen' }}
      RADAR_FETCH_TIMEOUT_SECONDS: "10"
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT || 'GAMEJOA-preopen-radar contact=please-set-secret' }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      SEND_TELEGRAM: "true"
      TELEGRAM_DRY_RUN: ${{ github.event.inputs.telegram_dry_run || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify GAMEJOA delivery contract
        run: |
          python scripts/verify_gamejoa_delivery_contract.py
          python scripts/verify_gamejoa_semisupply_contract.py

      - name: Check configuration
        run: |
          {
            echo "### Configuration"
            if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
              echo "- hs8879 policy Telegram: missing token or chat id; report will build but cannot be delivered."
            else
              echo "- hs8879 policy Telegram: configured"
            fi

            if [ -z "$FRED_API_KEY" ]; then
              echo "- FRED: FRED_API_KEY missing; public CSV fallback will be used."
            else
              echo "- FRED: API key configured"
            fi

            if [ -z "$SEC_USER_AGENT" ] || [ "$SEC_USER_AGENT" = "GAMEJOA-preopen-radar contact=please-set-secret" ]; then
              echo "- SEC_USER_AGENT: missing/default; SEC may rate-limit."
            else
              echo "- SEC_USER_AGENT: configured"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight GAMEJOA preopen news radar quality
        env:
          SEND_TELEGRAM: "false"
          TELEGRAM_DRY_RUN: "true"
        run: |
          python scripts/gamejoa_preopen_news_radar_fda_quality_runner.py
          python scripts/verify_gamejoa_generated_report.py

      - name: Build and send GAMEJOA preopen news radar
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.telegram_dry_run != 'true' }}
        env:
          SEND_TELEGRAM: "true"
          TELEGRAM_DRY_RUN: "false"
        run: python scripts/gamejoa_preopen_news_radar_fda_quality_runner.py

      - name: Commit GAMEJOA radar seen state
        if: always() && hashFiles('data/gamejoa_preopen_news_radar_seen.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gamejoa_preopen_news_radar_seen.json
          if git diff --cached --quiet; then
            echo "No GAMEJOA radar seen-state changes."
          else
            git commit -m "Update GAMEJOA preopen radar seen state"
            git pull --rebase origin main
            git push
          fi

      - name: Publish report summary
        if: always()
        run: |
          if [ -f out/gamejoa_preopen_news_radar.md ]; then
            cat out/gamejoa_preopen_news_radar.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GAMEJOA preopen news radar did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamejoa-preopen-news-radar
          path: |
            out/gamejoa_preopen_news_radar.md
            out/gamejoa_preopen_news_radar.json
            out/gamejoa_preopen_news_radar_title.txt
            out/gamejoa_preopen_news_radar_delivery.json
          if-no-files-found: ignore
