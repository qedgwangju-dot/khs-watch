name: Treasury ETF Fund Flow Telegram

on:
  push:
    paths:
      - ".github/workflows/treasury-etf-flow-telegram.yml"
      - "scripts/treasury_etf_flow_watch.py"
  schedule:
    - cron: "30 8 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treasury-etf-flow-telegram
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YEN_CARRY_TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
      YEN_CARRY_TELEGRAM_CHAT_ID: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
      KHS_POLICY_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Validate watcher
        run: python -m py_compile scripts/treasury_etf_flow_watch.py

      - name: Run SHY IEF TLT daily monitor and send Telegram
        run: python scripts/treasury_etf_flow_watch.py

      - name: Publish summary
        if: always()
        run: |
          if [ -f out/treasury_etf_flow_status.md ]; then
            cat out/treasury_etf_flow_status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "미 국채 ETF 감시 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit daily baseline/history
        if: success()
        run: |
          if [ ! -f data/treasury_etf_flow_state.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasury_etf_flow_state.json
          if git diff --cached --quiet; then
            echo "Treasury ETF flow state unchanged"
            exit 0
          fi
          git commit -m "Update Treasury ETF fund flow state"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-etf-flow-${{ github.run_id }}
          path: |
            out/treasury_etf_flow_status.md
            out/treasury_etf_flow_telegram.txt
            data/treasury_etf_flow_state.json
          if-no-files-found: ignore
          retention-days: 14
