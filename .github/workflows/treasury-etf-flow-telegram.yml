name: Treasury ETF Fund Flow Telegram

on:
  schedule:
    - cron: "30,35,40 8 * * *"
      timezone: "Asia/Seoul"
    - cron: "0,15,30,45 9-11 * * *"
      timezone: "Asia/Seoul"
    - cron: "0,15,30 12 * * *"
      timezone: "Asia/Seoul"
  workflow_run:
    workflows:
      - "Global Rates & Yen Carry Telegram Watch"
    types:
      - completed
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Read official sources and validate the report without sending Telegram"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: treasury-etf-flow-telegram
  cancel-in-progress: false

jobs:
  monitor:
    # Global Rates runs frequently; only start fallback checks during the Korean morning.
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        contains(github.event.workflow_run.created_at, 'T23:') ||
        contains(github.event.workflow_run.created_at, 'T00:') ||
        contains(github.event.workflow_run.created_at, 'T01:') ||
        contains(github.event.workflow_run.created_at, 'T02:') ||
        contains(github.event.workflow_run.created_at, 'T03:') ||
        contains(github.event.workflow_run.created_at, 'T04:') ||
        contains(github.event.workflow_run.created_at, 'T05:') ||
        contains(github.event.workflow_run.created_at, 'T06:')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs8879887988798879_bot"
      TREASURY_REPORT_VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only && '1' || '0' }}

    steps:
      - name: Checkout latest delivery state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip already delivered U.S. market day before running external requests
        id: delivery_gate
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          source_date = dt.datetime.now(ZoneInfo("America/New_York")).date()
          while source_date.weekday() >= 5:
              source_date -= dt.timedelta(days=1)
          p = Path("data/treasury_etf_flow_state.json")
          state = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          last = state.get("last_delivery") or {}
          validation_mode = os.getenv("TREASURY_REPORT_VALIDATE_ONLY") == "1"
          already_sent = (
              last.get("treasury_date") == source_date.isoformat()
              and last.get("bot_username") == "khs8879887988798879_bot"
              and bool(last.get("message_ids"))
          )
          skip = already_sent and not validation_mode
          print(f"treasury_early_delivery_gate source_date={source_date} already_sent={already_sent} skip={skip}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_run={'false' if skip else 'true'}\n")
          PY

      - name: Set up Python
        if: steps.delivery_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.delivery_gate.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Validate watcher
        if: steps.delivery_gate.outputs.should_run == 'true'
        run: |
          python -m py_compile scripts/treasury_etf_flow_watch.py
          python -m py_compile scripts/treasury_credit_flow_watch_ishares.py
          python -m py_compile scripts/treasury_credit_flow_watch_readable.py
          python -m py_compile scripts/treasury_credit_flow_watch_marketstress.py
          python -m py_compile scripts/treasury_credit_flow_watch_refinancing.py
          PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_treasury_daily_report_integrity.py' -v
          PYTHONPATH=scripts python - <<'PY'
          import treasury_credit_flow_watch_refinancing as report

          sample = "291.7bp | 기준 2026-10-01 | 직전 저장값 대비 ↑ +10.7bp"
          assert report._oas_delta(sample) == 10.7, report._oas_delta(sample)
          assert report._oas_asof(sample) == "2026-10-01", report._oas_asof(sample)
          nxt = report._next_alert(5.28, 5.63, "↑ 순유입 +$638.1M", sample)
          assert "HYG OAS 추가 확대 또는 HYG 자금유출 전환" in nxt, nxt
          assert "HYG 자금유출 + OAS 일간 +5bp 이상" not in nxt, nxt
          alert = report._credit_alert_line("↑ 순유입 +$638.1M", sample)
          assert alert and "현재 신용경보:" in alert and "2026-10-01" in alert, alert
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import treasury_credit_flow_watch_ishares as watch

          test_state = {"last_delivery": {"treasury_date":"2026-10-07", "message_ids":[425], "bot_username":"khs8879887988798879_bot"}}
          assert watch._us_latest_weekday(datetime(2026,10,8,11,0,tzinfo=ZoneInfo("Asia/Seoul"))) == "2026-10-07"
          assert watch._us_latest_weekday(datetime(2026,10,11,8,30,tzinfo=ZoneInfo("Asia/Seoul"))) == "2026-10-09"
          assert watch._delivery_complete_for_date(test_state,"2026-10-07")
          assert not watch._delivery_complete_for_date(test_state,"2026-10-08")
          valid = (
              "전체 방향: 혼조·추가 확인\n"
              "차환: 12개월 $10.64T (원화 14,244조원) | Bills에 +75bp 비용\n"
              "자금흐름: 발행좌수 변화 × 해당일 NAV로 계산한 추정치"
          )
          report._validate_compact_report(valid, "혼조·추가 확인", 5.28, "269.1bp | 직전 대비 ↓ -9.9bp")
          try:
              report._validate_compact_report(valid + "\nLQD OAS ↓ -0.0bp", "혼조·추가 확인", 5.28, "269.1bp")
              raise AssertionError("signed-zero invariant did not fail")
          except RuntimeError as exc:
              assert "signed zero" in str(exc), str(exc)
          assert "신규 돌파 아님" in report._jpm_30y_signal(5.67)

          sample_results = {
              "SHY": {"flow_usd": 40_580_000},
              "IEF": {"flow_usd": -106_932_000},
              "TLT": {"flow_usd": 115_695_000, "nav_change_pct": -0.14},
              "LQD": {"flow_usd": 734_904_000, "oas_bps": 83.13},
              "HYG": {"flow_usd": -331_315_000, "oas_bps": 269.13},
          }
          prior = {"LQD": {"oas_bps": 85.81}, "HYG": {"oas_bps": 279.04}}
          curve = {"30Y": 5.67}
          t_head, _ = watch.treasury_class(sample_results, curve)
          c_head, _, _, hdoas = watch.credit_class(sample_results, prior)
          o_head, _ = watch.overall_class(t_head, c_head, sample_results, curve)
          assert t_head == "국채 만기별 자금 혼조", t_head
          assert "고수익 신용가격 개선" in c_head, c_head
          assert round(hdoas, 1) == -9.9, hdoas
          assert o_head == "혼조·추가 확인", o_head
          print("treasury_compact_invariants=ok, daily_guard=ok, credit_flow_and_oas=ok")
          PY

      - name: Validate exact Telegram bot route
        if: steps.delivery_gate.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("GLOBAL_RATES_TELEGRAM_BOT_TOKEN secret is missing")
          if not chat_id:
              raise RuntimeError("GLOBAL_RATES_TELEGRAM_CHAT_ID secret is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          actual = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or actual.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot configured: expected @{expected}, got @{actual or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{actual} chat_id_present=true")
          PY

      - name: Run compact Treasury plus credit ETF monitor and send Telegram
        if: steps.delivery_gate.outputs.should_run == 'true'
        run: |
          set -o pipefail
          mkdir -p out
          rm -f out/treasury_etf_flow_status.md out/treasury_etf_flow_telegram.txt out/treasury_runtime_status.log
          python scripts/treasury_credit_flow_watch_refinancing.py | tee out/treasury_runtime_status.log
          if grep -q 'report_withheld' out/treasury_runtime_status.log; then
            echo "::warning::Treasury daily report withheld: official source dates or fields are not yet aligned."
            echo "공식자료가 아직 일치하지 않아 투자 보고를 보류했습니다. 실제 Telegram 송출은 하지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          elif grep -q 'treasury_report_validation_only=true' out/treasury_runtime_status.log; then
            echo "실제 공개자료 조회 및 한국어 보고서 검증 완료. 검증 실행이므로 Telegram 미전송." >> "$GITHUB_STEP_SUMMARY"
          elif grep -Eq 'duplicate_delivery_suppressed=true|same_market_day_delivery_suppressed=true' out/treasury_runtime_status.log; then
            echo "같은 미국 영업일 보고가 이미 전송되어 중복을 차단했습니다." >> "$GITHUB_STEP_SUMMARY"
          elif grep -q 'telegram_delivery_confirmed=true' out/treasury_runtime_status.log; then
            echo "Telegram API 전송 응답 확인. 상세 message_id는 실행 로그와 상태 파일을 참조하십시오." >> "$GITHUB_STEP_SUMMARY"
          elif grep -q 'treasury_fallback_noop=true' out/treasury_runtime_status.log; then
            echo "해당 시간대에는 일일 보고 재조회가 필요하지 않아 종료했습니다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Treasury watcher exited without an explicit delivery, duplicate, waiting, or validation result."
            exit 1
          fi

      - name: Publish summary
        if: ${{ always() && steps.delivery_gate.outputs.should_run == 'true' }}
        run: |
          if [ -f out/treasury_etf_flow_status.md ]; then
            cat out/treasury_etf_flow_status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "미 국채·회사채 ETF 감시 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit daily baseline/history
        if: ${{ success() && steps.delivery_gate.outputs.should_run == 'true' }}
        run: |
          if [ ! -f data/treasury_etf_flow_state.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasury_etf_flow_state.json
          if git diff --cached --quiet; then
            echo "Treasury and credit ETF flow state unchanged"
            exit 0
          fi
          git commit -m "Update Treasury and credit ETF fund flow state"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload verification artifacts
        if: ${{ always() && steps.delivery_gate.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: treasury-credit-etf-flow-${{ github.run_id }}
          path: |
            out/treasury_etf_flow_status.md
            out/treasury_etf_flow_telegram.txt
            out/treasury_runtime_status.log
            data/treasury_etf_flow_state.json
          if-no-files-found: ignore
          retention-days: 14
