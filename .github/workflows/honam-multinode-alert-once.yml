name: Honam Multinode Cluster Alert Once

on:
  push:
    paths:
      - ".github/workflows/honam-multinode-alert-once.yml"
      - "scripts/patch_honam_multinode_once.py"

permissions:
  contents: write

jobs:
  patch-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.HONAM_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.HONAM_TELEGRAM_CHAT_ID }}
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887988798879887988798879_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch watcher scope
        run: |
          python scripts/patch_honam_multinode_once.py
          python -m py_compile scripts/honam_semiconductor_watch.py

      - name: Commit watcher patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/honam_semiconductor_watch.py
          git commit -m "Expand Honam watch to Gwangju Hampyeong Muan cluster" || true
          git pull --rebase origin main
          git push

      - name: Send current development alert
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = (os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          chat_id = (os.getenv('TELEGRAM_CHAT_ID') or '').strip()
          expected = (os.getenv('EXPECTED_TELEGRAM_BOT_USERNAME') or '').strip().lstrip('@')
          if not token or not chat_id:
              raise RuntimeError('Telegram secrets missing')

          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
              ident = json.loads(r.read().decode('utf-8'))
          username = str((ident.get('result') or {}).get('username') or '')
          if not ident.get('ok') or username.lower() != expected.lower():
              raise RuntimeError(f'wrong bot @{username}')

          text = (
              '🚨 <b>호남 반도체 클러스터 확대 검토</b>\n\n'
              '<b>무엇이 달라졌나</b>\n'
              '• 단독 보도에서 광주공항·함평을 직접 팹 후보, 무안을 소부장·물류·에너지 배후기지로 묶는 초대형 클러스터 검토가 제기됨\n\n'
              '<b>현재 판정</b>\n'
              '• 중요도 높음 · 보도 단계 · 공식 미확정\n'
              '• 기존 광주 군공항 중심 생산거점 구상에서 광주·함평·무안의 역할 분담형 구조로 넓어질 가능성을 봐야 함\n\n'
              '<b>왜 중요</b>\n'
              '• 함평이 실제 직접 팹 후보로 올라오면 전력·용수·부지·환경협의가 새로 필요\n'
              '• 무안은 이미 국가산단 후보지로 지정돼 반도체 소부장·물류 연계 가능성이 공개돼 있음\n\n'
              '<b>다음 확인</b>\n'
              '• 정부·국토부·산업부 공식 문서의 함평 직접 팹/추가 산단 언급\n'
              '• 삼성전자·SK하이닉스의 함평 부지 실사·전력·용수 협의\n'
              '• 무안 국가산단 산업계획에서 반도체 소부장·물류 업종 확정 여부\n\n'
              '<b>출처</b> AlphaBiz 단독 보도\n'
              '<a href="https://www.alphabiz.co.kr/news/articleView.html?idxno=185873">원문 보기</a>\n\n'
              '※ 특정 기사 URL을 감시하는 것이 아니라, 호남 반도체 국가산단 전체의 부지·팹·인프라·정주·환경·기업투자 상태 변화를 웹 전체에서 추적합니다.'
          )

          payload = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'HTML',
              'disable_web_page_preview': 'true',
          }).encode('utf-8')
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=payload, method='POST')
          with urllib.request.urlopen(req, timeout=25) as r:
              result = json.loads(r.read().decode('utf-8'))
          if not result.get('ok'):
              raise RuntimeError(result)
          print(f"telegram_delivery_confirmed=true message_id={result.get('result', {}).get('message_id')}")
          PY
