name: Rubin HBM Telegram Watch

on:
  push:
    paths:
      - ".github/workflows/rubin-hbm-telegram.yml"
      - "scripts/rubin_hbm_watch.py"
      - "scripts/rubin_hbm_pretty.py"
      - "scripts/rubin_hbm_leverage.py"
      - "scripts/ai_component_leadtime_watch.py"
      - "scripts/agentic_cpu_watch.py"
      - "scripts/samsung_electromechanics_cpu_watch.py"
      - "scripts/skhynix_us_memory_watch.py"
      - "scripts/samsung_hbm_watch.py"
      - "scripts/hbm_delivery.py"
      - "scripts/hbm_memory_axes.py"
      - "scripts/solidigm_ipo_watch.py"
      - "data/hbm_memory_baselines.json"
      - "data/solidigm_ipo_watch_state.json"
      - "tests/test_hbm*.py"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rubin-hbm-telegram-watch
  # Do not interrupt a Telegram acknowledgement/state checkpoint in flight.
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs88798879887988798879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.HBM_TELEGRAM_CHAT_ID }}
      KCS_DATA_GO_SERVICE_KEY: ${{ secrets.KCS_DATA_GO_SERVICE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout existing production route
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install existing source dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir googlenewsdecoder==0.1.7

      - name: Validate code and memory/delivery regression tests
        run: |
          set -o pipefail
          mkdir -p out
          python -m py_compile scripts/hbm_delivery.py scripts/hbm_memory_axes.py scripts/samsung_hbm_watch.py scripts/rubin_hbm_watch.py scripts/skhynix_us_memory_watch.py scripts/ai_component_leadtime_watch.py scripts/agentic_cpu_watch.py scripts/samsung_electromechanics_cpu_watch.py scripts/solidigm_ipo_watch.py
          python -m unittest discover -s tests -p 'test_hbm*.py' -v 2>&1 | tee out/hbm_regression_tests.txt

      - name: Validate existing Telegram destination without sending
        run: python scripts/hbm_delivery.py check

      - name: Refresh durable states and recover acknowledged deliveries
        run: python scripts/hbm_delivery.py begin

      - name: Run existing collectors and checkpoint each delivery independently
        run: python scripts/hbm_delivery.py run

      - name: Publish HBM verification summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          out = pathlib.Path('out')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## HBM 실행·저장 확인\n\n')
              for name in ('hbm_begin_summary.json', 'hbm_delivery_summary.json', 'hbm_memory_axes_status.json', 'samsung_hbm_delivery_receipt.json', 'rubin_hbm_delivery_receipt.json', 'skhynix_hbm_delivery_receipt.json', 'solidigm_hbm_delivery_receipt.json'):
                  p = out / name
                  if p.exists():
                      value = json.loads(p.read_text(encoding='utf-8'))
                      summary.write('### ' + name + '\n```json\n' + json.dumps(value, ensure_ascii=False, indent=2) + '\n```\n')
          PY

      - name: Redact diagnostics before archiving
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib, urllib.parse
          out = pathlib.Path('out')
          variants = set()
          for name in ('KCS_DATA_GO_SERVICE_KEY', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID', 'GITHUB_TOKEN'):
              raw = os.getenv(name, '').strip()
              if raw:
                  variants.update((raw, urllib.parse.unquote(raw), urllib.parse.quote(raw, safe=''), urllib.parse.quote_plus(raw)))
          variants.discard('')
          for p in out.glob('*'):
              if p.is_file() and p.suffix in ('.json', '.html', '.md', '.txt'):
                  text = p.read_text(encoding='utf-8', errors='replace')
                  for key in sorted(variants, key=len, reverse=True):
                      text = text.replace(key, '<redacted>')
                  p.write_text(text, encoding='utf-8')
          print('HBM diagnostics credential redaction completed')
          PY

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubin-hbm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/rubin_hbm_status.md
            out/rubin_hbm_alert.md
            out/rubin_hbm_pending_state.json
            out/skhynix_us_memory_status.md
            out/skhynix_us_memory_alert.html
            out/samsung_hbm_status.md
            out/samsung_hbm_alert.html
            out/solidigm_ipo_alert.html
            out/hbm_memory_axes_status.json
            out/hbm_begin_summary.json
            out/hbm_regression_tests.txt
            out/hbm_delivery_summary.json
            out/*_hbm_delivery_receipt.json
            out/hbm_candidate_*.json
            out/hbm_before_*.json
          if-no-files-found: ignore
          retention-days: 14
