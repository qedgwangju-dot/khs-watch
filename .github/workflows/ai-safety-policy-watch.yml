                      "• <b>의미</b>: 기업의 준수비용·보안·모델 평가 의무가 바뀔 수 있음",
                      "• <b>다음 확인</b>: 적용 대상·시행일·법적 근거·벌칙·감사 범위",
                  ]
              else:
