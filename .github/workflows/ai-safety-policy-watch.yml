name: AI Safety Standards Policy Watch

# Duplicate-alert guard verified against alternating official-page render digests.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-safety-policy-watch.yml"
      - "scripts/ai_safety_policy_watch.py"
  schedule:
    - cron: "14,44 * * * *"
  workflow_run:
    workflows:
      - "AI Security Web Watch"
    types: [completed]
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send one Telegram formatting/route test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: ai-safety-standards-policy-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_AI_POLICY_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      EXPECTED_TELEGRAM_BOT_USERNAMES: "khs88798879_bot"
      POLICY_SEND_CONNECTION_TEST_ON_PUSH: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and verify Telegram route
        id: telegram
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request
          token=(os.environ.get("TELEGRAM_BOT_TOKEN") or "").strip()
          configured=(os.environ.get("TELEGRAM_CHAT_ID") or "").strip()
          expected={x.strip().lstrip("@").lower() for x in (os.environ.get("EXPECTED_TELEGRAM_BOT_USERNAMES") or "").split(",") if x.strip()}
          if not token:
              raise RuntimeError("Missing Telegram bot token")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe",timeout=25) as r:
              ident=json.loads(r.read().decode("utf-8"))
          actual=str((ident.get("result") or {}).get("username") or "")
          if not ident.get("ok") or not actual:
              raise RuntimeError("Telegram getMe failed")
          if expected and actual.lower() not in expected:
              raise RuntimeError(f"Wrong Telegram bot: @{actual}")
          chat_id=configured
          route="secret"
          if not chat_id:
              with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getUpdates?limit=100&timeout=0",timeout=25) as r:
                  updates=json.loads(r.read().decode("utf-8"))
              candidates=[]
              for upd in updates.get("result") or []:
                  msg=upd.get("message") or upd.get("edited_message") or {}
                  chat=msg.get("chat") or {}
                  if str(chat.get("type") or "")=="private" and chat.get("id") is not None:
                      candidates.append((int(upd.get("update_id") or 0),str(chat["id"])))
              if candidates:
                  candidates.sort()
                  chat_id=candidates[-1][1]
                  route="getUpdates"
          if not chat_id:
              raise RuntimeError("Telegram chat_id unresolved")
          out=pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a",encoding="utf-8") as f:
              f.write(f"bot_username={actual}\n")
              f.write(f"chat_id={chat_id}\n")
              f.write(f"route={route}\n")
          print(f"ai_policy_bot_verified=@{actual}")
          print(f"ai_policy_chat_resolved=true route={route}")
          PY

      - name: Validate watcher
        run: python -m py_compile scripts/ai_safety_policy_watch.py

      - name: Verify Korean alert translation on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import re
          from scripts.ai_safety_policy_watch import translate_alert_text
          sample = "Sentry standalone SKU pricing and BlueField-4 enterprise deployment"
          translated = translate_alert_text(sample)
          print(f"ai_policy_translation_sample={translated}")
          if not re.search(r"[가-힣]", translated):
              raise RuntimeError("Korean translation smoke test failed")
          if "Sentry" not in translated or "BlueField-4" not in translated:
              raise RuntimeError("Product identifiers were not preserved")
          PY

      - name: Verify frontier accord classification
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          from scripts.ai_safety_policy_watch import (
              UTC,
              detect_category,
              detect_entity,
              source_official,
              official_page_source,
              forced_official_page_category,
              forced_official_page_entity,
              advance_official_page_state,
          )

          cases = [
              (
                  "White House Accord on Super Intelligence Joint Commitment on Frontier Responsibilities signatory added",
                  "프런티어 AI 공동 서약·서명기업 변화",
                  "백악관·프런티어 AI 공동서약",
              ),
              (
                  "frontier AI external auditor audit frequency audit scope auditor access",
                  "외부감사 규격·감사기관",
                  None,
              ),
              (
                  "frontier AI oversight board independent board committee",
                  "독립 이사회·감독위원회",
                  None,
              ),
              (
                  "AI accord codified into law procurement requirement insurance requirement",
                  "자율서약→법·조달·보험 성문화",
                  None,
              ),
          ]
          for text, expected_category, expected_entity in cases:
              category = detect_category(text)
              print(f"ai_policy_accord_case={expected_category} actual={category}")
              if category != expected_category:
                  raise RuntimeError(f"Accord category mismatch: expected={expected_category} actual={category}")
              if expected_entity:
                  entity = detect_entity(text)
                  if entity != expected_entity:
                      raise RuntimeError(f"Accord entity mismatch: expected={expected_entity} actual={entity}")

          for source in ("White House", "U.S. House of Representatives"):
              if not source_official(source):
                  raise RuntimeError(f"Official source not recognized: {source}")

          source_cases = {
              "백악관 Super Intelligence 행정명령": "White House",
              "미 하원의장실 White House Accord 공식 발표": "U.S. House of Representatives",
              "OpenAI 프런티어 학습 Safety Case": "OpenAI",
              "NVIDIA OpenShell 보안정책": "NVIDIA",
              "NIPA 사이버보안 특화 AI 사업": "NIPA",
          }
          for name, expected in source_cases.items():
              actual = official_page_source(name)
              print(f"ai_policy_official_source={name} -> {actual}")
              if actual != expected:
                  raise RuntimeError(f"Official page source mismatch: {name} -> {actual}, expected {expected}")

          forced_cases = {
              "미 하원의장실 White House Accord 공식 발표": (
                  "프런티어 AI 공동 서약·서명기업 변화",
                  "백악관·프런티어 AI 공동서약",
              ),
              "백악관 Super Intelligence 행정명령": (
                  "백악관 Super Intelligence 정책·법제화",
                  "백악관 Super Intelligence 정책",
              ),
              "OpenAI 프런티어 학습 Safety Case": (
                  "Safety Case 실제 학습 승인 게이트",
                  "OpenAI",
              ),
              "NVIDIA OpenShell 개요·지원": (
                  "OpenShell 기본내장·지원 확대",
                  "NVIDIA OpenShell",
              ),
          }
          for name, (expected_category, expected_entity) in forced_cases.items():
              actual_category = forced_official_page_category(name)
              actual_entity = forced_official_page_entity(name)
              print(
                  f"ai_policy_forced_page={name} "
                  f"category={actual_category} entity={actual_entity}"
              )
              if actual_category != expected_category or actual_entity != expected_entity:
                  raise RuntimeError(
                      f"Forced official page mapping mismatch: {name} "
                      f"category={actual_category} entity={actual_entity}"
                  )

          # Duplicate-alert guard: immutable White House reference pages must
          # never alert even if alternating HTML render variants change digest.
          t0 = dt.datetime(2026, 10, 3, 0, 0, tzinfo=UTC)
          base = {
              "digest": "A",
              "url": "https://www.whitehouse.gov/example",
              "updated_at": t0.isoformat(),
          }
          snap_b = {"digest": "B", "url": base["url"], "material": "variant B"}
          state1, alert1 = advance_official_page_state(
              "백악관 Super Intelligence 행정명령", base, snap_b, t0
          )
          state2, alert2 = advance_official_page_state(
              "백악관 Super Intelligence 행정명령",
              state1,
              {"digest": "A", "url": base["url"], "material": "variant A"},
              t0 + dt.timedelta(minutes=20),
          )
          state3, alert3 = advance_official_page_state(
              "백악관 Super Intelligence 행정명령",
              state2,
              snap_b,
              t0 + dt.timedelta(minutes=40),
          )
          print(
              f"ai_policy_duplicate_guard_immutable="
              f"{alert1},{alert2},{alert3} digest={state3.get('digest')}"
          )
          if alert1 or alert2 or alert3 or state3.get("digest") != "A":
              raise RuntimeError("Immutable White House page render jitter could create a duplicate alert")

          # Mutable pages require the same changed digest to persist for at
          # least 10 minutes and two observations before alerting.
          mutable_base = {
              "digest": "A",
              "url": "https://example.com/mutable",
              "updated_at": t0.isoformat(),
          }
          m1, ma1 = advance_official_page_state(
              "NVIDIA OpenShell 지원정책",
              mutable_base,
              {"digest": "B", "url": mutable_base["url"], "material": "new"},
              t0,
          )
          m2, ma2 = advance_official_page_state(
              "NVIDIA OpenShell 지원정책",
              m1,
              {"digest": "B", "url": mutable_base["url"], "material": "new"},
              t0 + dt.timedelta(minutes=11),
          )
          print(
              f"ai_policy_duplicate_guard_mutable="
              f"{ma1},{ma2} digest={m2.get('digest')}"
          )
          if ma1 or not ma2 or m2.get("digest") != "B":
              raise RuntimeError("Mutable official page confirmation guard failed")
          PY

      - name: Run live policy watch
        run: |
          rm -f out/ai_safety_policy_watch_alert_title.txt out/ai_safety_policy_watch_alert.html out/ai_safety_policy_watch_telegram_confirmed.json
          python scripts/ai_safety_policy_watch.py
          cat out/ai_safety_policy_watch_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Detect Super Intelligence Force policy stages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import email.utils
          import hashlib
          import html
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from zoneinfo import ZoneInfo

          KST=ZoneInfo("Asia/Seoul")
          pending=pathlib.Path("out/ai_safety_policy_watch_pending_state.json")
          if not pending.exists():
              raise RuntimeError("AI policy pending state missing before SIF enrichment")
          state=json.loads(pending.read_text(encoding="utf-8"))
          seen=state.setdefault("seen",{})
          now=dt.datetime.now(KST)
          query='"Super Intelligence Force"'
          rss="https://news.google.com/rss/search?"+urllib.parse.urlencode({
              "q":query+" when:7d","hl":"en-US","gl":"US","ceid":"US:en"
          })
          req=urllib.request.Request(rss,headers={"User-Agent":"Mozilla/5.0 khs-ai-policy-sif-watch/1.0"})
          with urllib.request.urlopen(req,timeout=25) as r:
              root=ET.fromstring(r.read())

          trusted={"Reuters","AP News","Associated Press","The Associated Press","The Wall Street Journal","Wall Street Journal"}
          rows=[]
          for node in root.findall("./channel/item"):
              title=html.unescape(re.sub(r"<[^>]+>"," ",node.findtext("title") or ""))
              desc=html.unescape(re.sub(r"<[^>]+>"," ",node.findtext("description") or ""))
              source_node=node.find("source")
              source=(source_node.text or "").strip() if source_node is not None else ""
              link=(node.findtext("link") or "").strip()
              if source not in trusted:
                  continue
              text=re.sub(r"\s+"," ",f"{title} {desc}").strip().lower()
              if "super intelligence force" not in text and "superintelligence force" not in text:
                  continue
              rows.append({"title":title.strip(),"description":desc.strip(),"source":source,"link":link,"text":text})

          # One-time first-party recovery for the confirmed Oct. 4 formation.
          # Semantic state prevents this baseline from ever being resent.
          rows.append({
              "title":"Trump announces formation of the Super Intelligence Force",
              "description":(
                  "Trump announced the formation of the Super Intelligence Force to coordinate federal efforts. "
                  "The group is led by Jay Clayton, Andrew Ferguson, Emil Michael and Scott Kupor."
              ),
              "source":"Trump Truth Social",
              "link":"https://truthsocial.com/@realDonaldTrump/117382616783706638",
              "text":(
                  "trump announced the formation of the super intelligence force to coordinate federal efforts. "
                  "the group is led by jay clayton, andrew ferguson, emil michael and scott kupor."
              ),
          })

          def stage(row):
              text=row["text"]
              title=row["title"].lower()
              if any(x in text for x in (
                  "final report released","final report published","final report submitted",
                  "report released","report published","report submitted",
                  "recommendations released","recommendations published","recommendations submitted",
              )):
                  return "report","us-sif-report"
              if any(x in text for x in (
                  "appropriation","appropriations","budget","funding","procurement",
                  "contract award","contract awarded","request for proposals",
                  "mandatory incident reporting","incident reporting requirement",
                  "final rule","proposed rule","regulation","charter released","charter published",
              )):
                  return "execution","us-sif-execution-"+hashlib.sha1(title.encode()).hexdigest()[:10]
              if any(x in title for x in (
                  "new member","new members","joins","added to","leadership change",
                  "replaces","names vice chair","appoints vice chair",
              )):
                  return "membership","us-sif-membership-"+hashlib.sha1(title.encode()).hexdigest()[:10]
              if any(x in text for x in (
                  "formation","formed","forms","created","creates","established","establishes",
                  "launched","launches","announced","announces","new federal ai task force","new federal task force",
              )):
                  return "formation","us-sif-formation-2026-10-04"
              return "other","us-sif-other-"+hashlib.sha1(title.encode()).hexdigest()[:10]

          candidates=[]
          for row in rows:
              st,key=stage(row)
              digest=hashlib.sha256(("sif-semantic-v1:"+key).encode()).hexdigest()[:24]
              if digest in seen:
                  continue
              candidates.append((st,key,digest,row))

          if candidates:
              rank={"formation":4,"execution":3,"report":2,"membership":1,"other":0}
              st,key,digest,row=sorted(candidates,key=lambda x:rank.get(x[0],0),reverse=True)[0]
              if st=="formation":
                  heading="미국 Super Intelligence Force(SIF) 창설"
                  detail=[
                      "• <b>현재 단계</b>: 연방정부 초지능 정책 조율기구 창설 발표",
                      "• <b>확정 범위</b>: Trump Truth Social 게시문은 연방 노력 조율, 이해관계자 소통, Jay Clayton·Andrew Ferguson·Emil Michael·Scott Kupor 지도부, 대통령·Susie Wiles 보고선을 명시",
                      "• <b>보도 범위</b>: Reuters는 SIF가 AI 위험·기회와 연방정부 역할을 검토해 120일 안에 보고하도록 했다고 보도. 120일 기한은 Truth Social 게시문 자체 문구와 분리",
                      "• <b>미확정</b>: SIF 별도 예산·신규 법적 권한·정부 조달금액·의무 사고보고 규정",
                      "• <b>다음 확인</b>: SIF 헌장·120일 보고서·예산·인원·FTC/국방부/OPM 후속 규칙·조달, EO 14434의 60일 SI 정의 제안",
                  ]
              elif st=="report":
                  heading="SIF 120일 검토 후속 보고서·권고 공개"
                  detail=[
                      "• <b>현재 단계</b>: 보고서·권고 공개",
                      "• <b>의미</b>: 조정기구 출범에서 실제 정책 권고 산출물 단계로 이동",
                      "• <b>다음 확인</b>: 행정명령·규칙·예산·조달에 반영되는지 확인",
                  ]
              elif st=="execution":
                  heading="SIF 권한·예산·규제·조달 실행 변화"
                  detail=[
                      "• <b>현재 단계</b>: 후속 집행 구체화",
                      "• <b>의미</b>: 단순 조정기구에서 실제 정책·조달 수단으로 전환되는지 확인",
                      "• <b>다음 확인</b>: 법적 근거·예산액·조달 대상·시행일·계약 상대방",
                  ]
              else:
                  heading="SIF 구성·운영 변화"
                  detail=[
                      "• <b>현재 단계</b>: 구성·운영 후속 변화",
                      "• <b>다음 확인</b>: 실제 권한·예산·조달 변화 동반 여부",
                  ]

              truth="https://truthsocial.com/@realDonaldTrump/117382616783706638"
              reuters="https://www.reuters.com/world/us/jay-clayton-lead-trumps-ai-task-force-deliver-report-120-days-wsj-reports-2026-10-03/"
              body=[
                  "🚨 <b>[미국 AI 정책지휘체계 중요 변화]</b>",
                  f"조회 {now:%Y-%m-%d %H:%M KST}",
                  "",
                  f"<b>{heading}</b>",
                  *detail,
                  "• <b>투자 연결</b>: 현재 특정 기업 신규 정부계약 확정이 아님. 예산·조달·규칙이 GPU·클라우드·사이버보안·데이터센터 전력·국방 AI 발주로 전환될 때 실적 연결",
                  f'• <a href="{truth}">Trump Truth Social 원문</a>',
                  f'• <a href="{reuters}">Reuters 교차검증</a>',
              ]
              alert=pathlib.Path("out/ai_safety_policy_watch_alert.html")
              title_file=pathlib.Path("out/ai_safety_policy_watch_alert_title.txt")
              existing=alert.read_text(encoding="utf-8").strip() if alert.exists() else ""
              sif_text="\n".join(body)
              alert.write_text((sif_text+("\n\n"+existing if existing else "")).rstrip()+"\n",encoding="utf-8")
              if not title_file.exists():
                  title_file.write_text("🚨 미국 AI 정책지휘체계 중요 변화: "+heading+"\n",encoding="utf-8")
              seen[digest]={
                  "title":heading,
                  "source":row["source"],
                  "url":row["link"],
                  "entity":"미국 Super Intelligence Force",
                  "category":"미국 Super Intelligence Force 정책지휘체계",
                  "published_at":now.isoformat(),
                  "first_seen_at":now.isoformat(),
                  "semantic_key":key,
              }
              pending.write_text(json.dumps(state,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
              print(f"ai_policy_sif_new_stage={st} semantic_key={key} source={row['source']}")
          else:
              print(f"ai_policy_sif_new_stage=none trusted_rows={len(rows)}")
          PY

      - name: Build one-shot Telegram test
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.send_test == 'true') || (github.event_name == 'push' && env.POLICY_SEND_CONNECTION_TEST_ON_PUSH == 'true')
        run: |
          mkdir -p out
          cat > out/ai_safety_policy_watch_connection_test.html <<'EOF'
          📌 <b>AI 안전표준·보안산업 정책 Watch</b>

          <b>분리 알림 설정 완료</b>
          • 표준·법규·사고보고 기준
          • 예산·GPU·국책사업
          • 중간평가·실증·조달
          • 유료계약·상용화·컨소시엄 변경

          🔗 <a href="https://nipa.kr/home/bsnsAll/00/detail?bsnsDtlsIemNo=909">NIPA 사업 원문</a>

          단순 발언·반복 기사는 보내지 않습니다.
          EOF

      - name: Send Telegram
        env:
          RESOLVED_CHAT_ID: ${{ steps.telegram.outputs.chat_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, time, urllib.parse, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id=os.environ["RESOLVED_CHAT_ID"].strip()
          test=pathlib.Path("out/ai_safety_policy_watch_connection_test.html")
          alert=pathlib.Path("out/ai_safety_policy_watch_alert.html")
          title=pathlib.Path("out/ai_safety_policy_watch_alert_title.txt")

          files=[]
          if test.exists() and test.read_text(encoding="utf-8").strip():
              files.append(("test",test.read_text(encoding="utf-8").strip()))
          if alert.exists() and alert.read_text(encoding="utf-8").strip():
              body=alert.read_text(encoding="utf-8").strip()
              if title.exists():
                  body=title.read_text(encoding="utf-8").strip()+"\n\n"+body
              files.append(("alert",body))

          def chunks(text,max_len=3800):
              text=text.strip()
              out=[]
              while len(text)>max_len:
                  cut=text.rfind("\n\n",0,max_len)
                  if cut<900: cut=text.rfind("\n",0,max_len)
                  if cut<900: cut=max_len
                  out.append(text[:cut].strip())
                  text=text[cut:].strip()
              if text: out.append(text)
              return out

          ids=[]
          for kind,text in files:
              for chunk in chunks(text):
                  payload=urllib.parse.urlencode({
                      "chat_id":chat_id,
                      "text":chunk,
                      "parse_mode":"HTML",
                      "disable_web_page_preview":"true",
                  }).encode("utf-8")
                  req=urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage",data=payload,method="POST")
                  result=None
                  last=None
                  for attempt in range(1,4):
                      try:
                          with urllib.request.urlopen(req,timeout=30) as r:
                              result=json.loads(r.read().decode("utf-8"))
                          if result.get("ok"): break
                          last=RuntimeError(str(result))
                      except Exception as exc:
                          last=exc
                      if attempt<3: time.sleep(attempt*3)
                  if not result or not result.get("ok"):
                      raise RuntimeError(f"Telegram send failed after 3 attempts: {last}")
                  mid=(result.get("result") or {}).get("message_id")
                  if mid is None:
                      raise RuntimeError("Telegram success without message_id")
                  ids.append({"kind":kind,"message_id":mid})

          if alert.exists():
              alert_ids=[x for x in ids if x["kind"]=="alert"]
              if not alert_ids:
                  raise RuntimeError("Alert existed but delivery unconfirmed")
              pathlib.Path("out/ai_safety_policy_watch_telegram_confirmed.json").write_text(
                  json.dumps({"status":"confirmed","bot_username":"${{ steps.telegram.outputs.bot_username }}","messages":alert_ids},ensure_ascii=False,indent=2)+"\n",
                  encoding="utf-8"
              )
          print(f"ai_policy_telegram_messages_sent={len(ids)}")
          PY

      - name: Finalize state after no-alert or confirmed delivery
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f out/ai_safety_policy_watch_pending_state.json ]; then
            echo "Pending state missing" >&2
            exit 1
          fi
          if [ -f out/ai_safety_policy_watch_alert.html ] && [ ! -f out/ai_safety_policy_watch_telegram_confirmed.json ]; then
            echo "Alert not checkpointed because Telegram delivery is unconfirmed" >&2
            exit 1
          fi
          cp out/ai_safety_policy_watch_pending_state.json data/ai_safety_policy_watch_state.json

      - name: Commit watch state
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp data/ai_safety_policy_watch_state.json "$tmp/state.json"
          git config user.name "ai-safety-policy-watch[bot]"
          git config user.email "ai-safety-policy-watch[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp "$tmp/state.json" data/ai_safety_policy_watch_state.json
            git add data/ai_safety_policy_watch_state.json
            if git diff --cached --quiet; then
              echo "Policy watch state unchanged"
              exit 0
            fi
            git commit -m "Update AI safety policy watch state"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-safety-policy-watch-${{ github.run_id }}
          path: |
            out/ai_safety_policy_watch_status.md
            out/ai_safety_policy_watch_alert_title.txt
            out/ai_safety_policy_watch_alert.html
            out/ai_safety_policy_watch_pending_state.json
            out/ai_safety_policy_watch_telegram_confirmed.json
            out/ai_safety_policy_watch_connection_test.html
          if-no-files-found: ignore
          retention-days: 14
