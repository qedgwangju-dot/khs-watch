                  *( [f'• <a href="{truth}">Trump Truth Social 창설 원문</a>',
                       f'• <a href="{reuters}">Reuters 창설 보도</a>'] if st=="formation" else [] ),
                  *( [f'• <a href="https://www.anthropic.com/research/investigating-unintended-model-actions">Anthropic 사건 보고서(정책 법적 근거와 별개)</a>'] if st=="statement" else [] ),
              ]
              alert=pathlib.Path("out/ai_safety_policy_watch_alert.html")
              title_file=pathlib.Path("out/ai_safety_policy_watch_alert_title.txt")
              existing=alert.read_text(encoding="utf-8").strip() if alert.exists() else ""
              sif_text="\n".join(body)
              alert.write_text((sif_text+("\n\n"+existing if existing else "")).rstrip()+"\n",encoding="utf-8")
              if not title_file.exists():
                  title_file.write_text("🚨 미국 AI 정책지휘체계 중요 변화: "+heading+"\n",encoding="utf-8")
              seen[digest]={
                  "title":heading,
                  "source":row["source"],
                  "url":row["link"],
                  "entity":"미국 Super Intelligence Force",
                  "category":"미국 Super Intelligence Force 정책지휘체계",
                  "published_at":now.isoformat(),
                  "first_seen_at":now.isoformat(),
                  "semantic_key":key,
              }
              stage_count=1
              print(f"ai_policy_sif_new_stage={st} semantic_key={key} source={row['source']}")
          else:
              stage_count=0
              print(f"ai_policy_sif_new_stage=none trusted_rows={len(rows)}")

          # SIF is an enrichment step after the base policy watch. The base
          # new_events=0 cannot be left in the committed state when this step
          # appends a real Telegram alert. Reconcile the final event count.
          collection=state.setdefault("last_collection",{})
          previous_count=int(collection.get("new_events") or 0)
          collection["sif_new_stages"]=stage_count
          collection["new_events"]=previous_count+stage_count
          pending.write_text(
              json.dumps(state,ensure_ascii=False,indent=2,sort_keys=True)+"\n",
              encoding="utf-8",
          )

          status_file=pathlib.Path("out/ai_safety_policy_watch_status.md")
          if status_file.exists():
              status_text=status_file.read_text(encoding="utf-8")
              status_text=re.sub(
                  r"(- 신규 중요 사건: )\d+건",
                  lambda m: m.group(1)+str(collection["new_events"])+"건",
                  status_text,
                  count=1,
              )
              status_text += f"- SIF 신규 정책 단계: {stage_count}건\n"
              status_file.write_text(status_text,encoding="utf-8")

          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as summary:
              summary.write(
                  f"\n- SIF 신규 정책 단계 {stage_count}건 · 최종 신규 사건 "
                  f"{collection['new_events']}건\n"
              )
          print(f"ai_policy_sif_merged_new_events={collection['new_events']}")
          PY

      - name: Verify and enrich SI.gov official portal
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/ai_si_portal_semantic.py scripts/ai_si_portal_policy_enrich.py
          python scripts/test_ai_si_portal_semantic.py
          python scripts/ai_si_portal_policy_enrich.py
          grep 'SI.gov' out/ai_safety_policy_watch_status.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build one-shot Telegram test
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.send_test == 'true') || (github.event_name == 'push' && env.POLICY_SEND_CONNECTION_TEST_ON_PUSH == 'true')
        run: |
          mkdir -p out
          cat > out/ai_safety_policy_watch_connection_test.html <<'EOF'
          📌 <b>AI 안전표준·보안산업 정책 Watch</b>

          <b>분리 알림 설정 완료</b>
          • 표준·법규·사고보고 기준
          • 예산·GPU·국책사업
          • 중간평가·실증·조달
          • 유료계약·상용화·컨소시엄 변경

          🔗 <a href="https://nipa.kr/home/bsnsAll/00/detail?bsnsDtlsIemNo=909">NIPA 사업 원문</a>

          단순 발언·반복 기사는 보내지 않습니다.
          EOF

      - name: Send Telegram
        env:
          RESOLVED_CHAT_ID: ${{ steps.telegram.outputs.chat_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, time, urllib.parse, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id=os.environ["RESOLVED_CHAT_ID"].strip()
          test=pathlib.Path("out/ai_safety_policy_watch_connection_test.html")
          alert=pathlib.Path("out/ai_safety_policy_watch_alert.html")
          title=pathlib.Path("out/ai_safety_policy_watch_alert_title.txt")

          files=[]
          if test.exists() and test.read_text(encoding="utf-8").strip():
              files.append(("test",test.read_text(encoding="utf-8").strip()))
          if alert.exists() and alert.read_text(encoding="utf-8").strip():
              body=alert.read_text(encoding="utf-8").strip()
              if title.exists():
                  body=title.read_text(encoding="utf-8").strip()+"\n\n"+body
              files.append(("alert",body))

          def chunks(text,max_len=3800):
              text=text.strip()
              out=[]
              while len(text)>max_len:
                  cut=text.rfind("\n\n",0,max_len)
                  if cut<900: cut=text.rfind("\n",0,max_len)
                  if cut<900: cut=max_len
                  out.append(text[:cut].strip())
                  text=text[cut:].strip()
              if text: out.append(text)
              return out

          ids=[]
          for kind,text in files:
              for chunk in chunks(text):
                  payload=urllib.parse.urlencode({
                      "chat_id":chat_id,
                      "text":chunk,
                      "parse_mode":"HTML",
                      "disable_web_page_preview":"true",
                  }).encode("utf-8")
                  req=urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage",data=payload,method="POST")
                  # Timeout can occur after Telegram accepts a message. Reposting
                  # after ambiguous errors risks duplicate alerts. Fail closed.
                  import urllib.error
                  result=None
                  for attempt in range(1,4):
                      try:
                          with urllib.request.urlopen(req,timeout=30) as r:
                              result=json.loads(r.read().decode("utf-8"))
                          break
                      except urllib.error.HTTPError as exc:
                          if exc.code == 429 and attempt < 3:
                              time.sleep(attempt*3)
                              continue
                          raise RuntimeError(f"Telegram HTTP {exc.code}, no automatic replay") from exc
                      except (urllib.error.URLError, TimeoutError, OSError, ValueError) as exc:
                          raise RuntimeError(
                              "Telegram delivery outcome uncertain; verify history before any resend"
                          ) from exc
                  if not result or not result.get("ok"):
                      raise RuntimeError("Telegram sendMessage returned non-success")
                  response=result.get("result") or {}
                  mid=response.get("message_id")
                  response_chat_id=(response.get("chat") or {}).get("id")
                  if mid is None or response_chat_id is None:
                      raise RuntimeError("Telegram success without message_id or chat.id")
                  if str(response_chat_id)!=str(chat_id):
                      raise RuntimeError("Telegram chat.id mismatch, no state checkpoint")
                  # Do not expose private numeric chat ID in public artifacts.
                  ids.append({"kind":kind,"message_id":mid,"chat_id_verified":True})

          if alert.exists():
              alert_ids=[x for x in ids if x["kind"]=="alert"]
              if not alert_ids:
                  raise RuntimeError("Alert existed but delivery unconfirmed")
          # Preserve the API's actual message_id for both real alerts and
          # user-requested send_test runs in the existing uploaded artifact.
          if ids:
              pathlib.Path("out/ai_safety_policy_watch_telegram_confirmed.json").write_text(
                  json.dumps({"status":"confirmed","bot_username":"${{ steps.telegram.outputs.bot_username }}","messages":ids},ensure_ascii=False,indent=2)+"\n",
                  encoding="utf-8"
              )
          print(f"ai_policy_telegram_messages_sent={len(ids)}")
          PY

      - name: Finalize state after no-alert or confirmed delivery
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f out/ai_safety_policy_watch_pending_state.json ]; then
            echo "Pending state missing" >&2
            exit 1
          fi
          if [ -f out/ai_safety_policy_watch_alert.html ] && [ ! -f out/ai_safety_policy_watch_telegram_confirmed.json ]; then
            echo "Alert not checkpointed because Telegram delivery is unconfirmed" >&2
            exit 1
          fi
          cp out/ai_safety_policy_watch_pending_state.json data/ai_safety_policy_watch_state.json

      - name: Commit watch state
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp data/ai_safety_policy_watch_state.json "$tmp/state.json"
          git config user.name "ai-safety-policy-watch[bot]"
          git config user.email "ai-safety-policy-watch[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp "$tmp/state.json" data/ai_safety_policy_watch_state.json
            git add data/ai_safety_policy_watch_state.json
            if git diff --cached --quiet; then
              echo "Policy watch state unchanged"
              exit 0
            fi
            git commit -m "Update AI safety policy watch state"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-safety-policy-watch-${{ github.run_id }}
          path: |
            out/ai_safety_policy_watch_status.md
            out/ai_safety_policy_watch_alert_title.txt
            out/ai_safety_policy_watch_alert.html
            out/ai_safety_policy_watch_pending_state.json
            out/ai_safety_policy_watch_telegram_confirmed.json
            out/ai_safety_policy_watch_connection_test.html
          if-no-files-found: ignore
          retention-days: 14
