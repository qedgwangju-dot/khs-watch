              truth="https://truthsocial.com/@realDonaldTrump/117382616783706638"
              reuters="https://www.reuters.com/world/us/jay-clayton-lead-trumps-ai-task-force-deliver-report-120-days-wsj-reports-2026-10-03/"
              body=[
                  "🚨 <b>[미국 AI 정책지휘체계 중요 변화]</b>",
                  f"조회 {now:%Y-%m-%d %H:%M KST}",
                  "",
                  f"<b>{heading}</b>",
                  *detail,
                  "• <b>투자 연결</b>: 현재 특정 기업 신규 정부계약 확정이 아님. 예산·조달·규칙이 GPU·클라우드·사이버보안·데이터센터 전력·국방 AI 발주로 전환될 때 실적 연결",
                  *( [f'• <a href="{row["link"]}">이번 변화 출처: {html.escape(row["source"])}</a>'] if row.get("link") and row.get("link")!=truth else [] ),
                  f'• <a href="{truth}">Trump Truth Social 창설 원문</a>',
                  f'• <a href="{reuters}">Reuters 교차검증</a>',
              ]
              alert=pathlib.Path("out/ai_safety_policy_watch_alert.html")
              title_file=pathlib.Path("out/ai_safety_policy_watch_alert_title.txt")
              existing=alert.read_text(encoding="utf-8").strip() if alert.exists() else ""
              sif_text="\n".join(body)
              alert.write_text((sif_text+("\n\n"+existing if existing else "")).rstrip()+"\n",encoding="utf-8")
              if not title_file.exists():
                  title_file.write_text("🚨 미국 AI 정책지휘체계 중요 변화: "+heading+"\n",encoding="utf-8")
              seen[digest]={
                  "title":heading,
                  "source":row["source"],
                  "url":row["link"],
                  "entity":"미국 Super Intelligence Force",
