name: AI Safety Standards Policy Watch

# Duplicate-alert guard verified against alternating official-page render digests.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-safety-policy-watch.yml"
      - "scripts/ai_safety_policy_watch.py"
      - "scripts/ai_sif_regulatory_validation.py"
      - "scripts/ai_si_portal_semantic.py"
      - "scripts/ai_si_portal_policy_enrich.py"
      - "scripts/test_ai_si_portal_semantic.py"
  schedule:
    - cron: "14,44 * * * *"
  workflow_run:
    workflows:
      - "AI Security Web Watch"
    types: [completed]
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send one Telegram formatting/route test"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: ai-safety-standards-policy-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_AI_POLICY_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      EXPECTED_TELEGRAM_BOT_USERNAMES: "khs88798879_bot"
      POLICY_SEND_CONNECTION_TEST_ON_PUSH: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and verify Telegram route
        id: telegram
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, time, urllib.error, urllib.request
          def route_json(url, *, opener=urllib.request.urlopen, sleep=time.sleep):
              """Retry only transient Telegram route errors; never bypass identity validation."""
              for attempt in range(3):
                  try:
                      with opener(url, timeout=25) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      if exc.code not in {429, 500, 502, 503, 504} or attempt == 2:
                          raise
                  except (urllib.error.URLError, TimeoutError, OSError, ValueError):
                      if attempt == 2:
                          raise
                  sleep(1 << attempt)
              raise RuntimeError("Telegram route request exhausted")

          if os.getenv("GITHUB_EVENT_NAME") == "push":
              class _FakeResponse:
                  def __enter__(self): return self
                  def __exit__(self, *args): return False
                  def read(self): return b'{"ok":true,"result":{"username":"test"}}'
              _tries = {"n": 0}
              def _flaky(url, timeout):
                  _tries["n"] += 1
                  if _tries["n"] < 3:
                      raise TimeoutError("synthetic Telegram timeout")
                  return _FakeResponse()
              assert route_json("https://example.invalid", opener=_flaky, sleep=lambda _: None)["ok"]
              assert _tries["n"] == 3
              print("ai_policy_telegram_route_retry_regression=true attempts=3")

          token=(os.environ.get("TELEGRAM_BOT_TOKEN") or "").strip()
          configured=(os.environ.get("TELEGRAM_CHAT_ID") or "").strip()
          expected={x.strip().lstrip("@").lower() for x in (os.environ.get("EXPECTED_TELEGRAM_BOT_USERNAMES") or "").split(",") if x.strip()}
          if not token:
              raise RuntimeError("Missing Telegram bot token")
          ident=route_json(f"https://api.telegram.org/bot{token}/getMe")
          actual=str((ident.get("result") or {}).get("username") or "")
          if not ident.get("ok") or not actual:
              raise RuntimeError("Telegram getMe failed")
          if expected and actual.lower() not in expected:
              raise RuntimeError(f"Wrong Telegram bot: @{actual}")
          chat_id=configured
          route="secret"
          if not chat_id:
              updates=route_json(f"https://api.telegram.org/bot{token}/getUpdates?limit=100&timeout=0")
              candidates=[]
              for upd in updates.get("result") or []:
                  msg=upd.get("message") or upd.get("edited_message") or {}
                  chat=msg.get("chat") or {}
                  if str(chat.get("type") or "")=="private" and chat.get("id") is not None:
                      candidates.append((int(upd.get("update_id") or 0),str(chat["id"])))
              if candidates:
                  candidates.sort()
                  chat_id=candidates[-1][1]
                  route="getUpdates"
          if not chat_id:
              raise RuntimeError("Telegram chat_id unresolved")
          out=pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a",encoding="utf-8") as f:
              f.write(f"bot_username={actual}\n")
              f.write(f"chat_id={chat_id}\n")
              f.write(f"route={route}\n")
          print(f"ai_policy_bot_verified=@{actual}")
          print(f"ai_policy_chat_resolved=true route={route}")
          PY

      - name: Validate watcher
        run: python -m py_compile scripts/ai_safety_policy_watch.py

      - name: Verify Korean alert translation on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import re
          from scripts.ai_safety_policy_watch import translate_alert_text
          sample = "Sentry standalone SKU pricing and BlueField-4 enterprise deployment"
          translated = translate_alert_text(sample)
          print(f"ai_policy_translation_sample={translated}")
          if not re.search(r"[가-힣]", translated):
              raise RuntimeError("Korean translation smoke test failed")
          if "Sentry" not in translated or "BlueField-4" not in translated:
              raise RuntimeError("Product identifiers were not preserved")
          PY

      - name: Verify frontier accord classification
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          from unittest.mock import patch
          from scripts.ai_safety_policy_watch import (
              UTC,
              detect_category,
              detect_entity,
              source_official,
              official_page_source,
              forced_official_page_category,
              forced_official_page_entity,
              advance_official_page_state,
              is_anthropic_mission_launch_baseline,
              is_reported_si_original,
              material,
              concise_fact,
          )

          cases = [
              (
                  "Exclusive: Anthropic breaches spark White House AI reporting mandate; SI Force requires notification and remediation",
                  "미국 AI 사고 신고·시정 요구 발표",
                  "백악관 Super Intelligence Force",
              ),
              (
                  "Anthropic Cyber Mission expands Critical Infrastructure Defense Program and OSS Scanner",
                  "Anthropic 핵심 기반시설·오픈소스 방어 사업",
                  "Anthropic",
              ),
              (
                  "Thomas Lind joined OpenAI national security policy team to lead cyber and strategic risk after serving at ONCD and NSA",
                  "프런티어 AI 국가안보·정책 핵심인사 이동",
                  "OpenAI 국가안보 정책팀",
              ),
              (
                  "White House Accord on Super Intelligence Joint Commitment on Frontier Responsibilities signatory added",
                  "프런티어 AI 공동 서약·서명기업 변화",
                  "백악관·프런티어 AI 공동서약",
              ),
              (
                  "frontier AI external auditor audit frequency audit scope auditor access",
                  "외부감사 규격·감사기관",
                  None,
              ),
              (
                  "frontier AI oversight board independent board committee",
                  "독립 이사회·감독위원회",
                  None,
              ),
              (
                  "AI accord codified into law procurement requirement insurance requirement",
                  "자율서약→법·조달·보험 성문화",
                  None,
              ),
          ]
          for text, expected_category, expected_entity in cases:
              category = detect_category(text)
              print(f"ai_policy_accord_case={expected_category} actual={category}")
              if category != expected_category:
                  raise RuntimeError(f"Accord category mismatch: expected={expected_category} actual={category}")
              if expected_entity:
                  entity = detect_entity(text)
                  if entity != expected_entity:
                      raise RuntimeError(f"Accord entity mismatch: expected={expected_entity} actual={entity}")

          for source in ("White House", "U.S. House of Representatives"):
              if not source_official(source):
                  raise RuntimeError(f"Official source not recognized: {source}")

          source_cases = {
              "백악관 Super Intelligence 행정명령": "White House",
              "미 하원의장실 White House Accord 공식 발표": "U.S. House of Representatives",
              "OpenAI 프런티어 학습 Safety Case": "OpenAI",
              "NVIDIA OpenShell 보안정책": "NVIDIA",
              "NIPA 사이버보안 특화 AI 사업": "NIPA",
          }
          for name, expected in source_cases.items():
              actual = official_page_source(name)
              print(f"ai_policy_official_source={name} -> {actual}")
              if actual != expected:
                  raise RuntimeError(f"Official page source mismatch: {name} -> {actual}, expected {expected}")

          axios_item = {
              "source": "Axios",
              "title": "Exclusive: Anthropic breaches spark White House AI reporting mandate",
              "description": "The Super Intelligence Force demands immediate incident notification and remediation",
              "url": "https://www.axios.com/2026/10/09/anthropic-ai-security-white-house",
          }
          if not is_reported_si_original(axios_item) or material(axios_item):
              raise RuntimeError("Axios original must use only the SIF stage channel")
          if source_official("Axios"):
              raise RuntimeError("Axios attribution was incorrectly elevated to official rule publication")
          print("ai_policy_si_statement_regression=PASS")
          launch = {
              "source": "Anthropic",
              "title": "Introducing the Anthropic Cyber Mission",
              "description": "Launch of the free OSS Scanner",
              "url": "https://www.anthropic.com/news/anthropic-cyber-mission",
          }
          if not is_anthropic_mission_launch_baseline(launch) or material(launch):
              raise RuntimeError("Already-published Anthropic launch was replayed as new policy")
          expansion = {
              "source": "Anthropic",
              "title": "Anthropic Cyber Mission expands Critical Infrastructure Defense Program",
              "description": "New operational technology partners joined the CIDP",
              "url": "https://www.anthropic.com/news/cidp-partners-expansion",
          }
          if is_anthropic_mission_launch_baseline(expansion) or not material(expansion):
              raise RuntimeError("New Anthropic CIDP program expansion was missed")
          with patch(
              "scripts.ai_safety_policy_watch._translate_google",
              return_value="사이버 방어 사업 확대",
          ):
              sample = concise_fact({
                  "title": "Anthropic News: Anthropic Cyber Mission expands to new partners",
                  "entity": "Anthropic",
                  "category": "Anthropic 핵심 기반시설·오픈소스 방어 사업",
              })
          print(f"ai_policy_proper_name_sample={sample}")
          if "Anthropic Cyber Mission" not in sample or "인류학" in sample or "Anthropic News:" in sample:
              raise RuntimeError("Policy translation changed the brand or index heading")
          print("ai_policy_cyber_mission_regression=PASS")

          forced_cases = {
              "Anthropic Cyber Mission 공식 출범": (
                  "Anthropic 핵심 기반시설·오픈소스 방어 사업",
                  "Anthropic",
              ),
              "미 하원의장실 White House Accord 공식 발표": (
                  "프런티어 AI 공동 서약·서명기업 변화",
                  "백악관·프런티어 AI 공동서약",
              ),
              "백악관 Super Intelligence 행정명령": (
                  "백악관 Super Intelligence 정책·법제화",
                  "백악관 Super Intelligence 정책",
              ),
              "OpenAI 프런티어 학습 Safety Case": (
                  "Safety Case 실제 학습 승인 게이트",
                  "OpenAI",
              ),
              "NVIDIA OpenShell 개요·지원": (
                  "OpenShell 기본내장·지원 확대",
                  "NVIDIA OpenShell",
              ),
          }
          for name, (expected_category, expected_entity) in forced_cases.items():
              actual_category = forced_official_page_category(name)
              actual_entity = forced_official_page_entity(name)
              print(
                  f"ai_policy_forced_page={name} "
                  f"category={actual_category} entity={actual_entity}"
              )
              if actual_category != expected_category or actual_entity != expected_entity:
                  raise RuntimeError(
                      f"Forced official page mapping mismatch: {name} "
                      f"category={actual_category} entity={actual_entity}"
                  )

          # Duplicate-alert guard: immutable White House reference pages must
          # never alert even if alternating HTML render variants change digest.
          t0 = dt.datetime(2026, 10, 3, 0, 0, tzinfo=UTC)
          base = {
              "digest": "A",
              "url": "https://www.whitehouse.gov/example",
              "updated_at": t0.isoformat(),
          }
          snap_b = {"digest": "B", "url": base["url"], "material": "variant B"}
          state1, alert1 = advance_official_page_state(
              "백악관 Super Intelligence 행정명령", base, snap_b, t0
          )
          state2, alert2 = advance_official_page_state(
              "백악관 Super Intelligence 행정명령",
              state1,
              {"digest": "A", "url": base["url"], "material": "variant A"},
              t0 + dt.timedelta(minutes=20),
          )
          state3, alert3 = advance_official_page_state(
              "백악관 Super Intelligence 행정명령",
              state2,
              snap_b,
              t0 + dt.timedelta(minutes=40),
          )
          print(
              f"ai_policy_duplicate_guard_immutable="
              f"{alert1},{alert2},{alert3} digest={state3.get('digest')}"
          )
          if alert1 or alert2 or alert3 or state3.get("digest") != "A":
              raise RuntimeError("Immutable White House page render jitter could create a duplicate alert")

          # Mutable pages require the same changed digest to persist for at
          # least 10 minutes and two observations before alerting.
          mutable_base = {
              "digest": "A",
              "url": "https://example.com/mutable",
              "updated_at": t0.isoformat(),
          }
          m1, ma1 = advance_official_page_state(
              "NVIDIA OpenShell 지원정책",
              mutable_base,
              {"digest": "B", "url": mutable_base["url"], "material": "new"},
              t0,
          )
          m2, ma2 = advance_official_page_state(
              "NVIDIA OpenShell 지원정책",
              m1,
              {"digest": "B", "url": mutable_base["url"], "material": "new"},
              t0 + dt.timedelta(minutes=11),
          )
          print(
              f"ai_policy_duplicate_guard_mutable="
              f"{ma1},{ma2} digest={m2.get('digest')}"
          )
          if ma1 or not ma2 or m2.get("digest") != "B":
              raise RuntimeError("Mutable official page confirmation guard failed")
          PY

      - name: Verify OpenAI and Trail of Bits acquisition stages
        shell: bash
        run: |
          python - <<'PY'
          from scripts.ai_safety_policy_watch import (
              detect_category, detect_entity, is_patch_the_planet_original,
              material, source_official, trail_of_bits_mna_stage,
          )

          def item(title, source="The Information", url="https://www.theinformation.com/example"):
              return {
                  "title": title, "description": "", "source": source, "url": url,
              }

          initial = item("OpenAI in early talks to buy security startup Trail of Bits; deal could fall apart")
          assert trail_of_bits_mna_stage(initial) == "initial_talks"
          assert not material(initial), "Initial report must remain a silent known baseline"
          assert not source_official(initial["source"]), "News report is not an OpenAI announcement"

          prior_partnership = item(
              "Introducing Patch the Planet: OpenAI partners with Trail of Bits",
              "OpenAI", "https://openai.com/index/patch-the-planet/",
          )
          assert is_patch_the_planet_original(prior_partnership)
          assert not material(prior_partnership)

          reported = item("OpenAI and Trail of Bits in exclusive acquisition negotiations")
          assert trail_of_bits_mna_stage(reported) == "advanced_talks_reported"
          assert material(reported)
          assert detect_category(reported["title"]) == "OpenAI–Trail of Bits 인수·계약 단계"
          assert detect_entity(reported["title"]) == "OpenAI–Trail of Bits"

          official_sign = item(
              "OpenAI signed a definitive agreement to acquire Trail of Bits",
              "OpenAI", "https://openai.com/index/trail-of-bits-acquisition/",
          )
          assert trail_of_bits_mna_stage(official_sign) == "signed"
          assert material(official_sign)
          assert source_official(official_sign["source"])

          reported_sign = dict(official_sign, source="Reuters")
          assert trail_of_bits_mna_stage(reported_sign) == "signed_reported"

          completed = item("OpenAI completes acquisition of Trail of Bits", "OpenAI")
          assert trail_of_bits_mna_stage(completed) == "closed"

          ended = item("OpenAI and Trail of Bits acquisition talks have ended", "Reuters")
          assert trail_of_bits_mna_stage(ended) == "talks_ended_reported"

          just_research = item(
              "OpenAI and Trail of Bits report open source bugs with Codex",
              "Trail of Bits",
          )
          assert trail_of_bits_mna_stage(just_research) is None
          paid_service = item(
              "OpenAI and Trail of Bits sign paid security services deal for Patch the Planet customers",
              "OpenAI",
          )
          assert trail_of_bits_mna_stage(paid_service) is None
          assert material(paid_service)
          assert detect_category(paid_service["title"]) == "OpenAI–Trail of Bits 취약점 수정 사업화"
          print("ai_policy_trail_of_bits_mna_regression=PASS")
          PY

      - name: Verify SoftBank security M&A and Anthropic bill stage guards
        shell: bash
        run: |
          python - <<'PY'
          from scripts.ai_safety_policy_watch import (
              MAX_ALERT_EVENTS, POLICY_EVENT_BASELINES, cluster_events,
              detect_category, detect_entity, google_news_url, material, source_official, source_trusted,
              cohere_aisle_publisher_verified, select_policy_alert_events,
              tracked_policy_event_key, tracked_policy_event_stage,
          )
          def item(title, source="Reuters"):
              return {
                  "title": title, "description": title,
                  "source": source, "url": "https://example.com/test"
              }
          initial = item("SoftBank in early talks to acquire Allied Universal")
          assert tracked_policy_event_key(initial) == "softbank_allied:initial_talks_reported"
          assert tracked_policy_event_key(initial) in POLICY_EVENT_BASELINES
          assert material(initial)
          assert "물리보안" in detect_category(initial["title"])
          assert "SoftBank" in detect_entity(initial["title"])
          assert tracked_policy_event_stage(item(
              "SoftBank signs definitive agreement to acquire Allied Universal"
          )) == ("softbank_allied", "signed_reported")
          assert tracked_policy_event_stage(item(
              "SoftBank closes acquisition of Allied Universal"
          )) == ("softbank_allied", "closed_reported")
          assert tracked_policy_event_stage(item(
              "SoftBank signs deal to buy Allied Universal"
          )) == ("softbank_allied", "signed_reported")
          assert tracked_policy_event_stage(item(
              "FTC clears SoftBank Allied Universal takeover"
          )) == ("softbank_allied", "regulatory_clearance_reported")
          assert tracked_policy_event_stage(item(
              "SoftBank and Allied Universal acquisition talks collapse"
          )) == ("softbank_allied", "talks_ended_reported")
          assert tracked_policy_event_stage(item(
              "SoftBank could sign an agreement to acquire Allied Universal"
          )) == ("softbank_allied", "initial_talks_reported")
          assert tracked_policy_event_stage(item(
              "Allied Universal wins data-center security contract"
          )) is None
          draft = item("Anthropic quietly pitches its own AI safety bill to lawmakers", "Politico")
          assert source_trusted("Politico") and material(draft)
          assert "ceid=US%3Aen" in google_news_url('"SoftBank" "Allied Universal" takeover')
          assert "ceid=US%3Aen" in google_news_url('"Anthropic" "AI safety bill" Congress')
          assert "ceid=KR%3Ako" in google_news_url("네이버클라우드 사이버 보안 사업")
          assert tracked_policy_event_key(draft) in POLICY_EVENT_BASELINES
          assert tracked_policy_event_stage(item(
              "Anthropic AI safety bill formally introduced in Congress"
          )) == ("anthropic_frontier_bill", "introduced_reported")
          assert tracked_policy_event_stage(item(
              "House passes Anthropic AI safety bill"
          )) == ("anthropic_frontier_bill", "passed_chamber_reported")
          assert tracked_policy_event_stage(item(
              "Anthropic AI safety bill signed into law"
          )) == ("anthropic_frontier_bill", "enacted_reported")
          assert tracked_policy_event_stage(item(
              "Anthropic unveils Advanced AI Framework"
          )) is None
          assert not material(item("SoftBank signs definitive agreement to acquire Allied Universal", "Unknown Blog"))
          items = [
              {"entity": f"Vendor{i}", "category": "Unique", "title": f"Unique unrelated event {i}",
               "official": False, "published_at": "2026-10-17", "fingerprint": str(i)}
              for i in range(MAX_ALERT_EVENTS + 2)
          ]
          assert len(cluster_events(items)) == MAX_ALERT_EVENTS + 2
          # Reporting two different transaction stages during a single scan
          # must make two alerts; two newspapers covering the same stage must
          # remain one alert, regardless of syndicated headline variation.
          def staged_row(title, fp):
              row = item(title)
              row.update({
                  "entity": detect_entity(title),
                  "category": detect_category(title),
                  "fingerprint": fp,
                  "official": False,
                  "published_at": "2026-10-17",
              })
              return row
          milestone_rows = [
              staged_row("SoftBank signs deal to buy Allied Universal", "signed1"),
              staged_row("SoftBank and Allied Universal acquisition talks collapse", "ended1"),
              staged_row("Allied Universal to be acquired by SoftBank in definitive agreement", "signed2"),
          ]
          stage_clusters = cluster_events(milestone_rows)
          assert len(stage_clusters) == 2
          assert sorted(len(x) for x in stage_clusters) == [1, 2]
          selected, deferred, deferred_count = select_policy_alert_events(items)
          assert len(selected) == MAX_ALERT_EVENTS
          assert deferred_count == 2
          assert deferred == {str(MAX_ALERT_EVENTS), str(MAX_ALERT_EVENTS + 1)}
          checkpoint_fingerprints = {
              i["fingerprint"] for i in items if i["fingerprint"] not in deferred
          }
          assert not checkpoint_fingerprints.intersection(deferred)
          replay_items = [i for i in items if i["fingerprint"] in deferred]
          selected_next, deferred_next, count_next = select_policy_alert_events(replay_items)
          assert len(selected_next) == 2 and not deferred_next and count_next == 0
          # The Oct 15 subpoenas are a historical report, not a fresh
          # enforcement verdict. Keep each company's later formal case distinct.
          both = item("FTC subpoenas OpenAI and Anthropic over AI consumer harms")
          assert tracked_policy_event_key(both) == "ftc_ai_safety_both:subpoenas_reported"
          assert tracked_policy_event_key(both) in POLICY_EVENT_BASELINES
          assert material(both)
          assert "조사·집행" in detect_category(both["title"])
          assert tracked_policy_event_stage(item(
              "FTC sues OpenAI over AI model consumer safety"
          )) == ("ftc_ai_safety_openai", "formal_complaint_reported")
          assert tracked_policy_event_stage(item(
              "FTC reaches settlement with Anthropic over AI model safety"
          )) == ("ftc_ai_safety_anthropic", "settlement_reported")
          assert tracked_policy_event_stage(item(
              "FTC closes investigation into OpenAI AI model safety"
          )) == ("ftc_ai_safety_openai", "investigation_closed_reported")
          assert tracked_policy_event_stage(item(
              "FTC could subpoena Anthropic over AI model safety"
          )) is None
          assert not material(item(
              "FTC sues OpenAI over AI model consumer safety", "Unknown Blog"
          ))
          cohere_loi = item(
              "Cohere and AISLE sign letter of intent to advance cyber-resilient sovereign AI", "Cohere"
          )
          cohere_loi["publisher_url"] = "https://cohere.com"
          cohere_key = "cohere_aisle:letter_of_intent_announced"
          assert tracked_policy_event_key(cohere_loi) == cohere_key
          assert cohere_key in POLICY_EVENT_BASELINES
          assert source_official("Cohere") and source_official("AISLE")
          assert source_trusted("CNBC") and material(cohere_loi)
          assert cohere_aisle_publisher_verified(cohere_loi)
