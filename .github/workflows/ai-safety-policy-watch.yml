          import xml.etree.ElementTree as ET
          from zoneinfo import ZoneInfo
          from scripts.ai_sif_regulatory_validation import verify_formal_instrument

          KST=ZoneInfo("Asia/Seoul")
          pending=pathlib.Path("out/ai_safety_policy_watch_pending_state.json")
          if not pending.exists():
              raise RuntimeError("AI policy pending state missing before SIF enrichment")
          state=json.loads(pending.read_text(encoding="utf-8"))
          seen=state.setdefault("seen",{})
          # Restore the publisher's URL in older SIF checkpoints. Earlier
          # runs saved Google News RSS proxy links; never re-send the event.
          canonical_axios="https://www.axios.com/2026/10/09/anthropic-ai-security-white-house"
          for event in seen.values():
              if event.get("semantic_key")=="us-sif-ai-incident-statement-2026-10-09":
                  event["url"]=canonical_axios
          now=dt.datetime.now(KST)
          # 2026-10-15 charter adoption: preserve an already-known reported
          # milestone. Do not replay it as a law or fresh Telegram alert.
          charter_key="us-sif-charter-adopted-2026-10-15"
          charter_digest=hashlib.sha256(("sif-semantic-v1:"+charter_key).encode()).hexdigest()[:24]
          seen.setdefault(charter_digest,{
              "title":"SIF 첫 회의·헌장 채택(보도 단계)",
              "source":"Semafor",
              "url":"https://www.semafor.com/article/10/15/2026/white-houses-ai-task-force-gets-to-work",
              "entity":"미국 Super Intelligence Force",
              "category":"미국 Super Intelligence Force 정책지휘체계",
              "published_at":"2026-10-15T00:00:00+00:00",
              "first_seen_at":"2026-10-15T00:00:00+00:00",
              "semantic_key":charter_key,
          })
          query='("Super Intelligence Force" OR "Anthropic breaches spark White House AI reporting mandate" OR "AI model incident reporting")'
          rss="https://news.google.com/rss/search?"+urllib.parse.urlencode({
              "q":query+" when:7d","hl":"en-US","gl":"US","ceid":"US:en"
          })
          req=urllib.request.Request(rss,headers={"User-Agent":"Mozilla/5.0 khs-ai-policy-sif-watch/1.0"})

          # Retry transient feed outages; persistent failures still stop the job
          # so an unobserved policy change is never checkpointed as "no news".
          def fetch_sif_feed(request, *, opener=urllib.request.urlopen, sleep=time.sleep):
              for attempt in range(3):
                  try:
                      with opener(request, timeout=25) as response:
                          return ET.fromstring(response.read())
                  except urllib.error.HTTPError as exc:
                      if exc.code not in {429, 500, 502, 503, 504} or attempt == 2:
                          raise
                      reason=f"HTTP {exc.code}"
                  except (urllib.error.URLError, TimeoutError, OSError) as exc:
                      if attempt == 2:
                          raise
                      reason=type(exc).__name__
                  delay=2**attempt
                  print(f"ai_policy_sif_feed_transient_retry attempt={attempt+1} cause={reason} delay_seconds={delay}")
                  sleep(delay)
              raise RuntimeError("SIF feed retry exhausted")

          class _TestRSSResponse:
              def __enter__(self): return self
              def __exit__(self, *args): return False
              def read(self): return b"<rss><channel/></rss>"
          _tries=[0]
          def _temporary_503(request,timeout=25):
              _tries[0]+=1
              if _tries[0]<=2:
                  raise urllib.error.HTTPError(request.full_url,503,"synthetic temporary failure",None,None)
              return _TestRSSResponse()
          assert fetch_sif_feed(req,opener=_temporary_503,sleep=lambda _:None).tag=="rss"
          assert _tries[0]==3
          _denied=[0]
          def _always_403(request,timeout=25):
              _denied[0]+=1
              raise urllib.error.HTTPError(request.full_url,403,"synthetic denied",None,None)
          try:
              fetch_sif_feed(req,opener=_always_403,sleep=lambda _:None)
          except urllib.error.HTTPError as exc:
              assert exc.code==403 and _denied[0]==1
          else:
              raise AssertionError("403 must not be silently retried")
          print("ai_policy_sif_feed_retry_regression=PASS")

          root=fetch_sif_feed(req)

          trusted={
              "Reuters","AP News","Associated Press","The Associated Press","Axios",
              "Federal Register","GovInfo","U.S. Government Publishing Office",
              "The Wall Street Journal","Wall Street Journal","CBS News",
              "The White House","White House",
              "Office of the Director of National Intelligence",
              "Federal Trade Commission",
              "U.S. Department of Defense","Department of Defense",
              "U.S. Department of War","Department of War",
