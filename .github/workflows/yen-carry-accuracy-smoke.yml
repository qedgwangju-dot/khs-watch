name: Yen carry accurate value smoke test

on:
  pull_request:
    paths:
      - "tests/yen_carry_accuracy_smoke_trigger.txt"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_TEST: "true"
      YEN_CARRY_YAHOO_INTERVAL: "5m"
      YEN_CARRY_YAHOO_RANGE: "5d"
      KHS_SOURCE_PROXY_URL: "https://tips-yield-telegram.gustnd1.workers.dev/policy-source/fetch"
      KHS_SOURCE_PROXY_FIRST: "true"
      KHS_SOURCE_PROXY_TIMEOUT_SECONDS: "20"
      KHS_SOURCE_DIRECT_TIMEOUT_CAP_SECONDS: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build accurate unsent Telegram test message
        run: |
          python scripts/yen_carry_alert_v2.py
          python scripts/yen_carry_alert_enrich.py
          cat out/yen_carry_alert.md
      - name: Upload accurate value artifact
        uses: actions/upload-artifact@v4
        with:
          name: yen-carry-accurate-value-${{ github.run_id }}
          path: |
            out/yen_carry_alert.md
            out/yen_carry_alert.json
            out/yen_carry_watch.md
          retention-days: 2
