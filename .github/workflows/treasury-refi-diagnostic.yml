name: Treasury MSPD Refi Diagnostic

on:
  push:
    paths:
      - ".github/workflows/treasury-refi-diagnostic.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect FiscalData MSPD rows
        run: |
          python - <<'PY'
          import requests, datetime as dt, collections, json
          BASE='https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/debt'
          u3=BASE+'/mspd/mspd_table_3_market'
          r=requests.get(u3, params={'sort':'-record_date','page[number]':1,'page[size]':1}, timeout=30); r.raise_for_status(); latest=r.json()['data'][0]['record_date'][:10]
          r=requests.get(u3, params={'filter':f'record_date:eq:{latest}','sort':'-record_date,maturity_date','page[number]':1,'page[size]':10000}, timeout=30); r.raise_for_status(); rows=[x for x in r.json()['data'] if str(x.get('record_date',''))[:10]==latest]
          def num(v):
              try:return float(str(v).replace(',',''))
              except:return 0.0
          bills=[x for x in rows if 'bill' in str(x.get('security_class1_desc') or '').lower()]
          raw_c=collections.Counter(str(x.get('security_class2_desc') or '') for x in bills)
          strip_c=collections.Counter(str(x.get('security_class2_desc') or '').strip() for x in bills)
          print('LATEST',latest,'BILL_ROWS',len(bills),'RAW_UNIQUE',len(raw_c),'STRIP_UNIQUE',len(strip_c))
          print('BILL_CUSIP_COUNTS_FIRST20',list(strip_c.items())[:20])
          # Show all rows for a few repeated normalized CUSIPs.
          for cus,n in list(strip_c.items())[:5]:
              print('CUSIP',repr(cus),'COUNT',n)
              for x in bills:
                  if str(x.get('security_class2_desc') or '').strip()==cus:
                      print('  ',json.dumps({k:x.get(k) for k in ['security_class2_desc','issue_date','maturity_date','issued_amt','redeemed_amt','outstanding_amt','src_line_nbr']},sort_keys=True))
          # Max outstanding using normalized CUSIP only, normalized CUSIP+maturity, and sum of rows with positive outstanding.
          by_cus={}; by_cusmat={}
          for x in bills:
              cus=str(x.get('security_class2_desc') or '').strip(); mat=str(x.get('maturity_date') or '').strip(); amt=num(x.get('outstanding_amt'))
              by_cus[cus]=max(by_cus.get(cus,0),amt)
              by_cusmat[(cus,mat)]=max(by_cusmat.get((cus,mat),0),amt)
          print('SUM_POSITIVE_ROWS_T',sum(num(x.get('outstanding_amt')) for x in bills)/1e6)
          print('SUM_MAX_BY_CUSIP_T',sum(by_cus.values())/1e6)
          print('SUM_MAX_BY_CUSIP_MAT_T',sum(by_cusmat.values())/1e6)
          # Table1 reference.
          u1=BASE+'/mspd/mspd_table_1'
          r=requests.get(u1, params={'sort':'-record_date','page[number]':1,'page[size]':30}, timeout=30); r.raise_for_status(); d=r.json()['data']; l=str(d[0]['record_date'])[:10]
          for x in d:
              if str(x.get('record_date',''))[:10]==l and x.get('security_class_desc')=='Bills':
                  print('TABLE1_BILLS_T',float(x.get('total_mil_amt'))/1e6)
          PY
