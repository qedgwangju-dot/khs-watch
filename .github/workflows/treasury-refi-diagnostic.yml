name: Treasury MSPD Refi Diagnostic

on:
  push:
    paths:
      - ".github/workflows/treasury-refi-diagnostic.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect FiscalData MSPD rows
        run: |
          python - <<'PY'
          import requests, json, collections, datetime as dt
          BASE='https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/debt'
          u3=BASE+'/mspd/mspd_table_3_market'
          r=requests.get(u3, params={'sort':'-record_date','page[number]':1,'page[size]':1}, timeout=30); r.raise_for_status(); latest=r.json()['data'][0]['record_date'][:10]
          r=requests.get(u3, params={'filter':f'record_date:eq:{latest}','sort':'-record_date,maturity_date','page[number]':1,'page[size]':10000}, timeout=30); r.raise_for_status(); rows=[x for x in r.json()['data'] if str(x.get('record_date',''))[:10]==latest]
          print('LATEST',latest,'ROWCOUNT',len(rows))
          def num(v):
              try:return float(str(v).replace(',',''))
              except:return 0.0
          # One outstanding balance per CUSIP/security_class2: take max positive amount.
          by={}
          for x in rows:
              cls=str(x.get('security_class1_desc') or '')
              if cls in ('Total Marketable','Federal Financing Bank'): continue
              key=(cls,str(x.get('security_class2_desc') or ''),str(x.get('maturity_date') or ''))
              amt=num(x.get('outstanding_amt'))
              if amt>by.get(key,0): by[key]=amt
          raw_bill=sum(num(x.get('outstanding_amt')) for x in rows if 'bill' in str(x.get('security_class1_desc') or '').lower())
          dedup_bill=sum(v for (cls,c,m),v in by.items() if 'bill' in cls.lower())
          dedup_total=sum(by.values())
          rd=dt.date.fromisoformat(latest); cutoff=rd+dt.timedelta(days=365)
          next12=next12bill=0.0; yrs={2027:0.0,2028:0.0}
          for (cls,c,m),v in by.items():
              try: md=dt.date.fromisoformat(m[:10])
              except: continue
              if rd<md<=cutoff:
                  next12+=v
                  if 'bill' in cls.lower(): next12bill+=v
              if md.year in yrs: yrs[md.year]+=v
          print('RAW_BILL_T',raw_bill/1e6)
          print('DEDUP_BILL_T',dedup_bill/1e6)
          print('DEDUP_TOTAL_T',dedup_total/1e6)
          print('NEXT12_T',next12/1e6,'NEXT12_BILL_T',next12bill/1e6,'COUPON_T',(next12-next12bill)/1e6)
          print('YEARS_T',{k:v/1e6 for k,v in yrs.items()})
          u1=BASE+'/mspd/mspd_table_1'
          r=requests.get(u1, params={'sort':'-record_date','page[number]':1,'page[size]':30}, timeout=30); r.raise_for_status(); d=r.json()['data']; l=str(d[0]['record_date'])[:10]
          for x in d:
              if str(x.get('record_date',''))[:10]!=l: continue
              if x.get('security_class_desc')=='Bills' or x.get('security_type_desc')=='Total Marketable':
                  print('TABLE1',x.get('security_type_desc'),x.get('security_class_desc'),float(x.get('total_mil_amt'))/1e6)
          PY
