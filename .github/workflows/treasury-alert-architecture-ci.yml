name: Treasury alert architecture CI

on:
  push:
    paths:
      - "scripts/treasury_auction_final_demand_watch.py"
      - "scripts/treasury_net_liquidity_watch.py"
      - "scripts/treasury_cta_squeeze_watch.py"
      - "scripts/treasury_cta_squeeze_execution_watch.py"
      - "scripts/treasury_cta_squeeze_market_watch.py"
      - "scripts/treasury_cta_squeeze_audited_watch.py"
      - "scripts/treasury_cta_squeeze_equity_watch.py"
      - "scripts/treasury_buyback_policy_watch.py"
      - "scripts/treasury_alert_korean_guard.py"
      - "scripts/yen_carry_policy_equity_enrich.py"
      - "scripts/us_positioning_watch.py"
      - ".github/workflows/treasury-auction-final-demand-telegram-alert.yml"
      - ".github/workflows/treasury-net-liquidity-telegram-alert.yml"
      - ".github/workflows/treasury-alert-architecture-ci.yml"
      - "tests/test_treasury_alert_architecture.py"
      - "tests/test_treasury_cta_nasdaq_squeeze.py"
      - "tests/test_treasury_alert_root_guards.py"
      - "docs/treasury-alert-architecture.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install --quiet beautifulsoup4 pypdf pytest pandas requests playwright lxml
      - name: Compile Treasury watchers
        run: |
          python -m py_compile scripts/treasury_auction_final_demand_watch.py
          python -m py_compile scripts/treasury_net_liquidity_watch.py
          python -m py_compile scripts/treasury_cta_squeeze_watch.py
          python -m py_compile scripts/treasury_cta_squeeze_execution_watch.py
          python -m py_compile scripts/treasury_cta_squeeze_market_watch.py
          python -m py_compile scripts/treasury_cta_squeeze_audited_watch.py
          python -m py_compile scripts/treasury_cta_squeeze_equity_watch.py
          python -m py_compile scripts/treasury_buyback_policy_watch.py
          python -m py_compile scripts/treasury_alert_korean_guard.py
          python -m py_compile scripts/yen_carry_policy_equity_enrich.py
          python -m py_compile scripts/us_positioning_watch.py
      - name: Run architecture and squeeze fail-closed tests
        run: |
          pytest -q tests/test_treasury_alert_architecture.py
          pytest -q tests/test_treasury_cta_nasdaq_squeeze.py
          pytest -q tests/test_treasury_alert_root_guards.py
