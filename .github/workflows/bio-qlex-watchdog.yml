name: Bio QLEX Watchdog

on:
  schedule:
    - cron: "2,32 * * * *"
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: bio-qlex-watchdog
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    env:
      BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
      BIO_TELEGRAM_CHAT_ID: ${{ secrets.BIO_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate heartbeat
        id: hb
        run: |
          python - <<'PY'
          import datetime as dt, json, os, pathlib
          from zoneinfo import ZoneInfo
          p=pathlib.Path('data/bio_watch_heartbeat.json')
          stale=True
          age=99999
          status='missing'
          checked='없음'
          if p.exists():
              try:
                  data=json.loads(p.read_text(encoding='utf-8'))
                  status=str(data.get('status') or 'unknown')
                  checked=str(data.get('checked_at_kst') or '')
                  ts=dt.datetime.fromisoformat(checked)
                  now=dt.datetime.now(ZoneInfo('Asia/Seoul'))
                  age=max(0,int((now-ts.astimezone(ZoneInfo('Asia/Seoul'))).total_seconds()//60))
                  stale=(age>45 or status!='ok')
              except Exception:
                  stale=True
          out=pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a',encoding='utf-8') as f:
              f.write(f'stale={str(stale).lower()}\n')
              f.write(f'age_minutes={age}\n')
              f.write(f'status={status}\n')
              f.write(f'checked_at={checked}\n')
          print(f'bio_heartbeat stale={stale} age_minutes={age} status={status} checked_at={checked}')
          PY

      - name: Dispatch main bio watcher when stale
        if: steps.hb.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run bio-qlex-intismeran-watch.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "바이오 메인 감시 재실행 요청 완료"

      - name: Notify Telegram when recovery is triggered
        if: steps.hb.outputs.stale == 'true'
        continue-on-error: true
        env:
          AGE_MINUTES: ${{ steps.hb.outputs.age_minutes }}
          HB_STATUS: ${{ steps.hb.outputs.status }}
          HB_CHECKED_AT: ${{ steps.hb.outputs.checked_at }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=(os.getenv('BIO_TELEGRAM_BOT_TOKEN') or '').strip()
          chat=(os.getenv('BIO_TELEGRAM_CHAT_ID') or '').strip()
          if not token or not chat:
              raise SystemExit(0)
          text=("[바이오 감시] 자동 복구 실행\n\n"
                f"- 상태: {os.getenv('HB_STATUS')}\n"
                f"- 마지막 정상 확인: {os.getenv('HB_CHECKED_AT')}\n"
                f"- 경과: 약 {os.getenv('AGE_MINUTES')}분\n"
                "- 조치: QLEX·Intismeran 메인 감시를 즉시 다시 실행했습니다.")
          payload=urllib.parse.urlencode({'chat_id':chat,'text':text,'disable_web_page_preview':'true'}).encode()
          req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage',data=payload,method='POST')
          with urllib.request.urlopen(req,timeout=25) as r:
              result=json.loads(r.read().decode('utf-8'))
          if not result.get('ok'):
              raise RuntimeError(result)
          PY

      - name: Daily healthy status
        if: github.event.schedule == '5 0 * * *' && steps.hb.outputs.stale == 'false'
        continue-on-error: true
        env:
          HB_CHECKED_AT: ${{ steps.hb.outputs.checked_at }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=(os.getenv('BIO_TELEGRAM_BOT_TOKEN') or '').strip()
          chat=(os.getenv('BIO_TELEGRAM_CHAT_ID') or '').strip()
          if not token or not chat:
              raise SystemExit(0)
          text=("[바이오 감시] 정상 작동 확인\n\n"
                f"- QLEX·Intismeran 마지막 확인: {os.getenv('HB_CHECKED_AT')}\n"
                "- 상태: 정상\n"
                "- 새 데이터가 없으면 별도 본 알림은 보내지 않습니다.")
          payload=urllib.parse.urlencode({'chat_id':chat,'text':text,'disable_web_page_preview':'true'}).encode()
          req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage',data=payload,method='POST')
          with urllib.request.urlopen(req,timeout=25) as r:
              result=json.loads(r.read().decode('utf-8'))
          if not result.get('ok'):
              raise RuntimeError(result)
          PY