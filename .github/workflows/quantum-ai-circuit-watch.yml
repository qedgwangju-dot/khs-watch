name: Anthropic Harvard Quantum Circuit Milestone Watch
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run source checks and tests, without state write or Telegram'
        type: boolean
        default: true
      send_test:
        description: 'Send exactly one labelled Telegram route test'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/quantum-ai-circuit-watch.yml'
      - 'scripts/quantum_ai_circuit_watch.py'
      - 'tests/test_quantum_ai_circuit_watch.py'
permissions:
  contents: write
  actions: write
concurrency:
  group: quantum-ai-circuit-milestone-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and regression tests
        run: |
          python -m py_compile scripts/quantum_ai_circuit_watch.py
          PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_quantum_ai_circuit_watch.py' -v
      - name: Enable only new schedule on initial push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "/repos/$GITHUB_REPOSITORY/actions/workflows/quantum-ai-circuit-watch.yml/enable"
          echo 'quantum_ai_schedule_enable=confirmed'
      - name: Query independent official sources and classify milestones
        run: python scripts/quantum_ai_circuit_watch.py
      - name: Source and classification status
        if: always()
        run: |
          if [ -f out/quantum_ai_circuit_status.md ]; then
            cat out/quantum_ai_circuit_status.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Telegram test or new source-verified milestone
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.send_test == true) ||
          ((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true && inputs.send_test != true)) &&
            hashFiles('out/quantum_ai_circuit_alert.html') != '')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_AI_POLICY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          IS_MANUAL_TEST: ${{ inputs.send_test }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, pathlib, urllib.request
          from zoneinfo import ZoneInfo
          token=(os.environ.get("TELEGRAM_BOT_TOKEN") or "").strip()
          chat=(os.environ.get("TELEGRAM_CHAT_ID") or "").strip()
          if not token or not chat:
              raise RuntimeError("Existing quantum Telegram route secrets missing")
          url="https://api.telegram.org/bot"+token
          with urllib.request.urlopen(url+"/getMe",timeout=25) as r:
              person=json.load(r)
          username=str((person.get("result") or {}).get("username") or "").lower()
          if not person.get("ok") or username!="khs88798879_bot":
              raise RuntimeError("Existing quantum route bot identity mismatch")
          is_test=os.environ.get("IS_MANUAL_TEST","").lower()=="true"
          if is_test:
              text=("[Anthropic·Harvard 양자회로 최적화] 경로 검증 테스트\n"
                    "기존 양자기술 텔레그램 전송경로 사용.\n"
                    "신규 논문 알림이 아닌 일회성 시험 전송입니다.\n"
                    "별도 기술 감시·원천 조회·중복 차단을 확인했습니다.")
          else:
              text=pathlib.Path("out/quantum_ai_circuit_alert.html").read_text(encoding="utf-8")
          payload={"chat_id":chat,"text":text,"disable_web_page_preview":True}
          if not is_test:
              payload["parse_mode"]="HTML"
          req=urllib.request.Request(url+"/sendMessage",data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=30) as r:
              delivered=json.load(r)
          message_id=(delivered.get("result") or {}).get("message_id")
          if delivered.get("ok") is not True or type(message_id) is not int or message_id<=0:
              raise RuntimeError("Telegram sendMessage acknowledgment missing")
          receipt={"ok":True,"message_id":message_id,"bot":username,
              "at_kst":dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds")}
          path=("out/quantum_ai_circuit_test_receipt.json" if is_test
               else "out/quantum_ai_circuit_delivery.json")
          pathlib.Path(path).write_text(json.dumps(receipt,ensure_ascii=False)+"\n",encoding="utf-8")
          print(("quantum_ai_route_test" if is_test else "quantum_ai_milestone_delivery")+"=confirmed message_id="+str(message_id))
          PY
      - name: Commit state only after acknowledgement or no new event
        if: >-
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true && inputs.send_test != true)) &&
          hashFiles('out/quantum_ai_circuit_pending.json') != '' &&
          (hashFiles('out/quantum_ai_circuit_alert.html') == '' || hashFiles('out/quantum_ai_circuit_delivery.json') != '')
        run: |
          python - <<'PY'
          import json,pathlib
          payload=json.loads(pathlib.Path("out/quantum_ai_circuit_pending.json").read_text(encoding="utf-8"))
          receipt=pathlib.Path("out/quantum_ai_circuit_delivery.json")
          if receipt.exists():
              delivered=json.loads(receipt.read_text(encoding="utf-8"))
              assert delivered.get("ok") is True and type(delivered.get("message_id")) is int
              payload["last_successful_delivery"]=delivered
          target=pathlib.Path("data/quantum_ai_circuit_watch_state.json")
          target.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git config user.name 'quantum-ai-circuit-watch[bot]'
          git config user.email 'quantum-ai-circuit-watch[bot]@users.noreply.github.com'
          git add data/quantum_ai_circuit_watch_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Anthropic quantum circuit source checkpoint'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                echo 'quantum_ai_state_commit=confirmed'
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((3 * attempt))
            done
            echo 'Git state commit failed; source was NOT recorded successfully' >&2
            exit 1
          fi
      - name: Keep source health and delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantum-ai-circuit-${{ github.run_id }}
          path: |
            out/quantum_ai_circuit_status.md
            out/quantum_ai_circuit_pending.json
            out/quantum_ai_circuit_alert.html
            out/quantum_ai_circuit_delivery.json
            out/quantum_ai_circuit_test_receipt.json
          if-no-files-found: ignore
          retention-days: 14
