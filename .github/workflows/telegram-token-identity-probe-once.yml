name: Telegram token identity probe once
# One-time Westinghouse route send verification. Revert to no-send probe after success.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-token-identity-probe-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KHS887900_BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
      KHS_POLICY_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
    steps:
      - name: Verify and send one Westinghouse route test
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = (os.getenv('KHS887900_BOT_TOKEN') or '').strip()
          chat_id = (os.getenv('KHS_POLICY_TELEGRAM_CHAT_ID') or '').strip()
          if not token:
              raise RuntimeError('KHS887900_BOT_TOKEN missing')
          if not chat_id:
              raise RuntimeError('KHS_POLICY_TELEGRAM_CHAT_ID missing')

          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as response:
              identity = json.loads(response.read().decode('utf-8'))
          username = str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or username.lower() != 'khs887900_bot':
              raise RuntimeError(f'Westinghouse bot mismatch: @{username or "unknown"}')

          query = urllib.parse.urlencode({'chat_id': chat_id})
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getChat?{query}', timeout=20) as response:
              chat = json.loads(response.read().decode('utf-8'))
          resolved_chat_id = str((chat.get('result') or {}).get('id') or '')
          if not chat.get('ok') or resolved_chat_id != chat_id:
              raise RuntimeError('Westinghouse Telegram chat mismatch')

          text = '[원전·Westinghouse 알림 경로 점검]\nGitHub Actions → @khs887900_bot 실제 발송 정상화 테스트입니다.'
          data = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': text,
              'disable_web_page_preview': 'true',
          }).encode('utf-8')
          request = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=data,
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              sent = json.loads(response.read().decode('utf-8'))
          result = sent.get('result') or {}
          if not sent.get('ok') or str((result.get('chat') or {}).get('id') or '') != chat_id or not result.get('message_id'):
              raise RuntimeError('Westinghouse Telegram sendMessage was not confirmed')
          print(f'WESTINGHOUSE_TELEGRAM_SEND=OK bot=@{username} message_id={result.get("message_id")}')
          PY
