name: Telegram token identity probe once
# Manual no-send route probe refresh for current production wiring. 2026-09-20 target khs88798879_bot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-token-identity-probe-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HBM_TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
      BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
      GLOBAL_RATES_TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
      GLOBAL_RATES_TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
      BOK_ASSET_TELEGRAM_BOT_TOKEN: ${{ secrets.BOK_ASSET_TELEGRAM_BOT_TOKEN }}
      YEN_CARRY_TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
      CRYPTO_LIQUIDITY_TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_LIQUIDITY_TELEGRAM_BOT_TOKEN }}
      DEEP_FISSION_TELEGRAM_BOT_TOKEN: ${{ secrets.DEEP_FISSION_TELEGRAM_BOT_TOKEN }}
      WAR_PEACE_TELEGRAM_BOT_TOKEN: ${{ secrets.WAR_PEACE_TELEGRAM_BOT_TOKEN }}
      GWANGJU_AIRPORT_TELEGRAM_BOT_TOKEN: ${{ secrets.GWANGJU_AIRPORT_TELEGRAM_BOT_TOKEN }}
      HONAM_TELEGRAM_BOT_TOKEN: ${{ secrets.HONAM_TELEGRAM_BOT_TOKEN }}
      JOBS_WAGE_TELEGRAM_BOT_TOKEN: ${{ secrets.JOBS_WAGE_TELEGRAM_BOT_TOKEN }}
      KHS_POLICY_TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
      KHS_AI_POLICY_TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_AI_POLICY_TELEGRAM_BOT_TOKEN }}
      KHS887900_BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
      KHS887900_CHAT_ID: ${{ secrets.KHS887900_CHAT_ID }}
      KHS_POLICY_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      ENERGY_MIX_TELEGRAM_BOT_TOKEN: ${{ secrets.ENERGY_MIX_TELEGRAM_BOT_TOKEN }}
      KOSPI_DERIV_TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TREASURY_FOREIGN_DEMAND_TELEGRAM_BOT_TOKEN: ${{ secrets.TREASURY_FOREIGN_DEMAND_TELEGRAM_BOT_TOKEN }}
      THIRTEENF_TELEGRAM_BOT_TOKEN: ${{ secrets.THIRTEENF_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout current runtime customization
        uses: actions/checkout@v4

      - name: Verify yen carry global-rates route without sending
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          token=(os.getenv('GLOBAL_RATES_TELEGRAM_BOT_TOKEN') or '').strip()
          chat_id=(os.getenv('GLOBAL_RATES_TELEGRAM_CHAT_ID') or '').strip()
          if not token:
              raise RuntimeError('GLOBAL_RATES_TELEGRAM_BOT_TOKEN missing')
          if not chat_id:
              raise RuntimeError('GLOBAL_RATES_TELEGRAM_CHAT_ID missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              identity=json.loads(r.read().decode('utf-8'))
          username=str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or username.lower() != 'khs8879887988798879_bot':
              raise RuntimeError(f'Global-rates bot mismatch: @{username or "unknown"}')
          query=urllib.parse.urlencode({'chat_id': chat_id})
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getChat?{query}', timeout=20) as r:
              chat=json.loads(r.read().decode('utf-8'))
          if not chat.get('ok') or (chat.get('result') or {}).get('id') is None:
              raise RuntimeError('GLOBAL_RATES_TELEGRAM_CHAT_ID unreachable')
          print(f'YEN_CARRY_GLOBAL_RATES_ROUTE=OK bot=@{username} chat_type={(chat.get("result") or {}).get("type", "unknown")}')
          PY

      - name: Verify dedicated AI policy Telegram route and send one alert
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          token=(os.getenv('KHS_AI_POLICY_TELEGRAM_BOT_TOKEN') or '').strip()
          chat_id=(os.getenv('KHS_POLICY_TELEGRAM_CHAT_ID') or '').strip()
          if not token:
              raise RuntimeError('KHS_AI_POLICY_TELEGRAM_BOT_TOKEN missing')
          if not chat_id:
              raise RuntimeError('KHS_POLICY_TELEGRAM_CHAT_ID missing')

          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              identity=json.loads(r.read().decode('utf-8'))
          username=str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or username.lower() != 'khs88798879_bot':
              raise RuntimeError(f'AI policy bot mismatch: expected @khs88798879_bot got @{username or "unknown"}')

          query=urllib.parse.urlencode({'chat_id': chat_id})
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getChat?{query}', timeout=20) as r:
              chat=json.loads(r.read().decode('utf-8'))
          if not chat.get('ok') or (chat.get('result') or {}).get('id') is None:
              raise RuntimeError('AI policy bot cannot reach policy private chat; send /start to @khs88798879_bot first')

          text=(
              "🚨 미국 AI 정책지휘체계 중요 변화\n\n"
              "트럼프, AI Force 창설·신임 AI 차르 임명 예고\n\n"
              "발표일: 2026년 9월 19일\n"
              "현재 단계: 대통령 발표 단계 — 공식 행정명령·조직도·예산·임명자는 아직 공개되지 않음\n\n"
              "실제 내용\n"
              "• 미국 정부의 AI 정책을 총괄할 새 AI 차르를 임명하겠다고 발표\n"
              "• 우주군을 언급하며 별도의 AI Force 창설 구상 제시\n"
              "• 소속기관·법적 권한·인원·예산·조달권은 아직 미공개\n\n"
              "타임라인\n"
              "• 2026년 9월 19일: AI Force·신임 AI 차르 구상 발표\n"
              "• 2026년 9월 20일: 베선트–허리펑 AI 안보·무역 협의 예정\n"
              "• 2026년 9월 24일: 트럼프–시진핑 정상회담 예정\n\n"
              "왜 중요한가\n"
              "• 사람→조직→권한→예산→정부 AI 조달로 이어질 수 있는 새 정책 지휘체계 신호\n"
              "• 실제 예산·조달이 붙으면 GPU·클라우드·보안 AI·데이터센터 전력 인프라 수요로 연결 가능\n\n"
              "다음 확인\n"
              "• 신임 AI 차르 실명·권한\n"
              "• AI Force 소속·법적 근거\n"
              "• 행정명령·대통령각서\n"
              "• 예산·인원·정부 AI 조달\n"
              "• 미중 AI 협의 결과\n\n"
              "원문: https://www.reuters.com/world/us/trump-says-he-will-create-ai-force-name-ai-czar-2026-09-19/"
          )
          body=urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': text,
              'disable_web_page_preview': 'true',
          }).encode('utf-8')
          req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage',data=body,method='POST')
          with urllib.request.urlopen(req,timeout=20) as r:
              sent=json.loads(r.read().decode('utf-8'))
          if not sent.get('ok'):
              raise RuntimeError(f'Telegram send failed: {sent}')
          message_id=(sent.get('result') or {}).get('message_id')
          if message_id is None:
              raise RuntimeError('Telegram send returned no message_id')
          print(f'AI_POLICY_ROUTE=OK bot=@{username} chat_type={(chat.get("result") or {}).get("type","unknown")} message_id={message_id}')
          PY

      - name: Compare latest khs887900 private chat without sending
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os, urllib.request

          token=(os.getenv('KHS887900_BOT_TOKEN') or '').strip()
          policy_chat=(os.getenv('KHS_POLICY_TELEGRAM_CHAT_ID') or '').strip()
          if not token:
              raise RuntimeError('KHS887900_BOT_TOKEN missing')
          if not policy_chat:
              raise RuntimeError('KHS_POLICY_TELEGRAM_CHAT_ID missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getUpdates?limit=100&timeout=0', timeout=20) as r:
              data=json.loads(r.read().decode('utf-8'))
          if not data.get('ok'):
              raise RuntimeError('Telegram getUpdates failed')
          candidates=[]
          for update in data.get('result') or []:
              msg=update.get('message') or update.get('edited_message') or {}
              chat=msg.get('chat') or {}
              if chat.get('type') != 'private' or chat.get('id') is None:
                  continue
              text=str(msg.get('text') or '')
              candidates.append((int(update.get('update_id') or 0), str(chat['id']), text))
          if not candidates:
              raise RuntimeError('No private Telegram updates found; send /start to @khs887900_bot and rerun')
          start=[row for row in candidates if row[2].startswith('/start')]
          chosen=(start or candidates)[-1]
          print(f'KHS887900_LATEST_TEXT_IS_START={str(chosen[2].startswith("/start")).lower()}')
          print(f'KHS887900_LATEST_CHAT_MATCHES_POLICY_CHAT={str(chosen[1] == policy_chat).lower()}')
          if chosen[1] != policy_chat:
              raise RuntimeError('Latest khs887900 private chat does not match verified policy chat')
          PY

      - name: Resolve bot usernames and compare US investment chat routes without sending
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          import scripts  # Apply the same scoped runtime route hook as production delivery.

          names=[
              k for k in os.environ
              if k.endswith('_TELEGRAM_BOT_TOKEN')
              or k in {'TELEGRAM_BOT_TOKEN', 'KHS887900_BOT_TOKEN'}
          ]
          for name in sorted(names):
              token=(os.getenv(name) or '').strip()
              if not token:
                  print(f'{name}=MISSING')
                  continue
              try:
                  with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
                      data=json.loads(r.read().decode('utf-8'))
                  username=str((data.get('result') or {}).get('username') or '')
                  print(f'{name}=@{username or "UNKNOWN"}')
              except Exception as exc:
                  print(f'{name}=ERROR:{type(exc).__name__}')

          token=(os.getenv('KHS887900_BOT_TOKEN') or '').strip()
          if not token:
              raise RuntimeError('KHS887900_BOT_TOKEN missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              identity=json.loads(r.read().decode('utf-8'))
          username=str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or username.lower() != 'khs887900_bot':
              raise RuntimeError(f'US investment bot mismatch: @{username or "unknown"}')

          def probe_chat(label, env_name):
              chat_id=(os.getenv(env_name) or '').strip()
              if not chat_id:
                  print(f'{label}=MISSING')
                  return False
              try:
                  query=urllib.parse.urlencode({'chat_id': chat_id})
                  with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getChat?{query}', timeout=20) as r:
                      chat=json.loads(r.read().decode('utf-8'))
                  if not chat.get('ok') or (chat.get('result') or {}).get('id') is None:
                      print(f'{label}=UNREACHABLE')
                      return False
                  print(f'{label}=OK bot=@{username} chat_type={(chat.get("result") or {}).get("type", "unknown")}')
                  return True
              except Exception as exc:
                  print(f'{label}=ERROR:{type(exc).__name__}')
                  return False

          dedicated_ok=probe_chat('US_INVESTMENT_DEDICATED_CHAT', 'KHS887900_CHAT_ID')
          policy_ok=probe_chat('US_INVESTMENT_POLICY_CHAT', 'KHS_POLICY_TELEGRAM_CHAT_ID')
          if not dedicated_ok and not policy_ok:
              raise RuntimeError('No reachable US investment chat route')
          PY
