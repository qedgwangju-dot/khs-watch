name: Telegram token identity probe once
# Manual no-send route probe refresh for current production wiring. 2026-09-12 yen-carry check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-token-identity-probe-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HBM_TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
      BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
      GLOBAL_RATES_TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
      GLOBAL_RATES_TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
      BOK_ASSET_TELEGRAM_BOT_TOKEN: ${{ secrets.BOK_ASSET_TELEGRAM_BOT_TOKEN }}
      YEN_CARRY_TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
      CRYPTO_LIQUIDITY_TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_LIQUIDITY_TELEGRAM_BOT_TOKEN }}
      DEEP_FISSION_TELEGRAM_BOT_TOKEN: ${{ secrets.DEEP_FISSION_TELEGRAM_BOT_TOKEN }}
      WAR_PEACE_TELEGRAM_BOT_TOKEN: ${{ secrets.WAR_PEACE_TELEGRAM_BOT_TOKEN }}
      GWANGJU_AIRPORT_TELEGRAM_BOT_TOKEN: ${{ secrets.GWANGJU_AIRPORT_TELEGRAM_BOT_TOKEN }}
      HONAM_TELEGRAM_BOT_TOKEN: ${{ secrets.HONAM_TELEGRAM_BOT_TOKEN }}
      JOBS_WAGE_TELEGRAM_BOT_TOKEN: ${{ secrets.JOBS_WAGE_TELEGRAM_BOT_TOKEN }}
      KHS_POLICY_TELEGRAM_BOT_TOKEN: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
      KHS887900_BOT_TOKEN: ${{ secrets.KHS887900_BOT_TOKEN }}
      KHS887900_CHAT_ID: ${{ secrets.KHS887900_CHAT_ID }}
      KHS_POLICY_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      ENERGY_MIX_TELEGRAM_BOT_TOKEN: ${{ secrets.ENERGY_MIX_TELEGRAM_BOT_TOKEN }}
      KOSPI_DERIV_TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TREASURY_FOREIGN_DEMAND_TELEGRAM_BOT_TOKEN: ${{ secrets.TREASURY_FOREIGN_DEMAND_TELEGRAM_BOT_TOKEN }}
      THIRTEENF_TELEGRAM_BOT_TOKEN: ${{ secrets.THIRTEENF_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout current runtime customization
        uses: actions/checkout@v4

      - name: Resolve bot usernames and verify selected chats without sending
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          import scripts

          names=[
              k for k in os.environ
              if k.endswith('_TELEGRAM_BOT_TOKEN')
              or k in {'TELEGRAM_BOT_TOKEN', 'KHS887900_BOT_TOKEN'}
          ]
          identities={}
          for name in sorted(names):
              token=(os.getenv(name) or '').strip()
              if not token:
                  print(f'{name}=MISSING')
                  continue
              try:
                  with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
                      data=json.loads(r.read().decode('utf-8'))
                  username=str((data.get('result') or {}).get('username') or '')
                  identities[name]=username
                  print(f'{name}=@{username or "UNKNOWN"}')
              except Exception as exc:
                  print(f'{name}=ERROR:{type(exc).__name__}')

          def probe_chat(label, token_env, chat_env, expected_username=None):
              token=(os.getenv(token_env) or '').strip()
              chat_id=(os.getenv(chat_env) or '').strip()
              if not token:
                  print(f'{label}=TOKEN_MISSING')
                  return False
              username=identities.get(token_env, '')
              if expected_username and username.lower() != expected_username.lower():
                  raise RuntimeError(f'{label} bot mismatch: @{username or "unknown"}')
              if not chat_id:
                  print(f'{label}=CHAT_MISSING')
                  return False
              try:
                  query=urllib.parse.urlencode({'chat_id': chat_id})
                  with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getChat?{query}', timeout=20) as r:
                      chat=json.loads(r.read().decode('utf-8'))
                  if not chat.get('ok') or (chat.get('result') or {}).get('id') is None:
                      print(f'{label}=UNREACHABLE')
                      return False
                  print(f'{label}=OK bot=@{username} chat_type={(chat.get("result") or {}).get("type", "unknown")}')
                  return True
              except Exception as exc:
                  print(f'{label}=ERROR:{type(exc).__name__}')
                  return False

          dedicated_ok=probe_chat('US_INVESTMENT_DEDICATED_CHAT', 'KHS887900_BOT_TOKEN', 'KHS887900_CHAT_ID', 'khs887900_bot')
          policy_ok=probe_chat('US_INVESTMENT_POLICY_CHAT', 'KHS887900_BOT_TOKEN', 'KHS_POLICY_TELEGRAM_CHAT_ID', 'khs887900_bot')
          if not dedicated_ok and not policy_ok:
              raise RuntimeError('No reachable US investment chat route')

          yen_ok=probe_chat('YEN_CARRY_NEWS_CHAT', 'GLOBAL_RATES_TELEGRAM_BOT_TOKEN', 'GLOBAL_RATES_TELEGRAM_CHAT_ID')
          if not yen_ok:
              raise RuntimeError('Yen carry news Telegram chat route unavailable')
          PY
