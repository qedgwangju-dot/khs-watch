name: US Fund Flow Telegram Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/us-fund-flow-telegram-watch.yml"
      - "scripts/us_fund_flow_watch.py"
  schedule:
    # KST 21:17, 00:17, 03:17, 06:17 on weekdays; catches ICI Wed/Thu, BofA/LSEG Fri, FINRA monthly updates.
    - cron: "17 12,15,18,21 * * 1-5"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force one report even when source fingerprints are unchanged"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: us-fund-flow-telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_send == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 pandas lxml

      - name: Verify exact Telegram route
        run: |
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "Telegram token missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "Telegram chat id missing"; exit 1; }
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          expected=os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              j=json.loads(r.read().decode())
          actual=str((j.get("result") or {}).get("username") or "")
          if not j.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{actual}")
          PY

      - name: Query US fund flow sources
        run: |
          rm -f out/us_fund_flow_alert.html out/us_fund_flow_status.md out/us_fund_flow_pending_state.json
          python -m py_compile scripts/us_fund_flow_watch.py
          python scripts/us_fund_flow_watch.py
          cat out/us_fund_flow_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Send Telegram update
        if: hashFiles('out/us_fund_flow_alert.html') != ''
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id=os.environ["TELEGRAM_CHAT_ID"].strip()
          expected=os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              ident=json.loads(r.read().decode())
          actual=str((ident.get("result") or {}).get("username") or "")
          if not ident.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          text=pathlib.Path("out/us_fund_flow_alert.html").read_text(encoding="utf-8").strip()
          chunks=[]
          while len(text)>3800:
              cut=text.rfind("\n\n",0,3800)
              if cut<1000: cut=3800
              chunks.append(text[:cut].strip()); text=text[cut:].strip()
          if text: chunks.append(text)
          ids=[]
          for chunk in chunks:
              data=urllib.parse.urlencode({
                  "chat_id":chat_id,"text":chunk,"parse_mode":"HTML","disable_web_page_preview":"true"
              }).encode()
              req=urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage",data=data,method="POST")
              with urllib.request.urlopen(req,timeout=30) as r:
                  j=json.loads(r.read().decode())
              if not j.get("ok"): raise RuntimeError(f"Telegram rejected: {j}")
              ids.append((j.get("result") or {}).get("message_id"))
          print(f"telegram_delivery_confirmed=true bot=@{actual} messages={len(ids)} ids={ids}")
          PY

      - name: Persist state after successful delivery
        if: success() && hashFiles('out/us_fund_flow_pending_state.json') != ''
        run: cp out/us_fund_flow_pending_state.json data/us_fund_flow_state.json

      - name: Commit watcher state
        if: success() && hashFiles('out/us_fund_flow_pending_state.json') != ''
        run: |
          git config user.name "us-fund-flow-watch[bot]"
          git config user.email "us-fund-flow-watch[bot]@users.noreply.github.com"
          cp data/us_fund_flow_state.json /tmp/us_fund_flow_state.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/us_fund_flow_state.json data/us_fund_flow_state.json
            git add data/us_fund_flow_state.json
            if git diff --cached --quiet; then
              echo "US fund flow state unchanged"
              exit 0
            fi
            git commit -m "Update US fund flow watch state"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-fund-flow-watch-${{ github.run_id }}
          path: |
            out/us_fund_flow_status.md
            out/us_fund_flow_alert.html
            out/us_fund_flow_pending_state.json
          if-no-files-found: ignore
          retention-days: 14
