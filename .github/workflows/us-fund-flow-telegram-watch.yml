name: US Fund Flow Telegram Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/us-fund-flow-telegram-watch.yml"
      - "scripts/us_fund_flow_watch.py"
      - "scripts/us_positioning_options_sox_watch.py"
      - "scripts/us_tech_etf_proxy_watch.py"
      - "tests/test_us_tech_etf_proxy_watch.py"
      - "scripts/us_vip_relative_watch.py"
      - "tests/test_us_vip_relative_watch.py"
  schedule:
    - cron: "17 12,15,18,21 * * 1-5"
    # Additional official ETF publication catch-up checks only; no other delivery lanes.
    - cron: "37 23 * * 1-5"
    - cron: "37 0 * * 2-6"
    # Extra official publication checks after U.S. close; tech ETF only.
    - cron: "37 2,4 * * 2-6"
  pull_request:
    paths:
      - "scripts/us_fund_flow_watch.py"
      - "scripts/us_tech_etf_proxy_watch.py"
      - "tests/test_us_tech_etf_proxy_watch.py"
      - "scripts/us_vip_relative_watch.py"
      - "tests/test_us_vip_relative_watch.py"
      - ".github/workflows/us-fund-flow-telegram-watch.yml"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force reports even when source fingerprints are unchanged"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      tech_proxy_validate_only:
        description: "Verify IYW, SOXX and optional EWY official data without Telegram delivery"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: us-fund-flow-telegram-watch
  # Preserve already-running delivery and FIFO pending source checks.
  # The default single pending slot can otherwise silently drop bursts of runs.
  cancel-in-progress: false
  queue: max

jobs:
  offline-regressions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test proprietary-report gate offline without secrets or Telegram
        run: |
          python -m py_compile scripts/us_fund_flow_watch.py
          python - <<'PY'
          import ast, re
          from datetime import date, datetime
          from email.utils import parsedate_to_datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          tree=ast.parse(Path("scripts/us_fund_flow_watch.py").read_text(encoding="utf-8"))
          functions=[x for x in tree.body if isinstance(x,ast.FunctionDef) and x.name in
                     ("goldman_prime_public_article","parse_goldman_prime_public")]
          assert len(functions)==2, "Goldman functions missing"
          a=ast.Module(body=functions,type_ignores=[])
          ast.fix_missing_locations(a)
          class FixedClock:
              instant=datetime(2026,10,20)
              @staticmethod
              def now(tz):
                  return FixedClock.instant.replace(tzinfo=tz)
              @staticmethod
              def strptime(value,pattern):
                  return datetime.strptime(value,pattern)
          investing=("Goldman Sachs prime desk found hedge funds cut technology stock positions "
                     "in five trading sessions through Oct. 15. Net allocation to the sector stands "
                     "at 23.5% of the global prime book. Their net leverage fell to a one-year low of 48.6%.")
          hedgeweek=("Goldman Sachs prime brokerage hedge funds reduced technology sector positions "
                     "during the five trading sessions to 15 October. The sector accounts for 23.5% "
                     "of Goldman's global prime brokerage book. Net leverage fell to a one-year low of 48.6%.")
          evidence={"investing.com":investing,"hedgeweek.com":hedgeweek}
          def extract(u):
              for k,v in evidence.items():
                  if k in u:return u,v
              return u,""
          scope=dict(re=re,date=date,datetime=FixedClock,ZoneInfo=ZoneInfo,
                     parsedate_to_datetime=parsedate_to_datetime,
                     GOLDMAN_PRIME_SEARCH="Goldman Sachs prime broker",
                     news_items=lambda q:[],extract_article_body=extract)
          exec(compile(a,"scripts/us_fund_flow_watch.py","exec"),scope)
          parse=scope["goldman_prime_public_article"]
          assert parse(investing,date(2026,10,19))==(date(2026,10,15),23.5,48.6)
          assert parse(hedgeweek,date(2026,10,20))==(date(2026,10,15),23.5,48.6)
          tokenpost=("Goldman Sachs prime brokerage hedge funds cut technology positions over five "
                     "trading sessions through Oct. 15. Technology held a 23.5% net allocation "
                     "in Goldman's prime brokerage book. Hedge fund net leverage fell to 48.6%.")
          primexbt=("Hedge funds cut technology stock positions in the five trading sessions "
                     "through Oct. 15, according to Goldman Sachs prime desk data. "
                     "Net allocation to the sector stands at 23.5% of the global Prime book. "
                     "Their net leverage fell to a one-year low of 48.6%.")
          assert parse(tokenpost,date(2026,10,19))==(date(2026,10,15),23.5,48.6)
          assert parse(primexbt,date(2026,10,19))==(date(2026,10,15),23.5,48.6)
          assert parse(investing.replace("Oct. 15","Oct. 22"),date(2026,10,19)) is None
          assert parse(investing.replace("prime desk","equity desk").replace("prime book","equity book"),date(2026,10,19)) is None
          assert parse(investing.replace("five trading sessions through Oct. 15","last week"),
                       date(2026,10,19)) is None
          result=scope["parse_goldman_prime_public"]()
          assert result is not None and result["kind"]=="goldman_prime"
          assert result["reference_week"]=="2026-10-15" and result["metrics"]=={
              "tech_net_allocation_pct":23.5,"net_leverage_pct":48.6}
          evidence["hedgeweek.com"]=hedgeweek.replace("48.6%","47.6%")
          assert scope["parse_goldman_prime_public"]() is None, "Divergent publishers must withhold alert"
          evidence["hedgeweek.com"]=hedgeweek.replace("five trading sessions to 15 October","last week")
          assert scope["parse_goldman_prime_public"]() is None, "Unverifiable observation date must withhold"
          # Regression: future months, annual rollover and stale report years.
          november=investing.replace("Oct. 15","Nov. 16")
          assert parse(november,date(2026,11,19))==(date(2026,11,16),23.5,48.6)
          december=investing.replace("Oct. 15","Dec. 29")
          assert parse(december,date(2027,1,4))==(date(2026,12,29),23.5,48.6)
          explicit_stale=investing.replace("Oct. 15","Oct. 15, 2025")
          assert parse(explicit_stale,date(2026,10,19)) is None
          # New October report appears while legacy 10/15 seed links are still
          # within the 14-day window; newer reports must take precedence.
          evidence["hedgeweek.com"]=hedgeweek
          new_text=("Goldman Sachs prime desk reported hedge funds cut technology stock positions "
                    "in five trading sessions through Oct. 23. Net allocation to the sector "
                    "stands at 21.2% of Goldman's global prime book. Their net leverage fell "
                    "to 43.8%.")
          def updated_extract(u):
              if "/new-positioning-20261023" in u: return u,new_text
              return extract(u)
          scope["extract_article_body"]=updated_extract
          scope["news_items"]=lambda q:[
              {"title":"Goldman hedge funds cut technology stocks again",
               "link":"https://www.investing.com/news/new-positioning-20261023",
               "pub":"Sun, 25 Oct 2026"},
              {"title":"Goldman hedge funds cut technology stocks again",
               "link":"https://hedgeweek.com/news/new-positioning-20261023",
               "pub":"Sun, 25 Oct 2026"},
          ]
          FixedClock.instant=datetime(2026,10,26)
          newer=scope["parse_goldman_prime_public"]()
          assert newer is not None and newer["reference_week"]=="2026-10-23"
          assert newer["metrics"]=={"tech_net_allocation_pct":21.2,"net_leverage_pct":43.8}
          assert len(newer["crosschecked_sources"])==2
          print("goldman_prime_regressions=passed dynamic_newer_week_and_month_rollover=true")

          PY

      - name: Regress public IYW SOXX proxy without bot secrets or sending
        run: |
          python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
          python -m py_compile scripts/us_tech_etf_proxy_watch.py
          PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_us_tech_etf_proxy_watch.py' -v

      - name: Regress public GVIP versus SPY 75-session relative performance offline
        run: |
          python -m py_compile scripts/us_vip_relative_watch.py
          PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_us_vip_relative_watch.py' -v

      - name: Diagnose public article access (read-only; no Telegram; no secrets)
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          sources={
            "investing":"https://www.investing.com/news/stock-market-news/hedge-funds-cut-tech-stocks-at-record-pace-goldman-says-4958101",
            "hedgeweek":"https://hedgeweek.com/news/hedge-funds-slash-tech-exposure-at-fastest-pace-in-a-decade",
            "tokenpost":"https://www.tokenpost.com/news/investing/35230",
            "primexbt":"https://primexbt.com/news/hedge-funds-cut-tech-stocks-at-the-fastest-pace-in-at-least-a-decade-goldman-dat/",
            "briefs":"https://www.briefs.co/news/hedge-funds-dump-tech-at-the-fastest-pace-since-2016-goldman/",
            "gmteight":"https://gmteight.com/flash/detail/1563275",
          }
          for name,url in sources.items():
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"en-US"})
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      b=resp.read(1000000).decode("utf-8",errors="replace")
                      print(f"source_probe={name} code={resp.status} len={len(b)} goldman={bool('Goldman' in b)} tech_235={bool('23.5' in b)} leverage_486={bool('48.6' in b)} oct15={bool('Oct. 15' in b or '15 October' in b)}")
              except Exception as e:
                  print(f"source_probe={name} error={type(e).__name__} note={str(e)[:90]}")
          PY

  watch:
    # Suppress unrelated US fund-flow delivery during tech ETF integration-only pushes.
    if: >-
      github.event_name != 'pull_request' &&
      !contains(github.event.head_commit.message, '[tech-etf-proxy-validate]') &&
      !(github.event_name == 'schedule' &&
        (github.event.schedule == '37 23 * * 1-5' ||
         github.event.schedule == '37 0 * * 2-6' ||
         github.event.schedule == '37 2,4 * * 2-6'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_send == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Workflow runs queued for minutes must read the latest delivered
          # fingerprints, not the older push event's frozen commit snapshot.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 pandas lxml playwright

      - name: Verify exact Telegram route
        run: |
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "Telegram token missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "Telegram chat id missing"; exit 1; }
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          expected=os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              j=json.loads(r.read().decode())
          actual=str((j.get("result") or {}).get("username") or "")
          if not j.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{actual}")
          PY

      - name: Query US fund flow sources
        run: |
          rm -f out/us_fund_flow_alert.html out/us_fund_flow_status.md out/us_fund_flow_pending_state.json
          python -m py_compile scripts/us_fund_flow_watch.py
          python scripts/us_fund_flow_watch.py
          cat out/us_fund_flow_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Query positioning options and SOX
        run: |
          rm -f out/us_positioning_options_sox_alert.html out/us_positioning_options_sox_status.md out/us_positioning_options_sox_pending_state.json
          python -m py_compile scripts/us_positioning_options_sox_watch.py
          if timeout 180s python scripts/us_positioning_options_sox_watch.py; then
            if [ -f out/us_positioning_options_sox_status.md ]; then
              cat out/us_positioning_options_sox_status.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Options/SOX lane unavailable or timed out. US fund-flow alert remains independent."
            echo "Options/SOX delayed; only fully checked fund-flow data may be sent." >> "$GITHUB_STEP_SUMMARY"
            rm -f out/us_positioning_options_sox_alert.html out/us_positioning_options_sox_pending_state.json
          fi

      - name: Recheck committed state before sending
        run: |
          # A source check may have started before another run committed delivery.
          # Compare pending semantic fingerprints against the freshest remote state.
          git fetch --quiet origin main
          python - <<'PY'
          import json, os, pathlib, subprocess
          if (os.getenv("FORCE_SEND") or "").lower() in ("true", "1", "yes"):
              print("pre_send_dedup_bypassed_by_explicit_force=true")
          else:
              alert = pathlib.Path("out/us_fund_flow_alert.html")
              pending = pathlib.Path("out/us_fund_flow_pending_state.json")
              if alert.exists() and pending.exists():
                  raw = subprocess.run(
                      ["git", "show", "origin/main:data/us_fund_flow_state.json"],
                      capture_output=True, text=True, check=True,
                  )
                  committed = json.loads(raw.stdout)
                  candidate = json.loads(pending.read_text(encoding="utf-8"))
                  for obj in (committed, candidate):
                      if not isinstance(obj, dict) or not isinstance(obj.get("seen"), dict):
                          raise RuntimeError("Invalid fund-flow state during pre-send verification")
                  if (
                      candidate.get("seen") == committed.get("seen")
                      and candidate.get("derived", {}) == committed.get("derived", {})
                  ):
                      alert.unlink()
                      pending.unlink()
                      print("pre_send_duplicate_blocked=true reason=same_committed_source_fingerprints_and_derived")
                  else:
                      print("pre_send_duplicate_blocked=false reason=new_verified_semantic_change")
          PY

      - name: Send Telegram updates
        if: hashFiles('out/us_fund_flow_alert.html') != '' || hashFiles('out/us_positioning_options_sox_alert.html') != ''
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id=os.environ["TELEGRAM_CHAT_ID"].strip()
          expected=os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              ident=json.loads(r.read().decode())
          actual=str((ident.get("result") or {}).get("username") or "")
          if not ident.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")

          files = [
              pathlib.Path("out/us_fund_flow_alert.html"),
              pathlib.Path("out/us_positioning_options_sox_alert.html"),
          ]
          ids=[]
          for path in files:
              if not path.exists():
                  continue
              text=path.read_text(encoding="utf-8").strip()
              chunks=[]
              while len(text)>3800:
                  cut=text.rfind("\n\n",0,3800)
                  if cut<1000:
                      cut=3800
                  chunks.append(text[:cut].strip())
                  text=text[cut:].strip()
              if text:
                  chunks.append(text)
              for chunk in chunks:
                  data=urllib.parse.urlencode({
                      "chat_id":chat_id,
                      "text":chunk,
                      "parse_mode":"HTML",
                      "disable_web_page_preview":"true",
                  }).encode()
                  req=urllib.request.Request(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data=data,
                      method="POST",
                  )
                  with urllib.request.urlopen(req,timeout=30) as r:
                      j=json.loads(r.read().decode())
                  if not j.get("ok"):
                      raise RuntimeError(f"Telegram rejected: {j}")
                  result = j.get("result") or {}
                  message_id = result.get("message_id")
                  if not isinstance(message_id, int) or message_id <= 0:
                      raise RuntimeError("Telegram API did not return a valid message_id; state must not advance")
                  if chat_id.lstrip("-").isdigit() and int(chat_id) != (result.get("chat") or {}).get("id"):
                      raise RuntimeError("Telegram acknowledged the wrong destination chat; state must not advance")
                  ids.append(message_id)
          if any(path.exists() for path in files) and not ids:
              raise RuntimeError("Alert file exists, but no Telegram message was acknowledged")
          print(f"telegram_delivery_confirmed=true bot=@{actual} messages={len(ids)} ids={ids}")
          PY

      - name: Persist states after successful delivery
        if: success()
        run: |
          if [ -f out/us_fund_flow_pending_state.json ]; then
            cp out/us_fund_flow_pending_state.json data/us_fund_flow_state.json
          fi
          if [ -f out/us_positioning_options_sox_pending_state.json ]; then
            cp out/us_positioning_options_sox_pending_state.json data/us_positioning_options_sox_state.json
          fi

      - name: Commit watcher states
        if: success() && (hashFiles('out/us_fund_flow_pending_state.json') != '' || hashFiles('out/us_positioning_options_sox_pending_state.json') != '')
        run: |
          git config user.name "us-market-watch[bot]"
          git config user.email "us-market-watch[bot]@users.noreply.github.com"

          mkdir -p /tmp/us-watch-state
          if [ -f data/us_fund_flow_state.json ]; then
            cp data/us_fund_flow_state.json /tmp/us-watch-state/us_fund_flow_state.json
          fi
          if [ -f data/us_positioning_options_sox_state.json ]; then
            cp data/us_positioning_options_sox_state.json /tmp/us-watch-state/us_positioning_options_sox_state.json
          fi

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data

            if [ -f /tmp/us-watch-state/us_fund_flow_state.json ]; then
              cp /tmp/us-watch-state/us_fund_flow_state.json data/us_fund_flow_state.json
            fi
            if [ -f /tmp/us-watch-state/us_positioning_options_sox_state.json ]; then
              cp /tmp/us-watch-state/us_positioning_options_sox_state.json data/us_positioning_options_sox_state.json
            fi

            # Stage each optional state file separately. A missing second file must not
            # make git add fail and silently drop the first state update.
            if [ -f data/us_fund_flow_state.json ]; then
              git add data/us_fund_flow_state.json
            fi
            if [ -f data/us_positioning_options_sox_state.json ]; then
              git add data/us_positioning_options_sox_state.json
            fi
            if git diff --cached --quiet; then
              echo "US market watcher states unchanged"
              exit 0
            fi
            git commit -m "Update US market watcher states"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-market-watch-${{ github.run_id }}
          path: |
            out/us_fund_flow_status.md
            out/us_fund_flow_alert.html
            out/us_fund_flow_pending_state.json
            out/us_positioning_options_sox_status.md
            out/us_positioning_options_sox_alert.html
            out/us_positioning_options_sox_pending_state.json
          if-no-files-found: ignore
          retention-days: 14

  tech-etf-proxy:
    if: >-
      ${{
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' &&
         contains(github.event.head_commit.message, '[tech-etf-proxy-validate]'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TECH_ETF_PROXY_VALIDATE_ONLY: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tech_proxy_validate_only)) && '1' || '0' }}

    steps:
      - name: Checkout shared US fund-flow deployment and delivery state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install official ETF reader dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4

      - name: Verify correct existing U.S. fund-flow bot (read-only)
        run: |
          python - <<'PY'
          import os, json, urllib.request
          token=(os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat=(os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected="khs887900887900008879_bot"
          if not token or not chat:
              raise RuntimeError("US fund-flow Telegram secrets missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=20) as r:
              payload=json.load(r)
          actual=(payload.get("result") or {}).get("username")
          if not payload.get("ok") or actual != expected:
              raise RuntimeError("Wrong Telegram bot attached to public tech ETF proxy")
          print(f"us_tech_etf_proxy_bot_verified=true bot=@{actual} chat_id_present=true telegram_sent=false")
          PY

      - name: Check tech ETF data, split, dates, and Telegram receipt invariants
        run: |
          python -m py_compile scripts/us_tech_etf_proxy_watch.py
          PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_us_tech_etf_proxy_watch.py' -v

      - name: Collect ETF shares and conditionally alert through existing bot
        run: |
          set -o pipefail
          mkdir -p out
          rm -f out/us_tech_etf_proxy_run.log out/us_tech_etf_proxy_candidate.html out/us_tech_etf_proxy_receipt.json
          PYTHONPATH=scripts python scripts/us_tech_etf_proxy_watch.py | tee out/us_tech_etf_proxy_run.log
          if grep -q '"status": "source_withheld"' out/us_tech_etf_proxy_run.log || grep -q '"status": "fx_withheld"' out/us_tech_etf_proxy_run.log; then
            echo "::warning::Official tech ETF data or currency verification unavailable. No Telegram sent."
            exit 1
          elif grep -q '"status": "sent"' out/us_tech_etf_proxy_run.log; then
            echo "미 기술주 ETF 발행좌수 경보 전송 · Telegram message_id는 확인증 참조" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '"status": "publication_pending"' out/us_tech_etf_proxy_run.log; then
            echo "::warning::iShares 최신 미국 거래일 자료 게시 대기. 이전 기준일로 설정·환매 재계산 및 Telegram 중복 발송 금지."
            grep 'us_tech_etf_proxy_status=' out/us_tech_etf_proxy_run.log >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '"status": "validated"' out/us_tech_etf_proxy_run.log; then
            echo "IYW·SOXX 및 EWY(가용 시) 공식 설정·환매 검증 · Telegram 미전송" >> "$GITHUB_STEP_SUMMARY"
          elif grep -Eq '"status": "(baseline_or_no_signal|duplicate_suppressed)"' out/us_tech_etf_proxy_run.log; then
            echo "초기 기준점만 저장하거나 조건 미충족·중복 발송 차단" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Tech ETF reader terminated without auditable disposition"
            exit 1
          fi

      - name: Commit separate tech ETF baseline or confirmed alert
        if: success()
        run: |
          if [ ! -f data/us_tech_etf_proxy_state.json ]; then
            echo "검증 모드·조회 실패·중복으로 별도 상태 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us_tech_etf_proxy_state.json
          if git diff --cached --quiet; then
            echo "기존 상태와 동일"
            exit 0
          fi
          git commit -m "Update verified technology ETF creations proxy baseline"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Preserve validation and Telegram receipt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-tech-etf-proxy-${{ github.run_id }}
          path: |
            out/us_tech_etf_proxy_run.log
            out/us_tech_etf_proxy_candidate.html
            out/us_tech_etf_proxy_receipt.json
            data/us_tech_etf_proxy_state.json
          if-no-files-found: ignore
          retention-days: 14

  vip-relative-proxy:
    if: >-
      ${{
        (github.event_name == 'schedule' &&
         github.event.schedule != '37 23 * * 1-5' &&
         github.event.schedule != '37 0 * * 2-6' &&
         github.event.schedule != '37 2,4 * * 2-6') ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' &&
         contains(github.event.head_commit.message, '[tech-etf-proxy-validate]'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      GVIP_RELATIVE_VALIDATE_ONLY: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tech_proxy_validate_only)) && '1' || '0' }}

    steps:
      - name: Checkout official Nasdaq comparison and last delivery receipt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install official Nasdaq reader
        run: python -m pip install --disable-pip-version-check --quiet requests

      - name: Validate GVIP relative-price and safe delivery contracts
        run: |
          python -m py_compile scripts/us_vip_relative_watch.py
          PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_us_vip_relative_watch.py' -v

      - name: Evaluate independent GVIP SPY 75-trading-session relative proxy
        run: |
          set -o pipefail
          mkdir -p out
          rm -f out/us_vip_relative_runtime.log out/us_vip_relative_candidate.html out/us_vip_relative_receipt.json
          PYTHONPATH=scripts python scripts/us_vip_relative_watch.py | tee out/us_vip_relative_runtime.log
          if grep -q '"status": "source_withheld"' out/us_vip_relative_runtime.log; then
            echo "::warning::GVIP/SPY official source missing or inconsistent; no Telegram sent."
            exit 1
          elif grep -q '"status": "publication_pending"' out/us_vip_relative_runtime.log; then
            echo "::warning::GVIP/SPY 공식 종가 비동기 게시 대기; Telegram 미전송·상태 유지."
            grep 'gvip_relative_status=' out/us_vip_relative_runtime.log >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '"status": "validated"' out/us_vip_relative_runtime.log; then
            echo "GVIP/SPY 75거래일 공식 종가 비교 성공 · 테스트 Telegram 미전송" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '"status": "sent"' out/us_vip_relative_runtime.log; then
            test -f out/us_vip_relative_receipt.json || { echo "::error::Confirmed receipt missing"; exit 1; }
            echo "GVIP/SPY 상대성과 경보 · Telegram message_id 확인증 기록" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '"status": "baseline_or_no_change"' out/us_vip_relative_runtime.log; then
            echo "GVIP/SPY 75거래일 공식값 확인 · 신규 악화·완화 구간 없음" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::GVIP signal exited without auditable status"
            exit 1
          fi

      - name: Commit GVIP observation or acknowledged send only
        if: success()
        run: |
          if [ ! -f data/us_vip_relative_state.json ]; then
            echo "GVIP 검증 모드 또는 원천 오류: 운영 상태 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/us_vip_relative_state.json /tmp/us_vip_relative_state.json
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --hard origin/main
            cp /tmp/us_vip_relative_state.json data/us_vip_relative_state.json
            git add data/us_vip_relative_state.json
            if git diff --cached --quiet; then
              echo "GVIP 상태 실질 변경 없음"
              exit 0
            fi
            git commit -m "Save verified GVIP relative price observation and Telegram receipt"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload public VIP proxy verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-gvip-relative-${{ github.run_id }}
          path: |
            out/us_vip_relative_runtime.log
            out/us_vip_relative_candidate.html
            out/us_vip_relative_receipt.json
            data/us_vip_relative_state.json
          if-no-files-found: ignore
          retention-days: 14
