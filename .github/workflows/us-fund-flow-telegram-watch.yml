name: US Fund Flow Telegram Watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/us-fund-flow-telegram-watch.yml"
      - "scripts/us_fund_flow_watch.py"
      - "scripts/us_positioning_options_sox_watch.py"
  schedule:
    - cron: "17 12,15,18,21 * * 1-5"
  pull_request:
    paths:
      - "scripts/us_fund_flow_watch.py"
      - ".github/workflows/us-fund-flow-telegram-watch.yml"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force reports even when source fingerprints are unchanged"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: us-fund-flow-telegram-watch
  # Preserve already-running delivery and FIFO pending source checks.
  # The default single pending slot can otherwise silently drop bursts of runs.
  cancel-in-progress: false
  queue: max

jobs:
  offline-regressions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test proprietary-report gate offline without secrets or Telegram
        run: |
          python -m py_compile scripts/us_fund_flow_watch.py
          python - <<'PY'
          import ast, re
          from datetime import date, datetime
          from email.utils import parsedate_to_datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          tree=ast.parse(Path("scripts/us_fund_flow_watch.py").read_text(encoding="utf-8"))
          functions=[x for x in tree.body if isinstance(x,ast.FunctionDef) and x.name in
                     ("goldman_prime_public_article","parse_goldman_prime_public")]
          assert len(functions)==2, "Goldman functions missing"
          a=ast.Module(body=functions,type_ignores=[])
          ast.fix_missing_locations(a)
          class FixedClock:
              @staticmethod
              def now(tz):
                  return datetime(2026,10,20,tzinfo=tz)
          investing=("Goldman Sachs prime desk found hedge funds cut technology stock positions "
                     "in five trading sessions through Oct. 15. Net allocation to the sector stands "
                     "at 23.5% of the global prime book. Their net leverage fell to a one-year low of 48.6%.")
          hedgeweek=("Goldman Sachs prime brokerage hedge funds reduced technology sector positions "
                     "during the five trading sessions to 15 October. The sector accounts for 23.5% "
                     "of Goldman's global prime brokerage book. Net leverage fell to a one-year low of 48.6%.")
          evidence={"investing.com":investing,"hedgeweek.com":hedgeweek}
          def extract(u):
              for k,v in evidence.items():
                  if k in u:return u,v
              return u,""
          scope=dict(re=re,date=date,datetime=FixedClock,ZoneInfo=ZoneInfo,
                     parsedate_to_datetime=parsedate_to_datetime,
                     GOLDMAN_PRIME_SEARCH="Goldman Sachs prime broker",
                     news_items=lambda q:[],extract_article_body=extract)
          exec(compile(a,"scripts/us_fund_flow_watch.py","exec"),scope)
          parse=scope["goldman_prime_public_article"]
          assert parse(investing,date(2026,10,19))==(date(2026,10,15),23.5,48.6)
          assert parse(hedgeweek,date(2026,10,20))==(date(2026,10,15),23.5,48.6)
          assert parse(investing.replace("Oct. 15","Oct. 22"),date(2026,10,19)) is None
          assert parse(investing.replace("prime desk","equity desk").replace("prime book","equity book"),date(2026,10,19)) is None
          assert parse(investing.replace("five trading sessions through Oct. 15","last week"),
                       date(2026,10,19)) is None
          result=scope["parse_goldman_prime_public"]()
          assert result is not None and result["kind"]=="goldman_prime"
          assert result["reference_week"]=="2026-10-15" and result["metrics"]=={
              "tech_net_allocation_pct":23.5,"net_leverage_pct":48.6}
          evidence["hedgeweek.com"]=hedgeweek.replace("48.6%","47.6%")
          assert scope["parse_goldman_prime_public"]() is None, "Divergent publishers must withhold alert"
          evidence["hedgeweek.com"]=hedgeweek.replace("five trading sessions to 15 October","last week")
          assert scope["parse_goldman_prime_public"]() is None, "Unverifiable observation date must withhold"
          print("goldman_prime_regressions=passed synthetic_two_publisher_gate=true")
          PY

  watch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887900887900008879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_send == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Workflow runs queued for minutes must read the latest delivered
          # fingerprints, not the older push event's frozen commit snapshot.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 pandas lxml playwright

      - name: Verify exact Telegram route
        run: |
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "Telegram token missing"; exit 1; }
          test -n "${TELEGRAM_CHAT_ID:-}" || { echo "Telegram chat id missing"; exit 1; }
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          expected=os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              j=json.loads(r.read().decode())
          actual=str((j.get("result") or {}).get("username") or "")
          if not j.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{actual}")
          PY

      - name: Query US fund flow sources
        run: |
          rm -f out/us_fund_flow_alert.html out/us_fund_flow_status.md out/us_fund_flow_pending_state.json
          python -m py_compile scripts/us_fund_flow_watch.py
          python scripts/us_fund_flow_watch.py
          cat out/us_fund_flow_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Query positioning options and SOX
        run: |
          rm -f out/us_positioning_options_sox_alert.html out/us_positioning_options_sox_status.md out/us_positioning_options_sox_pending_state.json
          python -m py_compile scripts/us_positioning_options_sox_watch.py
          if timeout 180s python scripts/us_positioning_options_sox_watch.py; then
            if [ -f out/us_positioning_options_sox_status.md ]; then
              cat out/us_positioning_options_sox_status.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Options/SOX lane unavailable or timed out. US fund-flow alert remains independent."
            echo "Options/SOX delayed; only fully checked fund-flow data may be sent." >> "$GITHUB_STEP_SUMMARY"
            rm -f out/us_positioning_options_sox_alert.html out/us_positioning_options_sox_pending_state.json
          fi

      - name: Recheck committed state before sending
        run: |
          # A source check may have started before another run committed delivery.
          # Compare pending semantic fingerprints against the freshest remote state.
          git fetch --quiet origin main
          python - <<'PY'
          import json, os, pathlib, subprocess
          if (os.getenv("FORCE_SEND") or "").lower() in ("true", "1", "yes"):
              print("pre_send_dedup_bypassed_by_explicit_force=true")
          else:
              alert = pathlib.Path("out/us_fund_flow_alert.html")
              pending = pathlib.Path("out/us_fund_flow_pending_state.json")
              if alert.exists() and pending.exists():
                  raw = subprocess.run(
                      ["git", "show", "origin/main:data/us_fund_flow_state.json"],
                      capture_output=True, text=True, check=True,
                  )
                  committed = json.loads(raw.stdout)
                  candidate = json.loads(pending.read_text(encoding="utf-8"))
                  for obj in (committed, candidate):
                      if not isinstance(obj, dict) or not isinstance(obj.get("seen"), dict):
                          raise RuntimeError("Invalid fund-flow state during pre-send verification")
                  if (
                      candidate.get("seen") == committed.get("seen")
                      and candidate.get("derived", {}) == committed.get("derived", {})
                  ):
                      alert.unlink()
                      pending.unlink()
                      print("pre_send_duplicate_blocked=true reason=same_committed_source_fingerprints_and_derived")
                  else:
                      print("pre_send_duplicate_blocked=false reason=new_verified_semantic_change")
          PY

      - name: Send Telegram updates
        if: hashFiles('out/us_fund_flow_alert.html') != '' || hashFiles('out/us_positioning_options_sox_alert.html') != ''
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id=os.environ["TELEGRAM_CHAT_ID"].strip()
          expected=os.environ["EXPECTED_TELEGRAM_BOT_USERNAME"].strip().lstrip("@")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              ident=json.loads(r.read().decode())
          actual=str((ident.get("result") or {}).get("username") or "")
          if not ident.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{actual or 'unknown'}")

          files = [
              pathlib.Path("out/us_fund_flow_alert.html"),
              pathlib.Path("out/us_positioning_options_sox_alert.html"),
          ]
          ids=[]
          for path in files:
              if not path.exists():
                  continue
              text=path.read_text(encoding="utf-8").strip()
              chunks=[]
              while len(text)>3800:
                  cut=text.rfind("\n\n",0,3800)
                  if cut<1000:
                      cut=3800
                  chunks.append(text[:cut].strip())
                  text=text[cut:].strip()
              if text:
                  chunks.append(text)
              for chunk in chunks:
                  data=urllib.parse.urlencode({
                      "chat_id":chat_id,
                      "text":chunk,
                      "parse_mode":"HTML",
                      "disable_web_page_preview":"true",
                  }).encode()
                  req=urllib.request.Request(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data=data,
                      method="POST",
                  )
                  with urllib.request.urlopen(req,timeout=30) as r:
                      j=json.loads(r.read().decode())
                  if not j.get("ok"):
                      raise RuntimeError(f"Telegram rejected: {j}")
                  result = j.get("result") or {}
                  message_id = result.get("message_id")
                  if not isinstance(message_id, int) or message_id <= 0:
                      raise RuntimeError("Telegram API did not return a valid message_id; state must not advance")
                  if chat_id.lstrip("-").isdigit() and int(chat_id) != (result.get("chat") or {}).get("id"):
                      raise RuntimeError("Telegram acknowledged the wrong destination chat; state must not advance")
                  ids.append(message_id)
          if any(path.exists() for path in files) and not ids:
              raise RuntimeError("Alert file exists, but no Telegram message was acknowledged")
          print(f"telegram_delivery_confirmed=true bot=@{actual} messages={len(ids)} ids={ids}")
          PY

      - name: Persist states after successful delivery
        if: success()
        run: |
          if [ -f out/us_fund_flow_pending_state.json ]; then
            cp out/us_fund_flow_pending_state.json data/us_fund_flow_state.json
          fi
          if [ -f out/us_positioning_options_sox_pending_state.json ]; then
            cp out/us_positioning_options_sox_pending_state.json data/us_positioning_options_sox_state.json
          fi

      - name: Commit watcher states
        if: success() && (hashFiles('out/us_fund_flow_pending_state.json') != '' || hashFiles('out/us_positioning_options_sox_pending_state.json') != '')
        run: |
          git config user.name "us-market-watch[bot]"
          git config user.email "us-market-watch[bot]@users.noreply.github.com"

          mkdir -p /tmp/us-watch-state
          if [ -f data/us_fund_flow_state.json ]; then
            cp data/us_fund_flow_state.json /tmp/us-watch-state/us_fund_flow_state.json
          fi
          if [ -f data/us_positioning_options_sox_state.json ]; then
            cp data/us_positioning_options_sox_state.json /tmp/us-watch-state/us_positioning_options_sox_state.json
          fi

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data

            if [ -f /tmp/us-watch-state/us_fund_flow_state.json ]; then
              cp /tmp/us-watch-state/us_fund_flow_state.json data/us_fund_flow_state.json
            fi
            if [ -f /tmp/us-watch-state/us_positioning_options_sox_state.json ]; then
              cp /tmp/us-watch-state/us_positioning_options_sox_state.json data/us_positioning_options_sox_state.json
            fi

            # Stage each optional state file separately. A missing second file must not
            # make git add fail and silently drop the first state update.
            if [ -f data/us_fund_flow_state.json ]; then
              git add data/us_fund_flow_state.json
            fi
            if [ -f data/us_positioning_options_sox_state.json ]; then
              git add data/us_positioning_options_sox_state.json
            fi
            if git diff --cached --quiet; then
              echo "US market watcher states unchanged"
              exit 0
            fi
            git commit -m "Update US market watcher states"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-market-watch-${{ github.run_id }}
          path: |
            out/us_fund_flow_status.md
            out/us_fund_flow_alert.html
            out/us_fund_flow_pending_state.json
            out/us_positioning_options_sox_status.md
            out/us_positioning_options_sox_alert.html
            out/us_positioning_options_sox_pending_state.json
          if-no-files-found: ignore
          retention-days: 14
