name: Korea Energy Price Control and Fiscal Burden Watch

on:
  schedule:
    # UTC 기준 두 시간마다 13분: 기존 전원믹스·전력망 알림과 별도 일정
    - cron: "13 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/energy-price-fiscal-watch.yml"
      - "scripts/energy_price_fiscal_watch.py"
      - "tests/test_energy_price_fiscal_watch.py"

permissions:
  contents: write

concurrency:
  group: energy-price-fiscal-watch
  cancel-in-progress: false
  queue: max

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.ENERGY_MIX_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.ENERGY_MIX_TELEGRAM_CHAT_ID }}
      FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      EXPECTED_BOT: khs887988798879887988798879_bot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/energy-price-fiscal-watch.yml
            scripts/energy_price_fiscal_watch.py
            tests/test_energy_price_fiscal_watch.py
            data/energy_price_fiscal_state.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: pip install --quiet requests beautifulsoup4
      - name: 코드·회귀 테스트
        run: |
          python -m py_compile scripts/energy_price_fiscal_watch.py
          PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_energy_price_fiscal_watch.py' -v
      - name: 기존 에너지 Telegram 경로 검증
        id: route
        continue-on-error: true
        run: |
          python - <<'PY'
          import os,requests
          from scripts.energy_price_fiscal_watch import resolve_chat
          token=(os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat=(os.getenv("TELEGRAM_CHAT_ID") or "").strip() or (os.getenv("FALLBACK_TELEGRAM_CHAT_ID") or "").strip()
          expected=os.environ["EXPECTED_BOT"]
          if not token or not chat: raise RuntimeError("기존 Telegram 설정 누락")
          try:
              r=requests.get(f"https://api.telegram.org/bot{token}/getMe",timeout=20)
              result=r.json()
              actual=str((result.get("result") or {}).get("username") or "")
              if not r.ok or result.get("ok") is not True or actual.lower()!=expected.lower():
                  raise ValueError()
          except Exception:
              raise RuntimeError("기존 에너지 Telegram 봇 인증 실패") from None
          resolve_chat(token,chat)
          print("telegram_route_valid=true telegram_chat_resolved=true no_test_message=true")
          PY
      - name: 공식자료 조회 및 신규 변화 판정
        id: scan
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/energy_price_fiscal_watch.py --no-alert
          else
            python scripts/energy_price_fiscal_watch.py
          fi
          if [ -s out/energy_price_fiscal_alert.html ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          cat out/energy_price_fiscal_status.md >> "$GITHUB_STEP_SUMMARY"
      - name: 신규 공식 발표 전달 및 상태 검증
        id: send
        if: github.event_name != 'push' && steps.scan.conclusion == 'success'
        env:
          TELEGRAM_ROUTE_VALID: ${{ steps.route.outcome == 'success' }}
        run: python scripts/energy_price_fiscal_watch.py --deliver
      - name: 공식 원천 및 전송 경로 실패 표시
        if: always() && steps.scan.conclusion == 'success'
        env:
          TELEGRAM_ROUTE_VALID: ${{ steps.route.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("out/energy_price_fiscal_pending.json")
          s=json.loads(p.read_text(encoding="utf-8"))
          if not s["source_health"]["complete"]:
              raise RuntimeError("일부 공식 원천 조회 실패: 신규 발표 없음으로 판정하지 않음")
          if os.getenv("TELEGRAM_ROUTE_VALID")!="true":
              raise RuntimeError("Telegram 경로 확인 실패: 전송 금지 및 발견 문서 보존")
          PY
      - name: 감사 기록 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-price-fiscal-${{ github.run_id }}
          path: |
            out/energy_price_fiscal_status.md
            out/energy_price_fiscal_pending.json
            out/energy_price_fiscal_alert.html
          if-no-files-found: ignore
          retention-days: 14
