name: Korea Energy Price Control and Fiscal Burden Watch

on:
  schedule:
    # UTC 기준 두 시간마다 13분: 기존 전원믹스·전력망 알림과 별도 일정
    - cron: "13 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/energy-price-fiscal-watch.yml"
      - "scripts/energy_price_fiscal_watch.py"
      - "tests/test_energy_price_fiscal_watch.py"

permissions:
  contents: write

concurrency:
  group: energy-price-fiscal-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.ENERGY_MIX_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.ENERGY_MIX_TELEGRAM_CHAT_ID }}
      FALLBACK_TELEGRAM_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
      EXPECTED_BOT: khs887988798879887988798879_bot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/energy-price-fiscal-watch.yml
            scripts/energy_price_fiscal_watch.py
            tests/test_energy_price_fiscal_watch.py
            data/energy_price_fiscal_state.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: pip install --quiet requests beautifulsoup4
      - name: 코드·회귀 테스트
        run: |
          python -m py_compile scripts/energy_price_fiscal_watch.py
          PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_energy_price_fiscal_watch.py' -v
      - name: 기존 에너지 Telegram 경로 검증
        run: |
          python - <<'PY'
          import os,requests
          token=(os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat=(os.getenv("TELEGRAM_CHAT_ID") or "").strip() or (os.getenv("FALLBACK_TELEGRAM_CHAT_ID") or "").strip()
          expected=os.environ["EXPECTED_BOT"]
          if not token or not chat: raise RuntimeError("에너지 전용 Telegram Secret 없음: 다른 봇으로 대체 전송하지 않음")
          r=requests.get(f"https://api.telegram.org/bot{token}/getMe",timeout=20)
          r.raise_for_status()
          result=r.json()
          actual=str((result.get("result") or {}).get("username") or "")
          if not result.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"잘못된 텔레그램 봇: expected @{expected}, got @{actual}")
          print(f"telegram_route_valid=true bot=@{actual}")
          PY
      - name: 공식자료 조회 및 신규 변화 판정
        id: scan
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/energy_price_fiscal_watch.py --no-alert
          else
            python scripts/energy_price_fiscal_watch.py
          fi
          if [ -s out/energy_price_fiscal_alert.html ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          cat out/energy_price_fiscal_status.md >> "$GITHUB_STEP_SUMMARY"
      - name: 공식 신규 변화만 Telegram 발송
        id: send
        if: steps.scan.outputs.changed == 'true' && github.event_name != 'push'
        run: |
          python - <<'PY'
          import os,pathlib,requests
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat=(os.getenv("TELEGRAM_CHAT_ID") or "").strip() or (os.getenv("FALLBACK_TELEGRAM_CHAT_ID") or "").strip()
          msg=pathlib.Path("out/energy_price_fiscal_alert.html").read_text(encoding="utf-8").strip()
          if not msg: raise RuntimeError("전송 내용 누락")
          remaining=msg;chunks=[]
          while remaining:
              if len(remaining)<=3500:
                  chunks.append(remaining);break
              cut=remaining.rfind("\n\n",0,3500)
              if cut<1200:cut=3500
              chunks.append(remaining[:cut].strip());remaining=remaining[cut:].strip()
          ids=[]
          for chunk in chunks:
              r=requests.post(f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id":chat,"text":chunk,"parse_mode":"HTML","disable_web_page_preview":True},timeout=30)
              r.raise_for_status()
              result=r.json()
              if not result.get("ok"):raise RuntimeError(f"Telegram 전송 거부: {result}")
              ids.append((result.get("result") or {}).get("message_id"))
          print(f"telegram_delivery_confirmed=true messages={len(ids)} ids={ids}")
          PY
      - name: 조회·전송 성공한 상태만 저장
        if: steps.scan.conclusion == 'success' && (steps.scan.outputs.changed == 'false' || steps.send.conclusion == 'success')
        run: |
          git config user.name "energy-price-fiscal-watch[bot]"
          git config user.email "energy-price-fiscal-watch[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            python - <<'PY'
          import json
          from pathlib import Path
          incoming = json.loads(Path("out/energy_price_fiscal_pending.json").read_text(encoding="utf-8"))
          path = Path("data/energy_price_fiscal_state.json")
          previous = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          latest = incoming if str(incoming.get("updated_at_kst","")) >= str(previous.get("updated_at_kst","")) else previous
          merged = json.loads(json.dumps(latest))
          seen = merged.setdefault("seen", {})
          for snapshot in (previous, incoming):
              for source, doc_ids in (snapshot.get("seen") or {}).items():
                  seen[source] = sorted(set(seen.get(source,[])) | set(doc_ids))[-2500:]
          merged["initialized"] = bool(previous.get("initialized") or incoming.get("initialized"))
          seed_dates = [x for x in (previous.get("seeded_date"),incoming.get("seeded_date")) if x]
          if seed_dates:
              merged["seeded_date"] = min(seed_dates)
          sources = merged.setdefault("sources", {})
          for snapshot in (previous, incoming):
              for source, metadata in (snapshot.get("sources") or {}).items():
                  if source not in sources or metadata.get("last_ok_kst","") >= sources[source].get("last_ok_kst",""):
                      sources[source] = metadata
          path.write_text(json.dumps(merged,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
            git add data/energy_price_fiscal_state.json
            if git diff --cached --quiet; then
              echo "energy_state_unchanged=true"
              exit 0
            fi
            git commit -m "Update energy price fiscal watch state [skip ci]"
            if git push origin HEAD:main; then
              echo "energy_state_committed=true"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "State commit failed after merging latest remote state" >&2
          exit 1
      - name: 감사 기록 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-price-fiscal-${{ github.run_id }}
          path: |
            out/energy_price_fiscal_status.md
            out/energy_price_fiscal_pending.json
            out/energy_price_fiscal_alert.html
          if-no-files-found: ignore
          retention-days: 14
