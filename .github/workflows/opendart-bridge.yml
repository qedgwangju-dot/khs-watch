name: OpenDART Bridge

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  query-opendart:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[OpenDART]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query OpenDART and comment result
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          OPENDART_REQUEST: ${{ github.event.issue.body }}
          OPENDART_TITLE_QUERY: ${{ github.event.issue.title }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          python scripts/opendart_bridge.py > /tmp/opendart-result.md 2>&1
          status=$?
          set -e

          if [ ! -s /tmp/opendart-result.md ]; then
            echo 'OpenDART 오류: 결과가 비어 있습니다.' > /tmp/opendart-result.md
          fi

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file /tmp/opendart-result.md

          exit "$status"
