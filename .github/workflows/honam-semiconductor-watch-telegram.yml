name: Honam Semiconductor Jangrok Telegram Watch

on:
  push:
    paths:
      - ".github/workflows/honam-semiconductor-watch-telegram.yml"
      - "scripts/honam_semiconductor_watch.py"
      - "data/honam_semiconductor_watch_state.json"
  schedule:
    # GitHub cron is UTC. Check hourly; no meaningful new change => no Telegram message.
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: honam-semiconductor-watch-telegram
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs887988798879887988798879_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate watcher
        run: python -m py_compile scripts/honam_semiconductor_watch.py

      - name: Check Honam semiconductor and Jangrok sources
        run: python scripts/honam_semiconductor_watch.py

      - name: Publish watcher summary
        if: always()
        run: |
          if [ -f out/honam_semiconductor_status.md ]; then
            cat out/honam_semiconductor_status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "호남 반도체 웹감시 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate Telegram route when needed
        if: hashFiles('out/honam_semiconductor_alert.json') != '' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HONAM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HONAM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("HONAM_TELEGRAM_BOT_TOKEN secret is missing")
          if not chat_id:
              raise RuntimeError("HONAM_TELEGRAM_CHAT_ID secret is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{username} chat_id_configured=true")
          PY

      - name: Send manual setup test to Telegram
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HONAM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HONAM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          now = dt.datetime.now(ZoneInfo("Asia/Seoul")).strftime("%Y-%m-%d %H:%M KST")
          text = (
              "✅ <b>호남 반도체 국가산단 · 장록습지 웹감시 연결 완료</b>\n\n"
              "다음 3가지만 순서대로 감시합니다.\n"
              "1) 환경영향평가 용역 수행업체 선정·계약·현지조사 착수\n"
              "2) 장록습지 수량·수질 조사범위·유량·수위·지하수·방류·저감대책\n"
              "3) 기후에너지환경부 신청 람사르습지 등록 심사 결과\n\n"
              "의미 있는 새 변화가 있을 때만 알림을 보냅니다.\n"
              f"연결 확인: {now}"
          )
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method="POST")
          with urllib.request.urlopen(req, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram test rejected: {result}")
          print(f"manual_test_message_id={result.get('result', {}).get('message_id')}")
          PY

      - name: Send meaningful change to Telegram
        if: hashFiles('out/honam_semiconductor_alert.json') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HONAM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HONAM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import html
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          data = json.loads(pathlib.Path("out/honam_semiconductor_alert.json").read_text(encoding="utf-8"))

          stage_names = {
              "1_용역선정_현지조사": "① 용역업체 선정·현지조사",
              "2_수량수질_조사범위": "② 장록습지 수량·수질",
              "3_람사르_심사결과": "③ 람사르 등록 심사",
          }

          lines = ["🚨 <b>호남 반도체 국가산단 · 장록습지 변화 감지</b>", ""]
          for change in data.get("official_changes", []):
              lines += [
                  "🏛 <b>공식 페이지 변경</b>",
                  html.escape(change.get("snippet", "")[:900]),
                  f"시간표 판단: {html.escape(change.get('impact', '세부 확인 필요'))}",
                  f"원문: {html.escape(change.get('url', ''))}",
                  "",
              ]

          for item in data.get("new_items", []):
              stages = ", ".join(stage_names.get(x, x) for x in item.get("stages", []))
              lines += [
                  f"🔎 <b>{html.escape(stages)}</b>",
                  html.escape(item.get("title", "")),
                  f"출처: {html.escape(item.get('source') or '웹 검색')}",
                  f"시간표 판단: {html.escape(item.get('impact', '확인 필요'))}",
                  f"원문: {html.escape(item.get('link', ''))}",
                  "",
              ]

          lines += [
              "<b>확인 순서</b>",
              "1) 수행업체 선정·현지조사 착수 → 2) 수량·수질 조사범위 → 3) 람사르 심사 결과",
              "",
              f"확인시각: {html.escape(data.get('checked_at_kst', ''))}",
          ]
          text = "\n".join(lines)
          # Telegram text limit is 4096 characters; split safely on line boundaries.
          chunks = []
          current = ""
          for line in text.splitlines(True):
              if len(current) + len(line) > 3900 and current:
                  chunks.append(current)
                  current = ""
              current += line
          if current:
              chunks.append(current)

          ids = []
          for chunk in chunks:
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method="POST")
              with urllib.request.urlopen(req, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              ids.append(result.get("result", {}).get("message_id"))

          confirmed = {
              "status": "confirmed",
              "message_ids": ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/honam_semiconductor_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"telegram_delivery_confirmed=true message_ids={ids}")
          PY

      - name: Persist state
        if: success() && (hashFiles('out/honam_semiconductor_alert.json') == '' || hashFiles('out/honam_semiconductor_telegram_confirmed.json') != '')
        run: |
          cp out/honam_semiconductor_pending_state.json data/honam_semiconductor_watch_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/honam_semiconductor_watch_state.json
          if git diff --cached --quiet; then
            echo "Honam watcher state unchanged"
          else
            git commit -m "Record Honam semiconductor watch state"
            git pull --rebase origin main
            git push
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honam-semiconductor-watch-${{ github.run_id }}
          path: |
            out/honam_semiconductor_status.md
            out/honam_semiconductor_alert.json
            out/honam_semiconductor_pending_state.json
            out/honam_semiconductor_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
