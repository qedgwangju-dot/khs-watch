name: Treasury 30Y JPM crossing alert

on:
  push:
    paths:
      - "scripts/treasury_30y_jpm_threshold_watch.py"
      - "tests/test_treasury_30y_jpm_levels.py"
      - ".github/workflows/treasury-30y-jpm-crossing.yml"
  schedule:
    # Treasury official EOD yields, not intraday executable market prices.
    - cron: "23 7-18 * * 1-6"
      timezone: "Asia/Seoul"
    - cron: "23 22 * * 1-6"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Fetch official data and validate without Telegram sending"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: treasury-30y-jpm-crossing
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout latest main for deduplication
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: python -m pip install --disable-pip-version-check -q requests pytest

      - name: Compile and test fail-closed crossing logic
        run: |
          python -m py_compile scripts/treasury_30y_jpm_threshold_watch.py
          python -m py_compile scripts/treasury_positioning_watch.py
          PYTHONPATH=scripts pytest -q tests/test_treasury_30y_jpm_levels.py
          PYTHONPATH=scripts pytest -q tests/test_treasury_positioning_watch.py

      - name: Dry-run on code changes or validation dispatch
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.validate_only) }}
        env:
          TREASURY_30Y_VALIDATE_ONLY: "1"
        run: python scripts/treasury_30y_jpm_threshold_watch.py

      - name: Monitor actual new official 30-year crossing
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.validate_only) }}
        run: python scripts/treasury_30y_jpm_threshold_watch.py

      - name: Save confirmed delivery or official baseline only
        if: ${{ success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.validate_only)) }}
        run: |
          if [ ! -f data/treasury_30y_jpm_level_state.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasury_30y_jpm_level_state.json
          if git diff --cached --quiet; then
            echo "Official 30Y state unchanged: no Telegram repeat"
            exit 0
          fi
          git commit -m "Update official Treasury 30Y JPM crossing state"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "treasury_30y_state_persisted=true"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "::error::Confirmed alert or accepted state could not be persisted"
          exit 1

      - name: Upload audit without publishing extra Telegram messages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-30y-jpm-${{ github.run_id }}
          path: |
            out/treasury_30y_jpm_crossing_preview.txt
            data/treasury_30y_jpm_level_state.json
          if-no-files-found: ignore
          retention-days: 14
