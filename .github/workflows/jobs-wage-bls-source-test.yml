name: Jobs Wage BLS source test

on:
  push:
    paths:
      - ".github/workflows/jobs-wage-bls-source-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test official BLS alternate endpoints
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          tests = [
              ("api_get", "https://api.bls.gov/publicAPI/v2/timeseries/data/CES0000000001?startyear=2026&endyear=2026"),
              ("rss", "https://www.bls.gov/feed/empsit.rss"),
              ("calendar_ics", "https://www.bls.gov/schedule/news_release/bls.ics"),
              ("download_ces", "https://download.bls.gov/pub/time.series/ce/ce.data.0.AllCESSeries"),
          ]
          headers = {"User-Agent": "Mozilla/5.0 (compatible; khs-jobs-wage-watch/1.0)"}
          for name, url in tests:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read(600)
                      print(f"SOURCE_TEST {name} status={r.status} content_type={r.headers.get('Content-Type')} bytes_sample={len(body)}")
                      print(body[:220].decode('utf-8', errors='replace').replace('\n',' '))
              except Exception as e:
                  print(f"SOURCE_TEST {name} ERROR {type(e).__name__}: {e}")

          payload = json.dumps({
              "seriesid": [
                  "CES0000000001",
                  "LNS14000000",
                  "LNS11300000",
                  "LNS12300000",
                  "CES0500000003",
                  "CES0500000002",
                  "CES3000000002",
                  "CES3000000005"
              ],
              "startyear": "2025",
              "endyear": "2026"
          }).encode("utf-8")
          try:
              req = urllib.request.Request(
                  "https://api.bls.gov/publicAPI/v2/timeseries/data/",
                  data=payload,
                  headers={"Content-Type": "application/json", **headers},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=25) as r:
                  obj = json.loads(r.read().decode("utf-8"))
              print("SOURCE_TEST api_post status=200 API_status=" + str(obj.get("status")) + " series=" + str(len((obj.get("Results") or {}).get("series") or [])))
              for s in ((obj.get("Results") or {}).get("series") or []):
                  data = s.get("data") or []
                  latest = data[0] if data else {}
                  print("API_SERIES", s.get("seriesID"), latest.get("year"), latest.get("period"), latest.get("value"), latest.get("latest"))
          except Exception as e:
              print(f"SOURCE_TEST api_post ERROR {type(e).__name__}: {e}")
          PY
