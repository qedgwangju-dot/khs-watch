name: Crypto liquidity offline regressions

on:
  pull_request:
    paths:
      - scripts/crypto_liquidity_watch.py
      - scripts/crypto_liquidity_watch_runner.py
      - scripts/crypto_alert_format.py
      - scripts/crypto_alert_krw.py
      - scripts/coin_alert_korean_terms.py
      - tests/test_crypto_liquidity_integrity.py
      - tests/test_coin_alert_korean_terms.py
      - tests/fixtures/crypto_report_completion_20261015.json
      - .github/workflows/crypto-liquidity-watch-telegram.yml
      - .github/workflows/crypto-liquidity-offline-regressions.yml

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed code without saved credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Run crypto regressions with networking blocked
        run: |
          python -B - <<'PY'
          import socket
          import unittest

          def blocked(*args, **kwargs):
              raise AssertionError("External network disabled for crypto regressions")

          socket.socket.connect = blocked
          socket.socket.connect_ex = blocked
          socket.create_connection = blocked
          socket.getaddrinfo = blocked
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.test_crypto_liquidity_integrity",
              "tests.test_coin_alert_korean_terms",
              "tests.test_coinbase_stablecoin_catalyst_watch",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
