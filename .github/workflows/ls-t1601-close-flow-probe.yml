name: LS t1601 Close Flow Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ls-t1601-close-flow-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      LS_OPENAPI_APP_KEY: ${{ secrets.LS_OPENAPI_APP_KEY }}
      LS_OPENAPI_APP_SECRET: ${{ secrets.LS_OPENAPI_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe t1601
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          base='https://openapi.ls-sec.co.kr:8080'
          key=os.environ['LS_OPENAPI_APP_KEY'].strip(); secret=os.environ['LS_OPENAPI_APP_SECRET'].strip()
          qs=urllib.parse.urlencode({'grant_type':'client_credentials','appkey':key,'appsecretkey':secret,'scope':'oob'})
          req=urllib.request.Request(base+'/oauth2/token?'+qs,data=b'',headers={'content-type':'application/x-www-form-urlencoded'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: token=json.loads(r.read().decode())['access_token']
          body={'t1601InBlock':{'gubun1':'2','gubun2':'2','gubun3':'','gubun4':'2','exchgubun':'K'}}
          data=json.dumps(body).encode()
          req=urllib.request.Request(base+'/stock/investor',data=data,headers={'content-type':'application/json; charset=utf-8','authorization':'Bearer '+token,'tr_cd':'t1601','tr_cont':'N','tr_cont_key':''},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: out=json.loads(r.read().decode())
          for i,name in [(1,'KOSPI'),(2,'KOSDAQ')]:
              b=out.get(f't1601OutBlock{i}') or {}
              print(name,'foreign_svolume_17=',b.get('svolume_17'),'foreign_buy=',b.get('ms_17'),'foreign_sell=',b.get('md_17'))
          print('rsp_cd=',out.get('rsp_cd'),'rsp_msg=',out.get('rsp_msg'))
          PY
