name: NVIDIA Executive Signal Telegram Watch

on:
  push:
    paths:
      - ".github/workflows/nvidia-exec-signal-telegram.yml"
      - "scripts/nvidia_exec_signal_watch.py"
      - "scripts/nvidia_exec_signal_pretty.py"
  schedule:
    - cron: "31 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nvidia-exec-signal-telegram-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs88798879887988798879_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google News original-link decoder
        run: python -m pip install --disable-pip-version-check --no-cache-dir googlenewsdecoder==0.1.7

      - name: Validate Telegram route without sending
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HBM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("NVIDIA alert Telegram token/chat id is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{username} chat_id_present=true")
          PY

      - name: Check NVIDIA executive demand and safety signals
        run: |
          python -m py_compile scripts/nvidia_exec_signal_watch.py
          python scripts/nvidia_exec_signal_watch.py

      - name: Format NVIDIA executive alert for readability
        run: |
          python -m py_compile scripts/nvidia_exec_signal_pretty.py
          if [ -f out/nvidia_exec_signal_alert.html ]; then
            python scripts/nvidia_exec_signal_pretty.py
          fi

      - name: Publish watcher summary
        if: always()
        run: |
          if [ -f out/nvidia_exec_signal_status.md ]; then
            cat out/nvidia_exec_signal_status.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send NVIDIA executive signal to Telegram
        if: hashFiles('out/nvidia_exec_signal_alert.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HBM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")
          text = pathlib.Path("out/nvidia_exec_signal_alert.html").read_text(encoding="utf-8").strip()
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method="POST")
          with urllib.request.urlopen(req, timeout=25) as r:
              result = json.loads(r.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected NVIDIA executive signal: {result}")
          print(f"nvidia_exec_signal_delivery_confirmed=true bot=@{username} message_id={result.get('result',{}).get('message_id')}")
          PY

      - name: Commit watcher state
        if: success() && hashFiles('data/nvidia_exec_signal_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nvidia_exec_signal_state.json
          if git diff --cached --quiet; then
            echo "NVIDIA executive signal state unchanged"
          else
            git commit -m "Record NVIDIA executive signal watch state"
            git pull --rebase origin main
            git push
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-exec-signal-${{ github.run_id }}
          path: |
            out/nvidia_exec_signal_status.md
            out/nvidia_exec_signal_alert.html
          if-no-files-found: ignore
          retention-days: 14
