name: NVIDIA Executive Signal Telegram Watch

on:
  push:
    paths:
      - ".github/workflows/nvidia-exec-signal-telegram.yml"
      - "scripts/nvidia_exec_signal_watch.py"
      - "scripts/nvidia_exec_signal_pretty.py"
      - "scripts/currency_krw_guard.py"
      - "scripts/fx_api.py"
      - "tests/test_nvidia_exec_signal_watch.py"
      - "tests/test_nvidia_exec_signal_pretty.py"
  schedule:
    - cron: "31 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nvidia-exec-signal-telegram-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs88798879887988798879_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google News original-link decoder
        run: python -m pip install --disable-pip-version-check --no-cache-dir googlenewsdecoder==0.1.7

      - name: Validate Telegram route without sending
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HBM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("NVIDIA alert Telegram token/chat id is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{username} chat_id_present=true")
          PY

      - name: Check NVIDIA executive demand safety and capital-return signals
        run: |
          python -m py_compile scripts/nvidia_exec_signal_watch.py scripts/currency_krw_guard.py scripts/fx_api.py
          python -m unittest discover -s tests -p 'test_nvidia_exec_signal*.py' -v
          python scripts/nvidia_exec_signal_watch.py

      - name: Format NVIDIA executive alert for readability
        run: |
          python -m py_compile scripts/nvidia_exec_signal_pretty.py
          if [ -f out/nvidia_exec_signal_alert.html ]; then
            python scripts/nvidia_exec_signal_pretty.py
          fi

      - name: Enforce KRW immediately after every foreign-currency amount
        if: hashFiles('out/nvidia_exec_signal_alert.html') != ''
        run: python scripts/currency_krw_guard.py out/nvidia_exec_signal_alert.html

      - name: Publish watcher summary
        if: always()
        run: |
          if [ -f out/nvidia_exec_signal_status.md ]; then
            cat out/nvidia_exec_signal_status.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send NVIDIA executive signal to Telegram
        if: hashFiles('out/nvidia_exec_signal_alert.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HBM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")
          text = pathlib.Path("out/nvidia_exec_signal_alert.html").read_text(encoding="utf-8").strip()
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method="POST")
          with urllib.request.urlopen(req, timeout=25) as r:
              result = json.loads(r.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected NVIDIA executive signal: {result}")
          message_id = (result.get("result") or {}).get("message_id")
          if type(message_id) is not int or message_id <= 0:
              raise RuntimeError("Telegram acknowledgement lacks a valid message_id")
          import datetime as dt
          from zoneinfo import ZoneInfo
          receipt = {
              "status": "confirmed",
              "bot_username": username,
              "message_id": message_id,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/nvidia_exec_signal_telegram_confirmed.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"nvidia_exec_signal_delivery_confirmed=true bot=@{username} message_id={message_id}")
          PY

      - name: Persist confirmed NVIDIA delivery receipt
        if: success() && hashFiles('out/nvidia_exec_signal_telegram_confirmed.json') != '' && hashFiles('data/nvidia_exec_signal_state.json') != ''
        run: |
          python - <<'PY'
          import json, pathlib
          state_path = pathlib.Path("data/nvidia_exec_signal_state.json")
          receipt_path = pathlib.Path("out/nvidia_exec_signal_telegram_confirmed.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          state["last_successful_delivery_kst"] = receipt["confirmed_at_kst"]
          state["telegram_message_id"] = receipt["message_id"]
          state["bot_username"] = receipt["bot_username"]
          state["delivery_receipt"] = receipt
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit watcher state
        if: success() && hashFiles('data/nvidia_exec_signal_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nvidia_exec_signal_state.json
          if git diff --cached --quiet; then
            echo "NVIDIA executive signal state unchanged"
          else
            git commit -m "Record NVIDIA executive signal watch state"
            git pull --rebase origin main
            git push
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-exec-signal-${{ github.run_id }}
          path: |
            out/nvidia_exec_signal_status.md
            out/nvidia_exec_signal_alert.html
            out/nvidia_exec_signal_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
