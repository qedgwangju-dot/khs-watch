name: Global Rates & Yen Carry Telegram Watch

on:
  push:
    paths:
      - ".github/workflows/global-rates-telegram-watch.yml"
      - "scripts/global_rates_watch.py"
      - "scripts/yen_carry_confirmation.py"
      - "scripts/global_rates_telegram_formatter.py"
      - "scripts/bio_single_runner.py"
      - "data/global_rates_watch_state.json"
      - "data/global_rates_telegram_state.json"
  schedule:
    # Official sources are daily; 15-minute polling catches publication changes quickly.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_test:
        description: "Send a Telegram test with the current composite risk report"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: global-rates-telegram-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs887988798879887988798879_bot"
      BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
      BIO_TELEGRAM_CHAT_ID: ${{ secrets.BIO_TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run QLEX and Intismeran bio watch
        run: python scripts/bio_single_runner.py

      - name: Publish bio watch status
        if: always()
        run: |
          if [ -f data/bio_watch_heartbeat.json ]; then
            echo "# 바이오 감시 상태" >> "$GITHUB_STEP_SUMMARY"
            cat data/bio_watch_heartbeat.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check official rate sources
        run: python scripts/global_rates_watch.py

      - name: Check yen carry confirmation signals
        if: always()
        run: python scripts/yen_carry_confirmation.py

      - name: Build concise Telegram report
        if: always()
        env:
          FORCE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_test == true && '1' || '0' }}
        run: python scripts/global_rates_telegram_formatter.py

      - name: Publish watcher summary
        if: always()
        run: |
          if [ -f out/global_rates_watch_status.md ]; then
            cat out/global_rates_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "글로벌 금리 감시 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/yen_carry_confirmation.md ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            cat out/yen_carry_confirmation.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/global_rates_watch_telegram.md ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "# Telegram 전송 예정 메시지" >> "$GITHUB_STEP_SUMMARY"
            cat out/global_rates_watch_telegram.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send composite risk alert to Telegram
        if: hashFiles('out/global_rates_watch_telegram.md') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          if not token or not chat_id:
              print("Telegram secrets are not configured; states will not advance.")
              raise SystemExit(0)

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          if not identity.get("ok"):
              raise RuntimeError("Telegram getMe failed")
          bot_username = str((identity.get("result") or {}).get("username") or "")

          text = pathlib.Path("out/global_rates_watch_telegram.md").read_text(encoding="utf-8").strip()

          def split_message(value, limit=3900):
              chunks, current = [], ""
              for paragraph in value.split("\n\n"):
                  candidate = paragraph if not current else current + "\n\n" + paragraph
                  if len(candidate) <= limit:
                      current = candidate
                      continue
                  if current:
                      chunks.append(current)
                      current = ""
                  while len(paragraph) > limit:
                      cut = paragraph.rfind("\n", 0, limit)
                      if cut < 1:
                          cut = limit
                      chunks.append(paragraph[:cut])
                      paragraph = paragraph[cut:].lstrip()
                  current = paragraph
              if current:
                  chunks.append(current)
              return chunks

          ids = []
          for idx, chunk in enumerate(split_message(text), start=1):
              if idx > 1:
                  chunk = f"글로벌 금리·엔캐리 경보 (계속 {idx})\n\n{chunk}"
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=25) as r:
                  result = json.loads(r.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              ids.append((result.get("result") or {}).get("message_id"))

          confirmed = {
              "status": "confirmed",
              "bot_username": bot_username,
              "message_ids": ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/global_rates_watch_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"telegram_delivery_confirmed=true bot=@{bot_username} message_ids={ids}")
          PY

      - name: Persist states only after safe baseline or confirmed Telegram delivery
        if: always()
        run: |
          if [ ! -f out/global_rates_watch_telegram.md ] || [ -f out/global_rates_watch_telegram_confirmed.json ]; then
            if [ -f out/global_rates_watch_pending_state.json ]; then
              cp out/global_rates_watch_pending_state.json data/global_rates_watch_state.json
            fi
            if [ -f out/global_rates_telegram_pending_state.json ]; then
              cp out/global_rates_telegram_pending_state.json data/global_rates_telegram_state.json
            fi
          else
            echo "Telegram delivery was not confirmed; watcher states intentionally not advanced."
          fi

      - name: Commit confirmed/baseline states
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/global_rates_watch_state.json data/global_rates_telegram_state.json data/qlex_sc_conversion_watch_state.json data/intismeran_qlex_watch_state.json data/bio_watch_heartbeat.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Watcher states unchanged"
          else
            git commit -m "Update global rates and bio watch states"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-rates-watch-${{ github.run_id }}
          path: |
            data/bio_watch_heartbeat.json
            out/qlex_sc_conversion_status.md
            out/qlex_sc_conversion_alert.md
            out/qlex_sc_conversion_watch_state_pending.json
            out/intismeran_qlex_status.md
            out/intismeran_qlex_alert.md
            out/intismeran_qlex_watch_state_pending.json
            out/intismeran_structured_send_confirmed.json
            out/global_rates_watch_status.md
            out/global_rates_watch_alert.md
            out/global_rates_watch_alert.json
            out/global_rates_watch_pending_state.json
            out/yen_carry_confirmation.md
            out/yen_carry_confirmation.json
            out/global_rates_watch_telegram.md
            out/global_rates_telegram_pending_state.json
            out/global_rates_watch_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
