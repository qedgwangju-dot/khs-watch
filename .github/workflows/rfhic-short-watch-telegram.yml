name: RFHIC Short Watch Telegram

on:
  push:
    paths:
      - ".github/workflows/rfhic-short-watch-telegram.yml"
      - "scripts/rfhic_short_watch.py"
      - "data/rfhic_short_watch_state.json"
  schedule:
    # GitHub cron is UTC. KRX full daily short-sale data is published after 18:10 KST.
    # Retry at 18:27, 19:27, 20:27 KST on weekdays; state prevents duplicate alerts.
    - cron: "27 9-11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rfhic-short-watch-telegram
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install KRX client
        run: python -m pip install --disable-pip-version-check pykrx

      - name: Validate Telegram route without sending
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("Telegram bot token secret is missing")
          if not chat_id:
              raise RuntimeError("Telegram chat id secret is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{username} chat_id_present=true")
          PY

      - name: Read KRX RFHIC short-selling data
        run: |
          python -m py_compile scripts/rfhic_short_watch.py
          python scripts/rfhic_short_watch.py

      - name: Send one-time connection confirmation
        if: hashFiles('out/rfhic_short_watch_rebaseline.txt') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip()
          text = (
              "✅ RFHIC(218410) 공매도 웹 감시 연결 완료\n\n"
              "KRX 당일 공매도량·비율과 최신 순보유잔고수량·비중을 확인해, "
              "새 거래일 데이터가 나온 경우에만 알립니다.\n"
              "확인 시간: 평일 18:27·19:27·20:27 KST"
          )
          payload = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method="POST"
          )
          with urllib.request.urlopen(req, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected connection message: {result}")
          print(f"telegram_connection_confirmation=true message_id={result['result'].get('message_id')}")
          PY

      - name: Send new KRX short-selling report
        if: hashFiles('out/rfhic_short_watch_alert.txt') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          text = pathlib.Path("out/rfhic_short_watch_alert.txt").read_text(encoding="utf-8").strip()
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage", data=payload, method="POST"
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected message: {result}")
          confirmed = {
              "status": "confirmed",
              "bot_username": username,
              "message_id": result.get("result", {}).get("message_id"),
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/rfhic_short_watch_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"telegram_delivery_confirmed=true bot=@{username} message_id={confirmed['message_id']}")
          PY

      - name: Persist state
        if: success()
        run: |
          mkdir -p data
          cp out/rfhic_short_watch_pending_state.json data/rfhic_short_watch_state.json
          if [ -f out/rfhic_short_watch_telegram_confirmed.json ]; then
            python - <<'PY'
          import json
          import pathlib
          state_path = pathlib.Path("data/rfhic_short_watch_state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          confirmed = json.loads(pathlib.Path("out/rfhic_short_watch_telegram_confirmed.json").read_text(encoding="utf-8"))
          state["last_successful_delivery_kst"] = confirmed.get("confirmed_at_kst")
          state["telegram_message_id"] = confirmed.get("message_id")
          state["bot_username"] = confirmed.get("bot_username")
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          fi

      - name: Commit watcher state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rfhic_short_watch_state.json
          if git diff --cached --quiet; then
            echo "RFHIC short-watch state unchanged"
          else
            git commit -m "Record RFHIC short watch state"
            git pull --rebase origin main
            git push
          fi

      - name: Publish watcher summary
        if: always()
        run: |
          if [ -f out/rfhic_short_watch_status.md ]; then
            cat out/rfhic_short_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfhic-short-watch-${{ github.run_id }}
          path: |
            out/rfhic_short_watch_status.md
            out/rfhic_short_watch_alert.txt
            out/rfhic_short_watch_alert.json
            out/rfhic_short_watch_pending_state.json
            out/rfhic_short_watch_rebaseline.txt
            out/rfhic_short_watch_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
