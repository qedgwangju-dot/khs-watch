name: Treasury 30Y bootstrap audit once
on:
  push:
    paths:
      - ".github/workflows/treasury-30y-bootstrap-audit-once.yml"
permissions:
  contents: write
concurrency:
  group: treasury-30y-jpm-crossing
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4 pytest
      - name: Validate replay and dedup tests
        run: PYTHONPATH=scripts pytest -q tests/test_treasury_30y_jpm_levels.py tests/test_treasury_positioning_watch.py
      - name: Verify exact configured bot and chat, without sending
        run: |
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat=os.environ["TELEGRAM_CHAT_ID"].strip()
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe",timeout=20) as r:
            me=json.loads(r.read().decode())
          user=str((me.get("result") or {}).get("username") or "")
          if user!="khs8879887988798879_bot": raise RuntimeError("wrong Telegram bot")
          q=urllib.parse.urlencode({"chat_id":chat})
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getChat?{q}",timeout=20) as r:
            ch=json.loads(r.read().decode())
          if not ch.get("ok") or str((ch.get("result") or {}).get("id"))!=chat:
            raise RuntimeError("wrong Telegram chat")
          print("correct_telegram_route_verified_without_send=true")
          PY
      - name: Bootstrap current official level, no retroactive event alert
        run: python scripts/treasury_30y_jpm_threshold_watch.py
      - name: Persist official level baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasury_30y_jpm_level_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bootstrap official Treasury 30Y JPM crossing baseline"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
