name: Treasury JPM30 Validate Once

on:
  push:
    paths:
      - ".github/workflows/treasury-jpm30-validate-once.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Compile JPM30 upgrades
        run: |
          python -m py_compile scripts/treasury_credit_flow_watch_refinancing.py
          python -m py_compile scripts/treasury_positioning_watch.py
          python -m py_compile scripts/global_rates_watch.py
      - name: Validate live JPM30 logic without Telegram
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import global_rates_watch as gr
          import treasury_credit_flow_watch_refinancing as daily
          import treasury_positioning_watch as weekly

          curve=gr.fetch_ust_curve()
          y30=curve["ust30"].value
          print("UST30",curve["ust30"].date,y30)
          print("DAILY_JPM",daily._jpm_30y_signal(y30))

          latest,prev,rows=weekly.get_cftc_positions()
          repo=weekly.repo_snapshot()
          print("WEEKLY_DATES",latest,prev)
          print("WEEKLY_JPM",weekly.jpm_30y_signal(y30))
          print("TECH_POS",weekly.technical_positioning(rows,repo,y30))

          # Synthetic boundary checks.
          for x in (6.01,5.79,5.60,5.40,5.24,5.14):
              print("BOUNDARY",x,daily._jpm_30y_signal(x),weekly.jpm_30y_signal(x))
          PY
