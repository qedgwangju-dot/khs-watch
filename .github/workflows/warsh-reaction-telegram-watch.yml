name: Warsh Reaction Function Telegram Watch

on:
  schedule:
    - cron: '26 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: '현재 기준선도 강제로 Telegram 전송'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'scripts/warsh_reaction_watch.py'
      - 'scripts/warsh_speech_watch.py'
      - 'scripts/warsh_market_watch.py'
      - 'scripts/warsh_ai_taskforce_watch.py'
      - '.github/workflows/warsh-reaction-telegram-watch.yml'

permissions:
  contents: write

concurrency:
  group: warsh-reaction-telegram-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check official sources and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
          EXPECTED_BOT_USERNAME: khs8879887988798879_bot
          FORCE_NOTIFY: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_notify) && '1' || '0' }}
          STARTUP_NOTIFY: '0'
          TREASURY_2Y_ALERT_BP: '10'
        run: |
          python scripts/warsh_reaction_watch.py
          python scripts/warsh_speech_watch.py
          python scripts/warsh_market_watch.py
          python scripts/warsh_ai_taskforce_watch.py

      - name: Ignore timestamp-only state changes
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          paths = [
              pathlib.Path('data/warsh_reaction_watch_state.json'),
              pathlib.Path('data/warsh_speech_watch_state.json'),
              pathlib.Path('data/warsh_market_watch_state.json'),
              pathlib.Path('data/warsh_ai_taskforce_watch_state.json'),
          ]
          for path in paths:
              if not path.exists():
                  continue
              probe = subprocess.run(['git', 'cat-file', '-e', f'HEAD:{path.as_posix()}'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if probe.returncode != 0:
                  continue
              old_raw = subprocess.check_output(['git', 'show', f'HEAD:{path.as_posix()}'], text=True)
              old = json.loads(old_raw)
              new = json.loads(path.read_text(encoding='utf-8'))
              old.pop('updated_at_utc', None)
              new.pop('updated_at_utc', None)
              if old == new:
                  subprocess.run(['git', 'checkout', '--', path.as_posix()], check=True)
          PY

      - name: Persist deduplication baselines
        run: |
          CHANGED="$(git status --porcelain -- data/warsh_reaction_watch_state.json data/warsh_speech_watch_state.json data/warsh_market_watch_state.json data/warsh_ai_taskforce_watch_state.json)"
          if [ -z "$CHANGED" ]; then
            echo 'No meaningful state change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/warsh_reaction_watch_state.json data/warsh_speech_watch_state.json data/warsh_market_watch_state.json data/warsh_ai_taskforce_watch_state.json
          git commit -m 'Update Warsh reaction watch state'
          git pull --rebase origin main
          git push
