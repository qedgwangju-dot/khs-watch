name: Warsh Reaction Function Telegram Watch

on:
  schedule:
    - cron: '26 * * * *'
    # Generic Wednesday FOMC event window. The watcher cross-checks the official
    # FOMC calendar before capturing/sending, so non-meeting Wednesdays stay silent.
    # Covers both U.S. daylight-saving and standard-time 2:00 p.m. ET decisions.
    - cron: '50 17 * * 3'
    - cron: '5,20,35,50 18 * * 3'
    - cron: '5,20,35,50 19 * * 3'
    - cron: '15,45 20 * * 3'
  workflow_dispatch:
    inputs:
      force_notify:
        description: '현재 기준선도 강제로 Telegram 전송'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'scripts/sitecustomize.py'
      - 'scripts/warsh_reaction_watch.py'
      - 'scripts/warsh_reaction_watch_v2.py'
      - 'scripts/warsh_reaction_watch_v3.py'
      - 'scripts/warsh_reaction_watch_v4.py'
      - 'scripts/warsh_speech_watch.py'
      - 'scripts/warsh_inflation_market_watch.py'
      - 'scripts/warsh_market_watch.py'
      - 'scripts/warsh_market_watch_v2.py'
      - 'scripts/warsh_ai_taskforce_watch.py'
      - 'scripts/warsh_ai_taskforce_watch_v2.py'
      - 'scripts/warsh_new_axes_watch.py'
      - 'scripts/warsh_new_axes_watch_v2.py'
      - 'scripts/warsh_new_axes_watch_v3.py'
      - 'scripts/warsh_new_axes_watch_v4.py'
      - 'scripts/warsh_pce_trend_watch.py'
      - 'scripts/warsh_curve_ownership_watch.py'
      - 'scripts/warsh_curve_ownership_watch_v2.py'
      - 'scripts/warsh_credibility_pretightening_watch_v2.py'
      - 'scripts/warsh_energy_shock_watch.py'
      - 'scripts/warsh_ai_rotation_watch.py'
      - 'scripts/warsh_policy_path_watch.py'
      - 'scripts/warsh_policy_path_watch_v2.py'
      - 'scripts/warsh_policy_path_watch_v3.py'
      - 'scripts/warsh_policy_path_watch_v4.py'
      - 'scripts/warsh_policy_source_guard.py'
      - 'scripts/test_warsh_policy_safety.py'
      - 'scripts/warsh_balance_sheet_watch.py'
      - 'scripts/warsh_balance_sheet_watch_v2.py'
      - 'scripts/warsh_sep_path_watch.py'
      - 'scripts/warsh_sep_path_watch_v2.py'
      - 'scripts/warsh_ib_consensus_watch.py'
      - 'scripts/warsh_post_fomc_ib_reaction_watch.py'
      - 'scripts/warsh_fomc_event_watch.py'
      - 'scripts/warsh_fomc_event_watch_v2.py'
      - 'scripts/warsh_fomc_event_watch_v3.py'
      - 'scripts/warsh_fomc_event_watch_v4.py'
      - 'scripts/warsh_fomc_minutes_watch.py'
      - 'tests/test_warsh_fomc_minutes_watch.py'
      - 'scripts/warsh_press_conference_watch.py'
      - 'scripts/warsh_press_conference_watch_v2.py'
      - 'scripts/warsh_press_conference_watch_v3.py'
      - 'scripts/market_internal_strength_watch.py'
      - '.github/workflows/warsh-reaction-telegram-watch.yml'

permissions:
  contents: write

concurrency:
  group: warsh-reaction-telegram-watch
  # 완료 전 새 push가 이전 전송 작업을 취소하면 message_id와 상태파일이 어긋날 수 있다.
  # 같은 활성 경로에서는 실행을 직렬화하고 전송 중 강제취소하지 않는다.
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check official sources and notify macro Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.WARSH_TELEGRAM_BOT_TOKEN || secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
          EXPECTED_BOT_USERNAME: ${{ secrets.WARSH_TELEGRAM_BOT_TOKEN != '' && 'hshs8879_bot' || 'khs8879887988798879_bot' }}
          FORCE_NOTIFY: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_notify) && '1' || '0' }}
          STARTUP_NOTIFY: '0'
          TREASURY_2Y_ALERT_BP: '10'
          TREASURY_CURVE_ALERT_BP: '5'
          TREASURY_BUYBACK_LONG_END_BP: '5'
          TREASURY_BUYBACK_CURVE_BP: '3'
          WARSH_PRETIGHTEN_2Y_BP: '15'
          WARSH_PRETIGHTEN_CURVE_BP: '8'
          WARSH_PRETIGHTEN_LOOKBACK: '5'
          WARSH_CREDIBILITY_STEEPEN_BP: '8'
          WARSH_CREDIBILITY_LONG_END_BP: '5'
          WARSH_ENERGY_BRENT_USD: '100'
          WARSH_ENERGY_20D_PCT: '15'
          WARSH_OIL10Y_CORR_WARN: '0.50'
          WARSH_OIL10Y_CORR_STRONG: '0.60'
          WARSH_OIL10Y_BETA_BP_PER_1PCT: '1.0'
          WARSH_OIL10Y_LOOKBACK: '63'
          WARSH_OIL10Y_MOVE_DAYS: '5'
          WARSH_PATH_PROB_ALERT_PP: '15'
          WARSH_PATH_EXTRA_ALERT_BP: '10'
          WARSH_PATH_MARKET_SEP_GAP_BP: '10'
          WARSH_BALANCE_ASSET_4W_BN: '75'
          WARSH_BALANCE_RESERVE_4W_BN: '100'
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          probe = urllib.parse.urlencode({'text': 'Headline PCE MoM YoY | Fed | Treasury | 2Y'})
          decoded = urllib.parse.unquote_plus(probe)
          assert '종합 PCE' in decoded and '연준(Fed)' in decoded and '미 재무부(Treasury)' in decoded and '2년물' in decoded, decoded
          print('한글 알림 표기 가드 정상')

          token = (os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          expected = (os.getenv('EXPECTED_BOT_USERNAME') or '').strip().lstrip('@')
          chat_id = (os.getenv('TELEGRAM_CHAT_ID') or '').strip()
          if not token:
              raise RuntimeError('Warsh Telegram bot token is missing')
          if not chat_id:
              raise RuntimeError('GLOBAL_RATES_TELEGRAM_CHAT_ID is missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              data = json.loads(r.read().decode('utf-8'))
          username = str((data.get('result') or {}).get('username') or '')
          if not data.get('ok') or username.lower() != expected.lower():
              raise RuntimeError(f'Wrong Warsh Telegram bot: expected @{expected}, got @{username or "unknown"}')
          print(f'warsh_macro_route_valid=true bot=@{username} chat_id_present=true')
          PY
          python -m py_compile \
            scripts/warsh_policy_source_guard.py \
            scripts/warsh_policy_path_watch_v3.py \
            scripts/warsh_policy_path_watch_v4.py \
            scripts/warsh_fomc_event_watch_v4.py \
            scripts/warsh_fomc_minutes_watch.py \
            scripts/warsh_press_conference_watch_v3.py
          python scripts/test_warsh_policy_safety.py

          MACRO_RC=0
          run_watch() {
            WATCH="$1"
            echo "::group::${WATCH}"
            if ! python -m py_compile "$WATCH"; then
              echo "::error::${WATCH} compile failed; remaining Warsh watchers will continue."
              MACRO_RC=1
              echo "::endgroup::"
              return 0
            fi
            OK=0
            for ATTEMPT in 1 2; do
              if timeout 150 python "$WATCH"; then
                OK=1
                break
              fi
              echo "::warning::${WATCH} attempt ${ATTEMPT}/2 failed; retrying independently."
              sleep $((ATTEMPT * 3))
            done
            if [ "$OK" -ne 1 ]; then
              echo "::error::${WATCH} failed after 2 attempts; remaining Warsh watchers will continue."
              MACRO_RC=1
            fi
            echo "::endgroup::"
          }

          if python -m unittest discover -s tests -p 'test_warsh_fomc_minutes_watch.py' -v; then
            run_watch scripts/warsh_fomc_minutes_watch.py
          else
            echo '::error::FOMC 의사록 회귀검증 실패 — 해당 감시는 중단하고 나머지는 유지'
            MACRO_RC=1
          fi

          run_watch scripts/warsh_reaction_watch_v4.py
          run_watch scripts/warsh_speech_watch.py
          run_watch scripts/warsh_inflation_market_watch.py
          run_watch scripts/warsh_market_watch_v2.py
          run_watch scripts/warsh_ai_taskforce_watch_v2.py
          run_watch scripts/warsh_new_axes_watch_v4.py
          run_watch scripts/warsh_pce_trend_watch.py
          run_watch scripts/warsh_curve_ownership_watch_v2.py
          run_watch scripts/warsh_credibility_pretightening_watch_v2.py
          run_watch scripts/warsh_energy_shock_watch.py
          run_watch scripts/warsh_balance_sheet_watch_v2.py
          run_watch scripts/warsh_sep_path_watch_v2.py
          run_watch scripts/warsh_policy_path_watch_v4.py
          run_watch scripts/warsh_ib_consensus_watch.py
          run_watch scripts/warsh_post_fomc_ib_reaction_watch.py
          run_watch scripts/warsh_fomc_event_watch_v4.py
          run_watch scripts/warsh_press_conference_watch_v3.py
          exit "$MACRO_RC"

      - name: Check AI rotation and US market internal strength on exact Telegram
        if: ${{ always() && !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.KOSPI_DERIV_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.KOSPI_DERIV_TELEGRAM_CHAT_ID || secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
          EXPECTED_BOT_USERNAME: khs887900887900008879_bot
          FORCE_NOTIFY: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_notify) && '1' || '0' }}
          WARSH_ROTATION_3D_PP: '3'
          WARSH_ROTATION_5D_PP: '5'
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = (os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          chat_id = (os.getenv('TELEGRAM_CHAT_ID') or '').strip()
          expected = (os.getenv('EXPECTED_BOT_USERNAME') or '').strip().lstrip('@')
          if not token:
              raise RuntimeError('KOSPI_DERIV_TELEGRAM_BOT_TOKEN secret is missing')
          if not chat_id:
              raise RuntimeError('KOSPI_DERIV_TELEGRAM_CHAT_ID and GLOBAL_RATES_TELEGRAM_CHAT_ID are both missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              data = json.loads(r.read().decode('utf-8'))
          username = str((data.get('result') or {}).get('username') or '')
          if not data.get('ok') or username.lower() != expected.lower():
              raise RuntimeError(f'Wrong Telegram bot: expected @{expected}, got @{username or "unknown"}')
          print(f'equity_route_valid=true bot=@{username} chat_id_present=true')
          PY
          python -m py_compile scripts/market_internal_strength_watch.py
          AI_ROTATION_RC=0
          python scripts/warsh_ai_rotation_watch.py || AI_ROTATION_RC=$?
          MARKET_INTERNAL_RC=0
          python scripts/market_internal_strength_watch.py || MARKET_INTERNAL_RC=$?
          if [ "$AI_ROTATION_RC" -ne 0 ]; then
            echo "::warning::AI rotation watcher failed independently with exit code $AI_ROTATION_RC; market internal watcher still executed."
          fi
          exit "$MARKET_INTERNAL_RC"

      - name: Ignore timestamp-only state changes
        if: ${{ always() && !cancelled() }}
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          paths = [
              pathlib.Path('data/warsh_reaction_watch_state.json'),
              pathlib.Path('data/warsh_speech_watch_state.json'),
              pathlib.Path('data/warsh_inflation_market_watch_state.json'),
              pathlib.Path('data/warsh_market_watch_state.json'),
              pathlib.Path('data/warsh_ai_taskforce_watch_state.json'),
              pathlib.Path('data/warsh_new_axes_watch_state.json'),
              pathlib.Path('data/warsh_pce_trend_watch_state.json'),
              pathlib.Path('data/warsh_curve_ownership_watch_state.json'),
              pathlib.Path('data/warsh_credibility_pretightening_watch_state.json'),
              pathlib.Path('data/warsh_energy_shock_watch_state.json'),
              pathlib.Path('data/warsh_ai_rotation_watch_state.json'),
              pathlib.Path('data/warsh_policy_path_watch_state.json'),
              pathlib.Path('data/warsh_balance_sheet_watch_state.json'),
              pathlib.Path('data/warsh_sep_path_watch_state.json'),
              pathlib.Path('data/warsh_ib_consensus_watch_state.json'),
              pathlib.Path('data/warsh_post_fomc_ib_reaction_watch_state.json'),
              pathlib.Path('data/warsh_fomc_event_watch_state.json'),
              pathlib.Path('data/warsh_fomc_minutes_watch_state.json'),
              pathlib.Path('data/warsh_press_conference_watch_state.json'),
              pathlib.Path('data/market_internal_strength_watch_state.json'),
          ]
          for path in paths:
              if not path.exists():
                  continue
              probe = subprocess.run(['git', 'cat-file', '-e', f'HEAD:{path.as_posix()}'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if probe.returncode != 0:
                  continue
              old_raw = subprocess.check_output(['git', 'show', f'HEAD:{path.as_posix()}'], text=True)
              old = json.loads(old_raw)
              new = json.loads(path.read_text(encoding='utf-8'))
              old.pop('updated_at_utc', None)
              new.pop('updated_at_utc', None)
              if old == new:
                  subprocess.run(['git', 'checkout', '--', path.as_posix()], check=True)
          PY

      - name: Persist deduplication baselines
        if: ${{ always() && !cancelled() }}
        run: |
          CHANGED="$(git status --porcelain -- data/warsh_reaction_watch_state.json data/warsh_speech_watch_state.json data/warsh_inflation_market_watch_state.json data/warsh_market_watch_state.json data/warsh_ai_taskforce_watch_state.json data/warsh_new_axes_watch_state.json data/warsh_pce_trend_watch_state.json data/warsh_curve_ownership_watch_state.json data/warsh_credibility_pretightening_watch_state.json data/warsh_energy_shock_watch_state.json data/warsh_ai_rotation_watch_state.json data/warsh_policy_path_watch_state.json data/warsh_balance_sheet_watch_state.json data/warsh_sep_path_watch_state.json data/warsh_ib_consensus_watch_state.json data/warsh_post_fomc_ib_reaction_watch_state.json data/warsh_fomc_event_watch_state.json data/warsh_fomc_minutes_watch_state.json data/warsh_press_conference_watch_state.json data/market_internal_strength_watch_state.json)"
          if [ -z "$CHANGED" ]; then
            echo 'No meaningful state change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/warsh_reaction_watch_state.json data/warsh_speech_watch_state.json data/warsh_inflation_market_watch_state.json data/warsh_market_watch_state.json data/warsh_ai_taskforce_watch_state.json data/warsh_new_axes_watch_state.json data/warsh_pce_trend_watch_state.json data/warsh_curve_ownership_watch_state.json data/warsh_credibility_pretightening_watch_state.json data/warsh_energy_shock_watch_state.json data/warsh_ai_rotation_watch_state.json data/warsh_policy_path_watch_state.json data/warsh_balance_sheet_watch_state.json data/warsh_sep_path_watch_state.json data/warsh_ib_consensus_watch_state.json data/warsh_post_fomc_ib_reaction_watch_state.json data/warsh_fomc_event_watch_state.json data/warsh_fomc_minutes_watch_state.json data/warsh_press_conference_watch_state.json data/market_internal_strength_watch_state.json
          git commit -m 'Update Warsh reaction watch state'
          for ATTEMPT in 1 2 3 4; do
            git pull --rebase -X theirs origin main || { git rebase --abort || true; }
            if git push; then
              exit 0
            fi
            echo "State push race detected; retry $ATTEMPT/4"
            sleep $((ATTEMPT * 2))
          done
          echo 'Failed to persist Warsh state after retries.' >&2
          exit 1
