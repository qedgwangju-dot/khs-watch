name: Jobs Wage Telegram Route Test

on:
  push:
    paths:
      - ".github/workflows/jobs-wage-telegram-route-test.yml"

permissions:
  contents: read

jobs:
  route-test:
    if: github.event.head_commit.message == 'Verify Jobs Wage Telegram route'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"
      TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
    steps:
      - name: Verify bot identity and send route test
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=(os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          chat_id=(os.getenv('TELEGRAM_CHAT_ID_PRIMARY') or os.getenv('TELEGRAM_CHAT_ID_FALLBACK') or '').strip()
          expected=(os.getenv('EXPECTED_TELEGRAM_BOT_USERNAME') or '').strip().lstrip('@')
          if not token: raise RuntimeError('Telegram bot token missing')
          if not chat_id: raise RuntimeError('Telegram chat id missing')
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=20) as r:
              me=json.loads(r.read().decode())
          username=str((me.get('result') or {}).get('username') or '')
          if not me.get('ok') or username.lower()!=expected.lower():
              raise RuntimeError(f'Wrong Telegram bot: expected @{expected}, got @{username or "unknown"}')
          text='✅ Jobs Wage Watch 연결 확인\n이 텔레그램으로 새 BLS·Weekly Claims·ADP 공식 발표 알림을 보내도록 연결되어 있습니다.\n새 공식 발표가 없으면 알림을 보내지 않습니다.'
          payload=urllib.parse.urlencode({'chat_id':chat_id,'text':text,'disable_web_page_preview':'true'}).encode()
          req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage',data=payload,method='POST')
          with urllib.request.urlopen(req,timeout=20) as r:
              out=json.loads(r.read().decode())
          if not out.get('ok'):
              raise RuntimeError(f'Telegram rejected message: {out}')
          print(f"telegram_route_test_ok=true bot=@{username} message_id={out.get('result',{}).get('message_id')}")
          PY
