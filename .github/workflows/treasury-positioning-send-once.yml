name: Treasury Positioning Send Once

on:
  push:
    paths:
      - ".github/workflows/treasury-positioning-send-once.yml"

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs8879887988798879_bot"
      FORCE_SEND: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Verify exact Telegram bot
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=(os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          expected=(os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip()
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe",timeout=25) as r:
              p=json.loads(r.read().decode())
          actual=str((p.get("result") or {}).get("username") or "")
          if not p.get("ok") or actual.lower()!=expected.lower():
              raise RuntimeError(f"Wrong bot: expected @{expected}, got @{actual}")
          print(f"telegram_route_valid=true bot=@{actual}")
          PY
      - name: Send current positioning watch
        run: python scripts/treasury_positioning_watch.py
      - name: Commit positioning state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasury_positioning_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Treasury positioning state"
          git pull --rebase origin main
          git push
