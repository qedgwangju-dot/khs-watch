name: CLARITY Vote Parser Fix Once

on:
  push:
    paths:
      - ".github/workflows/clarity-vote-parser-fix-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Make official schedule parser tolerant to Senate HTML spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          path = Path('scripts/clarity_vote_window_watch.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r"def official_schedule_check\(\):\n.*?\n\ndef roll_call_result\(\):", re.S)
          replacement = '''def schedule_text_matches(text):
              low = clean(text).lower()
              compact = "".join(ch for ch in low if not ch.isspace()).replace(".", "")
              has_bill = "hr3633" in compact or "digitalassetmarketclarityact" in compact
              has_cloture = "cloture" in low
              has_date = "september15" in compact
              has_time = "2:15pm" in compact
              return has_bill and has_cloture and has_date and has_time


def official_schedule_check():
              checks = []
              errors = []
              for label, url in [("Senate Democrats", DEMOCRATS_SCHEDULE), ("U.S. Senate Daily Press", DAILY_PRESS)]:
                  try:
                      text = clean(BeautifulSoup(fetch_text(url), "html.parser").get_text(" ", strip=True))
                      matched = schedule_text_matches(text)
                      checks.append({"source": label, "url": url, "matched": matched})
                  except Exception as exc:
                      checks.append({"source": label, "url": url, "matched": False})
                      errors.append(f"{label}: {exc}")
              return checks, errors


def roll_call_result():'''
          # Normalize indentation in the literal before insertion.
          replacement = '\n'.join(line[14:] if line.startswith('              ') else line for line in replacement.splitlines())
          new_text, count = pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'official_schedule_check replacement count={count}')
          path.write_text(new_text, encoding='utf-8')

          test = Path('tests/test_clarity_vote_window_watch.py')
          t = test.read_text(encoding='utf-8')
          marker = '    def test_lummis_risk_is_not_treated_as_actual_vote_count(self):\n'
          addition = '''    def test_official_schedule_text_tolerates_superscript_spacing(self):
        sample = "The cloture motion with respect to Cal. #423, H.R.3633 - Digital Asset Market Clarity Act will ripen on Tuesday, September 15 th at 2:15pm."
        self.assertTrue(MOD.schedule_text_matches(sample))

'''
          if addition not in t:
              if marker not in t:
                  raise SystemExit('test marker missing')
              t = t.replace(marker, addition + marker)
              test.write_text(t, encoding='utf-8')

          state_path = Path('data/clarity_vote_window_state.json')
          state = json.loads(state_path.read_text(encoding='utf-8')) if state_path.exists() else {}
          seen = set(state.get('seen_context_events') or [])
          seen.update({'lummis_whip_risk_post_final_draft_2026-09-14','bessent_community_bank_circuit_breaker_support_2026-09-14'})
          state['seen_context_events'] = sorted(seen)
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate official schedule against live Senate sources
        run: |
          python -m py_compile scripts/clarity_vote_window_watch.py
          python -m unittest tests/test_clarity_vote_window_watch.py tests/test_clarity_vote_gate_enricher.py -v
          rm -f out/clarity_watch_alert.json
          python scripts/clarity_vote_window_watch.py
          python - <<'PY'
          import json, pathlib
          status = json.loads(pathlib.Path('out/clarity_vote_window_status.json').read_text(encoding='utf-8'))
          print(json.dumps(status, ensure_ascii=False, indent=2))
          if not status.get('schedule_confirmed'):
              raise SystemExit('official Senate schedule did not cross-confirm')
          pending = pathlib.Path('out/clarity_vote_window_pending_state.json')
          pathlib.Path('data/clarity_vote_window_state.json').write_text(pending.read_text(encoding='utf-8'), encoding='utf-8')
          PY
      - name: Commit verified parser correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/clarity_vote_window_watch.py tests/test_clarity_vote_window_watch.py data/clarity_vote_window_state.json
          git commit -m "Fix CLARITY official vote schedule parsing"
          git pull --rebase origin main
          git push origin main
