name: FX source probe once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fx-naver-quote-probe-once.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe KSURE FX list
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://ksureapi.einfomax.co.kr/v2/datafeed/ksure/fxlist?page=1'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              text=r.read().decode('utf-8','replace')
          print('bytes=',len(text))
          for m in re.finditer(r'href=["\']([^"\']*fxview\?id=([^"\'&]+)[^"\']*)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
              title=re.sub(r'<[^>]+>',' ',m.group(3))
              title=re.sub(r'\s+',' ',title).strip()
              if any(k in title for k in ('외국환시세','달러-원','원/달러')):
                  print('ID',m.group(2),'TITLE',title[:250])
          PY
