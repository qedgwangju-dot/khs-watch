name: FX Naver quote probe once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fx-naver-quote-probe-once.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Naver USDKRW payload
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://api.stock.naver.com/marketindex/exchange/FX_USDKRW/prices?page=1&pageSize=5'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://finance.naver.com/'})
          with urllib.request.urlopen(req,timeout=30) as r:
              d=json.loads(r.read().decode('utf-8'))
          rows=d.get('result') if isinstance(d,dict) else d
          print(json.dumps(rows[:3],ensure_ascii=False,indent=2))
          PY
