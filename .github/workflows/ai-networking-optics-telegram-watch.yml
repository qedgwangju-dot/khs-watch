name: AI Networking Optics Telegram Watch

on:
  push:
    paths:
      - ".github/workflows/ai-networking-optics-telegram-watch.yml"
      - "scripts/ai_networking_optics_watch.py"
      - "scripts/currency_krw_guard.py"
  schedule:
    # Direct twice-hourly check, away from top-of-hour congestion.
    - cron: "8,38 * * * *"
  workflow_run:
    # Redundant trigger path: if this workflow's own schedule is delayed/dropped,
    # run after two already-active semiconductor watchers complete.
    workflows:
      - "Vera Rubin SOCAMM Capacity Telegram Watch"
      - "Korea AI Semiconductor Policy Demand Watch"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-networking-optics-telegram-watch
  # Serialize runs instead of cancelling an in-flight state write.
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs88798879887988798879_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate watcher
        run: python -m py_compile scripts/ai_networking_optics_watch.py scripts/currency_krw_guard.py

      - name: Regression test event deduplication
        run: |
          python - <<'PY'
          import importlib.util
          import pathlib

          path = pathlib.Path("scripts/ai_networking_optics_watch.py")
          spec = importlib.util.spec_from_file_location("watch", path)
          watch = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(watch)

          launch_titles = [
              "Coherent launches PhotonLink integrated optics platform for AI infrastructure",
              "Coherent unveils PhotonLink platform for next-generation data centers",
              "Coherent Corp launches PhotonLink integrated optical platform",
              "PhotonLink enables scalable photonic connectivity for AI data centers",
              "How the PhotonLink launch changes the investment story for Coherent stock",
          ]
          items = [{
              "company": "Coherent",
              "title": title,
              "category": "광 링크 통합·수직계열화",
              "source": "test",
              "score": 10,
              "published": "2026-09-21T12:00:00+00:00",
          } for title in launch_titles]

          representative = items[0]
          for item in items[1:]:
              assert watch.same_underlying_story(representative, item), (
                  "Mirror headline was not collapsed into the PhotonLink launch event: " + item["title"]
              )

          contract = {
              "company": "Coherent",
              "title": "Coherent secures new long-term PhotonLink agreement with hyperscale AI customer",
              "category": "고객·장기계약",
              "source": "test",
              "score": 10,
              "published": "2026-10-01T12:00:00+00:00",
          }
          assert not watch.same_underlying_story(representative, contract), (
              "A genuinely new PhotonLink customer-contract event was incorrectly suppressed."
          )

          equipment_a = {
              "company": "CPO Equipment Supply Chain",
              "title": "Chieftek GMT TOYO see CPO equipment orders surge with visibility through Q2 2027",
              "category": "CPO 장비 수주·가시성",
              "source": "test",
              "score": 12,
              "published": "2026-09-28T03:00:00+00:00",
          }
          equipment_b = {
              "company": "CPO Equipment Supply Chain",
              "title": "Taiwan CPO alignment equipment suppliers report 2027 Q2 order visibility as demand accelerates",
              "category": "CPO 장비 수주·가시성",
              "source": "test mirror",
              "score": 11,
              "published": "2026-09-28T04:00:00+00:00",
          }
          equipment_capacity = {
              "company": "CPO Equipment Supply Chain",
              "title": "GMT doubles CPO assembly capacity with new factory line",
              "category": "CPO 장비 증설·가동률",
              "source": "test",
              "score": 10,
              "published": "2026-10-05T03:00:00+00:00",
          }
          assert watch.same_underlying_story(equipment_a, equipment_b), (
              "Mirrored CPO-equipment order story was not deduplicated."
          )
          assert not watch.same_underlying_story(equipment_a, equipment_capacity), (
              "A new CPO-equipment capacity event was incorrectly suppressed as an old order story."
          )
          assert not watch.same_underlying_story(representative, equipment_a), (
              "PhotonLink product news and CPO manufacturing-equipment news must remain separate."
          )

          false_positive_title = "NVIDIA's CPO progress boosts Lumentum shares as AI demand rises"
          assert watch.is_noise(false_positive_title + " KuCoin"), (
              "Stock-reaction/crypto commentary must never trigger the structural optics alert."
          )
          assert watch.signal_score(false_positive_title, "KuCoin") < 0, (
              "The exact KuCoin/Lumentum false positive was not blocked."
          )

          real_signal_title = "Lumentum receives incremental multi-hundred-million-dollar CPO order deliverable in first half 2027"
          assert watch.signal_score(real_signal_title, "Lumentum") >= 7, (
              "A real Lumentum CPO commercial order should remain eligible."
          )
          assert any(__import__("re").search(p, real_signal_title, __import__("re").I) for p in watch.ACTION_PATTERNS), (
              "A real commercial order must satisfy the action gate."
          )
          assert watch.source_priority("KuCoin") < 65, (
              "KuCoin must remain below the standalone-alert source-quality threshold."
          )
          assert watch.source_priority("Lumentum") >= 65, (
              "Official Lumentum material must remain eligible as a primary source."
          )

          fcc_final = "FCC finalizes restrictions on Chinese-made optical transceivers for 3.2T systems with domestic content requirements"
          assert watch.signal_score(fcc_final, "Reuters") >= 7, "FCC final-rule optics story must trigger"
          assert watch.category_for(fcc_final, "US Optical Policy") == "FCC 광트랜시버 규제"
          assert watch.stage_for(fcc_final) == "최종 규칙·시행"

          senate_bill = "Senate introduces bill restricting Innolight and Eoptolink optical transceivers in national security systems"
          assert watch.signal_score(senate_bill, "Reuters") >= 7, "Congressional optics restriction must trigger"
          assert watch.category_for(senate_bill, "US Optical Policy") == "미국 광트랜시버 규제·법안"
          assert watch.stage_for(senate_bill) == "법안 발의·입법"

          inp_supply = "AXT InP substrate shortage worsens as export license delays constrain optical laser supply"
          assert watch.signal_score(inp_supply, "AXT") >= 7, "InP substrate/export-license bottleneck must trigger"
          assert watch.category_for(inp_supply, "AXT") == "InP 수출허가·공급망"
          assert watch.stage_for(inp_supply) == "수출허가·공급망 규제"

          assert watch.canonical_story_key("US Optical Policy", fcc_final) == "us-optical-policy|fcc|final"
          assert watch.canonical_story_key("US Optical Policy", senate_bill) == "us-optical-policy|congress|bill"

          scenario_65 = "Morgan Stanley sees FCC 3.2T optical transceiver restrictions with 65% domestic content exemption"
          scenario_75 = "FCC optical transceiver proposal moves domestic-content threshold to 75%"
          assert watch.canonical_story_key("US Optical Policy", scenario_65) != watch.canonical_story_key("US Optical Policy", scenario_75), (
              "A 65% to 75% content-threshold change must become a new alert stage."
          )

          generic_inp = "InP substrate lead times extend as indium phosphide capacity tightens for AI optical transceivers"
          assert watch.signal_score(generic_inp, "Reuters") >= 7, "Generic InP supply bottleneck must trigger"
          assert watch.category_for(generic_inp, "InP Supply Chain") == "InP 기판 병목"

          inp_export = "AXT InP substrate export license delays constrain 1.6T optical laser supply"
          assert watch.signal_score(inp_export, "AXT") >= 7, "InP export-license bottleneck must trigger"
          assert watch.category_for(inp_export, "AXT") == "InP 수출허가·공급망"

          aaoi_ramp = "Applied Optoelectronics expands 1.6T transceiver capacity for hyperscaler shipments"
          assert watch.signal_score(aaoi_ramp, "Applied Optoelectronics") >= 7, "AAOI capacity/shipments must trigger"
          assert watch.category_for(aaoi_ramp, "Applied Optoelectronics") == "1.6T 전환"

          inp_capacity = "AXT and Lumentum sign six-year InP substrate capacity reservation with $87 million deposits for AI optical links"
          assert watch.signal_score(inp_capacity, "AXT") >= 7, "InP capacity reservation must trigger"
          assert watch.category_for(inp_capacity, "AXT") == "InP 기판 장기계약·생산능력"

          gaas_optical = "WIN Semiconductors expands GaAs optical communications capacity as 1.6T demand accelerates"
          assert watch.signal_score(gaas_optical, "DIGITIMES") >= 7, "GaAs optical capacity story must trigger"
          assert watch.category_for(gaas_optical, "GaAs Optical Supply Chain") == "GaAs 광통신 기판·파운드리"

          power_only = "SiC 6-inch substrate demand recovers as 800V HVDC data center power conversion accelerates"
          assert not __import__("re").search(r"\bInP\b|indium phosphide|\bGaAs\b|gallium arsenide|砷化鎵|optical|transceiver|CPO|1\.6T|3\.2T|laser|photodiode", power_only, __import__("re").I), (
              "Power-only SiC/HVDC story must stay outside the optical-material alert."
          )

          volantis_funding = "Volantis raises $88M Series A to build photonic AI inference system"
          assert watch.signal_score(volantis_funding, "Reuters") >= 7, "Volantis photonic-memory funding signal must trigger"
          assert watch.category_for(volantis_funding, "Volantis") == "광메모리 투자·개발자금"
          assert watch.stage_for(volantis_funding) == "투자·개발자금"
          assert watch.canonical_story_key("Volantis", volantis_funding) == "volantis|funding|series-a"

          volantis_customer = "Volantis A-1 integrated inference engines begin customer sampling for 2027 delivery"
          assert watch.signal_score(volantis_customer, "Volantis") >= 7, "Volantis customer-sampling signal must trigger"
          assert watch.category_for(volantis_customer, "Volantis") == "광메모리 고객검증·상용화"
          assert watch.stage_for(volantis_customer) == "고객 샘플·배치"

          volantis_perf = "Volantis A-1 silicon demonstrates 240 TB/s optical memory bandwidth at under 1 pJ/bit"
          assert watch.signal_score(volantis_perf, "Volantis") >= 7, "Volantis measured-performance signal must trigger"
          assert watch.category_for(volantis_perf, "Volantis") == "광메모리 성능·검증"

          volantis_reach = "Volantis A-1 measured optical interposer reaches 200mm with over 220 memory chiplets at sub-5ns latency and BER <1e-12"
          assert watch.signal_score(volantis_reach, "Volantis") >= 7, "Volantis measured reach/latency/BER signal must trigger"
          assert watch.category_for(volantis_reach, "Volantis") == "광메모리 성능·검증"
          assert watch.canonical_story_key("Volantis", volantis_reach) == "volantis|a1|silicon-performance"

          assert watch.VOLANTIS_VERIFIED_BASELINE["series_a_usd_m"] == 88.0
          assert watch.VOLANTIS_VERIFIED_BASELINE["total_raised_usd_m"] == 97.0
          assert watch.VOLANTIS_VERIFIED_BASELINE["first_customer_delivery_year"] == 2027
          assert watch.VOLANTIS_VERIFIED_BASELINE["memory_chiplets_min"] == 220
          assert watch.VOLANTIS_VERIFIED_BASELINE["silicon_photonics_current_architecture_confirmed"] is False
          assert watch.VOLANTIS_VERIFIED_BASELINE["model_target_public_material_discrepancy"] is True

          lightmatter_sample = "Lightmatter Passage CPO begins customer sampling for AI scale-up deployment"
          assert watch.signal_score(lightmatter_sample, "Lightmatter") >= 7, "Lightmatter commercial photonics signal must trigger"
          assert watch.category_for(lightmatter_sample, "Lightmatter") == "광컴퓨팅 상용화·고객검증"

          ayar_hvm = "Ayar Labs raises $150 million to expand high-volume manufacturing for CPO deployment"
          assert watch.signal_score(ayar_hvm, "Ayar Labs") >= 7, "Ayar Labs manufacturing funding must trigger"
          assert watch.category_for(ayar_hvm, "Ayar Labs") == "광컴퓨팅 투자·양산확대"
          assert watch.stage_for(ayar_hvm) == "투자·개발자금"

          celestial_ramp = "Marvell says Celestial AI Photonic Fabric revenue will ramp in fiscal 2028 to a $500 million annualized run-rate"
          assert watch.signal_score(celestial_ramp, "Marvell") >= 7, "Celestial AI revenue-ramp signal must trigger"
          assert watch.category_for(celestial_ramp, "Marvell") == "Photonic Fabric 매출 램프"

          # Event identity must follow the economic milestone, not the article headline.
          # A future Volantis financing round must never be swallowed by the old $88M Series A.
          volantis_series_b = "Volantis raises $140M Series B financing for A-1 production"
          assert watch.canonical_story_key("Volantis", volantis_series_b) != "volantis|funding|series-a"
          assert "series-b" in watch.canonical_story_key("Volantis", volantis_series_b)

          # Ayar's Sep-2026 additional $150M / $650M total primary capital are one event.
          ayar_funding_a = "Ayar Labs raises additional $150 million funding in 2026 for high-volume manufacturing"
          ayar_funding_b = "Ayar Labs 2026 primary capital reaches $650 million as manufacturing scales"
          assert watch.canonical_story_key("Ayar Labs", ayar_funding_a) == "ayar|funding|2026-primary-650m"
          assert watch.canonical_story_key("Ayar Labs", ayar_funding_b) == "ayar|funding|2026-primary-650m"
          ayar_production = "Ayar Labs begins high-volume manufacturing and customer deployment of TeraPHY"
          assert watch.canonical_story_key("Ayar Labs", ayar_production) != "ayar|funding|2026-primary-650m"

          # Lightmatter's known 1.6Tbps Passage sample and NVLink-Fusion membership are separate milestones.
          lightmatter_old_sample = "Lightmatter Passage customer sampling reaches 1.6 Tbps per fiber"
          assert watch.canonical_story_key("Lightmatter", lightmatter_old_sample) == "lightmatter|passage|sampling|1.6tbps-per-fiber"
          assert watch.canonical_story_key("Lightmatter", "Lightmatter joins NVIDIA NVLink Fusion ecosystem") == "lightmatter|nvlink-fusion|ecosystem"

          # Marvell/Celestial: repeat coverage of the original FY28 $500M guide is old,
          # but a changed guide, customer qualification, and production shipment are distinct events.
          celestial_old_guide = "Marvell Celestial AI Photonic Fabric targets $500 million annualized run-rate in FY28"
          celestial_changed_guide = "Marvell raises Celestial AI Photonic Fabric FY28 run-rate guidance to $600 million"
          assert watch.canonical_story_key("Marvell", celestial_old_guide) == "marvell|celestial|revenue-guidance|v1"
          assert watch.canonical_story_key("Marvell", celestial_changed_guide) != "marvell|celestial|revenue-guidance|v1"
          celestial_customer = "Marvell Celestial AI Photonic Fabric wins customer design win and qualification milestone"
          celestial_ship = "Marvell Celestial AI Photonic Fabric begins volume production shipments"
          assert watch.category_for(celestial_customer, "Marvell") == "Photonic Fabric 고객검증·수주"
          assert watch.category_for(celestial_ship, "Marvell") == "Photonic Fabric 양산·출하"

          # A silent run must preserve the last proven Telegram send metadata.
          previous_delivery = {
              "last_successful_delivery_kst": "2026-10-01T12:34:56+09:00",
              "telegram_message_ids": [12345, 12346],
              "bot_username": "khs88798879887988798879_bot",
          }
          carried = watch.preserve_delivery_metadata(previous_delivery, {"initialized": True})
          assert carried["last_successful_delivery_kst"] == previous_delivery["last_successful_delivery_kst"]
          assert carried["telegram_message_ids"] == previous_delivery["telegram_message_ids"]
          assert carried["bot_username"] == previous_delivery["bot_username"]

          print("dedupe_and_quality_regression_test=passed")
          PY

      - name: Validate exact requested Telegram route without sending
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HBM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("HBM_TELEGRAM_BOT_TOKEN secret is missing")
          if not chat_id:
              raise RuntimeError("HBM_TELEGRAM_CHAT_ID secret is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{username}")
          PY

      - name: Check AI networking, optics and Corning signals
        run: python scripts/ai_networking_optics_watch.py

      - name: Translate alert to Korean, remove source timestamp, and convert currency to KRW
        if: hashFiles('out/ai_networking_optics_watch_telegram.html') != ''
        run: |
          python - <<'PY'
          import datetime as dt
          import html
          import json
          import pathlib
          import re
          import time
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          path = pathlib.Path("out/ai_networking_optics_watch_telegram.html")
          text = path.read_text(encoding="utf-8")
          kst = ZoneInfo("Asia/Seoul")

          keep_terms = [
              "NVIDIA", "Broadcom", "Arista Networks", "Marvell", "Lumentum",
              "Coherent", "Astera Labs", "Corning", "Samsung Electronics", "Samsung Foundry",
              "Chieftek", "Chieftek Precision", "GMT Global", "GMT GLOBAL",
              "TOYO Automation", "ficonTEC", "Suruga Seiki", "Allring Tech", "FitTech",
              "PhotonLink", "Spectrum-X", "NVLink", "BlueField", "Tomahawk", "Thor",
              "CPO", "NPO", "SiPh", "InP", "PIC", "FAU", "ELS", "OSAT", "CAPA",
              "DSP", "PCIe", "CXL",
              "GPU", "XPU", "AI", "1.6T", "3.2T", "800G", "100Tbps", "FY25", "FY26",
              "FY27", "FY28", "FCC", "Covered List", "Buy American", "InP", "AXT", "AXTI",
              "AAOI", "Applied Optoelectronics", "Innolight", "Eoptolink", "HBOM", "SBOM",
              "Morgan Stanley", "Marc Lehman", "Sumitomo Electric", "IQE",
              "Volantis", "A-1", "Lightmatter", "Passage", "Ayar Labs", "TeraPHY", "SuperNova",
              "Xscape Photonics", "FalconX", "ChromX", "CombX", "Celestial AI",
              "GaAs", "gallium arsenide", "WIN Semiconductors", "WIN Semi",
              "VPEC", "Visual Photonics Epitaxy", "Casela", "AXT-Tongmei", "Tongmei",
              "AVGO", "NVDA", "ANET", "MRVL", "LITE", "COHR", "ALAB", "GLW", "005930.KS",
          ]

          DISPLAY_KO = {
              "NVIDIA": "엔비디아",
              "Broadcom": "브로드컴",
              "Arista Networks": "아리스타 네트웍스",
              "Marvell": "마벨",
              "Lumentum": "루멘텀",
              "Coherent": "코히런트",
              "Astera Labs": "아스테라 랩스",
              "Corning": "코닝",
              "Samsung Electronics": "삼성전자",
              "Samsung Foundry": "삼성전자 파운드리",
              "Chieftek Precision": "즈더",
              "Chieftek": "즈더",
              "GMT Global": "가오밍톄",
              "GMT GLOBAL": "가오밍톄",
              "TOYO Automation": "둥유다",
              "TOYO": "둥유다",
              "ficonTEC": "피콘텍",
              "Suruga Seiki": "스루가세이키",
              "Allring Tech": "올링테크",
              "FitTech": "핏테크",
              "PhotonLink": "포톤링크",
              "直得": "즈더",
              "高明鐵": "가오밍톄",
              "東佑達": "둥유다",
              "萬潤": "완룬",
              "WIN Semiconductors": "윈 세미컨덕터스",
              "WIN Semi": "윈 세미",
              "Visual Photonics Epitaxy": "VPEC",
              "Casela": "카셀라",
              "Sumitomo Electric": "스미토모전기공업",
              "Volantis": "볼란티스",
              "Lightmatter": "라이트매터",
              "Ayar Labs": "아야르 랩스",
              "Xscape Photonics": "엑스케이프 포토닉스",
              "Celestial AI": "셀레스티얼 AI",
          }

          def localize_names(value: str) -> str:
              # Longest names first so e.g. Chieftek Precision is replaced before Chieftek.
              for raw, ko in sorted(DISPLAY_KO.items(), key=lambda kv: len(kv[0]), reverse=True):
                  value = re.sub(re.escape(raw), ko, value, flags=re.I)
              return value

          FX_SYMBOLS = {
              "USD": "KRW=X",
              "EUR": "EURKRW=X",
              "GBP": "GBPKRW=X",
              "JPY": "JPYKRW=X",
              "CNY": "CNYKRW=X",
          }
          CURRENCY_NAMES = {
              "USD": "달러",
              "EUR": "유로",
              "GBP": "파운드",
              "JPY": "엔",
              "CNY": "위안",
          }
          fx_cache = {}

          def strip_publisher_suffix(value: str) -> str:
              publishers = [
                  "Investing.com", "Reuters", "Bloomberg", "Financial Times",
                  "The Wall Street Journal", "CNBC", "DigiTimes", "DIGITIMES",
                  "Barron's", "MarketWatch",
              ]
              for publisher in publishers:
                  value = re.sub(rf"\s+-\s+{re.escape(publisher)}\s*$", "", value, flags=re.I)
              # Google News titles also append publishers not in the preferred list.
              value = re.sub(r"\s+-\s+[A-Za-z0-9][A-Za-z0-9 .&'/-]{1,60}\.com\s*$", "", value, flags=re.I)
              # Remove short trailing publisher labels in English/Chinese/Korean.
              value = re.sub(r"\s+-\s+[^-]{2,50}$", "", value)
              return value.strip()

          def fetch_fx(currency: str):
              if currency in fx_cache:
                  return fx_cache[currency]
              symbol = FX_SYMBOLS[currency]
              errors = []
              try:
                  url = f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(symbol)}?interval=1m&range=1d"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 khs-watch/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  result = (payload.get("chart") or {}).get("result") or []
                  meta = (result[0] if result else {}).get("meta") or {}
                  rate = meta.get("regularMarketPrice")
                  if not rate:
                      closes = (((result[0] if result else {}).get("indicators") or {}).get("quote") or [{}])[0].get("close") or []
                      rate = next((x for x in reversed(closes) if x), None)
                  rate = float(rate)
                  if not (0.001 < rate < 100000):
                      raise ValueError(f"invalid Yahoo FX rate {rate}")
                  value = (rate, "Yahoo Finance", dt.datetime.now(kst).strftime("%Y-%m-%d"))
                  fx_cache[currency] = value
                  return value
              except Exception as exc:
                  errors.append(f"Yahoo: {type(exc).__name__}: {exc}")

              try:
                  url = f"https://api.frankfurter.app/latest?from={currency}&to=KRW"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 khs-watch/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  rate = float((payload.get("rates") or {})["KRW"])
                  value = (rate, "Frankfurter", str(payload.get("date") or dt.datetime.now(kst).date()))
                  fx_cache[currency] = value
                  return value
              except Exception as exc:
                  errors.append(f"Frankfurter: {type(exc).__name__}: {exc}")

              raise RuntimeError(f"{currency}/KRW 환율 조회 실패 — 원화 환산 없는 알림은 발송하지 않습니다: {' | '.join(errors)}")

          def format_krw(value: float) -> str:
              eok = int(round(value / 100_000_000))
              if eok >= 10_000:
                  jo, rem = divmod(eok, 10_000)
                  return f"약 {jo:,}조{rem:,}억원" if rem else f"약 {jo:,}조원"
              if eok >= 1:
                  return f"약 {eok:,}억원"
              man = int(round(value / 10_000))
              return f"약 {man:,}만원"

          def unit_multiplier(unit: str | None) -> float:
              key = (unit or "").strip().lower()
              return {
                  "t": 1e12, "trillion": 1e12,
                  "b": 1e9, "billion": 1e9,
                  "m": 1e6, "million": 1e6,
              }.get(key, 1.0)

          def extract_money(value: str):
              original = html.unescape(value)
              patterns = [
                  ("USD", r"(?:US\$|\$)\s*(?P<num>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>trillion|billion|million|T|B|M)?\b"),
                  ("EUR", r"€\s*(?P<num>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>trillion|billion|million|T|B|M)?\b"),
                  ("GBP", r"£\s*(?P<num>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>trillion|billion|million|T|B|M)?\b"),
                  (None, r"\b(?P<code>USD|EUR|GBP|JPY|CNY)\s*(?P<num>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>trillion|billion|million|T|B|M)?\b"),
              ]
              found = []
              occupied = []
              for fixed_currency, pattern in patterns:
                  for match in re.finditer(pattern, original, flags=re.I):
                      span = match.span()
                      if any(not (span[1] <= used[0] or span[0] >= used[1]) for used in occupied):
                          continue
                      currency = fixed_currency or match.group("code").upper()
                      number = float(match.group("num").replace(",", ""))
                      amount = number * unit_multiplier(match.groupdict().get("unit"))
                      if amount <= 0:
                          continue
                      found.append((match.group(0).strip(), currency, amount))
                      occupied.append(span)
              return found

          def naturalize_dollar_tokens(value: str) -> str:
              def repl_b(match):
                  number = float(match.group(1).replace(",", ""))
                  eok_dollar = number * 10
                  text = f"{eok_dollar:,.2f}".rstrip("0").rstrip(".")
                  return f"{text}억달러"
              def repl_m(match):
                  number = float(match.group(1).replace(",", ""))
                  man_dollar = number * 100
                  text = f"{man_dollar:,.2f}".rstrip("0").rstrip(".")
                  return f"{text}만달러"
              def repl_t(match):
                  number = float(match.group(1).replace(",", ""))
                  text = f"{number:,.2f}".rstrip("0").rstrip(".")
                  return f"{text}조달러"
              value = re.sub(r"\$([0-9][0-9,]*(?:\.[0-9]+)?)\s*T\b", repl_t, value, flags=re.I)
              value = re.sub(r"\$([0-9][0-9,]*(?:\.[0-9]+)?)\s*B\b", repl_b, value, flags=re.I)
              value = re.sub(r"\$([0-9][0-9,]*(?:\.[0-9]+)?)\s*M\b", repl_m, value, flags=re.I)
              return value

          def translate_to_korean(value: str) -> str:
              original = strip_publisher_suffix(html.unescape(value).strip())

              # Convert known company/product identifiers to Korean before translation.
              # This prevents a fallback or machine translation from dropping the actual subject.
              expected_names = []
              for raw, ko in sorted(DISPLAY_KO.items(), key=lambda kv: len(kv[0]), reverse=True):
                  if re.search(re.escape(raw), original, flags=re.I):
                      expected_names.append(ko)
              expected_names = list(dict.fromkeys(expected_names))

              protected = localize_names(original)
              replacements = {}
              protected_terms = [term for term in keep_terms if term not in DISPLAY_KO]
              for idx, term in enumerate(sorted(protected_terms, key=len, reverse=True)):
                  marker = f"ZXKEEP{idx}QZ"
                  if term in protected:
                      protected = protected.replace(term, marker)
                      replacements[marker] = term

              translated = ""
              last_error = None
              for attempt in range(4):
                  try:
                      params = urllib.parse.urlencode({
                          "client": "gtx",
                          "sl": "auto",
                          "tl": "ko",
                          "dt": "t",
                          "q": protected,
                      })
                      req = urllib.request.Request(
                          "https://translate.googleapis.com/translate_a/single?" + params,
                          headers={"User-Agent": "Mozilla/5.0 khs-watch/1.0"},
                      )
                      with urllib.request.urlopen(req, timeout=25) as response:
                          payload = json.loads(response.read().decode("utf-8"))
                      translated = "".join(
                          str(segment[0]) for segment in (payload[0] or [])
                          if segment and segment[0]
                      ).strip()
                      if translated:
                          break
                  except Exception as exc:
                      last_error = exc
                      if attempt < 3:
                          time.sleep(2 ** attempt)

              # No lossy summary fallback. If accurate Korean translation is unavailable,
              # hold the alert and retry on the next run instead of sending a distorted title.
              if not translated:
                  raise RuntimeError(
                      f"Korean translation unavailable; alert held for retry: {type(last_error).__name__ if last_error else 'empty result'}"
                  )

              for marker, term in replacements.items():
                  translated = translated.replace(marker, term)
              translated = localize_names(translated)
              translated = naturalize_dollar_tokens(translated)
              translated = re.sub(r"\s+", " ", translated).strip()

              if not re.search(r"[가-힣]", translated):
                  raise RuntimeError(f"No Korean text after translation; refusing to send: {original}")
              if re.search(r"[\u3400-\u4DBF\u4E00-\u9FFF]", translated):
                  raise RuntimeError(f"Chinese/Hanja remained after translation; refusing to send: {translated}")

              # Semantic fidelity guard: every named company/product present in the raw
              # headline must still be present in the Korean headline.
              missing = [name for name in expected_names if name not in translated]
              if missing:
                  raise RuntimeError(
                      "Translated title lost named subject(s) "
                      + ", ".join(missing)
                      + f"; refusing to send. raw={original} translated={translated}"
                  )
              return translated

          output = []
          for line in text.splitlines():
              if line.startswith("• 출처·시각:"):
                  continue
              if line.startswith("• 원문 제목:"):
                  raw_title = line.split(":", 1)[1].strip()
                  translated = translate_to_korean(raw_title)
                  output.append(f"• 제목: {html.escape(translated)}")
                  continue
              output.append(line)

          rendered = "\n".join(output).strip() + "\n"

          # User-facing prose must not contain untranslated Chinese/Hanja.
          # Product/standard identifiers such as CPO, NPO, SiPh, InP and tickers may remain.
          visible = re.sub(r"https?://\S+", "", html.unescape(rendered))
          if re.search(r"[\u3400-\u4DBF\u4E00-\u9FFF]", visible):
              raise RuntimeError("Chinese/Hanja remained in Telegram alert; refusing to send.")

          path.write_text(rendered, encoding="utf-8")
          print("telegram_alert_korean_translation=true chinese_hanja_guard=true source_timestamp_removed=true")
          PY
          python scripts/currency_krw_guard.py out/ai_networking_optics_watch_telegram.html

      - name: Validate immediate KRW conversion rule
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, str(pathlib.Path("scripts").resolve()))
          import currency_krw_guard as g
          from unittest.mock import patch

          with patch.object(g, "_rate", return_value=(1343.19, "test")):
              out = g.enforce_text("Series A 8,800만달러")
          assert "8,800만달러(" in out
          assert "약 1,182억원" in out
          g.validate_text(out)
          print("immediate_krw_parentheses_rule=passed")
          PY

      - name: Publish watcher summary
        if: always()
        run: |
          if [ -f out/ai_networking_optics_watch_status.md ]; then
            cat out/ai_networking_optics_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "AI 네트워킹·광통신 감시 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            echo "검증 전용 실행: 코드 push에서는 Telegram 전송 및 감시 기준선 갱신을 금지합니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/ai_networking_optics_watch_telegram.html ]; then
            printf '\n---\n\nTelegram 알림 미리보기:\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/ai_networking_optics_watch_telegram.html >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send meaningful new signal to exact requested Telegram bot
        # Defensive two-phase rollout: code pushes validate but may not emit
        # market alerts or consume the baseline. Only schedule/workflow_run or
        # an intentional manual run may deliver new confirmed events.
        if: github.event_name != 'push' && hashFiles('out/ai_networking_optics_watch_telegram.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HBM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("HBM Telegram token/chat id is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          text = pathlib.Path("out/ai_networking_optics_watch_telegram.html").read_text(encoding="utf-8").strip()
          if not text:
              raise RuntimeError("Telegram alert is empty")

          def split_message(value, limit=3900):
              chunks, current = [], ""
              for paragraph in value.split("\n\n"):
                  candidate = paragraph if not current else current + "\n\n" + paragraph
                  if len(candidate) <= limit:
                      current = candidate
                      continue
                  if current:
                      chunks.append(current)
                      current = ""
                  while len(paragraph) > limit:
                      cut = paragraph.rfind("\n", 0, limit)
                      if cut < 1:
                          cut = limit
                      chunks.append(paragraph[:cut])
                      paragraph = paragraph[cut:].lstrip()
                  current = paragraph
              if current:
                  chunks.append(current)
              return chunks

          message_ids = []
          for chunk in split_message(text):
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              message_ids.append((result.get("result") or {}).get("message_id"))

          confirmed = {
              "status": "confirmed",
              "bot_username": username,
              "message_ids": message_ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/ai_networking_optics_watch_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"telegram_delivery_confirmed=true bot=@{username} message_ids={message_ids}")
          PY

      - name: Persist baseline or delivered state
        if: always() && github.event_name != 'push'
        run: |
          if [ ! -f out/ai_networking_optics_watch_telegram.html ] || [ -f out/ai_networking_optics_watch_telegram_confirmed.json ]; then
            if [ -f out/ai_networking_optics_watch_pending_state.json ]; then
              cp out/ai_networking_optics_watch_pending_state.json data/ai_networking_optics_watch_state.json
            fi
          else
            echo "Telegram delivery was not confirmed; watcher state intentionally not advanced."
          fi

      - name: Record confirmed Telegram delivery in watcher state
        if: always() && github.event_name != 'push' && hashFiles('data/ai_networking_optics_watch_state.json') != '' && hashFiles('out/ai_networking_optics_watch_telegram_confirmed.json') != ''
        run: |
          python - <<'PY'
          import json
          import pathlib

          state_path = pathlib.Path("data/ai_networking_optics_watch_state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          confirmed = json.loads(pathlib.Path("out/ai_networking_optics_watch_telegram_confirmed.json").read_text(encoding="utf-8"))
          state["last_successful_delivery_kst"] = confirmed.get("confirmed_at_kst")
          state["telegram_message_ids"] = confirmed.get("message_ids")
          state["bot_username"] = confirmed.get("bot_username")
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit watcher state
        if: always() && github.event_name != 'push'
        run: |
          if [ ! -f data/ai_networking_optics_watch_state.json ]; then
            exit 0
          fi

          # Preserve the freshly generated state, then replay it on top of the
          # latest main branch. This avoids rebase conflicts if another workflow
          # updated the repository while this monitor was running.
          cp data/ai_networking_optics_watch_state.json /tmp/ai_networking_optics_watch_state.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ai_networking_optics_watch_state.json data/ai_networking_optics_watch_state.json
            git add data/ai_networking_optics_watch_state.json

            if git diff --cached --quiet; then
              echo "AI networking optics state unchanged"
              exit 0
            fi

            git commit -m "Update AI networking optics watch state"
            if git push origin HEAD:main; then
              echo "AI networking optics state persisted"
              exit 0
            fi

            echo "State push raced with another update; retrying on latest main (attempt $attempt)"
            sleep $((attempt * 2))
          done

          echo "Failed to persist AI networking optics state after retries"
          exit 1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-networking-optics-watch-${{ github.run_id }}
          path: |
            out/ai_networking_optics_watch_status.md
            out/ai_networking_optics_watch_telegram.html
            out/ai_networking_optics_watch_pending_state.json
            out/ai_networking_optics_watch_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14