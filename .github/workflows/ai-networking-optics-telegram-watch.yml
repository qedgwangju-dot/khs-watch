name: AI Networking Optics Telegram Watch

on:
  push:
    paths:
      - ".github/workflows/ai-networking-optics-telegram-watch.yml"
      - "scripts/ai_networking_optics_watch.py"
      - "data/ai_networking_optics_watch_state.json"
  schedule:
    # GitHub cron is UTC. Check twice per hour; remain silent without a meaningful new signal.
    - cron: "23,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-networking-optics-telegram-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs88798879887988798879_bot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate watcher
        run: python -m py_compile scripts/ai_networking_optics_watch.py

      - name: Validate exact requested Telegram route without sending
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HBM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("HBM_TELEGRAM_BOT_TOKEN secret is missing")
          if not chat_id:
              raise RuntimeError("HBM_TELEGRAM_CHAT_ID secret is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")
          print(f"telegram_route_valid=true bot=@{username}")
          PY

      - name: Check AI networking, optics and Corning signals
        run: python scripts/ai_networking_optics_watch.py

      - name: Translate alert to Korean, remove source timestamp, and convert currency to KRW
        if: hashFiles('out/ai_networking_optics_watch_telegram.html') != ''
        run: |
          python - <<'PY'
          import datetime as dt
          import html
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          path = pathlib.Path("out/ai_networking_optics_watch_telegram.html")
          text = path.read_text(encoding="utf-8")
          kst = ZoneInfo("Asia/Seoul")

          keep_terms = [
              "NVIDIA", "Broadcom", "Arista Networks", "Marvell", "Lumentum",
              "Coherent", "Astera Labs", "Corning", "Spectrum-X", "NVLink",
              "BlueField", "Tomahawk", "Thor", "CPO", "DSP", "PCIe", "CXL",
              "GPU", "XPU", "AI", "1.6T", "3.2T", "800G", "FY25", "FY26",
              "FY27", "FY28", "AVGO", "NVDA", "ANET", "MRVL", "LITE",
              "COHR", "ALAB", "GLW",
          ]

          FX_SYMBOLS = {
              "USD": "KRW=X",
              "EUR": "EURKRW=X",
              "GBP": "GBPKRW=X",
              "JPY": "JPYKRW=X",
              "CNY": "CNYKRW=X",
          }
          CURRENCY_NAMES = {
              "USD": "달러",
              "EUR": "유로",
              "GBP": "파운드",
              "JPY": "엔",
              "CNY": "위안",
          }
          fx_cache = {}

          def strip_publisher_suffix(value: str) -> str:
              publishers = [
                  "Investing.com", "Reuters", "Bloomberg", "Financial Times",
                  "The Wall Street Journal", "CNBC", "DigiTimes", "DIGITIMES",
                  "Barron's", "MarketWatch",
              ]
              for publisher in publishers:
                  value = re.sub(rf"\s+-\s+{re.escape(publisher)}\s*$", "", value, flags=re.I)
              return value.strip()

          def fetch_fx(currency: str):
              if currency in fx_cache:
                  return fx_cache[currency]
              symbol = FX_SYMBOLS[currency]
              errors = []
              try:
                  url = f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(symbol)}?interval=1m&range=1d"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 khs-watch/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  result = (payload.get("chart") or {}).get("result") or []
                  meta = (result[0] if result else {}).get("meta") or {}
                  rate = meta.get("regularMarketPrice")
                  if not rate:
                      closes = (((result[0] if result else {}).get("indicators") or {}).get("quote") or [{}])[0].get("close") or []
                      rate = next((x for x in reversed(closes) if x), None)
                  rate = float(rate)
                  if not (0.001 < rate < 100000):
                      raise ValueError(f"invalid Yahoo FX rate {rate}")
                  value = (rate, "Yahoo Finance", dt.datetime.now(kst).strftime("%Y-%m-%d"))
                  fx_cache[currency] = value
                  return value
              except Exception as exc:
                  errors.append(f"Yahoo: {type(exc).__name__}: {exc}")

              try:
                  url = f"https://api.frankfurter.app/latest?from={currency}&to=KRW"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 khs-watch/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  rate = float((payload.get("rates") or {})["KRW"])
                  value = (rate, "Frankfurter", str(payload.get("date") or dt.datetime.now(kst).date()))
                  fx_cache[currency] = value
                  return value
              except Exception as exc:
                  errors.append(f"Frankfurter: {type(exc).__name__}: {exc}")

              raise RuntimeError(f"{currency}/KRW 환율 조회 실패 — 원화 환산 없는 알림은 발송하지 않습니다: {' | '.join(errors)}")

          def format_krw(value: float) -> str:
              eok = int(round(value / 100_000_000))
              if eok >= 10_000:
                  jo, rem = divmod(eok, 10_000)
                  return f"약 {jo:,}조{rem:,}억원" if rem else f"약 {jo:,}조원"
              if eok >= 1:
                  return f"약 {eok:,}억원"
              man = int(round(value / 10_000))
              return f"약 {man:,}만원"

          def unit_multiplier(unit: str | None) -> float:
              key = (unit or "").strip().lower()
              return {
                  "t": 1e12, "trillion": 1e12,
                  "b": 1e9, "billion": 1e9,
                  "m": 1e6, "million": 1e6,
              }.get(key, 1.0)

          def extract_money(value: str):
              original = html.unescape(value)
              patterns = [
                  ("USD", r"(?:US\$|\$)\s*(?P<num>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>trillion|billion|million|T|B|M)?\b"),
                  ("EUR", r"€\s*(?P<num>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>trillion|billion|million|T|B|M)?\b"),
                  ("GBP", r"£\s*(?P<num>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>trillion|billion|million|T|B|M)?\b"),
                  (None, r"\b(?P<code>USD|EUR|GBP|JPY|CNY)\s*(?P<num>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>trillion|billion|million|T|B|M)?\b"),
              ]
              found = []
              occupied = []
              for fixed_currency, pattern in patterns:
                  for match in re.finditer(pattern, original, flags=re.I):
                      span = match.span()
                      if any(not (span[1] <= used[0] or span[0] >= used[1]) for used in occupied):
                          continue
                      currency = fixed_currency or match.group("code").upper()
                      number = float(match.group("num").replace(",", ""))
                      amount = number * unit_multiplier(match.groupdict().get("unit"))
                      if amount <= 0:
                          continue
                      found.append((match.group(0).strip(), currency, amount))
                      occupied.append(span)
              return found

          def naturalize_dollar_tokens(value: str) -> str:
              def repl_b(match):
                  number = float(match.group(1).replace(",", ""))
                  eok_dollar = number * 10
                  text = f"{eok_dollar:,.2f}".rstrip("0").rstrip(".")
                  return f"{text}억달러"
              def repl_m(match):
                  number = float(match.group(1).replace(",", ""))
                  man_dollar = number * 100
                  text = f"{man_dollar:,.2f}".rstrip("0").rstrip(".")
                  return f"{text}만달러"
              def repl_t(match):
                  number = float(match.group(1).replace(",", ""))
                  text = f"{number:,.2f}".rstrip("0").rstrip(".")
                  return f"{text}조달러"
              value = re.sub(r"\$([0-9][0-9,]*(?:\.[0-9]+)?)\s*T\b", repl_t, value, flags=re.I)
              value = re.sub(r"\$([0-9][0-9,]*(?:\.[0-9]+)?)\s*B\b", repl_b, value, flags=re.I)
              value = re.sub(r"\$([0-9][0-9,]*(?:\.[0-9]+)?)\s*M\b", repl_m, value, flags=re.I)
              return value

          def translate_to_korean(value: str) -> str:
              original = strip_publisher_suffix(html.unescape(value).strip())
              protected = original
              replacements = {}
              for idx, term in enumerate(sorted(keep_terms, key=len, reverse=True)):
                  marker = f"ZXKEEP{idx}QZ"
                  if term in protected:
                      protected = protected.replace(term, marker)
                      replacements[marker] = term

              params = urllib.parse.urlencode({
                  "client": "gtx",
                  "sl": "auto",
                  "tl": "ko",
                  "dt": "t",
                  "q": protected,
              })
              req = urllib.request.Request(
                  "https://translate.googleapis.com/translate_a/single?" + params,
                  headers={"User-Agent": "Mozilla/5.0 khs-watch/1.0"},
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              translated = "".join(
                  str(segment[0]) for segment in (payload[0] or [])
                  if segment and segment[0]
              ).strip()
              for marker, term in replacements.items():
                  translated = translated.replace(marker, term)

              translated = naturalize_dollar_tokens(translated)
              translated = re.sub(r"\s+", " ", translated).strip()
              if not re.search(r"[가-힣]", translated):
                  raise RuntimeError(f"Korean translation failed; refusing to send English title: {original}")
              return translated

          output = []
          for line in text.splitlines():
              if line.startswith("• 출처·시각:"):
                  continue
              if line.startswith("• 원문 제목:"):
                  raw_title = line.split(":", 1)[1].strip()
                  money_items = extract_money(raw_title)
                  translated = translate_to_korean(raw_title)
                  output.append(f"• 제목: {html.escape(translated)}")
                  if money_items:
                      conversions = []
                      for raw_amount, currency, amount in money_items:
                          rate, fx_source, fx_date = fetch_fx(currency)
                          krw = amount * rate
                          conversions.append(
                              f"{raw_amount} → {format_krw(krw)} "
                              f"({currency}/KRW {rate:,.2f}원, {fx_date})"
                          )
                      output.append("• 원화 환산: " + html.escape(" / ".join(conversions)))
                  continue
              output.append(line)

          rendered = "\n".join(output).strip() + "\n"
          path.write_text(rendered, encoding="utf-8")
          print("telegram_alert_korean_translation=true source_timestamp_removed=true krw_conversion=true")
          PY

      - name: Publish watcher summary
        if: always()
        run: |
          if [ -f out/ai_networking_optics_watch_status.md ]; then
            cat out/ai_networking_optics_watch_status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "AI 네트워킹·광통신 감시 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/ai_networking_optics_watch_telegram.html ]; then
            printf '\n---\n\nTelegram 알림 미리보기:\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat out/ai_networking_optics_watch_telegram.html >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send meaningful new signal to exact requested Telegram bot
        if: hashFiles('out/ai_networking_optics_watch_telegram.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HBM_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HBM_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token or not chat_id:
              raise RuntimeError("HBM Telegram token/chat id is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as response:
              identity = json.loads(response.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          text = pathlib.Path("out/ai_networking_optics_watch_telegram.html").read_text(encoding="utf-8").strip()
          if not text:
              raise RuntimeError("Telegram alert is empty")

          def split_message(value, limit=3900):
              chunks, current = [], ""
              for paragraph in value.split("\n\n"):
                  candidate = paragraph if not current else current + "\n\n" + paragraph
                  if len(candidate) <= limit:
                      current = candidate
                      continue
                  if current:
                      chunks.append(current)
                      current = ""
                  while len(paragraph) > limit:
                      cut = paragraph.rfind("\n", 0, limit)
                      if cut < 1:
                          cut = limit
                      chunks.append(paragraph[:cut])
                      paragraph = paragraph[cut:].lstrip()
                  current = paragraph
              if current:
                  chunks.append(current)
              return chunks

          message_ids = []
          for chunk in split_message(text):
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              message_ids.append((result.get("result") or {}).get("message_id"))

          confirmed = {
              "status": "confirmed",
              "bot_username": username,
              "message_ids": message_ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/ai_networking_optics_watch_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"telegram_delivery_confirmed=true bot=@{username} message_ids={message_ids}")
          PY

      - name: Persist baseline or delivered state
        if: always()
        run: |
          if [ ! -f out/ai_networking_optics_watch_telegram.html ] || [ -f out/ai_networking_optics_watch_telegram_confirmed.json ]; then
            if [ -f out/ai_networking_optics_watch_pending_state.json ]; then
              cp out/ai_networking_optics_watch_pending_state.json data/ai_networking_optics_watch_state.json
            fi
          else
            echo "Telegram delivery was not confirmed; watcher state intentionally not advanced."
          fi

      - name: Record confirmed Telegram delivery in watcher state
        if: always() && hashFiles('data/ai_networking_optics_watch_state.json') != '' && hashFiles('out/ai_networking_optics_watch_telegram_confirmed.json') != ''
        run: |
          python - <<'PY'
          import json
          import pathlib

          state_path = pathlib.Path("data/ai_networking_optics_watch_state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          confirmed = json.loads(pathlib.Path("out/ai_networking_optics_watch_telegram_confirmed.json").read_text(encoding="utf-8"))
          state["last_successful_delivery_kst"] = confirmed.get("confirmed_at_kst")
          state["telegram_message_ids"] = confirmed.get("message_ids")
          state["bot_username"] = confirmed.get("bot_username")
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit watcher state
        if: always()
        run: |
          if [ ! -f data/ai_networking_optics_watch_state.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_networking_optics_watch_state.json
          if git diff --cached --quiet; then
            echo "AI networking optics state unchanged"
          else
            git commit -m "Update AI networking optics watch state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-networking-optics-watch-${{ github.run_id }}
          path: |
            out/ai_networking_optics_watch_status.md
            out/ai_networking_optics_watch_telegram.html
            out/ai_networking_optics_watch_pending_state.json
            out/ai_networking_optics_watch_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14