name: Telegram bot route identify

on:
  pull_request:
    paths:
      - ".github/workflows/telegram-bot-route-identify.yml"
      - "tests/telegram_bot_route_identify_trigger.txt"

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Identify configured Telegram bots
        env:
          KHS_BOT_TOKEN: ${{ secrets.KHS_POLICY_TELEGRAM_BOT_TOKEN }}
          KHS_CHAT_ID: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
          GENERAL_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GENERAL_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          def call(token, method, params=None):
              if not token:
                  return {"missing": True}
              url = f"https://api.telegram.org/bot{token}/{method}"
              data = None
              if params:
                  data = urllib.parse.urlencode(params).encode("utf-8")
              request = urllib.request.Request(url, data=data, method="POST" if data else "GET")
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          pairs = [
              ("KHS_POLICY", os.environ.get("KHS_BOT_TOKEN", "").strip(), os.environ.get("KHS_CHAT_ID", "").strip()),
              ("GENERAL", os.environ.get("GENERAL_BOT_TOKEN", "").strip(), os.environ.get("GENERAL_CHAT_ID", "").strip()),
          ]
          for label, token, chat_id in pairs:
              me = call(token, "getMe")
              username = ((me.get("result") or {}).get("username")) if me.get("ok") else None
              first_name = ((me.get("result") or {}).get("first_name")) if me.get("ok") else None
              print(f"route={label} configured={bool(token and chat_id)} bot_username={username or 'MISSING'} bot_name={first_name or 'MISSING'}")
          PY
