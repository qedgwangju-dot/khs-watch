name: BOK Asset Tokenization Telegram

on:
  push:
    paths:
      - ".github/workflows/bok-asset-tokenization-telegram.yml"
      - "scripts/bok_asset_tokenization_watch.py"
      - "data/bok_asset_tokenization_state.json"
  schedule:
    # GitHub cron is UTC. Hourly; if no new official item, Telegram remains silent.
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bok-asset-tokenization-telegram
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEW_EXPECTED_TELEGRAM_BOT_USERNAME: "khs88790088790000_bot"
      OLD_EXPECTED_TELEGRAM_BOT_USERNAME: "hs8879887988798879_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Validate Telegram route without sending
        env:
          NEW_TELEGRAM_BOT_TOKEN: ${{ secrets.BOK_ASSET_TELEGRAM_BOT_TOKEN }}
          OLD_TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          new_token = (os.getenv("NEW_TELEGRAM_BOT_TOKEN") or "").strip()
          old_token = (os.getenv("OLD_TELEGRAM_BOT_TOKEN") or "").strip()
          token = new_token or old_token
          expected = (
              (os.getenv("NEW_EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
              if new_token
              else (os.getenv("OLD_EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          )
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip()
          if not token:
              raise RuntimeError("Telegram bot token secret is missing")
          if not chat_id:
              raise RuntimeError("Telegram chat id secret is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")
          route = "new" if new_token else "legacy-fallback"
          print(f"telegram_route_valid=true route={route} bot=@{username}")
          PY

      - name: Check official asset-tokenization sources
        run: |
          python -m py_compile scripts/bok_asset_tokenization_watch.py
          python scripts/bok_asset_tokenization_watch.py

      - name: Publish watcher summary
        if: always()
        run: |
          if [ -f out/bok_asset_tokenization_status.md ]; then
            cat out/bok_asset_tokenization_status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "자산토큰화 Watch 상태 파일이 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send new official update to Telegram
        if: hashFiles('out/bok_asset_tokenization_alert.md') != ''
        env:
          NEW_TELEGRAM_BOT_TOKEN: ${{ secrets.BOK_ASSET_TELEGRAM_BOT_TOKEN }}
          OLD_TELEGRAM_BOT_TOKEN: ${{ secrets.YEN_CARRY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIMARY: ${{ secrets.YEN_CARRY_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_FALLBACK: ${{ secrets.KHS_POLICY_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          new_token = (os.getenv("NEW_TELEGRAM_BOT_TOKEN") or "").strip()
          old_token = (os.getenv("OLD_TELEGRAM_BOT_TOKEN") or "").strip()
          token = new_token or old_token
          expected = (
              (os.getenv("NEW_EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
              if new_token
              else (os.getenv("OLD_EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          )
          chat_id = (os.getenv("TELEGRAM_CHAT_ID_PRIMARY") or os.getenv("TELEGRAM_CHAT_ID_FALLBACK") or "").strip()
          if not token or not chat_id:
              raise RuntimeError("Telegram token/chat id is missing")
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok") or username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          text = pathlib.Path("out/bok_asset_tokenization_alert.md").read_text(encoding="utf-8").strip()
          def split_message(value, limit=3900):
              chunks, current = [], ""
              for paragraph in value.split("\n\n"):
                  candidate = paragraph if not current else current + "\n\n" + paragraph
                  if len(candidate) <= limit:
                      current = candidate
                      continue
                  if current:
                      chunks.append(current)
                      current = ""
                  while len(paragraph) > limit:
                      cut = paragraph.rfind("\n", 0, limit)
                      if cut < 1:
                          cut = limit
                      chunks.append(paragraph[:cut])
                      paragraph = paragraph[cut:].lstrip()
                  current = paragraph
              if current:
                  chunks.append(current)
              return chunks

          message_ids = []
          for idx, chunk in enumerate(split_message(text), 1):
              if idx > 1:
                  chunk = f"<b>한국은행 자산토큰화 Watch (계속 {idx})</b>\n\n{chunk}"
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=25) as r:
                  result = json.loads(r.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected message: {result}")
              message_ids.append(result.get("result", {}).get("message_id"))

          confirmed = {
              "status": "confirmed",
              "bot_username": username,
              "route": "new" if new_token else "legacy-fallback",
              "message_ids": message_ids,
              "confirmed_at_kst": dt.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
          }
          pathlib.Path("out/bok_asset_tokenization_telegram_confirmed.json").write_text(
              json.dumps(confirmed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"telegram_delivery_confirmed=true bot=@{username} message_ids={message_ids}")
          PY

      - name: Persist baseline state
        if: success() && hashFiles('out/bok_asset_tokenization_alert.md') == '' && (hashFiles('data/bok_asset_tokenization_state.json') == '' || hashFiles('out/bok_asset_tokenization_rebaseline.txt') != '')
        run: cp out/bok_asset_tokenization_pending_state.json data/bok_asset_tokenization_state.json

      - name: Persist state only after confirmed Telegram delivery
        if: success() && hashFiles('out/bok_asset_tokenization_alert.md') != '' && hashFiles('out/bok_asset_tokenization_telegram_confirmed.json') != ''
        run: |
          cp out/bok_asset_tokenization_pending_state.json data/bok_asset_tokenization_state.json
          python - <<'PY'
          import json, pathlib
          state_path = pathlib.Path("data/bok_asset_tokenization_state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          confirmed = json.loads(pathlib.Path("out/bok_asset_tokenization_telegram_confirmed.json").read_text(encoding="utf-8"))
          state["last_successful_delivery_kst"] = confirmed.get("confirmed_at_kst")
          state["telegram_message_ids"] = confirmed.get("message_ids")
          state["bot_username"] = confirmed.get("bot_username")
          state["telegram_route"] = confirmed.get("route")
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit watcher state
        if: success() && hashFiles('data/bok_asset_tokenization_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bok_asset_tokenization_state.json
          if git diff --cached --quiet; then
            echo "BOK asset tokenization state unchanged"
          else
            git commit -m "Record BOK asset tokenization watch state"
            git pull --rebase origin main
            git push
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bok-asset-tokenization-${{ github.run_id }}
          path: |
            out/bok_asset_tokenization_status.md
            out/bok_asset_tokenization_alert.md
            out/bok_asset_tokenization_pending_state.json
            out/bok_asset_tokenization_rebaseline.txt
            out/bok_asset_tokenization_telegram_confirmed.json
          if-no-files-found: ignore
          retention-days: 14
