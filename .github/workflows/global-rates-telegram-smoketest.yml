name: Global Rates Telegram Smoke Test

on:
  push:
    paths:
      - ".github/workflows/global-rates-telegram-smoketest.yml"
      - "data/global_rates_smoketest_trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "khs8879887988798879_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify secrets and send Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GLOBAL_RATES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_RATES_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import datetime as dt
          import html
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          token = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          expected = (os.getenv("EXPECTED_TELEGRAM_BOT_USERNAME") or "").strip().lstrip("@")
          if not token:
              raise RuntimeError("GLOBAL_RATES_TELEGRAM_BOT_TOKEN secret is missing")
          if not chat_id:
              raise RuntimeError("GLOBAL_RATES_TELEGRAM_CHAT_ID secret is missing")

          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=25) as r:
              identity = json.loads(r.read().decode("utf-8"))
          username = str((identity.get("result") or {}).get("username") or "")
          if not identity.get("ok"):
              raise RuntimeError("Telegram getMe failed")
          if username.lower() != expected.lower():
              raise RuntimeError(f"Wrong Telegram bot: expected @{expected}, got @{username or 'unknown'}")

          now = dt.datetime.now(ZoneInfo("Asia/Seoul"))
          jgb = "https://www.mof.go.jp/english/policy/jgbs/reference/interest_rate/jgbcme.csv"
          treasury = "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml"
          text = (
              "🟠 <b>엔캐리 복합 수급 알림 테스트</b>\n\n"
              "송출 경로와 출처 링크 형식을 확인하는 테스트입니다.\n"
              f"- 대상 봇: @{html.escape(username)}\n"
              f"- 테스트 시각: {now.strftime('%Y-%m-%d %H:%M:%S KST')}\n\n"
              "출처\n"
              f"- 일본 재무성 JGB — <a href=\"{html.escape(jgb, quote=True)}\">원문</a>\n"
              f"- 미국 재무부 — <a href=\"{html.escape(treasury, quote=True)}\">원문</a>\n"
          )

          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=25) as r:
              result = json.loads(r.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(f"Telegram rejected message: {result}")
          message_id = (result.get("result") or {}).get("message_id")
          marker = {
              "telegram_delivery_confirmed": True,
              "bot_username": username,
              "message_id": message_id,
              "confirmed_at_kst": now.isoformat(timespec="seconds"),
              "route_secret": "GLOBAL_RATES_TELEGRAM_*",
              "source_link_format": "HTML inline 원문 links",
          }
          pathlib.Path("data/global_rates_smoketest_result.json").write_text(
              json.dumps(marker, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"telegram_delivery_confirmed=true bot=@{username} message_id={message_id}")
          PY

      - name: Commit confirmation marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/global_rates_smoketest_result.json
          if git diff --cached --quiet; then
            echo "Smoke test marker unchanged"
          else
            git commit -m "Record KHS Telegram smoke test delivery"
            git pull --rebase origin main
            git push
          fi
