name: QLEX SC Bio Telegram Watch v2

on:
  schedule:
    # GitHub cron is UTC; hourly at :53 to avoid top-of-hour congestion and provide a visible heartbeat.
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a connection test message"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    paths:
      - ".github/workflows/qlex-sc-bio-telegram-watch-v2.yml"

permissions:
  contents: write

concurrency:
  group: qlex-sc-bio-telegram-watch-v2
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TELEGRAM_BOT_USERNAME: "hs887988798879887988798879_bot"
      BIO_TELEGRAM_BOT_TOKEN: ${{ secrets.BIO_TELEGRAM_BOT_TOKEN }}
      CONFIGURED_BIO_TELEGRAM_CHAT_ID: ${{ secrets.BIO_TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Telegram route
        id: telegram
        shell: bash
        run: |
          if [ -z "$BIO_TELEGRAM_BOT_TOKEN" ]; then
            echo "BIO_TELEGRAM_BOT_TOKEN missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python - <<'PY'
          import json, os, pathlib, urllib.request
          token=(os.environ.get('BIO_TELEGRAM_BOT_TOKEN') or '').strip()
          expected=(os.environ.get('EXPECTED_TELEGRAM_BOT_USERNAME') or '').strip().lstrip('@')
          chat_id=(os.environ.get('CONFIGURED_BIO_TELEGRAM_CHAT_ID') or '').strip()
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=25) as r:
              identity=json.loads(r.read().decode('utf-8'))
          actual=str((identity.get('result') or {}).get('username') or '')
          if not identity.get('ok') or actual.lower()!=expected.lower():
              raise RuntimeError(f'Wrong Telegram bot: expected @{expected}, got @{actual or "unknown"}')
          route='secret'
          if not chat_id:
              route='getUpdates'
              with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getUpdates?limit=100&timeout=0', timeout=25) as r:
                  updates=json.loads(r.read().decode('utf-8'))
              candidates=[]
              for upd in updates.get('result') or []:
                  msg=upd.get('message') or upd.get('edited_message') or {}
                  chat=msg.get('chat') or {}
                  if str(chat.get('type') or '') == 'private' and chat.get('id') is not None:
                      candidates.append((int(upd.get('update_id') or 0), str(chat['id'])))
              if candidates:
                  candidates.sort()
                  chat_id=candidates[-1][1]
          if not chat_id:
              raise RuntimeError('BIO_TELEGRAM_CHAT_ID is unavailable; refusing silent skip')
          out=pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as f:
              f.write(f'chat_id={chat_id}\n')
              f.write(f'bot_username={actual}\n')
              f.write(f'chat_route={route}\n')
              f.write('configured=true\n')
          print(f'bio_telegram_bot_verified=@{actual}')
          print(f'bio_telegram_chat_resolved=true route={route}')
          PY

      - name: Validate watcher
        run: python -m py_compile scripts/qlex_sc_conversion_watch.py scripts/qlex_telegram_send.py

      - name: Check for genuinely new QLEX data
        shell: bash
        run: |
          rm -f out/qlex_sc_conversion_alert.md out/qlex_sc_connection_test.md
          python scripts/qlex_sc_conversion_watch.py --mode check
          test -f out/qlex_sc_conversion_status.md && cat out/qlex_sc_conversion_status.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build manual connection test
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.send_test == 'true'
        run: |
          mkdir -p out
          cat > out/qlex_sc_connection_test.md <<'EOF'
          [바이오 감시] Telegram 연결 시험

          KEYTRUDA QLEX 피하주사(SC) 감시 연결 정상입니다.
          - 새 QLEX 매출·전환 데이터가 있을 때만 알림
          - 총판매액 기준 전환율과 환자 수 기준 점유율을 구분
          - Opdivo SC·Tecentriq SC는 동일 출시 후 개월(M+N) 기준 비교
          EOF

      - name: Build push healthcheck
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'QLEX v2 healthcheck')
        run: |
          mkdir -p out
          cat > out/qlex_sc_connection_test.md <<'EOF'
          [바이오 감시] QLEX 감시 복구 완료

          KEYTRUDA QLEX 피하주사(SC) 감시를 새 워크플로로 복구했습니다.
          - Telegram 봇·채팅 연결 정상
          - 중복 방지 v2 유지
          - 새 QLEX 매출·전환 데이터가 있을 때만 알림
          - 총판매액 기준 전환율과 환자 수 기준 점유율을 구분
          EOF

      - name: Send connection test
        if: hashFiles('out/qlex_sc_connection_test.md') != ''
        env:
          BIO_TELEGRAM_CHAT_ID: ${{ steps.telegram.outputs.chat_id }}
        run: python scripts/qlex_telegram_send.py out/qlex_sc_connection_test.md

      - name: Send new QLEX alert
        if: hashFiles('out/qlex_sc_conversion_alert.md') != ''
        env:
          BIO_TELEGRAM_CHAT_ID: ${{ steps.telegram.outputs.chat_id }}
        run: python scripts/qlex_telegram_send.py out/qlex_sc_conversion_alert.md

      - name: Persist state after successful check/delivery
        if: success() && hashFiles('out/qlex_sc_conversion_watch_state_pending.json') != ''
        run: cp out/qlex_sc_conversion_watch_state_pending.json data/qlex_sc_conversion_watch_state.json

      - name: Commit watch heartbeat/state
        if: success() && hashFiles('data/qlex_sc_conversion_watch_state.json') != ''
        run: |
          git config user.name "qlex-bio-watch[bot]"
          git config user.email "qlex-bio-watch[bot]@users.noreply.github.com"
          git add data/qlex_sc_conversion_watch_state.json
          if git diff --cached --quiet; then
            echo "QLEX bio watch state unchanged"
          else
            git commit -m "Update QLEX SC bio watch state"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qlex-sc-bio-watch-v2-${{ github.run_id }}
          path: |
            out/qlex_sc_conversion_status.md
            out/qlex_sc_conversion_alert.md
            out/qlex_sc_connection_test.md
            out/qlex_sc_conversion_errors.log
            out/qlex_sc_conversion_watch_state_pending.json
          if-no-files-found: ignore
          retention-days: 14
